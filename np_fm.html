指標。"}, "sources": ["Harrison 21e, Ch. Health Behavior Change & Tobacco Use", "國民健康署「我的餐盤」、二代戒菸服務、STAR戒菸計畫", "Prochaska TTM跨理論模式；Pender健康促進模式"]}}, "114-通論-5分科-34": {"quick": "BMI 29、已下載App每天做15分但週末常懶——屬TTM「行動期」。", "detail": {"background": "跨理論模式（TTM）以新行為是否已實際展開、持續多久來區分階段：前預備/懵懂期（無意圖）、預備/沉思期（猶豫、尚未行動）、行動期（已開始新行為但未滿六個月、仍需努力維持）、維持期（新行為穩定超過六個月）。本例李小姐已下載健身 App 並每天早上運動 15 分鐘（已實際採取行動），但週末常懶得動（行為尚未穩固、未滿六個月），最符合行動期（action stage），選 C。判讀關鍵：已經在做、但還不穩定且未滿半年＝行動期。", "options": {"A": "前思考期無改變意圖，不符(她已行動)。", "B": "(原題誤標contemplation為預備期)思考/準備期尚未實際行動，不符。", "C": "正解：已實際運動未滿6個月＝行動期。", "D": "維持期須逾6個月且穩定，不符。"}, "sources": ["Harrison 21e, Ch. Health Behavior Change & Tobacco Use", "國民健康署「我的餐盤」、二代戒菸服務、STAR戒菸計畫", "Prochaska TTM跨理論模式；Pender健康促進模式"]}}, "108b-TNPA-通論-17": {"quick": "專師可代開立者＝超音波檢查單＋藥物處方醫囑(23)。", "detail": {"background": "《專科護理師於醫師監督下執行醫療業務辦法》規範，專師在核定的預立醫療流程下，可代為開立部分醫囑/表單，但涉及法律責任、生死認定或醫師專屬權責者則不可。可代開立者包括：檢查/檢驗及影像醫囑（如超音波檢查單）、藥物處方醫囑、入院許可單、各類處置醫囑（如留置導尿）。不可代開立者包括：不施行心肺復甦術（DNR）同意書、死亡證明書、出院診斷證明書等。本題選項中超音波檢查單(2)＋藥物處方醫囑(3)屬可代開立，而 DNR 同意書(1)、出院診斷證明書(4)不可，故選 C（23）。", "options": {"A": "含1不施行CPR同意書(不可代開)。", "B": "含4出院診斷證明書(醫師專屬)。", "C": "正解：2超音波檢查單＋3藥物處方醫囑。", "D": "含4出院診斷證明書。"}, "sources": ["護理人員法(2023/6修正，增訂專科護理師業務)", "專科護理師於醫師監督下執行醫療業務辦法(2024修)", "醫療法、緊急醫療救護法、緊急傷病患轉診實施辦法"]}}, "109-通論-其他-2": {"quick": "麻醉衛教前確認個案知識/背景/認知/需求＝教學過程「評估(Assessment)」。", "detail": {"background": "病人教育過程(ADPIE/教學歷程)：評估(Assessment，了解起點能力、需求、背景、接收能力)→計畫(Plan，訂目標與方法)→執行(Do/Implement)→評價(Evaluation，成效)。衛教前先確認個案條件屬「評估」。　評估是教學歷程的第一步，先確認病人的起點能力與需求，才能訂定適切的學習目標與教學方法以提升衛教成效。", "options": {"A": "正解：衛教前確認個案條件＝評估。", "B": "計畫為訂目標方法。", "C": "執行為實施衛教。", "D": "評價為成效評值。"}, "sources": ["護理人員法(2023/6修正，增訂專科護理師業務)", "專科護理師於醫師監督下執行醫療業務辦法(2024修)", "醫療法、緊急醫療救護法、緊急傷病患轉診實施辦法"]}}, "109-通論-其他-3": {"quick": "專師執行業務「正確」者：預防保健之衛教不需在醫師監督下即可執行。", "detail": {"background": "護理人員法：護理師/專師之「護理本職業務」(健康問題護理評估、預防保健護理措施與衛教、護理指導及諮詢)屬自主業務，「不需」醫師監督；「醫療業務(侵入處置、開立醫囑等)」始須依辦法在醫師監督下執行。開立會診單屬醫療業務不可自主。　故護理本職業務可自主執行、不需醫師監督，唯醫療業務(如開立會診單、侵入處置)始須依辦法在醫師監督下執行。", "options": {"A": "身體健康評估屬護理自主，不需監督(敘述把它說成需監督)。", "B": "傷口照護「指導」屬護理自主，敘述為需監督亦不妥。", "C": "正解：預防保健衛教不需醫師監督。", "D": "開立會診單屬醫療業務，不可不經監督自主開立。"}, "sources": ["護理人員法(2023/6修正，增訂專科護理師業務)", "專科護理師於醫師監督下執行醫療業務辦法(2024修)", "醫療法、緊急醫療救護法、緊急傷病患轉診實施辦法"]}}, "109-通論-其他-52": {"quick": "醫院是否推行預立醫療流程「取決於醫院意願」(非強制)。", "detail": {"background": "「預立醫療流程」之建立屬醫療機構「自主決定」是否導入的管理制度(導入後才能由專師代開相關醫囑)，法律未強制所有醫院推行、亦無罰則。　專師執行醫療業務之預立醫療流程屬醫療機構內部管理制度，法律規定醫院得依需要建立並核定，導入後專師方能據以代開特定醫囑或表單；法律未強制所有醫院推行、亦無未推行之罰則，故由醫院依其人力與業務需求自主決定。", "options": {"A": "非教學醫院之強制責任。", "B": "無「未推行罰十萬」規定。", "C": "無五年過渡期強制規定。", "D": "正解：推行與否取決於醫院意願。"}, "sources": ["護理人員法(2023/6修正，增訂專科護理師業務)", "專科護理師於醫師監督下執行醫療業務辦法(2024修)", "醫療法、緊急醫療救護法、緊急傷病患轉診實施辦法"]}}, "109-通論-其他-54": {"quick": "專師依預立醫療流程執行後，監督醫師須於「24小時內」完成核簽。", "detail": {"background": "依《專科護理師於醫師監督下執行醫療業務辦法》，專師係在醫師監督下、依醫療機構核定之預立醫療流程執行業務；醫師的監督不以親自在場為必要，但須在事後完成核簽以確認醫療責任。法規明定：專師依預立醫療流程執行醫療業務後，監督醫師應於二十四小時內完成核簽（紙本或電子）。本題問核簽時限，故選 C（24 小時內）。此設計兼顧臨床即時性與醫療品質/責任歸屬，並非「毋庸核簽」或「下班前/出院前」之模糊時點。", "options": {"A": "非以下班前為準。", "B": "非以出院前為準。", "C": "正解：24小時內完成核簽。", "D": "仍須醫師核簽(非毋庸)。"}, "sources": ["護理人員法(2023/6修正，增訂專科護理師業務)", "專科護理師於醫師監督下執行醫療業務辦法(2024修)", "醫療法、緊急醫療救護法、緊急傷病患轉診實施辦法"]}}, "111-通論-5分科-80": {"quick": "自主性專師業務「錯誤」者：表層傷口的縫合(屬醫療業務，須醫師監督)。", "detail": {"background": "專師「自主性」業務：病歷紀錄、疾病與健康促進諮詢、健康評估、護理指導、參與照護成效評估等。「傷口縫合」屬侵入性醫療業務，須在醫師監督下依辦法執行，非自主業務。　專師的自主性護理業務包括病歷紀錄、疾病與健康促進諮詢、健康評估、護理指導、參與照護成效評估等；而傷口縫合屬侵入性醫療業務，須在醫師監督下依辦法所定流程與範圍執行，非專師可自主執行者，故C錯誤。", "options": {"A": "病歷紀錄屬自主。", "B": "健康促進諮詢屬自主。", "C": "正解(錯誤)：表層傷口縫合屬醫療業務需監督。", "D": "參與照護成效評估屬自主。"}, "sources": ["護理人員法(2023/6修正，增訂專科護理師業務)", "專科護理師於醫師監督下執行醫療業務辦法(2024修)", "醫療法、緊急醫療救護法、緊急傷病患轉診實施辦法"]}}, "112-通論-其他-25": {"quick": "不屬專師可代開立者：死亡證明書(醫師專屬)。", "detail": {"background": "依《專科護理師於醫師監督下執行醫療業務辦法》及核定之預立醫療流程，專師可代為開立的多為執行性、檢查性醫囑與表單：入院許可單、檢驗醫囑（實驗室及影像）、留置導尿等處置醫囑。但涉及法律與生死認定的文件屬醫師專屬，不得由專師代為開立——死亡證明書即為醫師專屬（須由醫師親自相驗/開立），此外 DNR 同意書、出院診斷證明書亦同。本題死亡證明書不屬專師可代開立之表單，選 C。", "options": {"A": "入院許可單可代開。", "B": "留置導尿處置醫囑可代開。", "C": "正解：死亡證明書醫師專屬，不可代開。", "D": "檢驗/影像醫囑可代開。"}, "sources": ["護理人員法(2023/6修正，增訂專科護理師業務)", "專科護理師於醫師監督下執行醫療業務辦法(2024修)", "醫療法、緊急醫療救護法、緊急傷病患轉診實施辦法"]}}, "112-通論-其他-27": {"quick": "作業小組規範「錯誤」者：僅需核備流程內容、無需訂標準作業程序。", "detail": {"background": "醫療機構若要由專師執行監督下醫療業務，須依《辦法》成立專科護理師作業小組（委員會），其組成與職責有明文：①召集人由副院長以上人員擔任、副召集人由醫療及護理部門主管擔任；②小組須核定預立特定醫療流程內容並訂定預立醫療流程之標準作業程序（SOP）、定期審視修改。本題 (A) 稱僅需核備流程內容、無需訂定標準作業程序與規定不符——流程內容與 SOP 兩者皆須訂定核定，故 (A) 錯誤，選 A。", "options": {"A": "正解(錯誤)：須訂SOP，非僅核備流程內容。", "B": "制定SOP並定期審修，正確。", "C": "副院長以上任召集人，正確。", "D": "醫護主管任副召集人，正確。"}, "sources": ["護理人員法(2023/6修正，增訂專科護理師業務)", "專科護理師於醫師監督下執行醫療業務辦法(2024修)", "醫療法、緊急醫療救護法、緊急傷病患轉診實施辦法"]}}, "112-通論-其他-4": {"quick": "最「具體」表達請求者：「我希望你每天可以下床走動2次」(可觀察可測量)。", "detail": {"background": "非暴力溝通/具體請求：請求應「具體、可觀察、可執行、可衡量」(明確行為與次數)，避免模糊抽象(多休息、放輕鬆、吃營養點、更有精神)。　非暴力溝通強調具體請求須是可觀察、可執行、可衡量的明確行為與次數，對方才知道要做什麼；「每天下床走動2次」明確可行，故最具體，而「多休息、放輕鬆、吃營養點、更有精神」皆為抽象模糊、難以衡量的表達。", "options": {"A": "正解：每天下床2次＝具體可測。", "B": "多休息/放輕鬆抽象。", "C": "吃營養點抽象。", "D": "更有精神抽象。"}, "sources": ["護理人員法(2023/6修正，增訂專科護理師業務)", "專科護理師於醫師監督下執行醫療業務辦法(2024修)", "醫療法、緊急醫療救護法、緊急傷病患轉診實施辦法"]}}, "113-通論-5分科-29": {"quick": "護理人員法下，專師與護理師最大差異：可「於醫師監督下執行醫療業務」。", "detail": {"background": "護理人員法明定護理師業務含健康問題護理評估、預防保健護理措施、護理指導及諮詢、醫療輔助行為；「專科護理師」之最大不同在於可「於醫師監督下執行醫療業務(辦法所定範圍)」。　《護理人員法》規定護理師業務含健康問題之護理評估、預防保健之護理措施、護理指導及諮詢與醫療輔助行為；而專科護理師的最大不同，在於可於醫師監督下依辦法所定範圍執行醫療業務，這是專師相較一般護理師的擴充職能。", "options": {"A": "護理評估護理師亦可。", "B": "護理指導諮詢護理師亦可。", "C": "預防保健護理師亦可。", "D": "正解：於醫師監督下執行醫療業務為專師特有。"}, "sources": ["護理人員法(2023/6修正，增訂專科護理師業務)", "專科護理師於醫師監督下執行醫療業務辦法(2024修)", "醫療法、緊急醫療救護法、緊急傷病患轉診實施辦法"]}}, "113-通論-5分科-77": {"quick": "預立醫療流程訂定內容應包括：病人症狀、病史及身體評估等情境或診斷。", "detail": {"background": "《專科護理師於醫師監督下執行醫療業務辦法》第七條規範預立醫療流程的訂定內容，須包括三大要素：①病人之症狀、病史及身體評估等情境或診斷（界定適用情境）；②監督醫師及其監督方式；③回報監督醫師病人狀況及處置結果的機制。本題問流程訂定應包括哪一項，(C)症狀、病史及身體評估等情境或診斷正屬第一要素，選 C。其餘訓練醫院監督方式、流行病學趨勢、監督醫師訓練標準均非流程訂定內容。", "options": {"A": "訓練醫院監督方式非流程訂定內容。", "B": "流行病學趨勢非流程內容。", "C": "正解：症狀/病史/身體評估等情境或診斷。", "D": "監督醫師特定訓練標準非此處規定內容。"}, "sources": ["護理人員法(2023/6修正，增訂專科護理師業務)", "專科護理師於醫師監督下執行醫療業務辦法(2024修)", "醫療法、緊急醫療救護法、緊急傷病患轉診實施辦法"]}}, "113-通論-家庭-21": {"quick": "居家護理所專師業務「錯誤」者：醫療業務由監督醫師同意即可、不需居家護理所核定。", "detail": {"background": "專師執登於居家護理所時，仍適用《辦法》：①該機構須成立專科護理師執行醫療業務委員會、由該所負責人擔任召集人(A 正確)；②可執行的醫療業務須經機構（委員會）核定預立醫療流程，並非僅監督醫師口頭同意即可；③監督醫師不需親自到所，可以傳真等方式完成簽署 (B 正確)；④執行業務時應配戴/顯示可識別身分之標誌 (D 正確)。本題 (C)業務由監督醫師同意即可、不需居家護理所核定與「須機構核定流程」不符，為錯誤敘述，選 C。", "options": {"A": "成立委員會由負責人召集，正確。", "B": "監督醫師可傳真簽署，正確。", "C": "正解(錯誤)：須機構核定，非僅監督醫師同意。", "D": "須配戴識別標誌，正確。"}, "sources": ["護理人員法(2023/6修正，增訂專科護理師業務)", "專科護理師於醫師監督下執行醫療業務辦法(2024修)", "醫療法、緊急醫療救護法、緊急傷病患轉診實施辦法"]}}, "113-通論-家庭-25": {"quick": "膀胱癌末期拒探視者，依「行善原則」為病人安全持續定時探視並加強支持。", "detail": {"background": "此情境涉自主(尊重拒訪)與行善/不傷害(末期合併造口、情緒低落有安全/自傷風險須關注)之權衡。考選部取「行善原則」——為病人安全與支持，仍應維持必要的定時探視與情緒支持(非完全不打擾)。臨床上會同理拒訪意願同時兼顧安全評估。　故為兼顧病人安全與情緒支持，仍應維持必要的定時探視並同理其拒訪意願，是行善原則與自主原則之間的權衡。", "options": {"A": "正解(官方)：依行善/安全，持續定時探視並支持。", "B": "完全不打擾忽略安全風險。", "C": "以規定為由探視非倫理依據。", "D": "末期拒談時強推SDM不適切。"}, "sources": ["護理人員法(2023/6修正，增訂專科護理師業務)", "專科護理師於醫師監督下執行醫療業務辦法(2024修)", "醫療法、緊急醫療救護法、緊急傷病患轉診實施辦法"]}}, "113-通論-家庭-28": {"quick": "溝通「最適當」者：清楚的溝通是臨床決策的基本條件。", "detail": {"background": "專業溝通原則：清楚有效的溝通是臨床決策與安全的基礎；「傾聽」與表達同等重要(甚至更重要)；應尊重病人/家屬偏好；倫理困境時應「正面溝通」而非迴避。　有效溝通是臨床決策與病人安全的基礎；其中傾聽與語言表達同等重要甚至更重要，能正確理解病人需求；應尊重病人與家屬的偏好與價值觀，遇倫理困境時更應正面開放地溝通協調，而非迴避衝突，故A最適當。", "options": {"A": "正解：清楚溝通是臨床決策基本條件。", "B": "傾聽與表達同等重要，非表達優先。", "C": "應尊重病人偏好，非專業意見優先。", "D": "倫理困境應正面溝通，非迴避。"}, "sources": ["護理人員法(2023/6修正，增訂專科護理師業務)", "專科護理師於醫師監督下執行醫療業務辦法(2024修)", "醫療法、緊急醫療救護法、緊急傷病患轉診實施辦法"]}}, "113-通論-家庭-77": {"quick": "專師辦法「正確」者：機構要由專師開醫囑表單，須先擬訂並核定預立醫療流程內容。", "detail": {"background": "此題考《辦法》的正確觀念。核心原則：醫療機構若要由專師開立相關醫囑/表單，必須先擬訂並由委員會核定預立醫療流程內容，專師方能據以執行，故 (B) 正確。逐項辨析：(A) 醫師監督不以親自在現場為必要（可遠端/事後核簽）；(C) 監督醫師核簽病歷的時限是24 小時內而非 48 小時；(D) 專師執行業務前的特定訓練內容，係由主管機關/辦法規範，而非僅由相關學會自訂。故選 B。", "options": {"A": "監督不以親自在場為必要。", "B": "正解：須先擬訂並核定預立醫療流程內容方可開立醫囑表單。", "C": "病歷簽核為24小時內，非48小時。", "D": "訓練內容由主管機關規範，非學會。"}, "sources": ["護理人員法(2023/6修正，增訂專科護理師業務)", "專科護理師於醫師監督下執行醫療業務辦法(2024修)", "醫療法、緊急醫療救護法、緊急傷病患轉診實施辦法"]}}, "113-通論-家庭-79": {"quick": "預立醫療流程訂定內容「不包括」者：症狀或疾病之流行病學趨勢。", "detail": {"background": "《辦法》第七條預立醫療流程的訂定內容有明確三項：①病人症狀、病史、身體評估及其他情境或診斷；②監督之醫師及其監督方式；③回報監督醫師病人狀況及處置結果。這三項界定了「在什麼臨床情境、由誰監督、如何回報」。本題問不包括哪一項——(C)症狀或疾病之流行病學趨勢屬學術/公衛資訊，並非預立醫療流程的訂定內容，故選 C。其餘 (A)(B)(D) 皆為法定應載明事項。", "options": {"A": "症狀/病史/身體評估等情境，含。", "B": "監督醫師及監督方式，含。", "C": "正解(不含)：流行病學趨勢非流程內容。", "D": "回報醫師病人狀況與處置結果，含。"}, "sources": ["護理人員法(2023/6修正，增訂專科護理師業務)", "專科護理師於醫師監督下執行醫療業務辦法(2024修)", "醫療法、緊急醫療救護法、緊急傷病患轉診實施辦法"]}}, "113-通論-家庭-9": {"quick": "護理人員法規範專師業務「錯誤」者：醫師助理角色。", "detail": {"background": "護理人員法之專師業務：健康問題護理評估、預防保健護理措施、護理指導與諮詢、(及於醫師監督下執行醫療業務)。專師非「醫師助理」(我國亦無正式醫師助理職類)，此敘述錯誤。　《護理人員法》明定專師業務為健康問題之護理評估、預防保健之護理措施、護理指導與諮詢，以及於醫師監督下執行醫療業務；專師是護理專業的進階角色，並非醫師助理，我國法規亦無正式醫師助理職類，故C錯誤。", "options": {"A": "護理評估屬業務。", "B": "預防保健屬業務。", "C": "正解(錯誤)：專師非醫師助理角色。", "D": "護理指導與諮詢屬業務。"}, "sources": ["護理人員法(2023/6修正，增訂專科護理師業務)", "專科護理師於醫師監督下執行醫療業務辦法(2024修)", "醫療法、緊急醫療救護法、緊急傷病患轉診實施辦法"]}}, "114-通論-5分科-1": {"quick": "專師職責「錯誤」者：開立安養機構病人之治療計畫與用藥醫囑。", "detail": {"background": "專師可協調擬定住院檢查/治療計畫、協助安寧家屬哀傷調適、提供社區心理衛生照護；但「開立治療計畫與用藥醫囑」屬醫療業務，須在醫師監督下依預立醫療流程為之，非專師「自行」開立。　專師可協調擬定住院檢查與治療計畫、協助安寧家屬面對失落哀傷、提供社區心理衛生照護；但開立治療計畫與用藥醫囑屬醫療業務，須在醫師監督下依核定之預立醫療流程為之，並非專師可自行開立，故C錯誤。", "options": {"A": "協調擬定住院檢查治療計畫，正確。", "B": "協助安寧家屬哀傷，正確。", "C": "正解(錯誤)：不可自行開立用藥醫囑(須醫師監督)。", "D": "社區心理衛生照護，正確。"}, "sources": ["護理人員法(2023/6修正，增訂專科護理師業務)", "專科護理師於醫師監督下執行醫療業務辦法(2024修)", "醫療法、緊急醫療救護法、緊急傷病患轉診實施辦法"]}}, "114-通論-5分科-28": {"quick": "家屬於病房推倒專師(職場暴力)，醫療機構應「立即通報警察並啟動保護關懷機制」。", "detail": {"background": "醫療法第24/106條：醫療機構執業場所應維護安全，對醫事人員遭受暴力者，機構「應」通報警察機關並提供保護與關懷，屬機構法定義務，不因當事人不追究而免除(妨害醫療秩序之公訴罪性質)。　依《醫療法》第24條妨害醫療秩序及相關規定，醫療機構執業場所遭受暴力時，機構應立即通報警察機關並啟動對醫事人員的保護與關懷機制；醫療暴力具公訴罪性質，此為機構法定義務，不因當事人不願追究而免除，更不應公布加害人個資，故D最適當。", "options": {"A": "公布加害人姓名特徵不當且侵權。", "B": "非以倫理小組決定是否通報。", "C": "不可因當事人不提告即不通報。", "D": "正解：立即通報警察並啟動保護關懷。"}, "sources": ["護理人員法(2023/6修正，增訂專科護理師業務)", "專科護理師於醫師監督下執行醫療業務辦法(2024修)", "醫療法、緊急醫療救護法、緊急傷病患轉診實施辦法"]}}, "114-通論-5分科-29": {"quick": "專師執業規範「錯誤」者：113新增家庭科專師「執業場域限社區、不得於醫院」。", "detail": {"background": "113年新增「家庭科」專師係拓展社區以人口群為基礎之照護角色，但「並未限制」其執業場域僅限社區(仍可於醫院執業)。其餘:執業範圍、需重新考我國證照、核心能力(進階藥理/病理/生理之分析判斷與臨床推理)皆正確。　故新增家庭科專師是拓展以社區人口群為基礎的照護角色，但並未限制其執業場域僅限社區，仍可於醫院執業。", "options": {"A": "執業範圍敘述正確。", "B": "正解(錯誤)：家庭科專師非限社區、仍可於醫院執業。", "C": "外國證照返國須重考我國證照，正確。", "D": "核心能力敘述正確。"}, "sources": ["護理人員法(2023/6修正，增訂專科護理師業務)", "專科護理師於醫師監督下執行醫療業務辦法(2024修)", "醫療法、緊急醫療救護法、緊急傷病患轉診實施辦法"]}}, "114-通論-5分科-77": {"quick": "最能展現監督下執業精神者：成立委員會核定預立醫療流程內容及SOP。", "detail": {"background": "《專科護理師於醫師監督下執行醫療業務辦法》的精神，在於以制度（而非個別授權或現場盯人）確保專師執業有法定依據與品質保障。最能展現此精神者，是醫療機構成立專科護理師執行醫療業務委員會，負責核定預立醫療流程內容及標準作業程序（SOP）(B 正確)。其餘選項違背法規：(A) 緊急時由資深專師自行決定業務範圍、事後口頭回報不符（範圍須事先核定、核簽須書面）；(C)所有侵入性業務須醫師親自在場過度（監督不以親自在場為必要）；(D)出院前完成記錄即可不符 24 小時核簽。故選 B。", "options": {"A": "不可自行決定範圍事後口頭回報。", "B": "正解：成立委員會核定流程內容與SOP。", "C": "監督不以醫師親自在場為必要。", "D": "須24小時內核簽，非出院前。"}, "sources": ["護理人員法(2023/6修正，增訂專科護理師業務)", "專科護理師於醫師監督下執行醫療業務辦法(2024修)", "醫療法、緊急醫療救護法、緊急傷病患轉診實施辦法"]}}, "114-通論-5分科-78": {"quick": "醫師監督定義「錯誤」者：急救時各種侵入性處置「不受此規範」。", "detail": {"background": "依民國 113 年修訂之《辦法》，醫師監督的內涵為：①醫師須事先參與並核定預立醫療流程內容(A 正確)；②醫療機構須定期審查流程內容及執行現況(B 正確)；③監督不以醫師親自在場為必要(D 正確，可採事前核定＋事後核簽的監督模式)。但 (C)急救時各種侵入性處置不受此規範錯誤——緊急救治仍須在法規與機構流程的框架下進行，並非完全不受監督規範約束，故選 C。", "options": {"A": "醫師事先核定流程，正確。", "B": "機構定期審查，正確。", "C": "正解(錯誤)：急救侵入處置非完全不受規範。", "D": "監督不以親自在場為必要，正確。"}, "sources": ["護理人員法(2023/6修正，增訂專科護理師業務)", "專科護理師於醫師監督下執行醫療業務辦法(2024修)", "醫療法、緊急醫療救護法、緊急傷病患轉診實施辦法"]}}, "114-通論-5分科-80": {"quick": "居家護理所專師業務「正確」者：執行預立醫療流程後監督醫師可傳真簽署。", "detail": {"background": "此題考專師於居家護理所執業的正確敘述。重點：監督醫師對居家專師的監督不以親自到所為必要，執行預立醫療流程後可以傳真等方式完成簽署(B 正確)。逐項辨析：(A) 委員會召集人由該所負責人擔任，不限定須具醫師背景；(C) 可執行的醫療業務須經機構核定預立醫療流程，非僅監督醫師同意即可；(D) 居家護理所負責人不以專科護理師為限（護理人員即可設立），並非須為專師才能督導。故選 B。", "options": {"A": "委員會由負責人召集，非限醫師背景。", "B": "正解：監督醫師可傳真簽署，不需親到居家護理所。", "C": "須機構核定，非僅監督醫師同意。", "D": "負責人不以專師為必要。"}, "sources": ["護理人員法(2023/6修正，增訂專科護理師業務)", "專科護理師於醫師監督下執行醫療業務辦法(2024修)", "醫療法、緊急醫療救護法、緊急傷病患轉診實施辦法"]}}, "106-106c-內科-44": {"quick": "自殺防治通報「錯誤」者：需當事人同意才可通報。", "detail": {"background": "自殺防治通報依精神衛生法/自殺防治法執行，採「不需當事人同意」之通報(以即時介入關懷救命為要)，通報資料由衛福部系統管理、直轄市縣市由社區心理衛生中心承辦自殺防治。　依《自殺防治法》與《精神衛生法》，自殺企圖或自我傷害事件採責任通報、不需當事人同意，由醫事與教育社政人員於時限內通報關懷系統以利即時介入；通報資料受保密保護，不得作為究責或歧視之用。", "options": {"A": "依精神衛生法執行，正確。", "B": "通報系統設於衛福部，正確。", "C": "正解(錯誤)：自殺通報不需當事人同意。", "D": "由社區心理衛生中心辦理，正確。"}, "sources": ["Harrison 21e, Ch. Global & Public Health", "精神衛生法、自殺防治法；緊急醫療救護法、緊急傷病患轉診實施辦法", "衛福部健康政策(健康台灣推動委員會)"]}}, "112-通論-其他-41": {"quick": "緊急傷病患轉診「正確」者：醫院辦轉診應先聯繫後送醫院，後送醫院不得拒絕。", "detail": {"background": "緊急傷病患轉診實施辦法：轉出醫院須先聯繫後送(接受)醫院、後送醫院「不得拒絕」接受轉診；轉診原因與風險須告知病人/親屬並記載病歷(不得省略)；穩定後轉回原院須經本人/親屬同意；救護運輸與人員由醫院安排(非病患自行指定)。　故後送醫院不得拒絕接受轉診、轉診原因與風險須告知並記載病歷，救護運輸與人員由醫院安排而非病患自行指定。", "options": {"A": "轉回原院須經同意，不可逕行。", "B": "正解：須先聯繫後送醫院，後送不得拒絕。", "C": "轉診原因須告知並記載，不可免載。", "D": "救護工具/人員由醫院安排，非病患自行指定。"}, "sources": ["Harrison 21e, Ch. Global & Public Health", "精神衛生法、自殺防治法；緊急醫療救護法、緊急傷病患轉診實施辦法", "衛福部健康政策(健康台灣推動委員會)"]}}, "114-通論-5分科-25": {"quick": "設備故障無法處置時，應先穩定處置、說明並取得書面同意、聯繫後送醫院轉診。", "detail": {"background": "緊急醫療救護法與轉診辦法：急救責任醫院無法提供必要處置時，應「先給予必要之穩定處置」，向病人/家屬說明轉診原因並取得書面同意，聯繫有能力之後送醫院後轉診；不得無穩定處置即轉、不得拒收後逕送、後送醫院亦不得任意拒收。　故無法提供必要處置時，應先給予穩定處置、向病人家屬說明並取得書面同意後再轉診，後送醫院亦不得任意拒收。", "options": {"A": "不可未告知/未取得同意即轉。", "B": "正解：先穩定處置＋說明取得書面同意＋聯繫後送轉診。", "C": "不可直接拒收要救護車自行送往。", "D": "後送醫院不得任意拒收。"}, "sources": ["Harrison 21e, Ch. Global & Public Health", "精神衛生法、自殺防治法；緊急醫療救護法、緊急傷病患轉診實施辦法", "衛福部健康政策(健康台灣推動委員會)"]}}, "114-通論-5分科-44": {"quick": "健康台灣推動委員會建言「不」包含：多元財務管道控制健保總額。", "detail": {"background": "2024年「健康台灣推動委員會」建言方向：改善醫事人員工作環境、長照3.0、健康台灣深耕計畫、強化預防與健康促進、智慧醫療等。「以多元財務管道控制健保總額」非其核心建言(政策方向偏向投資健康而非控管總額)。　故以多元財務管道控制健保總額並非其核心建言，政策方向偏向投資健康促進、長照3.0 與智慧醫療而非控管總額。", "options": {"A": "改善醫療人員工作環境，含。", "B": "長照3.0，含。", "C": "正解(不含)：控制健保總額非其建言。", "D": "健康台灣深耕計畫，含。"}, "sources": ["Harrison 21e, Ch. Global & Public Health", "精神衛生法、自殺防治法；緊急醫療救護法、緊急傷病患轉診實施辦法", "衛福部健康政策(健康台灣推動委員會)"]}}, "115-通論-麻醉-1": {"quick": "專科護理師不得自行開立藥物處方，須由醫師開立或依核可的預立醫療流程執行，故最不適當為 (A)。", "detail": {"background": "專科護理師於醫師監督下執行醫療業務辦法把可執行的業務限定在兩條路徑：一是醫師「當次特定醫療行為」的具體指示，二是醫療機構訂定並經核可的「預立醫療流程」。無論哪一條，「開立藥物處方」都必須由醫師為之，專師不得自行開立再事後補簽，這正是本題最不適當的敘述。其餘皆為正確理解：醫院若未訂定該項預立流程，專師就不得代為開立相關醫囑表單；辦法明列的可執行項目包含未及於肌肉及肌腱的表層傷口處置與縫合；專師依法在病歷製作紀錄並署名，其執業紀錄性質仍屬護理紀錄的一部分，並非取代醫師病歷。掌握這個架構就能處理絕大多數專師法規題。", "options": {"A": "正確（為本題最不適當者）。專師不得自行開立藥物處方再請醫師事後核簽。", "B": "醫院未訂定該項預立流程時，專師不得代為開立相關醫囑表單，敘述適當。", "C": "未及於肌肉及肌腱的表層傷口縫合屬可於監督下執行的項目，敘述適當。", "D": "專師於病歷製作紀錄並署名，其執業紀錄性質仍屬護理紀錄，敘述適當。"}, "sources": ["專科護理師於醫師監督下執行醫療業務辦法", "護理人員法"]}}, "115-通論-麻醉-2": {"quick": "醫師監督不限於親自在場，可採指示、指導或督促方式為之，故 (C)。", "detail": {"background": "辦法中「監督」的定義是這類題目的核心。它並不要求醫師必須全程親自在旁，而是指醫師對專科護理師執行醫療業務時「以指示、指導或督促的方式為之」，也就是醫師須明確知悉並負最終責任，但可透過事前的預立醫療流程、當次的具體醫囑，或即時的溝通聯繫來完成。這樣的設計是為了兼顧臨床可行性與病人安全：若要求醫師全程在病人床邊或同一病房，專師制度將失去分擔照護的意義；但若只允許電話監督，又無法涵蓋各種臨床情境。實務運作上，醫療機構須訂定監督的具體方式與範圍並留下紀錄，遇到病人狀況改變時專師應停止流程並立即回報，故選 C。", "options": {"A": "監督不要求醫師全程在病人床邊，此標準過嚴且不符辦法規定。", "B": "監督不以同一病房為必要條件。", "C": "正確。監督不限於親自在場，可採指示、指導或督促方式為之。", "D": "監督方式不限於電話，此敘述過度限縮。"}, "sources": ["專科護理師於醫師監督下執行醫療業務辦法"]}}, "115-通論-麻醉-3": {"quick": "預立醫療流程的核對、簽署與紀錄，護理機構得以資通訊或傳真方式為之，故 (C)。", "detail": {"background": "預立醫療流程的運作重點在於「事前訂定、事中執行、事後核簽」的完整性。辦法規定醫療機構應就特定項目訂定流程並經相關委員會核可，專師依流程執行後須有核對、簽署與紀錄；考量護理機構與居家等場域醫師未必在場，明定這些核對簽署與紀錄的程序「得以資通訊或傳真方式為之」，兼顧時效與可稽核性，這正是本題正確選項。其餘要一併釐清：所謂事後補簽並非「只要在一定時間內補簽就自動合法化」，執行前仍須有具體指示或核可流程為據；檢驗開立須在專師執業科別與流程範圍內，不能不分科別任意開立；高輻射劑量檢查並非一律禁止列入，而是須依機構規範與流程審慎訂定。", "options": {"A": "事後補簽名不能使原本欠缺依據的行為自動合法化。", "B": "檢驗開立須在執業科別與核可流程範圍內，不能不分科別任意開立。", "C": "正確。核對、簽署及紀錄，護理機構得以資通訊或傳真方式為之。", "D": "高輻射劑量檢查並非一律禁止列入，須依機構規範審慎訂定流程。"}, "sources": ["專科護理師於醫師監督下執行醫療業務辦法"]}}, "115-通論-麻醉-4": {"quick": "中央靜脈導管置放屬侵入性較高的醫療行為，不在專師得執行的範圍，故最不符合為 (D)。", "detail": {"background": "判斷某項處置是否落在專科護理師業務範圍，可用「侵入深度與風險」加上「是否列入辦法附表」兩個角度檢視。辦法允許的醫療業務多屬侵入性較低、風險可控且有明確流程可循者，例如全靜脈營養輸液的給予、鼻胃管置放、依流程安排檢查如上消化道內視鏡等。相對地，中央靜脈導管置放需穿刺大血管，可能造成氣胸、血胸、動脈誤穿與心律不整等嚴重併發症，屬侵入性較高的醫療行為，並不在專師得執行的項目之列，須由醫師執行。這類題目答題訣竅是先把選項依侵入性排序，最具風險的那一項通常就是答案，故選 D。", "options": {"A": "全靜脈營養輸液的開立與給予可依核可流程執行，符合規定。", "B": "鼻胃管置放屬侵入性較低的處置，在可執行範圍內。", "C": "依流程安排上消化道內視鏡檢查屬可執行的業務。", "D": "正確（為本題最不符合者）。中央靜脈導管置放侵入性高，不在專師執行範圍。"}, "sources": ["專科護理師於醫師監督下執行醫療業務辦法"]}}, "115-通論-麻醉-5": {"quick": "腹腔引流管置換屬侵入性處置，不是專師得執行的業務，故 (B)。", "detail": {"background": "本題的四個選項正好對應專科護理師業務的四個面向。第一是「評估與判讀」：查看腹腔引流液的量、顏色與性狀並判讀其臨床意義，是專師日常且明確在範圍內的工作。第二是「溝通與說明」：向家屬說明病況進展與照護計畫，屬專師核心角色。第三是「紀錄」：在病歷製作相關紀錄並署名，法有明文。第四則是「侵入性處置」：引流管的置換牽涉重新進入腹腔、有出血、感染與器官損傷風險，屬醫師應執行的醫療行為，不在專師業務範圍。因此當引流不順疑有阻塞時，專師應完成評估與紀錄並回報醫師處理，而非自行置換，故選 B。", "options": {"A": "判讀腹腔引流液的量與性狀屬專師的評估職責。", "B": "正確（為本題答案）。腹腔引流管置換屬侵入性處置，不在專師業務範圍。", "C": "向家屬說明病況是專師核心角色之一。", "D": "製作病歷相關紀錄並署名為法規明定的專師業務。"}, "sources": ["專科護理師於醫師監督下執行醫療業務辦法"]}}, "115-通論-麻醉-6": {"quick": "安寧諮詢應尊重病人與家屬的自主選擇，要求遵從醫囑並不適當，故 (A)。", "detail": {"background": "癌末病人的安寧緩和決策諮詢，本質是「協助當事人形成自己的選擇」，而不是說服對方接受既定答案。適當的態度有三個支柱：第一是坦誠，以病人能理解的語言說明病情、治療選項與可能結果，建立互相理解的基礎；第二是耐心，避免在短時間內施壓要求決定，因為接受末期事實需要時間，緊迫的溝通往往導致日後的決策後悔；第三是允許情緒，家屬在得知壞消息後常有否認、憤怒與哀傷，適時給予情緒宣洩的空間反而有助後續討論。相對地，「要求病人遵從醫囑以降低家屬決策困難」把醫療團隊的便利置於病人自主之上，違反安寧照護的核心價值，故最不適當為 A。", "options": {"A": "正確（為本題最不適當者）。要求病人遵從醫囑違反尊重自主的安寧照護核心價值。", "B": "以坦誠態度說明病情可增加互相理解，屬適當態度。", "C": "給予充分時間、避免緊迫溝通，可減少決策後悔。", "D": "評估時機給予家屬合理的情緒宣洩空間，有助後續討論。"}, "sources": ["安寧緩和醫療條例", "台灣安寧緩和醫學學會臨床指引"]}}, "115-通論-麻醉-7": {"quick": "專師的自主專業定位在於正確評估病人問題、擬定並追蹤個別化照護計畫，故 (D)。", "detail": {"background": "專科護理師的價值不在於「多做一些醫師的事」，而在於以進階護理知能承擔「臨床推理」的責任。這包含四個環節：系統性的評估與健康史採集、形成臨床判斷與鑑別診斷、擬定個別化的照護與治療計畫，以及持續追蹤成效並調整。這條路徑正是選項 D 的內容，也是專師與一般護理師、與行政職務最重要的區隔。相對地，僅依醫囑逐項執行護理技術是護理師的基本職責而非進階自主性；病房排班與耗材管理屬行政庶務，並非專業定位所在；而只協助安排檢查、轉達結果則把專師窄化為聯絡窗口，未展現獨立的評估與決策能力，故選 D。", "options": {"A": "依醫囑執行護理技術是基本職責，未展現進階的自主評估與決策。", "B": "排班與耗材管理屬行政庶務，非專師的專業定位。", "C": "僅協助安排檢查與轉達結果，把專師窄化為聯絡窗口。", "D": "正確。正確評估病人問題、擬定並追蹤個別化照護計畫，是專師的自主專業定位。"}, "sources": ["護理人員法", "台灣專科護理師學會核心能力"]}}, "115-通論-麻醉-8": {"quick": "執行醫療業務時應配戴或顯示足以識別身分的標誌，故 (D)。", "detail": {"background": "身分識別是病人安全與知情權的基本要求，也是醫療法與專師相關法規的明文規定：醫事人員執行業務時「應配戴或以其他方式顯示足以識別其身分的標誌」，讓病人與家屬清楚知道正在為自己提供照護的是誰、屬於什麼職類。這項義務有三個常見誤解需要破除：第一，持有執業執照與「當下是否可被辨識」是兩回事，有執照不代表可以不配戴識別證；第二，它適用於所有醫療業務的執行，並非只在侵入性處置時才需要；第三，這是法規明文要求，不是各機構可自行決定的內部規範。本例專師因更換制服而未配戴，應立即補戴並向家屬說明，故選 D。", "options": {"A": "有執業執照不等同於當下可被辨識，仍須配戴識別標誌。", "B": "識別標誌適用於所有醫療業務的執行，不限侵入性處置。", "C": "此為法規明文要求，並非各機構自行決定。", "D": "正確。執行醫療業務時應配戴或顯示足以識別其身分的標誌。"}, "sources": ["醫療法", "專科護理師於醫師監督下執行醫療業務辦法"]}}, "115-通論-麻醉-9": {"quick": "能表達對疾病自我管理的重視與正向態度，屬情意領域的學習目標，故 (D)。", "detail": {"background": "Bloom 的教學目標分類把學習分為三大領域，衛教設計時必須三者兼顧。「認知領域」處理知識與理解，例如病人能說出低血糖的症狀、能計算胰島素劑量；「技能（動作技能）領域」處理操作能力，例如病人能正確示範筆型胰島素的裝針、排氣、注射與部位輪替；「情意領域」處理態度、價值與意願，例如病人能表達對疾病自我管理的重視、願意規律監測血糖並主動求助，這正是本題描述的目標。三者對應的評量方式也不同：認知用問答與測驗、技能用回覆示教、情意則靠態度量表、行為改變與自述意願。至於社會領域並不屬於 Bloom 的三大分類，故選 D。", "options": {"A": "社會領域並非 Bloom 教學目標分類的三大領域之一。", "B": "認知領域指知識與理解，如能說出低血糖症狀。", "C": "技能領域指操作能力，如能正確示範注射步驟。", "D": "正確。表達重視與正向態度屬情意領域的學習目標。"}, "sources": ["Bloom's Taxonomy of Educational Objectives", "護理教育原理"]}}, "115-通論-麻醉-10": {"quick": "病人臨床狀況已改變，應停止執行預立流程並立即回報監督醫師，故 (D)。", "detail": {"background": "預立醫療流程的合法性建立在「執行時的臨床條件與流程訂定時一致」這個前提上。本例醫師交代的條件是引流量持續少於 50 mL 即可拔除胸管，下午評估時引流量 30 mL 雖符合數值條件，但病人「同時出現呼吸急促、血氧由 98% 降到 88%、並主訴胸痛」，這些新症狀提示可能有氣胸復發、肺栓塞或其他急性變化，代表臨床前提已不成立。此時繼續依流程拔管，可能使原本的問題急遽惡化。專師的正確判斷是「停止執行流程並立即回報監督醫師」，同時給氧、監測生命徵象並準備必要檢查。先拔管再回報、或找護理師共同執行以維持效率，都是把流程凌駕於病人安全之上，故選 D。", "options": {"A": "引流量雖符合數值，但新出現的症狀已使流程前提不成立。", "B": "先拔管再回報會使可能的急性變化惡化，順序錯誤。", "C": "與護理師共同評估並不能取代醫師對新症狀的判斷。", "D": "正確。臨床狀況已改變，應停止執行流程並立即回報監督醫師。"}, "sources": ["專科護理師於醫師監督下執行醫療業務辦法", "病人安全通報作業指引"]}}, "115-通論-麻醉-11": {"quick": "家屬意見分歧且病人無決策能力時，應主動召開家庭會議探求病人意願，故 (B)。", "detail": {"background": "當病人已無醫療決策能力，決策的依據有明確的順序：第一優先是病人「曾經表達的意願」，包括預立醫療決定、安寧緩和意願書或平時明確的口頭表示；其次才是由法定或適當的代理人依「病人最佳利益」判斷。本例小女兒轉述父親曾說過不要急救，這正是探求病人意願的重要線索，必須進一步釐清而非忽略。當家屬之間出現嚴重分歧時，醫療團隊不應被動等待家屬自行協調，也不宜逕自代為決定，最適當的做法是「主動安排家庭會議」，由醫療團隊提供清楚的病情與預後資訊、協助家屬聚焦在病人自己會怎麼選擇，必要時引入安寧共照或倫理諮詢。配偶意見亦非法定唯一依據，故選 B。", "options": {"A": "被動等待家屬自行協調會延誤決策，也未協助釐清病人意願。", "B": "正確。應主動安排家庭會議，由團隊與家屬共同探求病人可能的意願。", "C": "在未充分探求病人意願前即逕依最佳利益決定，順序不當。", "D": "配偶意見並非法定唯一依據，仍須以病人意願為優先。"}, "sources": ["病人自主權利法", "安寧緩和醫療條例"]}}, "115-通論-麻醉-12": {"quick": "以實證文獻與傷口評估紀錄與醫師討論，最符合正向尊重的雙向溝通，故 (C)。", "detail": {"background": "跨專業意見分歧時，溝通品質決定病人是否得到最好的照護。正向、尊重且雙向的溝通有三個要件：以「客觀資料」而非個人偏好為基礎、以「病人利益」而非誰對誰錯為焦點、以及保持開放願意被說服。因此提出相關實證文獻與自己實際的傷口評估紀錄，邀請醫師一起檢視並共同決定，是最符合原則的做法，既展現專業自主，也維護團隊關係。相對地，完全順從只為避免尷尬，等於放棄專業判斷與病人權益；私下鼓勵病人去向醫師施壓，是繞過團隊的迂迴操作，會破壞信任；把兩種方式丟給病人自行決定，則是把專業判斷責任轉嫁給缺乏專業知識的病人，故選 C。", "options": {"A": "完全順從以避免尷尬，等於放棄專業判斷與病人權益。", "B": "私下鼓勵病人向醫師施壓屬繞過團隊的迂迴操作，破壞信任。", "C": "正確。以實證文獻與傷口評估紀錄和醫師討論，符合正向尊重的雙向溝通。", "D": "把專業判斷責任轉嫁給缺乏專業知識的病人並不恰當。"}, "sources": ["TeamSTEPPS 溝通架構", "醫療團隊合作與病人安全指引"]}}, "115-通論-麻醉-13": {"quick": "針對識字能力較低的高齡個案教導吸入器操作，最有效的是回覆示教法，故 (C)。", "detail": {"background": "衛教方法要同時對應「學習目標的領域」與「學習者的特性」。吸入器操作屬技能領域，必須經由實作才能習得；而學習者是識字能力較低的高齡者，仰賴文字或單向講述的方法效果都很有限。回覆示教法（teach-back 與 return demonstration）的流程是衛教者先示範、學習者實際操作、衛教者即時回饋並修正，直到能完整正確完成；它同時解決了三個問題：不依賴文字、提供立即回饋、並可客觀確認學習成效，因此是此情境的最佳選擇。相對地，團體口頭講述缺乏個別回饋，影音光碟仍屬單向且高齡者可能操作困難，把文字放大只改善可讀性卻無助於動作技能的建立，故選 C。", "options": {"A": "團體口頭講述缺乏個別回饋，難以確認操作是否正確。", "B": "影音光碟屬單向學習，無法即時修正錯誤動作。", "C": "正確。回覆示教法可實作、即時回饋並客觀確認學習成效。", "D": "放大文字只改善可讀性，無助於建立動作技能。"}, "sources": ["Health Literacy Universal Precautions Toolkit", "GOLD 2025 Report"]}}, "115-通論-麻醉-14": {"quick": "研究所學分等進修課程的積分採計有上限，不能完全折抵，故錯誤為 (A)。", "detail": {"background": "專科護理師分科及甄審辦法規定，專師須於每 6 年內完成一定積分的繼續教育，並依「專業、品質、醫事倫理、醫事法規」四類分別採計，其中感染管制及性別議題等課程另有應達點數的規定。積分來源包括學術研討會、專業課程、進修學分與發表論文等，但各類來源都設有「採計上限」，研究所學分或各類進修課程僅能在上限內折抵，不能無限制地完全取代繼續教育要求，這正是本題錯誤的敘述。另一個常考重點是專師的繼續教育與一般護理人員的繼續教育分屬不同制度，一般護理師的課程積分不能直接充作專師的積分，必須是經認可、屬專師執業範疇的課程才予採計，故錯誤為 A。", "options": {"A": "正確（為本題錯誤敘述）。各類進修課程的積分採計設有上限，不能完全折抵。", "B": "一般護理師的繼續教育積分不能直接抵充專師課程積分，敘述正確。", "C": "感染控制及性別議題課程積分有應達點數的規定，敘述正確。", "D": "繼續教育包括專業、品質、醫事倫理與醫事法規四類，敘述正確。"}, "sources": ["專科護理師分科及甄審辦法", "醫事人員執業登記及繼續教育辦法"]}}, "115-通論-麻醉-15": {"quick": "專師得於醫師監督下執行護理業務以外的部分醫療業務，故 (D)。", "detail": {"background": "護理人員法把護理人員的業務分為四類：健康問題的護理評估、預防保健、護理指導與諮詢，以及「醫療輔助行為」，前三者是護理人員得依專業自行判斷執行的獨立業務，只有醫療輔助行為須在醫師指示下為之。專科護理師則在此基礎上多了一層授權：依護理人員法及其授權訂定的辦法，專師「得於醫師監督下執行專屬醫療業務」，也就是原屬醫師業務範圍中經明列的部分項目，這正是專師制度的法律核心，故 D 正確。要澄清的三個誤解是：護理指導及諮詢屬護理人員自主業務，不需醫師同意；進階護理人員從事醫療輔助行為同樣需要醫師指示；專師制度並非讓醫院把專師當醫師排班值班、獨立執行醫師業務。", "options": {"A": "護理指導及諮詢屬護理人員的獨立業務，不需醫師同意。", "B": "醫療輔助行為無論一般或進階護理人員，皆需醫師指示。", "C": "專師不得比照醫師排班值班獨立執行醫師業務。", "D": "正確。專師得於醫師監督下執行護理業務以外的部分醫療業務。"}, "sources": ["護理人員法", "專科護理師於醫師監督下執行醫療業務辦法"]}}, "115-通論-麻醉-16": {"quick": "全程雙盲隨機分派屬臨床試驗設計，不是健康教育方案規劃的步驟，故 (A)。", "detail": {"background": "健康教育方案的規劃有一套標準架構，可用 PRECEDE-PROCEED 模式理解，核心是四個步驟。第一是「需求評估」：先調查目標族群的問題與影響因素，例如本例先了解長者的跌倒經驗與居家環境風險，據以排定優先介入項目。第二是「理論依據」：以健康信念模式、社會認知理論或跨理論模式等作為課程設計基礎，讓介入手段對準真正的行為決定因素。第三是「執行」：依規劃辦理課程與活動。第四是「成效評價」：測量結果指標如跌倒發生率與自我防跌行為的改變。至於雙盲隨機分派是臨床試驗降低偏差的設計，在社區衛教方案中既不可行也非規劃架構的內容，故選 A。", "options": {"A": "正確（為本題答案）。雙盲隨機分派屬臨床試驗設計，非健康教育方案的規劃步驟。", "B": "以健康教育理論作為課程設計依據，是規劃架構的一環。", "C": "開辦前進行需求評估並排定優先問題，是規劃的第一步。", "D": "方案結束後測量成效指標，屬評價階段的必要步驟。"}, "sources": ["PRECEDE-PROCEED Model", "健康促進理論與實務"]}}, "115-通論-麻醉-17": {"quick": "面對情緒激動的抱怨，最優先是專注傾聽對方在意與擔憂之處，故 (B)。", "detail": {"background": "處理醫療抱怨的溝通有明確的順序，急著解決問題往往比不上先處理情緒。第一步是「傾聽」：讓對方把話說完、不打斷、以點頭與簡短回應表示專注，這個動作本身就能降低對方的激動程度，同時也是蒐集真正訴求的唯一途徑，因為情緒背後常有未被說出的擔憂，例如害怕病情惡化或覺得親人被忽視。第二步是「同理與確認」：把聽到的重點回述，確認自己理解正確。第三步才是說明與共同尋找解決方案。相對地，立即承諾可能做不到的要求會埋下更大的衝突；直接詢問期望的解決方式跳過了情緒處理；提醒爭執無助改善則帶有指責意味，會使對立升高，故選 B。", "options": {"A": "立即承諾可能做不到的要求，會埋下更大的衝突。", "B": "正確。最優先是專注傾聽對方在意與擔憂之處。", "C": "直接詢問期望的解決方式跳過了情緒處理，時機過早。", "D": "提醒爭執無助改善帶有指責意味，會使對立升高。"}, "sources": ["醫病溝通與醫療爭議處理實務", "醫療事故預防及爭議處理法"]}}, "115-通論-麻醉-18": {"quick": "教學過程中隨時觀察並調整教法屬形成性評量，並無確定性評量此一分類，故錯誤為 (D)。", "detail": {"background": "教學評量依「時機與目的」分為四類，必須成組記憶。「安置性評量」在教學前實施，目的是了解學習者的起點行為與既有知識，據以決定教學起點，例如衛教前先測試病人對高血壓藥物的既有認識。「形成性評量」在教學進行中實施，目的是即時掌握理解程度並「隨時調整教法」，本題選項 D 描述的正是形成性評量，卻誤稱為確定性評量，而教育評量分類中並無確定性評量此一名詞。「診斷性評量」針對反覆出現的學習困難深入探究原因，例如反覆記錯劑量的病人。「總結性評量」在教學結束後實施，用以判定是否達成學習目標，例如衛教後測驗能否正確說出服藥時間，故錯誤為 D。", "options": {"A": "衛教結束後測驗是否達成目標，屬總結性評量，敘述正確。", "B": "衛教前測試既有認識以決定教學起點，屬安置性評量，敘述正確。", "C": "針對反覆學習困難探究原因，屬診斷性評量，敘述正確。", "D": "正確（為本題錯誤敘述）。教學中隨時觀察並調整教法屬形成性評量，無確定性評量此分類。"}, "sources": ["教育評量原理", "護理教育學"]}}, "115-通論-麻醉-19": {"quick": "兩側肺底爆裂音並懷疑急性肺水腫，屬 SBAR 中的評估，故 (C)。", "detail": {"background": "SBAR 是標準化的交班與求助溝通工具，四個欄位各有明確內容。S 代表現況（Situation），一句話說明「我是誰、病人是誰、現在發生什麼」，例如目前呼吸 30 次/分並發燒 39°C 等當下的客觀事實。B 代表背景（Background），提供理解問題所需的脈絡，例如昨天從急診入院、有慢性阻塞性肺疾病病史。A 代表評估（Assessment），是溝通者「自己的專業判斷」，把資料統整成一個臨床印象，例如兩側肺底聽到明顯爆裂音、懷疑急性肺水腫，這正是本題答案。R 代表建議（Recommendation），提出具體希望對方採取的行動，例如請立即來看病人並開立胸部 X 光與動脈血液氣體分析，故選 C。", "options": {"A": "呼吸速率與體溫等當下客觀數據屬現況（S）。", "B": "入院時間與過去病史屬背景（B）。", "C": "正確。整合聽診發現並提出懷疑急性肺水腫的判斷，屬評估（A）。", "D": "請醫師來看病人並開立檢查，屬建議（R）。"}, "sources": ["TeamSTEPPS SBAR", "病人安全通報與溝通指引"]}}, "115-通論-麻醉-20": {"quick": "先反映家屬的焦慮情緒再討論治療計畫，最符合同理心與溝通協調，故 (B)。", "detail": {"background": "同理心回應的結構可以拆成兩個動作：先「命名並反映對方的情緒」，再「連結到具體可討論的內容」。本例家屬情緒激動地質疑治療是否有效，背後真正的情緒是對母親持續發燒的焦慮與失控感。選項 B 先說出「聽起來您對媽媽持續發燒感到焦慮」完成情緒反映，再提出「我們來討論目前的治療計畫與預期狀況」把對話導向具體資訊，同時給予家屬參與感，是最完整的同理與協調。相對地，直接解釋病理機轉並要求耐心，跳過了情緒；勸對方不要激動並要求相信專業，帶有否定情緒與權威色彩；表示不太能理解對方的不滿，則直接傳達了拒絕與距離感，故選 B。", "options": {"A": "直接解釋機轉並要求耐心，跳過了情緒反映這一步。", "B": "正確。先反映家屬的焦慮情緒，再討論治療計畫與預期狀況。", "C": "勸對方不要激動並要求相信專業，帶有否定情緒的權威色彩。", "D": "表示不太能理解對方的不滿，直接傳達拒絕與距離感。"}, "sources": ["NURSE 同理回應技巧", "醫病溝通實務"]}}, "115-通論-麻醉-21": {"quick": "把對權威對象的憤怒轉移到較安全的對象身上，屬替代作用，故 (B)。", "detail": {"background": "心理防衛機轉的辨識靠「情緒從哪裡來、跑到哪裡去」。替代作用（displacement）是把對某個對象的情緒，轉移到另一個「較不具威脅性」的對象身上，本例病人不敢對剛宣告壞消息的權威醫師表達憤怒，轉而對進房的專師發脾氣、抱怨冷氣與護理人員，正是典型的替代作用。要對照區分的三個機轉：投射作用是把「自己」不能接受的想法或衝動歸咎到別人身上，例如自己厭惡對方卻堅稱是對方討厭自己；反向作用是表現出與真實感受完全相反的行為，例如內心敵意卻表現得過度殷勤；合理化則是為難以接受的事實找一個聽起來合理的解釋。理解其為心理防衛而非針對個人，有助專師不被激怒並維持治療性關係，故選 B。", "options": {"A": "投射作用是把自己不能接受的想法歸咎於他人。", "B": "正確。把對醫師的憤怒轉移到較安全的專師身上，屬替代作用。", "C": "反向作用是表現出與真實感受相反的行為。", "D": "合理化是為難以接受的事實找看似合理的解釋。"}, "sources": ["Kaplan and Sadock's Synopsis of Psychiatry", "護理心理學"]}}, "115-通論-麻醉-22": {"quick": "菸害防制法修正草案增訂違法類菸品的沒入銷毀規定，故 (C)。", "detail": {"background": "我國菸害防制法於民國 112 年大幅修正，對電子煙等「類菸品」採取全面禁止的立場：類菸品的製造、輸入、販賣、供應、展示與廣告一律禁止，加熱菸則須經健康風險評估審查通過後才得販售。罰則設計上，未滿 20 歲者使用受罰較輕並以戒菸教育為主，成年人違法製造販賣的罰則遠高於使用者，因此不會出現未成年罰得比成年人更重的情形。無償供應同樣在禁止之列，不能因為沒有收費就免責。網際網路的部分，法規要求平台業者對違法菸品與類菸品資訊負有移除與管理責任。至於後續修正草案的方向，包括增訂查獲違法類菸品後的沒入並銷毀規定以強化執法，故選 C。", "options": {"A": "未滿 20 歲者以戒菸教育為主且罰則較輕，不會高於成年人。", "B": "無償供應類菸品同樣在禁止與處罰之列。", "C": "正確。修正草案增訂違法類菸品的沒入銷毀規定以強化執法。", "D": "網際網路業者對違法類菸品資訊負有移除與管理責任。"}, "sources": ["菸害防制法", "國民健康署菸害防制業務資料"]}}, "115-通論-麻醉-23": {"quick": "用藥整合的第一步是請長者攜帶所有藥品與保健品進行棕色藥袋檢視，故 (A)。", "detail": {"background": "長者健康整合式評估發現認知功能異常且自述常忘記服藥時，用藥整合的標準做法是棕色藥袋檢視：請長者把醫院處方藥、自行購買的成藥、中草藥與營養補充品全部帶來逐項清點。這一步不可省略，因為多重用藥的風險常來自不同院所重複開立、以及未被醫師知悉的成藥與中藥交互作用，只看單一份處方箋無法發現問題。同時要運用適當的衛教技巧：面對認知功能異常者應分段說明並以回覆示教確認，而不是一次講完再問懂不懂，也不是直接繞過長者交由家屬管理而剝奪其參與。詢問是否都清楚屬封閉式問題，多數長者會回答清楚而無法驗證理解，故選 A。", "options": {"A": "正確。請長者攜帶所有處方藥、成藥、中藥與補充品進行檢視，是用藥整合第一步。", "B": "直接交由家屬管理會剝奪長者參與，且未解決重複用藥問題。", "C": "封閉式詢問是否清楚無法驗證理解，應以回覆示教確認。", "D": "一次講完全部資訊不利認知功能異常者吸收，應分段說明。"}, "sources": ["WHO ICOPE Guidance", "國民健康署長者健康整合式評估手冊"]}}, "115-通論-麻醉-24": {"quick": "長照 3.0 整合居家醫療與長照的核心策略是建立在宅責任醫師照顧網絡，故 (A)。", "detail": {"background": "長期照顧十年計畫 3.0 的核心願景是在地安老與安寧善終，並針對過去醫療與長照兩套系統各自運作、個案在兩邊重複評估卻仍銜接不上的問題提出解方。整併健保居家醫療照護整合計畫與長照居家失能個案家庭醫師照護方案的關鍵策略，就是建立在宅責任醫師照顧網絡：由固定的醫師團隊承擔社區內失能與居家個案的醫療責任，向前銜接急性後期照護、向後連結長照服務與居家安寧，使個案在同一團隊的連續照護下留在家中。要澄清的是遠距醫療是輔助而非取代實地訪視；急性後期整合照護有明確的疾病與功能條件，並非不分年齡全面推動；居家醫療團隊也不會改編為共生社區據點的專職人員，故選 A。", "options": {"A": "正確。建立在宅責任醫師照顧網絡以強化醫療與長照服務的銜接。", "B": "遠距醫療是輔助工具，不能取代居家醫師的實地訪視。", "C": "急性後期整合照護有明確疾病與功能條件，並非不分年齡全面推動。", "D": "居家醫療團隊並未改編為共生社區據點的專職人員。"}, "sources": ["長期照顧十年計畫 3.0", "健保居家醫療照護整合計畫"]}}, "115-通論-麻醉-25": {"quick": "意願人得隨時以書面撤回或變更預立醫療決定，並更新健保憑證註記，故 (C)。", "detail": {"background": "病人自主權利法的運作有幾個關鍵環節。啟動要件方面，病人是否符合末期病人、不可逆轉昏迷、永久植物人、極重度失智或其他經公告的特定臨床條件，必須由兩位具相關專科資格的醫師確診並經緩和醫療團隊至少兩次照會確認，不是原主治醫師一人依經驗判定。效力方面，合法生效的預立醫療決定具法律拘束力，醫療團隊應予尊重執行，家屬反對不能推翻病人本人的意願，這正是本法保障自主的核心。撤回與變更方面，意願人只要仍有意思能力，得隨時以書面撤回或變更，並應更新健保憑證的註記以確保各醫療院所都能讀取到最新版本。醫療委任代理人是在意願人失去意思能力後代為表達意願，無權在其健康時逕自修改內容，故選 C。", "options": {"A": "啟動須由兩位專科醫師確診並經緩和醫療團隊兩次照會，非單一醫師判定。", "B": "合法生效的預立醫療決定具法律拘束力，家屬反對不能推翻病人意願。", "C": "正確。意願人得隨時以書面撤回或變更，並更新健保憑證註記。", "D": "醫療委任代理人是在意願人失去意思能力後代為表達，無權逕自修改內容。"}, "sources": ["病人自主權利法及其施行細則"]}}, "115-通論-麻醉-26": {"quick": "15 歲未成年懷孕屬應通報案件，醫事人員應於 24 小時內完成責任通報，故 (B)。", "detail": {"background": "本題把兩個法律議題疊在一起。第一是責任通報：15 歲未成年懷孕，依兒童及少年福利與權益保障法與性侵害犯罪防治法，醫事人員屬責任通報人員，知悉後至遲不得超過 24 小時向主管機關通報，這項義務不因病人要求保密而免除，也是本題答案。要向少女說明的是通報的目的在於提供保護與資源，而非懲罰。第二是人工流產的同意權：依優生保健法，未成年人施行人工流產應得法定代理人的同意，不能因為具意思能力就自行簽署，醫療機構也無權代為簽署；伴侶共同簽署更不能取代法定代理人同意。故選 B。", "options": {"A": "未成年人施行人工流產應得法定代理人同意，不能自行簽署。", "B": "正確。醫事人員應於知悉後 24 小時內完成責任通報。", "C": "醫療機構無權代為簽署人工流產同意書。", "D": "伴侶共同簽署不能取代法定代理人的同意。"}, "sources": ["優生保健法", "兒童及少年福利與權益保障法"]}}, "115-通論-麻醉-27": {"quick": "55 歲已停經女性符合每年 1 次子宮頸抹片檢查的公費補助，故 (A)。", "detail": {"background": "國民健康署現行公費癌症篩檢的條件必須逐項對號入座。子宮頸抹片為 30 歲以上女性每年補助 1 次，本例 55 歲女性符合，故 A 正確；停經並不影響資格，只要曾有性行為就建議持續篩檢。糞便潛血檢查為 45 至 74 歲以及 40 至 44 歲有家族史者，每 2 年 1 次而非每年。乳房 X 光攝影為 45 至 69 歲以及 40 至 44 歲有家族史者，每 2 年 1 次而非每年。低劑量電腦斷層肺癌篩檢則限定重度吸菸者與具肺癌家族史者，本例不吸菸且無家族史並不符合，故選 A。", "options": {"A": "正確。30 歲以上女性每年補助 1 次子宮頸抹片檢查。", "B": "糞便潛血檢查為 45 至 74 歲每 2 年 1 次，非每年。", "C": "乳房 X 光攝影為 45 至 69 歲每 2 年 1 次，非每年。", "D": "低劑量電腦斷層限重度吸菸者或具肺癌家族史者，本例不符合。"}, "sources": ["國民健康署公費癌症篩檢服務條件"]}}, "115-通論-麻醉-28": {"quick": "未經調解而逕行提起醫療爭議民事訴訟者，法院應移付調解會先行調解，故 (B)。", "detail": {"background": "醫療事故預防及爭議處理法建立了三個支柱。第一是說明、溝通與關懷：醫療事故發生後，機構應於 2 個工作日內向病人或家屬說明並提供關懷服務，這項義務不因醫師自認無疏失而免除，關懷小組的說明與協助也不得作為訴訟中不利的證據，目的正是鼓勵及早溝通。第二是調解先行：醫療爭議的民事訴訟與刑事偵查採強制調解，未先申請調解而逕行起訴者，法院應移付所在地的醫療爭議調解會先行調解，這是本題答案。第三是病歷取得權：病人有權申請病歷複製本，醫事機構不得以訴訟為由拒絕提供，故選 B。", "options": {"A": "病人有權申請病歷複製本，醫事機構不得以訴訟為由拒絕提供。", "B": "正確。未經調解逕行提起醫療爭議民事訴訟者，法院應移付調解會先行調解。", "C": "應於事故後 2 個工作日內說明並提供關懷，非 1 個月內。", "D": "說明、溝通與關懷義務不因醫師自認無疏失而免除。"}, "sources": ["醫療事故預防及爭議處理法"]}}, "115-通論-麻醉-29": {"quick": "急診檢傷分類基準由衛生福利部公告，故 (D)。", "detail": {"background": "急診檢傷分類的制度設計是常考的行政法規題。我國自 99 年起全面實施台灣急診檢傷與急迫度分級量表，把急診病人依病情急迫程度分為五級：第一級復甦急救、第二級危急、第三級緊急、第四級次緊急、第五級非緊急，並依此決定看診順序與可容忍等候時間，而非依到達先後。它的法源與公告機關是衛生福利部，屬中央衛生主管機關依醫療法授權訂定並公告的基準，各急救責任醫院應依此執行並列入醫院評鑑。要區分的是：台灣急診醫學會是專業學會，參與制度規劃但非公告機關；中央健康保險署負責醫療費用支付；內政部消防署主管的是到院前救護與救護技術員的分級，故選 D。", "options": {"A": "台灣急診醫學會為專業學會，參與規劃但非公告機關。", "B": "中央健康保險署負責醫療費用支付事務。", "C": "內政部消防署主管到院前救護，非急診檢傷基準的公告機關。", "D": "正確。急診檢傷分類基準由衛生福利部公告。"}, "sources": ["醫療機構設置標準", "台灣急診檢傷與急迫度分級量表"]}}, "115-通論-麻醉-30": {"quick": "合理懷疑老人受虐時，責任通報人員應於 24 小時內通報，故 (B)。", "detail": {"background": "老人福利法規定醫事人員、社工人員、村里長、警察等為責任通報人員，知悉老人因受虐待、疏忽或遺棄致其生命、身體、健康或自由發生危難時，應於 24 小時內向直轄市或縣市主管機關通報。這項義務有三個關鍵特性：第一，成立要件是合理懷疑而非確認事實，通報後由主管機關調查認定，不需自行蒐證到確定才通報；第二，義務不因加害人或家屬拒絕配合而免除，本例其子拒絕進一步評估，正是需要公權力介入的理由；第三，通報屬法定義務，違反者可處罰鍰。至於是否強制安置，須由主管機關依法定程序評估決定，第一線人員不能自行強制安置，也不宜以家庭諮商為由暫緩通報，故選 B。", "options": {"A": "尊重其子拒絕評估的意願而僅記錄，違反法定通報義務。", "B": "正確。合理懷疑有虐待情事即應於 24 小時內通報。", "C": "強制安置須由主管機關依法定程序評估，第一線不可自行強制。", "D": "以家庭諮商為由暫緩通報，違反責任通報的法定義務。"}, "sources": ["老人福利法", "衛生福利部保護服務作業規定"]}}, "115-通論-麻醉-31": {"quick": "護理人員應依執業登記規定，未完成程序不得於其他機構執業，故 (C)。", "detail": {"background": "護理人員法採單一處所執業登記原則：護理人員應向所在地主管機關申請執業登記，並只能在登記的處所執業。若要到其他醫療機構提供服務，必須符合下列情形之一並依規定辦理：辦理執業處所變更、經事先報准的機構間支援報備，或屬於緊急救護等法定例外。本例專師以 A 醫院為執業登記處所，卻固定至 B 診所執行業務且未辦理變更、支援報備或事先報准，已違反執業登記規定，可處罰鍰並限期改善。要破除的三個誤解是：兩處皆為合法醫療機構不代表可自由跨院執業；是否支領薪資與執業登記規範無關；專科護理師同樣受護理人員法規範，並無豁免，故選 C。", "options": {"A": "機構合法不等於可自由跨院執業，仍須依執業登記規定辦理。", "B": "是否支領薪資與執業登記規範無關。", "C": "正確。未依執業登記規定完成變更或支援報備，不得於其他機構執業。", "D": "專科護理師同樣受護理人員法執業登記規範，並無豁免。"}, "sources": ["護理人員法", "醫事人員執業登記及繼續教育辦法"]}}, "115-通論-麻醉-32": {"quick": "面對超出自身能力的高風險處置，應說明能力限制並尋求監督醫師或具資格者協助，故 (C)。", "detail": {"background": "醫療倫理的四大原則中，不傷害原則在此情境優先於團隊和諧與效率考量。專業人員只能執行自己受過訓練、具備能力且有合法授權的處置，這既是倫理要求也是法律責任的界線；未受訓練即執行高風險侵入性處置，一旦造成傷害，行為人本身仍須負責，不能以醫師指示或人力不足作為免責事由。因此最符合專業倫理的做法是主動說明自身能力限制，並尋求監督醫師或其他具資格人員協助或督導執行，同時把此需求列為單位訓練缺口回報。相對地，先照做之後再補訓是把病人當作練習對象；請人代寫紀錄涉及紀錄不實；為維持團隊合作而不提出能力不足，則是把和諧置於病人安全之上，故選 C。", "options": {"A": "已獲醫師指示不能免除能力不足的責任，執行仍屬不當。", "B": "請同仁代為完成紀錄涉及紀錄不實，且未解決能力問題。", "C": "正確。應主動說明能力限制，尋求監督醫師或具資格人員協助。", "D": "為維持團隊合作而不提出能力不足，將病人安全置於次要。"}, "sources": ["醫學倫理四原則", "護理人員法與專業責任"]}}, "115-通論-麻醉-33": {"quick": "病人資訊不得因好奇而查詢、使用或揭露，故 (C)。", "detail": {"background": "病人隱私的保護建立在必要性原則之上：醫療人員只能在為該病人提供照護所必需的範圍內查詢與使用其資料，與照護無關者即使同為醫療人員也不得查閱病歷或討論病情。這在個人資料保護法、醫療法與醫事人員的保密義務中都有明文，違反者除機構內懲處外，還可能負民事、刑事與行政責任，且醫院資訊系統的查詢紀錄可完整稽核。本例詢問者是非照護單位的同仁、動機僅是好奇，完全不符必要性，因此適當的回應是明確而不失禮貌地說明病人資訊不得因好奇而查詢、使用或揭露。要注意即使不公開姓名，在可識別特定個人的情況下仍屬個人資料，不能因此就分享部分病情，故選 C。", "options": {"A": "不公開姓名但仍可識別特定個人時，資訊仍受保護，不得分享。", "B": "同為醫療人員不等於有查閱權限，須以照護必要性為前提。", "C": "正確。病人資訊不得因好奇而查詢、使用或揭露。", "D": "為維持同事關係而私下分享資訊，違反保密義務。"}, "sources": ["個人資料保護法", "醫療法與醫事人員保密義務"]}}, "115-通論-麻醉-34": {"quick": "住院病人跌倒發生率屬醫療品質的結果面指標，故 (D)。", "detail": {"background": "Donabedian 的醫療品質三面向是這類題目的萬用架構。結構面指提供照護所需的資源與條件，包括人力配置、設備、資格與證照，例如專師取得高級心臟救命術證書的比率。過程面指實際執行了哪些照護活動與是否符合標準，例如給藥正確率、病歷簽章完成率、洗手遵從率、符合條件者接受篩檢的比率。結果面指這些照護最終在病人身上產生的健康結果，包括死亡率、併發症率、感染率、再入院率與病人滿意度，例如住院病人跌倒發生率，這正是本題答案。判斷訣竅是問自己：這個數字描述的是有什麼資源、做了什麼，還是病人怎麼了，最後一種就是結果面，故選 D。", "options": {"A": "證書比率屬人員資格條件，為結構面指標。", "B": "給藥正確率描述照護執行過程，屬過程面指標。", "C": "病歷簽章完成率同樣屬過程面指標。", "D": "正確。住院病人跌倒發生率描述病人的健康結果，屬結果面指標。"}, "sources": ["Donabedian Quality Framework", "醫療品質指標管理實務"]}}, "115-通論-麻醉-38": {"quick": "詢問某種介入是否能改善結果，屬治療型的實證問題，故 (A)。", "detail": {"background": "實證醫學把臨床問題依「想知道什麼」分為四大類型，各自對應最佳的研究設計。治療型問題問的是某項介入能否改善結果，最佳證據來自隨機對照試驗與其系統性回顧，本題問飲食及運動介入能否改善第 2 型糖尿病肥胖病人的血糖，正屬此類。診斷型問題問某項檢查能否正確辨識疾病，最佳設計是與參考標準對照的橫斷研究，看的是敏感度與特異度。預後型問題問具有某特徵的病人未來會怎樣，最佳設計是世代研究，看的是存活率與事件發生率。病因型問題問某暴露是否造成疾病，設計為世代或病例對照研究，看的是相對危險性或勝算比。分類正確才能決定要找哪一種文獻，故選 A。", "options": {"A": "正確。詢問介入能否改善血糖結果，屬治療型問題。", "B": "診斷型問題探討檢查能否正確辨識疾病。", "C": "預後型問題探討具某特徵者未來的疾病進展。", "D": "病因型問題探討某暴露是否造成疾病。"}, "sources": ["Evidence-Based Medicine: How to Practice and Teach EBM"]}}, "115-通論-麻醉-39": {"quick": "可信賴臨床照護指引要求納入包含醫師與護理師在內的多元權益關係人，故錯誤為 (D)。", "detail": {"background": "美國醫學研究院提出可信賴臨床照護指引的八項準則，核心精神是透明與多元。內容包括：建立透明化的發展流程並公開利益衝突聲明、發展小組需具備多專業組成並納入權益關係人、以系統性文獻回顧為證據基礎、明確說明證據強度與建議強度的分級、清楚陳述建議內容與適用情境、發展完成後接受外部專家與利害關係人評估、定期更新，以及財務來源透明。其中權益關係人的組成是常考重點：必須涵蓋所有會受指引影響的群體，包括醫師、護理師、藥師等各醫事人員，以及病人與照顧者代表，才能確保指引在真實臨床可行且反映病人價值，因此 D 說不包含醫師及護理師顯然錯誤。", "options": {"A": "建立透明化機制與利益衝突聲明是準則之一，敘述正確。", "B": "成立多專業發展小組並以系統性文獻回顧為基礎，敘述正確。", "C": "發展完成後應接受外部評估，敘述正確。", "D": "正確（為本題錯誤敘述）。權益關係人必須包含醫師、護理師等受影響的各方。"}, "sources": ["IOM Clinical Practice Guidelines We Can Trust"]}}, "115-通論-麻醉-40": {"quick": "PICO 的 P 應為社區長者這個具體族群，寫成成人過於籠統，故錯誤為 (A)。", "detail": {"background": "PICO 是把臨床疑問轉成可檢索問題的架構，四個要素都必須「具體到能對應文獻的納入條件」。P 指的是病人或族群，要寫出足以界定研究對象的關鍵特徵，本題的研究對象是「社區長者」，年齡與居住情境都是重要條件，若只寫成人就過於籠統，會檢索到與研究問題無關的族群，這正是本題的錯誤所在。I 指介入措施，本題為每日補充高劑量維他命 D 超過 700 國際單位，劑量與頻率都要寫明。C 指比較組，即未接受該介入者或安慰劑。O 指結果指標，必須是可測量的，本題為跌倒發生率。此外 PICO 常再加上 T 代表時間與 S 代表研究設計，讓檢索更精準，故錯誤為 A。", "options": {"A": "正確（為本題錯誤敘述）。P 應為社區長者，寫成成人過於籠統。", "B": "I 明確寫出每日高劑量維他命 D 的介入內容，敘述正確。", "C": "C 為未接受該介入者，作為比較組，敘述正確。", "D": "O 為可測量的跌倒發生率，敘述正確。"}, "sources": ["Evidence-Based Medicine: How to Practice and Teach EBM"]}}, "115-通論-麻醉-41": {"quick": "住院病人手術死亡率描述病人的健康結果，屬結果面指標，故 (B)。", "detail": {"background": "把 Donabedian 三面向套進成效測量指標，逐項檢視就能解題。第一，48 小時內非計畫性重返加護病房的比率，衡量的是病人的臨床結果與照護後果，屬結果面而非流程面。第二，住院病人手術死亡率是最典型的結果面指標，直接描述照護在病人身上的最終健康結果，本題正確。第三，符合條件婦女接受乳房 X 光攝影篩檢的比率，衡量的是「有沒有做到該做的事」，屬過程面而非結構面。第四，門診病人平均候診時間反映服務流程的效率，屬過程面而非結果面。判斷原則仍是：描述資源與條件的是結構面、描述做了什麼的是過程面、描述病人最後怎麼了的是結果面，故選 B。", "options": {"A": "非計畫性重返加護病房比率描述病人臨床結果，屬結果面而非流程面。", "B": "正確。住院病人手術死亡率描述病人健康結果，屬結果面指標。", "C": "接受篩檢的比率衡量是否做到該做的事，屬過程面而非結構面。", "D": "平均候診時間反映服務流程效率，屬過程面而非結果面。"}, "sources": ["Donabedian Quality Framework", "醫療品質指標管理實務"]}}, "115-通論-麻醉-42": {"quick": "特性要因圖可識別、分類並呈現造成某特定結果的所有可能原因，故 (D)。", "detail": {"background": "品管七大手法各有專屬用途，本題四個選項恰好互相錯置，逐一還原即可。特性要因圖又稱魚骨圖或石川圖，把某個結果放在魚頭，再依人員、方法、機器、材料、環境、量測等大類展開分支，系統性地識別、分類並呈現所有可能原因，是根本原因分析的主力工具，本題正確。柏拉圖才是依問題發生頻率高低排序、用來聚焦少數重要項目的工具，也就是選項 A 誤植給直方圖的描述；直方圖實際上呈現的是資料的次數分布與離散情形。散布圖用於分析兩個變數的相關性，也就是選項 B 誤植給檢查表的內容；檢查表則是收集發生次數與頻率的記錄工具，正是選項 C 誤植給管制圖的描述；管制圖真正的用途是監測製程隨時間的穩定度，故選 D。", "options": {"A": "依頻率高低排序以聚焦重要項目的是柏拉圖，直方圖呈現次數分布。", "B": "分析兩變數相關性的是散布圖，檢查表用於記錄發生次數。", "C": "收集次數與頻率記錄的是檢查表，管制圖用於監測製程穩定度。", "D": "正確。特性要因圖可識別、分類並呈現造成特定結果的所有可能原因。"}, "sources": ["品質管理七大手法", "醫療品質改善實務"]}}, "115-通論-麻醉-43": {"quick": "台灣病人安全通報系統收集的是院內「非」預期心跳停止事件，故錯誤為 (C)。", "detail": {"background": "台灣病人安全通報系統採匿名、自願、保密與不究責的原則，目的是從錯誤中學習而非追究個人責任，收集的異常事件共分十餘類，包括藥物事件、跌倒事件、手術事件、輸血事件、管路事件、檢查與檢驗事件、醫療照護事件、公共意外事件、治安事件、傷害行為事件與其他事件。心跳停止相關的通報項目，指的是「院內非預期的心跳停止」，也就是病人在原本不預期會發生心跳停止的情況下突然發生，這類事件往往代表病情惡化未被及時辨識，正是需要檢討的病人安全議題；而「預期」的心跳停止例如末期病人依預立意願自然死亡，並非異常事件，不在通報範圍。因此 C 把非預期寫成預期，是錯誤敘述。", "options": {"A": "輸血事件與手術事件皆為通報系統收集的項目，敘述正確。", "B": "公共意外事件與治安事件也在收集項目之列，敘述正確。", "C": "正確（為本題錯誤敘述）。收集的是院內非預期心跳停止事件，非預期者不在範圍。", "D": "管路事件為通報系統的收集項目之一，敘述正確。"}, "sources": ["台灣病人安全通報系統作業說明", "醫策會病人安全年度目標"]}}, "115-通論-麻醉-44": {"quick": "健康台灣願景訂於 2032 年平均餘命提升至 82 歲、不健康餘命占比降至 8%，故 (C)。", "detail": {"background": "健康台灣是我國近年的國家級健康政策願景，把目標設定在「活得久」與「活得好」兩個維度上，並以量化指標檢核。核心目標是在 2032 年把國人平均餘命提升至 82 歲，同時把不健康餘命占平均餘命的比率降至 8%。這兩個數字要一起看才理解政策邏輯：平均餘命是壽命長度，不健康餘命則是失能與疾病纏身的年數，若只延長壽命卻沒有壓縮不健康餘命，增加的只是需要長期照護的歲月。因此政策推動的重點放在慢性病防治、三高與癌症篩檢、健康促進與體重管理、心理健康、以及醫療與長照的整合銜接，目標是把疾病與失能盡量壓縮在生命末段，故選 C。", "options": {"A": "平均餘命目標為 82 歲而非 85 歲，不健康餘命占比目標亦非 12%。", "B": "數值不符，平均餘命目標為 82 歲、不健康餘命占比目標為 8%。", "C": "正確。2032 年平均餘命提升至 82 歲、不健康餘命占比降至 8%。", "D": "83 歲與 5% 均與政策所訂目標不符。"}, "sources": ["衛生福利部健康台灣政策白皮書"]}}, "115-通論-麻醉-45": {"quick": "收入不穩定、交通不便與醫療資源缺乏屬社會健康決定因子，故 (B)。", "detail": {"background": "社會健康決定因子指的是人們出生、成長、生活、工作與老化的環境條件，以及形塑這些條件的權力與資源分配，包括經濟穩定度、教育、醫療的可近性與品質、居住與物理環境、以及社會與社區脈絡。世界衛生組織估計，健康結果中相當大的比例由這些社會條件決定，而非醫療服務本身。本例糖尿病病人中斷回診的三個原因——收入不穩定造成經濟障礙、居住地交通不便造成地理障礙、鄰近地區缺乏醫療資源造成可近性障礙——全都落在社會健康決定因子的範疇，而不是個人動機不足、醫病溝通不良或疾病自然惡化。理解這一點的臨床意義是：介入應包含轉介社會資源、安排交通協助或遠距追蹤，而非只做衛教，故選 B。", "options": {"A": "本例障礙來自外在環境條件，並非個人動機或健康識能不足。", "B": "正確。收入不穩定、交通不便與醫療資源缺乏屬社會健康決定因子。", "C": "題幹並未描述醫療人員溝通問題，非主要解釋。", "D": "中斷回診源自環境障礙，而非疾病本身的自然惡化。"}, "sources": ["WHO Social Determinants of Health", "Healthy People 2030"]}}, "115-通論-麻醉-46": {"quick": "渥太華憲章定義健康促進為增進人們對自身健康的控制並改善其健康的過程，故 (A)。", "detail": {"background": "1986 年世界衛生組織的渥太華憲章是健康促進的奠基文件，它把健康促進定義為「使人們能夠增進對自身健康的控制並改善其健康的過程」，重點在賦權而非單向教導，並強調健康是日常生活的資源而非生活目的。憲章提出五大行動綱領：建立健康的公共政策、創造支持性環境、強化社區行動、發展個人技能、以及調整醫療服務方向使其從治療轉向健康促進。這個定義刻意把範圍拉出醫療體系之外，因此增加醫院與醫事人員的服務供給屬醫療服務政策而非健康促進的定義；疾病篩檢是次段預防的手段之一而非健康促進的定義；教導民眾遵從專業建議則是傳統的單向衛教模式，與賦權精神相反，故選 A。", "options": {"A": "正確。健康促進是增進人們對自身健康的控制並改善其健康的過程。", "B": "疾病篩檢屬次段預防手段，不是健康促進的定義。", "C": "增加醫療服務供給屬醫療政策，並非健康促進的定義。", "D": "教導民眾遵從專業建議是單向衛教，與賦權精神相反。"}, "sources": ["WHO Ottawa Charter for Health Promotion 1986"]}}, "115-通論-麻醉-47": {"quick": "依成人預防保健升級方案，30 至 39 歲每 5 年 1 次，故 (A)。", "detail": {"background": "國民健康署自 114 年推動成人預防保健升級方案，把服務對象由原本的 40 歲以上向下延伸至 30 歲，並依年齡調整頻率，形成三段式設計：30 至 39 歲每 5 年 1 次、40 至 64 歲每 3 年 1 次、65 歲以上與 55 歲以上原住民、35 歲以上小兒麻痺患者每年 1 次。服務內容涵蓋身體檢查與身體質量指數、血壓、血糖、血脂與腎功能等實驗室檢查、健康行為與憂鬱風險評估，以及依結果提供的健康諮詢與轉介。向下延伸的政策理由是三高與代謝症候群的發生年齡持續下降，及早發現並介入可延緩慢性病進程。本例 35 歲未有三高病史，落在 30 至 39 歲區間，故選 A。", "options": {"A": "正確。30 至 39 歲每 5 年提供 1 次成人預防保健服務。", "B": "每 3 年 1 次適用於 40 至 64 歲族群。", "C": "每年 1 次適用於 65 歲以上與特定族群。", "D": "服務對象已向下延伸至 30 歲，35 歲符合資格。"}, "sources": ["國民健康署成人預防保健服務規定"]}}, "115-通論-麻醉-48": {"quick": "多重需求的高齡個案應以個案管理串聯社區醫療與長照資源，故 (D)。", "detail": {"background": "健康台灣所主張的整合性照護，核心是「以人為中心而非以疾病為中心」。當一位社區高齡個案同時有糖尿病、失智症、行動不便與獨居等多重需求時，分科各自處理會造成重複檢查、藥物交互作用與照護空窗，也忽略了失能與社會支持這些真正影響結果的因素。最符合整合性照護理念的安排是「個案管理」：由個管師或家庭醫師團隊統整評估，把醫療、居家醫療、長照 2.0 的照顧服務與喘息、社區據點、營養與復能資源串聯成一個計畫並持續追蹤調整。相對地，分科各自照護正是要被取代的模式；只優先控制血糖忽略了失智與獨居的安全風險；而僅因疾病複雜就直接住院，並不符合在地老化的政策方向，故選 D。", "options": {"A": "分科各自照護正是整合性照護要改善的碎片化模式。", "B": "只優先控制血糖忽略了失智、行動不便與獨居的安全風險。", "C": "僅因疾病複雜即住院觀察，不符合在地老化的政策方向。", "D": "正確。以個案管理串聯社區醫療與長照資源，最符合整合性照護理念。"}, "sources": ["衛生福利部健康台灣政策白皮書", "長期照顧十年計畫 2.0"]}}, "115-通論-5分科-56": {"quick": "全國性調查顯示中高齡族群最常見且盛行率最高的精神健康問題是憂鬱症，故 (B)。", "detail": {"background": "中高齡族群的精神健康流行病學有幾個必須分清的數字。憂鬱症狀在中高齡的盛行率最高，社區調查中具臨床意義的憂鬱症狀常達一至兩成，遠高於其他精神疾病，而且它是「可治療但常被忽略」的問題——長者常以身體不適、失眠、食慾下降或記憶變差表現，而非主訴心情低落，因此容易被歸因於老化或身體疾病。失智症的盛行率隨年齡陡升，但在整體中高齡族群中仍低於憂鬱；思覺失調症多在青年期發病、終生盛行率約 1% 以下；酒精使用障礙在中高齡雖不罕見但盛行率仍低於憂鬱。臨床意義是社區與門診都應主動篩檢長者憂鬱並評估自殺風險，故選 B。", "options": {"A": "思覺失調症多在青年期發病，終生盛行率遠低於憂鬱症。", "B": "正確。憂鬱症是中高齡族群最常見且盛行率最高的精神健康問題。", "C": "失智症盛行率隨年齡陡升，但整體仍低於憂鬱。", "D": "酒精使用障礙在中高齡並不罕見，但盛行率低於憂鬱症。"}, "sources": ["國家衛生研究院全國性精神健康調查", "衛生福利部心理健康統計"]}}, "115-通論-5分科-57": {"quick": "長者說出活著沒有意思並退縮，應優先評估自我傷害風險並轉介精神醫療，故 (C)。", "detail": {"background": "本例 78 歲獨居長者近一個月情緒低落、食慾與睡眠變差、停止參與原本喜愛的活動，並說出活著沒有意思這類語句，符合老年憂鬱的表現，而最後這句話是明確的警訊語言，不能當作單純抱怨帶過。老年族群的自我傷害風險特別需要重視，因為長者的表達往往含蓄、預警時間短，而獨居又缺乏即時的支持與發現者。因此最優先的處置是直接、平和地評估其想法與計畫，同時評估支持系統與安全環境，並協助轉介精神醫療或身心科進一步診療。要避免的三種反應是：只鼓勵多參與活動而略過風險評估、建議先自行觀察 2 至 4 週而延誤介入、以及把情緒低落誤認為正常老化，故選 C。", "options": {"A": "鼓勵參與活動雖有幫助，但略過風險評估並非最優先。", "B": "建議先自行觀察 2 至 4 週會延誤介入時機。", "C": "正確。應優先評估其想法與風險，並協助轉介精神醫療。", "D": "情緒低落並非正常老化，忽視警訊語言相當危險。"}, "sources": ["衛生福利部心理健康促進資料", "APA Practice Guideline for Major Depressive Disorder"]}}, "115-通論-5分科-58": {"quick": "青光眼早期多無自覺症狀，等到察覺時視野已嚴重受損，故錯誤為 (A)。", "detail": {"background": "高齡者視力障礙的照護有一個核心觀念：許多致盲眼疾在早期都「沒有症狀」，因此必須靠定期檢查而不是等症狀出現。原發性隅角開放型青光眼正是最典型的例子，它從周邊視野開始緩慢缺損，中央視力到晚期才受影響，加上雙眼互相代償，病人往往在視神經已嚴重且不可逆損傷後才察覺，因此 A 說多可早期自行察覺是錯誤的。糖尿病視網膜病變同樣如此，即使視力正常也可能已有明顯病變，故糖尿病病人須定期接受散瞳眼底檢查。白內障則是高齡最常見且可經手術有效治療的視力障礙原因。而視力障礙會增加跌倒、憂鬱、社交隔離與失能風險，是老年症候群的重要一環，故錯誤為 A。", "options": {"A": "正確（為本題錯誤敘述）。青光眼早期多無自覺症狀，不可等症狀出現才就醫。", "B": "糖尿病病人即使無症狀仍應定期接受眼底檢查，敘述正確。", "C": "視力障礙會增加跌倒、憂鬱與失能風險，敘述正確。", "D": "白內障是高齡常見且可手術治療的視力障礙原因，敘述正確。"}, "sources": ["AAO Preferred Practice Pattern", "國民健康署長者健康促進資料"]}}, "115-通論-5分科-71": {"quick": "台灣急診檢傷與急迫度分級量表把急診病人分為 5 個等級，故 (C)。", "detail": {"background": "台灣急診檢傷與急迫度分級量表把急診病人依急迫程度分為五級，每一級都有明確的臨床定義與建議的可容忍等候時間：第一級復甦急救，屬立即危及生命需即刻處置；第二級危急，病況可能快速惡化，建議 10 分鐘內處置；第三級緊急，需要在合理時間內處理以免惡化，約 30 分鐘；第四級次緊急，約 60 分鐘；第五級非緊急，約 120 分鐘。分級的依據結合「主訴類別」與「急迫度修飾因子」，例如生命徵象、疼痛程度、意識狀態、出血量與受傷機轉，由檢傷護理人員快速評估後給定。制度的核心價值在於讓資源優先給最需要的病人，而不是依到達先後看診，因此也是急診壅塞時分流與病人溝通的重要依據，故選 C。", "options": {"A": "3 級不符現行制度，我國自 99 年起已改採五級量表。", "B": "4 級為舊制或其他國家部分制度，非我國現行分級。", "C": "正確。現行台灣急診檢傷與急迫度分級量表分為 5 個等級。", "D": "並無 6 級的分級設計。"}, "sources": ["台灣急診檢傷與急迫度分級量表", "衛生福利部急診檢傷分類基準"]}}, "115-進階-內科-34": {"quick": "胸部 X 光顯示鼻胃管誤入呼吸道，任何灌注前都必須先移除鼻胃管，故 (A)。", "detail": {"background": "本例失智長者因高燒、脫水、低血糖與低血壓送醫，家屬拒絕靜脈留置針，醫師改放鼻胃管作為給藥途徑，但影像顯示管路走向並未沿食道下行至橫膈以下的胃部，而是進入氣管支氣管系統。這是鼻胃管最危險的併發症：在意識不清、咳嗽反射減弱的病人身上，管路誤入呼吸道時常沒有嗆咳等警示症狀，若循此灌入藥物、水或葡萄糖液，會直接造成化學性肺炎、缺氧與死亡。因此不論病人多需要那些治療，正確且唯一優先的處置都是「立即移除鼻胃管」，之後再重新放置並以影像確認位置，或與家屬重新溝通建立靜脈通路的必要性。位置確認的標準是胸腹部 X 光，聽診灌氣音並不可靠，故選 A。", "options": {"A": "正確。影像顯示鼻胃管位置錯誤，應立即移除以免灌注造成化學性肺炎。", "B": "經位置錯誤的管路給予退燒藥會直接灌入呼吸道，極度危險。", "C": "灌注 200 毫升水進入呼吸道可造成致命的化學性肺炎與缺氧。", "D": "低血糖雖須矯正，但不能經誤入呼吸道的管路給予葡萄糖水。"}, "sources": ["NPSA Nasogastric Tube Placement Alert", "醫策會病人安全年度目標"]}}, "115-進階-內科-78": {"quick": "瀕死喉鳴應在症狀初發時即開始使用抗副交感神經藥物，故 (B)。", "detail": {"background": "瀕死喉鳴是臨終病人因意識下降、無法自行清除咽喉分泌物，氣流通過時產生的聲音。它的照護有兩個核心觀念。第一，「這個聲音困擾的主要是家屬而非病人」，因為此時病人多已無意識，並不感到窒息，因此照護重點包含向家屬解釋這是自然臨終過程的一部分，減輕其焦慮與罪惡感。第二，藥物必須「早給」：抗副交感神經藥物如 glycopyrrolate、hyoscine 只能抑制新分泌物的產生，對已經積聚的分泌物無效，因此必須在症狀初發時就開始使用才有效，這正是本題答案。要避免的是反覆深部抽吸，那會刺激黏膜、增加分泌並造成病人不適；若分泌物來自肺炎或肺水腫，抗副交感神經藥物效果有限，不應期待完全消除聲音。", "options": {"A": "反覆深部抽吸會刺激黏膜、增加分泌並造成不適，不應優先執行。", "B": "正確。抗副交感神經藥物只能抑制新分泌物，應於症狀初發時即開始使用。", "C": "分泌物源自肺炎時抗副交感神經藥物效果有限，不應期待完全消除聲音。", "D": "側臥並略抬高床頭有助引流，但單純抬高床頭並非主要處置。"}, "sources": ["台灣安寧緩和醫學學會臨床指引", "NICE Care of Dying Adults"]}}, "115-進階-內科-79": {"quick": "未曾使用鴉片類藥物的末期病人出現呼吸困難，首選低劑量口服即效嗎啡，故 (B)。", "detail": {"background": "末期病人的呼吸困難是主觀感受，與血氧數值不一定相關，而低劑量鴉片類藥物是目前實證最充分的第一線治療，機轉包括降低中樞對二氧化碳與缺氧的通氣反應、減少呼吸功與焦慮感。用藥原則是「從小劑量開始、慢慢往上調」：從未使用過鴉片類的病人，起始給予口服即效型嗎啡約 2.5 至 5 mg，每 4 小時或必要時給予，依反應調整，這樣既能緩解症狀又能避免呼吸抑制與過度鎮靜。要避免的做法有三：一次靜脈快速推注 10 mg 對未曾用藥者劑量過高且有呼吸抑制風險；長效製劑起效慢且不利急性期滴定，應待劑量穩定後再轉換；至於氧氣，僅在確有低血氧時才有幫助，且不能取代鴉片類藥物，故選 B。", "options": {"A": "對未曾使用鴉片類者快速靜脈推注 10 mg 劑量過高，有呼吸抑制風險。", "B": "正確。首選口服即效型嗎啡 2.5 至 5 mg 起始並依反應調整。", "C": "長效製劑起效慢且不利急性期滴定，應待劑量穩定後再轉換。", "D": "氧氣僅在確有低血氧時有幫助，且不能取代鴉片類藥物。"}, "sources": ["台灣安寧緩和醫學學會臨床指引", "ATS Statement on Dyspnea Management"]}}, "115-進階-內科-80": {"quick": "口服嗎啡換算為皮下給藥約除以 2，60 mg 對應 30 mg，故 (C)。", "detail": {"background": "鴉片類藥物的給藥途徑轉換有固定的等效比值必須背熟：嗎啡口服與皮下或靜脈的等效比約為 2 比 1 到 3 比 1，臨床常用的是 2 比 1，也就是口服劑量除以 2 即為皮下的每日總量；口服與肌肉注射同樣約 2 比 1。本例病人原本每日口服嗎啡總量 60 mg，因意識改變無法吞嚥而改為 24 小時連續皮下輸注，換算後起始劑量為 30 mg 每 24 小時，故選 C。轉換時還有兩個實務要點：第一，跨藥物轉換（例如嗎啡換成 fentanyl 或 hydromorphone）時，因交叉耐受性不完全，通常要再減量 25 至 50%；本例是同藥不同途徑，不需額外減量。第二，必須同時開立突發性疼痛的救援劑量，一般為 24 小時總量的六分之一。", "options": {"A": "120 mg 是把口服劑量乘以 2，方向相反且會造成過量。", "B": "60 mg 未做途徑換算，皮下給藥效價高於口服，會造成過量。", "C": "正確。口服 60 mg 除以 2，皮下起始劑量為 30 mg 每 24 小時。", "D": "10 mg 換算比例過低，會造成疼痛控制不足與戒斷。"}, "sources": ["台灣安寧緩和醫學學會臨床指引", "EAPC Opioid Conversion Guidance"]}}, "115-進階-兒科-23": {"quick": "復發但仍計畫骨髓移植的白血病屬危及生命但可能治癒的疾病，故 (C)。", "detail": {"background": "兒童安寧緩和醫療的適合性評估採用四類分類，重點在於「不是只有臨終才需要安寧」。第一類是「危及生命但可能治癒」的疾病，治療可能成功也可能失敗，因此在積極治療的同時就應提供安寧共同照護，代表疾病包括癌症與器官衰竭，本例八歲急性骨髓性白血病復發、再化療未達緩解、仍計畫骨髓移植，正屬此類。第二類是需長期密集治療以延長生命、但生命終將提前結束者，如囊性纖維化與裘馨氏肌失養症。第三類是無治癒可能、只能緩解並逐漸惡化者，如某些代謝性疾病與神經退化疾病。第四類是不會進行性惡化但造成嚴重失能、易併發合併症者，如重度腦性麻痺。故選 C。", "options": {"A": "逐漸惡化且無法治癒屬第三類，本例仍有骨髓移植的治癒機會。", "B": "需長期密集治療但生命終將提前結束屬第二類，如囊性纖維化。", "C": "正確。復發但仍計畫骨髓移植，屬危及生命但可能治癒的疾病。", "D": "不會惡化但造成嚴重失能屬第四類，如重度腦性麻痺。"}, "sources": ["ACT/RCPCH 兒童安寧緩和照護分類", "台灣兒童安寧緩和照護指引"]}}, "115-進階-兒科-24": {"quick": "邊界清楚的對稱性燙傷且臀部中央未受傷，符合虐待性浸泡燙傷，故 (C)。", "detail": {"background": "兒童燙傷是否為虐待，可從三個影像學特徵判斷。第一是「邊界清楚」：意外潑灑的熱液會因流動而形成不規則、上寬下窄的潑濺痕並有衛星狀噴濺點；浸泡式燙傷則邊界銳利如襪套狀或手套狀，因為肢體被強行浸入固定深度的熱水。第二是「對稱性」：意外很少造成雙側對稱的均勻傷害。第三也是最具指標性的「甜甜圈徵象」：孩童臀部被壓在較涼的浴缸底部，該接觸點受到保護而未燙傷，加上髖膝屈曲時鼠蹊與膕窩皺褶處也倖免，形成中央未傷、周圍環狀燙傷的特殊圖形，本例臀部中央皺褶區域未受傷正是此徵象。發現時應立即通報並完整記錄，故選 C。", "options": {"A": "熱湯潑灑會形成不規則潑濺痕並有衛星狀噴濺點，非邊界清楚的對稱傷害。", "B": "意外跌入浴缸的傷害分布不規則且常有掙扎造成的濺痕。", "C": "正確。邊界清楚、對稱且臀部中央未受傷的甜甜圈徵象，符合虐待性浸泡燙傷。", "D": "電器接觸性燙傷多為局部小面積且形狀對應接觸物。"}, "sources": ["AAP Clinical Report on Abusive Burns", "兒童及少年福利與權益保障法"]}}, "115-進階-兒科-26": {"quick": "身形瘦小、衣著骯髒且長期缺乏照顧者監護，符合兒童疏忽，應通報社政單位，故 (B)。", "detail": {"background": "兒童保護的類型判斷靠「有沒有主動施加的傷害」與「有沒有應盡而未盡的照顧」。身體虐待是照顧者主動施加造成傷害，理學上會有與說法不符的瘀傷、燙傷或骨折型態。疏忽則是「應提供而未提供」基本需求，包括身體照顧（飲食、衛生、衣著）、醫療、教育與「監督」，本例三歲兒童常獨自在社區遊蕩代表監督缺失，身形瘦小提示營養不足，衣著骯髒提示身體照顧不足，三者合起來符合兒童疏忽。要注意疏忽是兒虐通報中最常見的類型，卻最容易被忽略，因為沒有明顯外傷。依兒童及少年福利與權益保障法，醫事人員為責任通報人員，應於 24 小時內向社政主管機關通報，故選 B。", "options": {"A": "三歲幼童獨自在外遊蕩並非正常探索行為，屬監督疏忽。", "B": "正確。符合兒童疏忽，應立即向社政單位通報。", "C": "本例並無主動施加傷害的證據，不宜逕以身體虐待通報警政。", "D": "發展遲緩與自閉症的評估可後續進行，但無法解釋照顧疏忽的表現。"}, "sources": ["兒童及少年福利與權益保障法", "AAP Clinical Report on Child Neglect"]}}, "115-進階-兒科-47": {"quick": "安全睡眠環境的原則是與父母同房但不同床，故 (B)。", "detail": {"background": "預防嬰兒猝死症的安全睡眠原則可歸納為五項，每一項都有明確的實證依據。第一，一律「仰睡」：側睡並不安全，因為嬰兒容易翻成俯臥，指引已明確不建議側睡。第二，睡在「堅實平坦」的嬰兒床墊上，不與大人同床。第三，「同房不同床」：建議至少前 6 個月與照顧者同房但各自分床，可降低猝死風險並方便夜間照顧，這正是本題答案。第四，床上「淨空」：不放厚重棉被、枕頭、床圍與絨毛玩具，避免遮蔽口鼻或造成再吸入二氧化碳，穿著防踢背心取代蓋被。第五，避免過熱與二手菸，並鼓勵哺餵母乳與使用安撫奶嘴。故選 B。", "options": {"A": "厚重棉被可能遮蔽口鼻並造成過熱，是明確的危險因子。", "B": "正確。建議與父母同房但不同床，可降低嬰兒猝死風險。", "C": "側睡並不安全，嬰兒容易翻成俯臥，指引僅建議仰睡。", "D": "床上應保持淨空，絨毛玩具會增加窒息風險。"}, "sources": ["AAP Safe Sleep Recommendations", "國民健康署嬰兒安全睡眠衛教"]}}, "115-進階-外科-22": {"quick": "meperidine 的代謝物 normeperidine 會蓄積並引發類抽搐活動，故 (B)。", "detail": {"background": "鴉片類止痛藥的神經毒性差異，關鍵在代謝物。meperidine 在肝臟去甲基化後產生 normeperidine，這個代謝物沒有止痛作用卻具中樞興奮性，半衰期長達 15 至 30 小時，遠長於母藥的 3 小時，因此反覆給藥時會逐漸蓄積，臨床上先出現顫抖、肌陣攣、焦躁，進而發生類抽搐活動甚至全身痙攣，且「不會被 naloxone 逆轉」。腎功能不全者因清除變慢風險更高，這也是各國指引把它從常規術後止痛與癌症疼痛用藥中除名的原因，目前主要僅保留於術後顫抖的短期使用。相對地，嗎啡雖有 morphine-6-glucuronide 等活性代謝物，主要造成鎮靜與呼吸抑制而非抽搐；fentanyl 沒有活性代謝物；tramadol 雖降低癲癇閾值但機轉不同，故選 B。", "options": {"A": "嗎啡的活性代謝物主要造成鎮靜與呼吸抑制，非典型抽搐毒性。", "B": "正確。meperidine 的代謝物 normeperidine 蓄積會引發類抽搐活動。", "C": "fentanyl 沒有具神經毒性的活性代謝物。", "D": "tramadol 雖可降低癲癇閾值，但非代謝物蓄積所致。"}, "sources": ["Harrison 21e（Opioid analgesics）", "APS Principles of Analgesic Use"]}}, "115-進階-外科-23": {"quick": "肥胖是術後鴉片類藥物引起呼吸抑制的高危險群，故 (D)。", "detail": {"background": "術後使用鴉片類藥物發生呼吸抑制的風險，可從三個層面辨識。第一是「呼吸道與通氣儲備」：肥胖尤其身體質量指數超過 30、合併阻塞性睡眠呼吸中止或肥胖低通氣症候群者風險最高，因為功能性殘氣量小、上呼吸道易塌陷，鴉片類藥物同時抑制呼吸驅動與上呼吸道肌張力，這正是本題答案。第二是「年齡與共病」：一般以 65 歲以上、慢性阻塞性肺病、心衰竭與神經肌肉疾病為高風險，55 歲以上僅屬相對次要。第三是「藥物與劑量」：合併使用鎮靜劑、劑量調整過快、或未使用多模式止痛時風險上升；肝腎功能不全影響的是清除速率，屬需調整劑量的族群但非最典型的高危險群。至於吸菸史短並非危險因子，故選 D。", "options": {"A": "一般以 65 歲以上為高風險族群，55 歲以上僅屬相對次要。", "B": "肝腎慢性疾病影響藥物清除需調整劑量，但非最典型的高危險群。", "C": "吸菸史小於 10 年並非呼吸抑制的危險因子。", "D": "正確。肥胖者功能性殘氣量小且上呼吸道易塌陷，是呼吸抑制高危險群。"}, "sources": ["ASA Practice Guidelines for Neuraxial Opioids", "SASM Perioperative OSA Guideline"]}}, "115-進階-婦產科-27": {"quick": "疑似親密關係暴力應依家庭暴力防治法告知通報責任並提供庇護資源，故 (C)。", "detail": {"background": "懷孕期是親密關係暴力的高風險時期，暴力可能在孕期開始或惡化，並增加早產、胎盤剝離、低出生體重與孕產婦死亡的風險。本例孕婦手臂有多處新舊不等的瘀青，且自述先生偶爾動手，已足以構成合理懷疑。處置要點有三：第一，醫事人員依家庭暴力防治法屬責任通報人員，知悉有家庭暴力情事應於 24 小時內通報，這項義務不因當事人尚未決定報警而免除，正確做法是坦誠告知通報責任、說明通報的目的在於連結保護資源而非強迫她做任何決定。第二，同時提供庇護、社工與保護令等資源資訊，並評估當下人身安全與是否有立即危險。第三，絕不可將加害人找來進行三方會談，那會使受害者處境更危險，故選 C。", "options": {"A": "通報是法定義務，不因當事人無意願報警而免除。", "B": "僅記錄客觀發現而被動等待求助，會錯失介入時機。", "C": "正確。應告知通報責任並提供庇護與保護資源。", "D": "找加害人到院進行三方會談會使受害者處境更加危險。"}, "sources": ["家庭暴力防治法", "ACOG Committee Opinion on Intimate Partner Violence"]}}, "115-進階-精神科-38": {"quick": "多重用藥屬藥物濫用的形式之一，敘述方向錯誤，故 (B)。", "detail": {"background": "老年人在不同院所分別就醫是多重用藥最常見的成因，也是可預防的醫源性傷害來源。要理解的四個要點：第一，跨院就醫時各醫師未必知道彼此的處方，容易出現同類藥物重複開立，例如兩種苯二氮平類或兩種非類固醇消炎止痛藥並用。第二，「多重用藥本身即被視為藥物濫用或不當用藥的一種形式」，不論是否出於故意，因為它造成不必要的暴露、交互作用與跌倒風險，這正是本題錯誤的敘述。第三，長期服用鎮靜安眠藥會產生耐受性，劑量逐漸增加並可能形成依賴。第四，跨科用藥的病人本來就較容易發生藥物濫用問題。因應之道是藥物整合、棕色藥袋檢視與依 Beers 準則檢視潛在不適當用藥，故選 B。", "options": {"A": "跨院就醫時處方未整合，確有重複服用類似藥物的風險，敘述正確。", "B": "正確（為本題錯誤敘述）。多重用藥屬藥物濫用或不當用藥的形式之一。", "C": "長期服用鎮靜安眠藥會產生耐受性並可能依賴，敘述正確。", "D": "跨科用藥病人較易發生藥物濫用問題，敘述正確。"}, "sources": ["AGS Beers Criteria", "老年醫學用藥安全指引"]}}, "115-進階-精神科-41": {"quick": "強制社區治療應告知病人，不得於未告知的情況下為之，故錯誤為 (A)。", "detail": {"background": "民國 111 年修正的精神衛生法把強制治療的程序保障大幅強化，核心精神是「以病人為主體、程序透明且有司法或專業審查」。強制社區治療的規定包括：由精神疾病強制社區治療審查會審查決定；期間每次不得逾 6 個月，必要時得延長；執行時「應告知病人」相關事項與其權利，不得在病人不知情的情況下實施，這正是本題錯誤的敘述；必要時得請警察或消防機關協助護送病人至指定機構接受治療。整體而言，修法後的精神衛生法把過去偏重管制的設計，轉向兼顧病人知情權、法律協助與社區支持，並增設多元的社區支持服務與危機處理機制，故錯誤為 A。", "options": {"A": "正確（為本題錯誤敘述）。強制社區治療應告知病人，不得於未告知下為之。", "B": "強制社區治療期間每次不得逾 6 個月，敘述正確。", "C": "由精神疾病強制社區治療審查會審理，敘述正確。", "D": "必要時得請消防機關協助載送病人就醫，敘述正確。"}, "sources": ["精神衛生法（111 年修正）"]}}, "115-進階-精神科-42": {"quick": "延長強制住院並無僅限兩次的規定，故錯誤為 (C)。", "detail": {"background": "民國 111 年修正的精神衛生法把強制住院的決定權由行政審查改為「法院裁定」，並強化程序保障。重要時程包括：緊急安置期間為 7 日以內；強制鑑定應自緊急安置之次日起 3 日內完成；經鑑定認有強制住院必要者，由主管機關向法院聲請裁定；強制住院期間依法院裁定，屆期若仍有必要得聲請延長，「並無僅限延長兩次」的規定，而是視病情與必要性由法院逐次審查裁定，這正是本題錯誤的敘述。此外，為保障當事人權利，緊急安置或強制住院期間未委任律師者，中央主管機關應提供必要的法律協助，這是修法後新增的重要保障，故錯誤為 C。", "options": {"A": "緊急安置期間為 7 日以內，敘述正確。", "B": "強制鑑定應於緊急安置之次日起 3 日內完成，敘述正確。", "C": "正確（為本題錯誤敘述）。延長強制住院由法院逐次審查裁定，並無兩次為限的規定。", "D": "未委任律師者由中央主管機關提供必要法律協助，敘述正確。"}, "sources": ["精神衛生法（111 年修正）"]}}, "115-進階-精神科-43": {"quick": "嚴重病人診斷證明書的有效期限為 3 年，故 (C)。", "detail": {"background": "精神衛生法所稱的「嚴重病人」，是指病人呈現出與現實脫節的怪異思想及奇特行為，致不能處理自己事務，經專科醫師診斷認定者。這個身分認定牽動許多後續的權利與程序，包括保護人的指定、強制住院與強制社區治療的適用、以及社區支持與福利服務的連結，因此法規對其認定與效期有明確規範：專科醫師開立的嚴重病人診斷證明書，「有效期限為 3 年」，期限屆滿前應重新評估與診斷，以避免身分長期未經檢視而影響病人權益。這個設計反映修法後的精神：嚴重病人的認定不是一次貼標籤就終身有效，而應隨病情變化定期重新檢視，故選 C。", "options": {"A": "6 個月與法規所定的有效期限不符。", "B": "1 年與法規所定的有效期限不符。", "C": "正確。嚴重病人診斷證明書的有效期限為 3 年。", "D": "5 年過長，不符法規所定期限。"}, "sources": ["精神衛生法及其施行細則"]}}, "115-進階-精神科-44": {"quick": "依自殺防治法施行細則，應於 24 小時內完成通報，故 (B)。", "detail": {"background": "自殺防治法自民國 108 年施行，建立了通報與後續關懷的完整機制。醫事人員、社工人員、警察與消防人員等於執行職務時，知悉有自殺行為情事者，應於「24 小時內」依中央主管機關建置的自殺防治通報系統完成通報，本題答案即為此。通報的目的不在於管制或追究，而在於啟動後續的關懷訪視：由各縣市的關懷訪視員在期限內主動聯繫，提供心理支持、資源連結與轉介，並持續追蹤一段期間，因為曾有自殺行為者在事件後的數月內風險仍高。法規同時明訂通報資料的保密義務，非依法不得洩漏，媒體報導也有相關規範以避免模仿效應。急診是最重要的通報場域之一，故選 B。", "options": {"A": "12 小時與施行細則所定期限不符。", "B": "正確。應於知悉後 24 小時內完成通報。", "C": "48 小時超過法定期限。", "D": "3 天遠超過法定期限，會延誤後續關懷訪視。"}, "sources": ["自殺防治法及其施行細則"]}}, "115-進階-麻醉-69": {"quick": "高齡者對鴉片類藥物較敏感，應減少使用劑量，故 (C)。", "detail": {"background": "高齡髖部骨折手術的麻醉照護有幾個實證明確的原則。用藥方面，隨年齡增加，身體組成、肝腎清除與中樞敏感度都改變，「對鴉片類藥物較敏感」，應以較低起始劑量並延長給藥間隔、密切滴定，這是本題答案；同理誘導用 propofol 也應減量，一般降至每公斤 1 mg 上下並緩慢給予，避免嚴重低血壓。疼痛評估方面必須破除一個常見迷思：高齡者對疼痛「並非較不敏感」，只是表達較少或以躁動、退縮、食慾下降等非典型方式呈現，控制不佳的疼痛本身就是術後譫妄的重要危險因子，因此髖部骨折應積極使用周邊神經阻斷。至於麻醉方式，大型試驗顯示區域麻醉與全身麻醉在術後譫妄發生率上並無顯著差異，故選 C。", "options": {"A": "大型試驗顯示區域麻醉與全身麻醉在術後譫妄發生率上並無顯著差異。", "B": "高齡者誘導劑量應減少，propofol 大於每公斤 1.5 mg 易造成嚴重低血壓。", "C": "正確。高齡者對鴉片類藥物較敏感，應減少劑量並密切滴定。", "D": "高齡者並非對痛覺較不敏感，疼痛控制不佳是術後譫妄的重要危險因子。"}, "sources": ["REGAIN trial", "AGS Postoperative Delirium Guideline"]}}}, L={"醫學倫理與法律": {"title": "醫學倫理與法律", "html": "<p><b>核心概念：</b>生命倫理四原則、Jonsen臨床倫理四象限、知情同意與相關法規，是NP臨床決策與糾紛預防的基礎。</p><p><b>四原則(Beauchamp & Childress)：</b>①<b>尊重自主</b>(尊重病人知情後的自我決定)②<b>行善</b>(主動增進福祉；層次：不傷害→去除既有/潛在傷害→增益)③<b>不傷害</b>(避免造成傷害，如洗手防感染)④<b>正義</b>(資源公平分配、避免無效醫療、可負擔性)。常見對應：協助關節運動避免攣縮＝行善之「去除傷害」；節制無效醫療＝正義。</p><p><b>Jonsen四象限(Four-Box)：</b>①<b>醫療適應性</b>(病情/治療效益與風險)②<b>病人意願/偏好</b>(自主、知情同意、<u>心智能力/法律行為能力</u>)③<b>生活品質</b>(治療對生活之影響)④<b>情境特徵</b>(<u>家屬、照顧能力、經濟/資源分配、法律、文化、機構政策</u>)。口訣：問「心智能力」→病人意願；問「家屬/資源」→情境特徵。</p><p><b>知情同意與告知(病主法)：</b>應告知「本人」病情/治療/預後；本人「未明示反對」時亦得告知關係人(以病人為知情主體)。</p><p><b>相關法規：</b>人體器官移植條例(活體捐贈須成年、限五親等內血親或配偶、經醫院<b>醫學倫理委員會審查</b>)。醫療糾紛上升因素：權利意識↑、商業化、期待落差；傳統父權服從式關係糾紛反而較少。</p>"}, "安寧緩和與善終": {"title": "安寧緩和與善終", "html": "<p><b>核心概念：</b>分清「安寧緩和醫療條例(DNR)」與「病人自主權利法(預立醫療決定AD)」兩套法源，是本主題最高頻考點。</p><p><b>病主法五款臨床條件：</b>①末期病人 ②不可逆轉昏迷 ③永久植物人 ④<b>極重度失智</b>(CDR 3、FAST 7以上；中度失智不符) ⑤經中央主管機關公告之特定重症。符合其一＋有AD，醫師得終止/撤除/不施行維生醫療或人工營養。外傷致昏迷/植物人須觀察「<b>逾6個月</b>」、非外傷「逾3個月」；末期須二位相關專科醫師確診。</p><p><b>預立醫療決定(AD)成立要件：</b>須經<b>預立醫療照護諮商(ACP)</b>＋本人(完全行為能力)簽署＋<b>公證或二人見證</b>＋上傳中央資料庫＋健保卡註記。可隨時書面撤回。註記健保卡僅「完成登錄」，須待實際符臨床條件確診後方能執行撤除維生。立法目的：尊重醫療自主、保障善終(非為省資源/減訟)。</p><p><b>DNR(安寧條例)：</b>意願書(本人)/同意書(家屬)；見證人須具完全行為能力且無利害關係(非繼承人/相關醫護)。</p><p><b>臨終照護：</b>緩和性鎮靜(palliative sedation)用於瀕死「難治症狀」(疼痛/呼吸困難/躁動性譫妄/抽搐)，目的緩解症狀非加速死亡(雙重效應)，應停用神經肌肉阻斷劑。骨轉移痛輔助止痛首選<b>降鈣素</b>(神經病變痛才用TCA/抗癲癇)。家屬意見不一→召開<b>家庭會議</b>共識。哀傷否認期→溫和堅定提供資訊、協助面對。</p>"}, "老年醫學與長期照護": {"title": "老年醫學與長期照護", "html": "<p><b>核心概念：</b>老化生理、衰弱與肌少症、跌倒預防、多重用藥，以及長照2.0/長照服務法與評估工具。</p><p><b>老化生理：</b>GFR↓、心肺儲備↓、<b>baroreflex敏感度↓</b>(易姿位性低血壓)、肺餘容積↑、白蛋白略↓、肌肉量↓體脂↑。</p><p><b>衰弱與肌少症：</b><b>Fried衰弱表現型</b>五項(體重減輕、疲憊、肌力↓、步速↓、低活動量；≥3衰弱、1–2前衰弱；<u>食慾下降非其一</u>)。<b>AWGS 2019肌少症</b>：小腿圍切點男<34、女<33；SARC-F五項(力量/行走/起身/登階/跌倒)；嚴重度三級。</p><p><b>跌倒：</b>最強預測因子＝<b>過去一年跌倒史</b>。預防：床欄、止滑墊、扶手、充足照明、移除障礙(地毯/昏暗反致跌)；下肢肌力/步態異常者轉介物理/職能治療與運動團體(非社工)。跌倒發生率＝(跌倒數/住院總人日)×1000‰，屬結果面指標，重度傷害做RCA。</p><p><b>多重用藥：</b>≥5種藥；老年多重共病應個別化「去處方(deprescribing)」、依Beers準則，非機械式疊加各指引用藥；評估須含中草藥/保健品。</p><p><b>長照與工具：</b>長照2.0對象(65歲以上、<b>55歲以上原住民</b>、50歲以上失智、領身障證明)；長照服務方式(居家/社區/機構住宿/家照支持，無「視訊諮詢」)。WHO <b>ICOPE六指標</b>：認知、行動力、營養、視力、聽力、憂鬱(<u>失禁/失眠/疼痛皆非</u>)。PAC腦中風：急性後期早期收案、黃金復健3–6個月。</p>"}, "實證醫學與醫療品質": {"title": "實證醫學與醫療品質", "html": "<p><b>核心概念：</b>EBM 5A流程、證據階層與評讀、共享決策(SDM)、品質指標(結構/過程/結果)與根本原因分析。</p><p><b>EBM 5A：</b>Ask(PICO)→Acquire(找最佳證據)→Appraise(評讀)→Apply(應用)→Assess(評值)。評讀三面向：可信度/真確性(validity，偽陰偽陽影響此項)、臨床重要性(效應)、可應用性。</p><p><b>證據階層與工具：</b>系統回顧/RCT>世代>病例對照(不因疾病新興而降格偏好觀察性)。<b>DiCenso 6S</b>：Studies→Synopses of studies→Syntheses→Synopses of syntheses→<b>Summaries(含臨床指引)</b>→Systems。指引品質外部審查用<b>AGREE II</b>(PRISMA=系統回顧報告、ROBINS-I=非隨機偏差、GRADE=證據/建議分級)；指引須定期系統更新、不可隨意推翻、非硬性每年更新。</p><p><b>共享決策(SDM)：</b>Charles模式三階段(資訊交換→商議→決策)；<b>SHARE</b>五步(Seek邀請→Help比較選項→Assess價值偏好→Reach共決→Evaluate)；PDA用於釐清/溝通病人價值(非引導特定決策、非取代知情同意)。適用多選項/偏好敏感/不確定情境；不適用緊急救命或唯一實證作法。</p><p><b>品質指標(Donabedian)：</b>結構(人力/設備/離職率)、過程(指引遵從率/依規範執行)、結果(感染率/再入急診/跌倒/噁心嘔吐)。病安通報系統精神：自願、匿名、保密、共同學習、<b>非究責</b>。RCA：準備→時序找近端原因→危害分析→確認根本原因→改善。ARR＝對照組率−介入組率；NNT＝1/ARR。</p>"}, "癌症篩檢與預防保健": {"title": "癌症篩檢與預防保健", "html": "<p><b>核心概念：</b>國家癌症篩檢資格、預防醫學三段五級、健康信念模式。</p><p><b>國家癌症篩檢(出題當年四癌)：</b>①<b>大腸癌</b>糞便潛血(FOBT)50–74歲每2年(2025擴大45–74、40–44具家族史)②<b>口腔癌</b>30歲以上「抽菸或嚼檳榔」者每2年③<b>乳癌</b>乳房攝影45–69歲(40–44具家族史；2025擴大40–74)④<b>子宮頸癌</b>抹片30歲以上(2025擴大25歲以上)。<b>2025新增肺癌LDCT</b>(高風險)成「五癌」。<u>子宮內膜癌非國家篩檢</u>。判題訣竅：不菸不檳→無口腔癌資格。</p><p><b>子宮頸抹片：</b>建議「有性行為」女性定期；從未性行為者不需；接種HPV疫苗者仍需抹片。B、C肝篩檢：民國55年後出生滿45歲未檢者，搭配成人預防保健終身一次(HBsAg、anti-HCV)。</p><p><b>三段五級：</b>第一段(健康促進、特殊保護/疫苗)、第二段(早期診斷治療/<b>篩檢</b>)、第三段(限制殘障與復健)。乳房篩檢＝第二段(次級預防)。</p><p><b>健康信念模式(HBM)：</b>自覺罹病性/嚴重性/利益/障礙、行動線索、自我效能(皆為「個人主觀信念」)；人口學特徵與知識有無屬修飾因子。</p>"}, "健康行為與健康促進": {"title": "健康行為與健康促進", "html": "<p><b>核心概念：</b>跨理論模式(TTM)行為改變階段、戒菸(STAR/二代戒菸)、飲食指南(我的餐盤)、衛教原則。</p><p><b>TTM跨理論模式：</b>①前思考/懵懂期(6個月內無意圖)②思考/沉思期(覺察但矛盾→介入：權衡利弊、提升動機)③準備期(1個月內行動、已有小嘗試)④行動期(已改變未滿6個月)⑤維持期(逾6個月)。Pender健康促進模式：提供行動利益/成功典範＋設可達成小目標以增<b>自我效能</b>。</p><p><b>戒菸：</b>尼古丁戒斷＝情緒低落/易怒、注意力不集中、<b>失眠(非嗜睡)</b>、食慾/體重增加。<b>STAR</b>：Set戒菸日、<b>Tell告知親友求支持</b>、Anticipate預期困難、Remove移除菸品。二代戒菸：≥18歲、FTND≥4或每日≥10支；<b>孕婦/哺乳禁藥物</b>；每年補助2療程(各8週)、同機構完成、民眾須部分負擔。</p><p><b>飲食與衛教：</b>「我的餐盤」六口訣(早晚一杯奶、水果拳頭大、<b>菜比水果多一點</b>、飯跟蔬菜一樣多、豆魚蛋肉一掌心、堅果一茶匙)。高血壓生活型態：DASH降「飽和」脂肪、限鈉<6 g、規律有氧、限酒、戒菸。有氧增心肺耐力(增肌靠阻力訓練)。衛教應個別化(非依人員方便用單一法)；低健康識能用白話/回覆示教；剛確診者勿立即大量副作用衛教(增焦慮)。評量：安置性(前測)、診斷性(找困難)、形成性(歷程)、總結/確定性(成效)。</p>"}, "醫病溝通與專師角色法規": {"title": "醫病溝通與專師角色法規", "html": "<p><b>核心概念：</b>「專科護理師於醫師監督下執行醫療業務辦法」、護理人員法之專師業務範圍，以及具體有效的醫病溝通。</p><p><b>專師業務(護理人員法)：</b>護理自主業務(健康評估、預防保健衛教、護理指導諮詢)<u>不需</u>醫師監督；<b>醫療業務</b>(侵入處置、開立醫囑、傷口縫合等)須在醫師監督下依辦法執行。專師非「醫師助理」。113新增家庭科專師(社區人口群照護，<u>仍可於醫院執業</u>)。外國證照返國須重考我國證照。</p><p><b>監督下執行辦法重點：</b>機構須成立<b>委員會(副院長以上召集、醫護主管副召)</b>，核定「預立醫療流程內容」<b>及</b>標準作業程序。流程訂定內容含：病人症狀/病史/身體評估等情境或診斷、監督醫師及監督方式、回報醫師病人狀況與處置(<u>不含流行病學趨勢</u>)。監督「不以醫師親自在場為必要」；病歷須<b>24小時內</b>核簽。專師可代開：檢驗/影像醫囑、藥物處方、入院許可、留置導尿等；<b>不可代開</b>：DNR同意書、死亡證明、出院診斷證明。居家護理所亦須成立委員會(負責人召集)、機構核定流程，監督醫師可傳真簽署。是否推行流程取決醫院意願(非強制)。</p><p><b>溝通與安全：</b>具體請求＝可觀察可測量(「每天下床2次」)；清楚溝通是臨床決策基礎、傾聽與表達並重、倫理困境應正面溝通。職場暴力(家屬推倒醫護)機構<b>應通報警察並啟動保護關懷</b>(不因當事人不追究而免)。</p>"}, "健康政策與分級醫療": {"title": "健康政策與分級醫療", "html": "<p><b>核心概念：</b>緊急傷病患轉診規範、自殺防治通報，以及當前健康政策方向。</p><p><b>緊急傷病患轉診(緊急醫療救護法/轉診辦法)：</b>無法提供必要處置時，應<b>先給予穩定處置</b>、向病人/親屬說明轉診原因並取得<b>書面同意</b>、先聯繫後送醫院後轉診；<b>後送醫院不得拒絕</b>接受轉診；轉診原因/風險須記載病歷(不可省略)；救護工具與人員由醫院安排(非病患自行指定)；穩定後轉回原院須經同意。</p><p><b>自殺防治通報：</b>依精神衛生法/自殺防治法，<b>不需當事人同意</b>即通報(即時介入救命)；系統設於衛福部，地方由社區心理衛生中心承辦。</p><p><b>當前政策：</b>2024「健康台灣推動委員會」建言方向：改善醫事人員工作環境、長照3.0、健康台灣深耕計畫、強化預防與健康促進等(<u>非以控制健保總額為核心</u>)。</p>"}};
const TORDER=["醫學倫理與法律", "安寧緩和與善終", "老年醫學與長期照護", "實證醫學與醫療品質", "癌症篩檢與預防保健", "健康行為與健康促進", "醫病溝通與專師角色法規", "健康政策與分級醫療"];
const $=s=>document.querySelector(s), ce=document.getElementById('list');
let view='year', expand=false;
const years=[...new Set(Q.map(q=>q.roc_year))].sort((a,b)=>a-b);
const topics=TORDER.filter(t=>Q.some(q=>q.topic===t));
years.forEach(y=>fYear.add(new Option('民國'+y+'年',y)));
topics.forEach(t=>fTopic.add(new Option(t,t)));
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function ansText(q){
 if((q.answer_status||'').indexOf('送分')>=0) return '<span class="warn">送分（全部給分）</span>';
 if((q.answer_status||'').indexOf('多重')>=0) return '答案：'+q.accepted_answers.join('、')+'（均給分）';
 return '答案：'+q.answer;
}
function qCard(q){
 const e=E[q.id];
 const chips=['<span class="chip y">民國'+q.roc_year+'</span>',
   '<span class="chip">'+esc(q.subject_group)+(q.branch&&q.branch!=='通論'?'·'+esc(q.branch):'')+'</span>',
   '<span class="chip t">'+esc(q.topic)+'</span>'];
 if((q.answer_status||'').indexOf('送分')>=0)chips.push('<span class="chip s">送分</span>');
 if((q.answer_status||'').indexOf('多重')>=0)chips.push('<span class="chip s">多重答案</span>');
 let opts='';
 for(const k of ['A','B','C','D','E']){ if(q.options[k]!==undefined) opts+='<div class="opt" data-k="'+k+'"><b>('+k+')</b>'+esc(q.options[k])+'</div>'; }
 const img=q.img?'<img class="ecg" src="'+q.img+'" alt="附圖">':'';
 let det='';
 if(e){
   det='<div class="qk"><b>⚡ 快速解答：</b>'+esc(e.quick)+'</div>';
   if(e.detail){
     if(e.detail.background)det+='<div class="bg"><h4>📖 背景知識</h4><div>'+esc(e.detail.background)+'</div></div>';
     if(e.detail.options){det+='<div class="oabox"><h4>🔍 逐選項解析</h4>';for(const k of ['A','B','C','D','E']){if(e.detail.options[k]){var cc=(q.accepted_answers&&q.accepted_answers.indexOf(k)>=0)?' correct':'';det+='<div class="oa'+cc+'"><b>('+k+')</b> '+esc(e.detail.options[k])+'</div>';}}det+='</div>';}
     if(e.detail.sources&&e.detail.sources.length)det+='<div class="src">📚 參考來源：'+e.detail.sources.map(esc).join('；')+'</div>';
   }
 } else { det='<div class="pend">② 詳解撰寫中…</div>'; }
 return '<div class="q" data-id="'+q.id+'" data-acc="'+((q.accepted_answers&&q.accepted_answers.length?q.accepted_answers:[q.answer]).join(','))+'" data-songfen="'+(((q.answer_status||'').indexOf('送分')>=0)?1:0)+'"><div class="chips">'+chips.join('')+'</div>'+
  '<div class="stem"><span class="n">'+q.q_num+'.</span>'+esc(q.stem)+'</div>'+img+opts+
  '<div class="result"></div><button class="btn tg">看答案＋詳解 ▾</button>'+
  '<div class="ans"><div class="ansline">'+ansText(q)+(q.correction_note?'　<span style="font-size:.78rem;color:#9a6b00">（'+esc(q.correction_note)+'）</span>':'')+'</div>'+det+'</div></div>';
}
function render(){
 const fy=fYear.value, ft=fTopic.value, kw=fKw.value.trim();
 let qs=Q.filter(q=>(!fy||q.roc_year==fy)&&(!ft||q.topic===ft)&&(!kw||q.stem.indexOf(kw)>=0));
 cnt.textContent='共 '+qs.length+' 題';
 let h='';
 if(view==='year'){
   const ys=[...new Set(qs.map(q=>q.roc_year))].sort((a,b)=>a-b);
   ys.forEach(y=>{h+='<div class="grp">民國'+y+'年</div>'+qs.filter(q=>q.roc_year===y).map(qCard).join('');});
 } else {
   topics.forEach(t=>{const tq=qs.filter(q=>q.topic===t);if(!tq.length)return;
     h+='<div class="grp">'+t+'（'+tq.length+'題）</div>';
     if(L[t])h+='<div class="lec"><h3>📘 '+esc(L[t].title||t)+' 複習講義</h3>'+(L[t].html||'')+'</div>';
     h+=tq.map(qCard).join('');});
 }
 ce.innerHTML=h;
 ce.querySelectorAll('.ans').forEach(a=>a.classList.toggle('show',expand));
}
const PKEY='np_fm_v1';let PROG={},wrongOnly=false;try{PROG=JSON.parse(localStorage.getItem(PKEY))||{}}catch(e){PROG={}}function saveProg(){try{localStorage.setItem(PKEY,JSON.stringify(PROG))}catch(e){}}function updateStats(){var st=document.getElementById('stats');if(!st)return;var ks=Object.keys(PROG),a=ks.length,c=ks.filter(function(k){return PROG[k].r==='c'}).length,rt=a?Math.round(c/a*100):0;st.innerHTML=a?('已作答 <b>'+a+'</b> / '+Q.length+' 題 ・ 答對 <b>'+c+'</b> ・ 答錯 <b>'+(a-c)+'</b> ・ 答對率 <b>'+rt+'%</b><div class="bar"><i style="width:'+rt+'%"></i></div>'):'👋 點選每題的 A／B／C／D 即可作答，分數與錯題會自動保存（下次打開仍在）';}function updateWrongBtn(){var b=document.getElementById('wrongBtn');if(!b)return;var n=Object.keys(PROG).filter(function(k){return PROG[k].r==='w'}).length;b.textContent='錯題本'+(n?'（'+n+'）':'');}function fillQ(qEl,k,correct,songfen,acc){qEl.dataset.answered='1';qEl.classList.add('done');qEl.querySelectorAll('.opt').forEach(function(o){var ok=o.dataset.k;if(songfen||acc.indexOf(ok)>=0)o.classList.add('right');if(ok===k){o.classList.add('pick');if(!correct)o.classList.add('wrong');}});var r=qEl.querySelector('.result');if(r){r.className='result '+(correct?'ok':'bad');r.textContent=correct?'\u2713 正確！':'\u2717 錯誤（正確答案：'+acc.join('、')+(songfen?'，本題送分':'')+'）';}}function applyStored(qEl){var p=PROG[qEl.dataset.id];if(!p)return;fillQ(qEl,p.k,p.r==='c',qEl.dataset.songfen==='1',(qEl.dataset.acc||'').split(','));}function answerQ(opt){var qEl=opt.closest('.q');if(!qEl||qEl.dataset.answered)return;var acc=(qEl.dataset.acc||'').split(','),sf=qEl.dataset.songfen==='1',k=opt.dataset.k,correct=sf||acc.indexOf(k)>=0;fillQ(qEl,k,correct,sf,acc);PROG[qEl.dataset.id]={r:correct?'c':'w',k:k};saveProg();updateStats();updateWrongBtn();}var _origRender=render;render=function(){_origRender.apply(this,arguments);ce.querySelectorAll('.q').forEach(applyStored);ce.querySelectorAll('.lec').forEach(function(el){el.style.display=wrongOnly?'none':'';});if(wrongOnly){var grp=null,vis=false;Array.prototype.forEach.call(ce.children,function(el){if(el.classList.contains('grp')){if(grp&&!vis)grp.style.display='none';grp=el;vis=false;el.style.display='';}else if(el.classList.contains('q')){var p=PROG[el.dataset.id],s=p&&p.r==='w';el.style.display=s?'':'none';if(s)vis=true;}});if(grp&&!vis)grp.style.display='none';}updateStats();};ce.addEventListener('click',function(e){var opt=e.target.closest('.opt');if(opt&&ce.contains(opt)){answerQ(opt);return;}if(e.target.classList.contains('tg')){var a=e.target.nextElementSibling;a.classList.toggle('show');e.target.textContent=a.classList.contains('show')?'收合 ▴':'看答案＋詳解 ▾';}});(function(){var wb=document.getElementById('wrongBtn'),rb=document.getElementById('resetBtn');if(wb)wb.onclick=function(){wrongOnly=!wrongOnly;this.classList.toggle('on',wrongOnly);render();};if(rb)rb.onclick=function(){if(confirm('確定要清除所有作答紀錄、分數與錯題本嗎？此動作無法復原。')){PROG={};saveProg();wrongOnly=false;if(wb)wb.classList.remove('on');updateStats();updateWrongBtn();render();}};updateStats();updateWrongBtn();})();
