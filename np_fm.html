": "通論", "q_num": 34, "stem": "依照「病人自主權利法」,病人符合特定臨床條件,且有預立醫療決定者,醫療機構或醫師得依其預立醫療決定終止、撤除或不施行維持生命治療或人工營養及流體餵養之全部或一部份。下列條件何者不符合?", "options": {"A": "末期病人", "B": "處於不可逆轉之昏迷狀況", "C": "中度失智", "D": "永久植物人狀態"}, "needs_image": false, "answer": "C", "answer_status": "正常", "accepted_answers": ["C"], "source": "TNPA", "topic": "安寧緩和與善終", "topic_num": 2, "img": "", "correction_note": ""}, {"id": "108b-TNPA-通論-12", "roc_year": 108, "exam_tag": "108b", "subject_group": "專科護理通論", "branch": "通論", "q_num": 12, "stem": "根據「病人自主權立法」,對於「預立醫療決定書」的有效性,下列敘述何者正確?", "options": {"A": "須符合五款臨床條件之一,方可生效:末期病人、不可逆之昏迷、永久植物人、極重度失智症、其他經中央主關機關公告之重症", "B": "可以到相關窗口填寫「預立醫療決定書」便可註記到健保卡,方可生效", "C": "須經「預立醫療照護諮商」及「預立醫療決定書」簽訂,便可註記到健保卡,方可生效", "D": "須經「預立醫療照護諮商」、「預立醫療決定書」簽訂及見證或公證並上傳到中央主管機關資料庫和健保卡註記,方可生效"}, "needs_image": false, "answer": "D", "answer_status": "正常", "accepted_answers": ["D"], "source": "TNPA", "topic": "安寧緩和與善終", "topic_num": 2, "img": "", "correction_note": ""}, {"id": "108b-TNPA-通論-14", "roc_year": 108, "exam_tag": "108b", "subject_group": "專科護理通論", "branch": "通論", "q_num": 14, "stem": "「病人自主權利法」中所規定的敘述,下列何者錯誤?", "options": {"A": "立法目的在於減少無意義醫療資源的消耗、減少醫療爭議與醫療訴訟", "B": "維持生命治療:指心肺復甦術、機械式維生系統、血液製品、為特定疾病而設之專門治療、重度感染時所給予之抗生素等任何有可能延長病人生命之必要醫療措施", "C": "病人對於病情、醫療選項及各選項之可能成效與風險預後,有知情之權利;對於醫師提供之醫療選項有選擇與決定之權利", "D": "具完全行為能力之人,可以於意識清楚時決定其未來相關醫療措施,並隨時可以書面撤回或變更"}, "needs_image": false, "answer": "A", "answer_status": "正常", "accepted_answers": ["A"], "source": "TNPA", "topic": "安寧緩和與善終", "topic_num": 2, "img": "", "correction_note": ""}, {"id": "108b-TNPA-通論-6", "roc_year": 108, "exam_tag": "108b", "subject_group": "專科護理通論", "branch": "通論", "q_num": 6, "stem": "依病人自主權利法之規定,下列何種情況,醫師可不給予「人工營養及流體餵養」?", "options": {"A": "處於可逆轉昏迷狀況之病人", "B": "中度失智病人", "C": "永久植物人狀態", "D": "輕度失智病人"}, "needs_image": false, "answer": "C", "answer_status": "正常", "accepted_answers": ["C"], "source": "TNPA", "topic": "安寧緩和與善終", "topic_num": 2, "img": "", "correction_note": ""}, {"id": "109-通論-其他-51", "roc_year": 109, "subject_group": "專科護理通論", "branch": "其他", "q_num": 51, "stem": "65歲癌末病人,醫師評估其壽命最多只剩一個月,病人考慮填寫「不施行心肺復甦術」 意願書,她詢問你的意見,下列敘述何者最適當?", "options": {"A": "基於不傷害原則,告訴病人,為了不讓子女難過,應努力活下去", "B": "基於行善原則,告知陳太太現在醫療科技很發達,仍有治癒可能,勸她不要放棄", "C": "基於自主原則,如病人已充分了解「不施行心肺復甦術」的意義,應尊重她的決定", "D": "基於公平正義原則,病人已無治癒希望,繼續施予治療,恐也是無效醫療,應避免醫療資源浪費,故應尊重病人之決定"}, "needs_image": false, "answer": "C", "answer_status": "正常", "accepted_answers": ["C"], "source_pdf": "109_通論_其他_Q.pdf", "exam_tag": "109", "source": "MOHW", "topic": "安寧緩和與善終", "topic_num": 2, "img": "", "correction_note": ""}, {"id": "110-通論-其他-20", "roc_year": 110, "subject_group": "專科護理通論", "branch": "其他", "q_num": 20, "stem": "預立醫療決定者,醫療機構或醫師得依其預立醫療決定終止、撤除或不施行維持生命治療或人工營養及流體餵養,下列臨床條件何者未符合病人自主權利法的規定?", "options": {"A": "肺癌末期病人", "B": "永久植物人狀態", "C": "不可逆轉之昏迷狀況", "D": "罕見疾病病童"}, "needs_image": false, "answer": "D", "answer_status": "正常", "accepted_answers": ["D"], "source_pdf": "110_通論_其他_Q.pdf", "exam_tag": "110", "source": "MOHW", "topic": "安寧緩和與善終", "topic_num": 2, "img": "", "correction_note": ""}, {"id": "111-通論-5分科-22", "roc_year": 111, "subject_group": "專科護理通論", "branch": "5分科", "q_num": 22, "stem": "有關啟動與執行「預立醫療決定」之敘述,下列何者不符合條件標準?", "options": {"A": "臨床失智評估表 ( clinical dementia rate, CDR ) 得分 3 分者", "B": "三個月前車禍致嚴重腦傷,格拉斯哥昏迷指數 ( GCS ) 3 分者", "C": "腦梗塞後六個月,格拉斯哥昏迷指數 ( GCS ) 3 分者", "D": "阿茲海默症功能性評估量表 (functional assessment staging test, FAST ) 得分 8 分者"}, "needs_image": false, "answer": "B", "answer_status": "正常", "accepted_answers": ["B"], "source_pdf": "111_通論_5分科_Q.pdf", "exam_tag": "111", "source": "MOHW", "topic": "安寧緩和與善終", "topic_num": 2, "img": "", "correction_note": ""}, {"id": "111-通論-5分科-26", "roc_year": 111, "subject_group": "專科護理通論", "branch": "5分科", "q_num": 26, "stem": "病人符合下列臨床條件之一,且有預立醫療決定者,醫療機構或醫師得依其預立醫療決定終止、撤除或不施行維持生命治療或人工營養及流體餵養之全部或一部,下列何者錯誤?", "options": {"A": "由二位與該疾病診斷或治療相關之專科醫師確診之末期病人", "B": "不可逆轉之昏迷狀況,若因外傷所致,其意識超過三個月無恢復跡象", "C": "永久植物人狀態,若因外傷所致,其植物人狀態超過六個月無改善跡象", "D": "極重度失智,臨床失智評估量表( clinical dementia rate, CDR ) 達三分以上"}, "needs_image": false, "answer": "AB", "answer_status": "多重答案(均給分)", "accepted_answers": ["A", "B"], "source_pdf": "111_通論_5分科_Q.pdf", "exam_tag": "111", "source": "MOHW", "topic": "安寧緩和與善終", "topic_num": 2, "img": "", "correction_note": ""}, {"id": "112-通論-其他-19", "roc_year": 112, "subject_group": "專科護理通論", "branch": "其他", "q_num": 19, "stem": "依據「病人自主權利法」,病人符合下列臨床條件之一,且有預立醫療決定者,醫療機構或醫師得依其預立醫療決定終止、撤除或不施行維持生命治療或人工營養及流體餵養之全部或一部,以下何者錯誤?", "options": {"A": "處於不可逆轉之昏迷狀況", "B": "極重度失智", "C": "永久植物人狀態", "D": "無法治癒的罕見疾病"}, "needs_image": false, "answer": "D", "answer_status": "正常", "accepted_answers": ["D"], "source_pdf": "112_通論_其他_Q.pdf", "exam_tag": "112", "source": "MOHW", "topic": "安寧緩和與善終", "topic_num": 2, "img": "", "correction_note": ""}, {"id": "112-進階-內科-79", "roc_year": 112, "subject_group": "進階專科護理", "branch": "內科", "q_num": 79, "stem": "病人臨終前給予緩和性鎮靜 ( palliative sedation ) 之敘述,下列何者正確?", "options": {"A": "主要是減輕臨終病人疼痛、呼吸困難、激動性譫妄及抽筋等嚴重且難治之症狀", "B": "緩和性鎮靜可能會加速病人的死亡歷程", "C": "不宜停止輸注神經肌肉阻斷劑,以免病人呼吸不順", "D": "開始使用時機為臨終前 1 - 2 週"}, "needs_image": false, "answer": "A", "answer_status": "正常", "accepted_answers": ["A"], "source_pdf": "112_進階_內科_Q.pdf", "exam_tag": "112", "source": "MOHW", "topic": "安寧緩和與善終", "topic_num": 2, "img": "", "correction_note": ""}, {"id": "113-通論-5分科-14", "roc_year": 113, "subject_group": "專科護理通論", "branch": "5分科", "q_num": 14, "stem": "80 歲重度失智女性病人因嚴重肺炎住院,目前持續高燒、呼吸費力且意識不清,醫師建議做肺部電腦斷層檢查,2 位兒子對此意見不一,大兒子質疑檢查的必要性及不想再讓媽媽接受不必要的醫療,但小兒子則認為不應該放棄任何醫療的努力。下列何者是解決此困境之最佳處理方式?", "options": {"A": "重度失智合併嚴重肺炎且危及生命,符合安寧緩和治療要件,應聽從大兒子意見,不再施行無效醫療", "B": "2 位兒子在民法上代理決策地位相等,為把握治療時效,先請小兒子簽同意書然後安排檢查", "C": "雙方意見不一致,可由主治醫師召開家庭會議,解釋病情變化、檢查理由及後續可能的治療方式,尋求共識", "D": "基於病人自主,雖然病人重度失智,仍應由病人簽署檢查同意書,才能讓病人主動配合治療計畫"}, "needs_image": false, "answer": "C", "answer_status": "正常", "accepted_answers": ["C"], "source_pdf": "113_通論_5分科_Q.pdf", "exam_tag": "113", "source": "MOHW", "topic": "安寧緩和與善終", "topic_num": 2, "img": "", "correction_note": ""}, {"id": "113-通論-5分科-21", "roc_year": 113, "subject_group": "專科護理通論", "branch": "5分科", "q_num": 21, "stem": "依據民國 110 年 1 月 20 日「病人自主權利法」所規範之「預立醫療決定」簽署,下列何者錯誤?", "options": {"A": "預立醫療決定書完成後註記於全民健康保險憑證,即具有撤除維生醫療之效力", "B": "具完全行為能力者,得為預立醫療決定,並得隨時以書面撤回或變更之", "C": "須經醫療機構提供預立醫療照護諮商,並經其於預立醫療決定上核章證明", "D": "須經公證人公證或有具完全行為能力者二人以上在場見證"}, "needs_image": false, "answer": "A", "answer_status": "正常", "accepted_answers": ["A"], "source_pdf": "113_通論_5分科_Q.pdf", "exam_tag": "113", "source": "MOHW", "topic": "安寧緩和與善終", "topic_num": 2, "img": "", "correction_note": ""}, {"id": "113-通論-家庭-17", "roc_year": 113, "subject_group": "專科護理通論", "branch": "家庭", "q_num": 17, "stem": "關於「病人自主權利法」,下列敘述何者正確?", "options": {"A": "醫療委任代理人有 3 人時,應以多數決的方式做決策", "B": "可適用於末期病人、極重度失智、永久植物人狀態等病人", "C": "二親等內之親屬死亡、失蹤時,得不經預立醫療照護諮商,由病人直接簽署預立醫療決策", "D": "可有效保障簽署預立醫療決策的意願人及代為簽署的家人"}, "needs_image": false, "answer": "B", "answer_status": "正常", "accepted_answers": ["B"], "source_pdf": "113_通論_家庭_Q.pdf", "exam_tag": "113", "source": "MOHW", "topic": "安寧緩和與善終", "topic_num": 2, "img": "", "correction_note": ""}, {"id": "113-通論-家庭-24", "roc_year": 113, "subject_group": "專科護理通論", "branch": "家庭", "q_num": 24, "stem": "病人單身、無親屬,此次住院發現為輕度失智,發病前曾簽署預立安寧緩和醫療暨維生醫療抉擇意願書,表達於失智惡化至無法生活自理時,不願意接受人工營養,並向專科護理師提出確立自主意願諮詢,此時下列何種做法最為適當?", "options": {"A": "已簽署預立安寧緩和醫療暨維生醫療抉擇意願書,即等同不願接受人工營養的意願", "B": "儘快進行預立醫療照護諮商,重新簽署預立醫療決定書,註記不接受人工營養選擇", "C": "無親屬可出席預立醫療照護諮商,可由指定醫療委任代理人見證,進行預立醫療決定書簽署", "D": "屬心智缺損狀態,不適用預立醫療照護諮商條件,可由醫療委任代理人於疾病末期, 簽署不施行維生醫療同意書"}, "needs_image": false, "answer": "B", "answer_status": "正常", "accepted_answers": ["B"], "source_pdf": "113_通論_家庭_Q.pdf", "exam_tag": "113", "source": "MOHW", "topic": "安寧緩和與善終", "topic_num": 2, "img": "", "correction_note": ""}, {"id": "113-進階-內科-12", "roc_year": 113, "subject_group": "進階專科護理", "branch": "內科", "q_num": 12, "stem": "68 歲末期癌症病人經常抱怨骨頭痛,夜間出現間歇性疼痛,疼痛指數由 4 分加劇到 8 分。 下列何種輔助止痛藥物對此病人最合適?", "options": {"A": "三環類抗憂鬱藥 ( tricyclic antidepressants )", "B": "降鈣素 ( calcitonin )", "C": "抗癲癇藥 ( anticonvulsants )", "D": "類固醇 ( corticosteroids )"}, "needs_image": false, "answer": "B", "answer_status": "正常", "accepted_answers": ["B"], "source_pdf": "113_進階_內科_Q.pdf", "exam_tag": "113", "source": "MOHW", "topic": "安寧緩和與善終", "topic_num": 2, "img": "", "correction_note": ""}, {"id": "113-進階-家庭-13", "roc_year": 113, "subject_group": "進階專科護理", "branch": "家庭", "q_num": 13, "stem": "當末期病人處於哀傷的震驚與否認期時,下列措施何者最適當?", "options": {"A": "以溫和堅定立場提供資訊,協助病人面對疾病末期的事實", "B": "當病人出現負面情緒時,應加以制止情緒表達", "C": "告知病人不要想太多,有治療就會有好轉的機會", "D": "集中護理,避免主動探視及外界干擾"}, "needs_image": false, "answer": "A", "answer_status": "正常", "accepted_answers": ["A"], "source_pdf": "113_進階_家庭_Q.pdf", "exam_tag": "113", "source": "MOHW", "topic": "安寧緩和與善終", "topic_num": 2, "img": "", "correction_note": ""}, {"id": "114-通論-5分科-7", "roc_year": 114, "subject_group": "專科護理通論", "branch": "5分科", "q_num": 7, "stem": "對 84 歲肺癌第三期病人與家屬進行預立醫療指示 ( advance care planning, ACP ) 諮詢,下列執行過程何者較不適當?", "options": {"A": "除病人外,需有三親等內親屬 ( 至少1 人 ) 參加", "B": "協助病人與家屬釐清資訊不清、焦慮與治療抉擇困難", "C": "與病人討論感受與目標,提供緩和醫療資源資訊", "D": "ACP 的立法目的是為了尊重病人醫療自主意願"}, "needs_image": false, "answer": "A", "answer_status": "正常", "accepted_answers": ["A"], "source_pdf": "114_通論_5分科_Q.pdf", "exam_tag": "114", "source": "MOHW", "topic": "安寧緩和與善終", "topic_num": 2, "img": "", "correction_note": ""}, {"id": "106-106a-通論-38", "roc_year": 106, "exam_tag": "106-106a", "subject_group": "專科護理通論", "branch": "通論", "q_num": 38, "stem": "對阿茲海默症及老年人憂鬱症進行鑑別診斷時,下列何者較常出現於老年憂鬱症的病人?", "options": {"A": "常常抱怨自己會出現認知方面的問題", "B": "病程進展較為緩慢", "C": "自己不知道答案的問題,也會試著盡量回答", "D": "不會因認知障礙造成日常生活的困擾"}, "needs_image": false, "answer": "A", "answer_status": "正常", "accepted_answers": ["A"], "source": "TNPA", "topic": "老年醫學與長期照護", "topic_num": 3, "img": "", "correction_note": ""}, {"id": "107-TNPA-通論-5", "roc_year": 107, "exam_tag": "107", "subject_group": "專科護理通論", "branch": "通論", "q_num": 5, "stem": "王女士 88 歲,喪偶三年,目前獨居。因不明原因發燒入院,經檢查治療後情況改善,即將出院。專科護理師前來關心,王女士低著頭面無表情地說「活到這把年紀,我很知足,一切順其自然,不用再花時間在我身上了。」專科護理師的回應最恰當的是?", "options": {"A": "這樣高齡能自理生活真是很不容易,請繼續維持,有事再找我好嗎?", "B": "國家推動的長照 2.0 政策,就是要照顧像您這樣的對象,需要跟您說明一下嗎?", "C": "對於身後事您有什麼想法,需要幫您安排經驗豐富合約公司代表跟您諮詢嗎?", "D": "您說到很知足,可是我觀察到您看起來好像有心事,願意談談嗎?"}, "needs_image": false, "answer": "D", "answer_status": "正常", "accepted_answers": ["D"], "source": "TNPA", "topic": "老年醫學與長期照護", "topic_num": 3, "img": "", "correction_note": ""}, {"id": "107-TNPA-通論-68", "roc_year": 107, "exam_tag": "107", "subject_group": "專科護理通論", "branch": "通論", "q_num": 68, "stem": "有關預防醫院內跌倒事件之護理措施,下列敘述何者正確? 1 老人及術後病人需使用床欄 2 浴缸內應放置止滑墊 3 老人居住的病室,可放置一小塊地毯於浴室門口,以防腳底濕滑而跌倒 4 老人居住之病室光線宜昏暗些,以利休息", "options": {"A": "34", "B": "24", "C": "12", "D": "13"}, "needs_image": false, "answer": "C", "answer_status": "正常", "accepted_answers": ["C"], "source": "TNPA", "topic": "老年醫學與長期照護", "topic_num": 3, "img": "", "correction_note": ""}, {"id": "107-TNPA-通論-69", "roc_year": 107, "exam_tag": "107", "subject_group": "專科護理通論", "branch": "通論", "q_num": 69, "stem": "有關強化健康老年人之肌力,下列敘述何者最不恰當?", "options": {"A": "避免負荷比平常所能承受的更高重量,以防造成傷害", "B": "採漸進性原則,每次訓練的強度須從低至高、次數由少變多", "C": "若要提升下肢肌力,必須進行股四頭肌等的下肢肌群訓練", "D": "身體活動量足夠且體能佳者,肌力強化活動可比照成年人的建議內容"}, "needs_image": false, "answer": "A", "answer_status": "正常", "accepted_answers": ["A"], "source": "TNPA", "topic": "老年醫學與長期照護", "topic_num": 3, "img": "", "correction_note": ""}, {"id": "107-TNPA-通論-73", "roc_year": 107, "exam_tag": "107", "subject_group": "專科護理通論", "branch": "通論", "q_num": 73, "stem": "有關老年人的多重共病症、多重用藥與用藥安全,下列敘述何者為非?", "options": {"A": "多重藥物治療在使用藥物種類上,一般公認之定義是同時使用 5 種以上之藥物", "B": "多重藥物治療會增加藥物副作用出現,易誤認為新的症狀,而開立其他藥物進行治療", "C": "老年人罹患多重慢性病時,應依照各種疾病之治療指引,開立所有需要使用之藥物", "D": "評估老人用藥安全時,也應加入草藥及營養補充品之部分"}, "needs_image": false, "answer": "C", "answer_status": "正常", "accepted_answers": ["C"], "source": "TNPA", "topic": "老年醫學與長期照護", "topic_num": 3, "img": "", "correction_note": ""}, {"id": "108b-TNPA-通論-64", "roc_year": 108, "exam_tag": "108b", "subject_group": "專科護理通論", "branch": "通論", "q_num": 64, "stem": "肌少症篩檢包括以下哪些項目? 1柔軟度下降 2握力下降 3肌肉質量減少 4行動力下降", "optio  "accepted_answers": ["C"], "source_pdf": "111_通論_5分科_Q.pdf", "exam_tag": "111", "source": "MOHW", "topic": "老年醫學與長期照護", "topic_num": 3, "img": "", "correction_note": ""}, {"id": "111-通論-5分科-41", "roc_year": 111, "subject_group": "專科護理通論", "branch": "5分科", "q_num": 41, "stem": "依據世界衛生組織 ( WHO ) 「長者整合性照護指引 (integrated care for older people, ICOPE ) 」,希望幫助長者及早發現可能導致失能的風險因子,其六大功能指標,不包含下列何者?", "options": {"A": "認知", "B": "營養", "C": "聽力", "D": "失禁"}, "needs_image": false, "answer": "D", "answer_status": "正常", "accepted_answers": ["D"], "source_pdf": "111_通論_5分科_Q.pdf", "exam_tag": "111", "source": "MOHW", "topic": "老年醫學與長期照護", "topic_num": 3, "img": "", "correction_note": ""}, {"id": "112-通論-其他-34", "roc_year": 112, "subject_group": "專科護理通論", "branch": "其他", "q_num": 34, "stem": "根據亞洲肌少症工作小組(Asian Working Group for Sarcopenia, AWGS)在2019 年發表之共識更新版,有關肌少症診斷標準,下列敘述何者錯誤?", "options": {"A": "小腿圍、SARC – F 或SARC - CalF 問卷為目標常用的篩檢工具", "B": "肌少症嚴重度分級目前分為:可能肌少症、肌少症、嚴重肌少症三級", "C": "SARC - F 是以病人的主觀評量,包含力量、行走、起身、登階、跌倒五個項目", "D": "女性小腿圍小於 33 cm,男性小於 36 cm,即代表身體肌肉量不足"}, "needs_image": false, "answer": "D", "answer_status": "正常", "accepted_answers": ["D"], "source_pdf": "112_通論_其他_Q.pdf", "exam_tag": "112", "source": "MOHW", "topic": "老年醫學與長期照護", "topic_num": 3, "img": "", "correction_note": ""}, {"id": "112-通論-其他-37", "roc_year": 112, "subject_group": "專科護理通論", "branch": "其他", "q_num": 37, "stem": "有關跌倒篩檢之評估項目,下列何者最能預測老人日後跌倒之機率?", "options": {"A": "坐姿起立時是否需要用手幫忙撐住", "B": "過去一年是否曾經跌倒過", "C": "在家走路時是否需要扶著家具來維持平衡", "D": "是否有吃安眠藥或讓心情比較好的藥"}, "needs_image": false, "answer": "B", "answer_status": "正常", "accepted_answers": ["B"], "source_pdf": "112_通論_其他_Q.pdf", "exam_tag": "112", "source": "MOHW", "topic": "老年醫學與長期照護", "topic_num": 3, "img": "", "correction_note": ""}, {"id": "112-通論-其他-39", "roc_year": 112, "subject_group": "專科護理通論", "branch": "其他", "q_num": 39, "stem": "為提供安全的醫療環境,預防病人跌倒及降低傷害程度,下列何者不適當?", "options": {"A": "將病人可能使用的物品,如:輔具、眼鏡等,置於病人隨手可得之處", "B": "下床時可提供家屬使用移位固定帶", "C": "浴廁加  "MOHW", "topic": "老年醫學與長期照護", "topic_num": 3, "img": "", "correction_note": ""}, {"id": "115-通論-5分科-58", "roc_year": 115, "exam_tag": "115", "subject_group": "專科護理通論", "branch": "5分科", "q_num": 58, "stem": "有關社區高齡者視力障礙之照護,下列何者錯誤?", "options": {"A": "青光眼多可於早期自行察覺,故可待出現症狀再就醫", "B": "糖尿病病人縱使無視力症狀,仍建議定期接受眼底檢查", "C": "視力障礙可能增加高齡者跌倒、憂鬱及失能之風險", "D": "白內障為高齡者常見且可治療之視力障礙原因之一"}, "needs_image": false, "answer": "A", "answer_status": "正常", "accepted_answers": ["A"], "source": "MOHW", "topic": "老年醫學與長期照護", "topic_num": 3, "img": "", "correction_note": ""}, {"id": "115-通論-5分科-71", "roc_year": 115, "exam_tag": "115", "subject_group": "專科護理通論", "branch": "5分科", "q_num": 71, "stem": "現行臺灣急診檢傷與急迫度分級量表 ( TTAS) 將急診病人分為幾個等級?", "options": {"A": "3", "B": "4", "C": "5", "D": "6"}, "needs_image": false, "answer": "C", "answer_status": "正常", "accepted_answers": ["C"], "source": "MOHW", "topic": "健康政策與分級醫療", "topic_num": 8, "img": "", "correction_note": ""}, {"id": "115-通論-麻醉-1", "roc_year": 115, "exam_tag": "115", "subject_group": "專科護理通論", "branch": "麻醉", "q_num": 1, "stem": "根據 113 年 3 月 12 日發布「專科護理師於醫師監督下執行醫療業務辦法」,專科護理師 ( 以下簡稱專師) 執行職務的範疇,下列敘述何者最不適當?", "options": {"A": "專師得自行開立藥物處方供藥師調劑,可事後請醫師核簽", "B": "醫院未訂定該項預立流程,專師就不得代為開立相關醫囑表單", "C": "專師得於醫師監督下,執行未及於肌肉及肌腱之表層傷口縫合", "D": "專師得於病歷製作紀錄並署名,其執業紀錄性質仍屬護理紀錄"}, "needs_image": false, "answer": "A", "answer_status": "正常", "accepted_answers": ["A"], "source": "MOHW", "topic": "醫病溝通與專師角色法規", "topic_num": 7, "img": "", "correction_note": ""}, {"id": "115-通論-麻醉-2", "roc_year": 115, "exam_tag": "115", "subject_group": "專科護理通論", "branch": "麻醉", "q_num": 2, "stem": "根據「專科護理師於醫師監督下執行醫療業務辦法」,下列何者對醫師監督之敘述最適當?", "options": {"A": "必須全程在病人床邊監督", "B": "必須於同一病房內監督", "C": "不限於親自在場,可採指示、指導或督促方式", "D": "僅能採電話監督"}, "needs_image": false, "answer": "C", "answer_status": "正常", "accepted_answers": ["C"], "source": "MOHW", "topic": "醫病溝通與專師角色法規", "topic_num": 7, "img": "", "correction_note": ""}, {"id": "115-通論-麻醉-3", "roc_year": 115, "exam_tag": "115", "subject_group": "專科護理通論", "branch": "麻醉", "q_num": 3, "stem": "有關專師執行預立醫療流程中的「檢驗、檢查之開立」之法律規範限制,下列敘述何者正確?", "options": {"A": "只要醫師於事後 72 小時內補簽名即合法化", "B": "專師可不分科別開立任何檢驗項目", "C": "核對、簽署及記錄,護理機構得以資通訊或傳真方式為之", "D": "高輻射劑量檢查,如電腦斷層則禁止列入流程"}, "needs_image": false, "answer": "C", "answer_status": "正常", "accepted_answers": ["C"], "source": "MOHW", "topic": "醫病溝通與專師角色法規", "topic_num": 7, "img": "", "correction_note": ""}, {"id": "115-通論-麻醉-4", "roc_year": 115, "exam_tag": "115", "subject_group": "專科護理通論", "branch": "麻醉", "q_num": 4, "stem": "根據「專科護理師於醫師監督下執行醫療業務辦法」,下列何者最不符合?", "options": {"A": "開立全靜脈營養輸液", "B": "執行病人鼻胃管置放", "C": "安排上消化道內視鏡", "D": "執行中央靜脈導管置放"}, "needs_image": false, "answer": "D", "answer_status": "正常", "accepted_answers": ["D"], "source": "MOHW", "topic": "醫病溝通與專師角色法規", "topic_num": 7, "img": "", "correction_note": ""}, {"id": "115-通論-麻醉-5", "roc_year": 115, "exam_tag": "115", "subject_group": "專科護理通論", "branch": "麻醉", "q_num": 5, "stem": "病人接受腹腔手術後,腹部引流管引流不順,疑有阻塞情形。根據「專科護理師於醫師監督下執行醫療業務辦法」,下列何者不是專師得執行之業務?", "options": {"A": "腹腔引流液數值判讀", "B": "腹腔引流管置換", "C": "給予家屬病況說明", "D": "製作病歷相關紀錄"}, "needs_image": false, "answer": "B", "answer_status": "正常", "accepted_answers": ["B"], "source": "MOHW", "topic": "醫病溝通與專師角色法規", "topic_num": 7, "img": "", "correction_note": ""}, {"id": "115-通論-麻醉-6", "roc_year": 115, "exam_tag": "115", "subject_group": "專科護理通論", "branch": "麻醉", "q_num": 6, "stem": "有關專師進行癌末病人安寧緩和決策諮詢時的態度,下列何者不適當?", "options": {"A": "要求病人遵從醫囑,以降低病人家屬決策困難", "B": "應以坦誠的心態進行諮詢,增加互相理解", "C": "要有耐心,避免緊迫性的溝通", "D": "應評估適當時機給予病人家屬合理的情緒宣洩"}, "needs_image": false, "answer": "A", "answer_status": "正常", "accepted_answers": ["A"], "source": "MOHW", "topic": "安寧緩和與善終", "topic_num": 2, "img": "", "correction_note": ""}, {"id": "115-通論-麻醉-7", "roc_year": 115, "exam_tag": "115", "subject_group": "專科護理通論", "branch": "麻醉", "q_num": 7, "stem": "有關專師的自主專業定位與價值,下列敘述何者最適當?", "options": {"A": "依醫囑逐項理解交辦事項,並正確執行護理技術", "B": "負責病房排班、有效溝通及耗材管理等行政庶務", "C": "協助醫師安排檢查,並委婉轉達檢查結果給家屬", "D": "正確評估病人問題,擬定並追蹤個別化照護計畫"}, "needs_image": false, "answer": "D", "answer_status": "正常", "accepted_answers": ["D"], "source": "MOHW", "topic": "醫病溝通與專師角色法規", "topic_num": 7, "img": "", "correction_note": ""}, {"id": "115-通論-麻醉-8", "roc_year": 115, "exam_tag": "115", "subject_group": "專科護理通論", "branch": "麻醉", "q_num": 8, "stem": "病人家屬看到一名正在評估病情並執行醫療業務的專師,因其未配戴可辨識身分的識別證, 遂向醫院反映醫療人員身分不明。護理部調查後發現,該專師當天因更換制服而未配戴識別證。根據「專科護理師於醫師監督下執行醫療業務辦法」,下列何者最適當?", "options": {"A": "有執業執照,即使未配戴識別標誌亦不影響執行醫療業務", "B": "執行侵入性醫療處置時,才須配戴可識別身分之標誌", "C": "是否配戴身分標誌由各醫療機構自行決定,法規未明文規定", "D": "執行醫療業務時,應配戴或顯示足以識別其身分之標誌"}, "needs_image": false, "answer": "D", "answer_status": "正常", "accepted_answers": ["D"], "source": "MOHW", "topic": "醫病溝通與專師角色法規", "topic_num": 7, "img": "", "correction_note": ""}, {"id": "115-通論-麻醉-9", "roc_year": 115, "exam_tag": "115", "subject_group": "專科護理通論", "branch": "麻醉", "q_num": 9, "stem": "規劃糖尿病病人使用筆型胰島素之衛教計畫時,若依據 Bloom 的教學目標分類,「病人能表達對疾病自我管理之重視與正向態度」屬於下列哪一個領域?", "options": {"A": "社會領域", "B": "認知領域", "C": "技能領域", "D": "情意領域"}, "needs_image": false, "answer": "D", "answer_status": "正常", "accepted_answers": ["D"], "source": "MOHW", "topic": "健康行為與健康促進", "topic_num": 6, "img": "", "correction_note": ""}, {"id": "115-通論-麻醉-10", "roc_year": 115, "exam_tag": "115", "subject_group": "專科護理通論", "branch": "麻醉", "q_num": 10, "stem": "主治醫師上午查房時表示:「下午若引流量持續少於 50 mL,即可依預立醫療流程拔除胸管。」下午評估時,引流量為 30 mL,惟病人出現呼吸急促、血氧由 98 % 下降至 88 %, 並主訴胸痛。此時專師最適當之處置為何?", "options": {"A": "引流量已符合標準,應依預立醫療流程拔除胸管", "B": "先拔除胸管,再回報醫師拔管前出現之新症狀", "C": "為維持醫療效率,可與護理師共同評估並拔除胸管", "D": "病人臨床狀況已改變,應停止執行流程並立即回報監督醫師"}, "needs_image": false, "answer": "D", "answer_status": "正常", "accepted_answers": ["D"], "source": "MOHW", "topic": "醫病溝通與專師角色法規", "topic_num": 7, "img": "", "correction_note": ""}, {"id": "115-通論-麻醉-11", "roc_year": 115, "exam_tag": "115", "subject_group": "專科護理通論", "branch": "麻醉", "q_num": 11, "stem": "病人因腦中風入院,目前重度昏迷,醫師評估已無醫療決策能力。大兒子主張「一定要插管、急救到底,不放棄任何希望!」而小女兒則痛哭表示「爸爸以前說過,如果變植物人絕對不要急救!」因家屬遲遲未能產生共識,身為專師,此時之首要處置何者最適當?", "options": {"A": "請家屬自行協調取得共識後再通知醫療團隊,期間仍給予相關維生治療", "B": "主動安排家庭會議,由醫療團隊及家屬共同參與,討論病人可能的意願", "C": "若家屬意見不一致時,即依照病人最佳利益給予最適切的相關治療", "D": "依照法律規定,當下應以其配偶之意見為考量"}, "needs_image": false, "answer": "B", "answer_status": "正常", "accepted_answers": ["B"], "source": "MOHW", "topic": "醫學倫理與法律", "topic_num": 1, "img": "", "correction_note": ""}, {"id": "115-通論-麻醉-12", "roc_year": 115, "exam_tag": "115", "subject_group": "專科護理通論", "branch": "麻醉", "q_num": 12, "stem": "專師經專業判斷認為使用親水性敷料較適合,但主治醫師仍堅持使用傳統換藥方式,雙方在病人傷口處置上意見分歧。下列哪一種溝通方式最符合正向、尊重與雙向溝通原則?", "options": {"A": "完全尊重醫師指示以避免團隊氣氛尷尬", "B": "私下鼓勵病人向主治醫師提出更換敷料", "C": "提出相關實證文獻與傷口評估紀錄討論", "D": "向病人說明兩種換藥方式讓其自行決定"}, "needs_image": false, "answer": "C", "answer_status": "正常", "accepted_answers": ["C"], "source": "MOHW", "topic": "醫病溝通與專師角色法規", "topic_num": 7, "img": "", "correction_note": ""}, {"id": "115-通論-麻醉-13", "roc_year": 115, "exam_tag": "115", "subject_group": "專科護理通論", "branch": "麻醉", "q_num": 13, "stem": "擬設計一套「慢性阻塞性肺病之定量噴霧 / 乾粉吸入器之操作」的教案,針對識字能力較低的高齡個案,下列何種教學方法最能達到學習目標?", "options": {"A": "可安排團體衛教口頭講述", "B": "可提供影音光碟影片觀看", "C": "使用回覆示教法進行指導", "D": "將衛教資料中的文字放大"}, "needs_image": false, "answer": "C", "answer_status": "正常", "accepted_answers": ["C"], "source": "MOHW", "topic": "健康行為與健康促進", "topic_num": 6, "img": "", "correction_note": ""}, {"id": "115-通論-麻醉-14", "roc_year": 115, "exam_tag": "115", "subject_group": "專科護理通論", "branch": "麻醉", "q_num": 14, "stem": "專師需符合「專科護理師分科及甄審辦法」之要求,接受繼續教育課程以提升能力,下列敘述何者錯誤?", "options": {"A": "各類進修課程 ( 含研究所學分) 之積分採計可完全折抵", "B": "一般護理師繼續教育課程積分不能抵專師的課程積分", "C": "感染控制及性別議題之課程積分應達 12 點以上", "D": "繼續教育課程包括專業、品質、醫事倫理及醫事法規四類"}, "needs_image": false, "answer": "A", "answer_status": "正常", "accepted_answers": ["A"], "source": "MOHW", "topic": "醫病溝通與專師角色法規", "topic_num": 7, "img": "", "correction_note": ""}, {"id": "115-通論-麻醉-15", "roc_year": 115, "exam_tag": "115", "subject_group": "專科護理通論", "branch": "麻醉", "q_num": 15, "stem": "根據台灣現行護理人員法及相關辦法,有關專師的角色定位與其得執行之業務範圍,下列敘述何者正確?", "options": {"A": "護理指導及諮詢屬醫療輔助 ": "昨天剛從急診入院,過去有慢性阻塞性肺疾病病史", "C": "兩側肺底部有明顯爆裂音,懷疑有急性肺水腫狀況", "D": "建議您立即來看病人,並開立緊急胸部 X 光檢查與動脈血氣體分析"}, "needs_image": false, "answer": "C", "answer_status": "正常", "accepted_answers": ["C"], "source": "MOHW", "topic": "醫病溝通與專師角色法規", "topic_num": 7, "img": "", "correction_note": ""}, {"id": "115-通論-麻醉-20", "roc_year": 115, "exam_tag": "115", "subject_group": "專科護理通論", "branch": "麻醉", "q_num": 20, "stem": "80 歲女性病人因尿路感染合併敗血症住院,家屬在會客時情緒激動地抱怨:「為什麼我媽發燒這麼久都沒退?你們到底有沒有在治療?」專師運用同理心與溝通協調技巧,下列回應何者最適當?", "options": {"A": "敗血症本來就會持續發燒,抗生素發揮作用需要時間,請您耐心等待", "B": "聽起來您對媽媽持續發燒感到焦慮,我們來討論目前的治療計畫與預期狀況", "C": "您先不要激動,我們已經給予最高階的抗生素,請相信醫療團隊的專業", "D": "不太能理解您的不滿,我會請主治醫師來向您解釋清楚以免產生誤會"}, "needs_image": false, "answer": "B", "answer_status": "正常", "accepted_answers": ["B"], "source": "MOHW", "topic": "醫病溝通與專師角色法規", "topic_num": 7, "img": "", "correction_note": ""}, {"id": "115-通論-麻醉-21", "roc_year": 115, "exam_tag": "115", "subject_group": "專科護理通論", "branch": "麻醉", "q_num": 21, "stem": "50 歲病人剛被主治醫師明確告知確診為晚期肺癌。主治醫師查房離開後,專師進入病房欲進行後續治療計畫的溝通與衛教。病人突然對專師大發雷霆,強烈抱怨病房冷氣太冷、 護理人員動作太慢,並拒絕聽取任何衛教資訊。病人因不敢向權威的醫師表達憤怒,而將情緒發洩在專師身上,造成嚴重的溝通阻礙,此為何種心理防衛機轉?", "options": {"A": "投射作用 ( projection)", "B": "替代作用 ( displacement)", "C": "反向作用 ( reaction formation)", "D": "合理化 ( rationalization)"}, "needs_image": false, "answer": "B", "answer_status": "正常", "accepted_answers": ["B"], "source": "MOHW", "topic": "醫病溝通與專師角色法規", "topic_num": 7, "img": "", "correction_note": ""}, {"id": "115-通論-麻醉-22", "roc_year": 115, "exam_tag": "115", "subject_group": "專科護理通論", "branch": "麻醉", "q_num": 22, "stem": "根據「菸害防制法」現行規定及部分條文修正草案,有關於類菸品管理之敘述,下列何者正確?", "options": {"A": "未滿 20 歲者使用類菸品,處較成年人更高罰鍰", "B": "無償供應類菸品予親友,不受本法處罰", "C": "修正草案增訂違法類菸品沒入銷毀規定", "D": "網際網路業者無須管理違法類菸品資訊"}, "needs_image": false, "answer": "C", "answer_status": "正常", "accepted_answers": ["C"], "source": "MOHW", "topic": "健康政策與分級醫療", "topic_num": 8, "img": "", "correction_note": ""}, {"id": "115-通論-麻醉-23", "roc_year": 115, "exam_tag": "115", "subject_group": "專科護理通論", "bra 者錯誤?", "options": {"A": "可不告知病人為之", "B": "強制社區治療期間不得逾 6 個月", "C": "由精神疾病強制社區治療委員會審理", "D": "可請消防機關協助載送病人至醫院接受治療"}, "needs_image": false, "answer": "A", "answer_status": "正常", "accepted_answers": ["A"], "source": "MOHW", "topic": "醫學倫理與法律", "topic_num": 1, "img": "", "correction_note": ""}, {"id": "115-進階-精神科-42", "roc_year": 115, "exam_tag": "115", "subject_group": "進階專科護理", "branch": "精神科", "q_num": 42, "stem": "根據民國 111 年 12 月 14 日修訂之「精神衛生法」對於強制住院規定,下列何者錯誤?", "options": {"A": "緊急安置期間為 7 日", "B": "強制鑑定需於緊急安置之次日起 3 日內完成", "C": "延長強制住院,最多以兩次為限", "D": "緊急安置期間未聘委任律師者,中央主管機關應提供必要之法律協助"}, "needs_image": false, "answer": "C", "answer_status": "正常", "accepted_answers": ["C"], "source": "MOHW", "topic": "醫學倫理與法律", "topic_num": 1, "img": "", "correction_note": ""}, {"id": "115-進階-精神科-43", "roc_year": 115, "exam_tag": "115", "subject_group": "進階專科護理", "branch": "精神科", "q_num": 43, "stem": "根據民國 111 年 12 月 14 日修訂之「精神衛生法」,有關嚴重病人診斷書應記載之有效期限, 下列何者正確?", "options": {"A": "6 個月", "B": "1 年", "C": "3 年", "D": "5 年"}, "needs_image": false, "answer": "C", "answer_status": "正常", "accepted_answers": ["C"], "source": "MOHW", "topic": "醫學倫理與法律", "topic_num": 1, "img": "", "correction_note": ""}, {"id": "115-進階-精神科-44", "roc_year": 115, "exam_tag": "115", "subject_group": "進階專科護理", "branch": "精神科", "q_num": 44, "stem": "根據民國 109 年 08 月 06 日發布之「自殺防治法施行細則」,於急診問診時病人提到有自殺行為,應於多久以內依中央主管機關建置之自殺防治通報系統進行通報作業?", "options": {"A": "12 小時", "B": "24 小時", "C": "48 小時", "D": "3 天"}, "needs_image": false, "answer": "B", "answer_status": "正常", "accepted_answers": ["B"], "source": "MOHW", "topic": "醫學倫理與法律", "topic_num": 1, "img": "", "correction_note": ""}, {"id": "115-進階-麻醉-69", "roc_year": 115, "exam_tag": "115", "subject_group": "進階專科護理", "branch": "麻醉", "q_num": 69, "stem": "80 歲病人在家中浴室滑倒造成左側股骨骨折,今預行復位手術。下列敘述何者最適當?", "options": {"A": "為減少術後譫妄發生,應採用區域麻醉", "B": "全身麻醉誘導時應給予 propofol 靜脈注射劑量> 1.5 mg / kg", "C": "高齡者對 opioids 藥物較敏感,應減少使用劑量", "D": "高齡者對痛覺較不敏感,可以不用擔心疼痛問題"}, "needs_image": false, "answer": "C", "answer_status": "正常", "accepted_answers": ["C"], "source": "MOHW", "topic": "老年醫學與長期照護", "topic_num": 3, "img": "", "correction_note": ""}], E={"106-106a-通論-18": {"quick": "評估「病人心智狀態是否具法律行為能力」屬四象限的「病人意向/偏好(patient preferences)」。", "detail": {"background": "Jonsen 等人的臨床倫理思辨四象限把倫理決策分為四個面向：①醫療適應性（medical indications）——診斷、預後、治療能帶來的醫療效益；②病人意向/偏好（patient preferences）——病人的意願、自主、知情同意，以及是否具決策能力（心智狀態是否在法律上有行為能力）；③生活品質（quality of life）——治療對病人生活品質的影響；④情境特徵（contextual features）——家屬、經濟、法律、資源分配等外在脈絡。本題評估病人心智狀態是否合乎法律行為能力，正是判斷病人能否自主決策，屬於病人意向（preferences）象限，選 B。", "options": {"A": "醫療適應性＝病情與治療效益，非心智能力。", "B": "正解：病人意向象限涵蓋病人的決定能力與自主意願(原題誤植references，實為preferences)。", "C": "生活品質＝治療對生活的影響。", "D": "情境特徵＝家屬/資源/法律等外在脈絡。"}, "sources": ["Harrison 21e, Ch. Ethical Issues in Clinical Medicine & Palliative/End-of-Life Care", "病人自主權利法(2019/1/6 施行)、安寧緩和醫療條例", "Jonsen AR. Clinical Ethics 8e (四象限法)"]}}, "108a-TNPA-通論-27": {"quick": "同上題，心智狀態/法律行為能力屬「病人意向(patient preferences)」。", "detail": {"background": "此題同樣考 Jonsen 四象限中決策能力（competency）歸屬哪一象限。四象限對應四個倫理原則：醫療適應性（不傷害/行善）、病人意向（自主原則）、生活品質（行善/不傷害）、情境特徵（公平正義）。其中病人意向（patient preferences）象限的核心問題就是：病人是否表達意願、是否知情同意、是否有決策能力（心智狀態是否具法律行為能力）、有無預立醫療決定。評估病人心智是否合乎法律行為能力，即在判斷其自主決策能力，故屬病人意向象限，選 D。", "options": {"A": "醫療適應性。", "B": "情境特徵。", "C": "生活品質。", "D": "正解：病人意向/偏好象限。"}, "sources": ["Harrison 21e, Ch. Ethical Issues in Clinical Medicine & Palliative/End-of-Life Care", "病人自主權利法(2019/1/6 施行)、安寧緩和醫療條例", "Jonsen AR. Clinical Ethics 8e (四象限法)"]}}, "109-通論-其他-56": {"quick": "「拒絕無效醫療、使醫療資源妥善運用」對應四原則中的「正義(公平正義)」。", "detail": {"background": "生命倫理四原則(Beauchamp & Childress)：尊重自主(autonomy)、行善(beneficence)、不傷害(non-maleficence)、正義(justice)。正義原則關注醫療資源的公平分配與避免浪費；對無效醫療(futile care)的節制即屬資源正義範疇。", "options": {"A": "尊重自主＝尊重病人自我決定。", "B": "行善＝主動為病人謀福。", "C": "不傷害＝避免造成傷害。", "D": "正解：避免無效醫療、合理分配資源＝正義原則。"}, "sources": ["Harrison 21e, Ch. Ethical Issues in Clinical Medicine & Palliative/End-of-Life Care", "病人自主權利法(2019/1/6 施行)、安寧緩和醫療條例", "Jonsen AR. Clinical Ethics 8e (四象限法)"]}}, "110-通論-其他-16": {"quick": "醫療糾紛增加的原因「不」包括「醫病關係維持類似父子般、病人完全聽從」。", "detail": {"background": "醫療糾紛上升的社會因素：病人權利意識抬頭、醫療商業化(視為消費)、期待與現實落差、資訊不對稱、醫病溝通不足。傳統父權式(paternalistic)、病人完全服從的醫病關係反而「糾紛較少」，現代醫病關係朝向夥伴式/共享決策，期待提高才使糾紛增多。", "options": {"A": "權利意識提高→糾紛增。", "B": "期待落差→糾紛增。", "C": "商業化→糾紛增。", "D": "正解(為非)：父權服從式關係糾紛較少，非增加原因。"}, "sources": ["Harrison 21e, Ch. Ethical Issues in Clinical Medicine & Palliative/End-of-Life Care", "病人自主權利法(2019/1/6 施行)、安寧緩和醫療條例", "Jonsen AR. Clinical Ethics 8e (四象限法)"]}}, "110-通論-其他-2": {"quick": "病主法下，病情「亦得告知關係人」的要件是「病人未明示反對」。", "detail": {"background": "病人自主權利法第5條：醫療機構/醫師應將病情、治療、預後等告知「本人」；本人未明示反對時，「亦得」告知其關係人。核心精神是以病人為知情主體，關係人之告知須不違反病人意願。　《病人自主權利法》第5條以病人本人為知情主體，醫師應將病情、治療方針、預後等告知本人；於本人「未明示反對」時亦得一併告知其關係人。此設計兼顧家庭參與與病人自主，只要病人未拒絕即可告知家屬，但不得違反病人明示意願。", "options": {"A": "關係人要求不足以正當化告知。", "B": "與不會造成傷害無關。", "C": "正解：病人未明示反對即得告知關係人。", "D": "非以末期為要件。"}, "sources": ["Harrison 21e, Ch. Ethical Issues in Clinical Medicine & Palliative/End-of-Life Care", "病人自主權利法(2019/1/6 施行)、安寧緩和醫療條例", "Jonsen AR. Clinical Ethics 8e (四象限法)"]}}, "110-通論-其他-22": {"quick": "四原則中「尊重病人做決定的權利」即「自主原則」。", "detail": {"background": "四原則對應：自主＝尊重病人自我決定權；行善＝主動增進病人福祉；不傷害＝avoid harm；正義＝公平分配/可負擔性。本題以中華文化用語混淆，須回到原則本義判斷。　醫護四原則為自主（尊重病人自我決定權，如知情同意）、行善（主動增進病人福祉）、不傷害（避免造成傷害）、公平正義（資源公平分配、考量可負擔性）；本題以五倫四維等文化詞彙混淆，須回到各原則的倫理本義判斷，唯「尊重病人做決定＝自主原則」正確。", "options": {"A": "長幼有序非正義原則。", "B": "正解：尊重病人決定權＝自主原則。", "C": "「禮」非行善原則。", "D": "考量可負擔性偏「正義」而非不傷害。"}, "sources": ["Harrison 21e, Ch. Ethical Issues in Clinical Medicine & Palliative/End-of-Life Care", "病人自主權利法(2019/1/6 施行)、安寧緩和醫療條例", "Jonsen AR. Clinical Ethics 8e (四象限法)"]}}, "111-通論-5分科-25": {"quick": "「協助關節運動避免攣縮」屬行善原則中「去除/預防傷害」範疇。", "detail": {"background": "行善原則(beneficence)層次：①不傷害(避免造成傷害)②去除既有或潛在傷害③主動增進福祉。協助關節運動以「預防攣縮(已存在的失能風險)」屬於去除/預防傷害；洗手屬不傷害(預防感染)；床欄屬安全防護；出院準備屬增進福祉。題意要選「去除傷害」者。", "options": {"A": "洗手＝不傷害(預防感染)。", "B": "床欄＝預防跌落之安全防護。", "C": "正解：關節運動避免攣縮＝去除/預防既存傷害。", "D": "出院準備＝增進整體福祉。"}, "sources": ["Harrison 21e, Ch. Ethical Issues in Clinical Medicine & Palliative/End-of-Life Care", "病人自主權利法(2019/1/6 施行)、安寧緩和醫療條例", "Jonsen AR. Clinical Ethics 8e (四象限法)"]}}, "111-通論-5分科-6": {"quick": "活體器官移植須經「醫院醫學倫理委員會審查通過」。", "detail": {"background": "人體器官移植條例(110修正)活體捐贈要點：捐贈者須「成年(年滿18，且須有意思能力)」、五親等以內血親或配偶(配偶須結婚滿2年或已生育子女)、須經捐受雙方完整告知與評估、並經「醫院醫學倫理委員會審查通過」。組織配對合宜性是醫學條件之一，但活體仍須符合親屬限制(非如屍體捐贈)。", "options": {"A": "本人簽署不足，須倫委會審查；年齡規定亦非僅滿20。", "B": "配偶須結婚滿2年「或」已生育子女，非一定滿2年。", "C": "活體捐贈仍須符合親屬關係限制(非僅看配對)。", "D": "正解：須經醫院醫學倫理委員會審查通過。"}, "sources": ["Harrison 21e, Ch. Ethical Issues in Clinical Medicine & Palliative/End-of-Life Care", "病人自主權利法(2019/1/6 施行)、安寧緩和醫療條例", "Jonsen AR. Clinical Ethics 8e (四象限法)"]}}, "113-通論-5分科-22": {"quick": "「以病人能理解的語言衛教」最對應尊重自主(使其有效知情而能自主決定)。", "detail": {"background": "以病人熟悉、可理解的語言進行衛教，使病人「真正理解」才能做出自主決定，是落實知情同意與尊重自主(autonomy)的前提；亦可視為公平(消弭資訊落差)。考選部公布答案為「公平正義」(強調弭平健康識能/資訊不平等、人人可近用資訊)。學理上自主/公平皆可論述，作答以官方為準。", "options": {"A": "正解(官方)：弭平資訊落差、人人可理解＝公平正義。", "B": "不傷害＝避免傷害。", "C": "尊重自主(學理亦通，但官方取公平)。", "D": "行善＝主動增益。"}, "sources": ["Harrison 21e, Ch. Ethical Issues in Clinical Medicine & Palliative/End-of-Life Care", "病人自主權利法(2019/1/6 施行)、安寧緩和醫療條例", "Jonsen AR. Clinical Ethics 8e (四象限法)"]}}, "113-通論-5分科-23": {"quick": "評估「家屬想法、照顧能力、環境」屬「情境特徵(contextual features)」。", "detail": {"background": "Jonsen 四象限中，情境特徵（contextual features）象限處理的是醫療決策的外在脈絡因素——家屬的想法與意願、主要照顧者的照顧能力與負荷、家庭與居住環境、經濟與保險、法律規範、機構政策與資源等。本題評估阿茲海默症病人是否置放鼻胃管灌食時，考量家屬想法、照顧能力及環境因素，正是病人本身以外的脈絡條件，屬情境特徵象限，選 D。相對地，病人本身的灌食意願屬病人意向、灌食能否改善營養屬醫療適應性、管灌對舒適與尊嚴的影響屬生活品質。", "options": {"A": "醫療適應性＝病情/治療效益。", "B": "病人偏好＝病人自主意願。", "C": "生活品質＝治療對生活影響。", "D": "正解：家屬/照顧/環境＝情境特徵。"}, "sources": ["Harrison 21e, Ch. Ethical Issues in Clinical Medicine & Palliative/End-of-Life Care", "病人自主權利法(2019/1/6 施行)、安寧緩和醫療條例", "Jonsen AR. Clinical Ethics 8e (四象限法)"]}}, "113-通論-家庭-26": {"quick": "評估「健康資源分配不足影響決定」屬「情境特徵」。", "detail": {"background": "Jonsen 四象限的情境特徵（contextual features）象限對應倫理上的公平正義原則，涵蓋家屬、經濟、法律、機構政策，以及健康資源是否分配不足而影響臨床決定等外部脈絡。本題評估有無健康資源分配不足而影響臨床決定，屬於資源/公平層面的考量，正是情境特徵象限，選 D。判讀技巧：凡是「病人與醫療本身以外」的社會、家庭、資源、法律因素，多歸於情境特徵；病人自身意願歸病人意向、治療效益歸醫療適應性、預後對生活的影響歸生活品質。", "options": {"A": "醫療適應性。", "B": "病人意向。", "C": "生活品質。", "D": "正解：資源分配＝情境特徵。"}, "sources": ["Harrison 21e, Ch. Ethical Issues in Clinical Medicine & Palliative/End-of-Life Care", "病人自主權利法(2019/1/6 施行)、安寧緩和醫療條例", "Jonsen AR. Clinical Ethics 8e (四象限法)"]}}, "108a-TNPA-通論-17": {"quick": "DNR意願書見證人須具完全行為能力且非相關利害關係人——「20歲的鄰居」可。", "detail": {"background": "安寧緩和醫療條例：不施行心肺復甦術(DNR)意願書須二人以上「在場見證」。見證人須具完全行為能力(成年、未受監護宣告)，且不得為「依法或契約對病人負義務、或因病人死亡受利益(如繼承人)」之人，以避免利益衝突。　故繼承人等因病人死亡受利益者、或對病人負法定或契約義務者，均不得擔任見證人，以確保意願的真實性。", "options": {"A": "19歲未成年(時為20歲始成年/現民法成年18，依當年標準19歲不符)。", "B": "正解：20歲鄰居具行為能力且無利害關係。", "C": "同院護理師為相關醫療人員/利害關係，不宜。", "D": "受監護宣告者無行為能力，且兒子為繼承人具利害關係。"}, "sources": ["Harrison 21e, Ch. Ethical Issues in Clinical Medicine & Palliative/End-of-Life Care", "病人自主權利法(2019/1/6 施行)、安寧緩和醫療條例", "Jonsen AR. Clinical Ethics 8e (四象限法)"]}}, "108a-TNPA-通論-34": {"quick": "病主法五款條件「不」含「中度失智」(須達極重度失智)。", "detail": {"background": "《病人自主權利法》（病主法）讓具完全行為能力者可預立醫療決定（AD），在符合特定臨床條件時，由醫療機構/醫師依其 AD 終止、撤除或不施行維持生命治療與人工營養及流體餵養。其五款臨床條件為：①末期病人；②處於不可逆轉之昏迷；③永久植物人狀態；④極重度失智（須達 CDR 3，非中度）；⑤其他經中央主管機關公告之痛苦難以忍受、無法治癒且無其他適當解決方法之病情。本題中度失智未達極重度標準，故不符合，選 C。", "options": {"A": "末期病人＝符合。", "B": "不可逆昏迷＝符合。", "C": "正解(不符)：須極重度失智，中度不適用。", "D": "永久植物人＝符合。"}, "sources": ["Harrison 21e, Ch. Ethical Issues in Clinical Medicine & Palliative/End-of-Life Care", "病人自主權利法(2019/1/6 施行)、安寧緩和醫療條例", "Jonsen AR. Clinical Ethics 8e (四象限法)"]}}, "108b-TNPA-通論-12": {"quick": "AD生效須ACP＋簽署＋見證/公證＋上傳資料庫＋健保卡註記，全部齊備。", "detail": {"background": "《病人自主權利法》的預立醫療決定（AD）要生效，須完成一整套法定程序，缺一不可：①先經預立醫療照護諮商（ACP），由醫療機構提供並核章證明；②本人（具完全行為能力）簽署預立醫療決定書；③須有二位具完全行為能力者在場見證，或經公證人公證；④將 AD上傳中央主管機關資料庫並註記於健保卡。本題 (D) 完整列出 ACP＋簽署＋見證/公證＋上傳資料庫＋健保卡註記，最為正確，選 D；其餘選項皆遺漏必要步驟（僅填寫、僅諮商簽署而未見證上傳等）。", "options": {"A": "五款條件中「極重度」失智用語/列舉不完整。", "B": "僅填表註記健保卡不足。", "C": "僅ACP+簽署+健保卡註記，缺見證/公證與上傳資料庫。", "D": "正解：須ACP、簽署、見證或公證、上傳中央資料庫並健保卡註記。"}, "sources": ["Harrison 21e, Ch. Ethical Issues in Clinical Medicine & Palliative/End-of-Life Care", "病人自主權利法(2019/1/6 施行)、安寧緩和醫療條例", "Jonsen AR. Clinical Ethics 8e (四象限法)"]}}, "108b-TNPA-通論-14": {"quick": "病主法敘述「錯誤」者：立法目的並非「減少醫療資源消耗、減少訴訟」。", "detail": {"background": "病人自主權利法第1條立法目的：尊重「病人醫療自主」、保障其「善終權益」、促進醫病關係和諧。節省資源/減少訴訟非其立法宗旨(此為常見誤解)。維生醫療定義、知情選擇決定權、可書面撤回等敘述皆正確。　《病人自主權利法》第1條明定立法目的為尊重病人醫療自主、保障善終權益、促進醫病關係和諧；節省醫療資源或減少醫療糾紛雖可能是附帶效果，但並非立法宗旨，把節省資源當立法目的是常見誤解，故為錯誤敘述。", "options": {"A": "正解(錯誤)：立法目的為自主與善終，非省資源/減訟。", "B": "維生治療定義正確。", "C": "知情/選擇/決定權正確。", "D": "完全行為能力者可預立並隨時撤回，正確。"}, "sources": ["Harrison 21e, Ch. Ethical Issues in Clinical Medicine & Palliative/End-of-Life Care", "病人自主權利法(2019/1/6 施行)、安寧緩和醫療條例", "Jonsen AR. Clinical Ethics 8e (四象限法)"]}}, "108b-TNPA-通論-6": {"quick": "可不給「人工營養及流體餵養」者為「永久植物人狀態」(屬五款條件)。", "detail": {"background": "依《病人自主權利法》，唯有符合五款臨床條件之一且已完成預立醫療決定者，醫師才得不給予（或撤除）維持生命治療與人工營養及流體餵養。五款為：末期病人、不可逆轉之昏迷、永久植物人狀態、極重度失智（CDR 3）、中央主管機關公告之特定重症。本題四選項中，永久植物人狀態屬五款條件之一，故醫師可依 AD 不給予人工營養及流體餵養，選 C。其餘可逆轉昏迷（可能恢復）、中度失智、輕度失智皆未達標準，不適用。", "options": {"A": "「可逆轉」昏迷不符(須不可逆)。", "B": "中度失智不符。", "C": "正解：永久植物人狀態符合。", "D": "輕度失智不符。"}, "sources": ["Harrison 21e, Ch. Ethical Issues in Clinical Medicine & Palliative/End-of-Life Care", "病人自主權利法(2019/1/6 施行)、安寧緩和醫療條例", "Jonsen AR. Clinical Ethics 8e (四象限法)"]}}, "109-通論-其他-51": {"quick": "癌末病人考慮DNR，應「依自主原則尊重其充分知情後的決定」。", "detail": {"background": "安寧緩和/善終照護核心是尊重病人自主。對已充分理解DNR意義的末期病人，醫療人員應提供資訊並尊重其決定，而非以「為子女活下去」「仍可能治癒」勸阻。雖D(避免無效醫療)亦合理，但最貼切的倫理依據是「自主原則」。　對已充分理解DNR 意義的末期病人，應提供資訊並尊重其自主決定，避免以「為子女活下去」或不實治癒可能加以勸阻。", "options": {"A": "以情感勸阻違反自主。", "B": "誇大治癒可能、勸不放棄違反誠實與自主。", "C": "正解：充分知情後尊重病人自主決定。", "D": "資源/無效醫療雖合理，但本題核心為尊重病人自主。"}, "sources": ["Harrison 21e, Ch. Ethical Issues in Clinical Medicine & Palliative/End-of-Life Care", "病人自主權利法(2019/1/6 施行)、安寧緩和醫療條例", "Jonsen AR. Clinical Ethics 8e (四象限法)"]}}, "110-通論-其他-20": {"quick": "「未符合」病主法條件者為「罕見疾病病童」(未必符五款且病童非完全行為能力)。", "detail": {"background": "《病人自主權利法》適用的五款臨床條件須是明確、可認定的不可逆病況：①末期病人（二位相關專科醫師確診）；②不可逆轉之昏迷；③永久植物人狀態；④極重度失智（CDR 3）；⑤中央主管機關公告之重症。本題罕見疾病病童並不當然符合上述任一款（罕病未必屬公告重症，且病童多無完全行為能力、無法自行簽署 AD），故為未符合病主法規定者，選 D。其餘肺癌末期、永久植物人、不可逆昏迷皆屬五款之一。", "options": {"A": "肺癌末期＝末期病人，符合。", "B": "永久植物人，符合。", "C": "不可逆昏迷，符合。", "D": "正解(未符合)：罕病病童非五款條件且非完全行為能力人。"}, "sources": ["Harrison 21e, Ch. Ethical Issues in Clinical Medicine & Palliative/End-of-Life Care", "病人自主權利法(2019/1/6 施行)、安寧緩和醫療條例", "Jonsen AR. Clinical Ethics 8e (四象限法)"]}}, "111-通論-5分科-22": {"quick": "「不符合」啟動AD條件者：車禍腦傷僅3個月、GCS3者(外傷昏迷須逾6個月)。", "detail": {"background": "病主法施行細則對「不可逆昏迷」「永久植物人」若係「外傷」所致，須觀察「逾6個月無恢復/改善」方能認定；非外傷者逾3個月。CDR 3分(極重度失智)、FAST 7-8分符合。本題B為外傷腦傷僅3個月，不足6個月，故不符。　故外傷性腦傷僅滿三個月尚不足以認定不可逆昏迷，須觀察逾六個月仍無恢復；非外傷者則為逾三個月。", "options": {"A": "CDR 3分＝極重度失智，符合。", "B": "正解(不符):外傷昏迷須逾6個月，僅3個月不足。", "C": "腦梗塞(非外傷)昏迷逾6個月，符合。", "D": "FAST 7c/8＝極重度失智，符合。"}, "sources": ["Harrison 21e, Ch. Ethical Issues in Clinical Medicine & Palliative/End-of-Life Care", "病人自主權利法(2019/1/6 施行)、安寧緩和醫療條例", "Jonsen AR. Clinical Ethics 8e (四象限法)"]}}, "111-通論-5分科-26": {"quick": "本題官方為多重答案A、B皆給分(均涉外傷觀察期/確診規定爭議)。", "detail": {"background": "《病人自主權利法》五款條件的認定程序有明確的確診與觀察期規定：末期病人須由二位相關專科醫師確診；不可逆轉之昏迷與永久植物人狀態，須經一定觀察期——其中因外傷所致者須逾六個月、非外傷所致者逾三個月仍無恢復/改善跡象，並由緩和醫療團隊至少二次照會確認；極重度失智指 CDR 達三。本題選項中不可逆昏迷因外傷所致、意識超過「三個月」與法定外傷須逾六個月不符（三個月是非外傷的期限），屬敘述錯誤；本題官方認定 (A)、(B) 均給分，作答以官方為準。", "options": {"A": "(均給分)末期確診規定敘述有爭議。", "B": "(均給分)外傷不可逆昏迷應逾6個月，敘述為3個月屬錯誤。", "C": "外傷永久植物人逾6個月，正確。", "D": "極重度失智CDR≥3，正確。"}, "sources": ["Harrison 21e, Ch. Ethical Issues in Clinical Medicine & Palliative/End-of-Life Care", "病人自主權利法(2019/1/6 施行)、安寧緩和醫療條例", "Jonsen AR. Clinical Ethics 8e (四象限法)"]}}, "112-通論-其他-19": {"quick": "病主法五款條件「不」含「無法治癒的罕見疾病」(須經主管機關公告之特定重症)。", "detail": {"background": "《病人自主權利法》的五款臨床條件為：①不可逆轉之昏迷；②極重度失智（CDR 3）；③永久植物人狀態；④末期病人；⑤其他經中央主管機關公告之痛苦難以忍受、無法治癒且無適當解決方法之病情。關鍵在第五款——並非任何無法治癒的罕見疾病都自動適用，必須是經主管機關正式公告的特定重症才算。本題無法治癒的罕見疾病未必經公告，故敘述錯誤、不當然符合，選 D。", "options": {"A": "不可逆昏迷，符合。", "B": "極重度失智，符合。", "C": "永久植物人，符合。", "D": "正解(錯誤)：泛稱罕見疾病非五款；須經公告之特定病類。"}, "sources": ["Harrison 21e, Ch. Ethical Issues in Clinical Medicine & Palliative/End-of-Life Care", "病人自主權利法(2019/1/6 施行)、安寧緩和醫療條例", "Jonsen AR. Clinical Ethics 8e (四象限法)"]}}, "112-進階-內科-79": {"quick": "緩和性鎮靜旨在緩解臨終難治症狀(疼痛、呼吸困難、躁動性譫妄、抽搐)。", "detail": {"background": "緩和性鎮靜(palliative sedation)：對瀕死病人之難以控制(refractory)症狀，使用鎮靜藥物降低意識以緩解痛苦。其目的是「緩解症狀」而非加速死亡(雙重效應原則：可預見但非意圖死亡)；正確執行不會加速死亡。應「停用」神經肌肉阻斷劑(否則掩蓋痛苦並違倫理)；啟動時機為瀕死期(數小時至數日)而非固定1-2週。", "options": {"A": "正解：緩解疼痛/呼吸困難/躁動譫妄/抽搐等難治症狀。", "B": "正確執行不會加速死亡(非目的)。", "C": "應停用神經肌肉阻斷劑。", "D": "時機為瀕死期，非固定臨終前1-2週。"}, "sources": ["Harrison 21e, Ch. Ethical Issues in Clinical Medicine & Palliative/End-of-Life Care", "病人自主權利法(2019/1/6 施行)、安寧緩和醫療條例", "Jonsen AR. Clinical Ethics 8e (四象限法)"]}}, "113-通論-5分科-14": {"quick": "家屬意見不一時，最佳做法是「主治醫師召開家庭會議解釋病情與選項尋求共識」。", "detail": {"background": "末期/重症決策遇家屬歧見，應以「家庭會議(family meeting)」進行充分溝通、釐清病情、預後與照護目標(goals of care)，建立共識，而非單聽某一方或讓重度失智(無決定能力)病人自簽。此為善終照護與共享決策的核心做法。　故面對家屬意見不一，應召開家庭會議充分溝通病情、預後與照護目標以建立共識，而非單聽某一方或讓無決定能力的重度失智病人自簽。", "options": {"A": "逕聽大兒子片面意見不妥。", "B": "民法代理順位非由單一子女搶簽。", "C": "正解：召開家庭會議解釋、尋求共識。", "D": "重度失智無決定能力，不能由其自簽。"}, "sources": ["Harrison 21e, Ch. Ethical Issues in Clinical Medicine & Palliative/End-of-Life Care", "病人自主權利法(2019/1/6 施行)、安寧緩和醫療條例", "Jonsen AR. Clinical Ethics 8e (四象限法)"]}}, "113-通論-5分科-21": {"quick": "AD簽署敘述「錯誤」者：完成並註記健保卡「即有撤除維生醫療效力」是錯的。", "detail": {"background": "此題考《病人自主權利法》預立醫療決定（AD）簽署規定的錯誤敘述。正確要件包括：具完全行為能力者方得簽署、得隨時以書面撤回或變更（B 正確）；須經醫療機構提供預立醫療照護諮商並核章（C 正確）；須二位具完全行為能力者在場見證或公證人公證（D 正確）。但 (A)AD 完成並註記於健保卡，即具撤除維生醫療之效力錯誤——AD 註記只是完成簽署程序，真正得撤除維持生命治療還須病人實際符合五款臨床條件、並經專科醫師確診與緩和團隊照會後才生效，並非註記健保卡就立即有撤除效力，故選 A。", "options": {"A": "正解(錯誤)：註記健保卡僅完成登錄，須符臨床條件確診後才能執行撤除。", "B": "可隨時書面撤回變更，正確。", "C": "須ACP核章，正確。", "D": "須公證或二人見證，正確。"}, "sources": ["Harrison 21e, Ch. Ethical Issues in Clinical Medicine & Palliative/End-of-Life Care", "病人自主權利法(2019/1/6 施行)、安寧緩和醫療條例", "Jonsen AR. Clinical Ethics 8e (四象限法)"]}}, "113-通論-家庭-17": {"quick": "病主法「正確」者：適用末期、極重度失智、永久植物人等病人。", "detail": {"background": "此題考《病人自主權利法》的正確觀念。其適用對象為符合五款臨床條件者：末期病人、不可逆轉昏迷、永久植物人狀態、極重度失智、中央公告之重症，故 (B) 正確。逐項辨析：(A) 醫療委任代理人有多人時，原則上得獨立或共同代理而非單純多數決；(C) 預立醫療決定必須先經預立醫療照護諮商（ACP），不因二親等親屬死亡/失蹤而免除諮商；(D) 病主法保障的是意願人本人的自主，而非「代為簽署的家人」（AD 須本人具完全行為能力親自簽署）。故選 B。", "options": {"A": "代理人有順位，非多數決。", "B": "正解：適用末期/極重度失智/永久植物人等五款。", "C": "親屬死亡失蹤僅免「親屬到場」，仍須經ACP。", "D": "主要保障意願人本人(非代簽家人)。"}, "sources": ["Harrison 21e, Ch. Ethical Issues in Clinical Medicine & Palliative/End-of-Life Care", "病人自主權利法(2019/1/6 施行)、安寧緩和醫療條例", "Jonsen AR. Clinical Ethics 8e (四象限法)"]}}, "113-通論-家庭-24": {"quick": "輕度失智仍具行為能力，應「儘快ACP重新簽署AD」明確記載拒絕人工營養。", "detail": {"background": "舊版「預立安寧緩和醫療暨維生醫療抉擇意願書」(安寧條例)與病主法之「預立醫療決定(AD)」屬不同法源；要依病主法拒絕「人工營養及流體餵養」須另行完成ACP並簽署AD。病人現為「輕度」失智，仍具完全行為能力，應把握時機完成ACP/AD。　故病人現為輕度失智仍具完全行為能力，應把握時機完成預立醫療照護諮商與AD；舊版安寧意願書不能直接據以拒絕人工營養及流體餵養。", "options": {"A": "舊安寧意願書不等同病主法AD之拒絕人工營養。", "B": "正解：趁仍具行為能力儘快ACP並簽AD。", "C": "單身無親屬非不能簽，由醫療委任代理人見證可行但前提仍須ACP；本題最適為儘快完成ACP/AD。", "D": "輕度失智仍具行為能力，非不適用ACP。"}, "sources": ["Harrison 21e, Ch. Ethical Issues in Clinical Medicine & Palliative/End-of-Life Care", "病人自主權利法(2019/1/6 施行)、安寧緩和醫療條例", "Jonsen AR. Clinical Ethics 8e (四象限法)"]}}, "113-進階-內科-12": {"quick": "末期癌症「骨轉移痛」之輔助止痛藥首選「降鈣素(calcitonin)」。", "detail": {"background": "癌症疼痛輔助藥(adjuvant analgesics)依痛型選擇：神經病變痛→抗憂鬱(TCA)/抗癲癇(gabapentin);骨轉移痛→雙磷酸鹽、降鈣素(calcitonin)、放射治療、NSAID/類固醇。本題強調「骨頭痛(骨轉移)」，輔助止痛最對應降鈣素。", "options": {"A": "TCA用於神經病變痛。", "B": "正解：降鈣素緩解骨轉移痛。", "C": "抗癲癇用於神經病變痛。", "D": "類固醇用於神經壓迫/顱內壓/內臟脹痛，非骨痛首選輔助藥。"}, "sources": ["Harrison 21e, Ch. Ethical Issues in Clinical Medicine & Palliative/End-of-Life Care", "病人自主權利法(2019/1/6 施行)、安寧緩和醫療條例", "Jonsen AR. Clinical Ethics 8e (四象限法)"]}}, "113-進階-家庭-13": {"quick": "哀傷「震驚與否認期」應「以溫和堅定立場提供資訊，協助面對事實」。", "detail": {"background": "Kübler-Ross哀傷五階段(否認→憤怒→討價還價→憂鬱→接受)。否認/震驚期的照護：陪伴、傾聽、以溫和而堅定的方式適度提供真實資訊，協助逐步面對；不應壓制情緒表達、不給虛假保證、不刻意迴避探視。　故否認與震驚期應以陪伴傾聽、溫和而真實地提供資訊協助病人逐步面對，不壓制其情緒表達、不給虛假保證、也不刻意迴避探視。", "options": {"A": "正解：溫和堅定提供資訊、協助面對事實。", "B": "壓制情緒表達不當。", "C": "給予不實保證不當。", "D": "刻意迴避/減少探視不當。"}, "sources": ["Harrison 21e, Ch. Ethical Issues in Clinical Medicine & Palliative/End-of-Life Care", "病人自主權利法(2019/1/6 施行)、安寧緩和醫療條例", "Jonsen AR. Clinical Ethics 8e (四象限法)"]}}, "114-通論-5分科-7": {"quick": "ACP諮詢「較不適當」者：規定「需三親等內親屬至少1人參加」。", "detail": {"background": "預立醫療照護諮商(ACP)以「病人本人」為核心，得邀請二親等內親屬「或」醫療委任代理人參與(非強制三親等)；目的在釐清資訊、緩解焦慮、協助抉擇、提供緩和資源，立法精神為尊重病人自主。故「強制三親等親屬參加」之敘述不適當。　故ACP 以病人本人為核心，得邀請二親等內親屬或醫療委任代理人參與，強制三親等親屬參加並不符合規定。", "options": {"A": "正解(不適當)：非強制三親等；以病人為核心、得邀二親等內親屬或代理人。", "B": "釐清資訊與抉擇困難，適當。", "C": "討論目標、提供緩和資源，適當。", "D": "立法目的尊重自主，正確。"}, "sources": ["Harrison 21e, Ch. Ethical Issues in Clinical Medicine & Palliative/End-of-Life Care", "病人自主權利法(2019/1/6 施行)、安寧緩和醫療條例", "Jonsen AR. Clinical Ethics 8e (四象限法)"]}}, "106-106a-通論-38": {"quick": "老年憂鬱症較常「主動抱怨自己認知/記憶有問題」(假性失智特徵)。", "detail": {"background": "老年憂鬱vs阿茲海默(假性失智pseudodementia鑑別)：憂鬱者起病較快、會「主訴」記憶差、對問題傾向回答「不知道」、對缺損有病識感、日常功能受情緒影響；失智者起病隱襲、傾向掩飾/亂answer、缺乏病識感、日常功能漸進受損。　臨床上憂鬱所致的假性失智多可逆、對抗憂鬱劑反應佳，故與真正失智鑑別很重要，以免錯失可治療的憂鬱症。", "options": {"A": "正解：憂鬱者常主動抱怨認知問題(有病識感)。", "B": "病程緩慢偏失智。", "C": "不知道也勉強回答偏失智(掩飾)。", "D": "認知障礙影響日常偏失智。"}, "sources": ["Harrison 21e, Ch. Geriatric Medicine", "衛福部長期照顧服務法、長照2.0、急性後期整合照護(PAC)計畫", "WHO ICOPE指引；AWGS 2019肌少症共識；Fried frailty phenotype"]}}, "107-TNPA-通論-5": {"quick": "對知足但似有心事的獨居喪偶長者，最佳回應是同理＋開放式探詢。", "detail": {"background": "老年身心評估與溝通：面對情緒低落、流露消極/無望感的長者，應以同理、開放式問句鼓勵表達(探詢自殺/憂鬱風險)，而非急著給政策資訊、轉介身後事或敷衍式鼓勵。　長者出現「不用花時間在我身上」這類被動、無望、自我貶低的語句，可能是憂鬱或潛在自殺意念的警訊；專師應以反映式同理開啟對話、進一步評估情緒與自殺風險，而非以政策資訊、安排身後事或敷衍鼓勵岔開話題而錯失介入時機。", "options": {"A": "敷衍式鼓勵未回應情緒。", "B": "急推長照政策未同理。", "C": "逕談身後事不適當。", "D": "正解：同理觀察＋開放式邀請表達。"}, "sources": ["Harrison 21e, Ch. Geriatric Medicine", "衛福部長期照顧服務法、長照2.0、急性後期整合照護(PAC)計畫", "WHO ICOPE指引；AWGS 2019肌少症共識；Fried frailty phenotype"]}}, "107-TNPA-通論-68": {"quick": "預防住院跌倒正確措施組合為「床欄＋浴缸止滑墊」(12)。", "detail": {"background": "住院跌倒預防：高風險(老人/術後)使用床欄、浴室加止滑墊/扶手、充足照明、移除地面障礙。錯誤做法：門口放地毯(易絆倒)、燈光昏暗(增加跌倒)。　地毯與門墊邊緣易絆倒或滑動、昏暗燈光使視覺辨識不良，皆會增加跌倒風險而屬錯誤做法；正確應移除地面障礙、提供充足均勻照明並設夜間小燈，浴廁加裝止滑墊與扶手，故只有床欄與止滑墊（12）正確。", "options": {"A": "含3(地毯)4(昏暗)皆錯。", "B": "含4(昏暗)錯。", "C": "正解：1床欄+2止滑墊正確。", "D": "含3(地毯)錯。"}, "sources": ["Harrison 21e, Ch. Geriatric Medicine", "衛福部長期照顧服務法、長照2.0、急性後期整合照護(PAC)計畫", "WHO ICOPE指引；AWGS 2019肌少症共識；Fried frailty phenotype"]}}, "107-TNPA-通論-69": {"quick": "強化老年肌力「最不恰當」者：避免高於平常負荷(阻力訓練需漸進超負荷)。", "detail": {"background": "老年肌力(阻力)訓練原則：採「漸進性超負荷」，強度由低漸高、次數由少漸多；下肢肌力訓練股四頭肌等大肌群；體能佳者可比照成人建議。「避免任何高於平常的負荷」與超負荷原則相違，無法有效增肌。　肌力增長的生理基礎是漸進性超負荷，須給予略高於日常的阻力刺激，肌纖維才會適應性增粗；若一律避免任何高於平常的負荷，缺乏足夠刺激便無法有效增肌，故此敘述最不恰當，健康長者應在安全範圍內逐步提高重量與次數。", "options": {"A": "正解(最不恰當)：阻力訓練需漸進超負荷，非一味避免高負荷。", "B": "漸進性原則正確。", "C": "下肢訓練股四頭肌正確。", "D": "體能佳者比照成人正確。"}, "sources": ["Harrison 21e, Ch. Geriatric Medicine", "衛福部長期照顧服務法、長照2.0、急性後期整合照護(PAC)計畫", "WHO ICOPE指引；AWGS 2019肌少症共識；Fried frailty phenotype"]}}, "107-TNPA-通論-73": {"quick": "老年多重用藥「為非」：不應依各疾病指引機械式開立所有藥物。", "detail": {"background": "老年多重共病/多重用藥(polypharmacy，一般定義同時≥5種藥)：易增藥物不良反應、處方瀑布(prescribing cascade)。應「個別化、去處方(deprescribing)」依據Beers準則檢視潛在不當用藥，而非依每個單病指引疊加所有藥。評估須涵蓋中草藥與保健品。", "options": {"A": "≥5種藥定義正確。", "B": "易誤認新症狀致加藥(處方瀑布)正確。", "C": "正解(為非)：不應機械式疊加所有指引用藥，須個別化去處方。", "D": "須納入草藥/補充品評估正確。"}, "sources": ["Harrison 21e, Ch. Geriatric Medicine", "衛福部長期照顧服務法、長照2.0、急性後期整合照護(PAC)計畫", "WHO ICOPE指引；AWGS 2019肌少症共識；Fried frailty phenotype"]}}, "108b-TNPA-通論-64": {"quick": "肌少症篩檢項目＝握力下降、肌肉質量減少、行動力(體能)下降(234)。", "detail": {"background": "AWGS 2019肌少症：篩檢用小腿圍/SARC-F/SARC-CalF；診斷三要素＝①肌肉量減少②肌力下降(握力)③體能/行動力下降(步速、起立、SPPB)。「柔軟度」非肌少症評估項目。　AWGS 2019 肌少症診斷三要素為肌肉量減少、肌力下降（握力，男<28、女<18 kg）與體能行動力下降（步速<1.0 m/s 或起立、SPPB）；社區初篩可用小腿圍或 SARC-F，柔軟度與肌少症診斷無關，故不列入（答案 234）。", "options": {"A": "含1柔軟度，錯。", "B": "正解：2握力+3肌肉量+4行動力。", "C": "含1柔軟度，錯。", "D": "含1柔軟度，錯。"}, "sources": ["Harrison 21e, Ch. Geriatric Medicine", "衛福部長期照顧服務法、長照2.0、急性後期整合照護(PAC)計畫", "WHO ICOPE指引；AWGS 2019肌少症共識；Fried frailty phenotype"]}}, "108b-TNPA-通論-66": {"quick": "Fried衰弱表現型診斷「錯誤」者：食慾下降(非五項之一)。", "detail": {"background": "Fried衰弱表現型(phenotype)五項：①非刻意體重減輕②疲憊感③肌力(握力)下降④行走速度減慢⑤低身體活動量。符合≥3項為衰弱(frail)、1-2項為前衰弱(pre-frail)。「食慾下降」非正式診斷項目。　故「食慾下降」非Fried 五項之一；雖食慾差可能與體重減輕相關，但正式診斷指標為非刻意體重減輕而非食慾本身。", "options": {"A": "肌力下降＝五項之一。", "B": "正解(錯誤)：食慾下降非Fried五項。", "C": "行走速度減慢＝五項之一。", "D": "莫名體重減輕＝五項之一。"}, "sources": ["Harrison 21e, Ch. Geriatric Medicine", "衛福部長期照顧服務法、長照2.0、急性後期整合照護(PAC)計畫", "WHO ICOPE指引；AWGS 2019肌少症共識；Fried frailty phenotype"]}}, "109-進階-其他-20": {"quick": "老化生理變化「正確」者：壓力感受器反射(baroreflex)反應性降低。", "detail": {"background": "正常老化生理：GFR下降、心肺儲備下降、baroreflex敏感度降低(易姿位性低血壓)、肺餘容積(RV)/功能性肺餘量增加、肺活量下降、血清白蛋白略降、體脂增加/肌肉量減少、藥物分布與代謝改變。　正常老化使壓力反射敏感度下降，自律神經對血壓變化代償變慢，故老人易發生姿位性低血壓與跌倒；同時 GFR 與心肺儲備下降、肺餘容積增加、肺活量下降、白蛋白略降、肌肉量減少而體脂增加，均影響藥物分布與代謝，故C正確。", "options": {"A": "GFR隨老化下降(非上升)。", "B": "肺餘容積增加(非減少)。", "C": "正解：baroreflex反射性降低。", "D": "血清白蛋白下降(非增加)。"}, "sources": ["Harrison 21e, Ch. Geriatric Medicine", "衛福部長期照顧服務法、長照2.0、急性後期整合照護(PAC)計畫", "WHO ICOPE指引；AWGS 2019肌少症共識；Fried frailty phenotype"]}}, "111-通論-5分科-12": {"quick": "下肢肌力/步態異常之長者，「不是」主要轉介對象者為社工師。", "detail": {"background": "《老人防跌工作手冊》：下肢肌力不足或步態/平衡異常者，除轉介醫師診斷外，主要轉介「物理治療師、職能治療師、社區運動團體」進行運動介入；社工師非此功能性失衡之主要轉介對象。　《老人防跌工作手冊》對下肢肌力不足或步態平衡異常者，主要轉介物理治療師、職能治療師與社區運動團體進行功能性運動介入；社工師主要處理社會資源與心理社會議題，非此類功能失衡的主要轉介對象，故為非。", "options": {"A": "物理治療師＝主要轉介。", "B": "職能治療師＝主要轉介。", "C": "社區運動團體＝主要轉介。", "D": "正解(非主要)：社工師非步態/肌力介入主要轉介。"}, "sources": ["Harrison 21e, Ch. Geriatric Medicine", "衛福部長期照顧服務法、長照2.0、急性後期整合照護(PAC)計畫", "WHO ICOPE指引；AWGS 2019肌少症共識；Fried frailty phenotype"]}}, "111-通論-5分科-38": {"quick": "社區老人健康促進「錯誤」者：本土推廣模式以「醫院」為基礎(應以社區)。", "detail": {"background": "社區老人健康促進以「社區」為基礎(community-based)，透過社區據點、長者互動促進健康行為；公衛進步促成高齡化；健康促進可早期預防慢性病。「以醫院為基礎」與社區化精神相違。　本土化社區老人健康促進採社區為基礎的模式，透過社區照顧關懷據點、長者互動與在地資源推動健康行為，貼近生活、提升可近性與持續性；以醫院為基礎與社區化、在地化精神相違，故C錯誤。", "options": {"A": "公衛進步致高齡化，正確。", "B": "促進健康可預防慢性病，正確。", "C": "正解(錯誤)：應以社區為基礎，非醫院。", "D": "長者互動強化健康行為，正確。"}, "sources": ["Harrison 21e, Ch. Geriatric Medicine", "衛福部長期照顧服務法、長照2.0、急性後期整合照護(PAC)計畫", "WHO ICOPE指引；AWGS 2019肌少症共識；Fried frailty phenotype"]}}, "111-通論-5分科-41": {"quick": "ICOPE六大功能指標「不含」失禁。", "detail": {"background": "WHO長者整合性照護指引（ICOPE）以維護長者內在能力（intrinsic capacity）為核心，透過六大功能指標及早篩檢可能導致失能的風險：①認知（cognition）、②行動能力（mobility，如起立行走）、③營養（malnutrition，體重/食慾）、④視力（vision）、⑤聽力（hearing）、⑥憂鬱/心理（depression）。這六項對應老化中最易衰退、且介入後可逆的能力。失禁屬常見老年症候群但不在 ICOPE 六大功能指標之內，故選 D（不包含）。", "options": {"A": "認知＝ICOPE指標。", "B": "營養＝ICOPE指標。", "C": "聽力＝ICOPE指標。", "D": "正解(不含)：失禁非ICOPE六指標。"}, "sources": ["Harrison 21e, Ch. Geriatric Medicine", "衛福部長期照顧服務法、長照2.0、急性後期整合照護(PAC)計畫", "WHO ICOPE指引；AWGS 2019肌少症共識；Fried frailty phenotype"]}}, "112-通論-其他-34": {"quick": "AWGS 2019肌少症「錯誤」者：小腿圍男<36(應男<34、女<33)。", "detail": {"background": "AWGS 2019：小腿圍篩檢切點「男性<34 cm、女性<33 cm」；篩檢工具含小腿圍、SARC-F、SARC-CalF；SARC-F五項(力量Strength、行走Assistance walking、起身Rise、登階Climb、跌倒Falls)為主觀問卷；嚴重度分「可能肌少症、肌少症、嚴重肌少症」三級。", "options": {"A": "小腿圍/SARC-F/SARC-CalF為篩檢工具，正確。", "B": "三級分級正確。", "C": "SARC-F五項與主觀評量正確。", "D": "正解(錯誤)：男性切點應<34非<36(女<33正確)。"}, "sources": ["Harrison 21e, Ch. Geriatric Medicine", "衛福部長期照顧服務法、長照2.0、急性後期整合照護(PAC)計畫", "WHO ICOPE指引；AWGS 2019肌少症共識；Fried frailty phenotype"]}}, "112-通論-其他-37": {"quick": "最能預測老人日後跌倒者＝「過去一年曾跌倒過」(跌倒史)。", "detail": {"background": "跌倒最強預測因子為「過去一年的跌倒史」(history of falls)；其次步態/平衡異常、肌力下降、用藥(鎮靜安眠)、視力、姿位性低血壓等。跌倒史是篩檢首要詢問項。　實證上「過去一年的跌倒史」是預測未來跌倒最強的單一因子，故跌倒篩檢首要詢問近一年是否跌倒過；其次為步態與平衡異常、下肢肌力不足、多重用藥（尤其鎮靜安眠藥）、視力不良與姿位性低血壓等。", "options": {"A": "起立需扶為平衡/肌力線索，非最強。", "B": "正解：過去一年跌倒史最能預測再跌。", "C": "走路需扶家具為平衡線索，非最強。", "D": "用藥為風險因子之一，非最強。"}, "sources": ["Harrison 21e, Ch. Geriatric Medicine", "衛福部長期照顧服務法、長照2.0、急性後期整合照護(PAC)計畫", "WHO ICOPE指引；AWGS 2019肌少症共識；Fried frailty phenotype"]}}, "112-通論-其他-39": {"quick": "預防跌倒「不適當」者：移動時用「可滑動」點滴架供病人行走支撐。", "detail": {"background": "安全環境：常用物品置於可及處、下床用移位帶、浴廁止滑/扶手/叫人鈴。錯誤：以「可自由滑動」的點滴架當助行支撐——重心不穩易滑動致跌；應用穩固助行器。　可自由滑動的移動式點滴架重心不穩、會隨身體傾斜滑走，若當助行支撐極易失衡跌倒，正確應使用穩固助行器或扶手；其餘將常用物品置於可及處、下床用移位固定帶、浴廁止滑扶手叫人鈴皆適當，故D不適當。", "options": {"A": "物品置於可及處，適當。", "B": "移位固定帶，適當。", "C": "浴廁止滑/扶手/叫人鈴，適當。", "D": "正解(不適當)：滑動點滴架不可作支撐易致跌。"}, "sources": ["Harrison 21e, Ch. Geriatric Medicine", "衛福部長期照顧服務法、長照2.0、急性後期整合照護(PAC)計畫", "WHO ICOPE指引；AWGS 2019肌少症共識；Fried frailty phenotype"]}}, "112-通論-其他-5": {"quick": "長照服務申請資格「錯誤」者：50歲以上原住民(原住民應55歲以上)。", "detail": {"background": "長照2.0服務對象：①65歲以上失能老人②「55歲以上」失能原住民③50歲以上失智症者④領有身心障礙證明者。原住民門檻為55歲(非50歲)。　長照2.0服務對象為65歲以上失能老人、55歲以上失能原住民、50歲以上失智症者及領有身心障礙證明之失能者；原住民因平均餘命較短、提早老化，門檻訂為55歲而非50歲，故「50歲以上原住民」敘述錯誤。", "options": {"A": "正解(錯誤)：原住民應55歲以上，非50歲。", "B": "65歲以上老人，正確。", "C": "領身障證明者，正確。", "D": "50歲以上失智者符合(55歲以上失智更涵蓋其中)。"}, "sources": ["Harrison 21e, Ch. Geriatric Medicine", "衛福部長期照顧服務法、長照2.0、急性後期整合照護(PAC)計畫", "WHO ICOPE指引；AWGS 2019肌少症共識；Fried frailty phenotype"]}}, "112-通論-其他-6": {"quick": "PAC腦中風「錯誤」者：收案為「發作滿3個月」(應急性後期早期、病況穩定即收)。", "detail": {"background": "健保「急性後期整合照護(PAC)」腦中風：收案為急性中風後「病情穩定之急性後期(發病後早期，多於發病/出院後數週內)」轉入密集復健，非等滿3個月；復健黃金期約發病後3-6個月；可降低再住院與一年死亡、改善失能。　故收案為急性中風後病情穩定的急性後期即轉入密集復健，不須等滿三個月；把握發病後3至6個月的復健黃金期可改善失能並降低再住院與死亡。", "options": {"A": "正解(錯誤)：非「滿3個月」才收案，應急性後期早期病況穩定即收。", "B": "黃金復健期3-6個月，正確。", "C": "PAC可降再住院/死亡，正確。", "D": "依評估安排照護模式，正確。"}, "sources": ["Harrison 21e, Ch. Geriatric Medicine", "衛福部長期照顧服務法、長照2.0、急性後期整合照護(PAC)計畫", "WHO ICOPE指引；AWGS 2019肌少症共識；Fried frailty phenotype"]}}, "113-通論-5分科-13": {"quick": "高齡溝通「較不適宜」者：堅持第一次會談就收集完整病史。", "detail": {"background": "高齡問診技巧：可由親友陪同補充、放慢語速、確認聽懂、適度聚焦主訴。但高齡者易疲勞、敘述發散，「不必」強求一次取得完整病史，可分次完成以免過度疲勞。　高齡者體力有限易疲勞，且常從久遠病史開始發散敘述；問診應適度聚焦主訴、放慢語速、確認其聽懂、必要時由親友陪同補充，並可分次完成病史收集，不必也不宜強求第一次會談就取得完整病史，以免病人過度疲勞，故B不適宜。", "options": {"A": "親友陪同補充訊息，適宜。", "B": "正解(較不適宜)：不必強求第一次即收集完整病史。", "C": "適度提醒聚焦主訴，適宜。", "D": "放慢語速並確認，適宜。"}, "sources": ["Harrison 21e, Ch. Geriatric Medicine", "衛福部長期照顧服務法、長照2.0、急性後期整合照護(PAC)計畫", "WHO ICOPE指引；AWGS 2019肌少症共識；Fried frailty phenotype"]}}, "113-通論-5分科-20": {"quick": "長照服務法「非」服務方式者：視訊諮詢照護。", "detail": {"background": "長期照顧服務法之服務「方式」：居家式、社區式、機構住宿式、家庭照顧者支持服務、綜合式服務。「視訊諮詢照護」非該法明定之服務方式。　《長期照顧服務法》明定的服務提供方式為居家式、社區式、機構住宿式、家庭照顧者支持服務及綜合式服務五類；視訊諮詢照護並非該法所列的法定服務方式，屬輔助性的遠距工具，故A為非。", "options": {"A": "正解(非):視訊諮詢非法定長照服務方式。", "B": "社區式日間照護，是。", "C": "居家式到宅服務，是。", "D": "機構住宿式，是。"}, "sources": ["Harrison 21e, Ch. Geriatric Medicine", "衛福部長期照顧服務法、長照2.0、急性後期整合照護(PAC)計畫", "WHO ICOPE指引；AWGS 2019肌少症共識；Fried frailty phenotype"]}}, "113-通論-5分科-31": {"quick": "ICOPE篩檢關鍵指標「不屬」者：疼痛管理。", "detail": {"background": "ICOPE（長者整合性照護）的目的是及早篩檢失能風險因子，其關鍵篩檢指標為六項內在能力：認知功能、行動能力、營養、視力、聽力、憂鬱（心理）。這些是社區長者初級篩檢的標準項目，一旦異常即進一步評估與介入。疼痛管理雖是老年照護的重要面向，但不是 ICOPE 的篩檢關鍵指標（它屬於後續處置/照護計畫而非篩檢的內在能力項目），故選 B（不屬於）。", "options": {"A": "認知＝指標。", "B": "正解(不屬)：疼痛管理非ICOPE指標。", "C": "憂鬱＝指標。", "D": "視力＝指標。"}, "sources": ["Harrison 21e, Ch. Geriatric Medicine", "衛福部長期照顧服務法、長照2.0、急性後期整合照護(PAC)計畫", "WHO ICOPE指引；AWGS 2019肌少症共識；Fried frailty phenotype"]}}, "113-通論-5分科-45": {"quick": "跌倒發生率「最不適當」敘述：公式單位「×1000‰」重複換算錯誤。", "detail": {"background": "跌倒發生率(結果面護理品質指標)＝(當月有紀錄跌倒事件數 / 當月住院總人日數)×1000，單位為「‰(每千住院人日)」。寫成「×1000‰」是重複換算錯誤(×1000後又標‰)。重度傷害跌倒須做根本原因分析(RCA)，歸屬結果面指標。　故寫成乘1000 之後又標千分比是重複換算的錯誤；跌倒率屬結果面護理品質指標，重度傷害跌倒須進行根本原因分析。", "options": {"A": "正解(最不適當)：×1000與‰重複，單位錯誤。", "B": "重度傷害做RCA，正確。", "C": "住院期間跌倒事件紀錄，正確。", "D": "屬結果面指標，正確。"}, "sources": ["Harrison 21e, Ch. Geriatric Medicine", "衛福部長期照顧服務法、長照2.0、急性後期整合照護(PAC)計畫", "WHO ICOPE指引；AWGS 2019肌少症共識；Fried frailty phenotype"]}}, "113-通論-家庭-43": {"quick": "最能預測長輩日後跌倒者＝「過去一年曾跌倒過」。", "detail": {"background": "同跌倒史為最強預測因子(history of falls)；其餘為次要線索。　在各項跌倒篩檢線索中，過去一年曾跌倒過是預測未來再跌倒最強的單一指標，故為首要評估項目；其餘如起身需用手撐、走路需扶傢俱（平衡肌力不足）、服用安眠藥（鎮靜）等為次要危險因子，重要但預測力不及跌倒史。", "options": {"A": "起立需扶非最強。", "B": "正解：過去一年跌倒史最能預測。", "C": "走路需扶非最強。", "D": "安眠藥為風險因子之一非最強。"}, "sources": ["Harrison 21e, Ch. Geriatric Medicine", "衛福部長期照顧服務法、長照2.0、急性後期整合照護(PAC)計畫", "WHO ICOPE指引；AWGS 2019肌少症共識；Fried frailty phenotype"]}}, "113-通論-家庭-45": {"quick": "ICOPE六大功能指標「不包括」失眠。", "detail": {"background": "ICOPE 六大功能指標代表長者內在能力的六個可篩檢、可介入的面向：認知、行動能力、營養、視力、聽力、憂鬱。應用時對每項做簡易篩檢（如認知用三詞記憶、行動用起立行走、營養問體重食慾減少、視力聽力簡測、憂鬱問情緒），陽性者再深入評估。失眠雖常見於長者，但不屬於 ICOPE 六大功能指標，故選 D（不包括）。記憶要訣：六指標＝認知、行動、營養、視、聽、憂鬱，不含失禁、失眠、疼痛。", "options": {"A": "認知＝指標。", "B": "視力＝指標。", "C": "憂鬱＝指標。", "D": "正解(不含)：失眠非ICOPE六指標。"}, "sources": ["Harrison 21e, Ch. Geriatric Medicine", "衛福部長期照顧服務法、長照2.0、急性後期整合照護(PAC)計畫", "WHO ICOPE指引；AWGS 2019肌少症共識；Fried frailty phenotype"]}}, "114-通論-5分科-32": {"quick": "專師於長照角色「較不適當」者：只能行政、不提供直接照護。", "detail": {"background": "專科護理師於長照體系可參與出院準備銜接社區資源、評估高齡/失能者身心功能並擬照護計畫、於社區據點提供衛教/健康促進/慢病追蹤等「直接照護」角色，非僅行政。　專師在長照體系可參與出院準備服務、銜接社區照護資源、評估高齡與失能者身心功能並擬定照護計畫、於社區據點提供衛教健康促進與慢性病追蹤等直接照護；其角色多元並非僅限行政管理，故D敘述不適當。", "options": {"A": "出院準備銜接社區，適當。", "B": "評估並擬照護計畫，適當。", "C": "社區衛教/慢病追蹤，適當。", "D": "正解(不適當)：非只能行政、不提供直接照護。"}, "sources": ["Harrison 21e, Ch. Geriatric Medicine", "衛福部長期照顧服務法、長照2.0、急性後期整合照護(PAC)計畫", "WHO ICOPE指引；AWGS 2019肌少症共識；Fried frailty phenotype"]}}, "114-通論-5分科-47": {"quick": "疑右肩關節脫位之85歲長者，「較不適當」者：NP依醫囑自行徒手復位。", "detail": {"background": "疑似關節脫位處置：先穩定生命徵象、評估遠端神經血管(感覺/脈搏/活動)、固定患肢限制活動、安排X光排除合併骨折，「復位應由醫師執行」(NP不宜自行徒手復位，恐加重骨折/神經血管損傷)。　疑似關節脫位的初步處置為穩定生命徵象、評估遠端神經血管功能（感覺脈搏活動）、固定患肢限制活動並安排X光排除合併骨折；關節復位屬醫療處置應由醫師執行，專師不宜自行徒手復位，以免加重骨折移位或神經血管損傷，故B不適當。", "options": {"A": "穩定生命徵象後檢查，適當。", "B": "正解(較不適當)：脫位復位應由醫師處置，非NP徒手復位。", "C": "評估神經血管，適當。", "D": "固定患肢限制活動，適當。"}, "sources": ["Harrison 21e, Ch. Geriatric Medicine", "衛福部長期照顧服務法、長照2.0、急性後期整合照護(PAC)計畫", "WHO ICOPE指引；AWGS 2019肌少症共識；Fried frailty phenotype"]}}, "109-通論-其他-78": {"quick": "SHARE五步驟敘述「錯誤」者：把「協助病人選擇符合實證之醫療」當成step4。", "detail": {"background": "AHRQ SHARE Approach五步驟：Step1 Seek邀請病人參與；Step2 Help協助病人比較選項的好處與害處；Step3 Assess評估病人價值觀與偏好；Step4 Reach與病人共同達成決策；Step5 Evaluate評值決策。Step4是「與病人共同達成決策(Reach decision together)」，強調尊重病人價值的共決，而非由醫療端「協助選擇符合實證」之單向引導。", "options": {"A": "Step1邀請參與，正確。", "B": "Step2討論好處與害處，正確。", "C": "Step3評估價值與偏好，正確。", "D": "正解(錯誤)：Step4為共同達成決策，非引導選符合實證。"}, "sources": ["Sackett DL. Evidence-Based Medicine: How to Practice and Teach EBM 5e", "AHRQ SHARE Approach；DiCenso 6S model；AGREE II；醫策會病人安全/品質指標", "Charles C. SDM model 1997；根本原因分析(RCA)方法學"]}}, "110-通論-其他-5": {"quick": "5A正確順序＝提問→找最佳證據→評讀→應用→評值(31245)。", "detail": {"background": "實證健康照護的5A 步驟是持續品質提升與臨床決策的標準流程，依序為：①Ask（提問）——將臨床問題轉為可回答的 PICO 形式；②Acquire（找出最佳證據）——檢索文獻；③Appraise（評讀證據）——評估其效度與適用性；④Apply（應用於臨床）——結合病人偏好與臨床情境解決問題；⑤Assess（評值成效）——檢討結果並回饋改善。對照本題編號（3 提問→1 找最佳證據→2 評讀→4 應用→5 評值），正確順序為 3 1 2 4 5，選 B。", "options": {"A": "12345非以提問起始。", "B": "正解：3-1-2-4-5。", "C": "順序錯置。", "D": "順序錯置。"}, "sources": ["Sackett DL. Evidence-Based Medicine: How to Practice and Teach EBM 5e", "AHRQ SHARE Approach；DiCenso 6S model；AGREE II；醫策會病人安全/品質指標", "Charles C. SDM model 1997；根本原因分析(RCA)方法學"]}}, "110-通論-其他-15": {"quick": "「不適合」SDM情境：昏厥、心率25需緊急置入心律調節器前。", "detail": {"background": "SDM適用於「有多個合理選項、偏好敏感、實證不確定、需長期用藥」之情境；不適用於「緊急救命、僅單一合理(救命)作法」之情境。本題嚴重心搏過緩需緊急置入節律器屬救命處置，無偏好權衡空間。　醫病共享決策適用於有多個合理選項、結果偏好敏感、實證不確定或需長期治療之情境，讓病人價值觀納入決策；緊急救命且僅單一合理處置時則無權衡空間，本例症狀性嚴重心搏過緩合併昏厥須立即置入節律器救命，屬不適合SDM者。", "options": {"A": "正解(不適合)：緊急救命、唯一作法無SDM空間。", "B": "是否簽AD屬偏好敏感，適合SDM。", "C": "肌瘤局切vs全切，適合SDM。", "D": "末期治療選項與預後討論，適合SDM。"}, "sources": ["Sackett DL. Evidence-Based Medicine: How to Practice and Teach EBM 5e", "AHRQ SHARE Approach；DiCenso 6S model；AGREE II；醫策會病人安全/品質指標", "Charles C. SDM model 1997；根本原因分析(RCA)方法學"]}}, "110-通論-其他-33": {"quick": "「不是」結果面品質指標者：臨床照護指引遵從率(屬過程面)。", "detail": {"background": "品質指標(Donabedian)：結構面(structure，人力/設備/制度)、過程面(process，是否依規範執行，如指引遵從率、洗手遵從率)、結果面(outcome，病人健康結局，如感染率、再入急診、術後噁心嘔吐)。　故人力、設備與制度屬結構面，指引或洗手遵從率屬過程面，唯感染率、再入急診、術後噁心嘔吐等病人健康結局才屬結果面指標。", "options": {"A": "正解(非結果面)：指引遵從率＝過程面。", "B": "術後噁心嘔吐＝結果面。", "C": "導管感染率＝結果面。", "D": "再入急診率＝結果面。"}, "sources": ["Sackett DL. Evidence-Based Medicine: How to Practice and Teach EBM 5e", "AHRQ SHARE Approach；DiCenso 6S model；AGREE II；醫策會病人安全/品質指標", "Charles C. SDM model 1997；根本原因分析(RCA)方法學"]}}, "110-通論-其他-34": {"quick": "「最不適當」採SDM者：唯一具實證基礎的常規照護(無選擇空間)。", "detail": {"background": "SDM核心是「多個合理選項並權衡病人偏好」。當僅有單一具實證的標準照護時無權衡空間，最不適合SDM；反之實證不明、需長期多重用藥、不確定性高皆適合。　SDM 的前提是存在多個合理且偏好敏感的選項可供權衡；當臨床上僅有單一具明確實證基礎的標準照護時，沒有需病人取捨的替代方案，最不適合SDM；反之實證尚不明、需長期多重用藥、不確定性高的情境，正是SDM發揮價值之處。", "options": {"A": "尚無明確實證→適合SDM。", "B": "正解(最不適當)：唯一實證常規無選擇空間。", "C": "長期多重用藥→適合SDM。", "D": "不確定性高→適合SDM。"}, "sources": ["Sackett DL. Evidence-Based Medicine: How to Practice and Teach EBM 5e", "AHRQ SHARE Approach；DiCenso 6S model；AGREE II；醫策會病人安全/品質指標", "Charles C. SDM model 1997；根本原因分析(RCA)方法學"]}}, "110-通論-其他-39": {"quick": "超音波「偽陰性高」屬實證評讀中的「可信度(validity)」問題。", "detail": {"background": "實證評讀三大面向：可信度/真確性(validity，研究/檢驗結果是否正確，偽陰偽陽性影響此項)、臨床重要性(importance，效應大小)、可應用性(applicability，能否用於我的病人)。偽陰性高代表檢查正確性/可信度不足。　故偽陰性偏高代表檢查的真確性與可信度不足，屬可信度(validity)面向的問題，而非臨床重要性或可應用性。", "options": {"A": "正解：偽陰性高＝可信度(真確性)問題。", "B": "可應用性＝能否用於病人。", "C": "臨床重要性＝效應大小。", "D": "病人期望非評讀面向。"}, "sources": ["Sackett DL. Evidence-Based Medicine: How to Practice and Teach EBM 5e", "AHRQ SHARE Approach；DiCenso 6S model；AGREE II；醫策會病人安全/品質指標", "Charles C. SDM model 1997；根本原因分析(RCA)方法學"]}}, "110-通論-其他-45": {"quick": "應用實證「不適宜」者：隨時(隨意)修訂或推翻臨床照護指引。", "detail": {"background": "臨床照護指引應依新證據「定期、系統性」檢視更新，並有明確證據等級與方法學，不可「隨時隨意」推翻。實證能力應用於個別化決策、建立標準、客觀評值成效。　臨床照護指引應依新證據定期且有系統地檢視與更新，並具明確的證據等級與方法學如 GRADE 或 AGREE II，不可憑個人喜好隨時隨意推翻；實證能力應用於擬訂個別化決策、建立標準化政策程序、客觀評值照護成效，故C不適宜。", "options": {"A": "個別化決策，適宜。", "B": "建立政策/標準，適宜。", "C": "正解(不適宜)：指引須系統定期更新，非隨時推翻。", "D": "客觀評值成效，適宜。"}, "sources": ["Sackett DL. Evidence-Based Medicine: How to Practice and Teach EBM 5e", "AHRQ SHARE Approach；DiCenso 6S model；AGREE II；醫策會病人安全/品質指標", "Charles C. SDM model 1997；根本原因分析(RCA)方法學"]}}, "111-通論-5分科-20": {"quick": "SDM(Charles 1997)決策步驟「不」含實證搜尋階段。", "detail": {"background": "Charles等(1997)SDM模式三核心：①資訊交換(information exchange，醫病雙向)②商議/審議(deliberation)③決策(decision making)。「實證搜尋」非SDM互動模式的步驟。　故「實證搜尋」並非SDM 互動模式的步驟；SDM 強調醫病雙向的資訊交換、共同審議後再形成決策。", "options": {"A": "資訊交換階段，是。", "B": "正解(非)：實證搜尋非SDM步驟。", "C": "商議階段，是。", "D": "決策階段，是。"}, "sources": ["Sackett DL. Evidence-Based Medicine: How to Practice and Teach EBM 5e", "AHRQ SHARE Approach；DiCenso 6S model；AGREE II；醫策會病人安全/品質指標", "Charles C. SDM model 1997；根本原因分析(RCA)方法學"]}}, "111-通論-5分科-31": {"quick": "「不是」5A步驟者：問題評估(assessment)——應為acquire取得證據。", "detail": {"background": "實證醫學的5A五步驟，每一步都以字母 A 開頭：Ask（提出可回答的臨床問題）、Acquire（取得/檢索最佳證據）、Appraise（文獻評讀，評估證據效度與適用性）、Apply（將證據應用於臨床、結合病人價值觀）、Assess（評值成效與回饋）。本題 (B)問題評估（assessment）並非 5A 的步驟——第二步應是Acquire（取得證據）而非 assessment，故選 B。其餘 ask、appraise、apply 皆為正確的 5A 步驟。", "options": {"A": "Ask提問，是。", "B": "正解(非)：assessment非5A，應為Acquire取得證據。", "C": "Appraise評讀，是。", "D": "Apply應用，是。"}, "sources": ["Sackett DL. Evidence-Based Medicine: How to Practice and Teach EBM 5e", "AHRQ SHARE Approach；DiCenso 6S model；AGREE II；醫策會病人安全/品質指標", "Charles C. SDM model 1997；根本原因分析(RCA)方法學"]}}, "111-通論-5分科-32": {"quick": "指引「外部審查/品質評估」工具為AGREE II。", "detail": {"background": "常用實證工具：PRISMA(系統回顧/統合分析報告規範)、ROBINS-I(非隨機研究偏差)、GRADE(證據確定性與建議強度分級)、AGREE II(臨床指引品質評估/外部審查)。考科藍臺灣手冊建議以AGREE II評估指引品質。　AGREE II 從範圍與目的、利害關係人參與、嚴謹度、清晰性、應用性與編輯獨立六大領域評估臨床指引品質，為外部審查標準工具。", "options": {"A": "PRISMA為系統回顧報告規範。", "B": "ROBINS-I評非隨機研究偏差。", "C": "正解：AGREE II評估指引品質。", "D": "GRADE評證據等級與建議強度。"}, "sources": ["Sackett DL. Evidence-Based Medicine: How to Practice and Teach EBM 5e", "AHRQ SHARE Approach；DiCenso 6S model；AGREE II；醫策會病人安全/品質指標", "Charles C. SDM model 1997；根本原因分析(RCA)方法學"]}}, "111-通論-5分科-35": {"quick": "清醒俯臥實證流程「最不適當」者：因新興疾病故偏好病例對照勝於RCT。", "detail": {"background": "證據等級階層：系統回顧/RCT > 世代 > 病例對照 > 個案系列。不應因疾病「新興」就降低證據要求而優先觀察性研究；仍應優先尋找/採用RCT等高階證據。擬PICO、依文獻定適應症、持續評值皆正確。　故不應因疾病新興就改以低階觀察性證據為優先，仍須依證據階層尋找並採用RCT 或系統回顧等最佳可得證據。", "options": {"A": "擬PICO，正確。", "B": "依文獻定適應症/流程，正確。", "C": "正解(最不適當)：不應因新興而以病例對照優於RCT。", "D": "制定後持續評值，正確。"}, "sources": ["Sackett DL. Evidence-Based Medicine: How to Practice and Teach EBM 5e", "AHRQ SHARE Approach；DiCenso 6S model；AGREE II；醫策會病人安全/品質指標", "Charles C. SDM model 1997；根本原因分析(RCA)方法學"]}}, "111-通論-5分科-42": {"quick": "DiCenso 6S中「臨床指引」屬「研究摘要(summaries)」。", "detail": {"background": "DiCenso/Haynes 6S證據金字塔(由下而上)：Studies原始研究→Synopses of studies原始研究精要→Syntheses系統回顧→Synopses of syntheses系統回顧精要→Summaries研究摘要(整合多源、含實證臨床指引/實證教科書如UpToDate)→Systems電子決策支援系統。臨床指引屬Summaries層。", "options": {"A": "原始研究精要非指引層。", "B": "正解：臨床指引屬summaries研究摘要層。", "C": "syntheses＝系統回顧。", "D": "synopses of syntheses＝系統回顧精要。"}, "sources": ["Sackett DL. Evidence-Based Medicine: How to Practice and Teach EBM 5e", "AHRQ SHARE Approach；DiCenso 6S model；AGREE II；醫策會病人安全/品質指標", "Charles C. SDM model 1997；根本原因分析(RCA)方法學"]}}, "111-通論-5分科-7": {"quick": "RCA中「以時序法列出事件先後」屬「找出近端(近因)原因」階段。", "detail": {"background": "根本原因分析(RCA)流程：①RCA前準備(組成團隊/界定範圍)②還原事件、依時序找出近端原因(proximate/近因)③進行危害(根本)分析④確認根本原因⑤研擬改善並追蹤。時序法重建事件序列即在找近端原因階段。　故以時序重建事件序列是在找出近端原因的階段，之後再進一步進行根本(危害)分析、確認根本原因並研擬改善追蹤。", "options": {"A": "準備階段為組隊/界範圍。", "B": "正解：時序重建事件＝找出近端原因。", "C": "危害分析為後續。", "D": "確認根本原因為更後階段。"}, "sources": ["Sackett DL. Evidence-Based Medicine: How to Practice and Teach EBM 5e", "AHRQ SHARE Approach；DiCenso 6S model；AGREE II；醫策會病人安全/品質指標", "Charles C. SDM model 1997；根本原因分析(RCA)方法學"]}}, "108a-TNPA-通論-15": {"quick": "照護結果指標「較不適當」敘述：每一指標都必須可測量「且可用於研究發表」。", "detail": {"background": "品質/結果指標須「可測量、可管理、可改善」(測量才能管理)，是評估是否達照護標準的篩檢工具。但指標的價值在於品質改善，「不必然」要能用於學術發表，故該敘述不適當。　品質指標的目的在於測量、管理進而改善臨床照護，是篩檢是否達標的工具；其價值在於驅動品質改善，並不以「能用於學術研究發表」為必要條件，故該敘述不適當，指標設計應重視效度、可行性與可改善性。", "options": {"A": "沒測量無法管理改善，正確。", "B": "量化測量過程與結果，正確。", "C": "指標為達標篩檢工具，正確。", "D": "正解(不適當)：指標不必然要能研究發表。"}, "sources": ["Sackett DL. Evidence-Based Medicine: How to Practice and Teach EBM 5e", "AHRQ SHARE Approach；DiCenso 6S model；AGREE II；醫策會病人安全/品質指標", "Charles C. SDM model 1997；根本原因分析(RCA)方法學"]}}, "108a-TNPA-通論-30": {"quick": "PDA(病人決策輔助工具)「有助病人釐清並溝通個人價值觀」。", "detail": {"background": "病人決策輔助工具(PDA)：提供平衡的選項資訊與結果機率，協助病人「釐清自身價值偏好」並與醫療團隊溝通，支持SDM。其目的「非」引導特定決策、非取代知情同意(知情同意用於處置前簽署)、不只是簡化溝通而是促進價值澄清。　PDA 提供客觀的選項利弊與結果機率，讓病人在知情下選出符合自身價值的方案，是輔助而非取代醫病討論或知情同意。", "options": {"A": "PDA非等同知情同意。", "B": "非為建議特定決策。", "C": "非僅簡化溝通。", "D": "正解：協助釐清並溝通個人價值觀。"}, "sources": ["Sackett DL. Evidence-Based Medicine: How to Practice and Teach EBM 5e", "AHRQ SHARE Approach；DiCenso 6S model；AGREE II；醫策會病人安全/品質指標", "Charles C. SDM model 1997；根本原因分析(RCA)方法學"]}}, "108a-TNPA-通論-80": {"quick": "跌倒方案ARR＝0.8%−0.5%＝0.3%。", "detail": {"background": "絕對風險降低(ARR)＝對照組事件率−介入組事件率。本題執行前4/500＝0.8%；執行後3/600＝0.5%；ARR＝0.8%−0.5%＝0.3%。(相對風險降低RRR＝0.3%/0.8%≈37.5%；NNT＝1/ARR≈333)。　絕對風險降低能反映實際臨床效益，相對風險降低易誇大效果；NNT 則代表需治療幾人才能避免一件事件，本題約333。", "options": {"A": "正解：0.8%−0.5%＝0.3%。", "B": "0.03%為小數點錯位。", "C": "3%高估10倍。", "D": "30%嚴重高估。"}, "sources": ["Sackett DL. Evidence-Based Medicine: How to Practice and Teach EBM 5e", "AHRQ SHARE Approach；DiCenso 6S model；AGREE II；醫策會病人安全/品質指標", "Charles C. SDM model 1997；根本原因分析(RCA)方法學"]}}, "107-TNPA-通論-80": {"quick": "「所有病人皆依規範被評估且紀錄」屬結果(outcome)指標。", "detail": {"background": "以「入院跌倒風險評估」為例：結構面＝有訂定具實證的評估規範；過程面＝照護者有能力、護理人員依規範執行；結果面＝實際上「所有病人都被評估且正確紀錄」的達成情形(實際成果)。　Donabedian 品質三面向為結構（制度設備人力，如訂定評估規範）、過程（做了什麼，如人員依規範執行）、結果（最終成效，如病人實際被評估且正確紀錄、跌倒率下降）；本題「所有病人都被評估且適當紀錄」描述的是達成的成果，屬結果指標。", "options": {"A": "訂定規範＝結構面。", "B": "照護者有能力＝結構/過程面。", "C": "正解：病人實際被評估且紀錄＝結果面。", "D": "護理人員依規範執行＝過程面。"}, "sources": ["Sackett DL. Evidence-Based Medicine: How to Practice and Teach EBM 5e", "AHRQ SHARE Approach；DiCenso 6S model；AGREE II；醫策會病人安全/品質指標", "Charles C. SDM model 1997；根本原因分析(RCA)方法學"]}}, "109-通論-其他-75": {"quick": "台灣病人安全通報系統(TPR)宗旨「不」含釐清責任。", "detail": {"background": "醫策會「台灣病人安全通報系統(TPR)」四大精神：自願通報、匿名、保密、共同學習(去究責、營造安全文化)。系統目的在學習與系統改善，「釐清/追究責任」與其非究責(no-blame)精神相違。　台灣病人安全通報系統採自願、匿名、保密、共同學習的不究責文化，目的在蒐集異常事件以系統性根因分析並改善流程；若用於釐清或追究個人責任，將使人不敢通報、反而降低病安，故「釐清責任」與其宗旨相違。", "options": {"A": "正解(不含)：釐清責任違反非究責精神。", "B": "自願通報，是。", "C": "匿名保密，是。", "D": "共同學習，是。"}, "sources": ["Sackett DL. Evidence-Based Medicine: How to Practice and Teach EBM 5e", "AHRQ SHARE Approach；DiCenso 6S model；AGREE II；醫策會病人安全/品質指標", "Charles C. SDM model 1997；根本原因分析(RCA)方法學"]}}, "110-通論-其他-7": {"quick": "臨床照護指引發展「不包括」者：每年都要更新一次。", "detail": {"background": "指引發展要素：利益衝突聲明、系統性文獻查證、明訂證據等級與建議強度、外部審查(AGREE II)。更新應「依新證據出現與既定週期」進行，非硬性規定每年更新一次。　臨床照護指引發展要素包含利益衝突聲明、系統性文獻查證、明訂證據等級與建議強度及外部審查；更新應依新證據出現及既定週期（常為2至3年或有重大新證據時）進行，並非硬性規定每年更新一次，故D不屬於必要步驟。", "options": {"A": "利益衝突聲明，是。", "B": "系統文獻查證，是。", "C": "證據等級與強度，是。", "D": "正解(不含)：非硬性每年更新一次。"}, "sources": ["Sackett DL. Evidence-Based Medicine: How to Practice and Teach EBM 5e", "AHRQ SHARE Approach；DiCenso 6S model；AGREE II；醫策會病人安全/品質指標", "Charles C. SDM model 1997；根本原因分析(RCA)方法學"]}}, "106-106a-通論-77": {"quick": "提升手術安全策略「不」含落實預防性抗生素使用規範。", "detail": {"background": "醫策會手術安全執行策略聚焦：正確辨識(病人/部位/術式)與安全查核(Time-out)、檢討不必要手術、提升麻醉照護品質。「預防性抗生素使用」屬「降低醫療照護相關感染(SSI/感控)」目標範疇，非手術安全查核之核心策略。　故預防性抗生素屬降低手術部位感染的感控目標，而非手術安全查核策略；WHO 手術安全查核分麻醉前、劃刀前與離房前三階段。", "options": {"A": "手術辨識與查核，是。", "B": "正解(不含)：預防性抗生素屬感控目標非手術安全策略。", "C": "檢討不必要手術，是。", "D": "提升麻醉照護品質，是。"}, "sources": ["Sackett DL. Evidence-Based Medicine: How to Practice and Teach EBM 5e", "AHRQ SHARE Approach；DiCenso 6S model；AGREE II；醫策會病人安全/品質指標", "Charles C. SDM model 1997；根本原因分析(RCA)方法學"]}}, "114-通論-5分科-38": {"quick": "Irvine護理角色有效模式中「不」屬結果面者：護理人員離職率(屬結構面)。", "detail": {"background": "Irvine(1998)護理角色有效模式：結構面(structure，如人力/離職率/技能組合)、過程面(process，護理活動)、結果面(outcome，病人健康結局，如CLABSI感染率、非計畫拔管、跌倒率)。離職率屬「結構面」而非結果面。", "options": {"A": "CLABSI感染率＝結果面。", "B": "非計畫氣管內管滑脫＝結果面。", "C": "正解(非結果面)：護理人員離職率＝結構面。", "D": "住院跌倒率＝結果面。"}, "sources": ["Sackett DL. Evidence-Based Medicine: How to Practice and Teach EBM 5e", "AHRQ SHARE Approach；DiCenso 6S model；AGREE II；醫策會病人安全/品質指標", "Charles C. SDM model 1997；根本原因分析(RCA)方法學"]}}, "106-106a-內科-21": {"quick": "51歲、不菸不嚼檳婦女→大腸癌＋乳癌＋子宮頸癌(無口腔癌篩檢資格)。", "detail": {"background": "國民健康署四大癌症篩檢及其資格為：①大腸癌——50–74 歲每兩年一次糞便潛血；②乳癌——45–69 歲（或 40–44 歲具家族史）每兩年乳房攝影；③子宮頸癌——30 歲以上婦女子宮頸抹片；④口腔癌——30 歲以上「有嚼檳榔（含已戒）或吸菸」者每兩年口腔黏膜檢查。本例 51 歲已婚女性、從未吸菸及嚼檳榔，不具口腔癌篩檢資格，故建議大腸癌＋乳癌＋子宮頸癌，選 C。（註：2025 年起政策擴大，新增肺癌低劑量電腦斷層篩檢，成為五癌篩檢。）", "options": {"A": "含肺癌(當年非一般篩檢)且不需口腔。", "B": "多列口腔癌(無菸檳不符)。", "C": "正解：大腸＋乳＋子宮頸。", "D": "含肺癌且漏大腸。"}, "sources": ["Harrison 21e, Ch. Prevention & Early Detection of Cancer", "衛福部國民健康署成人預防保健/國家癌症篩檢方案", "健康信念模式(HBM)、跨理論模式(TTM)、Pender健康促進模式"]}}, "106-106a-內科-23": {"quick": "慢性病毒性肝炎篩檢項目為C型肝炎抗體(anti-HCV)。", "detail": {"background": "成人預防保健「B、C型肝炎篩檢」：民國55年(含)以後出生且滿45歲、未曾接受檢查者，可搭配成人預防保健「終身一次」B肝表面抗原(HBsAg)與C肝抗體(anti-HCV)篩檢。本題選項中能篩出「慢性病毒性肝炎(C肝)」者為anti-HCV(anti-HBs僅代表B肝免疫力，非篩感染)。", "options": {"A": "IgG anti-HAV為A肝既往感染/免疫，非慢性。", "B": "IgM anti-HAV為A肝急性，非慢性。", "C": "anti-HBs為B肝免疫力非感染標記。", "D": "正解：anti-HCV篩慢性C肝。"}, "sources": ["Harrison 21e, Ch. Prevention & Early Detection of Cancer", "衛福部國民健康署成人預防保健/國家癌症篩檢方案", "健康信念模式(HBM)、跨理論模式(TTM)、Pender健康促進模式"]}}, "106-106a-通論-27": {"quick": "最優先施打流感疫苗的高危群為「長照機構老人」。", "detail": {"background": "流感疫苗優先對象：機構住民(群聚＋高齡共病、重症死亡風險最高)、65歲以上長者、慢性病患、嬰幼兒、孕婦、醫護等。其中長期照護機構老人兼具高齡、共病、群聚傳播風險，最優先。　機構住民因密集群聚、活動空間封閉、共病與失能比例高，一旦病毒入侵易爆發群聚並造成高重症與死亡，故公費流感疫苗將長照機構住民及其工作人員列為最優先對象之一；嬰幼兒、孕婦、慢性病患、醫護雖亦為高危群，但個別風險不及機構群聚。", "options": {"A": "透析病人為高危但非「最」優先群。", "B": "6歲以下為優先對象但風險次於機構長者。", "C": "慢性病成人為高危但非最優先。", "D": "正解：長照機構老人最優先。"}, "sources": ["Harrison 21e, Ch. Prevention & Early Detection of Cancer", "衛福部國民健康署成人預防保健/國家癌症篩檢方案", "健康信念模式(HBM)、跨理論模式(TTM)、Pender健康促進模式"]}}, "110-通論-其他-35": {"quick": "健康信念模式中屬「個人信念」者：「我媽死於乳癌，我擔心自己也會」(自覺罹病性/嚴重性)。", "detail": {"background": "健康信念模式(HBM)構念：自覺罹病性、自覺嚴重性、自覺利益、自覺障礙、行動線索、自我效能——皆屬「個人主觀信念」。人口學特徵(年齡/種族/教育/職業)與「知識有無」是修飾因子，非信念本身。　健康信念模式的核心構念皆屬個人主觀信念：自覺罹病性、自覺嚴重性、自覺利益、自覺障礙、行動線索與自我效能；本題「母親死於乳癌、擔心自己也會」反映自覺罹病性與嚴重性，屬個人信念，而年齡種族教育職業等人口學特徵與知識有無屬修飾因子，非信念本身。", "options": {"A": "缺乏知識屬知識面，非信念。", "B": "種族/家族史屬人口學修飾因子。", "C": "正解：擔心自己罹病＝自覺罹病性/嚴重性(個人信念)。", "D": "教育/職業屬人口學特徵。"}, "sources": ["Harrison 21e, Ch. Prevention & Early Detection of Cancer", "衛福部國民健康署成人預防保健/國家癌症篩檢方案", "健康信念模式(HBM)、跨理論模式(TTM)、Pender健康促進模式"]}}, "110-通論-其他-9": {"quick": "58歲停經、不菸不檳婦女可參與：乳癌、子宮頸癌、大腸直腸癌篩檢。", "detail": {"background": "國民健康署提供的國家級癌症篩檢為四大癌：乳癌（45–69 歲乳房攝影）、子宮頸癌（30 歲以上抹片）、大腸癌（50–74 歲糞便潛血）、口腔癌（30 歲以上且有吸菸或嚼檳榔者口腔黏膜檢查）。本例 58 歲停經婦女、無菸無檳，符合乳癌、子宮頸癌、大腸直腸癌三項，不具口腔癌資格，選 C。注意：子宮內膜癌並非國家提供的篩檢項目（無有效族群篩檢工具），不可納入。（2025 年起新增肺癌 LDCT 為第五癌篩檢。）", "options": {"A": "含子宮內膜癌(非國家篩檢)。", "B": "含子宮內膜癌且列口腔(無菸檳不符)。", "C": "正解：乳＋子宮頸＋大腸直腸。", "D": "列口腔(無菸檳不符)。"}, "sources": ["Harrison 21e, Ch. Prevention & Early Detection of Cancer", "衛福部國民健康署成人預防保健/國家癌症篩檢方案", "健康信念模式(HBM)、跨理論模式(TTM)、Pender健康促進模式"]}}, "111-通論-5分科-24": {"quick": "本題經考選部公告「送分(全給分)」。", "detail": {"background": "國民健康署對健康民眾提供的四大癌症篩檢各有年齡與危險因子資格：大腸癌 50–74 歲；乳癌 45–69 歲（40–44 歲須一等親家族史）；子宮頸癌 30 歲以上；口腔癌 30 歲以上且現在或曾經吸菸/嚼檳榔。本題逐一檢視各選項受檢者是否符合對應年齡/條件即可判斷；因選項設計與當年公告資格的對應有爭議，本題經考選部公告送分（全給分）。作答時仍應掌握各癌篩的年齡與危險因子門檻為要點。", "options": {"A": "(送分)戒檳者口腔篩檢資格認定。", "B": "(送分)55歲無家族史大腸篩檢。", "C": "(送分)父肺癌之家族史認定。", "D": "(送分)姑姑乳癌之家族史認定。"}, "sources": ["Harrison 21e, Ch. Prevention & Early Detection of Cancer", "衛福部國民健康署成人預防保健/國家癌症篩檢方案", "健康信念模式(HBM)、跨理論模式(TTM)、Pender健康促進模式"]}}, "112-通論-其他-30": {"quick": "抹片建議「正確」者：21歲以下未曾性行為者不需定期抹片。", "detail": {"background": "子宮頸抹片：建議「有性行為」之女性定期篩檢(國健署30歲以上每年/可3年一次)；從未有性行為者風險極低、不需抹片(本題正解)。曾有性行為的年長者仍建議篩檢；因癌切除子宮頸者視情況追蹤；接種HPV疫苗者「仍需」抹片(疫苗未涵蓋所有高危型)。　故從未有性行為者罹患子宮頸癌風險極低、不需抹片，而接種HPV 疫苗者「仍需」定期抹片，因疫苗未涵蓋所有高危型別。", "options": {"A": "曾有性行為之年長者仍建議篩檢。", "B": "因惡性切除者仍須追蹤。", "C": "正解：21歲以下未曾性行為者不需抹片。", "D": "接種HPV疫苗者仍需抹片。"}, "sources": ["Harrison 21e, Ch. Prevention & Early Detection of Cancer", "衛福部國民健康署成人預防保健/國家癌症篩檢方案", "健康信念模式(HBM)、跨理論模式(TTM)、Pender健康促進模式"]}}, "113-通論-家庭-29": {"quick": "乳房篩檢屬「第二段預防」(早期發現、早期治療)。", "detail": {"background": "預防醫學三段五級：第一段(健康促進、特殊保護，如衛教/疫苗)、第二段(早期診斷與治療，如各種篩檢)、第三段(限制殘障與復健)。乳房攝影篩檢屬第二段(次級預防)。　預防醫學三段五級為第一段（初級：健康促進與特殊保護，如健康教育、疫苗、營養）、第二段（次級：早期診斷與及時治療，即各種篩檢）、第三段（三級：限制殘障與復健）；乳房攝影是針對無症狀者早期發現乳癌的篩檢，屬第二段次級預防。", "options": {"A": "第一段為健康促進/疫苗。", "B": "正解：篩檢＝第二段(早期發現治療)。", "C": "第三段為復健。", "D": "無第四段(三段五級)。"}, "sources": ["Harrison 21e, Ch. Prevention & Early Detection of Cancer", "衛福部國民健康署成人預防保健/國家癌症篩檢方案", "健康信念模式(HBM)、跨理論模式(TTM)、Pender健康促進模式"]}}, "106-106a-通論-60": {"quick": "高血壓生活型態「錯誤」者：DASH飲食建議「降低不飽和脂肪酸」(應降飽和脂肪)。", "detail": {"background": "高血壓非藥物治療(生活型態)：規律有氧運動(每週≥150分鐘)＋體重控制、限鈉(<6 g NaCl/日約鈉2.4 g)、DASH飲食(高蔬果/高纖/低脂奶、降「飽和脂肪」與膽固醇，「不飽和脂肪」反建議適量攝取)、限酒(男≤2杯/日)、戒菸。", "options": {"A": "規律運動＋體重控制，正確。", "B": "限鈉<6 g NaCl/日，正確。", "C": "正解(錯誤)：DASH應降「飽和」脂肪，非不飽和脂肪。", "D": "限酒≤2杯/日，正確。"}, "sources": ["Harrison 21e, Ch. Health Behavior Change & Tobacco Use", "國民健康署「我的餐盤」、二代戒菸服務、STAR戒菸計畫", "Prochaska TTM跨理論模式；Pender健康促進模式"]}}, "106-106a-通論-70": {"quick": "體適能「錯誤」者：有氧運動目的在「增加肌力及肌肉質量」(應為心肺耐力)。", "detail": {"background": "運動生理：有氧運動主要增進「心肺耐力」並助降血糖(肌肉攝取葡萄糖↑)；增「肌力與肌肉質量」靠阻力(等張)訓練。退化性關節炎者運動可減緩肌萎縮；高血壓者宜「等張(動態)」運動優於「等長(靜態憋氣)」(後者升壓)。　故「增進肌力與肌肉質量靠有氧運動」之類敘述錯誤；運動處方應依目標選擇——心肺耐力靠有氧、肌力靠阻力訓練。", "options": {"A": "運動增肌肉攝糖、助降血糖，正確。", "B": "正解(錯誤)：增肌力/肌肉量靠阻力訓練，非有氧。", "C": "退化關節炎者運動減緩肌萎縮，正確。", "D": "高血壓宜等張優於等長，正確。"}, "sources": ["Harrison 21e, Ch. Health Behavior Change & Tobacco Use", "國民健康署「我的餐盤」、二代戒菸服務、STAR戒菸計畫", "Prochaska TTM跨理論模式；Pender健康促進模式"]}}, "108a-TNPA-通論-16": {"quick": "沉思期(contemplation)衛教：增強改變動機、權衡不改變的健康風險。", "detail": {"background": "跨理論模式（TTM）的行為改變分五階段：懵懂期（precontemplation，無改變意圖）、沉思期（contemplation，已覺察問題但矛盾猶豫）、準備期（preparation，打算近期行動）、行動期（action，已開始新行為<6個月）、維持期（maintenance，>6個月）。各階段衛教策略不同：對沉思期個案，因其正權衡利弊、動機未定，宜提升改變動機、強調不改變對健康的風險（喚起意識與情感），協助天平倒向改變。讚美增強用於行動/維持期、預防復發用於維持期、提供試用券屬準備/行動期，故本題選 D。", "options": {"A": "讚美增強屬行動期。", "B": "免費試用券屬行動期誘因。", "C": "預防復發屬維持期。", "D": "正解：增強動機與不改變風險＝沉思期重點。"}, "sources": ["Harrison 21e, Ch. Health Behavior Change & Tobacco Use", "國民健康署「我的餐盤」、二代戒菸服務、STAR戒菸計畫", "Prochaska TTM跨理論模式；Pender健康促進模式"]}}, "108b-TNPA-通論-51": {"quick": "「我的餐盤」口訣「錯誤」者：水果和蔬菜一樣多(應「菜比水果多一點」)。", "detail": {"background": "國健署「我的餐盤」六口訣：每天早晚一杯奶、每餐水果拳頭大、「菜比水果多一點」、飯跟蔬菜一樣多、豆魚蛋肉一掌心、堅果種子一茶匙。蔬菜量應「多於」水果。　國健署「我的餐盤」強調菜比水果多一點，因蔬菜熱量低、纖維與植化素豐富，份量應略多於水果；其餘口訣為每天早晚一杯奶、每餐水果拳頭大、飯跟蔬菜一樣多、豆魚蛋肉一掌心、堅果種子一茶匙，故「水果和蔬菜一樣多」敘述錯誤。", "options": {"A": "飯和蔬菜一樣多，正確。", "B": "豆魚蛋肉一掌心，正確。", "C": "正解(錯誤)：應「菜比水果多一點」，非一樣多。", "D": "每餐水果拳頭大，正確。"}, "sources": ["Harrison 21e, Ch. Health Behavior Change & Tobacco Use", "國民健康署「我的餐盤」、二代戒菸服務、STAR戒菸計畫", "Prochaska TTM跨理論模式；Pender健康促進模式"]}}, "108b-TNPA-通論-62": {"quick": "戒菸沉思期介入：請個案描述吸菸的所有優缺點(權衡利弊)。", "detail": {"background": "戒菸的行為改變介入須對應階段。處於沉思期（contemplation）的吸菸者已意識到吸菸問題，但同時存在「想戒」與「想繼續抽」的矛盾心情，尚未承諾行動。此階段最適合做決策平衡（decisional balance）——請個案說出吸菸的所有優點與缺點，協助他自己權衡利弊、強化改變動機，故選 B。相對地，「選定戒菸日」屬準備期、「給壞處資訊以減低興趣」較適懵懂期、「加強自我解脫意念」屬行動期策略，皆與沉思期不符。", "options": {"A": "單給壞處資訊較被動。", "B": "正解：描述吸菸優缺點＝沉思期權衡利弊。", "C": "選定戒菸日屬準備/行動期。", "D": "自我解脫屬後期策略。"}, "sources": ["Harrison 21e, Ch. Health Behavior Change & Tobacco Use", "國民健康署「我的餐盤」、二代戒菸服務、STAR戒菸計畫", "Prochaska TTM跨理論模式；Pender健康促進模式"]}}, "109-通論-其他-72": {"quick": "尼古丁戒斷症狀「不正確」者：嗜睡(戒斷為失眠而非嗜睡)。", "detail": {"background": "尼古丁戒斷症候群：情緒低落/易怒焦慮、注意力不集中、失眠、食慾增加/體重上升、坐立不安、菸癮渴求。「嗜睡」非戒斷症狀(反為失眠)。　尼古丁戒斷源於中樞多巴胺與正腎上腺素活性下降，典型為情緒低落、易怒焦慮、注意力不集中、失眠、食慾增加與體重上升、坐立不安及強烈菸癮渴求，多在戒菸後數小時至數天出現、數週緩解；症狀是失眠而非嗜睡，故D不正確。", "options": {"A": "情緒低落，是。", "B": "體重增加，是。", "C": "注意力不集中，是。", "D": "正解(不正確)：戒斷為失眠非嗜睡。"}, "sources": ["Harrison 21e, Ch. Health Behavior Change & Tobacco Use", "國民健康署「我的餐盤」、二代戒菸服務、STAR戒菸計畫", "Prochaska TTM跨理論模式；Pender健康促進模式"]}}, "110-通論-其他-4": {"quick": "臨床病人教育「錯誤」者：剛獲知罹癌即提供各項副作用衛教可降焦慮。", "detail": {"background": "病人教育原則：依病人背景/感官/識能選擇方式；賦能(empowerment)促自我照護；剛確診者處於情緒衝擊期，「立即大量」副作用資訊反而增加焦慮，應分階段、先情緒支持再漸進衛教。　剛獲知罹癌的病人正處於震驚與否認等情緒衝擊期，認知與接收能力下降，此時立即提供大量治療副作用資訊會加重焦慮、影響理解；應先給予情緒支持、評估準備度，再分階段依病人識能與背景漸進衛教，故C錯誤。", "options": {"A": "知識不足時直接指導，適當。", "B": "教備餐屬賦能，正確。", "C": "正解(錯誤)：剛確診即大量副作用衛教反增焦慮。", "D": "依背景與感官選材，正確。"}, "sources": ["Harrison 21e, Ch. Health Behavior Change & Tobacco Use", "國民健康署「我的餐盤」、二代戒菸服務、STAR戒菸計畫", "Prochaska TTM跨理論模式；Pender健康促進模式"]}}, "110-通論-其他-44": {"quick": "低健康識能病人溝通：會談使用白話文、避免醫療術語。", "detail": {"background": "低健康識能(health literacy)溝通策略：用白話/淺顯語言、避免術語、善用圖像/多媒體、回覆示教(teach-back)確認理解、衛教對象以病人本人為主(可納照顧者)。　對低健康識能者應用淺顯白話、避免醫療術語、善用圖像與多媒體輔助、放慢速度，並以回覆示教請病人複述以確認理解；衛教對象以病人本人為主、必要時納入照顧者，故C最適當，避免多媒體、省略回覆示教、只教家屬皆不妥。", "options": {"A": "多媒體有助理解，不應避免。", "B": "回覆示教很重要，不可省。", "C": "正解：用白話文、避免術語。", "D": "應以病人本人為主，非僅家屬。"}, "sources": ["Harrison 21e, Ch. Health Behavior Change & Tobacco Use", "國民健康署「我的餐盤」、二代戒菸服務、STAR戒菸計畫", "Prochaska TTM跨理論模式；Pender健康促進模式"]}}, "111-通論-5分科-18": {"quick": "病人衛教「錯誤」者：依醫療人員方便選定「單一」教學法與工具。", "detail": {"background": "有效衛教：先評估病人對疾病認識程度、確立學習目標、依「病人需求與特性」個別化選擇多元教學方法/工具、每日評估執行狀況以激發參與動機。依醫療人員方便用單一方法違反個別化原則。　有效衛教須以病人為中心並個別化：先評估病人對疾病的認識與學習需求、確立明確學習目標、依病人特性選用多元教學方法與工具、並每日評估執行以維持動機；若僅依醫療人員方便與可近性選定單一方法，違反個別化原則，故B錯誤。", "options": {"A": "先評估認識程度，正確。", "B": "正解(錯誤)：應依病人需求個別化，非依人員方便用單一法。", "C": "每日評估激發動機，正確。", "D": "明確學習目標，正確。"}, "sources": ["Harrison 21e, Ch. Health Behavior Change & Tobacco Use", "國民健康署「我的餐盤」、二代戒菸服務、STAR戒菸計畫", "Prochaska TTM跨理論模式；Pender健康促進模式"]}}, "111-通論-5分科-36": {"quick": "STAR戒菸計畫「錯誤」者：T(Tell)為「暗自告訴自己」(應告知親友尋求支持)。", "detail": {"background": "STAR戒菸計畫：S(Set)慎重設定戒菸日；T(Tell)告訴家人朋友同事、尋求支持；A(Anticipate)預期戒菸困難並安排因應;R(Remove)移除環境中的菸與相關物品。T是「對外告知求支持」，非暗自。　故STAR 之T(Tell)是主動告知家人朋友同事以尋求支持，而非暗自戒菸；充足的社會支持有助提升戒菸成功率。", "options": {"A": "S設定戒菸日，正確。", "B": "正解(錯誤)：T為告知親友求支持，非暗自告訴自己。", "C": "A預期困難並因應，正確。", "D": "R移除菸品，正確。"}, "sources": ["Harrison 21e, Ch. Health Behavior Change & Tobacco Use", "國民健康署「我的餐盤」、二代戒菸服務、STAR戒菸計畫", "Prochaska TTM跨理論模式；Pender健康促進模式"]}}, "111-通論-5分科-40": {"quick": "行為改變階段「錯誤」者：決定/準備期「通常還未有任何改變」。", "detail": {"background": "跨理論模式（TTM）行為改變階段的定義：懵懂期（未來六個月內無改變意圖）；沉思期（已覺察問題，但有繼續與停止的矛盾心情，打算未來六個月內改變）；準備期/決定期（打算未來一個月內採取行動，且通常已開始做些小改變，如諮詢、訂計畫）；行動期（已實際改變<六個月）；維持期（新行為已穩定>六個月）。本題 (C) 稱決定期通常還未有任何改變錯誤——準備期者通常已有初步小行動，故選 C。其餘 (A)(B)(D) 對懵懂、沉思、維持期的描述皆正確。", "options": {"A": "懵懂期6個月內無意圖，正確。", "B": "沉思期覺察問題但矛盾，正確。", "C": "正解(錯誤)：準備期常已有小改變，非完全未改變。", "D": "維持期逾6個月，正確。"}, "sources": ["Harrison 21e, Ch. Health Behavior Change & Tobacco Use", "國民健康署「我的餐盤」、二代戒菸服務、STAR戒菸計畫", "Prochaska TTM跨理論模式；Pender健康促進模式"]}}, "112-通論-其他-32": {"quick": "二代戒菸藥物治療「不適當」對象：孕婦、哺乳者。", "detail": {"background": "二代戒菸服務藥物治療對象：年滿18歲、尼古丁成癮度測試(FTND)≥4分「或」平均每日吸菸≥10支者。孕婦/哺乳婦女為戒菸藥物(如varenicline、bupropion、NRT)之相對禁忌，應以非藥物方式介入。　故孕婦與哺乳婦女屬戒菸藥物(varenicline、bupropion、NRT)的相對禁忌，應改以非藥物方式介入，不適合作為藥物治療對象。", "options": {"A": "須年滿18歲，正確。", "B": "FTND≥4分，正確。", "C": "正解(不適當)：孕婦/哺乳者非藥物治療對象。", "D": "每日≥10支，正確。"}, "sources": ["Harrison 21e, Ch. Health Behavior Change & Tobacco Use", "國民健康署「我的餐盤」、二代戒菸服務、STAR戒菸計畫", "Prochaska TTM跨理論模式；Pender健康促進模式"]}}, "113-通論-5分科-3": {"quick": "衛教評量「錯誤」者：記錄學習歷程屬「確定性評量」(應為形成性評量)。", "detail": {"background": "教育評量類型：安置性(教學前了解起點/個別差異)、診斷性(找出學習困難)、形成性(教學歷程中持續記錄與回饋)、總結/確定性(教學後判定是否達成目標)。記錄「教學活動中的學習歷程」屬「形成性評量」，非確定性。　故記錄教學歷程中的學習屬「形成性評量」，而「總結(確定)性評量」是在教學結束後判定目標是否達成，兩者目的與時機不同。", "options": {"A": "能說出方法屬認知評量，正確。", "B": "教學前測了解差異屬安置性，正確。", "C": "了解學習困難屬診斷性，正確。", "D": "正解(錯誤)：歷程記錄屬形成性，非確定性。"}, "sources": ["Harrison 21e, Ch. Health Behavior Change & Tobacco Use", "國民健康署「我的餐盤」、二代戒菸服務、STAR戒菸計畫", "Prochaska TTM跨理論模式；Pender健康促進模式"]}}, "113-通論-5分科-33": {"quick": "預防年輕人藥物濫用最有效：建立支持網絡＋心理諮商＋健康教育＋社區/體育活動。", "detail": {"background": "物質濫用一級預防：以「支持性環境、社會連結、技能與替代活動、心理諮商」之綜合策略最有效；單純恐嚇(法律威脅)、被動發資料、過度高強度運動皆成效有限或反效果。　物質濫用的一級預防以建立支持性社會連結、提供心理諮商與健康教育、培養因應技能與正向替代活動之綜合策略最有效；單純恐嚇法律後果、被動發放大量資料讓其自行閱讀、或僅以高強度運動消耗體力，實證上成效有限甚至引發反抗，故A最具預防成效。", "options": {"A": "正解：支持網絡＋諮商＋衛教＋社區活動最有效。", "B": "被動閱讀資料成效有限。", "C": "威脅法律後果為恐嚇式，成效差。", "D": "高強度運動非實證有效預防策略。"}, "sources": ["Harrison 21e, Ch. Health Behavior Change & Tobacco Use", "國民健康署「我的餐盤」、二代戒菸服務、STAR戒菸計畫", "Prochaska TTM跨理論模式；Pender健康促進模式"]}}, "113-通論-5分科-34": {"quick": "Pender健康促進模式：提供好處與成功案例、設可達成小目標以增自我效能。", "detail": {"background": "Pender健康促進模式強調「自覺行動利益、自我效能、行動承諾、人際與情境影響」。對缺乏動力者，提供利益資訊與成功典範、設定可達成的小目標以「增強自我效能感」最能促成行為改變；強迫/恐嚇/規範式作法成效差。　故對缺乏動力者，提供行動利益資訊與成功典範、設定可達成的小目標以增強自我效能最能促成行為改變，恐嚇或強迫式作法成效差。", "options": {"A": "強迫高強度運動並監督，違反自我效能與自主。", "B": "正解：提供利益/典範＋可達成小目標增自我效能。", "C": "恐嚇後果非Pender策略。", "D": "規範式講座記錄成效有限。"}, "sources": ["Harrison 21e, Ch. Health Behavior Change & Tobacco Use", "國民健康署「我的餐盤」、二代戒菸服務、STAR戒菸計畫", "Prochaska TTM跨理論模式；Pender健康促進模式"]}}, "113-通論-家庭-42": {"quick": "二代戒菸補助「最不適當」者：民眾免掛號費、政府全額補助。", "detail": {"background": "二代戒菸治療與衛教服務：由醫師/牙醫師提供戒菸藥物治療，每年補助2次療程(每次以8週為限)、同一療程須於同一醫事機構完成；民眾仍須「部分負擔」(掛號費/藥品部分負擔)，非政府全額補助。　二代戒菸治療與衛教服務由醫師或牙醫師提供戒菸藥物，每年補助2次療程、每次以8週為限、同一療程須於同一醫事機構完成；惟民眾仍須負擔掛號費及藥品部分負擔，並非政府全額補助、免付掛號費，故D最不適當。", "options": {"A": "醫師/牙醫提供藥物治療，正確。", "B": "每年2次療程、每次8週，正確。", "C": "同一機構完成療程，正確。", "D": "正解(最不適當)：民眾仍須部分負擔，非全額免費。"}, "sources": ["Harrison 21e, Ch. Health Behavior Change & Tobacco Use", "國民健康署「我的餐盤」、二代戒菸服務、STAR戒菸計畫", "Prochaska TTM跨理論模式；Pender健康促進模式"]}}, "114-通論-5分科-12": {"quick": "「過重飲食行為」介入第一個月最適行為指標：完成20天每日飲食紀錄。", "detail": {"background": "行為改變評量應對應「目標層次與時程」：第一個月以「行為過程指標(如飲食自我監測天數)」最適合且可達成；體脂/LDL為「生理結果指標」需更長時間；步數屬身體活動而非飲食行為。　行為改變的評量指標應對應目標層次與可達成時程：飲食行為改變的第一個月宜用行為過程指標，如完成20天飲食自我監測紀錄，可立即觀察並激勵參與；體脂肪與LDL等生理結果指標需數月才見變化，步數屬身體活動而非飲食行為，故C最適合。", "options": {"A": "體脂降低為結果指標、第一月難達。", "B": "LDL降低為生理結果、需更久。", "C": "正解：完成20天飲食紀錄＝可達成的行為過程指標。", "D": "步數屬運動非飲食行為
