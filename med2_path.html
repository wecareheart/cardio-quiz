 & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_115020-84":{"quick":"缺鐵性貧血病人血漿的總鐵結合力(TIBC)最可能高於正常值。","detail":{"background":"缺鐵性貧血的鐵相關檢驗:①「血比容下降(貧血)」(故A低);②「平均紅血球血紅素濃度(MCHC)下降(低色素)」(故B低);③「血漿總鐵結合力(TIBC,反映運鐵蛋白)升高(高於正常)(鐵缺乏→運鐵蛋白代償增加)」(C正確);④「血清鐵蛋白(ferritin,反映儲鐵)下降」(故D低)。故最可能高於正常者為總鐵結合力。","options":{"A":"血比容下降(貧血)。","B":"MCHC下降(低色素)。","C":"總鐵結合力升高(高於正常)—正解。","D":"血清鐵蛋白下降。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_115020-86":{"quick":"乳糜瀉最常發生的惡性腫瘤是腸病相關T細胞淋巴瘤(非B細胞),故D最不適當。","detail":{"background":"乳糜瀉(celiac disease):①「又稱麩質敏感腸病(gluten-sensitive enteropathy)」(A正確);②「與HLA-DQ2或HLA-DQ8等位基因相關」(B正確);③「組織病理含上皮內淋巴球增多、絨毛萎縮、隱窩增生」(C正確);④「最常發生的惡性腫瘤是腸病相關T細胞淋巴瘤(enteropathy-associated T-celllymphoma, EATL),而非B細胞淋巴瘤」——故D最不適當。故D最不適當。","options":{"A":"又稱麩質敏感腸病,正確。","B":"與HLA-DQ2或DQ8相關,正確。","C":"病理含上皮內淋巴球增多,正確。","D":"最常發生為腸病相關T細胞淋巴瘤(非B細胞)—錯誤(正解)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_115020-97":{"quick":"橋本氏甲狀腺炎較常出現抗甲狀腺球蛋白抗體與抗甲狀腺過氧化酶(微粒體)抗體。","detail":{"background":"「橋本氏甲狀腺炎(Hashimoto thyroiditis)」是自體免疫甲狀腺炎,較常出現的自體抗體是抗甲狀腺球蛋白抗體(anti-thyroglobulin)與抗甲狀腺過氧化酶抗體(anti-TPO,即抗微粒體抗體)(致甲狀腺破壞、低下)。抗TSH受體抗體(刺激型)是Graves病;抗核抗體、抗粒線體抗體非橋本氏特異。故為抗甲狀腺球蛋白+抗TPO抗體。","options":{"A":"橋本氏甲狀腺炎為抗甲狀腺球蛋白+抗TPO(微粒體)抗體—正解。","B":"抗TSH受體抗體見於Graves病。","C":"抗核抗體非橋本氏特異。","D":"抗粒線體抗體見於PBC、抗TSH受體見於Graves。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_106100-98":{"quick":"麻疹後急性瀰漫性腦脊髓炎(ADEM)是髓鞘脫失(脫髓鞘)疾病。","detail":{"background":"「急性瀰漫性腦脊髓炎(acute disseminated encephalomyelitis, ADEM)」常發生於麻疹/水痘等病毒感染或疫苗之後,是免疫媒介的脫髓鞘(髓鞘脫失demyelinating)疾病(血管周圍脫髓鞘與發炎)。其非直接傳染(是感染後免疫反應),以髓鞘脫失為主(非軸突或星狀細胞破壞)。故為髓鞘脫失疾病。","options":{"A":"ADEM為感染後免疫媒介(非直接傳染病)。","B":"ADEM為髓鞘脫失(脫髓鞘)疾病—正解。","C":"非以破壞軸突為主。","D":"非以破壞星狀細胞為主。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_106100-100":{"quick":"本題公告「一律給分」;腦挫傷為局部破壞,不致代償性水腦(其餘為瀰漫性腦萎縮)。","detail":{"background":"「代償性水腦症(hydrocephalus ex vacuo)」是腦實質瀰漫性萎縮(腦組織流失)→腦室被動擴大(代償空缺,非腦脊髓液阻塞)。①「Alzheimer氏病(瀰漫腦萎縮)」、②「Huntington舞蹈症(尾核萎縮)」、④「全身輕性麻痺(梅毒,瀰漫腦萎縮)」——皆瀰漫萎縮→代償性水腦。而「腦挫傷」是局部創傷破壞(非瀰漫萎縮)。本題經評定後「一律給分(送分)」。","options":{"A":"Alzheimer氏病為瀰漫腦萎縮、有代償性水腦。","B":"Huntington舞蹈症有腦萎縮、有代償性水腦。","C":"腦挫傷為局部破壞、不致代償性水腦(本題送分)—正解。","D":"全身輕性麻痺(梅毒)為瀰漫腦萎縮、有代償性水腦。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108100-98":{"quick":"大部分發育不良痣不會轉變成黑色素瘤,D正確。","detail":{"background":"發育不良痣(dysplastic nevi):①「通常較一般痣大(常>5mm,邊緣不規則、顏色不均)」(故A「較小、<5mm」錯誤);②「不限於曬太陽部位(也可見於非曝曬區)」(故B錯誤);③「組織形態多為交界痣或複合痣(非皮內痣)」(故C錯誤);④「大部分發育不良痣不會轉變成黑色素瘤(但風險較一般痣高,尤家族性發育不良痣症候群)」(D正確)。故D正確。","options":{"A":"通常較大(>5mm)、非較小—錯誤。","B":"不限於曬太陽部位—錯誤。","C":"組織形態多為交界/複合痣(非皮內痣)—錯誤。","D":"大部分不會轉變成黑色素瘤—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108100-100":{"quick":"惡性貧血伴隨的特殊神經病變在脊髓(亞急性合併變性)。","detail":{"background":"「惡性貧血(pernicious anemia,維生素B12缺乏)」伴隨的特殊神經病理病變是脊髓亞急性合併變性(subacute combined degeneration)——侵犯脊髓的後索(本體感覺)與側索(皮質脊髓束)脫髓鞘(致感覺異常、共濟失調、無力)。大腦白質/皮質、小腦非主要部位。故為脊髓。","options":{"A":"大腦白質非主要部位。","B":"惡性貧血神經病變在脊髓(亞急性合併變性)—正解。","C":"大腦皮質非主要部位。","D":"小腦非主要部位。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109020-93":{"quick":"嗜鉻細胞瘤的支持細胞(sustentacular cells)以S100蛋白染色標記。","detail":{"background":"「嗜鉻細胞瘤(pheochromocytoma)」的主細胞(嗜鉻細胞)表現嗜鉻粒蛋白(chromogranin)、突觸素、NSE(神經內分泌標記);而其周邊的支持細胞(sustentacular cells,類似許旺細胞)則以S100蛋白免疫染色標記突顯(圍繞細胞巢「Zellballen」)。嗜鉻粒蛋白、突觸素、NSE標記的是主細胞(非支持細胞)。故支持細胞為S100。","options":{"A":"嗜鉻粒蛋白標記主細胞(嗜鉻細胞)。","B":"支持細胞以S100蛋白標記—正解。","C":"突觸素標記主細胞。","D":"神經元特異性烯醇化酶標記主細胞。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109020-99":{"quick":"大腦類澱粉血管病變(CAA)是腦葉出血原因、且與阿茲海默(Aβ)相關(①③)。","detail":{"background":"大腦類澱粉血管病變(cerebral amyloid angiopathy, CAA):①「是老年人腦葉出血(lobar hemorrhage)的重要原因(Aβ沉積於軟腦膜與皮質小血管壁→血管脆弱破裂)」(①正確);③「與阿茲海默症相關(同為Aβ沉積)」(③正確)。本題①③(13)正確。故為13。","options":{"A":"組合不符。","B":"①CAA為腦葉出血原因③與阿茲海默(Aβ)相關—正解(13)。","C":"組合不符。","D":"組合不符。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109100-99":{"quick":"肌萎縮側索硬化症(ALS)的異常蛋白為TDP-43/SOD1(非Tau),故C配對錯誤。","detail":{"background":"神經退化性疾病與異常堆積蛋白:①「額顳葉退化性失智(FTLD)—TDP-43(部分Tau)」(A正確);②「阿茲海默症—Aβ(與Tau)」(B正確);③「肌萎縮側索硬化症(ALS)—TDP-43、SOD1、C9orf72(而非Tau)」——故C(配Tau)錯誤;④「帕金森氏症—α-突觸核蛋白(α-synuclein,Lewy body)」(D正確)。故C錯誤。","options":{"A":"FTLD—TDP-43,正確。","B":"阿茲海默症—Aβ,正確。","C":"ALS應為TDP-43/SOD1(非Tau)—錯誤(正解)。","D":"帕金森氏症—α-synuclein,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109100-100":{"quick":"JC病毒易感染寡樹突神經膠細胞(本題A、B均給分)。","detail":{"background":"「JC多瘤病毒(JC polyomavirus)」在免疫低下者再活化,主要感染寡樹突神經膠細胞(oligodendrocyte,製造髓鞘)→脫髓鞘→進行性多灶性白質腦病(PML)(亦可感染星狀細胞致異形變)。本題公告「A、B(寡樹突細胞與星狀細胞)均給分」。微膠細胞、神經元非主要。故為寡樹突神經膠細胞(A,B亦給分)。","options":{"A":"JC病毒易感染寡樹突神經膠細胞—正解。","B":"星狀神經膠細胞亦可受感染(本題判給分)。","C":"微膠細胞非主要。","D":"神經元細胞非主要。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_110020-76":{"quick":"類纖維蛋白性壞死(fibrinoid necrosis)最常出現於血管炎。","detail":{"background":"「類纖維蛋白性壞死(fibrinoid necrosis)」是免疫反應(抗原-抗體複合體)或嚴重高血壓損傷血管壁,使血漿蛋白(纖維蛋白等)滲入血管壁→呈明亮嗜酸性(粉紅),最常見於血管炎(vasculitis)(及惡性高血壓、免疫複合體疾病)。結核(乾酪)、腦梗塞(液化)、急性胰臟炎(脂肪/出血壞死)的型態不同。故為血管炎。","options":{"A":"結核為乾酪性壞死。","B":"腦梗塞為液化性壞死。","C":"類纖維蛋白性壞死最常見於血管炎—正解。","D":"急性胰臟炎為脂肪/出血性壞死。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_110020-99":{"quick":"阿茲海默症大腦主要病變為神經炎斑塊與神經纖維纏結(①②)。","detail":{"background":"「阿茲海默症(Alzheimer disease)」的大腦主要病理變化:①「神經炎斑塊(neuritic/senile plaque,核心為Aβ類澱粉)」;②「神經纖維纏結(neurofibrillary tangle,過度磷酸化Tau蛋白)」(及腦萎縮、澱粉樣血管病變)。本題①②(12)。故為12。","options":{"A":"①神經炎斑塊②神經纖維纏結為阿茲海默主要病變—正解(12)。","B":"組合不符。","C":"組合不符。","D":"組合不符。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111020-80":{"quick":"脫髓鞘性病變少見於腦外傷的後遺症。","detail":{"background":"腦外傷(head trauma)的後遺症:①「精神疾病(人格改變、認知障礙)」(A常見);②「外傷後癲癇(epilepsy)」(B常見);③「(交通性)水腦(hydrocephalus,蛛網膜下出血後)」(C常見);④「脫髓鞘性病變(demyelinating disease)」少見於腦外傷後遺症(脫髓鞘多為免疫/感染相關,非外傷)。故少見者為脫髓鞘性病變。","options":{"A":"精神疾病為腦外傷後遺症。","B":"癲癇為腦外傷後遺症。","C":"水腦為腦外傷後遺症。","D":"脫髓鞘性病變少見於腦外傷後遺症—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111020-82":{"quick":"鼻腦白黴菌病的易感因素包括嗜中性球低下(及糖尿病酮酸中毒),D正確。","detail":{"background":"鼻腦白黴菌病(rhinocerebral mucormycosis,毛黴菌):①「其快速壞死主因是菌絲侵犯血管→血栓梗塞組織壞死(血管侵襲性),而非外毒素」(故A錯誤);②「典型菌絲寬大、無隔(或少隔)、直角(90度)分枝、寬度不一」(故B分節清楚、銳角、寬度固定錯誤);③「毛黴菌非雙態性真菌」(故C錯誤);④「易感因素含糖尿病酮酸中毒、嗜中性球低下(neutropenia)、免疫低下」(D正確)。故D正確。","options":{"A":"快速壞死因血管侵犯梗塞(非外毒素)—錯誤。","B":"菌絲為寬大無隔直角分枝(非分節清楚銳角)—錯誤。","C":"毛黴菌非雙態性真菌—錯誤。","D":"易感因素含嗜中性球低下—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111100-78":{"quick":"埃勒斯-丹洛斯症候群因纖維性膠原蛋白缺陷,D正確。","detail":{"background":"體染色體遺傳病:①「酵素缺陷引起的遺傳病以隱性遺傳為主(非顯性)」(故A錯誤);②「家族性高膽固醇血症為LDL受體(receptor)缺陷(非LDL蛋白本身)」(故B錯誤);③「高雪氏症(Gaucher)為隱性遺傳、葡萄糖腦苷脂酶(glucocerebrosidase)缺陷(C的酶名/遺傳大致對,但本題以D為正解,C或有他誤)」;④「埃勒斯-丹洛斯症候群因纖維性膠原蛋白(fibrillar collagen)的缺陷」(D正確)。故D正確。","options":{"A":"酵素缺陷遺傳病多為隱性(非顯性)—錯誤。","B":"家族性高膽固醇為LDL受體缺陷(非LDL蛋白)—錯誤。","C":"高雪氏症為隱性、glucocerebrosidase缺陷(本題以D為解)。","D":"埃勒斯-丹洛斯症候群因纖維性膠原蛋白缺陷—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111100-80":{"quick":"甲醛(formaldehyde)最不易引起周邊及中樞神經病變。","detail":{"background":"神經毒性物質:①「Acrylamide(丙烯醯胺)——周邊神經病變」(A為神經毒);②「Ketones(如n-hexane/MnBK代謝)——周邊神經病變」(B為神經毒);④「Mercury(汞)——中樞與周邊神經病變」(D為神經毒)。而「Formaldehyde(甲醛)」主要為黏膜刺激與致癌物,最不易引起神經病變。故最不易者為甲醛。","options":{"A":"Acrylamide為神經毒(周邊神經病變)。","B":"Ketones(n-hexane代謝)為神經毒。","C":"Formaldehyde最不易引起神經病變—正解。","D":"Mercury(汞)為神經毒。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111100-98":{"quick":"16歲脛骨上端膨脹性溶解病變(含液-液平面),最可能為動脈瘤樣骨性囊腫。","detail":{"background":"本題16歲青少年、脛骨上端(幹骺端)膨脹性溶解病變——典型為動脈瘤樣骨性囊腫(aneurysmal bone cyst, ABC):好發青少年長骨幹骺端,膨脹性溶骨、多血腔含液-液平面(fluid-fluid levels)。海綿狀血管瘤、骨母細胞瘤、骨巨細胞瘤(好發骨骺、20-40歲閉合後)的型態/年齡不同。故為動脈瘤樣骨性囊腫。","options":{"A":"海綿狀血管瘤非此型態。","B":"骨母細胞瘤多在脊椎後柱。","C":"骨巨細胞瘤好發骨骺、20-40歲。","D":"動脈瘤樣骨性囊腫(青少年、膨脹溶骨、液-液平面)—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111100-99":{"quick":"包涵體肌炎肌肉切片在Gomori trichrome下見鑲邊空泡(rimmed vacuole)。","detail":{"background":"「包涵體肌炎(inclusion body myositis)」的肌肉切片特徵是鑲邊空泡(rimmed vacuole,Gomori trichrome染色空泡周邊紅染顆粒)(及細胞質/核內包涵體、發炎浸潤、TDP-43/澱粉樣沉積)。Hirano body(海馬,阿茲海默)、Negri body(狂犬病)、nemaline rod(桿狀體肌病)非此。故為rimmed vacuole。","options":{"A":"Hirano body見於海馬(阿茲海默)。","B":"包涵體肌炎見rimmed vacuole(鑲邊空泡)—正解。","C":"Negri body見於狂犬病。","D":"nemaline rod見於桿狀體肌病。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111100-100":{"quick":"眼黑色素瘤發生於虹膜(iris)時通常發展較慢(indolent)。","detail":{"background":"「眼睛(葡萄膜)的惡性黑色素瘤」依部位:發生於虹膜(iris)者通常發展較慢(indolent course,因虹膜病灶易早期被察覺、且生物行為較惰性)、預後較好。而脈絡膜(choroid)、睫狀體的黑色素瘤較侵襲、易轉移(尤肝)。視網膜非黑色素瘤好發處。故發展較慢者為虹膜。","options":{"A":"虹膜黑色素瘤發展較慢(indolent)—正解。","B":"視網膜非葡萄膜黑色素瘤好發處。","C":"脈絡膜黑色素瘤較具侵襲性。","D":"睫狀體黑色素瘤較具侵襲性。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112020-99":{"quick":"庫賈氏症(CJD)大腦主要病變為海綿狀腦病變(spongiform encephalopathy)。","detail":{"background":"「庫賈氏症(Creutzfeldt-Jakob disease, CJD,普利昂病)」的大腦主要病理變化是海綿狀腦病變(spongiform encephalopathy)——神經氈(neuropil)出現空泡化(海綿狀)、神經元流失、星狀細胞增生(無發炎),與異常普利昂蛋白(PrPsc)沉積有關。脫髓鞘斑塊(MS)、環狀出血(脂肪栓塞)、TH17浸潤(自體免疫)非CJD。故為海綿狀腦病變。","options":{"A":"demyelinated plaque見於多發性硬化症。","B":"ring hemorrhage見於脂肪栓塞。","C":"TH17 T細胞浸潤見於自體免疫。","D":"庫賈氏症為海綿狀腦病變—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112020-100":{"quick":"兒童橋腦瀰漫性膠質瘤(DIPG)的特徵突變為H3 K27M(H3.1或H3.3)。","detail":{"background":"本題兒童橋腦瀰漫性膠質瘤(diffuse glioma,瀰漫性中線膠質瘤/DIPG):其特徵分子變化是組蛋白H3(H3.1或H3.3)的K27M突變(WHO瀰漫性中線膠質瘤、H3 K27-變異,預後差)。ATRX loss(成人星細胞瘤)、MGMT甲基化(膠質母細胞瘤治療反應)、1p/19q共缺失(寡突膠質瘤)非DIPG特徵。故為H3 K27M突變。","options":{"A":"ATRX loss見於成人星細胞瘤。","B":"兒童橋腦瀰漫性膠質瘤為H3 K27M突變—正解。","C":"MGMT甲基化為膠質母細胞瘤治療標記。","D":"1p/19q共缺失見於寡突膠質瘤。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112100-84":{"quick":"胸腺瘤最常併發純紅血球再生不良(pure red cell aplasia)。","detail":{"background":"「胸腺瘤(thymoma)」是前縱隔腫瘤,常伴副贅瘤症候群,其中最常併發的血液異常之一是純紅血球再生不良(pure red cell aplasia,骨髓紅血球前驅細胞選擇性缺乏)(及重症肌無力、低丙球蛋白血症)。畸胎瘤、腦膜瘤、生殖細胞瘤非典型。故為胸腺瘤。","options":{"A":"畸胎瘤非典型併發純紅血球再生不良。","B":"胸腺瘤最常併發純紅血球再生不良—正解。","C":"腦膜瘤非此。","D":"生殖細胞瘤非此。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112100-99":{"quick":"第III-IV級星細胞瘤帶IDH1突變者預後較wild-type好。","detail":{"background":"「第III-IV級星狀神經膠細胞瘤(astrocytoma, WHO grade III-IV)」中,帶有IDH1(異檸檬酸去氫酶1)突變者,相較於IDH野生型(wild-type),預後較好(存活較長,屬續發性膠質母細胞瘤路徑)。NF1、TP53、EGFR(EGFR擴增見於原發性GBM、預後差)非預後較好的標記。故為IDH1。","options":{"A":"NF1突變非預後較好標記。","B":"TP53突變非預後較好標記。","C":"IDH1突變者預後較wild-type好—正解。","D":"EGFR擴增見於原發性GBM(預後差)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_113090-98":{"quick":"造骨母細胞分泌、結合RANK配體的誘餌受體為osteoprotegerin(OPG)。","detail":{"background":"骨代謝調控:造骨母細胞(osteoblast)/骨間質細胞分泌骨保護素(osteoprotegerin, OPG)——作為誘餌受體(decoy receptor),結合RANK配體(RANKL),阻止RANKL與破骨細胞前驅的RANK結合→抑制破骨細胞分化(減少骨吸收)。Wnt、LRP5/6(Wnt訊息)、RUNX2(造骨轉錄因子)非誘餌受體。故為osteoprotegerin。","options":{"A":"Wnt為訊息分子(促造骨)。","B":"LRP5/6為Wnt共受體。","C":"osteoprotegerin為結合RANKL的誘餌受體—正解。","D":"RUNX2為造骨母細胞轉錄因子。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_113090-99":{"quick":"Wallerian變性起自傷害處遠端往遠端進行(非近端往神經元),故B錯誤。","detail":{"background":"軸突性周邊神經病變:①「破壞解離的髓鞘可形成髓鞘卵狀體(myelin ovoids)」(A正確);②「華勒氏變性(Wallerian degeneration)起自神經傷害處的遠端(distal),向遠端進行(軸突與髓鞘順向崩解),而非起自近端往神經元細胞體中心」——故B錯誤;③「修復過程有時產生創傷性神經瘤(traumatic neuroma)」(C正確);④「再生軸突的髓鞘比原本細薄」(D正確)。故B錯誤。","options":{"A":"破壞的髓鞘可形成myelin ovoids,正確。","B":"Wallerian變性起自傷害處遠端往遠端(非近端往神經元)—錯誤(正解)。","C":"修復可產生創傷性神經瘤,正確。","D":"再生軸突髓鞘較細薄,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_113090-100":{"quick":"腦壓過高脫疝導致的Duret出血發生於腦幹。","detail":{"background":"「Duret出血」是顱內壓過高造成經小腦天幕脫疝(transtentorial herniation)時,腦幹(尤中腦與橋腦中線旁)被向下推擠、穿通血管撕裂出血(常致命)。大腦灰質/白質、小腦非Duret出血部位。故發生於腦幹。","options":{"A":"大腦灰質非Duret出血部位。","B":"大腦白質非Duret出血部位。","C":"Duret出血發生於腦幹—正解。","D":"小腦非Duret出血部位。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114020-79":{"quick":"類結核型漢生病為肉芽腫(菌量少);「含脂肪巨噬細胞吞噬許多細菌」是癩瘤型,故C錯誤。","detail":{"background":"漢生病(leprosy):①「鏡下病灶常沿神經分布(侵犯周邊神經)」(A正確);②「類結核型(tuberculoid)比癩瘤型(lepromatous)有較強的細胞免疫反應(肉芽腫、菌量少)」(B正確);③「類結核型的病理特色是肉芽腫(類上皮細胞)、菌量少,而含脂肪(泡沫狀)的巨噬細胞吞噬許多細菌是癩瘤型(lepromatous)的特徵」——故C錯誤;④「溫度較低的皮膚(及周邊神經)適合痲瘋桿菌增生」(D正確)。故C錯誤。","options":{"A":"病灶常沿神經分布,正確。","B":"類結核型比癩瘤型細胞免疫較強,正確。","C":"含脂肪巨噬細胞吞噬許多細菌是癩瘤型(非類結核型)—錯誤(正解)。","D":"溫度較低的皮膚適合痲瘋桿菌增生,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114020-99":{"quick":"骨贅(osteophyte)較少見於類風濕性關節炎(為退化性關節炎特徵)。","detail":{"background":"類風濕性關節炎(RA)的病理:血管翳(pannus,增生的發炎滑膜)、關節滑液膜絨毛狀增生、軟骨與骨破壞、後期骨性關節強直(bony ankylosis)。而「骨贅(osteophyte,骨刺)」是退化性關節炎(osteoarthritis)的特徵(邊緣骨質增生),較少見於RA。故較少見於RA者為骨贅。","options":{"A":"骨贅較少見於RA(為退化性關節炎特徵)—正解。","B":"血管翳為RA特徵。","C":"骨性關節強直見於RA後期。","D":"滑膜絨毛狀增生為RA特徵。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114090-74":{"quick":"Entacapone抑制周邊COMT,延長levodopa的作用時間。","detail":{"background":"「Entacapone」與levodopa併用治帕金森氏病的機制是抑制周邊組織的兒茶酚-O-甲基轉移酶(catechol-O-methyltransferase, COMT):減少levodopa在周邊被COMT代謝(成3-O-methyldopa)→延長levodopa的半衰期/作用時間,增加進入腦部的量。並非抑MAO-B、非增3-O-methyldopa、非促多巴胺釋放。故為抑制周邊COMT。","options":{"A":"抑MAO-B為selegiline機制。","B":"Entacapone抑制周邊COMT、延長levodopa作用—正解。","C":"非增加3-O-methyldopa(反而減少)。","D":"促進多巴胺釋放為amantadine機制。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114090-80":{"quick":"慢性一氧化碳中毒主要造成基底核(尤蒼白球)缺氧。","detail":{"background":"「慢性(或嚴重)一氧化碳(CO)中毒」造成缺氧性腦損傷,最易受損部位是基底核——尤其蒼白球(globus pallidus)的對稱性壞死(及大腦皮質、海馬,但基底核/蒼白球最典型)。大腦半球、小腦、胼胝體非CO中毒最特異部位。故為基底核。","options":{"A":"大腦半球非CO中毒最特異部位。","B":"小腦非最特異。","C":"慢性CO中毒主要造成基底核(蒼白球)缺氧—正解。","D":"胼胝體非CO中毒典型部位。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114090-98":{"quick":"與破骨細胞活性異常較相關者為骨硬化症、Paget病等(本題答案①③⑤組合)。","detail":{"background":"與破骨(蝕骨)細胞(osteoclast)活性異常較相關的骨病:①「骨硬化症(osteopetrosis)——破骨細胞功能缺陷(無法吸收骨)→骨過度緻密」(①相關);③「Paget氏骨病——破骨細胞活性異常增高(再大量造骨,骨重塑紊亂)」(③相關);⑤「(另一破骨活性相關病變,如破骨細胞瘤/高轉換骨病)」(⑤相關)。本題答案為①③⑤(135)。故為135。","options":{"A":"組合不符。","B":"與破骨細胞活性異常較相關為①骨硬化症③Paget病⑤等—正解(135)。","C":"組合不符。","D":"組合不符。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114090-99":{"quick":"遊走性紅斑(erythema migrans)在病灶處最可能培養出致病微生物(萊姆病螺旋體)。","detail":{"background":"皮膚紅斑與感染:①「多形性紅斑(erythema multiforme)」、②「硬結性紅斑(erythema induratum)」、③「結節性紅斑(erythema nodosum)」——多為免疫/反應性(過敏、結核反應等),病灶無活微生物(培養陰性)。而「遊走性紅斑(erythema migrans)」是萊姆病(Lyme disease,伯氏疏螺旋體Borrelia)的早期皮疹,病灶含活螺旋體,最可能培養出致病微生物。故為erythema migrans。","options":{"A":"多形性紅斑為反應性(無活菌)。","B":"硬結性紅斑為結核反應性(無活菌)。","C":"結節性紅斑為反應性(無活菌)。","D":"遊走性紅斑(萊姆病)病灶含活菌、最可能培養出—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_115020-88":{"quick":"多重系統退化症的α-突觸核蛋白包涵體最易見於寡樹突細胞。","detail":{"background":"「多重系統退化症(multiple system atrophy, MSA)」是α-突觸核蛋白(α-synuclein)病變,其特徵性包涵體是寡樹突神經膠細胞的細胞質內含物(glial cytoplasmic inclusion, GCI)(α-synuclein陽性)。星狀細胞、微膠細胞、血管內皮非MSA的α-synuclein包涵體主要部位(帕金森的Lewy body則在神經元)。故為寡樹突細胞。","options":{"A":"星狀細胞非MSA包涵體主要部位。","B":"多重系統退化症的α-synuclein包涵體在寡樹突細胞—正解。","C":"微膠細胞非主要部位。","D":"血管內皮細胞非此。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_115020-89":{"quick":"TNF對類風濕性關節炎機轉最為明確,且已有專一性拮抗劑(抗TNF)用於治療。","detail":{"background":"類風濕性關節炎(RA)的致病機轉中,腫瘤壞死因子-α(TNF-α)的重要性最為明確,且已有專一性拮抗劑(抗TNF生物製劑:etanercept、infliximab、adalimumab)用於治療RA(顯著改善)。類風濕因子(RF,診斷標記)、IL-2、IFN-α非RA治療的主要專一拮抗標的。故為TNF。","options":{"A":"類風濕因子為診斷標記(非治療標的)。","B":"IL-2非RA治療主要標的。","C":"IFN-α非RA治療標的。","D":"TNF對RA機轉最明確、已有抗TNF拮抗劑治療—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_115090-75":{"quick":"顫抖、牙齦口炎與肢痛病（acrodynia）是「汞」中毒的三聯徵；吸入汞蒸氣另可造成化學性肺炎。","detail":{"background":"重金屬中毒的臨床指紋各不相同：(1) 「汞（元素汞／汞蒸氣）」——經呼吸道吸收後脂溶性高，可穿透血腦障壁與胎盤。慢性中毒的經典三聯徵是「震顫（intention tremor，自手指、眼瞼開始，故有帽匠的顫抖之稱）、牙齦炎與口腔炎（齒齦藍線、流涎、金屬味、牙齒鬆脫）、以及神經精神症狀（易怒、害羞、記憶力減退，即帽匠的瘋狂 erethism——源自製帽業使用硝酸汞）」；兒童的特殊表現是「肢痛病（acrodynia／粉紅病）」——手足發紅、疼痛、脫皮伴多汗與煩躁。急性吸入高濃度汞蒸氣則造成「化學性肺炎、肺水腫與急性呼吸窘迫」，以及腎小管壞死。故本題答案為汞。有機汞（甲基汞，水俁病）則以中樞神經為主：視野向心性狹窄、共濟失調、感覺異常與胎兒腦性麻痺。治療用 dimercaprol、DMSA 或 penicillamine（甲基汞螯合效果差）。(2) 「無機鉛」——貧血（嗜鹼性斑點紅血球、鉛線）、腹絞痛、腕垂與足垂（運動神經病變）、腎病變與兒童的認知發展損害；治療用 EDTA、DMSA、dimercaprol。(3) 「有機鉛（四乙基鉛）」——脂溶性高，以急性腦病變與精神症狀為主。(4) 「無機砷」——急性為腸胃炎與休克；慢性為「米飯狀色素沉著與過度角化（掌蹠）、Mees 線、周邊神經病變、烏腳病（台灣西南沿海）」與皮膚癌、肺癌、膀胱癌。","options":{"A":"不符。無機鉛以貧血、腹絞痛與腕垂為特徵。","B":"不符。有機鉛以急性腦病變與精神症狀為主。","C":"正確（本題答案）。汞中毒的三聯徵為震顫、牙齦口炎與肢痛病，吸入可致肺炎。","D":"不符。無機砷以過度角化、Mees 線與神經病變為特徵。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease 10e》","Harrison's Principles of Internal Medicine 21e"]}},"med2_115090-76":{"quick":"化生（metaplasia）是可逆的細胞型態轉換，但持續刺激下可進展為異型增生與癌，與惡性變化關係最密切。","detail":{"background":"細胞對壓力的適應有五種：(1) 「肥大（hypertrophy）」——細胞體積變大（心肌、骨骼肌），不涉及細胞數量增加，本身不致癌。(2) 「增生（hyperplasia）」——細胞數量增加，僅發生於有分裂能力的細胞；「病理性增生（如無對抗雌激素造成的子宮內膜增生）」確實是癌前病變的溫床，但本題選項未列此項。(3) 「萎縮（atrophy）」——細胞體積與功能下降，與癌變無直接關係。(4) 「發育不全（aplasia）」——器官未發育，屬發育異常而非適應。(5) 「化生（metaplasia）」——「一種已分化的細胞型態被另一種可承受該環境壓力的細胞型態取代」，源自幹細胞的重新分化程式，本身「可逆」，但關鍵在於：造成化生的刺激若持續存在，同一群幹細胞會累積突變，依「化生 → 異型增生（dysplasia）→ 原位癌 → 侵襲癌」的序列演進，因此化生與惡性變化的相關性最密切。經典的臨床例子：「巴瑞特食道（Barrett esophagus）」——長期胃食道逆流使食道下段的鱗狀上皮化生為含杯狀細胞的腸型柱狀上皮，是食道「腺癌」的前驅；「支氣管的鱗狀上皮化生」——吸菸使纖毛柱狀上皮變為鱗狀上皮，是肺鱗狀細胞癌的前驅；「慢性萎縮性胃炎的腸上皮化生」——與胃腺癌相關；子宮頸的鱗狀上皮化生區（轉化帶）則是 HPV 感染與子宮頸癌的好發處。","options":{"A":"關聯較低。肥大是細胞體積增大的可逆適應。","B":"不符。發育不全屬發育異常，非適應性變化。","C":"正確（本題答案）。化生在持續刺激下可經異型增生進展為癌。","D":"關聯較低。萎縮與惡性變化無直接關係。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease 10e》"]}},"med2_115090-77":{"quick":"砂粒體最常見於甲狀腺乳突癌，另見於卵巢漿液性乳突癌、腦膜瘤與間皮瘤。","detail":{"background":"「砂粒體（psammoma body）」是同心圓層狀（洋蔥皮樣）的鈣化小球，直徑約 30～100 µm，被認為源自腫瘤細胞凋亡後的鈣鹽沉積於乳突的軸心。其出現高度提示少數幾種腫瘤，可用口訣「PSaMMoma」記憶：「P」apillary carcinoma of thyroid（甲狀腺乳突癌）、「S」erous papillary cystadenocarcinoma of ovary（卵巢漿液性乳突腺癌）、「M」eningioma（腦膜瘤，尤其移行型／砂粒體型）、「M」esothelioma（間皮瘤）。其中「甲狀腺乳突癌是最典型也最常被考的答案」——其診斷主要靠「核的特徵」而非結構：毛玻璃樣核（Orphan Annie eye）、核溝（nuclear groove）、核內假包涵體，加上乳突結構與砂粒體。甲狀腺乳突癌是最常見的甲狀腺惡性腫瘤（約 85%），與輻射暴露及 BRAF V600E、RET/PTC 重組相關，好發淋巴結轉移但預後極佳（10 年存活率 >95%）。其餘選項的鏡下特徵不同：乳房侵襲性導管癌以纖維增生反應中的癌細胞索條、腺管與微鈣化（但為不規則的營養不良性鈣化，非砂粒體）為特徵；胰臟腺泡細胞癌呈腺泡結構且含酶原顆粒（PAS 陽性）；大腸黏液（膠質）腺癌則以大量細胞外黏液池中漂浮的癌細胞為特徵，兩者皆不以砂粒體著稱。","options":{"A":"正確（本題答案）。甲狀腺乳突癌是砂粒體最典型的發生部位。","B":"不符。乳房導管癌的鈣化為不規則的營養不良性鈣化。","C":"不符。胰臟腺泡細胞癌以酶原顆粒為特徵。","D":"不符。大腸黏液腺癌以細胞外黏液池為特徵。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease 10e》"]}},"med2_115090-78":{"quick":"類風濕因子在乾燥症陽性率高達 75～90%，是常見發現；anti-SS-A/SS-B 敏感但「不具專一性」。","detail":{"background":"乾燥症（Sjögren syndrome）是侵犯外分泌腺的自體免疫疾病，病理特徵為淚腺與唾液腺的「淋巴球（以 CD4⁺ T 細胞為主）浸潤與腺體破壞」，唇腺切片可見局部淋巴球灶（focus score ≥1）。血清學特徵：(1) 「類風濕因子（RF）」——陽性率高達 75～90%，是最常見的自體抗體之一（即使沒有類風濕性關節炎），選項 D 正確；此外高丙種球蛋白血症、抗核抗體陽性（約 80%）與冷凝球蛋白血症也常見。(2) 「anti-SS-A（Ro）與 anti-SS-B（La）」——是重要的分類標準（尤其 anti-SS-A，約 60～75% 陽性），但「絕非專一」——anti-SS-A 也出現在紅斑性狼瘡（約 30～40%，尤其亞急性皮膚型狼瘡與新生兒狼瘡／先天性心臟傳導阻滯）、多發性肌炎與原發性膽汁性膽管炎，故選項 B 錯誤。(3) 「腎臟侵犯」——乾燥症的腎病變以「腎小管間質性腎炎」為主，典型造成「遠端腎小管酸中毒（第一型）」、腎性尿崩與低血鉀肌肉無力；「腎絲球病變並不常見」（若出現多與冷凝球蛋白血症相關的膜增生性腎絲球腎炎有關），故選項 A 錯誤。(4) 「淋巴瘤」——乾燥症的淋巴瘤風險是一般人的 15～44 倍，但「最常見的是黏膜相關淋巴組織（MALT）型的邊緣區 B 細胞淋巴瘤」，好發於腮腺；持續腮腺腫大、紫斑、低補體 C4 與冷凝球蛋白是危險指標，故選項 C 的「T 細胞淋巴瘤」錯誤。","options":{"A":"錯誤。乾燥症以腎小管間質性腎炎（遠端腎小管酸中毒）為主，非腎絲球病變。","B":"錯誤。anti-SS-A/SS-B 亦見於狼瘡等疾病，不具專一性。","C":"錯誤。最常併發的是 MALT 型邊緣區 B 細胞淋巴瘤。","D":"正確（本題答案）。類風濕因子陽性在乾燥症相當常見。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease 10e》","Kelley and Firestein's Textbook of Rheumatology 11e"]}},"med2_115090-79":{"quick":"重症肌無力由抗乙醯膽鹼受體抗體直接作用於細胞表面受體，屬第二型（抗體媒介型）過敏反應。","detail":{"background":"Gell 與 Coombs 的四型過敏反應：(1) 「第一型（立即型，IgE 媒介）」——過敏原交聯肥大細胞上的 IgE，釋放組織胺與白三烯，數分鐘內發作；如過敏性鼻炎、氣喘、蕁麻疹與全身性過敏反應。(2) 「第二型（抗體媒介型）」——IgG 或 IgM「直接結合細胞表面或細胞外基質的固定抗原」，經三種機制致病：補體活化與吞噬（自體免疫溶血性貧血、免疫性血小板低下、輸血反應、新生兒溶血）、抗體依賴性細胞毒殺、以及「抗體干擾受體功能」——後者正是「重症肌無力」的機轉：抗乙醯膽鹼受體抗體結合神經肌肉接合處的受體，造成受體交聯內化、補體媒介的終板破壞與受體阻斷，使動作電位傳遞失敗；同類還有 Graves 病（抗 TSH 受體抗體刺激）、Lambert-Eaton 症候群（抗鈣通道）、天疱瘡（抗 desmoglein）與 Goodpasture 症候群（抗基底膜第四型膠原）。故選項 A 為答案。(3) 「第三型（免疫複合體型）」——「可溶性」抗原與抗體形成複合體後沉積於血管壁、腎絲球與關節，活化補體招募嗜中性球造成血管炎；如「狼瘡腎炎」、「血清病」、鏈球菌感染後腎絲球腎炎與 Arthus 反應——因此選項 B、C 屬第三型。(4) 「第四型（遲發型，T 細胞媒介）」——「接觸性皮膚炎」、結核菌素試驗、肉芽腫性發炎與移植排斥，屬選項 D。","options":{"A":"正確（本題答案）。重症肌無力是抗體對細胞表面受體的第二型過敏反應。","B":"不符。狼瘡腎炎屬第三型免疫複合體病。","C":"不符。血清病屬第三型。","D":"不符。接觸性皮膚炎屬第四型細胞媒介反應。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease 10e》","Abbas《Cellular and Molecular Immunology 10e》"]}},"med2_115090-80":{"quick":"台灣子宮頸癌死亡率下降最主要歸功於 1995 年起推行的全民免費子宮頸抹片篩檢。","detail":{"background":"子宮頸癌是「三段預防」的最佳範例，也是台灣公共衛生的重要成就：(1) 「次段預防——抹片篩檢」：台灣自 1995 年將「30 歲以上婦女每年一次子宮頸抹片」納入全民健保預防保健給付並持續推廣，抹片篩檢率大幅提升，使子宮頸癌的發生率與死亡率在此後二十餘年「穩定且顯著下降」（發生率由每十萬人約 25 降至 10 以下，死亡率降幅超過六成）。其原理是抹片能偵測「癌前病變（CIN／鱗狀上皮內病變）」，於進展為侵襲癌之前即以電圈切除術或冷凍治療處理，屬「早期發現、早期治療」，故為本題答案。(2) 「初段預防——HPV 疫苗」：二價疫苗 2006 年上市，台灣自 2018 年才全面提供國中女生公費接種；由於子宮頸癌自 HPV 感染到侵襲癌約需 10～20 年，「疫苗的死亡率效益尚未在過去 20 年的統計中顯現」，其影響要到未來十餘年才會反映，故選項 B 不是「過去 20 年」下降的最重要原因。(3) 「口服避孕藥」——長期使用反而與子宮頸癌風險「輕微上升」相關（可能與性行為型態及未使用屏障避孕有關），選項 C 完全相反。(4) 「全民健保（1995 年開辦）」——確實提高了醫療可近性，是抹片得以普及的制度基礎，但它是廣泛的支付制度而非針對子宮頸癌的介入措施；使死亡率下降的「直接原因」仍是篩檢本身。目前國健署已朝「HPV DNA 檢測為主的篩檢」與提高疫苗接種率雙軌並進，呼應 WHO 消除子宮頸癌的目標。","options":{"A":"正確（本題答案）。抹片篩檢普及使癌前病變得以早期發現與治療。","B":"不符。HPV 疫苗導入較晚，效益尚未反映於過去 20 年的死亡率。","C":"不符。口服避孕藥與子宮頸癌風險輕微上升相關。","D":"不符。健保是制度基礎，非直接使死亡率下降的介入措施。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease 10e》","衛生福利部國民健康署 子宮頸癌篩檢統計"]}},"med2_115090-81":{"quick":"再灌流可挽救部分心肌，但仍會因「再灌流傷害」持續損失心肌細胞，並非不再損失。","detail":{"background":"急性心肌梗塞的再灌流治療（血栓溶解或經皮冠狀動脈介入）是降低死亡率的關鍵，但再灌流本身也帶來傷害：(1) 「再灌流傷害（reperfusion injury）」的四大機轉——「氧自由基大量產生」（血流恢復後粒線體、黃嘌呤氧化酶與浸潤的白血球產生活性氧，破壞細胞膜與蛋白質，選項 B 正確）；「鈣超載」（膜損傷與離子幫浦失能使細胞內與粒線體鈣暴增，觸發過度收縮與粒線體通透性轉換孔開放）；「白血球聚集與發炎」（內皮活化表現黏附分子，嗜中性球浸潤並釋放蛋白酶與更多自由基，選項 C 正確）；「微血管阻塞（no-reflow）」（內皮腫脹、微栓塞與外在壓迫使部分心肌仍得不到血流）。因此「已經瀕死但尚可挽救的心肌仍會有一部分死亡」，選項 D 的「不再損失心肌細胞」錯誤。(2) 「病理與生化表現」——再灌流的心肌呈現「收縮帶壞死（contraction band necrosis）」與出血性梗塞；由於細胞內的肌鈣蛋白被血流沖刷帶出，「再灌流後 troponin 反而更快更高地上升（wash-out 現象）」，其峰值提早出現，選項 A 正確，這也是臨床上用來判斷再灌流成功的指標之一。(3) 「其他再灌流現象」——「心肌頓抑（stunning）」：血流恢復但收縮功能延遲數天才恢復；「再灌流性心律不整」：加速性心室自主節律是再灌流成功的常見徵象。目前尚無被證實有效的藥物可預防再灌流傷害，臨床重點仍是「盡量縮短總缺血時間」。","options":{"A":"正確。再灌流沖刷出細胞內肌鈣蛋白，使其更快更高上升。","B":"正確。再灌流時活性氧大量產生。","C":"正確。白血球浸潤是再灌流傷害的重要機轉。","D":"錯誤（本題答案）。再灌流傷害仍會造成部分心肌細胞死亡。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease 10e》","Braunwald’s Heart Disease 12e"]}},"med2_115090-82":{"quick":"非細菌性血栓性心內膜炎的贅生物是無菌的纖維蛋白與血小板血栓，幾乎不含發炎細胞。","detail":{"background":"心內膜炎贅生物的組成反映其成因：(1) 「非細菌性血栓性心內膜炎（NBTE，又稱消耗性心內膜炎 marantic endocarditis）」——見於惡性腫瘤（尤其黏液腺癌造成的高凝狀態）、瀰漫性血管內凝血、末期消耗性疾病與長期留置導管。其贅生物是「無菌的、由纖維蛋白與血小板構成的小型鬆散血栓」，附著於「未受損或僅輕微受損的瓣膜閉合緣」，「幾乎不引起發炎反應、不含微生物、也不破壞瓣膜」；因為鬆散，最大的危險是「栓塞」（腦、脾、腎、冠狀動脈）。因此其贅生物中發炎細胞最少，為本題答案。(2) 「感染性心內膜炎（自體瓣膜與人工瓣膜）」——贅生物由纖維蛋白、血小板、「大量微生物菌落與豐富的嗜中性球等發炎細胞」構成，並造成瓣膜破壞、穿孔、腱索斷裂與瓣環膿瘍；人工瓣膜心內膜炎（早期以凝固酶陰性葡萄球菌為主）常沿縫合環擴散形成瓣周膿瘍與瓣膜裂開，發炎更為明顯。(3) 「Libman-Sacks 心內膜炎」——與紅斑性狼瘡及抗磷脂質抗體症候群相關，贅生物為小型疣狀，可分布於瓣膜「兩面」與心內膜表面；組織學上「含纖維蛋白樣壞死、免疫複合體與相當數量的單核發炎細胞（甚至血鐵質吞噬細胞與 haematoxylin bodies）」，並可造成瓣膜纖維化與變形，發炎程度明顯高於 NBTE。","options":{"A":"正確（本題答案）。NBTE 的贅生物為無菌的纖維蛋白血小板血栓，發炎細胞極少。","B":"不符。感染性心內膜炎含大量微生物與嗜中性球。","C":"不符。人工瓣膜感染的發炎反應同樣明顯。","D":"不符。Libman-Sacks 心內膜炎含纖維蛋白樣壞死與單核發炎細胞。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease 10e》","Braunwald’s Heart Disease 12e"]}},"med2_115090-83":{"quick":"放射線治療造成的心肌纖維化屬「限制型」心肌病變；擴大型心肌病變的成因是酒精、心肌炎與基因突變等。","detail":{"background":"心肌病變依血行動力學分三型，成因各異：(1) 「擴大型（dilated）」——心室擴大、收縮功能下降（射出分率降低）。成因可記為「ABCCCD」：「A」lcohol（酒精成癮，選項 A 正確）與 Adriamycin（doxorubicin 等蒽環類化療藥的累積性毒性）；「B」eriberi（維生素 B1 缺乏）；「C」oxsackie B 病毒等造成的「心肌炎後遺症」（選項 B 正確）、「C」ocaine、「C」hagas 病；「D」uchenne 肌失養症與其他「基因突變」——約 20～35% 為家族性，以「titin（TTN）截斷突變」最常見，另有 lamin A/C（LMNA，常伴傳導阻滯與猝死）、肌小節與細胞骨架蛋白基因（選項 D 正確）；此外還有周產期心肌病變、甲狀腺疾病、血鐵沉積症與長期心搏過速。(2) 「肥厚型（hypertrophic）」——多為體染色體顯性的肌小節蛋白基因突變（MYH7、MYBPC3），心肌細胞肥大與紊亂排列（myofiber disarray），是年輕運動員猝死的主因。(3) 「限制型（restrictive）」——心室壁僵硬、舒張充填受限而收縮功能相對保留；成因包括「類澱粉沉積症（最常見）、血鐵沉積症、類肉瘤病、心內膜心肌纖維化、Loeffler 心內膜炎，以及放射線治療後的心肌與心內膜纖維化」——因此選項 C 描述的是限制型而非擴大型的成因，為本題答案。放射線的心臟毒性還包括縮窄性心包炎、冠狀動脈疾病與瓣膜纖維化。","options":{"A":"是原因。長期酗酒是擴大型心肌病變的常見可逆病因。","B":"是原因。病毒性心肌炎的後遺症可演變為擴大型心肌病變。","C":"並非（本題答案）。放射線造成的纖維化屬限制型心肌病變。","D":"是原因。TTN、LMNA 等基因突變是家族性擴大型心肌病變的主因。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease 10e》","Braunwald’s Heart Disease 12e"]}},"med2_115090-84":{"quick":"前縱隔腫瘤合併抗乙醯膽鹼受體抗體與肌無力，最可能是胸腺瘤。","detail":{"background":"前縱隔腫瘤的鑑別可用「4T」記憶：Thymoma（胸腺瘤）、Teratoma（生殖細胞瘤）、Thyroid（胸骨後甲狀腺腫）、Terrible lymphoma（淋巴瘤）。本題的關鍵線索是「抗乙醯膽鹼受體抗體＋肌肉無力」——即重症肌無力，這與「胸腺瘤」的關聯極為特異：(1) 「流行病學」——約 10～15% 的重症肌無力病人有胸腺瘤，而 30～45% 的胸腺瘤病人有重症肌無力；此外約 65% 的重症肌無力病人有胸腺增生（生發中心增生）。(2) 「機轉」——胸腺是 T 細胞篩選耐受的場所；胸腺瘤的腫瘤性上皮細胞表現類乙醯膽鹼受體的抗原（如 titin、ryanodine 受體），且無法正常進行負選擇，使自體反應性 T 細胞逃逸並協助 B 細胞產生抗體。(3) 「病理」——胸腺瘤由「腫瘤性胸腺上皮細胞」與「非腫瘤性的未成熟 T 淋巴球」混合構成，依 WHO 分為 A、AB、B1、B2、B3 型與胸腺癌；分期以「Masaoka 分期」（是否侵犯包膜與周圍構造）決定預後，遠比組織型態重要。(4) 「其他伴瘤症候群」——單純紅血球再生不良、低丙種球蛋白血症（Good 症候群）、皮肌炎與紅斑性狼瘡。(5) 「治療」——手術切除（胸腺切除術對重症肌無力本身亦有幫助，即使無胸腺瘤），侵犯性者加放射與化學治療。其餘選項：前縱隔的鱗狀細胞癌少見且與自體抗體無關；「畸胎瘤」好發於年輕人，影像上含脂肪、鈣化與牙齒；「類癌（神經內分泌腫瘤）」可分泌 ACTH 造成庫欣症候群，但不引起抗乙醯膽鹼受體抗體。","options":{"A":"不符。前縱隔鱗狀細胞癌罕見且與重症肌無力無關。","B":"不符。畸胎瘤影像上含脂肪與鈣化，不引起自體抗體。","C":"正確（本題答案）。胸腺瘤與重症肌無力關聯密切。","D":"不符。類癌屬神經內分泌腫瘤，可分泌 ACTH 但不引起此抗體。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease 10e》","Harrison's Principles of Internal Medicine 21e"]}},"med2_115090-85":{"quick":"骨髓化生不良症候群約 10～40% 會進展為急性骨髓性白血病。","detail":{"background":"骨髓化生不良症候群（MDS）是造血幹細胞的「克隆性」疾病，核心矛盾是「骨髓細胞增多但周邊血球減少」：(1) 「流行病學」——「好發於老年人（中位年齡 70 歲以上）」，兒童極罕見，故選項 B 錯誤；分原發性與續發性（曾接受烷化劑、拓樸異構酶 II 抑制劑化療或放射線者，預後更差）。(2) 「病理生理」——突變的幹細胞（常見 SF3B1、TET2、ASXL1、DNMT3A、TP53、RUNX1）雖能增殖，但成熟過程異常且大量凋亡（無效造血 ineffective hematopoiesis），因此「骨髓呈高細胞密度（hypercellular）而周邊血球卻減少（cytopenia）」——故選項 C 錯誤（周邊血球是減少而非增多）。(3) 「形態學」——骨髓中的造血細胞呈明顯的「化生不良（dysplasia）」形態異常：紅血球系的環狀鐵芽球（ring sideroblast）與核出芽；顆粒球系的低分葉核（Pelger-Huët 樣）與顆粒缺乏；巨核細胞的單葉核與小型巨核細胞——因此選項 D 的「形態正常」錯誤。(4) 「臨床與預後」——以貧血（大球性）為最常見表現，加上感染與出血；依 IPSS-R／IPSS-M 評分（骨髓芽細胞比例、細胞遺傳學、血球減少程度、分子突變）分層，「約 10～40% 的病人會轉化為急性骨髓性白血病」（低危險群較低、高危險群明顯較高），選項 A 正確；其餘則死於血球減少的併發症。(5) 「治療」——低危險群以支持療法、紅血球生成素、luspatercept（SF3B1 突變／環狀鐵芽球型）、來那度胺（del(5q)）；高危險群用去甲基化藥物（azacitidine、decitabine），根治性治療為異體造血幹細胞移植。","options":{"A":"正確（本題答案）。約 10～40% 的 MDS 病人會進展為急性骨髓性白血病。","B":"錯誤。MDS 好發於老年人，兒童罕見。","C":"錯誤。周邊血球是減少（cytopenia），骨髓則細胞增多。","D":"錯誤。骨髓造血細胞呈明顯的化生不良形態異常。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease 10e》","Williams Hematology 10e"]}},"med2_115090-86":{"quick":"惡性間皮細胞瘤預後極差，中位存活期僅約 12 個月左右，多數病人存活不到兩年。","detail":{"background":"惡性間皮細胞瘤是源自漿膜間皮的侵襲性腫瘤：(1) 「病因」——與「石綿（asbestos）暴露」關係最密切，潛伏期長達 20～50 年；即使短期或間接暴露（家人衣物）亦可致病，且「吸菸不會加成間皮瘤的風險」（吸菸與石綿的加成效應是針對肺癌）。(2) 「部位」——約 80～90% 發生於肋膜，可同時侵犯「臟側與體側肋膜」，沿肋膜腔瀰漫生長並包覆肺臟形成厚殼（rind），常伴血性肋膜積液；其次為腹膜、心包與睪丸鞘膜，故選項 A 正確。(3) 「組織型態與鑑別」——分上皮樣（最常見、預後最佳）、肉瘤樣與雙相型。與「轉移至肋膜的肺腺癌」的鑑別是日常病理難題，須靠免疫組織化學：間皮瘤表現「calretinin、WT-1、D2-40（podoplanin）、CK5/6」；腺癌則表現「TTF-1、napsin A、claudin-4、MOC-31、Ber-EP4、CEA」，故選項 C 正確。此外「BAP1 免疫染色缺失」與「CDKN2A（p16）以 FISH 偵測到同源缺失」是區分良性間皮增生與惡性間皮瘤的有力工具。(4) 「分子」——最常見的突變／缺失為「BAP1、CDKN2A、NF2」（皆為抑癌基因失活，而非致癌基因活化），選項 D 正確；BAP1 生殖細胞突變造成腫瘤易感症候群。(5) 「預後」——「中位存活期僅約 8～14 個月」，5 年存活率低於 10%；治療以化療（pemetrexed 加鉑類）與免疫治療（nivolumab 加 ipilimumab）為主，僅少數早期上皮樣型適合根除性手術。因此選項 B 的「大多數病人可存活超過兩年」明顯錯誤。","options":{"A":"正確。可發生於臟側或體側肋膜並瀰漫生長。","B":"錯誤（本題答案）。中位存活期約 1 年，多數病人存活不到兩年。","C":"正確。與轉移性肺腺癌的鑑別可靠免疫組織化學染色。","D":"正確。BAP1、CDKN2A、NF2 是常見的突變基因。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease 10e》","WHO Classification of Tumours: Thoracic Tumours 5e"]}},"med2_115090-87":{"quick":"孤立性纖維瘤最常見於肋膜（尤其臟側肋膜），CD34 與 STAT6 陽性、角質蛋白陰性，且與石綿無關。","detail":{"background":"「孤立性纖維瘤（solitary fibrous tumor, SFT）」是纖維母細胞性的間葉腫瘤：(1) 「好發部位」——「最典型且最常見的部位是肋膜（尤其臟側肋膜），常以有莖的腫塊突入胸腔」，這也是它舊稱「良性肋膜間皮瘤」的由來（現已證實它源自纖維母細胞而非間皮），故選項 D 正確。近年發現它可發生於全身各處軟組織、腦膜（過去稱血管外皮細胞瘤 hemangiopericytoma，現已統一為 SFT）、腹膜後與眼眶。(2) 「病因」——「與石綿暴露無關」（這是與惡性間皮瘤最重要的區別），選項 C 錯誤。(3) 「病理」——鏡下呈「無型式生長（patternless pattern）」的梭形細胞，夾雜緻密的膠原束與「鹿角狀（staghorn）分支血管」。(4) 「免疫組織化學」——「CD34 陽性（約 90%）、bcl-2 與 CD99 陽性」，最具診斷價值的是「STAT6 核染色陽性」——反映其分子特徵「NAB2-STAT6 基因融合（12q13 染色體內倒位）」；而「角質蛋白（keratin）與 calretinin 皆為陰性」，這正是與間皮瘤及癌鑑別的關鍵，故選項 A 錯誤、選項 B 也錯誤（CD34 應為陽性）。(5) 「臨床」——多數為良性，手術完整切除可治癒，但約 10～20% 有侵襲或轉移行為（依 risk stratification：年齡、腫瘤大小、有絲分裂數與壞死），需長期追蹤。少數病例因分泌類胰島素生長因子 II 而造成「低血糖（Doege-Potter 症候群）」。","options":{"A":"錯誤。角質蛋白為陰性，這是與癌及間皮瘤鑑別的重點。","B":"錯誤。CD34 為陽性（約 90%），STAT6 核染色亦陽性。","C":"錯誤。與石綿暴露無關（那是惡性間皮瘤）。","D":"正確（本題答案）。孤立性纖維瘤最常見於肋膜。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease 10e》","WHO Classification of Tumours: Soft Tissue and Bone 5e"]}},"med2_115090-88":{"quick":"大葉性肺炎的四期依序為充血期 → 紅色肝變期 → 灰色肝變期 → 緩解期。","detail":{"background":"大葉性肺炎（典型由肺炎鏈球菌引起）在抗生素時代已少見完整病程，但其四期病理演變是經典考題：(1) 「充血期（congestion，第 1～2 天）」——肺葉沉重、潮濕、暗紅；組織學可見血管擴張充血、肺泡腔內有大量「漿液性滲出液與大量細菌」，嗜中性球尚少。(2) 「紅色肝變期（red hepatization，第 2～4 天）」——肺葉呈紅色、實質化，質地如肝臟（故名）；肺泡腔內充滿「紅血球、纖維蛋白與嗜中性球」，紅血球外滲是「紅色」的來源。(3) 「灰色肝變期（gray hepatization，第 4～8 天）」——紅血球崩解消失，留下「纖維蛋白網與大量嗜中性球及巨噬細胞」，切面呈灰褐色乾燥；此時肺仍實質化。(4) 「緩解期（resolution，第 8 天以後）」——巨噬細胞成為主角，酵素消化滲出物，殘骸經淋巴引流或咳出，肺結構「完全恢復正常」——這是肺炎鏈球菌大葉性肺炎的重要特點（不留纖維化，除非併發機化性肺炎）。因此正確順序為 3→2→1→4。臨床對應：胸部 X 光的實質化（consolidation）與空氣支氣管徵象在肝變期最明顯；併發症包括膿胸、肺膿瘍、菌血症與轉移性感染（心內膜炎、腦膜炎、化膿性關節炎）。相對地「支氣管肺炎（bronchopneumonia）」是多發、散在、以細支氣管為中心的化膿性病灶，好發於幼兒與老年、臥床者，癒後常留下瘢痕。","options":{"A":"錯誤。順序顛倒，充血期應為第一期。","B":"正確（本題答案）。充血期→紅色肝變期→灰色肝變期→緩解期。","C":"錯誤。紅色肝變期在灰色肝變期之前。","D":"錯誤。第一期應為充血期。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease 10e》"]}},"med2_115090-89":{"quick":"幽門螺旋桿菌相關性胃炎以「胃竇（antrum）」為主要侵犯部位，不是胃體。","detail":{"background":"幽門螺旋桿菌是革蘭氏陰性微好氧螺旋桿菌，以尿素酶分解尿素產氨中和胃酸而在胃內存活：(1) 「分布部位」——「最常見的型態是以胃竇為主的胃炎（antral-predominant gastritis）」，此型伴隨胃泌素上升與胃酸分泌增加，與「十二指腸潰瘍」高度相關（選項 D 正確）；因此選項 A 說「胃體比胃竇更容易感染」是錯誤的。少數人（尤其長期使用質子幫浦抑制劑或宿主反應偏向）發展為「胃體為主或多灶性萎縮性胃炎」，此型胃酸下降，與「胃潰瘍與胃腺癌」相關。(2) 「菌體位置」——幽門螺旋桿菌不侵入上皮，而是「集中於表面與腺頸部上皮細胞表面的黏液層中」，可用 Giemsa、Warthin-Starry 或免疫組織化學染色顯示，選項 C 正確。(3) 「組織學」——固有層有大量漿細胞與淋巴球浸潤，上皮內與腺體內有嗜中性球（活動性），常形成「淋巴濾泡（正常胃黏膜無淋巴組織，其出現即高度提示幽門螺旋桿菌感染，也是 MALT 淋巴瘤的前身）」。(4) 「相關病變」——與「增生性息肉與發炎性息肉」相關（除菌後部分可消退），選項 B 正確；長期感染依 Correa 序列演進為「慢性胃炎 → 萎縮 → 腸上皮化生 → 異型增生 → 胃腺癌」，並與 MALT 淋巴瘤相關（WHO 列為第一類致癌物）。(5) 「診斷與治療」——尿素呼氣試驗、糞便抗原、快速尿素酶試驗與組織切片；治療用含質子幫浦抑制劑的四合一或含 bismuth 療法。","options":{"A":"最不適當（本題答案）。幽門螺旋桿菌相關胃炎以胃竇為主。","B":"適當。與增生性息肉及發炎性息肉相關。","C":"適當。菌體位於表面與腺頸部上皮的表面黏液層。","D":"適當。胃竇型胃炎與十二指腸潰瘍高度相關。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease 10e》","Sleisenger and Fordtran’s Gastrointestinal and Liver Disease 11e"]}},"med2_115090-90":{"quick":"胃 MALT 淋巴瘤最常見的易位是 t(11;18)(q21;q21)；t(9;22) 是慢性骨髓性白血病的費城染色體。","detail":{"background":"胃淋巴瘤是最常見的結外淋巴瘤發生部位：(1) 「組織型態」——「胃最常見的淋巴瘤是淋巴結外邊緣區 B 細胞淋巴瘤（extranodal marginal zone B-cell lymphoma of MALT type，即 MALT 瘤）」，選項 A 正確；其次為瀰漫性大 B 細胞淋巴瘤。(2) 「病因」——「幽門螺旋桿菌的慢性抗原刺激」使胃黏膜獲得後天的淋巴組織，反應性 T 細胞持續協助 B 細胞增生，最終發生克隆性轉化，選項 B 正確；臨床上「早期、局限且無 t(11;18) 者，單純根除幽門螺旋桿菌即可讓約 70～80% 的病人腫瘤完全消退」，是「以抗生素治療癌症」的經典案例。(3) 「基因易位」——最常見的是「t(11;18)(q21;q21)」，產生 API2-MALT1 融合基因而持續活化 NF-κB；帶此易位者「對除菌治療無反應」，須改用放射治療、rituximab 或化學治療，因此檢測它具有直接的治療決策意義。其他易位包括 t(1;14)（BCL10-IGH）與 t(14;18)（MALT1-IGH）。「t(9;22)(q34;q11) 才是費城染色體（BCR-ABL1），見於慢性骨髓性白血病與部分急性淋巴性白血病」，且本題選項寫的 (q21;q21) 座標亦與 t(9;22) 不符，故選項 D 為最不適當。(4) 「轉化」——MALT 瘤可轉化為侵襲性的「瀰漫性大 B 細胞淋巴瘤」，此過程與「p53 與 p16（CDKN2A）等抑癌基因失活」及 MYC 異常相關，選項 C 正確；一旦轉化即需 R-CHOP 等免疫化學治療。","options":{"A":"適當。胃最常見的淋巴瘤是 MALT 型邊緣區 B 細胞淋巴瘤。","B":"適當。幽門螺旋桿菌是最常見的誘發因素。","C":"適當。轉化為瀰漫性大 B 細胞淋巴瘤與 p53、p16 失活有關。","D":"最不適當（本題答案）。最常見的是 t(11;18)；t(9;22) 為慢性骨髓性白血病的費城染色體。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease 10e》","WHO Classification of Haematolymphoid Tumours 5e"]}},"med2_115090-91":{"quick":"CFTR 與 PRSS1 突變見於遺傳性／特發性慢性胰臟炎，不是第一型自體免疫胰臟炎的特徵。","detail":{"background":"自體免疫胰臟炎分兩型，第一型是全身性 IgG4 相關疾病在胰臟的表現：(1) 「第一型（淋巴漿細胞硬化性胰臟炎, LPSP）」——好發於 60 歲以上男性，臨床以「無痛性阻塞性黃疸」與影像上「臘腸狀瀰漫腫大的胰臟加上主胰管不規則狹窄、周圍低訊號的膠囊樣邊緣（capsule-like rim）」表現，最重要的鑑別診斷是胰臟癌。血清「IgG4 升高」，病理三特徵為：「大量 IgG4 陽性漿細胞浸潤（每高倍視野 >10 個）」、「席紋狀（storiform）纖維化」與「閉塞性靜脈炎（obliterative phlebitis）」——選項 B、C、D 皆正確；同時常合併其他器官的 IgG4 相關病變（硬化性膽管炎、後腹腔纖維化、唾液腺炎、腎小管間質性腎炎）。對「類固醇治療反應極佳」是重要的診斷與治療特點，復發者可用 rituximab。(2) 「第二型（特發性管中心性胰臟炎, IDCP）」——較年輕、無性別差異，病理特徵是「顆粒球上皮病變（GEL，管腔內嗜中性球浸潤）」，IgG4 多不升高，且與「發炎性腸道疾病（尤其潰瘍性結腸炎）」相關。(3) 「CFTR 與 PRSS1（陽離子型胰蛋白酶原）突變」——則屬「遺傳性與特發性慢性胰臟炎」的病因：PRSS1 功能增益突變使胰蛋白酶原提早活化且不易被去活化，造成自幼反覆發作的胰臟炎並顯著增加胰臟癌風險；CFTR 突變（含輕型變異）使胰管分泌黏稠、阻塞而致慢性胰臟炎，SPINK1 與 CTRC 突變亦同屬此類。故選項 A 為最不適當。","options":{"A":"最不適當（本題答案）。CFTR 與 PRSS1 突變屬遺傳性慢性胰臟炎，非自體免疫胰臟炎。","B":"適當。大量漿細胞浸潤與席紋狀纖維化是其特徵。","C":"適當。閉塞性靜脈炎是重要的病理特徵。","D":"適當。第一型自體免疫胰臟炎屬 IgG4 相關疾病。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease 10e》","Sleisenger and Fordtran’s Gastrointestinal and Liver Disease 11e"]}},"med2_115090-92":{"quick":"BK 多瘤病毒潛伏於腎小管與尿路上皮，再活化時感染腎小管上皮細胞並形成核內包涵體。","detail":{"background":"「BK 多瘤病毒（BK polyomavirus）」是雙股 DNA 無套膜病毒，超過 80% 的成人在兒童期已感染並「終生潛伏於腎小管上皮與尿路上皮細胞」。當免疫抑制（尤其腎移植使用 tacrolimus 與 mycophenolate 的病人，發生率約 1～10%）時再活化，造成「BK 病毒相關腎病變（BKVAN）」：(1) 「細胞學與病理」——病毒感染「腎小管上皮細胞」，使核增大並出現嗜鹼性、毛玻璃樣的「核內包涵體」；尿液細胞學可見脫落的感染細胞，因其核大而深染、細胞質稀少，形似惡性細胞而被稱為「decoy cell（誘餌細胞）」。組織學上呈小管炎與間質發炎，與急性排斥難以區分——鑑別的關鍵是「SV40 large T antigen 免疫組織化學染色陽性」。這個區分至關重要，因為排斥要「加強」免疫抑制，而 BK 腎病變要「減少」免疫抑制，處置方向完全相反。(2) 「臨床監測」——移植後定期驗血漿 BK 病毒量，病毒血症持續上升即先行減量免疫抑制劑（先行策略 preemptive strategy），以避免不可逆的間質纖維化與移植腎失能；目前無確效的抗病毒藥（cidofovir、leflunomide、靜脈免疫球蛋白皆證據有限）。(3) 「其他表現」——造血幹細胞移植後可造成「出血性膀胱炎」。相關的多瘤病毒還有 JC 病毒（進行性多灶性白質腦病）與 Merkel 細胞多瘤病毒（Merkel 細胞癌）。足細胞、腎絲球膈細胞與單核球都不是 BK 病毒的主要感染標的。","options":{"A":"正確（本題答案）。BK 病毒感染腎小管上皮細胞並形成核內包涵體。","B":"不符。足細胞不是多瘤病毒的主要標的。","C":"不符。單核球非其主要感染細胞。","D":"不符。腎絲球膈細胞非其主要感染細胞。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease 10e》","Brenner and Rector's The Kidney 11e"]}},"med2_115090-93":{"quick":"膀胱扁平原位癌屬「非乳突狀路徑」，以 TP53 與 RB 等抑癌基因失活為特徵；FGFR3／RAS 突變見於乳突狀低惡性度腫瘤。","detail":{"background":"膀胱尿路上皮癌有「兩條分子路徑」，是病理與腫瘤學的重要觀念：(1) 「乳突狀路徑（低惡性度）」——由尿路上皮增生開始，形成外突性的乳突狀腫瘤；分子特徵是「FGFR3 活化突變（約 70%）與 RAS 家族突變」造成的 RTK-RAS-MAPK 路徑持續活化，加上 PIK3CA 突變與染色體 9 號（含 CDKN2A）缺失。這類腫瘤「復發率高但很少侵犯肌肉層」，預後好。因此選項 B 描述的是這一路徑，非扁平原位癌。(2) 「非乳突狀（扁平）路徑（高惡性度）」——由「扁平原位癌（flat carcinoma in situ, CIS）」開始，鏡下為全層的高度異型細胞但仍局限於上皮內；分子特徵是「TP53 與 RB1 的失活突變（加上 PTEN 缺失、染色體不穩定）」，使細胞週期檢查點崩潰。這條路徑「侵襲性強，未治療者約 50～75% 會進展為肌肉侵犯性癌」，臨床上常呈瀰漫多灶、膀胱鏡下僅見紅絨樣黏膜而易被忽略，並常以刺激性排尿症狀與無痛性血尿表現；標準治療為經尿道切除加膀胱內卡介苗（BCG）灌注免疫治療，失敗者考慮根除性膀胱切除。故選項 D 為本題答案。其餘選項：「TSC1／TSC2」突變見於結節性硬化症（也見於部分膀胱癌但非 CIS 的特徵性標記）與腎血管肌肉脂肪瘤；「EWS-FLI1」融合是尤文氏肉瘤（Ewing sarcoma）的診斷性易位 t(11;22)。","options":{"A":"不符。TSC1/TSC2 與結節性硬化症相關。","B":"不符。RAS 與 FGFR3 突變見於乳突狀低惡性度腫瘤。","C":"不符。EWS-FLI1 融合是尤文氏肉瘤的特徵。","D":"正確（本題答案）。扁平原位癌以 TP53 與 RB 失活為特徵。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease 10e》","WHO Classification of Tumours: Urinary and Male Genital Tumours 5e"]}},"med2_115090-94":{"quick":"原發性膜性腎病變中約 70～80% 可測到抗磷脂酶 A2 受體（PLA2R）自體抗體。","detail":{"background":"膜性腎病變是成人腎病症候群最常見的原因之一，本質是「上皮下（subepithelial）免疫複合體沉積」造成基底膜增厚：(1) 「原發性（約 75%）」——是器官特異性的自體免疫病：足細胞表面的抗原被自體抗體辨識並「原位（in situ）」形成免疫複合體。「抗磷脂酶 A2 受體（anti-PLA2R）抗體在約 70～80% 的原發性病人可測到」，其效價與疾病活性、治療反應及移植後復發相關，已成為診斷（可免除切片）與追蹤的標準工具，故選項 A 正確；其餘可測到 THSD7A、NELL-1、SEMA3B、EXT1/2 等新近發現的抗原，相當一部分與特定的次發原因相關（如 NELL-1 與惡性腫瘤）。(2) 「次發性」——原因包括感染（B 型肝炎、梅毒）、自體免疫（紅斑性狼瘡第五型）、惡性腫瘤（肺、大腸、胃）與藥物（金製劑、青黴胺、NSAID）；此時「並沒有針對基底膜的自體抗體」——抗腎絲球基底膜抗體是 Goodpasture 症候群（抗第四型膠原 α3 鏈的 NC1 區）的標記，故選項 B 錯誤。(3) 「病理」——「光學顯微鏡」下腎絲球「基底膜均勻增厚，膈細胞（mesangial cells）不增生」（這是與膜增生性腎絲球腎炎的關鍵區別），故選項 C 錯誤；銀染可見基底膜向外突出的「釘突（spikes）」——是基底膜在沉積物之間增生形成，而非「銳角狀分叉」（後者是膜增生性腎炎的雙軌 tram-track 現象）。「免疫螢光」呈 IgG 與 C3 沿血管壁的顆粒狀沉積。「電子顯微鏡」下沉積物位於「上皮（足細胞）下方、基底膜外側」，並伴足突消失，「不是在膈細胞下方」，故選項 D 錯誤。(4) 「臨床」——腎病症候群、血栓風險高（尤其腎靜脈栓塞）；治療依風險分層，高風險者用 rituximab 或 cyclophosphamide 加類固醇。","options":{"A":"正確（本題答案）。原發性膜性腎病變多數可測到抗 PLA2R 抗體。","B":"錯誤。抗基底膜抗體是 Goodpasture 症候群的標記。","C":"錯誤。膜性腎病變的膈細胞不增生；基底膜呈釘突狀。","D":"錯誤。沉積物位於上皮（足細胞）下方，非膈細胞下方。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease 10e》","Brenner and Rector's The Kidney 11e"]}},"med2_115090-95":{"quick":"單側隱睪症病人「雙側」睪丸的生殖細胞腫瘤風險都增加，顯示其為潛在的體質性異常。","detail":{"background":"睪丸腫瘤的重要觀念：(1) 「隱睪症（cryptorchidism）」——是生殖細胞腫瘤最明確的危險因子，風險增加 3～5 倍；關鍵在於「即使是單側隱睪，對側已正常下降的睪丸罹癌風險同樣上升」——這說明隱睪並非單純的位置問題，而是反映「睪丸發育不全症候群（testicular dysgenesis syndrome）」這種內在的體質異常（同時包含隱睪、尿道下裂、精子生成不良與生殖細胞腫瘤）。因此青春期前施行睪丸固定術可降低但無法完全消除風險，且主要價值在於保存生育力與便於自我檢查，選項 A 正確。(2) 「年齡分布」——「精原細胞瘤（seminoma）」好發於 35～45 歲，是最常見的睪丸生殖細胞腫瘤；「精原細胞性腫瘤（spermatocytic tumor，舊稱 spermatocytic seminoma）」則好發於「50～60 歲以上」的老年男性，是一種罕見、預後極佳、幾乎不轉移的腫瘤——但「60 歲以上男性最常見的睪丸腫瘤是淋巴瘤（瀰漫性大 B 細胞淋巴瘤）」，且常為雙側，故選項 B 錯誤。(3) 「原位生殖細胞瘤（GCNIS）」——是成人型生殖細胞腫瘤的共同前驅病變，見於腫瘤周圍的曲細精管；但「兒童（青春期前）的畸胎瘤與卵黃囊瘤屬另一類，不由 GCNIS 發展而來、無等臂染色體 12p，且畸胎瘤在兒童幾乎都是良性」，故選項 C 錯誤。(4) 「兒童最常見的生殖細胞腫瘤是卵黃囊瘤（yolk sac tumor，內胚竇瘤）」，分泌甲型胎兒蛋白（AFP），組織學可見 Schiller-Duval 小體，故選項 D 錯誤。","options":{"A":"正確（本題答案）。單側隱睪者雙側睪丸的腫瘤風險皆增加。","B":"錯誤。60 歲以上最常見的睪丸腫瘤是淋巴瘤。","C":"錯誤。兒童畸胎瘤不由原位生殖細胞瘤發展而來。","D":"錯誤。兒童最常見的生殖細胞腫瘤是卵黃囊瘤。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease 10e》","Campbell-Walsh-Wein Urology 12e"]}},"med2_115090-96":{"quick":"無排卵週期最常見於初經後與停經前的過渡期（有月經但不排卵）；停經後已無月經週期可言。","detail":{"background":"「無排卵週期（anovulatory cycle）」指有月經來潮但該週期未發生排卵，因而沒有黃體形成、缺乏黃體素：(1) 「好發時期」——「初經後的青春期（下視丘-腦下垂體-卵巢軸尚未成熟）」與「停經前的更年期過渡期（卵巢儲備下降、濾泡對促性腺激素反應變差）」，這兩個生命階段的輕微內分泌失衡最常造成無排卵。「停經後」卵巢濾泡已耗竭、月經已停止一年以上，根本不存在「週期」可言，因此「停經後最常看到無排卵週期」的敘述不成立，選項 A 為最不適當。(2) 「其他病因」——內分泌疾病如「甲狀腺功能異常、腦垂腺腫瘤（泌乳素瘤）、腎上腺疾病」（選項 B 正確）；卵巢病灶如「多囊性卵巢症候群」、功能性卵巢腫瘤（分泌雌激素的顆粒細胞瘤）（選項 C 正確）；以及肥胖、極度消瘦、劇烈運動、壓力與藥物。(3) 「病理後果」——排卵失敗使子宮內膜「持續受到無黃體素對抗的雌激素刺激（unopposed estrogen）」，內膜過度增厚、腺體增生而間質支撐不足，導致「不規則的異常子宮出血（無排卵性功能失調性子宮出血）」；長期則依序進展為「單純性增生 → 複雜性增生 → 非典型增生 → 子宮內膜樣腺癌」，選項 D 正確。因此臨床處置的核心就是「補充黃體素或給予複方口服避孕藥」以定期使內膜剝落，並對持續異常出血、尤其 45 歲以上或高風險者施行內膜切片。","options":{"A":"最不適當（本題答案）。無排卵週期好發於青春期與更年期過渡期，停經後已無週期。","B":"適當。甲狀腺疾病與腦垂腺腫瘤可造成無排卵。","C":"適當。多囊性卵巢是常見的卵巢性病因。","D":"適當。排卵失敗造成無黃體素對抗的雌激素刺激。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease 10e》","Berek & Novak's Gynecology 17e"]}},"med2_115090-97":{"quick":"完全性葡萄胎約 90% 為 46,XX，且兩套染色體全部來自父親（空卵受精後複製）。","detail":{"background":"妊娠滋養細胞疾病的細胞遺傳學是必考重點：(1) 「完全性葡萄胎（complete mole）」——「空的卵子（母系染色體缺失或失活）」受精後，父系染色體自行複製，形成「雙倍體且完全為父系來源（androgenetic diploidy）」。約「90% 為 46,XX」（單一精子攜 X 進入後複製；不會出現 46,YY，因為缺乏 X 染色體無法存活），約 10% 為 46,XY（雙精受精）。由於完全沒有母系基因體，「沒有胎兒或胚胎組織」，絨毛呈瀰漫性水腫伴中央池（cistern）與環繞絨毛的廣泛滋養細胞增生；母系印記基因 p57KIP2 免疫染色「陰性」是最實用的鑑別工具。β-hCG 常異常升高，超音波呈暴風雪或多囊狀影像；後續發生持續性滋養細胞疾病的機率約 15～20%。(2) 「部分性葡萄胎（partial mole）」——多為「三倍體（69,XXX 或 69,XXY，兩套父系加一套母系）」，故選項 C 是部分性葡萄胎的核型；有胎兒組織（多為畸形且無法存活）、局部性絨毛水腫與局部滋養細胞增生，p57 陽性；惡性轉化率僅 1～5%。(3) 「92,XXXY」為四倍體，極罕見且多為早期流產。(4) 「處置」——抽吸刮除術後每週追蹤 β-hCG 至連續三次陰性，再每月追蹤 3～6 個月，期間須嚴格避孕（懷孕會混淆判讀）；β-hCG 平原或上升即代表持續性滋養細胞疾病，需化學治療（methotrexate 或 actinomycin D）。","options":{"A":"正確（本題答案）。完全性葡萄胎約 90% 為 46,XX 且全為父系來源。","B":"較少見。46,XY 約佔完全性葡萄胎的 10%（雙精受精）。","C":"不符。69,XXY 為部分性葡萄胎的三倍體核型。","D":"不符。92,XXXY 為極罕見的四倍體。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease 10e》","Williams Obstetrics 26e"]}},"med2_115090-98":{"quick":"疱疹樣皮膚炎的直接免疫螢光特徵是 IgA 呈顆粒狀沉積於真皮乳頭尖端（表皮真皮交界處）。","detail":{"background":"自體免疫水泡性皮膚病依「抗原位置」與「免疫螢光型態」鑑別：(1) 「天疱瘡（pemphigus vulgaris）」——抗「desmoglein 3（與 1）」的 IgG 攻擊表皮內的胞橋小體，造成「表皮內（棘層）水泡」，臨床為鬆弛易破的水泡與大片糜爛、Nikolsky 徵象陽性、常先侵犯口腔黏膜；直接免疫螢光呈「IgG 與 C3 的網狀（漁網狀）」沉積於角質細胞間。(2) 「類天疱瘡（bullous pemphigoid）」——抗「BP180（第十七型膠原）與 BP230」的 IgG 攻擊半橋粒，造成「表皮下水泡」，臨床為老年人張力性大水泡、劇癢、黏膜較少侵犯；直接免疫螢光呈「IgG 與 C3 沿基底膜帶的線狀沉積」，組織學可見嗜酸性球浸潤。(3) 「疱疹樣皮膚炎（dermatitis herpetiformis）」——是「乳糜瀉（麩質敏感性腸病）」的皮膚表現，抗原為表皮轉麩醯胺酸酶（eTG3）；臨床為對稱分布於伸側（手肘、膝、臀、頭皮）的極癢小水泡與丘疹，常因搔抓而僅見抓痕。其標誌性的免疫螢光是「IgA 呈顆粒狀（granular）沉積於真皮乳頭尖端，即表皮與真皮交界處」，故為本題答案；血清可測到抗肌內膜與抗組織轉麩醯胺酸酶 IgA 抗體，治療是「無麩質飲食」加 dapsone。（另有「線狀 IgA 大疱性皮膚病」，IgA 呈「線狀」沿基底膜沉積，需與之區分。）(4) 「表皮鬆解性水疱症（epidermolysis bullosa）」——是遺傳性的結構蛋白基因缺陷（角質蛋白 5/14、層黏連蛋白、第七型膠原），受摩擦即起水泡，「非免疫媒介」，直接免疫螢光陰性。","options":{"A":"不符。天疱瘡為 IgG 網狀沉積於表皮細胞間。","B":"不符。類天疱瘡為 IgG 與 C3 沿基底膜線狀沉積。","C":"不符。表皮鬆解性水疱症為遺傳性結構蛋白缺陷，非免疫媒介。","D":"正確（本題答案）。疱疹樣皮膚炎為 IgA 顆粒狀沉積於真皮乳頭尖端。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease 10e》","Fitzpatrick’s Dermatology 9e"]}},"med2_115090-99":{"quick":"庫魯斑塊是異常普利昂蛋白（PrP^Sc）構成的類澱粉斑塊，不是 Aβ 蛋白沉積。","detail":{"background":"「庫魯斑塊（Kuru plaque）」是普利昂疾病的組織學標誌：(1) 「成分」——由「異常構形的普利昂蛋白（PrP^Sc）」聚集形成，屬「普利昂類澱粉」，而非阿茲海默症的「β 類澱粉蛋白（Aβ）」——Aβ 來自類澱粉前驅蛋白（APP）的切割，形成的是老年斑塊（neuritic plaque），兩者的蛋白完全不同，故選項 A 為最不適當。免疫組織化學以抗 PrP 抗體染色可確認。(2) 「染色特性」——凡具 β 摺板結構的類澱粉皆能被「剛果紅（Congo red）」染色，並在偏光顯微鏡下呈「蘋果綠雙折射」，庫魯斑塊亦然，選項 C 正確。(3) 「分布」——庫魯斑塊「最常見於小腦（尤其顆粒細胞層）」，呈中央緻密核心加放射狀纖維的圓形嗜伊紅斑塊，選項 D 正確。(4) 「疾病關聯」——最初描述於「庫魯病（Kuru）」——巴布亞紐幾內亞 Fore 族因食人葬俗（食用死者腦組織）而流行的普利昂病，以小腦性共濟失調與震顫為主；「亦見於變異型庫賈氏病（vCJD，與狂牛症相關，其特徵是被空泡環繞的花瓣狀斑塊 florid plaque）與少數散發型庫賈氏病、GSS 症候群」，故選項 B 正確。(5) 「普利昂病的共通病理」——大腦皮質的「海綿狀變性（spongiform change）」、神經元流失與星狀膠細胞增生，「而無發炎反應」；臨床為快速進展的失智、肌陣攣、視覺與小腦症狀，腦電圖見週期性尖銳複合波，磁振造影擴散加權影像見皮質緞帶徵象與基底核高訊號，腦脊髓液 RT-QuIC 與 14-3-3 蛋白有助診斷；目前無有效治療。","options":{"A":"最不適當（本題答案）。庫魯斑塊由異常普利昂蛋白構成，非 Aβ 沉積。","B":"適當。亦見於變異型與部分散發型庫賈氏病。","C":"適當。屬類澱粉，剛果紅染色陽性。","D":"適當。庫魯斑塊最常見於小腦。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease 10e》","Adams and Victor's Principles of Neurology 12e"]}},"med2_115090-100":{"quick":"腦膜瘤表現黃體素受體，懷孕期間常見腫瘤「加速生長」與症狀惡化，不是生長變慢。","detail":{"background":"腦膜瘤源自蜘蛛網膜的腦膜上皮（帽狀）細胞，是成人最常見的原發性顱內腫瘤（約佔三分之一）：(1) 「良惡性分布」——「絕大多數（約 80～90%）為 WHO 第一級的良性腫瘤」，生長緩慢、邊界清楚、以硬腦膜為基底並常見「硬腦膜尾（dural tail）」與砂粒體、鈣化；第二級（非典型）約 5～15%，第三級（間變性）不到 3%，選項 A 正確。手術全切除多可治癒（Simpson 分級決定復發率）。(2) 「年齡與性別」——好發於中老年（40～70 歲），「兒童罕見」，選項 B 正確；「女性明顯多於男性（約 2～3:1）」，脊髓腦膜瘤的性別差異更大（可達 9:1）。(3) 「荷爾蒙影響」——腦膜瘤細胞高比例表現「黃體素（progesterone）受體」（約 70～80%，雌激素受體反而少），因此「懷孕期間腫瘤常快速長大、症狀急遽惡化（也與血流與體液增加有關），產後可部分縮小」；長期使用高劑量黃體素製劑（如 cyproterone acetate）已被證實增加腦膜瘤風險。因此選項 C 的「生長較慢」與事實相反，是本題答案；此外腦膜瘤與乳癌之間也有流行病學上的關聯。(4) 「遺傳」——最常見的分子事件是「第 22 對染色體長臂的 NF2 基因缺失或突變」，選項 D 正確；「第二型神經纖維瘤病（NF2）」病人常出現多發性腦膜瘤與雙側前庭神經鞘瘤。其他危險因子包括「游離輻射暴露（最明確的環境因子）」與肥胖。","options":{"A":"適當。腦膜瘤大多為 WHO 第一級的良性腫瘤。","B":"適當。腦膜瘤好發中老年，兒童罕見。","C":"最不適當（本題答案）。腦膜瘤表現黃體素受體，懷孕期常加速生長。","D":"適當。第 22 對染色體的 NF2 基因缺失是最常見的分子事件。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease 10e》","WHO Classification of Tumours of the Central Nervous System 5e"]}}},TO=["T1細胞損傷適應壞死與凋亡", "T2發炎與組織修復", "T3血液動力學血栓栓塞與休克", "T4腫瘤學總論", "T5免疫遺傳環境與營養病理", "T6感染症病理", "T7心血管系統病理", "T8呼吸系統病理", "T9消化肝膽胰系統病理", "T10泌尿與生殖系統病理", "T11血液淋巴與內分泌病理", "T12神經肌肉骨骼皮膚病理"],LEC={"T1細胞損傷適應壞死與凋亡":{"title":"細胞損傷‧適應‧壞死與凋亡","html":"<p><b>細胞適應</b>:萎縮(細胞變小±數目減少,脂褐質沉積)、肥大(生理性靠PI3K/AKT)、增生、化生(支氣管鱗狀化生、Barrett腸上皮化生、骨化性肌炎=化生)。發育不良(dysplasia)為癌前。</p><p><b>可逆vs不可逆損傷</b>:可逆=細胞腫脹、ER擴張、核醣體脫離、染色質凝聚;不可逆=粒線體蛋白外漏、溶酶體破裂、核濃縮→碎裂→溶解。缺氧→ATP↓、鈉水流入、鈣流入、pH↓。</p><p><b>壞死型態</b>:凝固性(心腎脾梗塞,輪廓保留、強嗜酸性、核模糊)、液化性(腦梗塞/化膿→囊性)、乾酪性(結核)、脂肪壞死(胰臟)、類纖維蛋白(血管炎)。<b>凋亡</b>:phosphatidylserine翻轉至膜外被巨噬細胞識別、不引起發炎。p53致G1停滯/凋亡;MDM2抑制p53。色素:脂褐質(自由基/脂質過氧化)、含鐵血黃素(出血後)、黑色素。</p><p><b>深入補充：</b>適應：肥大(細胞變大，心肌/子宮)、增生(數目增，前列腺/內膜)、萎縮(廢用/去神經)、化生(可逆變另型上皮，Barrett食道柱狀化、吸菸支氣管鱗狀化)、化生久可異型增生→癌。可逆傷害(細胞腫脹、脂肪變性)vs不可逆(粒線體損、細胞膜破、鈣內流)。壞死型態：凝固性(缺血梗塞、輪廓留)、液化性(腦/膿瘍)、乾酪性(結核)、脂肪(胰臟炎皂化)、纖維素樣(血管炎)、壞疽。凋亡(程序性、細胞縮/凋亡小體、無發炎；內在粒線體途徑Bcl-2/細胞色素c、外在Fas/TNF、執行caspase)。自由基/缺氧/化學/感染為損傷因。細胞內堆積(脂/膽固醇/色素含鐵血黃素/脂褐素)。</p>"},"T2發炎與組織修復":{"title":"發炎與組織修復","html":"<p><b>急性發炎：</b>血管期(血管擴張、通透性增→滲出液)＋細胞期(<b>嗜中性球</b>滾動-黏附-穿出-趨化-吞噬)。五大徵：紅腫熱痛＋功能喪失。<b>化學介質</b>：組織胺(血管擴張)、前列腺素(痛/熱)、白三烯(血管通透/趨化)、補體(C3a/C5a 過敏毒素、C5a 趨化)、緩激肽、TNF/IL-1(全身反應)、IL-8(嗜中性球趨化)。</p>\n<p><b>慢性發炎：</b>單核細胞/巨噬細胞、淋巴球、漿細胞；<b>肉芽腫</b>(類上皮細胞＋多核巨細胞，見於結核(乾酪壞死)、結節病、異物、痲瘋)。</p>\n<p><b>組織修復：</b><b>再生</b>(穩定/不穩定細胞，如肝、表皮)vs <b>纖維化(疤痕)</b>(永久細胞或基質破壞)。傷口癒合：肉芽組織(血管新生＋纖維母細胞)→膠原沉積→重塑。<b>一期癒合</b>(乾淨對合)vs <b>二期</b>(缺損大、收縮明顯)。</p>\n<p><b>異常與全身反應：</b>傷口裂開、增生性疤痕/<b>蟹足腫(膠原過度、超出原傷口)</b>；發燒(IL-1/IL-6/TNF→PGE2)、白血球增多、急性期蛋白(CRP)。維生素 C/鋅缺乏、感染、類固醇延遲癒合。</p>\n<p><b>★考點：</b>急性＝嗜中性球；慢性/肉芽腫＝巨噬細胞；C5a 趨化；蟹足腫超出原傷口界線；類固醇與維生素 C 缺乏延遲癒合。</p><p><b>深入補充：</b>急性發炎(數分至數日、嗜中性為主)：血管期(組織胺→擴張/通透)、細胞期(白血球邊緣化→黏附選擇素/整合素→滲出→趨化C5a/LTB4/IL-8→吞噬)。介質：血管活性胺、花生四烯酸(COX→前列腺素、LOX→白三烯)、補體、激肽、細胞激素(TNF/IL-1發燒)。結局：消散、膿瘍、纖維化、慢性。慢性發炎(淋巴球/巨噬/漿細胞、肉芽腫=類上皮巨噬＋多核巨細胞，見結核/結節病/異物)。修復：再生(依細胞增殖力：不穩定/穩定/永久)vs纖維化(肉芽組織=纖維母＋新生血管→膠原疤)。傷口一級/二級癒合；癒合不良(感染/糖尿病/缺血/類固醇/維生素C)。急性期蛋白(CRP/ESR)。</p>"},"T3血液動力學血栓栓塞與休克":{"title":"血液動力學‧血栓栓塞與休克","html":"<p><b>水腫：</b>靜水壓↑(心衰/靜脈阻塞)、膠體滲透壓↓(腎病/肝病低白蛋白)、血管通透↑(發炎)、淋巴阻塞(象皮病)。</p>\n<p><b>血栓(Virchow 三要素)：</b><b>內皮損傷、血流異常(滯留/紊流)、高凝狀態</b>。動脈血栓(白色、富血小板、動脈粥狀硬化)；靜脈血栓(紅色、富纖維蛋白/紅血球、滯留)。<b>Lines of Zahn</b>＝生前血栓。高凝：Factor V Leiden、抗磷脂症候群、惡性腫瘤、術後/制動。</p>\n<p><b>栓塞：</b><b>肺栓塞</b>(深部靜脈→鞍狀栓子可猝死)；<b>系統性栓塞</b>(左心/AF→腦/腎/腸/肢)；<b>脂肪栓塞</b>(長骨骨折，呼吸窘迫＋神經＋皮膚瘀點)；<b>羊水栓塞</b>(產科、DIC)；<b>空氣/氮氣(潛水夫病)</b>。<b>梗塞</b>：紅色(出血性，雙循環如肺/腸)vs 白色(實心器官)。</p>\n<p><b>休克：</b>低容積(出血/脫水)、心因性(MI)、阻塞性(填塞/PE/張力氣胸)、分布性(<b>敗血</b>＝暖休克 SVR↓/過敏/神經性)。進展：代償→進行(細胞缺氧、乳酸酸中毒)→不可逆(多重器官衰竭、DIC、急性腎小管壞死)。</p>\n<p><b>★考點：</b>Virchow 三要素；Lines of Zahn＝生前血栓；長骨骨折＋呼吸窘迫＋瘀點＝脂肪栓塞；敗血性休克 SVR↓CO↑(暖)。</p><p><b>深入補充：</b>水腫機轉(靜水壓升/膠體滲透壓降/淋巴阻塞/鈉滯留)。充血(主動、動脈)vs鬱血(被動、靜脈，如肝鬱血檳榔肝/左心衰肺鬱血心衰細胞)。血栓Virchow三要素：內皮損傷(動脈為主)、血流異常(鬱滯/亂流，靜脈/心房顫動)、高凝(第V因子Leiden/惡性腫瘤/懷孕/口服避孕)。栓塞：肺栓塞(深部靜脈血栓脫落，鞍狀致命)、體循環栓塞(左心/心房顫動)、脂肪(長骨骨折)、空氣、羊水、感染性。梗塞：紅色(出血性、雙供血肺/腸)vs白色(單供血心腎脾)。休克類型：低血容/心因性/分布性(敗血/過敏/神經)/阻塞性；敗血性休克(內毒素→DIC/多器官衰竭)。DIC(消耗凝血因子與血小板→同時出血與血栓)。</p>"},"T4腫瘤學總論":{"title":"腫瘤學總論及各系統腫瘤要點","html":"<p><b>命名與良惡性：</b>良性(-oma)、惡性上皮(carcinoma)、間質(sarcoma)、血液(leukemia/lymphoma)。<b>惡性特徵</b>：分化差/異型性、侵犯、轉移、有絲分裂多、壞死、無包膜、生長快。<b>分化(grade)反映惡性度、分期(stage, TNM)反映擴散且預後更重要</b>。</p>\n<p><b>致癌機轉：</b><b>致癌基因(oncogene)</b>(顯性、功能獲得：RAS、MYC、HER2、ABL)；<b>腫瘤抑制基因</b>(隱性、兩次打擊：<b>RB、TP53(最常見突變)、APC、BRCA、p16</b>)；凋亡(BCL2)、端粒酶、血管新生(VEGF)、DNA 修復缺陷(Lynch/MSI)。多步驟累積。</p>\n<p><b>癌前與標記：</b>化生→異生→原位癌→侵犯。<b>腫瘤標記</b>：AFP(肝/生殖)、CEA(大腸)、PSA(攝護腺)、CA-125(卵巢)、β-hCG(滋養層/生殖)、CA19-9(胰)。<b>副腫瘤症候群</b>(SIADH/ACTH/高血鈣 PTHrP/LEMS)。</p>\n<p><b>致癌因子：</b>化學(多環芳烴/亞硝胺/黃麴毒素→肝)、輻射、<b>病毒(HPV→子宮頸、HBV/HCV→肝、EBV→鼻咽/淋巴、HTLV-1、HHV8→Kaposi、H. pylori→胃)</b>。轉移途徑(淋巴/血行/體腔)。</p>\n<p><b>★考點：</b>分期(TNM)比分級更影響預後；TP53 最常見突變、兩次打擊；標記 AFP/CEA/PSA/CA-125；黃麴毒素→肝癌、HPV→子宮頸、EBV→鼻咽；副腫瘤(PTHrP 高血鈣)。</p><p><b>深入補充：</b>良性(分化好、包膜、緩慢、不轉移，-oma)vs惡性(異型/分化差、浸潤、轉移，癌上皮/肉瘤間質)。分化與分級(grade組織像)、分期(stage TNM，最重要預後)。癌變多步：致癌物(化學/輻射/病毒)→原致癌基因活化(RAS/MYC/HER2)＋抑癌基因失活(p53守門/Rb/APC)＋凋亡逃避(Bcl-2)＋端粒酶＋血管新生(VEGF)＋侵襲轉移。轉移途徑:淋巴(癌)、血行(肉瘤/腎肝肺癌)、體腔。腫瘤標記(AFP肝/生殖、CEA大腸、PSA攝護腺、CA-125卵巢、β-hCG)。副腫瘤症候群(異位荷爾蒙如小細胞肺癌ADH/ACTH、高血鈣PTHrP鱗癌)。惡病質。病毒致癌:HPV/HBV/HCV/EBV/HTLV-1/HHV-8/H.pylori。</p>"},"T5免疫遺傳環境與營養病理":{"title":"免疫‧遺傳‧環境與營養病理","html":"<p><b>免疫病理</b>:過敏分型(I型IgE/II型抗細胞表面如天皰瘡/III型免疫複合體如SLE-血清病/IV型細胞媒介如結核菌素)。天皰瘡=IgG沉積於表皮細胞之間(抗desmoglein);類天皰瘡=基底膜。移植排斥:超急性(預存抗體)/急性細胞(T細胞浸潤、C4d陰性)/急性抗體(C4d陽性)/慢性(纖維化)。腫瘤免疫逃避:降低MHC(非過度表現)、TGF-β/CTLA-4/PD-L1。</p><p><b>遺傳</b>:結構蛋白缺陷(Ehlers-Danlos膠原、Marfan fibrillin體染色體顯性主動脈根擴大);酶缺乏儲積症(Gaucher/Tay-Sachs/黏多醣);唐氏症(三染色體21,FISH診斷,鑲嵌型);完全性葡萄胎46,XX皆父源;G6PD缺乏=性聯隱性;Fragile X=CGG重複(重複引子PCR+南方墨點);22q11.2缺失(T細胞/副甲狀腺,FISH)。<b>環境營養</b>:癩皮病=niacin缺乏;Wernicke=B1缺乏;惡性貧血=B12;鉛中毒(溶血/周邊神經/痛風);砷用unithiol、甲醇用fomepizole、acetaminophen用acetylcysteine(補glutathione)、β阻斷劑過量用glucagon。</p><p><b>深入補充：</b>過敏四型(I即發IgE/II細胞毒/III免疫複合體/IV遲發T)。自體免疫(SLE抗dsDNA全身、硬皮抗Scl-70、乾燥抗SSA/B)。移植排斥與GVHD。類澱粉沉積(Congo紅蘋果綠雙折射，AL輕鏈/AA慢性發炎)。遺傳:體染色體顯性(Marfan/多囊腎/亨汀頓/神經纖維瘤)、隱性(囊腫纖維/鐮狀/苯酮尿/儲積症)、性聯(血友病/G6PD/裘馨)、染色體數目(唐氏21三體/透納45X/柯林菲特47XXY)、印記(Prader-Willi/Angelman)、三核苷酸重複(亨汀頓/脆折X)。環境:鉛(貧血/腦病)、汞、砷、石綿(間皮瘤/肺纖維)、菸(肺癌/COPD)。營養:維生素缺(A夜盲/D佝僂/C壞血/B群)、蛋白熱量不足(Kwashiorkor/marasmus)、肥胖。</p>"},"T6感染症病理":{"title":"感染症病理","html":"<p><b>發炎型態：</b><b>化膿(膿瘍)</b>=化膿菌(金黃葡萄球菌)；<b>肉芽腫</b>=結核(乾酪壞死)、痲瘋、梅毒(膠樣腫)、結節病、黴菌、異物；<b>淋巴球/漿細胞</b>=病毒/慢性；嗜酸性球=寄生蟲/過敏。</p>\n<p><b>特定病原病理：</b>結核(乾酪性肉芽腫、Langhans 巨細胞、抗酸菌)；梅毒(閉塞性動脈內膜炎、漿細胞)；病毒包涵體(CMV 鴞眼、疱疹 Cowdry A、狂犬 Negri 小體)；黴菌(麴菌銳角分支、念珠菌假菌絲、隱球菌墨汁莢膜)。</p>\n<p><b>敗血與全身反應：</b>菌血症→SIRS/敗血症→感染性休克(暖休克 SVR↓)→<b>DIC、多重器官衰竭</b>。內毒素(LPS)誘發 TNF/IL-1。</p>\n<p><b>★考點：</b>乾酪性肉芽腫=結核、CMV 鴞眼包涵體、狂犬 Negri 小體、隱球菌墨汁莢膜；化膿=金黃葡萄球菌；敗血休克暖型 SVR↓；LPS→TNF/IL-1。</p><p><b>深入補充：</b>感染組織反應型態：化膿性(嗜中性、化膿菌葡萄/鏈/腦膜炎雙球)、肉芽腫性(結核乾酪/結節病非乾酪/黴菌/梅毒橡皮腫)、單核細胞性(病毒/細胞內菌)、細胞病變/包涵體(疱疹Cowdry A核內、CMV貓頭鷹眼、狂犬Negri胞質、麻疹多核)。特殊染色:抗酸(結核/痲瘋)、GMS/PAS(黴菌)、Warthin-Starry(螺旋體/貓抓病)、Giemsa(瘧原蟲/立克次)。敗血症→DIC/華佛症候群(腦膜炎雙球菌腎上腺出血)。TORCH先天感染(弓蟲/其他/德麻/CMV/HSV)。伺機性感染依免疫狀態(愛滋CD4對應PCP/CMV/隱球/弓蟲/MAC)。生物膜與導管感染。</p>"},"T7心血管系統病理":{"title":"心血管系統病理","html":"<p><b>動脈硬化：</b><b>粥狀硬化</b>(內膜脂質斑塊、泡沫細胞、危險因子高血脂/糖尿/抽菸/高血壓→心肌梗塞/中風/PAD/動脈瘤)；蒙氏中膜鈣化；小動脈硬化(高血壓/糖尿病、玻璃樣/增生性)。</p>\n<p><b>缺血性心臟病：</b>心肌梗塞病理時序(<b>0–4h 無變化、4–12h 凝固壞死、1–3d 嗜中性球、3–7d 巨噬清除最脆弱易破裂、1–2w 肉芽、>2w 纖維化疤痕</b>)；併發心律不整、心衰、破裂、心包炎、室壁瘤。</p>\n<p><b>其他：</b><b>高血壓性心臟病</b>(向心肥厚)；<b>充血性心衰</b>(肺水腫、含鐵血黃素心衰細胞、肝豆蔻);心肌病(擴張/肥厚/限制)；<b>心內膜炎</b>(贅生物，急性金黃葡萄球菌/亞急性草綠色鏈球菌)；風濕性心臟病(Aschoff 小體、二尖瓣)；心包炎/填塞；<b>主動脈剝離/瘤</b>(高血壓、Marfan 中膜囊狀壞死)。</p>\n<p><b>★考點：</b>MI 時序(3–7 天最易破裂)；風濕熱 Aschoff 小體；心衰細胞=含鐵血黃素巨噬;贅生物急性=金黃葡萄球菌;Marfan→主動脈中膜囊狀壞死。</p><p><b>深入補充：</b>動脈粥狀硬化(內膜脂質斑塊、泡沫細胞、危險因子高血脂/高血壓/糖尿/吸菸)→缺血心臟病。心肌梗塞演變:0–4小時無變化、4–12小時凝固壞死開始、1–3天嗜中性、3–7天巨噬清除(易破裂)、1–2週肉芽、數週疤痕；併發症(心律不整/心衰/破裂/心室瘤/血栓/心包炎)。心衰(左→肺鬱血心衰細胞、右→肝鬱血/下肢水腫)。高血壓性心臟病(向心肥大)。瓣膜:風濕性(二尖瓣狹窄、Aschoff體)、感染性心內膜炎(贅生物、金黃葡萄急性/草綠鏈亞急性)、鈣化性主動脈狹窄。心肌病(擴張/肥厚HOCM猝死/限制型)。心包炎、主動脈剝離(高血壓/Marfan)、動脈瘤(腹主動脈粥狀/梅毒升主動脈)。血管炎(巨細胞/川崎/結節性多動脈/GPA)。</p>"},"T8呼吸系統病理":{"title":"呼吸系統病理","html":"<p><b>阻塞性肺病：</b><b>肺氣腫</b>(腺泡破壞，中心小葉=抽菸、全小葉=α1-抗胰蛋白酶缺)、<b>慢性支氣管炎</b>(咳痰、Reid 指數增)、<b>氣喘</b>(過敏、Curschmann 螺旋/Charcot-Leyden 結晶)、支氣管擴張。</p>\n<p><b>侷限性/間質：</b>肺纖維化(UIP/蜂窩肺)、塵肺(<b>矽肺結節/蛋殼鈣化、石綿→肋膜斑塊+間皮瘤、煤工、鈹肉芽腫</b>)、結節病(非乾酪肉芽腫)、過敏性肺炎；<b>新生兒/成人 RDS</b>(透明膜、surfactant 缺/瀰漫肺泡損傷)。</p>\n<p><b>感染與腫瘤：</b>大葉性/支氣管肺炎；<b>肺癌</b>：<b>腺癌(最常見、女/非吸菸、週邊、EGFR/ALK)</b>、鱗癌(中央、空洞、高血鈣 PTHrP)、<b>小細胞(中央、神經內分泌、SIADH/ACTH/LEMS、化療為主)</b>、大細胞、類癌；肺尖(Pancoast)→Horner。</p>\n<p><b>★考點：</b>中心小葉肺氣腫=抽菸、全小葉=α1-AT 缺；石綿→間皮瘤；鱗癌中央空洞高血鈣、小細胞 SIADH/神經內分泌；腺癌週邊非吸菸 EGFR；RDS 透明膜。</p><p><b>深入補充：</b>阻塞性(FEV1/FVC降)：慢性支氣管炎(黏液腺增生Reid指數)、肺氣腫(小葉中央=吸菸、全小葉=α1抗胰蛋白酶缺)、氣喘(過敏、Curschmann螺旋/Charcot-Leyden結晶)、支氣管擴張。限制性:間質纖維化(蜂窩肺)、塵肺(矽肺/煤/石綿→間皮瘤)、結節病(非乾酪肉芽腫)。急性呼吸窘迫(瀰漫性肺泡損傷、透明膜)。肺炎:大葉(肺炎鏈球菌、充血→紅肝變→灰肝變→消散)、支氣管肺炎、間質(病毒/黴漿)。肺癌:小細胞(中央、吸菸、副腫瘤、神經內分泌)vs非小細胞(腺癌周邊/最常見不吸菸女、鱗癌中央空洞高血鈣、大細胞)。肺栓塞/肺水腫/肺高壓。結核。</p>"},"T9消化肝膽胰系統病理":{"title":"消化‧肝膽胰系統病理","html":"<p><b>食道胃腸</b>:Barrett=腸上皮化生(杯狀細胞);GIST=c-KIT;胃癌(瀰漫型印戒/CDH1預後差、H. pylori);胃底腺息肉與H. pylori無關(PPI相關);IBD(克隆氏症=全壁/跳躍/肉芽腫;潰瘍性結腸炎=黏膜/連續/直腸向近端/不侵迴腸/大腸癌風險↑);偽膜性腸炎=C. difficile;增生性息肉與大腸癌風險最無關;HNPCC=錯配修復(MSH2/MLH1非APC);Burkitt=MYC(迴盲星空樣)。</p><p><b>肝膽胰</b>:肝炎病毒(B型=DNA/母嬰垂直/HDV需HBV;E型=旅行者/孕婦20%死亡;HBeAg=核心相關分泌蛋白非包膜);肝細胞癌(黃麴毒素TP53);纖維薄層型HCC(年輕、無肝硬化背景、預後好);FNH=中央星狀疤痕;酒精性肝炎(AST>ALT2倍、Mallory-Denk、纖維化由中央靜脈周圍起);自體免疫性肝炎(IgG升高、第1型ANA/SMA、第2型LKM-1);PBC(AMA女性)vs PSC(p-ANCA男性+UC);威爾森病(血清總銅診斷價值最低);膽固醇結石(膽固醇過飽和);胰臟癌(管腺癌最常見、胰頭、KRAS/CDKN2A);急性胰臟炎(酗酒/膽石/高三酸甘油酯/高血鈣;出血壞死+低血鈣);慢性胰臟炎(腺泡破壞、小島相對保留)。α1-AT缺乏(PAS陽性diastase抗性小球+肺氣腫)。</p><p><b>深入補充：</b>食道(Barrett化生→腺癌、鱗癌菸酒)。胃:消化性潰瘍(H.pylori/NSAID)、胃癌(腸型腸化生vs瀰漫型印戒細胞皮革胃)。發炎性腸病:克隆氏(跳躍/全層/肉芽腫/瘻管/迴腸)vs潰瘍性結腸炎(連續/黏膜/直腸起/隱窩膿瘍/毒性巨結腸/癌變)。大腸癌(腺瘤-癌序列APC→KRAS→p53、左側阻塞右側貧血)。肝:病毒/酒精/脂肪肝→肝硬化(再生結節/門脈高壓/食道靜脈曲張/腹水/肝腦病變)→肝細胞癌(AFP)。膽:膽結石(膽固醇/色素)、膽囊炎、膽管癌。胰:急性胰臟炎(膽石/酒精、脂肪皂化壞死、澱粉酶脂解酶)、慢性、胰腺癌(頭部無痛黃疸/CA19-9/預後差)。闌尾炎。</p>"},"T10泌尿與生殖系統病理":{"title":"泌尿與生殖系統病理","html":"<p><b>腎絲球</b>:微小變化(足突消失、近端小管脂質、兒童腎病常見);膜性腎病(IgG4/PLA2R、上皮下釘突);MPGN(雙層/車軌);FSGS(成人、近髓質起、足突消失、類固醇效差);糖尿病腎絲球病變(無免疫複合體、Kimmelstiel-Wilson);IgA(系膜);急性感染後GN(上皮下駝峰);緻密物沉積病(基底膜內、C3低C1正常)。高血壓腎硬化(動脈/小動脈/腎小球硬化,非靜脈);急性腎小管壞死(休克後、近端小管,非集尿管);止痛藥腎病(腎乳突壞死)。</p><p><b>泌尿生殖腫瘤</b>:膀胱(原位癌扁平pagetoid、低惡性度乳突FGFR3、Brunn巢在固有層、息肉性膀胱炎=長期尿管);腎(透明細胞癌3p/VHL過甲基化、轉移至肺、抽菸最顯著危險因子;嗜酸細胞瘤=粒線體;血管平滑肌脂肪瘤易出血);前列腺(BPH間質增生、Gleason、PSA);睪丸(精細胞瘤好發成人i(12p)、卵黃囊瘤嬰幼兒、隱睪好發腹股溝管);子宮頸(CIN III、HPV、鱗癌最多);子宮(平滑肌瘤MED12核型正常、子宮內膜癌第一型雌激素/第二型漿液性p53);卵巢(漿液性常雙側、亮細胞癌惡性多、子宮內膜異位相關=亮細胞/子宮內膜樣);乳房(非典型小葉增生風險最高、管內乳突瘤=乳頭血樣分泌、乳房攝影篩檢);異位妊娠最常輸卵管;副甲狀腺亢進(原發=單一腺瘤、次發=腎衰)。</p><p><b>深入補充：</b>腎絲球:腎病症候群(大量蛋白尿/低白蛋白/水腫/高血脂，微小病變兒童足突消失、局部節段硬化、膜性、糖尿病Kimmelstiel-Wilson)vs腎炎症候群(血尿/高血壓/少尿，鏈球菌後駝峰狀沉積、IgA腎病、新月體型急進性、Goodpasture線狀)。急性腎小管壞死(缺血/毒素)。腎盂腎炎/間質性腎炎。腎細胞癌(近曲小管透明細胞、VHL、血尿腫塊)、Wilms(兒童)、尿路上皮癌(膀胱、無痛血尿、吸菸/苯胺染料)。前列腺(增生移形帶/癌周邊帶PSA/Gleason)。睪丸(精原細胞瘤/生殖細胞)。子宮頸(HPV鱗癌)、子宮內膜癌(雌激素)、卵巢(漿液/黏液/畸胎)。乳癌(管內原位→浸潤性、ER/PR/HER2)。</p>"},"T11血液淋巴與內分泌病理":{"title":"血液淋巴與內分泌病理","html":"<p><b>貧血/白血病</b>:缺鐵(小球低色素、女性、慢性失血、TIBC↑ferritin↓);地中海貧血(無效造血骨髓擴張);惡性貧血(B12、抗壁細胞/內在因子、SACD脊髓);再生不良(骨髓減少、idiopathic最多);溶血(TTP/HUS/DIC=碎裂紅血球+血小板低)。AML(全血球減少+芽細胞);CML(t(9;22)BCR-ABL費城染色體、成人、骨髓增生);CLL(B細胞CD20/CD5/CD23、老年);ITP(抗血小板抗體、感染後);MDS最易進展AML;ALL(兒童、臨床似AML、部分BCR-ABL)。</p><p><b>淋巴瘤/凝血/內分泌</b>:成人最常見=瀰漫大B;何杰金(Reed-Sternberg佔小部分、淋巴結、治癒率高);濾泡性=t(14;18)BCL2;被套=cyclin D1/CD5;胃MALT=t(11;18)/H. pylori;EBV相關(鼻咽/Burkitt/何杰金,子宮頸=HPV不相關);Hashimoto(抗甲狀腺球蛋白/抗TPO);腦下垂體中風=出血;Waterhouse-Friderichsen(腦膜炎球菌、腎上腺自髓質出血);類澱粉(剛果紅交叉β折疊、髓質癌=降鈣素、阿茲海默=Aβ);TTP(ADAMTS13↓、血漿置換);血友病=凝血因子(非血小板功能);乳糜瀉相關=T細胞淋巴瘤(EATL)。</p><p><b>深入補充：</b>貧血:小球低色(缺鐵/海洋性/慢性病)、大球(B12/葉酸巨母紅血球)、正球(出血/溶血/再生不良)。溶血(球形/鐮狀/G6PD/自體免疫Coombs)。白血病:急性(母細胞、ALL兒童/AML成人Auer小體)vs慢性(CML費城染色體t(9;22)BCR-ABL/CLL老年)。淋巴瘤:何杰金(Reed-Sternberg、頸部、預後較好)vs非何杰金。多發性骨髓瘤(漿細胞、M蛋白、溶骨、Bence-Jones、腎損)。骨髓增生。內分泌:甲狀腺(Graves瀰漫/橋本淋巴浸潤/乳突癌砂粒體最常見/髓質C細胞降鈣素)、糖尿病(第1型自體免疫/第2型阻抗、併發症微血管)、腎上腺(Cushing/Addison/嗜鉻細胞瘤)、副甲(高鈣)、垂體腺瘤(泌乳素最常)、MEN症候群。</p>"},"T12神經肌肉骨骼皮膚病理":{"title":"神經‧肌肉骨骼‧皮膚病理","html":"<p><b>神經退化/脫髓鞘</b>:阿茲海默(神經炎斑塊Aβ+神經纖維纏結Tau);帕金森/Lewy body=α-synuclein;多重系統退化症=寡樹突細胞α-synuclein包涵體;ALS=TDP-43/SOD1(非Tau);FTLD=TDP-43;庫賈氏症=海綿狀腦病;ADEM(麻疹後脫髓鞘);PML=JC病毒感染寡樹突細胞;代償性水腦(瀰漫腦萎縮,非腦挫傷)。CO中毒=基底核/蒼白球;Duret出血=腦幹;類纖維蛋白壞死=血管炎。Entacapone抑周邊COMT延長levodopa。</p><p><b>骨/肌肉/皮膚/感染</b>:骨硬化症/Paget=破骨細胞活性異常;OPG結合RANKL抑破骨;動脈瘤樣骨囊腫(青少年、液-液平面);骨巨細胞瘤(骨骺20-40歲);遺傳性視網膜母細胞瘤→繼發骨肉瘤;包涵體肌炎=rimmed vacuole;RA(血管翳/骨性強直/TNF已有抗TNF藥;骨贅為退化性關節炎)。皮膚:發育不良痣多不轉黑色素瘤;眼黑色素瘤虹膜發展較慢;遊走性紅斑(萊姆病)病灶含活菌;漢生病(類結核型肉芽腫菌少;癩瘤型泡沫細胞菌多)。鼻腦白黴菌病(血管侵犯壞死、無隔直角分枝、糖尿病/嗜中性球低下);嗜鉻細胞瘤支持細胞=S100。腦瘤:DIPG=H3 K27M、星細胞瘤IDH1突變預後較好、寡突膠質瘤1p/19q共缺失。</p><p><b>深入補充：</b>中風:缺血性(血栓/栓塞、液化壞死)vs出血性(高血壓基底核/動脈瘤蛛網膜下腔)。退化:阿茲海默(β類澱粉斑/神經纖維糾結tau/海馬萎縮)、帕金森(黑質路易體)、亨汀頓。腦膜炎/腦炎。腦瘤:成人膠質母細胞瘤(壞死柵欄)/腦膜瘤，兒童小腦髓母/毛狀星細胞瘤。骨:骨質疏鬆、佩吉特病、骨肉瘤(青少年膝、Codman三角)、軟骨/尤文肉瘤、轉移(攝護腺成骨)。關節:骨關節炎(退化Heberden)vs類風濕(對稱血管翳/晨僵)、痛風(尿酸負雙折射)。肌肉:裘馨肌失養。皮膚:基底細胞癌(最常/珍珠狀/少轉移)、鱗狀細胞癌(日曬/角化)、黑色素瘤(ABCDE/深度預後)、天疱瘡(棘層鬆解)。</p>"}};
const $=s=>document.querySelector(s);

const yset=[...new Set(Q.map(q=>q.roc_year))].sort((a,b)=>a-b);
yset.forEach(y=>fYear.appendChild(Object.assign(document.createElement('option'),{value:y,textContent:'民國'+y+'年'})));
TO.forEach(t=>{if(Q.some(q=>q.topic===t))fTopic.appendChild(Object.assign(document.createElement('option'),{value:t,textContent:disp(t)}));});
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function ansText(q){var a='答案：'+q.answer;if(q.accepted_answers&&q.accepted_answers.length>1)a+='（'+(q.answer_status||'多重答案')+'：'+q.accepted_answers.join('、')+'均給分）';else if(q.answer_status&&q.answer_status.indexOf('送分')>=0)a+='（送分・一律給分）';return a;}
function qCard(q){
 const e=E[q.id];
 const sf=(q.answer_status&&q.answer_status.indexOf('送分')>=0);
 const ma=(q.accepted_answers&&q.accepted_answers.length>1);
 let chips='<span class="chip y">'+esc(q.src)+'</span><span class="chip">'+esc(q.exam_code)+' 第'+q.q_num+'題</span><span class="chip t">'+esc(disp(q.topic))+'</span>';
 if(sf)chips+='<span class="chip sf">送分</span>'; else if(ma)chips+='<span class="chip ma">多重答案</span>';
 const acc=(q.accepted_answers&&q.accepted_answers.length?q.accepted_answers:[q.answer]);
 const songfen=sf?1:0;
 let opts='';for(const k of ['A','B','C','D','E']){if(q.options[k]!==undefined)opts+='<div class="opt" data-k="'+k+'"><b>('+k+')</b>'+esc(q.options[k])+'</div>';}
 const img=q.img?'<img class="fig" src="'+q.img+'" alt="附圖" onclick="this.classList.toggle(\'big\')">':'';
 let det='';
 if(e){det='<div class="qk"><b>⚡ 快速解答：</b>'+esc(e.quick)+'</div>';
  if(e.detail){
   if(e.detail.background)det+='<div class="bg"><h4>📖 背景知識</h4><div>'+esc(e.detail.background)+'</div></div>';
   if(e.detail.options){det+='<div class="oabox"><h4>🔍 逐選項解析</h4>';for(const k of ['A','B','C','D','E']){if(e.detail.options[k]){var cc=(acc.indexOf(k)>=0)?' correct':'';det+='<div class="oa'+cc+'"><b>('+k+')</b> '+esc(e.detail.options[k])+'</div>';}}det+='</div>';}
   if(e.detail.sources&&e.detail.sources.length)det+='<div class="src2">📚 參考來源：'+e.detail.sources.map(esc).join('；')+'</div>';
  }
 }
 return '<div class="q" data-id="'+q.id+'" data-acc="'+acc.join(',')+'" data-songfen="'+songfen+'"><div class="chips">'+chips+'</div>'+
  '<div class="stem"><span class="n">'+q.q_num+'.</span>'+esc(q.stem)+'</div>'+img+
  '<div class="hint">👆 點選 A／B／C／D 作答</div>'+opts+
  '<div class="result"></div>'+
  '<button class="btn tg">看答案＋詳解 ▾</button><div class="ans"><div class="ansline">'+ansText(q)+'</div>'+det+'</div></div>';
}

function saveProg(){try{localStorage.setItem(KEY,JSON.stringify(PROG))}catch(e){}}
function updateStats(){
 const ks=Object.keys(PROG),ans=ks.length,cor=ks.filter(k=>PROG[k].r==='c').length,rate=ans?Math.round(cor/ans*100):0;
 stats.innerHTML = ans
   ? '已作答 <b>'+ans+'</b> / '+TOTAL+' 題 ・ 答對 <b>'+cor+'</b> ・ 答錯 <b>'+(ans-cor)+'</b> ・ 答對率 <b>'+rate+'%</b><div class="bar"><i style="width:'+rate+'%"></i></div>'
   : '👋 點選每題的 A／B／C／D 即可作答，分數與錯題會自動保存（下次打開仍在）';
}
function updateWrongBtn(){const n=Object.keys(PROG).filter(k=>PROG[k].r==='w').length; wrongBtn.textContent='錯題本'+(n?'（'+n+'）':'');}
function fill(qEl,k,correct,songfen,acc){
 qEl.dataset.answered='1'; qEl.classList.add('done');
 qEl.querySelectorAll('.opt').forEach(o=>{const ok=o.dataset.k;
   if(songfen||acc.indexOf(ok)>=0)o.classList.add('right');
   if(ok===k){o.classList.add('pick');if(!correct)o.classList.add('wrong');}});
 const r=qEl.querySelector('.result'); r.className='result '+(correct?'ok':'bad');
 r.textContent=correct?'✓ 正確！':'✗ 錯誤（正確答案：'+acc.join('、')+(songfen?'，本題送分':'')+'）';
}
function applyStored(qEl){const p=PROG[qEl.dataset.id]; if(!p)return; fill(qEl,p.k,p.r==='c',qEl.dataset.songfen==='1',qEl.dataset.acc.split(','));}
function render(){
 const fy=fYear.value,ft=fTopic.value,kw=fKw.value.trim();
 let qs=Q.filter(q=>(!fy||q.roc_year==fy)&&(!ft||q.topic===ft)&&(!kw||q.stem.indexOf(kw)>=0||Object.values(q.options).some(o=>o.indexOf(kw)>=0)));
 if(wrongOnly)qs=qs.filter(q=>PROG[q.id]&&PROG[q.id].r==='w');
 cnt.textContent=(wrongOnly?'錯題複習 · ':'')+'共 '+qs.length+' 題';let h='';
 if(!qs.length&&wrongOnly){h='<div class="grp">目前沒有錯題 🎉（答錯的題目會自動收集到這裡）</div>';}
 else if(view==='topic'){TO.forEach(t=>{const tq=qs.filter(q=>q.topic===t);if(!tq.length)return;h+='<div class="grp">'+disp(t)+'（'+tq.length+'題）</div>'+(wrongOnly?'':lecBox(t))+tq.map(qCard).join('');});}
 else{const ys=[...new Set(qs.map(q=>q.roc_year))].sort((a,b)=>a-b);
  ys.forEach(y=>{h+='<div class="grp">民國'+y+'年（'+qs.filter(q=>q.roc_year===y).length+'題）</div>'+qs.filter(q=>q.roc_year===y).map(qCard).join('');});}
 ce.innerHTML=h||'<div class="cnt">（無符合條件的題目）</div>';
 ce.querySelectorAll('.q').forEach(applyStored);
 ce.querySelectorAll('.ans').forEach(a=>a.classList.toggle('show',expand));
}
function answer(opt){
 const qEl=opt.closest('.q'); if(!qEl||qEl.dataset.answered) return;
 const acc=qEl.dataset.acc.split(','), songfen=qEl.dataset.songfen==='1', k=opt.dataset.k;
 const correct=songfen||acc.indexOf(k)>=0;
 fill(qEl,k,correct,songfen,acc);
 PROG[qEl.dataset.id]={r:correct?'c':'w',k:k}; saveProg(); updateStats(); updateWrongBtn();
}
ce.addEventListener('click',e=>{
 const tt=e.target.closest('.lec .title'); if(tt){const b=tt.nextElementSibling;const o=b.style.display==='none';b.style.display=o?'block':'none';tt.textContent=tt.textContent.replace(o?'▾':'▴',o?'▴':'▾');return;}
 const opt=e.target.closest('.opt'); if(opt&&ce.contains(opt)){answer(opt);return;}
 if(e.target.classList.contains('tg')){const a=e.target.nextElementSibling;a.classList.toggle('show');e.target.textContent=a.classList.contains('show')?'收合詳解 ▴':'看答案＋詳解 ▾';}});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');view=t.dataset.v;render();});
[fYear,fTopic].forEach(s=>s.onchange=render);fKw.oninput=render;
$('#expand').onclick=function(){expand=!expand;this.textContent=expand?'全部收合答案':'全部展開答案';this.classList.toggle('on',expand);render();};
wrongBtn.onclick=function(){wrongOnly=!wrongOnly;this.classList.toggle('on',wrongOnly);render();};
resetBtn.onclick=function(){if(confirm('確定要清除所有作答紀錄、分數與錯題本嗎？此動作無法復原。')){PROG={};saveProg();wrongOnly=false;wrongBtn.classList.remove('on');updateStats();updateWrongBtn();render();}};
updateStats();updateWrongBtn();render();
(function(){function ph(){try{parent.postMessage({cvqHeight:document.documentElement.scrollHeight},'*');}catch(e){}}window.addEventListener('load',ph);document.addEventListener('click',()=>setTimeout(ph,80));setInterval(ph,1500);})();
</script></body></html>
