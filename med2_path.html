:"肺泡擴大為肺氣腫。","C":"肉芽腫性血管炎非ARDS。","D":"中性球浸潤為化膿性肺炎。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108030-81":{"quick":"老年人心衰、心肌間剛果紅陽性沉積,為transthyretin類澱粉(ATTR)。","detail":{"background":"本題老年男性心衰竭/心律不整、心肌切片粉紅色物質沉積於心肌細胞間、剛果紅染色陽性(偏光下蘋果綠雙折射)——為心臟類澱粉沉積(amyloidosis)。在老年人心臟類澱粉最常見的前驅蛋白是甲狀腺素運送蛋白(transthyretin, TTR)(老年性ATTR類澱粉心肌病)。免疫球蛋白(AL型,多發性骨髓瘤)、β2-microglobulin(透析相關)、calcitonin(甲狀腺髓質癌)為其他類澱粉。故為transthyretin。","options":{"A":"免疫球蛋白為AL型(漿細胞疾病)。","B":"β2-microglobulin為透析相關類澱粉。","C":"老年性心臟類澱粉為transthyretin(ATTR)—正解。","D":"calcitonin為甲狀腺髓質癌類澱粉。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108030-83":{"quick":"高密度脂蛋白(HDL)升高與粥狀動脈硬化呈保護(負相關),故為除外項。","detail":{"background":"與動脈粥狀硬化正相關(危險因子)的血中物質:C-反應蛋白(CRP,發炎)、同半胱胺酸(homocysteine)、血糖(糖尿病)、低密度脂蛋白(LDL)。而「高密度脂蛋白(HDL)」是保護性(反向膽固醇運輸),其升高與粥狀硬化負相關(風險降低),故除外(非危險因子)。故除外者為HDL。","options":{"A":"CRP升高與粥狀硬化相關。","B":"HDL升高為保護性(與粥狀硬化負相關)—正解(除外)。","C":"同半胱胺酸升高與粥狀硬化相關。","D":"血糖升高與粥狀硬化相關。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108100-82":{"quick":"與吸菸關係最密切、戒菸可緩解的血管炎是血栓閉塞性血管炎(Buerger氏病)。","detail":{"background":"「血栓閉塞性血管炎(thromboangiitis obliterans, Buerger氏病)」是與吸菸關係最密切的血管炎:侵犯四肢中小血管,早期戒菸可緩解疾病惡化(避免截肢)。Churg-Strauss(嗜酸性肉芽腫)、結節性多動脈炎、Henoch-Schönlein紫斑非以吸菸為核心。故為血栓閉塞性血管炎。","options":{"A":"Churg-Strauss為嗜酸性肉芽腫性血管炎。","B":"結節性多動脈炎為中血管壞死性炎。","C":"血栓閉塞性血管炎與吸菸最密切、戒菸可緩解—正解。","D":"Henoch-Schönlein紫斑為IgA血管炎。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108100-83":{"quick":"主動脈閉鎖屬導管依賴循環,須保持動脈導管開放否則嬰兒很快致命。","detail":{"background":"「主動脈閉鎖(aortic atresia,左心發育不全症候群的一部分)」是左心無法將血輸出至體循環:體循環完全依賴開放的動脈導管(ductus arteriosus)供血,若動脈導管關閉→體循環衰竭、嬰兒出生後很快致命(屬導管依賴型先天性心臟病,須以PGE1維持導管開放)。VSD、主動脈縮窄、ASD較不致立即依賴導管。故為主動脈閉鎖。","options":{"A":"心室中隔缺損非導管依賴。","B":"主動脈縮窄(導管前型嚴重者部分依賴,但非首選答案)。","C":"心房中隔缺損非導管依賴。","D":"主動脈閉鎖為導管依賴循環、須維持導管開放—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109020-83":{"quick":"肥厚型心肌病變為不對稱性中隔肥厚(中隔>游離壁),故C錯誤。","detail":{"background":"肥厚型心肌病變(HCM):①「最常見原因為β-肌凝蛋白重鏈(β-myosin heavy chain)等肌節蛋白基因突變(體染色體顯性)」(A正確);②「年輕人(運動員)猝死的常見原因」(B正確);③「典型為不對稱性心室中隔(septum)肥厚大於游離壁,故C游離壁增厚比中隔多錯誤」——C錯誤;④「中隔肥厚致左心室流出道阻塞(LVOT obstruction)(及SAM現象)」(D正確)。故C錯誤。","options":{"A":"β-肌凝蛋白重鏈突變為最常見原因,正確。","B":"年輕人猝死常見原因,正確。","C":"HCM為中隔肥厚大於游離壁(非相反)—錯誤(正解)。","D":"中隔肥厚致左心室流出道阻塞,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109100-78":{"quick":"SLE是非細菌性疣贅性心內膜炎(Libman-Sacks)的最常見原因,C正確。","detail":{"background":"全身性紅斑性狼瘡(SLE):①「狼瘡腎炎的病理非極具特異性可直接診斷SLE(需臨床+血清+病理綜合)」(故A錯誤);②「狼瘡腎炎最嚴重型是瀰漫性增生性(class IV)(非膜狀class V)」(故B錯誤);③「SLE是非細菌性疣贅性心內膜炎(Libman-Sacks endocarditis,瓣膜兩面疣贅)的最常見原因」(C正確);④「壞疽性臁瘡是綠膿桿菌感染(非SLE血管炎)」(故D錯誤)。故C正確。","options":{"A":"狼瘡腎炎非極具特異性可直接診斷—錯誤。","B":"最嚴重型為瀰漫增生性(class IV)、非膜狀—錯誤。","C":"SLE為非細菌性疣贅性心內膜炎(Libman-Sacks)最常見原因—正解。","D":"壞疽性臁瘡為綠膿桿菌(非SLE)—錯誤。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109100-82":{"quick":"腹主動脈瘤最可能的病因為粥狀動脈硬化。","detail":{"background":"「腹主動脈瘤(abdominal aortic aneurysm, AAA)」最常見(最可能)的病因是動脈粥狀硬化(atherosclerosis)——粥狀硬化破壞中膜、削弱管壁→腎動脈以下腹主動脈擴張成瘤(好發老年、吸菸、高血壓男性)。巨細胞動脈炎(顳動脈)、IgG4相關疾病、第三期梅毒(升主動脈瘤)非AAA最主要病因。故為粥狀動脈硬化。","options":{"A":"巨細胞動脈炎主要侵犯頭部血管。","B":"IgG4相關疾病較少見。","C":"腹主動脈瘤最可能病因為粥狀動脈硬化—正解。","D":"第三期梅毒致升主動脈瘤(非腹主)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_110020-83":{"quick":"退化性二尖瓣環鈣化好發於瓣環(非連合處),故A錯誤。","detail":{"background":"退化性二尖瓣環鈣化(mitral annular calcification):①「鈣化最容易出現在瓣環(annulus),而非瓣膜連合處(commissure)(連合處融合是風濕性瓣膜病的特徵)」——故A錯誤;②「通常不影響瓣膜功能(多無症狀)」(B正確);③「鈣化結節可成為感染性心內膜炎的溫床(風險增加)」(C正確);④「可促成血栓形成(栓塞)」(D正確)。故A錯誤。","options":{"A":"退化性二尖瓣鈣化好發瓣環(非連合處)—錯誤(正解)。","B":"通常無瓣膜功能異常,正確。","C":"感染性心內膜炎風險增加,正確。","D":"引起血栓機會增加,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111020-85":{"quick":"風濕熱(咽炎後ASO升)心臟病灶的特徵細胞為Anitschkow細胞(Aschoff小體)。","detail":{"background":"本題咽炎三週後ASO升高、發燒、心臟炎、關節痛、皮下結節——典型為風濕熱(rheumatic fever,A群鏈球菌咽炎後免疫反應):其心臟(心肌)的特徵性病灶是Aschoff小體,內含Anitschkow細胞(毛蟲樣核的活化巨噬細胞)與Aschoff巨細胞。Reed-Sternberg(何杰金淋巴瘤)、Cajal(腸節律)、Purkinje(傳導)非此。故為Anitschkow細胞。","options":{"A":"風濕熱心臟病灶見Anitschkow細胞(Aschoff小體)—正解。","B":"Reed-Sternberg細胞見於何杰金淋巴瘤。","C":"Cajal細胞為腸道節律細胞。","D":"Purkinje細胞為心臟傳導細胞。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111020-86":{"quick":"四腔室擴大、無心室肥厚、冠狀動脈無狹窄的擴張型心肌病變,不會見myofiber disarray。","detail":{"background":"本題心臟擴大(600g)、四腔室擴大、兩側心室無特別肥厚、冠狀動脈無狹窄——為擴張型心肌病變(dilated cardiomyopathy)。其鏡下可見心肌細胞肥大(代償)、間質纖維化、心內膜下小疤痕(A、B、C可見);而心肌纖維排列紊亂(myofiber disarray)是肥厚型心肌病變(HCM)的特徵,不見於擴張型心肌病變。故不會見者為myofiber disarray。","options":{"A":"心肌細胞肥大可見於擴張型心肌病變。","B":"間質纖維化可見。","C":"心內膜下小疤痕可見。","D":"myofiber disarray為HCM特徵、不見於擴張型—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112020-83":{"quick":"心肌間質細絲狀(10-12微米、無分支)沉積物為transthyretin類澱粉沉積。","detail":{"background":"本題心衰、右心壁肥厚與左心肥大、心肌間質細絲狀無分支沉積物(直徑約10-12奈米/微米)——病理為心臟類澱粉沉積(amyloidosis):類澱粉超微結構為無分支的細纖維絲(約7.5-10nm),剛果紅陽性;在老年心臟最常見為transthyretin(ATTR)類澱粉。心內膜彈性纖維增生、缺血性纖維化、放射後纖維化的型態不同。故為transthyretin amyloidosis。","options":{"A":"心內膜彈性纖維增生為嬰兒心內膜病變。","B":"缺血性間質纖維化非細絲狀沉積。","C":"transthyretin類澱粉沉積(細絲無分支)—正解。","D":"放射後纖維化非細絲狀沉積。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112100-81":{"quick":"以心臟收縮功能障礙為主(擴張型心肌病變)的原因含酒精、病毒、周產期等(①②③)。","detail":{"background":"以心臟收縮功能障礙(systolic dysfunction)為主的心肌病變是擴張型心肌病變(dilated cardiomyopathy),其可能病因:①酒精(酒精性心肌病);②病毒(病毒性心肌炎後);③周產期(peripartum)、遺傳、化療(doxorubicin)、血色素沉著症等。本題①②③皆為擴張型(收縮障礙)心肌病變的原因。故為①②③(123)。","options":{"A":"遺漏③。","B":"①酒精②病毒③等皆致擴張型心肌病變—正解(123)。","C":"遺漏①。","D":"組合不符。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_113090-84":{"quick":"馬凡氏症候群心臟瓣膜最常出現二尖瓣黏液性變性(脫垂)。","detail":{"background":"「馬凡氏症候群(Marfan syndrome,fibrillin-1缺陷)」的心臟瓣膜最常出現二尖瓣黏液樣(黏液性)變性(myxomatous degeneration)——使瓣膜鬆軟、冗長→二尖瓣脫垂(mitral valve prolapse)與逆流(及主動脈根擴張)。主動脈瓣/二尖瓣連合處融合是風濕性瓣膜病;主動脈瓣鈣化是退化性。故為二尖瓣黏液性變性。","options":{"A":"連合處融合為風濕性瓣膜病。","B":"主動脈瓣鈣化為退化性。","C":"馬凡氏症心臟瓣膜最常為二尖瓣黏液性變性—正解。","D":"二尖瓣連合處融合為風濕性。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114020-83":{"quick":"動脈粥狀硬化斑塊為偏心性(非同心圓整圈)增厚,故A錯誤。","detail":{"background":"動脈粥狀硬化病灶:①「斑塊通常是偏心性(eccentric)分布,而非以同心圓方式整圈增厚(同心圓增厚較見於高血壓的小動脈硬化)」——故A錯誤;②「血流亂流處(分叉、彎曲處)較易形成斑塊」(B正確);③「斑塊可能破裂→血栓形成、阻塞血管腔(致梗塞)」(C正確);④「風險因子含家族性高膽固醇血症(LDL受體基因突變)」(D正確)。故A錯誤。","options":{"A":"粥狀斑塊為偏心性(非同心圓整圈)—錯誤(正解)。","B":"血流亂流處較易形成斑塊,正確。","C":"斑塊破裂致血栓阻塞,正確。","D":"LDL受體基因突變為風險因子,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114090-82":{"quick":"明顯的心室中隔缺損(大量左→右分流)最易長期造成肺高壓(Eisenmenger)。","detail":{"background":"先天性心臟病造成肺高壓:左到右分流大的缺損(如明顯的心室中隔缺損(VSD)、大型ASD、PDA),因肺循環長期血流量過大→肺血管重塑、肺動脈高壓,最終可逆轉成右到左分流(艾森門格症候群Eisenmenger)。Fallot四合症(右到左分流,肺血流少)、主動脈狹窄、單純肺動脈瓣狹窄不致肺血流過多。故最易致肺高壓者為明顯VSD。","options":{"A":"明顯VSD(大量左→右分流)最易致肺高壓—正解。","B":"Fallot四合症為右到左分流(肺血流少)。","C":"主動脈狹窄非肺高壓主因。","D":"單純肺動脈瓣狹窄不致肺血流過多。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_115020-81":{"quick":"心肌梗塞後3小時死亡,肉眼檢查心臟通常看不出變化。","detail":{"background":"心肌梗塞的肉眼變化隨時間出現:①「梗塞後數小時內(<6-12小時),肉眼通常看不出明顯變化(須特殊染色TTC才顯蒼白)」(本題3小時,A正確);②約12-24小時後梗塞區暗紅;③1-3天黃色(中性球);④數週後灰白疤痕(凹陷硬)。故梗塞後3小時肉眼看不出變化。","options":{"A":"梗塞後3小時肉眼看不出變化—正解。","B":"暗紅軟為約12-24小時。","C":"黃色軟為約1-3天。","D":"凹陷硬疤痕為數週後。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_115020-83":{"quick":"巨細胞動脈炎主要影響頭部(顳)動脈,A正確。","detail":{"background":"巨細胞(顳)動脈炎(giant cell arteritis):①「主要影響頭部血管(尤顳動脈及顱外動脈),可致頭痛、顳動脈壓痛、視力減退/失明(眼動脈受累)、下頷跛行」(A正確);②「冠狀動脈瘤是川崎氏症的併發症(非巨細胞動脈炎)」(故B錯誤);③「病理為肉芽腫性發炎含多核巨細胞(非嗜酸性球,後者見於Churg-Strauss)」(故C錯誤);④「好發50歲以上老年人(非35歲前)」(故D錯誤)。故A正確。","options":{"A":"巨細胞動脈炎主要影響頭部(顳)血管—正解。","B":"冠狀動脈瘤為川崎氏症併發症—錯誤。","C":"嗜酸性球見於Churg-Strauss(非此)—錯誤。","D":"好發50歲以上老年(非35歲前)—錯誤。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_106100-86":{"quick":"石棉小體由巨噬細胞包覆(非中性球吞噬),故C錯誤。","detail":{"background":"石棉塵肺症(asbestosis):①「閃石(amphibole)型石棉較溫石棉(chrysotile)更易引起間皮瘤(纖維直硬、滯留肺久)」(A正確);②「石棉接觸者罹肺癌風險增加(與吸菸協同)」(B正確);③「石棉小體(asbestos body)是石棉纖維被巨噬細胞包覆含鐵蛋白(ferruginous body),而非中性球吞噬」——故C錯誤;④「接觸石棉是間皮瘤最主要的原因」(D正確)。故C錯誤。","options":{"A":"閃石型較溫石棉易引起間皮瘤,正確。","B":"石棉接觸者肺癌風險高,正確。","C":"石棉小體由巨噬細胞包覆(非中性球)—錯誤(正解)。","D":"接觸石棉為間皮瘤最主要原因,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_106100-88":{"quick":"常產生神經內分泌物質是小細胞癌的特徵,與肺鱗狀細胞癌最不相關。","detail":{"background":"肺鱗狀細胞癌的特徵:①「與抽菸強相關」(A相關);②「常發生於支氣管、肺門(中央型)」(B、C相關);③「鏡下角化珠、細胞間橋、可分泌PTHrP(高血鈣)」。而產生神經內分泌物質(ACTH、ADH等)是小細胞癌(神經內分泌腫瘤)的特徵,與鱗狀細胞癌最不相關。故最不相關者為常產生神經內分泌物質。","options":{"A":"抽菸與鱗癌相關。","B":"常發生於支氣管(中央型),相關。","C":"常發生於肺門(中央型),相關。","D":"產生神經內分泌物質為小細胞癌特徵、與鱗癌最不相關—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_107100-85":{"quick":"矽肺症患者感染結核的機率增加(非與一般人相近),故C錯誤。","detail":{"background":"矽肺症(silicosis):①「是盛行率最高的塵肺症」(A正確);②「即使停止接觸二氧化矽,疾病仍可持續進展(不可逆)」(B正確);③「矽塵損害肺泡巨噬細胞→削弱對結核菌的清除,故矽肺者感染結核(矽肺結核)的機率增加(而非與一般人相近)」——故C錯誤;④「晚期可見進展性大量纖維化(PMF)」(D正確)。故C錯誤。","options":{"A":"盛行率最高的塵肺症,正確。","B":"停止接觸後仍可進展,正確。","C":"矽肺者結核風險增加(非與一般人相近)—錯誤(正解)。","D":"晚期可見進展性大量纖維化,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_107100-86":{"quick":"形成蜂巢肺與肺小細胞癌最無關(蜂巢肺為間質纖維化)。","detail":{"background":"肺小細胞癌的特徵:①「可分泌ACTH(庫欣)、ADH(SIADH)等副贅瘤神經內分泌物質」(A相關);②「常轉移至腎上腺、肝、腦、骨」(C相關);③「臨床咳血、呼吸困難(中央型壓迫)」(D相關)。而蜂巢肺(honeycomb lung)是間質性肺纖維化(如IPF)的晚期表現,與小細胞癌最無關。故最無關者為形成蜂巢肺。","options":{"A":"可分泌ACTH(副贅瘤),相關。","B":"蜂巢肺為間質纖維化、與小細胞癌最無關—正解。","C":"常轉移至腎上腺,相關。","D":"咳血呼吸困難,相關。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_107100-99":{"quick":"誤食農藥致低順應性、瀰漫性肺陰影,最可能為成人呼吸窘迫症候群(ARDS)。","detail":{"background":"本題誤食農藥(如百草枯paraquat)、呼吸困難、肺順應性下降(low compliance,硬肺)、X光瀰漫性肺陰影——典型為急性(成人)呼吸窘迫症候群(ARDS):瀰漫性肺泡傷害、玻璃樣膜、肺水腫、纖維化致順應性下降、頑固性低血氧。肺氣腫(過度充氣)、急性氣管炎、Wegener肉芽腫的表現不同。故為ARDS。","options":{"A":"成人呼吸窘迫症候群(ARDS,低順應性、瀰漫陰影)—正解。","B":"肺氣腫為過度充氣(順應性增加)。","C":"急性氣管炎非此。","D":"Wegener肉芽腫為血管炎(肺空洞結節)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108030-87":{"quick":"類肉瘤的病理為非乾酪性(非壞死性)肉芽腫,「壞死性肉芽腫」錯誤。","detail":{"background":"類肉瘤(sarcoidosis):①「大多數病人雙側肺門淋巴結腫大」(A正確);②「由CD4陽性T細胞驅動的免疫反應(Th1)」(B正確);③「病理為非乾酪性(非壞死性)肉芽腫(noncaseating granuloma),而非壞死性肉芽腫(後者見於結核/感染)」——故C錯誤;④「可侵犯肺、淋巴結、脾、肝、皮膚、眼等多器官」(D正確)。故C錯誤。","options":{"A":"多數病人雙側肺門淋巴結腫大,正確。","B":"CD4 T細胞驅動的免疫反應,正確。","C":"類肉瘤為非乾酪性(非壞死性)肉芽腫—錯誤(正解)。","D":"病灶可在肺/脾/肝等,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108030-88":{"quick":"車禍長骨骨折後數日胸痛呼吸困難,最可能為肺(脂肪)栓塞。","detail":{"background":"本題車禍長骨(小腿)骨折、固定後數日出現胸痛、呼吸困難——最可能為肺栓塞(尤脂肪栓塞症候群fat embolism):長骨骨折釋出骨髓脂肪進入循環、栓塞肺動脈(及腦、皮膚瘀斑),典型傷後1-3天發作(亦可為深層靜脈血栓的肺栓塞)。敗血症、顱內出血、細菌性肺炎的時序/情境不符。故為肺栓塞。","options":{"A":"敗血症非典型骨折後數日表現。","B":"肺(脂肪)栓塞(長骨骨折後數日)—正解。","C":"顱內出血非此情境。","D":"細菌性肺炎非典型骨折後脂肪栓塞。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108100-86":{"quick":"機化性肺炎(COP)涉及小支氣管與肺泡,「不涉及小支氣管」錯誤。","detail":{"background":"機化性肺炎(organizing pneumonia, COP/BOOP):①「肺泡(與小支氣管)腔內塞滿球狀的纖維母細胞/疏鬆結締組織增生(Masson body)」(A正確);②「病變涉及小支氣管(bronchiole)與肺泡(故B不涉及小支氣管錯誤)」——B錯誤;③「通常無間質性纖維化」(C正確);④「通常無蜂巢狀纖維化(預後較IPF好,類固醇反應佳)」(D正確)。故B錯誤。","options":{"A":"肺泡中見Masson body(纖維母細胞球),正確。","B":"機化性肺炎涉及小支氣管(非不涉及)—錯誤(正解)。","C":"通常無間質性纖維化,正確。","D":"通常無蜂巢狀纖維化,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108100-88":{"quick":"肺膨脹不全最少見於急性肺炎(肺炎為實變、非塌陷)。","detail":{"background":"肺膨脹不全(atelectasis,肺塌陷)的常見原因:①「氣道阻塞(吸收性,黏液栓/腫瘤)」(A);②「肋膜腔積水/氣胸(壓迫性)」(B);③「肺泡表面張力素(surfactant)不足(如新生兒RDS)」(C)。而「急性肺炎」是肺泡腔被滲出物實變(consolidation),非肺塌陷(膨脹不全),故最少見於膨脹不全。故最少見者為急性肺炎。","options":{"A":"氣道阻塞致吸收性膨脹不全。","B":"肋膜腔積水致壓迫性膨脹不全。","C":"表面張力素不足致膨脹不全。","D":"急性肺炎為實變(非膨脹不全)—最少見(正解)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109020-87":{"quick":"肺淋巴瘤與石棉塵肺症較無關;纖維斑塊、肺癌、間皮瘤相關。","detail":{"background":"石棉(asbestos)暴露相關的疾病:①「肋膜纖維斑塊(fibrous/pleural plaque)」(A相關);②「肺(上皮)癌(與吸菸協同)」(C相關);③「間皮瘤(mesothelioma)(最特異)」(D相關)。而「肺淋巴瘤」與石棉塵肺症較無關。故較無關者為肺淋巴瘤。","options":{"A":"纖維(肋膜)斑塊與石棉相關。","B":"肺淋巴瘤與石棉較無關—正解。","C":"肺上皮癌與石棉相關。","D":"間皮瘤與石棉最相關。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109020-88":{"quick":"肺腺癌相對較常具有EGFR基因突變。","detail":{"background":"肺癌的表皮生長因子受體(EGFR)基因突變:腺癌(adenocarcinoma)相對其他型較常具有EGFR突變(尤其東亞不抽菸女性,可用EGFR-TKI(gefitinib等)標靶治療)。鱗狀細胞癌、小細胞癌、大細胞癌的EGFR突變較少。故EGFR突變較常見於腺癌。","options":{"A":"肺腺癌相對較常有EGFR突變—正解。","B":"鱗狀細胞癌EGFR突變較少。","C":"小細胞癌EGFR突變罕見。","D":"大細胞癌EGFR突變較少。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109100-88":{"quick":"類肉瘤(sarcoidosis)與吸菸較無相關;DIP、RB-ILD、肺癌與吸菸相關。","detail":{"background":"與吸菸相關的肺疾病:①「脫落性間質肺炎(DIP)」;②「呼吸小支氣管炎相關間質肺病(RB-ILD)」;③「肺癌」(及肺氣腫、慢性支氣管炎、Langerhans細胞組織球增生症)。而「類肉瘤(sarcoidosis)」與吸菸較無相關(甚至吸菸者發生率較低)。故較無關者為類肉瘤。","options":{"A":"脫落性間質肺炎與吸菸相關。","B":"RB-ILD與吸菸相關。","C":"類肉瘤與吸菸較無相關—正解。","D":"肺癌與吸菸相關。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_110020-79":{"quick":"鏈球菌較少引起壞死性腸炎;大葉性肺炎、猩紅熱、腎絲球腎炎與鏈球菌相關。","detail":{"background":"A群鏈球菌(Streptococcus)相關的病變:①「大葉性肺炎(肺炎鏈球菌)」(A);②「猩紅熱(化膿性鏈球菌外毒素)」(C);③「鏈球菌感染後腎絲球腎炎(免疫複合體)」(D)。而「壞死性腸炎」主要與產氣莢膜梭菌、新生兒NEC等相關,鏈球菌較少引起。故較少引起者為壞死性腸炎。","options":{"A":"大葉性肺炎與肺炎鏈球菌相關。","B":"壞死性腸炎與鏈球菌較少相關—正解。","C":"猩紅熱由化膿性鏈球菌外毒素致。","D":"鏈球菌感染後腎絲球腎炎相關。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_110020-82":{"quick":"乳白色混濁、含三酸甘油酯的胸水(乳糜胸),最可能因淋巴管阻塞。","detail":{"background":"本題胸水呈乳白色混濁、含三酸甘油酯(乳糜微粒)——為乳糜胸(chylothorax):因淋巴管(尤胸管thoracic duct)阻塞或破裂(常因腫瘤、外傷、淋巴管異常),使富含脂肪的淋巴液(乳糜)漏入胸膜腔。心衰竭、肺梗塞、下腔靜脈阻塞造成的是漏出液/血性/滲出液(非乳糜)。故為淋巴管阻塞。","options":{"A":"心臟衰竭致漏出性胸水(非乳糜)。","B":"淋巴管阻塞致乳糜胸—正解。","C":"肺梗塞致血性/滲出性胸水。","D":"下腔靜脈阻塞非乳糜胸。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_110020-87":{"quick":"破壞肺泡壁彈性纖維致肺氣腫的蛋白酶主要來自嗜中性白血球(elastase)。","detail":{"background":"肺氣腫(emphysema)的蛋白酶-抗蛋白酶失衡機制:香菸吸引中性球(與巨噬細胞)到肺,中性球釋放彈性蛋白酶(neutrophil elastase),破壞肺泡壁的彈性纖維(elastin)→肺泡壁破壞、氣腔擴大;α1-抗胰蛋白酶不足時更易發生。淋巴球、嗜酸性球、嗜鹼性球非主要來源。故主要來自嗜中性白血球。","options":{"A":"破壞彈性纖維的蛋白酶主要來自嗜中性白血球—正解。","B":"淋巴球非主要來源。","C":"嗜酸性白血球非主要來源。","D":"嗜鹼性白血球非主要來源。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_110020-88":{"quick":"原發性纖毛運動障礙較常引起支氣管擴張(本題A、B均給分)。","detail":{"background":"「原發性纖毛運動障礙(primary ciliary dyskinesia, Kartagener症候群)」因纖毛結構/運動異常→黏液纖毛清除失能,反覆呼吸道感染→支氣管擴張(bronchiectasis)(及慢性鼻竇炎、中耳炎、不孕、內臟轉位)。本題以支氣管擴張(B)為主(慢性支氣管炎A亦判給分)。氣喘、肺氣腫非典型。","options":{"A":"慢性支氣管炎(本題判給分)。","B":"原發性纖毛運動障礙較常引起支氣管擴張—正解。","C":"氣喘非典型。","D":"肺氣腫非典型。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111020-89":{"quick":"雙側胸膜積水(hydrothorax)最常見的原因為鬱血性心衰竭。","detail":{"background":"「雙側胸膜積水(hydrothorax,漏出液)」最常見原因是鬱血性心衰竭(congestive heart failure)——左心衰竭使肺微血管靜水壓升高→漏出液進入雙側胸膜腔。肺癌、惡性間皮瘤(多單側滲出液)、呼吸窘迫非雙側漏出性積水主因。故為鬱血性心衰竭。","options":{"A":"肺癌多致單側惡性積液。","B":"鬱血性心衰竭為雙側胸膜積水最常見原因—正解。","C":"惡性間皮瘤多單側。","D":"呼吸窘迫非雙側漏出積水主因。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111020-90":{"quick":"小細胞肺癌與抽菸關聯極強,「關聯性不大」錯誤。","detail":{"background":"小細胞肺癌(small cell carcinoma):①「與抽菸關聯極強(幾乎都見於吸菸者),故A關聯性不大錯誤」——A錯誤;②「通常發生於肺中央(中心)位置」(B正確);③「常表現神經內分泌標記(chromogranin、synaptophysin)」(C正確);④「早期即常有縱隔腔淋巴結轉移(就診多已擴散)」(D正確)。故A錯誤。","options":{"A":"小細胞肺癌與抽菸關聯極強(非不大)—錯誤(正解)。","B":"通常發生於肺中央,正確。","C":"常表現神經內分泌標記,正確。","D":"常有縱隔淋巴結轉移,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111020-91":{"quick":"引起急性呼吸窘迫症候群(ARDS)最常見的原因為肺炎(與敗血症)。","detail":{"background":"「急性呼吸窘迫症候群(ARDS)」的最常見原因是肺炎(pneumonia)與敗血症(sepsis)(直接與間接肺損傷)。外物吸入、外傷、輸血反應(TRALI)等也可致ARDS,但最常見仍為肺炎/敗血症。故最常見原因為肺炎。","options":{"A":"外物吸入可致ARDS但非最常見。","B":"外傷可致但非最常見。","C":"輸血反應(TRALI)非最常見。","D":"肺炎為ARDS最常見原因—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111100-86":{"quick":"肺水腫的心衰竭細胞源自巨噬細胞(非淋巴球),故A錯誤。","detail":{"background":"肺水腫(pulmonary edema):①「慢性肺鬱血(左心衰)時,肺泡內含鐵血黃素的巨噬細胞稱心衰竭細胞(heart failure cells),非源自淋巴球」——故A錯誤;②「可由肺泡壁微血管損傷(通透性)引起(如ARDS)」(B正確);③「可由肺部靜水壓升高(心因性)引起」(C正確);④「可繼發肺部感染」(D正確)。故A錯誤。","options":{"A":"心衰竭細胞源自巨噬細胞(非淋巴球)—錯誤(正解)。","B":"可由微血管損傷引起,正確。","C":"可由靜水壓升高引起,正確。","D":"可造成肺部感染,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111100-87":{"quick":"特發性肺纖維化(IPF)好發中老年(非小於50歲年輕人),故C錯誤。","detail":{"background":"特發性肺纖維化(IPF):①「常雙側下肺葉、胸膜下分布」(A正確);②「男性比女性常見」(B正確);③「好發中老年(>50-60歲),年輕人罕見,故C小於50歲年輕人居多錯誤」——C錯誤;④「後期可見蜂巢樣纖維化(honeycombing)(預後差,常進展至呼吸衰竭)」(D正確)。故C錯誤。","options":{"A":"常出現於雙側肺葉,正確。","B":"男性比女性常見,正確。","C":"IPF好發中老年(非小於50歲年輕人)—錯誤(正解)。","D":"後期見蜂巢樣纖維化,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112020-87":{"quick":"α1-抗胰蛋白酶缺乏症造成的肺氣腫多屬全腺泡型(panacinar)。","detail":{"background":"肺氣腫的型態:①「α1-抗胰蛋白酶缺乏症」——缺乏抗蛋白酶保護→彈性蛋白酶破壞整個腺泡,造成全腺泡型(panacinar)肺氣腫(好發下肺葉);②「抽菸」——多致中心型(centriacinar)肺氣腫(上肺葉)。故α1-抗胰蛋白酶缺乏為全腺泡型。","options":{"A":"α1-抗胰蛋白酶缺乏致全腺泡型肺氣腫—正解。","B":"中心型肺氣腫與抽菸相關。","C":"遠端腺泡型與自發性氣胸相關。","D":"不規則型與疤痕相關。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112020-88":{"quick":"肺泡玻璃樣膜(hyaline membrane)與急性呼吸窘迫症候群(ARDS)最相關。","detail":{"background":"「肺泡玻璃樣膜(hyaline membrane)」是瀰漫性肺泡傷害(DAD)的特徵,最相關於急性呼吸窘迫症候群(ARDS)(及新生兒呼吸窘迫症候群):肺泡上皮與內皮損傷、血漿蛋白與壞死碎屑沿肺泡壁形成嗜酸性玻璃樣膜。慢性支氣管炎、氣喘、肺氣腫的病變不同。故與ARDS最相關。","options":{"A":"慢性支氣管炎為黏液腺增生。","B":"氣喘為氣道過敏發炎。","C":"肺泡玻璃樣膜與ARDS最相關—正解。","D":"肺氣腫為肺泡壁破壞。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112100-86":{"quick":"45歲以下不抽菸年輕女性最常見的原發性肺癌為腺癌。","detail":{"background":"「45歲以下不抽菸的年輕女性」最常見的原發性肺癌是腺癌(adenocarcinoma)——腺癌與抽菸相關性相對較低,是不吸菸者、女性、年輕族群最常見的肺癌型(常帶EGFR、ALK等可標靶的驅動突變)。鱗狀細胞癌、小細胞癌與吸菸強相關。故為腺癌。","options":{"A":"鱗狀細胞癌與吸菸強相關。","B":"不吸菸年輕女性最常見肺癌為腺癌—正解。","C":"小細胞癌與吸菸強相關。","D":"大細胞癌較少見。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112100-87":{"quick":"急性呼吸窘迫症候群(ARDS)屬限制性,不屬瀰漫性阻塞性肺疾病。","detail":{"background":"「瀰漫性阻塞性肺疾病(obstructive lung disease)」(呼氣氣流受阻)包括:肺氣腫(emphysema)、慢性支氣管炎、支氣管擴張(bronchiectasis)、氣喘。而「急性呼吸窘迫症候群(ARDS)」是限制性(restrictive)肺疾病(肺硬、容積減少),不屬阻塞性疾病。故不屬阻塞性者為ARDS。","options":{"A":"肺氣腫屬阻塞性肺疾病。","B":"慢性支氣管炎屬阻塞性。","C":"支氣管擴張屬阻塞性。","D":"ARDS屬限制性、非阻塞性—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112100-88":{"quick":"(過敏型)氣喘屬第一型過敏反應(非第二型),故B最不適當。","detail":{"background":"氣喘(asthma):①「與第二型輔助T細胞(Th2)活化有關(分泌IL-4/5/13)」(A正確);②「(過敏/外因型)氣喘屬第I型(IgE媒介的立即型)過敏反應,而非第II型」——故B最不適當;③「可見嗜酸性白血球增加」(C正確);④「支氣管黏液中可見庫許曼螺旋(Curschmann spirals)、夏柯-萊登結晶」(D正確)。故B最不適當。","options":{"A":"與Th2細胞活化有關,正確。","B":"氣喘屬第一型過敏(非第二型)—錯誤(正解)。","C":"可見嗜酸性白血球增加,正確。","D":"黏液中有Curschmann spirals,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_113090-80":{"quick":"畸胎瘤與鎘中毒相關性較低;肺癌、骨質疏鬆、腎損傷與鎘相關。","detail":{"background":"鎘(cadmium)中毒相關:①「肺癌(吸入鎘煙塵,IARC第1類致癌物)」(A相關);②「骨質疏鬆/骨軟化(痛痛病itai-itai,干擾鈣與維生素D)」(B相關);③「腎損傷(近曲小管,蛋白尿)」(D相關)。而「畸胎瘤(teratoma)」與鎘中毒相關性較低(畸胎瘤為生殖細胞腫瘤,與鎘無明確關聯)。故相關性較低者為畸胎瘤。","options":{"A":"肺癌與鎘相關。","B":"骨質疏鬆(痛痛病)與鎘相關。","C":"畸胎瘤與鎘中毒相關性較低—正解。","D":"腎損傷與鎘相關。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114020-87":{"quick":"IPF的CT為周邊胸膜下/下肺葉蜂巢樣,「中央小葉型結節」錯誤。","detail":{"background":"特發性肺纖維化(IPF):①「臨床慢性漸進性纖維化間質性肺炎,常進展至呼吸衰竭」(A正確);②「好發中老年,年輕人罕見」(B正確);③「纖維化常以下肺葉較嚴重」(C正確);④「胸部CT典型為周邊(胸膜下)、下肺葉的網狀、牽引性支氣管擴張與蜂巢樣纖維化,而非中央小葉型結節(centrilobular nodules)(後者見於過敏性肺炎、RB-ILD)」——故D錯誤。故D錯誤。","options":{"A":"臨床為慢性漸進性間質性肺炎,正確。","B":"好發中老年,正確。","C":"纖維化常下肺葉較嚴重,正確。","D":"IPF CT為周邊胸膜下蜂巢樣(非中央小葉型結節)—錯誤(正解)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114020-88":{"quick":"社區型細菌性肺炎最常見的病原為肺炎鏈球菌(Streptococcus pneumoniae)。","detail":{"background":"「社區型(社區獲得性)細菌性肺炎」最常見的病原是肺炎鏈球菌(Streptococcus pneumoniae)(典型大葉性肺炎的主因)。嗜血流感桿菌、金黃葡萄球菌、克雷伯氏菌為其他較少見或特定族群(慢性肺病、流感後、酒癮)的病原。故最常見為肺炎鏈球菌。","options":{"A":"社區型細菌性肺炎最常見為肺炎鏈球菌—正解。","B":"嗜血流感桿菌較常見於慢性肺病者。","C":"金黃葡萄球菌常見於流感後。","D":"克雷伯氏菌常見於酒癮者。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114090-88":{"quick":"矽肺病停止接觸矽塵後仍持續進展(不可逆),「肺功能逐漸恢復」錯誤。","detail":{"background":"塵肺病(pneumoconiosis):①「成因可為無機或有機物,多與職業/工作環境有關」(A正確);②「矽肺病為最常見塵肺病,吸入二氧化矽(silica),結節多在上肺葉」(B正確);③「矽肺病即使停止接觸矽塵仍持續進展(不可逆纖維化),肺功能不會逐漸恢復,故C逐漸恢復錯誤」——C錯誤;④「矽結節有嚴重纖維化與漩渦狀膠原(whorled collagen),偏光下見雙折射矽晶」(D正確)。故C錯誤。","options":{"A":"成因多與職業環境有關,正確。","B":"矽肺病結節多在上肺葉,正確。","C":"矽肺病停止接觸後仍進展(非逐漸恢復)—錯誤(正解)。","D":"矽結節有漩渦狀膠原、偏光下雙折射,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_115020-90":{"quick":"叢狀病灶(plexiform lesion)是肺高壓晚期(嚴重)的病理特徵,「早期出現」錯誤。","detail":{"background":"肺高壓(pulmonary hypertension):①「左心衰竭可造成肺靜脈/動脈高壓」(A正確);②「間質性肺病(缺氧)可造成肺高壓」(B正確);③「從主肺動脈到小動脈都受影響,出現中膜肥厚(medial hypertrophy)、內膜纖維化」(C正確);④「叢狀病灶(plexiform lesion)是肺高壓晚期(嚴重、不可逆)的病理特徵,而非早期出現」——故D錯誤。故D錯誤。","options":{"A":"左心衰竭可造成肺高壓,正確。","B":"間質性肺病可造成肺高壓,正確。","C":"主肺動脈到小動脈出現中膜肥厚與內膜纖維化,正確。","D":"叢狀病灶為晚期(非早期)病理特徵—錯誤(正解)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_115020-91":{"quick":"大葉性肺炎四期為充血→紅色肝變→灰色肝變→消散,B的順序敘述有誤。","detail":{"background":"細菌性肺炎:①「可造成支氣管肺炎(斑塊狀)或大葉性肺炎(整葉實變)」(A正確);②「大葉性肺炎病理依序分為充血期(congestion)→紅色肝變期(red hepatization)→灰色肝變期(gray hepatization)→消散期(resolution),題B的分期順序敘述有誤」——B錯誤;③「肺炎鏈球菌、嗜血流感桿菌等為常見社區病原」(C正確);④「綠膿桿菌(Pseudomonas)常見於院內感染肺炎」(D正確)。故B(順序錯誤)為答案。","options":{"A":"可造成支氣管肺炎或大葉性肺炎,正確。","B":"大葉性肺炎四期順序敘述有誤(應充血→紅肝變→灰肝變→消散)—錯誤(正解)。","C":"肺炎鏈球菌等為社區病原,正確。","D":"綠膿桿菌常見於院內感染肺炎,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_115020-92":{"quick":"過度換氣與支氣管擴張症相關性較低;膿痰、重度咳嗽、咳血相關。","detail":{"background":"支氣管擴張症(bronchiectasis):①「慢性咳嗽咳大量膿痰(mucopurulent sputum)」(A相關);②「重度持續咳嗽」(B相關);③「咳血(hemoptysis,擴張支氣管血管破裂)」(C相關)。而「過度換氣(hyperventilation)」與支氣管擴張症相關性較低(支氣管擴張以慢性化膿性咳嗽咳痰為主,非過度換氣)。故相關性較低者為過度換氣。","options":{"A":"膿痰與支氣管擴張相關。","B":"重度持續咳嗽相關。","C":"咳血相關。","D":"過度換氣與支氣管擴張相關性較低—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_115020-95":{"quick":"非ACTH依賴型庫欣氏症候群最常見的原因為腎上腺皮質腺瘤。","detail":{"background":"庫欣氏症候群(Cushing syndrome):①「ACTH依賴型」——腦下垂體腺瘤(庫欣病)、異位ACTH(小細胞肺癌);②「非ACTH依賴(ACTH-independent)型」——腎上腺本身自主分泌皮質醇,最常見原因是腎上腺皮質腺瘤(adrenocortical adenoma)(其次腺癌、結節性增生)。故非ACTH依賴型最常見為腎上腺皮質腺瘤。","options":{"A":"小細胞肺癌為異位ACTH(ACTH依賴型)。","B":"非ACTH依賴型最常見為腎上腺皮質腺瘤—正解。","C":"腎上腺皮質癌較少見。","D":"原發性皮質增生較少見。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_106100-90":{"quick":"腸胃道基質瘤(GIST)最常見的突變基因是c-KIT。","detail":{"background":"「腸胃道基質瘤(GIST)」源自腸壁的Cajal間質細胞,最常見的突變基因是c-KIT(CD117,約75-80%)(其次PDGFRA),致酪胺酸激酶持續活化。免疫染色CD117(KIT)陽性,可用imatinib(KIT/PDGFRA抑制劑)標靶治療。KRAS、BRAF、Her2/Neu非GIST主要突變。故為c-KIT。","options":{"A":"KRAS非GIST主要突變。","B":"GIST最常見突變為c-KIT—正解。","C":"BRAF非GIST主要突變。","D":"Her2/Neu非GIST突變。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_107100-87":{"quick":"Barrett食道是腸上皮化生(杯狀細胞),非出現壁細胞與主細胞,故D錯誤。","detail":{"background":"巴雷特氏食道(Barrett esophagus):①「是逆流性食道炎的併發症(慢性胃酸刺激)」(A正確);②「好發白人男性」(B正確);③「是食道腺癌的危險因子(癌前)」(C正確);④「組織學特徵是食道下端鱗狀上皮被含杯狀細胞(goblet cell)的腸上皮化生取代,而非出現胃底腺的壁細胞與主細胞」——故D錯誤。故D錯誤。","options":{"A":"為逆流性食道炎的併發症,正確。","B":"好發白人男性,正確。","C":"為食道腺癌危險因子,正確。","D":"Barrett為腸上皮化生(杯狀細胞)、非壁/主細胞—錯誤(正解)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_107100-88":{"quick":"中央星狀疤痕是局部結節性增生(FNH)的特徵,非結節性再生性增生,故B錯誤。","detail":{"background":"肝臟疾病:①「黃麴毒素是肝細胞癌的危險因子(TP53突變)」(A正確);②「中央星狀疤痕(central stellate scar)是局部結節性增生(focal nodular hyperplasia, FNH)的特徵,而非結節性再生性增生(nodular regenerative hyperplasia, NRH)」——故B錯誤;③「肝腺瘤可能破裂、造成腹腔內出血」(C正確);④「肝母細胞瘤可出現間質(mesenchymal)分化」(D正確)。故B錯誤。","options":{"A":"黃麴毒素為肝細胞癌危險因子,正確。","B":"中央星狀疤痕為FNH特徵(非NRH)—錯誤(正解)。","C":"肝腺瘤可能破裂出血,正確。","D":"肝母細胞瘤可出現間質分化,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_107100-89":{"quick":"生產過程母嬰垂直傳染最常見的肝炎病毒為B型。","detail":{"background":"肝炎病毒的母嬰(垂直)傳染:B型肝炎(HBV)是經生產過程母嬰垂直傳染最常見(尤母親e抗原陽性傳染力高,故新生兒須接種疫苗與免疫球蛋白)。A型(糞口)、C型(血液,垂直傳染率較低)、D型(需HBV)。故母嬰傳染最常見為B型。","options":{"A":"A型為糞口傳染。","B":"B型肝炎為母嬰垂直傳染最常見—正解。","C":"C型垂直傳染率較低。","D":"D型需合併HBV。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108030-89":{"quick":"旅行者肝炎、孕婦感染近20%死亡率的肝炎病毒為E型。","detail":{"background":"「E型肝炎病毒(HEV)」經糞口(污染水)傳染,是開發中國家旅行者肝炎的元凶,且孕婦(尤第三孕期)感染死亡率高(近20%,猛爆性肝炎)。A型(糞口但孕婦死亡率不高)、B型、D型(血液/體液)的特性不同。故為E型。","options":{"A":"A型肝炎孕婦死亡率不高。","B":"B型為血液/體液傳染。","C":"D型需合併HBV。","D":"E型(糞口、孕婦死亡率近20%)—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108030-90":{"quick":"纖維薄層型肝細胞癌好發於無肝硬化的正常背景肝,「背景已嚴重纖維化/肝硬化」錯誤。","detail":{"background":"纖維薄層型肝細胞癌(fibrolamellar carcinoma):①「好發年輕人(20-40歲)」(A正確);②「背景肝通常正常(無肝硬化/慢性肝病),故B背景已嚴重纖維化/肝硬化錯誤」——B錯誤;③「腫瘤細胞為含多量粒線體的嗜酸性大細胞(oncocyte),由緻密纖維帶分隔(板層狀)」(C正確);④「預後相對較好(可手術切除、無肝硬化)」(D正確)。故B錯誤。","options":{"A":"好發年輕人,正確。","B":"背景肝通常正常(非肝硬化)—錯誤(正解)。","C":"細胞為含多粒線體的oncocyte、由纖維帶分隔,正確。","D":"預後較好,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108030-91":{"quick":"僅少數潰瘍性結腸炎合併原發性硬化性膽管炎,「大部分(>50%)」錯誤。","detail":{"background":"潰瘍性結腸炎(UC):①「僅少數(非>50%)UC病人合併原發性硬化性膽管炎(PSC)(反之約70%的PSC病人有UC),故A大部分>50%錯誤」——A錯誤;②「可見假性息肉(pseudopolyps),嚴重時毒性巨結腸」(B正確);③「通常侵犯直腸並向近端連續延伸(連續性)」(C正確);④「發炎侷限於黏膜層與表淺黏膜下層(非全壁)」(D正確)。故A錯誤。","options":{"A":"僅少數UC合併PSC(非大部分>50%)—錯誤(正解)。","B":"可見假性息肉、毒性巨結腸,正確。","C":"侵犯直腸並向近端連續延伸,正確。","D":"發炎侷限黏膜層及表淺黏膜下,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108100-89":{"quick":"酒精性肝炎的纖維化由中央靜脈周圍開始(非portal area),故C錯誤。","detail":{"background":"酒精性肝炎:①「AST/ALT比值常>2(AST高於ALT約兩倍以上)」(A正確);②「典型肝脂肪堆積、Mallory-Denk小體(角蛋白)、中性球浸潤」(B正確);③「纖維化典型由中央靜脈周圍(perivenular/central vein)開始,再向門脈區延伸(而非由portal area開始)」——故C錯誤;④「女性似乎比男性更易受酒精肝損傷(性別差異)」(D正確)。故C錯誤。","options":{"A":"AST約為ALT兩倍以上,正確。","B":"可見脂肪、Mallory-Denk小體、中性球,正確。","C":"纖維化由中央靜脈周圍開始(非portal area)—錯誤(正解)。","D":"女性較男性易受肝損傷,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109020-76":{"quick":"黃瘤(xanthoma)中泡沫細胞堆積的物質為膽固醇。","detail":{"background":"「黃瘤(xanthoma)」病灶中的泡沫細胞(foam cell)是吞噬脂質(尤膽固醇與膽固醇酯)的巨噬細胞(細胞質呈泡沫狀)。常見於高血脂、家族性高膽固醇血症。磷酸鈣(鈣化)、Mallory-Denk body(肝)、尿酸(痛風)非泡沫細胞內容物。故為膽固醇。","options":{"A":"磷酸鈣為鈣化沉積。","B":"泡沫細胞堆積膽固醇—正解。","C":"Mallory-Denk body見於肝。","D":"尿酸見於痛風石。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109020-89":{"quick":"原發性硬化性膽管炎(PSC)好發男性(非女性),故D錯誤。","detail":{"background":"原發性硬化性膽管炎(PSC):①「肝內外膽管閉塞性纖維化(洋蔥皮樣)與節段性擴張(串珠樣)」(A正確);②「與HLA-B8、DR3相關」(B正確);③「常伴隨發炎性腸病(尤潰瘍性結腸炎)」(C正確);④「好發男性(非女性),故D女性較男性多錯誤」——D錯誤(出現疲勞、搔癢、黃疸正確,但性別寫反)。故D錯誤。(對照:原發性膽汁性膽管炎PBC才好發女性。)","options":{"A":"膽管閉塞性纖維化與節段性擴張,正確。","B":"與HLA-B8相關,正確。","C":"常伴隨發炎性腸病,正確。","D":"PSC好發男性(非女性較多)—錯誤(正解)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109020-91":{"quick":"口腔病灶中紅斑(erythroplakia)最容易演變為鱗狀細胞癌。","detail":{"background":"口腔癌前病變:①「紅斑(erythroplakia)」——惡性潛能最高(大多已是嚴重異生/原位癌),最容易演變鱗狀細胞癌;②「白斑(leukoplakia)」——惡性潛能較低(少數轉惡)。毛狀白斑(EBV,免疫低下,非癌前)、口瘡性潰瘍(良性)非癌前。故最易變鱗癌者為紅斑。","options":{"A":"白斑惡性潛能較低。","B":"紅斑最容易演變鱗狀細胞癌—正解。","C":"毛狀白斑(EBV)非癌前。","D":"口瘡性潰瘍為良性。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109100-89":{"quick":"D型肝炎病毒(HDV)複製需要B型肝炎病毒(提供HBsAg)。","detail":{"background":"「D型肝炎病毒(HDV)」是缺陷病毒(delta agent):其外殼需要B型肝炎病毒(HBV)的表面抗原(HBsAg),故HDV只能在HBV感染存在下複製與致病(同時或重疊感染)。A、C、E型肝炎病毒非HDV所需。故為B型肝炎病毒。","options":{"A":"A型肝炎非HDV所需。","B":"HDV複製需B型肝炎(HBsAg)—正解。","C":"C型肝炎非HDV所需。","D":"E型肝炎非HDV所需。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109100-91":{"quick":"急性非結石性膽囊炎主要風險因子非喝酒(為重症/敗血/缺血/禁食),故D錯誤。","detail":{"background":"急性膽囊炎:①「約90%為急性結石性膽囊炎(因膽囊頸/膽囊管阻塞)」(A正確);②「前列腺素釋放參與發炎」(B正確);③「急性非結石性膽囊炎主要與缺血(膽囊缺血)有關」(C正確);④「急性非結石性膽囊炎的主要風險因子是重症(敗血症、嚴重外傷/燒傷、術後、長期禁食/TPN),而非喝酒」——故D「主要風險因子包括敗血症及喝酒」中的喝酒不準(D為較不正確)。故D錯誤。","options":{"A":"約90%為結石性膽囊炎,正確。","B":"前列腺素釋放與發炎有關,正確。","C":"非結石性膽囊炎與缺血有關,正確。","D":"非結石性膽囊炎風險為重症(非喝酒)—錯誤(正解)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_110020-89":{"quick":"B型肝炎病毒為DNA病毒;A、C、D型為RNA病毒。","detail":{"background":"肝炎病毒的核酸:①「B型肝炎病毒(HBV)」——唯一的DNA病毒(部分雙股DNA,複製經反轉錄);②「A型(RNA)、C型(RNA)、D型(RNA,缺陷)、E型(RNA)」——皆為RNA病毒。故DNA病毒者為B型肝炎病毒。","options":{"A":"A型為RNA病毒。","B":"B型肝炎為DNA病毒—正解。","C":"C型為RNA病毒。","D":"D型為RNA病毒。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_110020-90":{"quick":"偽膜性腸炎診斷靠毒素檢測/PCR(非細菌培養),故D錯誤。","detail":{"background":"偽膜性腸炎(pseudomembranous colitis):①「與抗生素使用有關(破壞正常腸道菌叢)」(A正確);②「通常由艱難梭菌(Clostridioides difficile)引起(毒素A/B)」(B正確);③「鏡下偽膜由破壞的腺體、黏蛋白與大量嗜中性白血球(火山噴發樣)組成」(C正確);④「診斷靠糞便毒素檢測(EIA)或毒素基因PCR,而非常規細菌培養(因正常人腸道亦可帶菌)」——故D錯誤。故D錯誤。","options":{"A":"與抗生素使用有關,正確。","B":"由艱難梭菌引起,正確。","C":"偽膜由破壞腺體/黏蛋白/中性球組成,正確。","D":"診斷靠毒素檢測/PCR(非細菌培養)—錯誤(正解)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_110020-91":{"quick":"瀰漫性型胃癌比腸型預後較差(非較好),故C錯誤。","detail":{"background":"胃癌:①「發生率地域差異(日本高於北美)」(A正確);②「家族性瀰漫型胃癌與腫瘤抑制基因CDH1(E-cadherin)突變密切相關」(B正確);③「瀰漫性型(印戒細胞,皮革胃)胃癌預後較腸型胃癌差(而非較好)」——故C錯誤;④「IL-1β、TNF、IL-10、IL-8、TLR4等基因變異與幽門桿菌胃炎相關胃癌風險升高」(D正確)。故C錯誤。","options":{"A":"胃癌發生率有地域差異(日本高),正確。","B":"家族性胃癌與CDH1突變相關,正確。","C":"瀰漫性型胃癌預後較腸型差(非較好)—錯誤(正解)。","D":"發炎相關基因變異升高胃癌風險,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111020-92":{"quick":"胃底腺息肉與幽門桿菌最無直接關係(與PPI使用相關)。","detail":{"background":"與幽門螺旋桿菌(H. pylori)相關的胃病:①「慢性消化性潰瘍」;②「胃(腸型)上皮癌」;③「胃MALT淋巴瘤(根除H. pylori可緩解)」。而「胃底腺息肉(fundic gland polyp)」與H. pylori最無直接關係(常與長期使用質子幫浦抑制劑(PPI)相關,且H. pylori感染者反而較少見胃底腺息肉)。故最無關者為胃底腺息肉。","options":{"A":"胃底腺息肉與H. pylori最無關(與PPI相關)—正解。","B":"慢性消化性潰瘍與H. pylori相關。","C":"胃上皮癌與H. pylori相關。","D":"胃MALT淋巴瘤與H. pylori相關。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111020-93":{"quick":"跳躍式病灶是克隆氏症(非潰瘍性結腸炎)的特徵,故C錯誤。","detail":{"background":"發炎性腸病(IBD):①「克隆氏症又稱區域性腸炎(regional enteritis)」(A正確);②「克隆氏症為全壁性(透壁)發炎(可致瘻管、狹窄)」(B正確);③「跳躍式病灶(skip lesions)是克隆氏症的特徵,而潰瘍性結腸炎是連續性病灶(由直腸向近端),故C跳躍式病灶是UC特徵錯誤」——C錯誤;④「潰瘍性結腸炎病人罹患大腸癌機會比正常人高」(D正確)。故C錯誤。","options":{"A":"克隆氏症又稱區域性腸炎,正確。","B":"克隆氏症為全壁性發炎,正確。","C":"跳躍式病灶為克隆氏症特徵(非UC)—錯誤(正解)。","D":"UC病人大腸癌風險較高,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111020-94":{"quick":"酗酒者上腹痛放射後背、amylase/lipase升、低血鈣,最可能為急性胰臟出血性壞死。","detail":{"background":"本題酗酒男性、上腹痛放射後背、血清澱粉酶與脂肪酶升高、低血鈣——典型為急性胰臟炎(尤出血性壞死型):胰酶自我消化胰臟組織與血管→胰臟出血性壞死,脂肪壞死皂化消耗鈣→低血鈣。心臟壞死、胃潰瘍穿孔、肝壞死的酶學/情境不符。故為胰臟出血性壞死。","options":{"A":"胰臟出血性壞死(酗酒、amylase/lipase升、低血鈣)—正解。","B":"心臟廣泛壞死非此酶學表現。","C":"胃潰瘍穿孔非此酶學表現。","D":"肝臟大塊壞死非此。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111020-96":{"quick":"典型溶血性尿毒症最常見致病菌為大腸桿菌O157:H7。","detail":{"background":"「典型溶血性尿毒症候群(typical HUS)」(尤兒童)最常見的致病菌是產志賀樣毒素(Shiga-like toxin)的大腸桿菌O157:H7(腸出血性大腸桿菌EHEC)——毒素損傷腎與全身微血管內皮→微血管病性溶血性貧血、血小板低下、急性腎損傷(三聯徵)。A群鏈球菌、b型嗜血桿菌、草綠色鏈球菌非HUS病因。故為大腸桿菌O157:H7。","options":{"A":"A群鏈球菌致猩紅熱/腎炎(非HUS)。","B":"大腸桿菌O157:H7為典型HUS最常見致病菌—正解。","C":"b型嗜血桿菌致腦膜炎/會厭炎。","D":"草綠色鏈球菌致心內膜炎。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111100-76":{"quick":"潰瘍性大腸炎的典型病理最不可能是肉芽腫性發炎(肉芽腫見於克隆氏症)。","detail":{"background":"肉芽腫性發炎的典型疾病:①「痲瘋(類結核型)」;②「類肉瘤(非乾酪性肉芽腫)」;④「結核(乾酪性肉芽腫)」。而「潰瘍性大腸炎(UC)」的發炎侷限黏膜層、非肉芽腫性(肉芽腫見於克隆氏症,非UC)。故最不可能肉芽腫者為潰瘍性大腸炎。","options":{"A":"痲瘋有肉芽腫。","B":"類肉瘤為非乾酪性肉芽腫。","C":"潰瘍性大腸炎最不可能肉芽腫(肉芽腫見於克隆氏症)—正解。","D":"結核為乾酪性肉芽腫。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111100-77":{"quick":"膀胱本就是移行上皮,「膀胱上皮被移行上皮取代」不是化生。","detail":{"background":"化生(metaplasia,一種分化細胞被另一種分化細胞取代)的例子:①「抽菸→支氣管纖毛柱狀上皮被鱗狀上皮取代(鱗狀化生)」(A是化生);②「胃食道逆流→食道鱗狀上皮被柱狀(腸)上皮取代(Barrett)」(B是化生);④「酸性環境→子宮內頸柱狀上皮被鱗狀上皮取代」(D是化生)。而「膀胱感染時膀胱上皮被移行上皮取代」——膀胱本身就是移行(尿路)上皮,沒有被不同型態取代,故不是化生。故不是化生者為C。","options":{"A":"支氣管鱗狀化生為化生。","B":"食道腸上皮化生(Barrett)為化生。","C":"膀胱本就是移行上皮、非化生—正解(不是)。","D":"子宮內頸鱗狀化生為化生。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111100-81":{"quick":"APC基因與遺傳性非息肉病大腸癌(HNPCC)較無關(APC與FAP有關)。","detail":{"background":"「遺傳性非息肉病大腸癌(HNPCC, Lynch症候群)」是DNA錯配修復(mismatch repair)基因突變(致微衛星不穩定MSI):相關基因為MSH2、MSH6、MLH1、PMS2。而「APC基因」是家族性腺瘤性息肉病(FAP)的致病基因,與HNPCC較無關。故較無關者為APC。","options":{"A":"MSH2為HNPCC相關錯配修復基因。","B":"MSH6為HNPCC相關。","C":"APC與FAP相關、與HNPCC較無關—正解。","D":"MLH1為HNPCC相關。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111100-85":{"quick":"12歲迴盲區腫瘤腸套疊、中等淋巴球與星空樣巨噬細胞,為Burkitt淋巴瘤(MYC)。","detail":{"background":"本題12歲男孩、迴盲區腫瘤致腸套疊、瀰漫中等大小淋巴球、散布巨噬細胞形成星空(starry-sky)樣——典型為Burkitt淋巴瘤(地方外/散發型):與MYC基因轉位t(8;14)(MYC-IgH)相關,增殖極快、星空現象(巨噬細胞吞噬凋亡腫瘤細胞),好發兒童迴盲部。ALK(間變性大細胞)、BCL2(濾泡)、BCL6(瀰漫大B)非Burkitt。故為MYC。","options":{"A":"Burkitt淋巴瘤與MYC基因相關—正解。","B":"ALK見於間變性大細胞淋巴瘤。","C":"BCL2見於濾泡性淋巴瘤。","D":"BCL6見於瀰漫大B細胞淋巴瘤。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111100-90":{"quick":"α1-抗胰蛋白酶缺乏的肝細胞球狀內含物為PAS陽性且diastase抗性,A的敘述被判為錯誤。","detail":{"background":"α1-抗胰蛋白酶缺乏症:①「肝細胞內有圓形胞質球狀內含物,染色為PAS陽性且diastase抗性(resistant)(異常α1-AT蛋白堆積於內質網);本題以A的敘述被判為錯誤(其對球狀內含物的PAS/diastase性質或位置描述有誤)」——故A錯誤;②「最常見突變PiZ,PiZZ同合子血中α1-AT明顯降低」(B正確);③「可以新生兒肝炎表現,發展為膽汁鬱積、壞死、慢性肝炎/肝硬化」(C正確);④「與肺氣腫相關(全腺泡型)」(D正確)。故A為被判錯誤者。","options":{"A":"α1-AT球狀內含物應為PAS陽性且diastase抗性(本題判A敘述有誤)—正解。","B":"最常見突變PiZ、PiZZ血中α1-AT明顯降低,正確。","C":"可表現為新生兒肝炎、發展為慢性肝病,正確。","D":"與肺氣腫相關,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111100-91":{"quick":"增生性息肉(hyperplastic polyp)與大腸癌風險最無關。","detail":{"background":"與大腸癌風險相關的息肉/症候群:①「絨毛狀腺瘤(villous adenoma)」(腺瘤性,惡性潛能高);②「家族性腺瘤樣息肉症(FAP)」(幾乎100%癌變);③「青少年息肉症候群(juvenile polyposis)」(增加風險)。而「增生性息肉(hyperplastic polyp)」是非腫瘤性(最常見的良性息肉),與大腸癌風險最無關(無/極低惡性潛能;但須與無柄鋸齒狀病變區別)。故最無關者為增生性息肉。","options":{"A":"絨毛狀腺瘤惡性潛能高。","B":"增生性息肉與大腸癌風險最無關—正解。","C":"家族性腺瘤樣息肉症幾乎100%癌變。","D":"青少年息肉症候群增加風險。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112020-77":{"quick":"肝臟的再生能力最強。","detail":{"background":"組織的再生能力:①「肝(穩定/不穩定細胞)」——再生能力最強(部分切除後可再生增大);②「神經、心肌、骨骼肌(永久細胞)」——幾乎無再生(以纖維化修復);③肺、胰再生能力有限。故再生能力最強者為肝。","options":{"A":"肺再生能力有限。","B":"肌肉(骨骼肌/心肌)再生能力差。","C":"胰再生能力有限。","D":"肝臟再生能力最強—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112020-79":{"quick":"全身過敏性反應的臨床症狀與活化的肥大細胞釋放介質有關,D最適當。","detail":{"background":"過敏疾病:①「鼻瘜肉一般非IgE媒介的外因性過敏(多為慢性發炎/非過敏性)」(故A錯誤);②「運動引發的過敏非單純Th2過度反應(機制複雜)」(故B不準);③「發炎性腸道疾病主要與Th1/Th17(非Th2)有關」(故C錯誤);④「全身過敏性反應(anaphylaxis)的臨床症狀與被活化的肥大細胞(釋放組織胺等介質)有關(IgE媒介第I型)」(D正確)。故D最適當。","options":{"A":"鼻瘜肉非IgE媒介外因性過敏—錯誤。","B":"運動引發過敏非單純Th2—不準。","C":"IBD與Th1/Th17相關(非Th2)—錯誤。","D":"全身過敏反應與活化肥大細胞釋放介質有關—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112020-81":{"quick":"細菌性腹膜炎的腹水為滲出液(蛋白濃度最高)。","detail":{"background":"腹水(ascites)依機制分:①「滲出液(exudate,高蛋白)」——細菌性腹膜炎(發炎、血管通透性增加)蛋白濃度最高;②「漏出液(transudate,低蛋白)」——肝硬化(門脈高壓+低白蛋白)、腎病症候群(蛋白流失)、營養不良(低白蛋白)(滲透壓下降致漏出,蛋白低)。故蛋白濃度最高者為細菌性腹膜炎。","options":{"A":"細菌性腹膜炎腹水為滲出液(高蛋白)—正解。","B":"腎病症候群為漏出液(低蛋白)。","C":"肝硬化為漏出液(低蛋白)。","D":"營養不良為漏出液(低蛋白)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112020-89":{"quick":"胰臟癌最常見為管腺癌(非腺泡細胞癌),故A最不適當。","detail":{"background":"胰臟癌:①「胰臟癌最常見型是管腺癌(ductal adenocarcinoma,>85%),而非腺泡細胞癌(acinar cell carcinoma,少見),故A腺泡細胞癌最常見最不適當」——A錯誤;②「管腺癌預後不良(多晚期發現)」(B正確);③「管腺癌常見CDKN2A失活、KRAS突變(及TP53、SMAD4)」(C正確);④「大部分管腺癌發生在胰臟頭部」(D正確)。故A最不適當。","options":{"A":"最常見為管腺癌(非腺泡細胞癌)—錯誤(正解)。","B":"管腺癌預後不良,正確。","C":"常見CDKN2A失活與KRAS突變,正確。","D":"大部分發生在胰臟頭部,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112020-90":{"quick":"口咽(oropharynx)的鱗狀細胞癌與人類乳突瘤病毒(HPV)最為相關。","detail":{"background":"頭頸部鱗狀細胞癌與HPV:口咽(oropharynx,尤扁桃腺、舌根)的鱗狀細胞癌與高危險型HPV(尤HPV-16)最為相關(HPV相關口咽癌預後較好、好發較年輕、非吸菸者)。牙齦、頰黏膜、食道的鱗癌主要與菸酒檳榔相關(非HPV)。故與HPV最相關者為口咽。","options":{"A":"牙齦鱗癌主要與菸酒檳榔相關。","B":"頰黏膜鱗癌與菸酒檳榔相關。","C":"口咽鱗癌與HPV最相關—正解。","D":"食道鱗癌與菸酒相關。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112020-91":{"quick":"威爾森氏病診斷中,血清總銅濃度的診斷價值最低。","detail":{"background":"威爾森氏病(Wilson disease,銅代謝異常):診斷依據包括血清胼蛋白(ceruloplasmin)降低、24小時尿銅升高、肝銅含量升高(肝切片)、Kayser-Fleischer環。而「血清總銅離子濃度」診斷價值最低——因血清總銅隨胼蛋白下降而下降,但游離(非胼蛋白結合)銅可能升高,故單看血清總銅不可靠。故診斷價值最低者為血清銅離子濃度。","options":{"A":"血清銅離子濃度診斷價值最低—正解。","B":"血清胼蛋白降低有診斷價值。","C":"尿銅升高有診斷價值。","D":"肝銅含量升高有診斷價值。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112100-89":{"quick":"低血鈣不是急性胰臟炎的原因(高血鈣才是);酗酒、胰管阻塞、高三酸甘油酯才是。","detail":{"background":"急性胰臟炎的常見原因(GET SMASHED):膽石(Gallstones)、酒精(Ethanol/酗酒)、胰管阻塞(腫瘤/結石)、高三酸甘油酯血症、高血鈣(Hypercalcemia)、ERCP後、藥物、外傷、感染。而「低血鈣」不是急性胰臟炎的原因(反而胰臟炎可繼發低血鈣,因脂肪壞死皂化消耗鈣);致病的是高血鈣。故不是原因者為低血鈣。","options":{"A":"酗酒為急性胰臟炎常見原因。","B":"胰管阻塞為原因。","C":"高三酸甘油脂血症為原因。","D":"低血鈣非原因(高血鈣才是)—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_113090-76":{"quick":"跌倒2週後瘀青處的黃棕色色素為血鐵素(hemosiderin)。","detail":{"background":"瘀青(出血)後,紅血球被巨噬細胞分解,血紅素轉化:早期紅→紫(血紅素)→數天綠(膽綠素)→1-2週後黃棕色(含鐵的血鐵素(hemosiderin,含鐵血黃素)與膽紅素)。本題跌倒2週後瘀青黃棕色色素,最可能為血鐵素(含鐵,普魯士藍染色陽性)。脂褐素(老化)、膽紅素(黃疸)、黑色素(黑色)非此。故為血鐵素。","options":{"A":"脂褐素為老化耗損色素。","B":"膽紅素為黃色(膽汁)色素。","C":"黑色素為黑色色素。","D":"瘀青2週後黃棕色色素為血鐵素—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_113090-90":{"quick":"PSC約65%可測得「非典型perinuclear ANCA」(非cytoplasmic),故D最不適當。","detail":{"background":"肝膽自體免疫疾病與血清指標:①「原發性膽汁性膽管炎(PBC)>90%有抗粒線體抗體(AMA)」(A正確);②「抗核抗體(ANA)與抗平滑肌抗體(SMA)見於第1型自體免疫性肝炎」(B正確);③「第2型自體免疫性肝炎的血清指標為抗肝腎微粒體(anti-LKM-1)抗體」(C正確);④「約65%的原發性硬化性膽管炎(PSC)病人可測得非典型perinuclearANCA(p-ANCA),而非cytoplasmicANCA(c-ANCA)」——故D(寫成cytoplasmic)最不適當。故D最不適當。","options":{"A":"PBC>90%有抗粒線體抗體,正確。","B":"ANA與SMA見於第1型自體免疫性肝炎,正確。","C":"第2型血清指標為anti-LKM-1,正確。","D":"PSC為perinuclear ANCA(非cytoplasmic)—錯誤(正解)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_113090-91":{"quick":"膽固醇結石是膽固醇過飽和(非鈣離子過飽和),故A錯誤。","detail":{"background":"膽囊膽固醇結石的形成機制:①「膽汁中膽固醇過飽和(而非鈣離子過飽和；鈣過飽和與色素/鈣結石相關)」——故A錯誤;②「膽囊運動不足(hypomotility,鬱滯)」(B正確);③「加速膽固醇晶體成核(nucleation)」(C正確);④「黏液分泌過多(促晶體聚集)」(D正確)。故A錯誤。","options":{"A":"膽固醇結石為膽固醇過飽和(非鈣離子)—錯誤(正解)。","B":"膽囊運動不足促成,正確。","C":"加速膽固醇晶體成核,正確。","D":"黏液分泌過多促成,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114020-89":{"quick":"HBeAg是核心相關的分泌蛋白(非包膜醣蛋白;HBsAg才是),故A最不適當。","detail":{"background":"B型肝炎病毒(HBV)蛋白:①「HBeAg」——由前核心(precore)區轉譯、分泌型核心相關蛋白(反映病毒複製活躍與傳染力,而非包膜醣蛋白(包膜醣蛋白是HBsAg)——故A最不適當;②「HBcAg是核衣殼(核心)蛋白」(B正確);③「HBx具轉錄反式活化功能(與肝癌相關)」(C正確);④「HBV聚合酶具反轉錄酶活性(複製經RNA中間體反轉錄)」(D正確)。故A最不適當。","options":{"A":"HBeAg為核心相關分泌蛋白(非包膜醣蛋白)—錯誤(正解)。","B":"HBcAg為核衣殼蛋白,正確。","C":"HBx具轉錄反式活化功能,正確。","D":"HBV聚合酶具反轉錄酶活性,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114020-91":{"quick":"慢性胰臟炎為腺泡破壞、蘭氏小島相對保留,「小島破壞消失、腺泡保留」說反了,故D錯誤。","detail":{"background":"慢性胰臟炎:①「最常見原因為長期飲酒」(A正確);②「纖維化細胞激素扮演重要角色」(B正確);③「TGF-β與PDGF誘導胰臟星狀細胞活化→纖維化」(C正確);④「典型病理是胰腺泡(acini)破壞消失與纖維化,而蘭氏小島(islets)相對保留(較晚才受損),故D蘭氏小島破壞消失而腺泡保留說反了錯誤」——故D錯誤。故D錯誤。","options":{"A":"最常見原因為長期飲酒,正確。","B":"纖維化細胞激素扮演重要角色,正確。","C":"TGF-β與PDGF誘導星狀細胞活化,正確。","D":"慢性胰臟炎為腺泡破壞、小島相對保留(D說反)—錯誤(正解)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114090-75":{"quick":"acetylcysteine解毒acetaminophen的機制是增加肝臟內glutathione含量。","detail":{"background":"「乙醯胺酚(acetaminophen)中毒」時,其毒性代謝物NAPQI耗盡肝穀胱甘肽(glutathione)→肝壞死。解毒劑acetylcysteine(NAC)的主要機制是補充/增加肝內穀胱甘肽含量(提供半胱胺酸前驅物),中和NAPQI、減輕肝損傷(及作為穀胱甘肽替代物)。並非抑制轉胺酶、增CYP450、抑COX-2。故機制為增加肝內glutathione。","options":{"A":"非抑制轉胺酶活性。","B":"非增加CYP450(反而增毒)。","C":"acetylcysteine增加肝內glutathione—正解。","D":"非抑制COX-2。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114090-90":{"quick":"HNF1α失活型肝腺瘤的LFABP免疫染色為消失(陰性),故D最不適當。","detail":{"background":"HNF1α失活型肝細胞腺瘤:①「與成熟型青少年糖尿病第3型(MODY3,HNF1α突變)相關」(A正確);②「好發女性(口服避孕藥相關)」(B正確);③「轉化為肝細胞癌的風險極小(最良性的亞型)」(C正確);④「免疫組織化學染色LFABP(肝脂肪酸結合蛋白)消失(陰性)(因HNF1α調控LFABP表現,失活後LFABP不表現),故DLFABP表現最不適當」——D錯誤。故D最不適當。","options":{"A":"與MODY3(HNF1α)相關,正確。","B":"好發女性,正確。","C":"轉化為肝癌風險極小,正確。","D":"HNF1α失活型LFABP消失(非表現)—錯誤(正解)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114090-91":{"quick":"急性膽囊炎為前列腺素釋放(增加)致發炎,「前列腺素釋放減少」錯誤。","detail":{"background":"急性膽囊炎:①「大多因結石阻塞膽囊頸/膽囊管引發」(A正確);②「發炎是因前列腺素釋放(增加)參與黏膜與膽囊壁發炎,而非釋放減少」——故B「前列腺素釋放減少導致發炎」錯誤;③「急性非結石性膽囊炎可由缺血引起」(C正確);④「非結石性膽囊炎風險因子含敗血症(重症)」(D正確)。故B錯誤。","options":{"A":"大多由結石阻塞膽囊頸/管引發,正確。","B":"前列腺素釋放(增加)致發炎、非減少—錯誤(正解)。","C":"非結石性膽囊炎可由缺血引起,正確。","D":"非結石性膽囊炎風險含敗血症,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_115020-82":{"quick":"鬱血性心衰竭的水腫主因是靜水壓升高,與血中滲透壓下降最無關。","detail":{"background":"水腫機制:①「肝硬化、腎病症候群、營養不良」——主因血漿膠體滲透壓下降(低白蛋白)(漏出);②「鬱血性心衰竭」——主因微血管靜水壓升高(體循環/肺循環鬱血)與鈉水滯留,與血中滲透壓下降最無關。故與滲透壓下降最無關者為鬱血性心衰竭。","options":{"A":"肝硬化與低白蛋白(滲透壓下降)相關。","B":"腎病症候群與蛋白流失(滲透壓下降)相關。","C":"營養不良與低白蛋白(滲透壓下降)相關。","D":"鬱血性心衰竭主因為靜水壓升高、與滲透壓下降最無關—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_115020-93":{"quick":"自體免疫性肝炎為血清IgG升高(非IgM),故D最不適當。","detail":{"background":"自體免疫性肝炎:①「與HLADR3、DR4、DRB1密切相關」(A正確);②「第1型典型有抗核抗體(ANA)與抗平滑肌肌動蛋白(SMA)抗體」(B正確);③「第2型典型有抗肝腎微粒體1(anti-LKM-1)抗體」(C正確);④「血清IgG升高是自體免疫性肝炎的典型表現,而非IgM(IgM升高見於原發性膽汁性膽管炎PBC),故DIgM升高最不適當」——D錯誤。故D最不適當。","options":{"A":"與HLA DR3/DR4/DRB1相關,正確。","B":"第1型有ANA與SMA,正確。","C":"第2型有anti-LKM-1,正確。","D":"自體免疫性肝炎為IgG升高(非IgM)—錯誤(正解)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_115020-94":{"quick":"潰瘍性結腸炎侷限大腸、不侵犯迴腸,「涉及結腸與迴腸兩者」最不適當。","detail":{"background":"潰瘍性結腸炎(UC):①「發炎通常僅侷限黏膜(mucosa)(及表淺黏膜下)」(A正確);②「UC侷限大腸(結腸),由直腸向近端連續延伸,不侵犯迴腸(克隆氏症才侵犯迴腸與全腸道),故B涉及結腸與迴腸兩者最不適當」——B錯誤(少數有倒灌性迴腸炎但非典型);③「常有假性息肉」(C正確);④「可能造成毒性巨結腸」(D正確)。故B最不適當。","options":{"A":"發炎僅限於黏膜,正確。","B":"UC侷限大腸、不涉及迴腸(非結腸+迴腸兩者)—錯誤(正解)。","C":"常有假性息肉,正確。","D":"可能造成毒性巨結腸,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_106100-92":{"quick":"腎透明細胞癌的VHL是過甲基化(hypermethylation)致靜默,「低甲基化」最不可能,故D。","detail":{"background":"本題腎黃色壞死腫瘤為腎透明(亮)細胞癌,其基因變化:①「第三對染色體短臂缺失(3p-)」(A可發生);②「3p不平衡易位」(B可發生);③「VHL基因體細胞突變(somatic mutation)」(C可發生);④「VHL的另一種失活機制是啟動子過甲基化(hypermethylation)使其靜默,而非低甲基化(hypomethylation)」——故D「VHL低甲基化」最不可能。故D。","options":{"A":"3p缺失可發生於透明細胞癌。","B":"3p不平衡易位可發生。","C":"VHL體細胞突變可發生。","D":"VHL為過甲基化(非低甲基化)致靜默—最不可能(正解)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_107100-81":{"quick":"失血性休克後最易發生急性腎小管壞死。","detail":{"background":"本題脾破裂失血→休克(皮膚乾燥、無尿、血壓下降),經救治後症狀改善:休克(低血容)缺血最易傷害腎臟近端腎小管,造成急性腎小管壞死(acute tubular necrosis, ATN)(無尿,但可恢復)。肝廣泛壞死、瀰漫肺泡壞死、腎上腺脂肪堆積非休克後最易發生。故為急性腎小管壞死。","options":{"A":"肝臟廣泛壞死非休克後最易。","B":"急性腎小管壞死(休克後最易)—正解。","C":"瀰漫性肺泡壞死非最易。","D":"腎上腺脂肪堆積非休克後變化。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_107100-90":{"quick":"銀染色腎絲球微血管壁呈雙層/車軌,見於膜增殖性腎絲球腎炎(MPGN)。","detail":{"background":"「膜增殖性腎絲球腎炎(membranoproliferative GN, MPGN)」的特徵是系膜細胞增生並插入(interposition)到基底膜與內皮之間,使銀染色腎絲球微血管壁呈現雙層(double contour)/車軌樣(tram-track)。微小變化(足突消失)、膜性腎病(釘突)、局部分葉性硬化(節段硬化)無此雙軌。故為膜增殖性腎絲球腎炎。","options":{"A":"微小變化腎病為足突消失。","B":"膜性腎絲球腎炎為基底膜釘突。","C":"局部分葉性硬化為節段硬化。","D":"膜增殖性腎絲球腎炎呈雙層/車軌—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_107100-92":{"quick":"精細胞瘤好發成人(非嬰兒),故B錯誤。","detail":{"background":"睪丸精細胞瘤(seminoma):①「類似腫瘤也可發生在卵巢(無性細胞瘤)或中樞神經(生殖細胞瘤)」(A正確);②「好發成人(尤30-40歲),非嬰兒(嬰幼兒最常見為卵黃囊瘤)」——故B錯誤;③「對放射治療敏感」(C正確);④「腫瘤細胞通常不含α-胎兒蛋白(AFP)(純精細胞瘤AFP陰性)」(D正確)。故B錯誤。","options":{"A":"類似腫瘤可發生於卵巢或中樞神經,正確。","B":"精細胞瘤好發成人(非嬰兒)—錯誤(正解)。","C":"對放射治療敏感,正確。","D":"通常不含α-胎兒蛋白,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_107100-95":{"quick":"乳頭血樣分泌、無腫塊、無凹陷,最可能為管內乳突瘤(乳突狀構造)。","detail":{"background":"本題年輕女性、單側乳頭血樣分泌、無腫塊、無乳頭凹陷、無皮膚異常、腋下淋巴無腫大——最可能為管內(乳管內)乳突瘤(intraductal papilloma):大乳管內良性乳突狀(papillary)增生,典型以乳頭血樣/漿液性分泌表現。中性球浸潤(感染)、乳頭表皮惡性細胞(Paget病)、多發乳管囊狀擴張纖維化(乳管擴張症)非此。故為乳突狀構造。","options":{"A":"管內乳突瘤的乳突狀構造—正解。","B":"中性球浸潤為感染。","C":"乳頭表皮惡性細胞浸潤為乳房Paget病。","D":"乳管囊狀擴張纖維化為乳管擴張症。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108030-92":{"quick":"靜脈硬化(phlebosclerosis)最不可能發生於高血壓性腎硬化。","detail":{"background":"「高血壓性腎硬化(hypertensive nephrosclerosis)」的病理:細動脈硬化(arteriolosclerosis,玻璃樣/增生性)、小動脈硬化(arteriosclerosis)、腎小球硬化(glomerulosclerosis,缺血皺縮)、腎小管萎縮與間質纖維化。而「靜脈硬化(phlebosclerosis)」最不可能發生(高血壓主要影響動脈/小動脈,非靜脈)。故最不可能者為靜脈硬化。","options":{"A":"腎小球硬化會發生。","B":"小動脈硬化會發生。","C":"細動脈硬化會發生。","D":"靜脈硬化最不可能發生於高血壓性腎硬化—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108030-95":{"quick":"大部分低度鱗狀上皮內病灶(LSIL)會自行消退,A正確。","detail":{"background":"子宮頸鱗狀上皮內病灶(SIL/CIN):①「大部分的低度SIL(LSIL/CIN1)會自行消退(regress)(僅少數進展)」(A正確);②「約10%LSIL進展為HSIL」(B敘述大致);③「高度SIL(HSIL/CIN2-3)進展為侵襲癌風險較高(多數需治療,少數消退)」;本題以A為正確敘述。故A正確。","options":{"A":"大部分LSIL會自行消退—正解。","B":"僅少數LSIL進展(非大部分)。","C":"HSIL進展風險較高(非少數)。","D":"HSIL多需治療(非大部分自行消退)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108030-97":{"quick":"睪丸精母細胞瘤好發成人(非嬰兒),故C較不正確。","detail":{"background":"睪丸精母細胞瘤(seminoma):①「常見染色體變化為第12號染色體短臂等臂染色體(isochromosome 12p, i(12p))」(A正確);②「腫瘤細胞表現胚胎幹細胞標記OCT3/4與NANOG」(B正確);③「好發成人(15-34歲),非嬰兒時期」——故C較不正確;④「部分腫瘤有KIT基因活化性突變」(D正確)。故C較不正確。","options":{"A":"常見i(12p)染色體變化,正確。","B":"表現OCT3/4與NANOG,正確。","C":"精母細胞瘤好發成人(非嬰兒)—錯誤(正解)。","D":"部分有KIT活化突變,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108100-93":{"quick":"原發性膜性腎病變沉積的主要免疫球蛋白為IgG4。","detail":{"background":"「原發性膜性腎病變(primary membranous nephropathy)」的主要沉積免疫球蛋白是IgG4(對抗足細胞PLA2R(磷脂酶A2受體)的自體抗體,沉積於上皮下形成釘突)。IgG1/2/3非主要。故為IgG4。","options":{"A":"IgG1非主要沉積。","B":"IgG2非主要。","C":"IgG3非主要。","D":"原發性膜性腎病變主要沉積IgG4—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108100-97":{"quick":"異生細胞取代整層子宮頸上皮、HPV陽性,為子宮頸上皮內贅生第三級(CIN III)。","detail":{"background":"本題子宮頸切片異生細胞取代整層(全層)原有子宮上皮、原位雜交HPV陽性——為子宮頸上皮內贅生第三級(CIN III)/高度鱗狀上皮內病灶(HSIL)(異型細胞佔全層但未突破基底膜)。尖形濕疣(良性挖空細胞)、慢性子宮頸炎併鱗狀化生、子宮頸息肉非此。故為CIN III。","options":{"A":"尖形濕疣為良性(挖空細胞)。","B":"慢性子宮頸炎併鱗狀化生為良性。","C":"異生取代整層上皮+HPV陽性=CIN III—正解。","D":"子宮頸息肉為良性增生。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109020-90":{"quick":"黏液性囊腺瘤常見卵巢間質(ovarian stroma)結構,A正確。","detail":{"background":"胰臟囊性腫瘤:①「黏液性囊腺瘤(mucinous cystic neoplasm)常見卵巢間質(ovarian-type stroma)結構(好發女性、胰尾)」(A正確);②「固體假乳頭狀腫瘤為低度惡性(非良性,好發年輕女性)」(故B錯誤);③「漿液性囊性腫瘤女性較男性多(非男性兩倍)」(故C錯誤);④「管內乳頭狀黏液性腫瘤(IPMN)與胰管相通、可進展為癌(非全良性)」(故D不準)。故A正確。","options":{"A":"黏液性囊腺瘤常見卵巢間質結構—正解。","B":"固體假乳頭狀腫瘤為低度惡性(非良性)—錯誤。","C":"漿液性囊性腫瘤女性較多(非男性兩倍)—錯誤。","D":"IPMN可進展為癌—不準。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109020-95":{"quick":"外陰乳房外Paget病多數無潛在侵襲癌(與乳頭Paget不同),故B較不正確。","detail":{"background":"外陰乳房外柏哲德氏病(extramammary Paget disease):①「臨床表徵與乳房柏哲德氏病相似(濕疹樣紅斑)」(A正確);②「與乳頭柏哲德氏病不同,外陰乳房外Paget病大多數沒有(無)伴隨潛在侵襲癌(僅少數有),故B大多數有伴隨侵襲癌較不正確」——B錯誤;③「Paget細胞常表現cytokeratin 7(CK7)」(C正確);④「Paget細胞可向周邊蔓延超過肉眼可辨範圍→難完全切除、易復發」(D正確)。故B較不正確。","options":{"A":"臨床表徵與乳房Paget病相似,正確。","B":"外陰乳房外Paget病多數無潛在侵襲癌(非大多數有)—錯誤(正解)。","C":"Paget細胞表現CK7,正確。","D":"可蔓延超過肉眼範圍、難完全切除,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109100-95":{"quick":"異位妊娠最常見著床位置為輸卵管(非卵巢),故A較不正確。","detail":{"background":"異位妊娠(ectopic pregnancy):①「最常見著床位置是輸卵管(fallopian tube,尤壺腹部,約90%以上),而非卵巢」——故A較不正確;②「最重要誘發因素是骨盆腔發炎(PID)致輸卵管沾黏/狹窄」(B正確);③「相關因子含子宮內膜異位症、先前手術(沾黏)」(C正確);④「著床處可產生蛻膜變化(decidual changes)」(D正確)。故A較不正確。","options":{"A":"異位妊娠最常見著床於輸卵管(非卵巢)—錯誤(正解)。","B":"最重要誘發因素為骨盆腔發炎,正確。","C":"相關因子含子宮內膜異位/手術史,正確。","D":"著床處可產生蛻膜變化,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109100-97":{"quick":"未下降睪丸最常停留在腹股溝管(非腹腔),故D較不正確。","detail":{"background":"隱睪症(cryptorchidism):①「睪丸下移分兩期:第一期腹內移位期(transabdominal,受Müllerian抑制物等調控)」(A正確);②「第二期腹股溝陰囊期(inguinoscrotal,受雄性素/陰部生殖神經調控)」(B正確);③「未下降睪丸若不治療,罹睪丸癌風險較高」(C正確);④「未下降睪丸最常停留位置是腹股溝管(inguinal canal),而非腹腔(腹內)(腹內停留較少)」——故D較不正確。故D較不正確。","options":{"A":"第一期為腹部位移期,正確。","B":"第二期為腹股溝陰囊期,正確。","C":"未下降睪丸睪丸癌風險較高,正確。","D":"最常停留於腹股溝管(非腹腔)—錯誤(正解)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_110020-78":{"quick":"SLE的急性血管炎併類纖維蛋白壞死為典型病變之一,B正確。","detail":{"background":"全身性紅斑性狼瘡(SLE):①「狼瘡腎炎主要因免疫複合體沉積(非抗基底膜抗體;抗GBM是Goodpasture)」(故A錯誤);②「急性血管炎併血管壁類纖維蛋白性壞死(fibrinoid necrosis)是SLE典型病變之一」(B正確);③「皮膚自體抗體主要沉積在真皮-表皮交界(基底膜帶),非鱗狀上皮細胞膜周圍」(故C錯誤);④「鐵絲環(wire-loop)是瀰漫增生性(class IV)狼瘡腎炎的特徵,非膜性(class V)」(故D錯誤)。故B正確。","options":{"A":"狼瘡腎炎為免疫複合體(非抗GBM)—錯誤。","B":"急性血管炎併類纖維蛋白壞死為典型—正解。","C":"皮膚抗體沉積在真皮表皮交界(非鱗狀上皮膜)—錯誤。","D":"wire-loop為瀰漫增生性(class IV)、非膜性—錯誤。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_110020-93":{"quick":"黃色肉芽腫性腎盂腎炎最常見的致病菌為變形桿菌(Proteus)。","detail":{"background":"「黃色肉芽腫性腎盂腎炎(xanthogranulomatous pyelonephritis)」最常見的致病菌是變形桿菌(Proteus,尤Proteus mirabilis)(其次大腸桿菌),常合併泌尿道阻塞(鹿角結石),病理見充滿脂質的泡沫狀巨噬細胞(黃瘤細胞)。糞鏈球菌、克雷白氏菌、金黃葡萄球菌非主因。故為變形桿菌。","options":{"A":"黃色肉芽腫性腎盂腎炎最常見致病菌為變形桿菌(Proteus)—正解。","B":"糞鏈球菌非主因。","C":"克雷白氏菌非主因。","D":"金黃葡萄球菌非主因。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_110020-95":{"quick":"成人型顆粒細胞瘤為低度惡性(可復發轉移),「臨床表現為良性」較不正確。","detail":{"background":"卵巢性索間質瘤:①「成人型顆粒細胞瘤(adult granulosa cell tumor)臨床為低度惡性(可晚期復發/轉移),而非良性」——故A較不正確;②「成人型顆粒細胞瘤可分泌動情激素(雌激素)(致子宮內膜增生/出血)」(B正確);③「支持間質細胞瘤(Sertoli-Leydig)常具荷爾蒙功能(可分泌雄激素致男性化)」(C正確);④「一半以上的Sertoli-Leydig細胞瘤腫瘤細胞具DICER1突變」(D正確)。故A較不正確。","options":{"A":"成人型顆粒細胞瘤為低度惡性(非良性)—錯誤(正解)。","B":"可分泌動情激素,正確。","C":"Sertoli-Leydig細胞瘤常具荷爾蒙功能,正確。","D":"多有DICER1突變,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111020-98":{"quick":"非典型乳管增生者日後乳癌機率約為4-5倍,B正確。","detail":{"background":"乳房疾病與乳癌風險:①「非增生性乳房囊腫不增加(或極輕微)乳癌風險(非2.5倍)」(故A錯誤);②「非典型乳管增生(atypical ductal hyperplasia)日後發生乳癌機率約4-5倍(中度增加)」(B正確);③「臺灣國健署以乳房攝影(mammography)為主要篩檢工具(非超音波)」(故C錯誤);④「纖維腺瘤通常不合併乳頭分泌物(乳頭分泌多為乳突瘤/乳管擴張)」(故D錯誤)。故B正確。","options":{"A":"非增生性囊腫不增加乳癌風險(非2.5倍)—錯誤。","B":"非典型乳管增生乳癌機率約4-5倍—正解。","C":"國健署以乳房攝影為主要篩檢(非超音波)—錯誤。","D":"纖維腺瘤不合併乳頭分泌—錯誤。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111020-99":{"quick":"腺鱗癌與神經內分泌癌的子宮頸癌預後較差(非較好),故D較不正確。","detail":{"background":"子宮頸癌:①「最常見組織型為鱗狀上皮癌(squamous cell carcinoma)」(A正確);②「第二常見為腺癌(adenocarcinoma)」(B正確);③「部分子宮頸癌與高危險型HPV(16/18)相關」(C正確);④「一般而言腺鱗癌(adenosquamous)與神經內分泌癌預後較差(而非較好)」——故D「預後較好」較不正確。故D較不正確。","options":{"A":"最常見為鱗狀上皮癌,正確。","B":"第二常見為腺癌,正確。","C":"部分與高危HPV相關,正確。","D":"腺鱗癌與神經內分泌癌預後較差(非較好)—錯誤(正解)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111100-93":{"quick":"鎮痛藥腎病(phenacetin)並非超過90%合併尿路感染,故D較不正確。","detail":{"background":"本題長期phenacetin複方止痛藥+aspirin、腎功能下降、腎乳突脫落——為鎮痛藥腎病(analgesic nephropathy):①「病灶常見鈣化(脫落的乳突)」(A正確);②「腎乳突壞死(papillary necrosis)」(B正確);③「引起慢性腎小管間質性腎炎」(C正確);④「並非超過90%合併尿路感染(尿路感染非如此高比例)」——故D較不正確。故D較不正確。","options":{"A":"病灶常見鈣化,正確。","B":"腎乳突壞死,正確。","C":"引起慢性腎小管間質性腎炎,正確。","D":"非超過90%合併尿路感染—錯誤(正解)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111100-94":{"quick":"嚴重蛋白尿、腎絲球無免疫複合體/補體沉積,最可能為糖尿病腎絲球病變。","detail":{"background":"本題65歲嚴重蛋白尿、腎切片腎絲球病變無免疫複合體或補體沉積——最可能為糖尿病腎絲球病變(diabetic glomerulopathy):系膜基質增生、基底膜增厚、Kimmelstiel-Wilson結節性硬化,免疫螢光無免疫複合體沉積(非免疫複合體疾病)。膜性腎病(IgG/補體沉積)、微小變化(足突消失)、IgA腎病(IgA沉積)有免疫沉積。故為糖尿病腎絲球病變。","options":{"A":"膜性腎病有IgG/補體沉積。","B":"糖尿病腎絲球病變(無免疫複合體沉積)—正解。","C":"微小變化腎病為足突消失。","D":"IgA腎病有IgA沉積。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112020-93":{"quick":"微小變化疾病可見近端腎小管上皮脂質沉積(故舊稱類脂性腎病),C最適當。","detail":{"background":"微小變化疾病(minimal-change disease):①「其足突消失發生在臟層(visceral)上皮(足細胞),非壁上皮細胞」(故A錯誤);②「腎小球基底膜不變厚(光鏡下正常)」(故B錯誤);③「近端腎小管上皮可見脂質沉積(故舊稱類脂性腎病(lipoid nephrosis))」(C最適當);④「與血管新生因子的關係非確立(致病多與T細胞功能異常/足細胞因子有關)」(故D不準)。故C最適當。","options":{"A":"足突消失在臟層上皮(非壁上皮)—錯誤。","B":"基底膜不變厚—錯誤。","C":"近端腎小管上皮有脂質沉積(類脂性腎病)—正解。","D":"與血管新生因子關係非確立—不準。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112020-95":{"quick":"大部分低度鱗狀上皮內病灶與低危險型HPV相關,B正確(本題答案)。","detail":{"background":"HPV與子宮頸鱗狀病灶:①(A的概括敘述不準);②「大部分低度鱗狀上皮內病灶(LSIL)與低危險型HPV相關(及部分高危型)」(B為本題答案);③「高度SIL與高危險型HPV相關(此敘述本身亦對,但本題以B為解)」;④LSIL中HPV病毒量在表面成熟上皮(挖空細胞)較基底層高(複製旺盛)(D敘述大致對)。本題公告以B為正確。故B。","options":{"A":"概括敘述不準。","B":"大部分LSIL與低危險型HPV相關—正解。","C":"HSIL與高危HPV相關(本題以B為解)。","D":"LSIL病毒量在表淺成熟上皮較高(大致對,但本題以B為解)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112100-92":{"quick":"Brunn巢(Brunn nests)最常位於膀胱的固有層。","detail":{"background":"「Brunn巢(von Brunn nests)」是膀胱尿路上皮向下增生內陷到固有層(lamina propria,黏膜下結締組織)形成的實心上皮巢(屬良性增生性變化,可演變為腺性/囊性膀胱炎)。內層肌肉、外層肌肉、外膜層非其位置。故最常位於固有層。","options":{"A":"Brunn巢最常位於膀胱固有層—正解。","B":"內層肌肉非其位置。","C":"外層肌肉非其位置。","D":"外膜層非其位置。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112100-95":{"quick":"子宮內膜異位相關卵巢癌主要為亮細胞癌與子宮內膜樣癌(非漿液性),故D最不適當。","detail":{"background":"子宮內膜異位症(endometriosis):①「異位性子宮內膜組織出現於子宮外的位置」(A正確);②「最常見位置是卵巢(巧克力囊腫)」(B正確);③「會增加不孕症」(C正確);④「與子宮內膜異位相關的卵巢癌主要是亮細胞癌與子宮內膜樣癌,而非漿液性癌」——故D最不適當。故D最不適當。","options":{"A":"異位子宮內膜出現於子宮外,正確。","B":"最常見位置為卵巢,正確。","C":"會增加不孕症,正確。","D":"相關卵巢癌主要為亮細胞癌/子宮內膜樣癌(非漿液性)—錯誤(正解)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_113090-77":{"quick":"壞死細胞外形完整、分界清楚,為凝固性壞死。","detail":{"background":"本題腎臟壞死、細胞質胞器消失、細胞核溶解,但組織外形完整、與周圍正常組織分界清楚——為凝固性壞死(coagulative necrosis):缺血(梗塞)後蛋白變性凝固,細胞輪廓(外形)仍保留數天(常見於腎、心、脾等實質器官梗塞)。液化性(腦/化膿)、乾酪化(結核)、類纖維蛋白(血管)壞死型態不同。故為凝固性壞死。","options":{"A":"液化性壞死為組織液化(腦/化膿)。","B":"乾酪化壞死為乳酪樣無結構(結核)。","C":"類纖維蛋白性壞死見於血管壁。","D":"外形完整分界清楚=凝固性壞死—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_113090-93":{"quick":"毒物引起的急性腎小管壞死最不可能發生在集尿管。","detail":{"background":"「毒物(腎毒性)引起的急性腎小管壞死(ATN)」的壞死部位主要在近端腎小管(近曲小管與近端直部straight segment)(對毒物最敏感),及亨利氏環上行支(缺血型)。而「集尿管(collecting ducts)」最不可能是毒性ATN的主要壞死部位。故最不可能者為集尿管。","options":{"A":"近曲小管為毒性ATN好發處。","B":"亨利氏環上行支可受損。","C":"近曲小管直部為毒性ATN好發處。","D":"集尿管最不可能發生毒性ATN—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114020-94":{"quick":"急性感染後腎絲球腎炎沉積於上皮細胞下(駝峰),非內皮細胞下,故D錯誤。","detail":{"background":"腎絲球免疫沉積位置(電顯):①「IgA腎病沉積於系膜細胞(mesangial)區」(A正確);②「膜性腎病沉積於上皮細胞下方(subepithelial)(釘突)」(B正確);③「緻密物沉積病(DDD)沉積於基底膜之內(intramembranous)」(C正確);④「急性感染後腎絲球腎炎沉積於上皮細胞下(subepithelial駝峰humps),而非內皮細胞下(subendothelial)」——故D錯誤。故D錯誤。","options":{"A":"IgA腎病沉積於系膜區,正確。","B":"膜性腎病沉積於上皮下,正確。","C":"緻密物沉積病沉積於基底膜內,正確。","D":"急性感染後GN沉積於上皮下(駝峰)、非內皮下—錯誤(正解)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114020-96":{"quick":"Gleason grade用於評估前列腺癌的治療與預後。","detail":{"background":"「Gleason分級(grade/score)」是前列腺腺癌(prostatic adenocarcinoma)專用的組織學分級系統:依腺體分化型態(1-5級),取主要+次要型態相加(Gleason score),用於評估治療選擇與預後。腎細胞癌、膀胱癌、陰莖癌用其他分級。故用於前列腺癌。","options":{"A":"腎細胞癌用Fuhrman/WHO-ISUP分級。","B":"膀胱癌用低/高惡性度分級。","C":"Gleason grade用於前列腺癌—正解。","D":"陰莖鱗癌用其他分級。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114090-92":{"quick":"腎嗜酸細胞瘤的細胞含大量粒線體而染成嗜酸性。","detail":{"background":"「腎嗜酸細胞瘤(renal oncocytoma)」是良性腎腫瘤:其腫瘤細胞(oncocyte)的胞質含大量粒線體(mitochondria),使細胞質染成深嗜酸性(紅色)(電顯見充滿粒線體)。高基氏體、溶酶體、粗糙內質網非其嗜酸性來源。故為粒線體。","options":{"A":"腎嗜酸細胞瘤含大量粒線體致嗜酸性—正解。","B":"高基氏體非嗜酸性來源。","C":"溶酶體非嗜酸性來源。","D":"粗糙內質網非嗜酸性來源。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114090-94":{"quick":"腎細胞癌最顯著的危險因子為抽菸。","detail":{"background":"「腎細胞癌(renal cell carcinoma)」的最顯著(最重要)的危險因子是抽菸(吸菸)(使風險約增一倍)。其他危險因子含肥胖、高血壓、後天囊性腎病(透析)、VHL症候群等,但最顯著仍為抽菸。石綿暴露(間皮瘤/肺)非腎癌主要。故最顯著者為抽菸。","options":{"A":"抽菸為腎細胞癌最顯著危險因子—正解。","B":"高血壓為次要危險因子。","C":"石綿暴露與間皮瘤相關(非腎癌主要)。","D":"肥胖為次要危險因子。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114090-96":{"quick":"非典型小葉增生(atypical lobular hyperplasia)發生侵襲性乳癌風險最高。","detail":{"background":"乳房良性病變與侵襲性乳癌風險:①「非典型增生(非典型小葉增生或非典型乳管增生)」——屬增加風險最高(約4-5倍)的一群;②「硬化性腺病、複雜性硬化病變、複雜性纖維腺瘤屬增生性無非典型(風險輕度增加,約1.5-2倍)」。本題中非典型小葉增生風險最高。故為非典型小葉增生。","options":{"A":"非典型小葉增生侵襲性乳癌風險最高—正解。","B":"硬化性腺病風險輕度增加。","C":"複雜性硬化病變風險輕度增加。","D":"複雜性纖維腺瘤風險輕度增加。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_115020-96":{"quick":"原發性FSGS的腎絲球病變最先發生於近髓質腎絲球,B正確。","detail":{"background":"局部節段型腎絲球硬化症(FSGS):①「是成人(非小於18歲兒童)腎病症候群常見原因(兒童最常見為微小變化)」(故A錯誤);②「原發性FSGS的病變最先發生於近髓質(juxtamedullary)腎絲球」(B正確);③「電顯主要為足突消失與節段硬化,非大量免疫沉積」(故C錯誤);④「以類固醇治療效果差(不如微小變化)」(故D錯誤)。故B正確。","options":{"A":"FSGS為成人(非兒童)腎病症候群常見原因—錯誤。","B":"原發性FSGS最先發生於近髓質腎絲球—正解。","C":"電顯為足突消失/節段硬化(非大量免疫沉積)—錯誤。","D":"類固醇治療效果差(非極佳)—錯誤。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_106100-80":{"quick":"梅毒病變中最顯著且多量的浸潤細胞是漿細胞。","detail":{"background":"「梅毒(syphilis)」各期病變的特徵性浸潤細胞是漿細胞(plasma cell)(及淋巴球),並閉塞性動脈內膜炎(endarteritis)。漿細胞浸潤是梅毒組織學的重要線索(各期皆顯著)。淋巴球、巨噬細胞、嗜伊紅性白血球非梅毒最顯著浸潤細胞。故為漿細胞。","options":{"A":"梅毒最顯著浸潤細胞為漿細胞—正解。","B":"淋巴球非最顯著。","C":"巨噬細胞非最顯著。","D":"嗜伊紅性白血球非梅毒浸潤主角。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_106100-84":{"quick":"白血球增高、紅血球與血小板減少、喉嚨潰瘍,最可能為急性骨髓性白血病(AML)。","detail":{"background":"本題白血球增高(50k)、紅血球與血小板減少(全血球減少的代償)、喉嚨疼痛潰瘍(中性球功能不足致感染)、骨髓切片——典型為急性骨髓性白血病(AML):骨髓被母細胞取代→正常造血被壓制(貧血、血小板低、易感染),周邊白血球以芽細胞為主。骨髓化生不良(MDS,白血球多不高)、Langerhans組織球增生、CML(白血球極高但分化成熟)型態不同。故為AML。","options":{"A":"骨髓化生不良症候群白血球多不高。","B":"蘭格罕組織球增生症非此。","C":"慢性骨髓性白血病白血球極高但分化成熟。","D":"急性骨髓性白血病(全血球減少+芽細胞)—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_106100-85":{"quick":"節細胞神經母細胞瘤最少見於前縱隔腔(好發後縱隔)。","detail":{"background":"縱隔腫瘤分區:①「前縱隔」——「4T」:胸腺瘤(Thymoma)、畸胎瘤/生殖細胞瘤(Teratoma)、甲狀腺(Thyroid)、淋巴瘤(Terrible lymphoma,含何杰金)、副甲狀腺瘤;②「後縱隔」——神經源性腫瘤(神經母細胞瘤、節細胞神經母細胞瘤、神經鞘瘤)。故節細胞神經母細胞瘤(後縱隔)最少見於前縱隔。故為節細胞神經母細胞瘤。","options":{"A":"何杰金淋巴瘤好發前縱隔。","B":"生殖細胞腫瘤好發前縱隔。","C":"副甲狀腺瘤可在前縱隔。","D":"節細胞神經母細胞瘤好發後縱隔、最少見於前縱隔—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_106100-89":{"quick":"萎縮性胃炎(體部)+抗壁細胞抗體,最可能造成惡性貧血(B12缺乏)。","detail":{"background":"本題萎縮性胃炎(體部較嚴重)、抗壁細胞抗體(及抗內在因子抗體)陽性——為自體免疫性胃炎,破壞壁細胞→內在因子缺乏→維生素B12吸收不良→惡性貧血(pernicious anemia,巨母紅血球性)。再生不良、溶血、缺鐵性貧血的機制不同。故為惡性貧血。","options":{"A":"自體免疫性胃炎致惡性貧血(B12缺乏)—正解。","B":"再生不良性貧血為骨髓衰竭。","C":"溶血性貧血機制不同。","D":"缺鐵性貧血為鐵缺乏。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_106100-94":{"quick":"最常造成原發性副甲狀腺機能亢進的病變是腺瘤。","detail":{"background":"「原發性副甲狀腺機能亢進(primary hyperparathyroidism)」最常見的病變是單一副甲狀腺腺瘤(adenoma,約85-90%)(其次增生(約10-15%),腺癌罕見(<1%))。發炎非主因。故最常造成者為腺瘤。","options":{"A":"腺瘤為原發性副甲亢最常見病變—正解。","B":"增生為次要原因。","C":"腺癌罕見。","D":"發炎非主因。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_106100-95":{"quick":"漿細胞最不易出現於正常子宮內膜(漿細胞出現=慢性子宮內膜炎)。","detail":{"background":"正常子宮內膜中:可見中性球(月經期)、巨噬細胞、淋巴球(基質中)。而「漿細胞(plasma cells)」正常子宮內膜不應出現,一旦出現漿細胞→提示慢性子宮內膜炎(chronic endometritis)。故最不易出現於正常子宮內膜者為漿細胞。","options":{"A":"嗜中性白血球可見於月經期。","B":"巨噬細胞可見於正常子宮內膜。","C":"漿細胞最不易出現(出現=慢性子宮內膜炎)—正解。","D":"淋巴球可見於子宮內膜基質。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_107100-77":{"quick":"傳染性單核細胞增多症(EBV)的非典型淋巴球主要是CD8陽性反應性T細胞。","detail":{"background":"本題8歲發燒、喉嚨痛、雙側頸部淋巴腺腫、扁桃腺發炎、白血球升高以淋巴球為主、出現非典型淋巴細胞——典型為傳染性單核細胞增多症(EBV感染):EBV感染B細胞,而周邊增多的非典型淋巴球主要是反應性活化的CD8陽性T(細胞毒性)淋巴細胞(對抗感染的B細胞)。CD4 T、NK-T、B淋巴細胞非主要。故為CD8陽性T淋巴細胞。","options":{"A":"CD4陽性T細胞非主要非典型淋巴球。","B":"CD8陽性反應性T淋巴細胞為主要—正解。","C":"NK-T細胞非主要。","D":"B淋巴細胞是被EBV感染者(非非典型淋巴球主體)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_107100-83":{"quick":"骨髓造血功能旺盛、骨髓明顯擴張的血液疾病為地中海貧血。","detail":{"background":"「地中海貧血(thalassemia)」因血紅素合成異常→無效造血(ineffective erythropoiesis)、溶血→骨髓代償性增生旺盛→骨髓腔明顯擴張(顱骨毛髮直立樣、顴骨突出的地中海貧血面容)。再生不良性貧血(骨髓減少)、ITP(血小板問題)、AML(芽細胞取代)的骨髓變化不同。故為地中海貧血。","options":{"A":"地中海貧血骨髓造血旺盛、骨髓擴張—正解。","B":"再生不良性貧血骨髓減少。","C":"免疫性血小板缺乏紫斑症為血小板問題。","D":"急性骨髓性白血病為芽細胞取代。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_107100-84":{"quick":"咳嗽、淋巴結與脾腫、貧血、白血球高、血小板低,血液抹片為急性骨髓性白血病。","detail":{"background":"本題一個月咳嗽、腋窩小淋巴結、脾尖可摸到、血色素稍低、白血球甚高、血小板下降、血液抹片(芽細胞)——為急性骨髓性白血病(AML):骨髓被母(芽)細胞取代→貧血、血小板低、白血球以芽細胞為主,可有肝脾/淋巴結浸潤。漿細胞性白血病、CLL(老年成熟淋巴球)、ALL(兒童)的型態不同(本題以AML為解)。故為急性骨髓性白血病。","options":{"A":"急性骨髓性白血病(芽細胞、全血球異常)—正解。","B":"漿細胞性白血病罕見。","C":"慢性淋巴球性白血病好發老年(成熟淋巴球)。","D":"急性淋巴母細胞白血病好發兒童。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108030-79":{"quick":"甲狀腺髓質癌的類澱粉沉積主要由癌細胞分泌的降鈣素衍生,B正確。","detail":{"background":"類澱粉沉積症(amyloidosis):①「阿茲海默症沉積的是Aβ(β類澱粉)(非AA型)」(故A錯誤);②「甲狀腺髓質癌的類澱粉主要因癌細胞分泌的降鈣素(calcitonin)衍生(A-cal型)」(B正確);③「剛果紅染色可偵測各型類澱粉(非只輕鏈型)」(故C錯誤);④「剛果紅陽性(蘋果綠雙折射)的原因是交叉β折疊(crossed β-pleated sheet)結構(非α折疊)」(故D錯誤)。故B正確。","options":{"A":"阿茲海默沉積為Aβ(非AA)—錯誤。","B":"甲狀腺髓質癌類澱粉由降鈣素衍生—正解。","C":"剛果紅可測各型類澱粉(非只輕鏈)—錯誤。","D":"剛果紅陽性因交叉β折疊(非α)—錯誤。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108030-82":{"quick":"TTP、HUS、DIC皆會出現溶血性貧血、血小板低與碎裂紅血球(①②③)。","detail":{"background":"出現微血管病性溶血性貧血(碎裂紅血球schistocytes)+血小板低下的疾病:①「栓塞性血小板低下紫斑(TTP)」;②「溶血性尿毒症候群(HUS)」;③「瀰漫性血管內凝血(DIC)」——皆因微血管內纖維蛋白/血栓機械性破壞紅血球。本題①②③皆是。故為123。","options":{"A":"遺漏③。","B":"遺漏②。","C":"TTP/HUS/DIC皆出現溶血+血小板低+碎裂紅血球—正解(123)。","D":"組合不符。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108030-84":{"quick":"成年人最常見的惡性淋巴瘤為瀰漫大B細胞淋巴瘤。","detail":{"background":"「瀰漫大B細胞淋巴瘤(diffuse large B-cell lymphoma, DLBCL)」是成人最常見的惡性(非何杰金)淋巴瘤(約佔成人NHL的30-40%)(侵襲性但可治癒)。周邊T細胞淋巴瘤、退行性大細胞淋巴瘤、被套細胞淋巴瘤較少見。故成人最常見為瀰漫大B細胞淋巴瘤。","options":{"A":"瀰漫大B細胞淋巴瘤為成人最常見惡性淋巴瘤—正解。","B":"周邊T細胞淋巴瘤較少見。","C":"退行性大細胞淋巴瘤較少見。","D":"被套細胞淋巴瘤較少見。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108030-85":{"quick":"9歲瘀傷、血小板低、其他正常、3週前呼吸道感染,為ITP(抗血小板抗體)。","detail":{"background":"本題9歲四肢瘀傷與出血斑點、血色素/血容比/MCV/白血球正常、血小板明顯降低、3週前呼吸道感染——典型為(急性)免疫性血小板減少紫斑(ITP):感染後產生抗血小板抗體(anti-platelet antibodies)→脾臟破壞血小板(其餘血球正常)。骨髓造血不良、GP IIb-IIIa缺陷(Glanzmann)、vWF金屬酶缺乏(TTP)非此。故為抗血小板抗體。","options":{"A":"感染後ITP由抗血小板抗體致—正解。","B":"骨髓造血不良非ITP(其他血球正常)。","C":"GP IIb-IIIa缺陷為Glanzmann血小板無力症。","D":"vWF金屬酶(ADAMTS13)缺乏為TTP。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108030-93":{"quick":"腦下垂體中風(pituitary apoplexy)最常見原因為嚴重之腦下垂體出血。","detail":{"background":"「腦下垂體中風(pituitary apoplexy)」是腦下垂體(尤既有腺瘤)突發嚴重出血(或梗塞),致突發頭痛、視野缺損、眼肌麻痺、急性腦下垂體功能低下(腎上腺危象)。其最常見原因是嚴重的腦下垂體出血(尤腺瘤內出血)。血管阻塞缺血、膿瘍、惡性侵犯非最常見。故為嚴重腦下垂體出血。","options":{"A":"腦下垂體中風最常因嚴重出血—正解。","B":"缺血性壞死(如Sheehan)非最常見。","C":"膿瘍非主因。","D":"惡性侵犯非主因。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108030-94":{"quick":"甲狀腺結節性對稱腫大+抗微粒體抗體,為橋本氏甲狀腺炎。","detail":{"background":"本題甲狀腺結節性、對稱性腫大、與周圍無沾黏、抗微粒體抗體(anti-microsomal/抗TPO)陽性、病理(淋巴球浸潤、生發中心、Hürthle細胞)——典型為橋本氏甲狀腺炎(Hashimoto thyroiditis,自體免疫慢性淋巴球性甲狀腺炎)(致甲狀腺低下)。亞急性(de Quervain,疼痛、病毒後)、Riedel(纖維化、沾黏堅硬)、慢性纖維性甲狀腺炎不同。故為橋本氏甲狀腺炎。","options":{"A":"橋本氏甲狀腺炎(對稱腫大+抗微粒體抗體)—正解。","B":"亞急性甲狀腺炎為病毒後疼痛性。","C":"雷得氏甲狀腺炎為纖維化沾黏堅硬。","D":"慢性纖維性甲狀腺炎(同Riedel)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108030-99":{"quick":"肉芽腫性葡萄膜炎是類肉瘤病(sarcoidosis)的常見併發症。","detail":{"background":"「肉芽腫性葡萄膜炎(granulomatous uveitis)」是類肉瘤病(sarcoidosis)的常見眼部併發症(類肉瘤為非乾酪性肉芽腫多器官疾病,可侵犯眼睛致葡萄膜炎)。惡性黑色素瘤、惡性淋巴瘤、紅斑性狼瘡非肉芽腫性葡萄膜炎的典型病因。故為類肉瘤病。","options":{"A":"惡性黑色素瘤非肉芽腫性葡萄膜炎病因。","B":"惡性淋巴瘤非此。","C":"肉芽腫性葡萄膜炎為類肉瘤病常見併發症—正解。","D":"紅斑性狼瘡非典型病因。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108100-79":{"quick":"致病機轉主要與自體抗體有關者為尋常型天皰瘡與另一抗體病(①③)。","detail":{"background":"致病機轉主要與自體抗體(autoantibody)有關的疾病:①「尋常型天皰瘡(pemphigus vulgaris)——抗橋粒芯蛋白自體抗體(第II型)」;③「(另一自體抗體媒介疾病,如Graves病/重症肌無力/天皰瘡類)」。而「②多發性結節性動脈炎主要為免疫複合體(非單純自體抗體)」。故①③(13)。","options":{"A":"含②不符。","B":"遺漏③。","C":"含②不符。","D":"①天皰瘡③另一抗體病、主要與自體抗體有關—正解(13)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108100-84":{"quick":"何杰金淋巴瘤典型腫瘤中Reed-Sternberg細胞只占小部分,C正確。","detail":{"background":"何杰金氏淋巴瘤(Hodgkin lymphoma):①「整體治療效果與存活率高(而非低)於非何杰金淋巴瘤(可治癒性高)」(故A錯誤);②「大多發生在淋巴結(非淋巴結以外),以連續性擴散」(故B錯誤);③「典型腫瘤中,真正的腫瘤細胞(Reed-Sternberg細胞)只占所有細胞的小部分(背景為反應性淋巴球/嗜酸性球/漿細胞)」(C正確);④「臨床分期比病理亞型對存活率影響更大」(故D錯誤)。故C正確。","options":{"A":"何杰金治療效果與存活率高於NHL(非低)—錯誤。","B":"大多發生在淋巴結(非淋巴結外)—錯誤。","C":"典型腫瘤中Reed-Sternberg細胞只占小部分—正解。","D":"臨床分期比病理亞型影響存活更大—錯誤。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108100-85":{"quick":"單株丙型球蛋白病變是漿細胞單株增生,「常見於急性發炎」錯誤。","detail":{"background":"單株丙型球蛋白病變(monoclonal gammopathy):①「是漿細胞(B細胞)單株(monoclonal)增生產生單一免疫球蛋白,而急性發炎產生的是多株(polyclonal)免疫球蛋白,故A常見於急性發炎錯誤」——A錯誤;②「不一定有Bence-Jones蛋白尿(視是否產生輕鏈)」(B正確);③「可能只含免疫球蛋白重鏈(重鏈病)」(C正確);④「不一定有漿細胞瘤/多發性骨髓瘤(可為意義未明MGUS)」(D正確)。故A錯誤。","options":{"A":"單株丙球蛋白病變為單株漿細胞增生(非急性發炎多株)—錯誤(正解)。","B":"不一定有Bence-Jones蛋白尿,正確。","C":"可能只含重鏈(重鏈病),正確。","D":"不一定有骨髓瘤(可為MGUS),正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109020-80":{"quick":"擴張性心肌病變與鉛中毒較不常見;溶血性貧血、周邊神經病變、痛風常見。","detail":{"background":"鉛(lead)中毒的症狀:①「溶血性貧血(鉛抑制血基質合成、紅血球嗜鹼性斑點)」(A常見);②「周邊神經病變(運動神經為主,脫髓鞘,如垂腕)」(C常見);③「鉛性痛風(saturnine gout,鉛損腎致尿酸排出下降)」(D常見)。而「擴張性心肌病變」與鉛中毒較不常見。故較不常見者為擴張性心肌病變。","options":{"A":"溶血性貧血為鉛中毒常見。","B":"擴張性心肌病變與鉛中毒較不常見—正解。","C":"周邊神經脫髓鞘病變常見。","D":"痛風(鉛性痛風)常見。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109020-84":{"quick":"慢性骨髓性白血病有t(9;22)的BCR-ABL融合基因(費城染色體),D正確。","detail":{"background":"慢性骨髓性白血病(CML):①「多發生於成人(中年)(非兒童青少年)」(故A錯誤);②「骨髓過度增生(hypercellular,非減少)」(故B錯誤);③「慢性期骨髓母細胞<10%(非超過20%;>20%才是芽細胞危象/急性轉化)」(故C錯誤);④「腫瘤細胞有第9與第22號染色體轉位t(9;22)→費城染色體(Philadelphia)、BCR-ABL融合基因(可用imatinib標靶)」(D正確)。故D正確。","options":{"A":"CML多發生於成人(非兒童青少年)—錯誤。","B":"骨髓過度增生(非減少)—錯誤。","C":"慢性期芽細胞<10%(非超過20%)—錯誤。","D":"有t(9;22) BCR-ABL融合基因—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109020-85":{"quick":"最常見的胸腺癌為鱗狀細胞癌。","detail":{"background":"「胸腺癌(thymic carcinoma,與良性的胸腺瘤不同)」中最常見的組織型是鱗狀細胞癌(squamous cell carcinoma)(惡性、侵襲性)。腺癌、淋巴上皮瘤樣癌、神經內分泌癌較少見。故最常見胸腺癌為鱗狀細胞癌。","options":{"A":"腺癌非最常見胸腺癌。","B":"淋巴上皮瘤樣癌較少見。","C":"神經內分泌癌較少見。","D":"最常見胸腺癌為鱗狀細胞癌—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109100-79":{"quick":"子宮頸癌與EBV相關性最低(子宮頸癌與HPV相關)。","detail":{"background":"與Epstein-Barr病毒(EBV)相關的腫瘤:①「鼻咽癌」;②「伯基特氏(Burkitt)淋巴瘤」;③「何杰金氏淋巴瘤」(及NK/T細胞淋巴瘤、移植後淋巴增生)。而「子宮頸癌」主要與人類乳突瘤病毒(HPV)相關,與EBV相關性最低。故相關性最低者為子宮頸癌。","options":{"A":"子宮頸癌與EBV相關性最低(與HPV相關)—正解。","B":"鼻咽癌與EBV相關。","C":"伯基特氏淋巴瘤與EBV相關。","D":"何杰金氏淋巴瘤與EBV相關。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109100-83":{"quick":"小動脈受損時加強短暫神經性收縮的物質為內皮素(endothelin)。","detail":{"background":"血管受損後的初級止血:小動脈先因神經性反射短暫收縮,並可被局部血管收縮物質加強——其中內皮素(endothelin,內皮分泌的強力血管收縮劑)可增強血管收縮。tPA(纖溶)、組織因子(凝血啟動)、凝血酶(thrombin,纖維蛋白形成)非加強血管收縮的主角。故為內皮素。","options":{"A":"tPA為纖維蛋白溶解。","B":"組織因子啟動外在凝血。","C":"凝血酶促纖維蛋白形成。","D":"內皮素加強血管收縮—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109100-84":{"quick":"血栓性血小板減少性紫斑(TTP)以血漿置換術治療對多數病人有效,B正確。","detail":{"background":"血栓性血小板減少性紫斑(TTP):①「病情嚴重,不治療死亡率高(非輕微、很少死亡)」(故A錯誤);②「以血漿置換術(plasma exchange)治療對大多數病人有效(補充ADAMTS13、移除自體抗體)」(B正確);③「血漿ADAMTS13活性過低(缺乏)→無法裂解vWF→血栓(非過高)」(故C錯誤);④「血漿中有異常巨大的vWF(von Willebrand因子)多聚體(非factor IX)」(故D錯誤)。故B正確。","options":{"A":"TTP不治療死亡率高(非輕微)—錯誤。","B":"以血漿置換術治療對多數有效—正解。","C":"ADAMTS13活性過低(非過高)—錯誤。","D":"為異常巨大vWF多聚體(非factor IX)—錯誤。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109100-85":{"quick":"異生性大細胞淋巴瘤(ALCL)主要歸類為T細胞來源,C正確。","detail":{"background":"非何杰金淋巴瘤的細胞來源:①「成人型T細胞白血病/淋巴瘤是T細胞(HTLV-1相關)(A若稱非T則錯)」;②「蕈狀肉芽腫(mycosis fungoides)是T細胞(非記憶B細胞)」(故B錯誤);③「異生性大細胞淋巴瘤(ALCL)主要歸類為T細胞」(C正確);④「Burkitt淋巴瘤主要為生發中心B細胞(非純真naive B細胞)」(故D錯誤)。故C正確。","options":{"A":"成人型T細胞白血病/淋巴瘤為T細胞(敘述若非T則錯)。","B":"蕈狀肉芽腫為T細胞(非記憶B)—錯誤。","C":"異生性大細胞淋巴瘤主要歸類為T細胞—正解。","D":"Burkitt為生發中心B細胞(非naive B)—錯誤。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109100-92":{"quick":"Waterhouse-Friderichsen症候群的腎上腺出血自髓質(中央)開始,故D錯誤。","detail":{"background":"Waterhouse-Friderichsen症候群:①「常合併腦膜炎雙球菌(Neisseria meningitidis)敗血症」(A正確);②「嚴重低血壓(休克)」(B正確);③「常併發瀰漫性血管內凝血(DIC)」(C正確);④「腎上腺出血自中央髓質(medulla)開始,再向皮質擴展(大量雙側腎上腺出血→急性腎上腺功能不全),故D自周邊皮質開始再擴展至髓質方向寫反錯誤」——故D錯誤。故D錯誤。","options":{"A":"常合併腦膜炎雙球菌敗血症,正確。","B":"嚴重低血壓,正確。","C":"常併發瀰漫性血管內凝血,正確。","D":"腎上腺出血自髓質開始(非皮質)—錯誤(正解)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109100-93":{"quick":"藥物/毒物引起的腎小管間質性腎炎,間質浸潤主要為淋巴球及巨噬細胞。","detail":{"background":"「藥物/毒物引起的(慢性)腎小管間質性腎炎」,其間質中浸潤的發炎細胞主要為淋巴球與巨噬細胞(單核細胞)(慢性發炎)。(急性藥物過敏型間質性腎炎可有嗜酸性球,但本題以淋巴球及巨噬細胞為主要浸潤)。漿細胞、肥大細胞非主要。故為淋巴球及巨噬細胞。","options":{"A":"主要浸潤為淋巴球及巨噬細胞—正解。","B":"嗜酸性白血球見於急性過敏型(非主要)。","C":"漿細胞非主要。","D":"肥大細胞非主要。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_110020-85":{"quick":"慢性淋巴球性白血病(CLL)典型表現CD20、CD5及CD23,C正確。","detail":{"background":"慢性淋巴球性白血病(CLL):①「是B淋巴球的惡性腫瘤(非T淋巴球)」(故A錯誤);②「好發老年人(>60歲,非20歲以下兒童)」(故B錯誤);③「典型腫瘤細胞表現CD20、CD5、CD23(成熟B細胞標記+CD5)」(C正確);④「BCL2基因轉位t(14;18)是濾泡性淋巴瘤的特徵(非CLL)」(故D錯誤)。故C正確。","options":{"A":"CLL為B淋巴球惡性腫瘤(非T)—錯誤。","B":"好發老年(非20歲以下)—錯誤。","C":"表現CD20、CD5及CD23—正解。","D":"BCL2轉位為濾泡性淋巴瘤特徵(非CLL)—錯誤。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111020-83":{"quick":"遺傳性視網膜母細胞瘤患者最常繼發骨肉瘤(osteosarcoma)。","detail":{"background":"「遺傳性視網膜母細胞瘤(familial retinoblastoma)」患者帶有RB基因胚系突變,除視網膜母細胞瘤外,最常繼發的第二惡性腫瘤是骨肉瘤(osteosarcoma)(及軟組織肉瘤、黑色素瘤,尤接受過放療者風險更高)。白血病、淋巴瘤、肝母細胞瘤非最常繼發。故為骨肉瘤。","options":{"A":"白血病非最常繼發。","B":"淋巴瘤非最常繼發。","C":"遺傳性視網膜母細胞瘤最常繼發骨肉瘤—正解。","D":"肝母細胞瘤非最常繼發。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111020-87":{"quick":"濾泡性淋巴瘤大多有BCL2基因轉位(t(14;18))致BCL2過度表現,C正確。","detail":{"background":"濾泡性淋巴瘤(follicular lymphoma):①「是B細胞(生發中心)淋巴瘤(非NK細胞)」(故A錯誤);②「CD20、CD5、cyclin D1是被套細胞淋巴瘤的特徵(非濾泡性)」(故B錯誤);③「大多數有BCL2基因轉位t(14;18)(IgH-BCL2)→BCL2過度表現(抗凋亡)」(C正確);④「副免疫母細胞與前淋巴細胞是CLL/SLL的增殖中心成分(非濾泡性)」(故D錯誤)。故C正確。","options":{"A":"濾泡性淋巴瘤為B細胞(非NK)—錯誤。","B":"CD20/CD5/cyclin D1為被套細胞淋巴瘤(非濾泡性)—錯誤。","C":"大多有BCL2轉位t(14;18)致BCL2過度表現—正解。","D":"副免疫母細胞/前淋巴細胞為CLL特徵(非濾泡性)—錯誤。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111020-88":{"quick":"缺鐵性貧血的紅血球比正常小且顏色較淺(小球低色素),A正確。","detail":{"background":"缺鐵性貧血(iron deficiency anemia):①「紅血球比正常小(microcytic,MCV低)且顏色較淺(hypochromic,MCH低)」(A正確);②「較常發生於女性(月經失血、孕產)(非男性)」(故B錯誤);③「在西方國家最常見原因是慢性失血(月經、胃腸道出血)(非飲食攝取不足)」(故C錯誤);④「血漿總鐵結合力(TIBC)升高(而非降低)(鐵缺乏時運鐵蛋白代償增加)」(故D錯誤)。故A正確。","options":{"A":"紅血球比正常小且色淺(小球低色素)—正解。","B":"較常發生於女性(非男性)—錯誤。","C":"西方最常見原因為慢性失血(非飲食)—錯誤。","D":"總鐵結合力升高(非降低)—錯誤。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111100-84":{"quick":"血栓性血小板減少性紫斑(TTP)最可能造成微血管病性溶血性貧血。","detail":{"background":"「微血管病性溶血性貧血(microangiopathic hemolytic anemia, MAHA,碎裂紅血球)」最可能由血栓性血小板減少紫斑(TTP)(及HUS、DIC)造成——微血管內血栓/纖維蛋白絲機械性切碎紅血球。von Willebrand病(出血)、慢性/急性ITP(免疫破壞血小板,無碎裂紅血球)非MAHA。故為TTP。","options":{"A":"TTP最可能造成微血管病性溶血性貧血—正解。","B":"von Willebrand病為出血傾向。","C":"慢性ITP為免疫性血小板破壞(無MAHA)。","D":"急性ITP為免疫性血小板破壞(無MAHA)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112020-80":{"quick":"胃MALT淋巴瘤的特徵染色體變化為t(11;18)(非t(11;14)),故D錯誤。","detail":{"background":"胃黏膜相關淋巴組織淋巴瘤(MALToma):①「屬B細胞淋巴瘤(邊緣區)」(A正確);②「與幽門螺旋桿菌(H. pylori)關係最密切(根除可緩解早期病灶)」(B正確);③「CagA(細胞毒素相關基因A)是H. pylori重要致病基因」(C正確);④「其特徵性染色體變化是t(11;18)(API2-MALT1)(與不易根除H. pylori緩解相關),而t(11;14)是被套細胞淋巴瘤的變化」——故D錯誤。故D錯誤。","options":{"A":"屬B-cell lymphoma,正確。","B":"與H. pylori關係最密切,正確。","C":"CagA為相關微生物重要致病基因,正確。","D":"MALToma為t(11;18)(t(11;14)是被套細胞瘤)—錯誤(正解)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112020-85":{"quick":"兒童全血球減少、骨髓低下,為再生不良性貧血,以原發性(idiopathic)最多,B正確。","detail":{"background":"本題6歲面色蒼白、全血球(紅/白/血小板)減少、感染與用藥史、骨髓切片減少(hypocellular)——為再生不良性貧血(aplastic anemia):①「此類疾病以原發性(idiopathic,約半數找不到原因)最多」(B正確);②「最常相關感染病因是肝炎病毒(及parvovirus B19),非黴漿菌」(故A錯誤);③「因骨髓衰竭,不會因脾臟造血而腫大(再生不良無髓外造血腫大)」(故C錯誤);④「化療藥致再生不良以烷化劑等最常見(非taxol)」(故D錯誤)。故B正確。","options":{"A":"最常見感染病因為肝炎病毒(非黴漿菌)—錯誤。","B":"再生不良性貧血以原發性(idiopathic)最多—正解。","C":"再生不良不會脾臟造血腫大—錯誤。","D":"化療致病以烷化劑為主(非taxol)—錯誤。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112020-92":{"quick":"嗜中性白血球最不可能出現在硬化性後腹腔纖維化(IgG4相關)的病灶。","detail":{"background":"「硬化性後腹腔纖維化(sclerosing retroperitoneal fibrosis,常為IgG4相關疾病)」的病灶含淋巴球、IgG4陽性漿細胞、嗜酸性白血球與席紋狀(storiform)纖維化、閉塞性靜脈炎。而「嗜中性白血球(neutrophil)」(急性化膿性發炎)最不可能出現(此病為慢性淋巴漿細胞性發炎,非化膿性)。故最不可能者為嗜中性白血球。","options":{"A":"淋巴球可見於病灶。","B":"IgG4陽性漿細胞為特徵。","C":"嗜酸性白血球可見。","D":"嗜中性白血球最不可能出現(非化膿性)—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112020-94":{"quick":"最常造成原發性副甲狀腺功能亢進症的原因是單一副甲狀腺腺瘤。","detail":{"background":"「原發性副甲狀腺功能亢進症(primary hyperparathyroidism)」最常見原因是單一(孤立性)副甲狀腺腺瘤(solitary parathyroid adenoma,約85-90%)(其次原發性增生,腺癌罕見)。多發性腺瘤少見。故為單一副甲狀腺腺瘤。","options":{"A":"原發性增生為次要原因。","B":"副甲狀腺癌罕見。","C":"多發性腺瘤少見。","D":"單一副甲狀腺腺瘤為最常見原因—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112100-82":{"quick":"增加部分凝血活酶時間(PTT)者為A型血友病與另一內因路徑異常(①③)。","detail":{"background":"「部分凝血活酶時間(PTT,反映內因路徑)延長」的疾病:①「A型血友病(第VIII因子缺乏)」;③「(另一內因路徑因子缺乏/抑制,如第IX因子缺乏(B型血友病)或狼瘡抗凝物)」。而②(栓塞性血小板低下TTP)主要血小板低PTT正常。故①③(13)增加PTT。","options":{"A":"含②不符。","B":"A型血友病③等內因路徑異常增加PTT—正解(13)。","C":"組合不符。","D":"組合不符。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112100-85":{"quick":"小球性貧血與藥物使用最不相關(多為缺鐵)。","detail":{"background":"與藥物使用相關的貧血:①「G6PD缺乏溶血(氧化性藥物如磺胺、抗瘧藥誘發)」(A相關);②「大球性貧血(葉酸拮抗劑methotrexate、苯妥英等致)」(B相關);③「再生不良性貧血(chloramphenicol、化療藥等致)」(C相關)。而「小球性貧血(microcytic)」主要因缺鐵(慢性失血)或地中海貧血,與藥物使用最不相關。故最不相關者為小球性貧血。","options":{"A":"G6PD缺乏溶血與氧化性藥物相關。","B":"大球性貧血與葉酸拮抗藥相關。","C":"再生不良性貧血與藥物相關。","D":"小球性貧血與藥物使用最不相關—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_113090-79":{"quick":"結核菌素試驗是刺激T淋巴球釋放γ-干擾素(第四型遲發過敏)。","detail":{"background":"「結核菌素試驗(tuberculin/PPD test)」是第IV型(遲發型/細胞媒介)過敏反應:先前致敏的T淋巴細胞辨識結核菌抗原→釋放γ-干擾素(IFN-γ)等細胞激素→活化巨噬細胞、48-72小時局部硬結(induration)。並非刺激巨噬細胞、非釋放TNF為主。故為刺激T淋巴細胞釋放γ-干擾素。","options":{"A":"非刺激巨噬細胞釋放γ-干擾素。","B":"刺激T淋巴細胞釋放γ-干擾素(第四型)—正解。","C":"非刺激巨噬細胞釋放TNF。","D":"非刺激T細胞釋放TNF(而是γ-干擾素)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_113090-85":{"quick":"接受抗癌化學治療最可能引起次發性骨髓化生不良症候群。","detail":{"background":"「次發性(secondary/治療相關)骨髓化生不良症候群(MDS)」最可能因接受抗癌化學治療(尤烷化劑、topoisomerase II抑制劑)或放射線治療所致(損傷造血幹細胞、致基因突變)。長期缺鈣、骨鬆藥、抗結核藥非典型病因。故為接受抗癌化療。","options":{"A":"長期缺鈣非MDS病因。","B":"接受抗癌化療最可能致次發性MDS—正解。","C":"骨質疏鬆藥非病因。","D":"抗結核藥非典型病因。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_113090-94":{"quick":"最常造成次發性副甲狀腺功能亢進症的原因是腎衰竭。","detail":{"background":"「次發性副甲狀腺功能亢進症(secondary hyperparathyroidism)」最常見原因是慢性腎衰竭(renal failure):腎無法排磷與活化維生素D→高血磷、低血鈣、活性維生素D不足→副甲狀腺代償性增生分泌PTH(反應低血鈣)。MEN1、CCND1、MEN非次發性的主因。故為腎衰竭。","options":{"A":"MEN1突變為原發性(多腺體)。","B":"CCND1基因倒位為腺瘤機制(原發性)。","C":"腎衰竭為次發性副甲亢最常見原因—正解。","D":"多發性內分泌腫瘤為原發性。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_113090-95":{"quick":"最常造成腦下垂體機能亢進的原因是前葉腺瘤。","detail":{"background":"「腦下垂體機能亢進(hyperpituitarism)」最常見原因是腦下垂體前葉腺瘤(anterior pituitary adenoma)(功能性腺瘤分泌過多荷爾蒙,如泌乳素瘤、GH瘤致肢端肥大、ACTH瘤致庫欣)。前葉增生、前葉癌(罕見)、下視丘疾病非最常見。故為前葉腺瘤。","options":{"A":"前葉腺瘤為腦下垂體機能亢進最常見原因—正解。","B":"前葉增生較少見。","C":"前葉癌罕見。","D":"下視丘疾病非最常見。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114020-84":{"quick":"骨髓化生不良症候群(MDS)最容易進展成急性骨髓性白血病(AML)。","detail":{"background":"「骨髓化生不良症候群(myelodysplastic syndrome, MDS)」是造血幹細胞的無效造血與發育不良,最容易進展(轉化)成急性骨髓性白血病(AML)(故又稱白血病前期)。真性紅血球增多症、原發性血小板增多症(MPN,轉化AML風險較低)、CLL(淋巴系,不轉AML)較少。故最易進展AML者為MDS。","options":{"A":"真性紅血球增多症轉AML風險較低。","B":"原發性血小板增多症轉AML風險較低。","C":"骨髓化生不良症候群最易進展成AML—正解。","D":"慢性淋巴球性白血病(淋巴系)不轉AML。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114020-85":{"quick":"急性淋巴母細胞性白血病(ALL)臨床表現與AML相似,A最適當。","detail":{"background":"急性淋巴母細胞性白血病(ALL):①「臨床表現與急性骨髓性白血病(AML)相似(骨髓衰竭→貧血、出血、感染、肝脾淋巴結腫大)」(A最適當);②「病人多數為兒童(非40歲以上成人;ALL好發兒童)」(故B錯誤);③「MYC轉位是Burkitt淋巴瘤(ALL多TEL-AML1、超二倍體、BCR-ABL等)」(故C錯誤);④「部分ALL(Ph陽性ALL)會有BCR-ABL融合基因」(故D錯誤)。故A最適當。","options":{"A":"ALL臨床表現與AML相似—正解。","B":"ALL多為兒童(非40歲以上)—錯誤。","C":"MYC轉位為Burkitt(非ALL)—錯誤。","D":"部分ALL有BCR-ABL(Ph+ ALL)—錯誤。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114020-90":{"quick":"自體免疫性萎縮性胃炎的內分泌細胞(G/ECL)增生(非萎縮減少),故D最不適當。","detail":{"background":"自體免疫性萎縮性胃炎:①「與其他自體免疫疾病(甲狀腺炎、糖尿病、Graves病)相關」(A正確);②「與惡性貧血(內在因子缺乏致B12缺乏)有關」(B正確);③「維生素B12在迴腸末端吸收(內在因子缺乏致此處吸收缺陷)」(C正確);④「因胃酸低下回饋,胃竇內分泌細胞(G細胞、腸嗜鉻樣ECL細胞)增生(hyperplasia,可致類癌),而非萎縮減少」——故D最不適當。故D最不適當。","options":{"A":"與甲狀腺炎/糖尿病/Graves病相關,正確。","B":"與惡性貧血有關,正確。","C":"迴腸維生素B12吸收缺陷,正確。","D":"內分泌細胞增生(非萎縮減少)—錯誤(正解)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114090-83":{"quick":"血友病的凝血異常主要是凝血因子缺乏(非血小板功能缺失),故C。","detail":{"background":"凝血功能異常中主要因血小板功能缺失者:①「von Willebrand病(vWF缺乏→血小板黏附不良)」(A為血小板功能);②「尿毒症(毒素抑制血小板功能)」(B為血小板功能);④「阿斯匹靈(抑制COX、血小板功能)」(D為血小板功能)。而「血友病(hemophilia)」是凝血因子(VIII或IX)缺乏,主要不是血小板功能缺失。故主要非血小板功能者為血友病。","options":{"A":"von Willebrand病影響血小板黏附(血小板功能)。","B":"尿毒症抑制血小板功能。","C":"血友病為凝血因子缺乏(非血小板功能)—正解。","D":"aspirin抑制血小板功能。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114090-84":{"quick":"何杰金氏淋巴瘤的腫瘤細胞通常只占所有細胞的小部分。","detail":{"background":"「何杰金氏淋巴瘤(Hodgkin lymphoma)」的組織切片中,真正的腫瘤細胞(Reed-Sternberg細胞及其變異)只占所有細胞的小部分,其餘大多為反應性背景細胞(淋巴球、嗜酸性球、漿細胞、組織球)。瀰漫大B、退行性大細胞、Burkitt淋巴瘤的腫瘤細胞佔大多數。故為何杰金氏淋巴瘤。","options":{"A":"瀰漫大B細胞淋巴瘤腫瘤細胞佔多數。","B":"退行性大細胞淋巴瘤腫瘤細胞佔多數。","C":"何杰金氏淋巴瘤腫瘤細胞只占小部分—正解。","D":"Burkitt淋巴瘤腫瘤細胞佔多數。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114090-85":{"quick":"再生不良性貧血的骨髓造血細胞量最可能比正常少。","detail":{"background":"「再生不良性貧血(aplastic anemia)」的骨髓造血細胞量(cellularity)減少(hypocellular,被脂肪取代),致全血球減少。而缺鐵性貧血、巨母紅血球性貧血、地中海貧血的骨髓造血反而增生(hypercellular,代償)。故骨髓細胞量最可能比正常少者為再生不良性貧血。","options":{"A":"缺鐵性貧血骨髓造血增生。","B":"巨母紅血球性貧血骨髓增生。","C":"地中海型貧血骨髓增生。","D":"再生不良性貧血骨髓造血細胞量最少—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_115020-78":{"quick":"毛樣白斑(hairy leukoplakia)與EBV相關(非HPV),故A錯誤。","detail":{"background":"病毒感染與疾病:①「毛樣白斑(hairy leukoplakia)與Epstein-Barr病毒(EBV)相關(免疫低下如AIDS者舌側緣),而非人類乳突瘤病毒(HPV)」——故A錯誤;②「人類疱疹病毒8型(HHV-8)與原發性體液(積液)淋巴瘤相關」(B正確);③「EBV與鼻腔型NK/T細胞淋巴瘤相關」(C正確);④「JC病毒與進行性多灶性白質腦病(PML)相關」(D正確)。故A錯誤。","options":{"A":"毛樣白斑與EBV相關(非HPV)—錯誤(正解)。","B":"HHV-8與原發性體液淋巴瘤相關,正確。","C":"EBV與鼻腔型NK/T細胞淋巴瘤相關,正確。","D":"JC病毒與PML相關,正確。"},"sources":["Robbins
