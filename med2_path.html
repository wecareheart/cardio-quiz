catechol-O-methyltransferase,延長levodopa 的作用","C":"增加周邊組織3-O-methyldopa 的含量,加強levodopa 的作用","D":"促進中樞神經末梢dopamine 的釋放"},"answer":"B","accepted_answers":["B"],"answer_status":"normal","img":""},{"id":"med2_114090-80","q_num":80,"roc_year":"114","exam_code":"114090","src":"民國114年","topic":"T12神經肌肉骨骼皮膚病理","stem":"慢性一氧化碳中毒主要造成中樞神經何處缺氧?","options":{"A":"大腦半球(cerebral hemisphere)","B":"小腦(cerebellum)","C":"基底核(basal ganglia)","D":"胼胝體(corpus callosum)"},"answer":"C","accepted_answers":["C"],"answer_status":"normal","img":""},{"id":"med2_114090-98","q_num":98,"roc_year":"114","exam_code":"114090","src":"民國114年","topic":"T12神經肌肉骨骼皮膚病理","stem":"有關骨骼疾病的病理機轉,下列那一組合與蝕骨細胞(osteoclasts)活性異常較有關係?1osteopetrosis 2senile osteoporosis 3post-menopausal osteoporosis 4osteomalacia 5Paget disease (osteitis deformans)","options":{"A":"124","B":"135","C":"235","D":"345"},"answer":"B","accepted_answers":["B"],"answer_status":"normal","img":""},{"id":"med2_114090-99","q_num":99,"roc_year":"114","exam_code":"114090","src":"民國114年","topic":"T12神經肌肉骨骼皮膚病理","stem":"下列皮膚病變皆可能與感染有關,何者在皮膚病灶處最有可能培養出致病微生物?","options":{"A":"erythema multiforme","B":"erythema induratum","C":"erythema nodosum","D":"erythema migrans"},"answer":"D","accepted_answers":["D"],"answer_status":"normal","img":""},{"id":"med2_115020-88","q_num":88,"roc_year":"115","exam_code":"115020","src":"民國115年","topic":"T12神經肌肉骨骼皮膚病理","stem":"多重系統退化症(multiple system atrophy)患者中,下列何種細胞最易見到α-突觸核蛋白(α- synuclein)包涵體?","options":{"A":"星狀細胞(astrocyte)","B":"寡樹突細胞(oligodendrocyte)","C":"微膠細胞(microglia)","D":"血管內皮細胞(endothelial cell)"},"answer":"B","accepted_answers":["B"],"answer_status":"normal","img":""},{"id":"med2_115020-89","q_num":89,"roc_year":"115","exam_code":"115020","src":"民國115年","topic":"T12神經肌肉骨骼皮膚病理","stem":"下列何者對於類風濕性關節炎(rheumatoid arthritis)發生機轉的重要性最為明確,且已有專一性拮抗劑用於治療?","options":{"A":"rheumatoid factor","B":"IL-2","C":"IFN-α","D":"TNF"},"answer":"D","accepted_answers":["D"],"answer_status":"normal","img":""},{"id":"med2_115090-98","q_num":98,"roc_year":"115","exam_code":"115090","src":"民國115年","topic":"T12神經肌肉骨骼皮膚病理","stem":"下列皮膚水泡性疾病,何者是以IgA 沿表皮與真皮層交界分布為主要診斷特徵?","options":{"A":"pemphigus","B":"bullous pemphigoid","C":"epidermolysis bullosa","D":"dermatitis herpetiformis"},"answer":"D","accepted_answers":["D"],"answer_status":"normal","img":""},{"id":"med2_115090-99","q_num":99,"roc_year":"115","exam_code":"115090","src":"民國115年","topic":"T12神經肌肉骨骼皮膚病理","stem":"下列有關庫魯斑塊(Kuru plaques)的敘述,何者最不適當?","options":{"A":"最常為Aβ蛋白質沉積","B":"可能與克雅氏病(Creutzfeldt-Jakob disease)有關","C":"剛果紅(Congo red)染色可呈現陽性反應","D":"較常發現於小腦"},"answer":"A","accepted_answers":["A"],"answer_status":"normal","img":""},{"id":"med2_115090-100","q_num":100,"roc_year":"115","exam_code":"115090","src":"民國115年","topic":"T12神經肌肉骨骼皮膚病理","stem":"下列有關腦膜瘤(meningioma)的敘述,何者最不適當?","options":{"A":"大多屬於良性腫瘤","B":"較少見於小孩","C":"懷孕時受到黃體素(progesterone)影響,腫瘤生長較慢","D":"可能與第22 對染色體缺失有關"},"answer":"C","accepted_answers":["C"],"answer_status":"normal","img":""}],E={"med2_106100-77":{"quick":"細胞缺氧時鈣離子流入細胞內(非流出),故「鈣由細胞內流出」最不可能。","detail":{"background":"細胞缺氧(缺血)的早期變化:①「ATP生成下降(粒線體氧化磷酸化受損)」(D正確);②「鈉鉀幫浦(Na-K ATPase)失能→鈉與水進入細胞(細胞腫脹)」(A正確);③「無氧糖解→乳酸堆積→細胞內pH下降」(B正確);④「鈣流入細胞質(細胞外與內質網的鈣進入胞質、鈣幫浦失能),活化磷脂酶/蛋白酶等致損傷」——故C「鈣由細胞內流出」與事實相反(應為流入),最不可能。故C最不可能。","options":{"A":"鈉水進入細胞(腫脹),會出現。","B":"細胞內pH下降(乳酸),會出現。","C":"缺氧時鈣流入(非流出)細胞—最不可能(正解)。","D":"細胞內ATP下降,會出現。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_106100-81":{"quick":"放射線致G1停滯與「Cyclin A/cdk1被活化」關係最少(後者促進進入S/M期)。","detail":{"background":"細胞受放射線致DNA損傷後,細胞週期停滯於G1期(G1 arrest)的機制:①「DNA破壞活化p53」(A相關);②「p53誘導p21(CDK抑制蛋白)」(B相關);③「p21抑制Cyclin D/cdk4(及Cyclin E/cdk2)→阻止G1→S」(C相關);④「Cyclin A/cdk1(cdc2)是促進細胞進入S/M期的正向調控,與G1停滯關係最少(其活化反而推進週期)」。故關係最少者為D(Cyclin A/cdk1被活化)。","options":{"A":"DNA破壞為G1停滯的觸發,相關。","B":"p21活化抑制CDK、致G1停滯,相關。","C":"Cyclin D/cdk4被抑制致G1停滯,相關。","D":"Cyclin A/cdk1活化促進進入S/M、與G1停滯關係最少—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_107100-76":{"quick":"EGF經受體活化RAS、再活化轉錄因子,主要經MAPK(絲裂原活化蛋白激酶)途徑。","detail":{"background":"生長因子訊息傳遞:「表皮生長因子(EGF)與其酪胺酸激酶受體結合→活化RAS→RAF→MEK→絲裂原活化蛋白激酶(MAPK/ERK)→活化轉錄因子→促進細胞增生/生長」——此即RAS-MAPK(mitogen-activated protein kinase)途徑。Cyclic AMP(GPCR)、Cyclin-dependent kinases(週期調控)、JAK/STAT(細胞激素受體)非EGF-RAS的主要途徑。故為MAPK途徑。","options":{"A":"Cyclic AMP為GPCR下游。","B":"CDK為細胞週期調控(非生長因子訊息主軸)。","C":"JAK/STAT為細胞激素受體途徑。","D":"EGF-RAS經MAPK途徑—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_107100-98":{"quick":"早產兒以高濃度氧治療常見後遺症為水晶體後纖維增生(早產兒視網膜病變)。","detail":{"background":"「不足1000公克的早產兒以高濃度氧氣治療」會引起早產兒視網膜病變(retinopathy of prematurity),舊稱水晶體後纖維增生(retrolental fibroplasia):高氧→視網膜血管收縮閉塞→缺氧→異常新生血管增生、纖維化、視網膜剝離,可致失明(亦致支氣管肺發育不良)。原發性青光眼、霰粒腫、交感性眼炎非此後遺症。故為水晶體後纖維增生。","options":{"A":"原發性青光眼非高氧後遺症。","B":"霰粒腫為眼瞼腺體病變。","C":"交感性眼炎為自體免疫性。","D":"水晶體後纖維增生(早產兒視網膜病變)—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108030-77":{"quick":"懷孕時乳房最可能發生小葉增生(lobular hyperplasia)。","detail":{"background":"「懷孕時」在雌激素、黃體素與泌乳素作用下,乳房小葉(腺泡)增生(lobular/acinar hyperplasia)、腺體擴張、間質減少,為哺乳做準備(泌乳)。間質纖維化(纖維囊腫變化)、乳管鱗狀化生、腺泡細胞異生非懷孕的生理變化。故為小葉增生。","options":{"A":"間質纖維化為纖維囊腫性變化。","B":"乳管鱗狀化生為病理性化生。","C":"腺泡細胞異生為異常。","D":"懷孕時乳房小葉增生—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108030-98":{"quick":"病理診斷狂犬病的最主要依據是觀察到Negri body(內基氏小體)。","detail":{"background":"「狂犬病(rabies)」的病理特徵是神經元(尤其海馬、小腦Purkinje細胞)細胞質內出現內基氏小體(Negri body)——嗜酸性的胞質內包涵體(病毒核衣殼聚集),為病理診斷的最主要依據。Lewy body(帕金森)、Kuru plaque(普利昂病)、stress granule非狂犬病。故為Negri body。","options":{"A":"Lewy body見於帕金森氏症。","B":"Kuru plaque見於普利昂病。","C":"Negri body為狂犬病的病理依據—正解。","D":"Stress granule非狂犬病特徵。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108100-76":{"quick":"骨化性肌炎病灶中的骨組織為化生(metaplasia)。","detail":{"background":"「骨化性肌炎(myositis ossificans)」是軟組織(肌肉)受傷後,間葉細胞化生(metaplasia)為骨母細胞、形成異位骨(成熟骨組織)——屬化生(一種已分化細胞被另一種已分化細胞型態取代)。異生(dysplasia,癌前)、增生、萎縮非此。故為化生。","options":{"A":"異生為癌前細胞異常。","B":"增生為細胞數目增加。","C":"萎縮為細胞變小。","D":"骨化性肌炎的骨為化生—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108100-99":{"quick":"角化不全(parakeratosis)指角質層不成熟、仍保有細胞核。","detail":{"background":"「角化不全(parakeratosis)」是表皮角質層(stratum corneum)的角化不完全(不成熟),角質細胞仍保留細胞核(正常角質層細胞已脫核)——見於牛皮癬(psoriasis)等表皮過度增生疾病(角質層更替過快、來不及脫核)。增厚(過角化)、玻璃質樣、變薄非parakeratosis定義。故為角質仍有細胞核存在。","options":{"A":"增厚為過角化(hyperkeratosis)。","B":"玻璃質樣物質非parakeratosis定義。","C":"角質不成熟、仍有細胞核—正解。","D":"變薄非parakeratosis。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109020-73":{"quick":"disulfiram與酒精併用會造成乙醛蓄積、引起不適反應。","detail":{"background":"「disulfiram(戒酒硫)」抑制乙醛去氫酶(ALDH):飲酒後乙醛(acetaldehyde)蓄積,引發噁心、嘔吐、皮膚潮紅、頭痛、低血壓(戒酒硫反應),使病人厭惡酒精。acamprosate(調麩胺酸)、naltrexone(鴉片拮抗)、baclofen(GABAB)無此反應。故為disulfiram。","options":{"A":"disulfiram抑ALDH、致乙醛蓄積—正解。","B":"acamprosate無此反應。","C":"naltrexone為鴉片拮抗。","D":"baclofen為GABAB致效。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109020-77":{"quick":"萎縮可使細胞變小「並」數目減少,「數目不會減少」錯誤。","detail":{"background":"萎縮(atrophy):①「胚胎時期某些組織已開始萎縮(如甲狀舌管、中腎管退化)」(A正確);②「萎縮是細胞體積變小,且細胞數目也可能減少(經由凋亡)」——故B「細胞數目不會減少」錯誤;③「老年腦萎縮主因血液供應減少(動脈硬化)與神經元退化」(C大致正確);④「萎縮細胞常見脂褐質(lipofuscin)沉積」(D正確)。故B錯誤。","options":{"A":"胚胎時期某些組織已萎縮,正確。","B":"萎縮可使細胞數目減少(非不會減少)—錯誤(正解)。","C":"老年腦萎縮與血液供應減少有關,大致正確。","D":"脂褐質可見於萎縮器官,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109020-92":{"quick":"腎上腺微結節性增生沉積的主要色素為脂褐質(lipofuscin)。","detail":{"background":"「原發性色素性結節性腎上腺皮質病(腎上腺微結節性增生)」的結節呈棕黑色,是因沉積脂褐質(lipofuscin,脂質過氧化的耗損色素)所致(與Carney complex/庫欣症相關)。黑色素、血鐵素(hemosiderin)、血色素非主要色素。故為脂褐質。","options":{"A":"黑色素非此結節主要色素。","B":"血鐵素(hemosiderin)為含鐵色素。","C":"血色素非沉積色素。","D":"腎上腺微結節增生沉積脂褐質—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109020-94":{"quick":"纖維肌肉發育不良最常侵犯血管中層,「僅侵犯中層」最不可能(可侵多層)。","detail":{"background":"「纖維肌肉發育不良(fibromuscular dysplasia)」致腎動脈狹窄:①「好發女性」(A正確);②「好發20-40歲(年輕)」(B正確);③「中層(media)型最常見,但也可侵犯內膜或外膜,非僅侵犯中層」——故C「僅會侵犯血管中層」最不可能(過於絕對);④「腎動脈狹窄致腎缺血性萎縮、腎血管性高血壓」(D正確)。故C最不可能。","options":{"A":"好發女性,正確。","B":"好發20-40歲,正確。","C":"非僅侵犯中層(可侵內/外膜)—最不可能(正解)。","D":"可致腎臟缺血性萎縮,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109100-76":{"quick":"脂肪變性是三酸甘油酯(脂肪)而非膽固醇的積聚,故A錯誤。","detail":{"background":"脂肪變性(steatosis):①「是實質細胞(尤肝細胞)內三酸甘油酯(脂肪)不正常積聚,而非膽固醇」——故A錯誤;②「常見於糖尿病、肥胖」(B正確);③「酒精代謝使NADH/NAD比值上升→促進脂肪合成、抑制脂肪酸氧化」(C正確);④「蛋白質營養不良(脂蛋白合成不足、脂肪無法輸出)亦致肝脂肪變性」(D正確)。故A錯誤。","options":{"A":"脂肪變性是三酸甘油酯(非膽固醇)積聚—錯誤(正解)。","B":"肝脂肪變性常見於糖尿病,正確。","C":"NADH上升為酒精致脂肪變性機制,正確。","D":"蛋白質營養不良亦致肝脂肪變性,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109100-87":{"quick":"氣喘的支氣管平滑肌為肥大/增生(非萎縮),故D錯誤。","detail":{"background":"氣喘的病理變化:①「基底膜下纖維化(增厚)」(A正確);②「黏膜下腺體肥大、杯狀細胞增生(黏液過多)」(B正確);③「血管增生、發炎(嗜酸性球浸潤)、黏液栓」(C正確);④「支氣管壁平滑肌肥大/增生(hypertrophy/hyperplasia)(致氣道收縮),而非萎縮」——故D「支氣管壁肌肉萎縮」錯誤。故D錯誤。","options":{"A":"基底膜下纖維化,正確。","B":"黏膜下腺體肥大,正確。","C":"血管增生,正確。","D":"氣喘支氣管平滑肌肥大/增生(非萎縮)—錯誤(正解)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_110020-75":{"quick":"propranolol(β阻斷劑)過量致低血壓心搏過慢,首選解毒劑為glucagon。","detail":{"background":"「β阻斷劑(propranolol)過量」致心搏過緩、低血壓、心收縮力下降,首選解毒劑是glucagon(升糖素)——glucagon經非β受體途徑(自身受體)增加心肌cAMP→提升心率與收縮力(繞過被阻斷的β受體)。atropine(對嚴重β阻斷常不足)、digoxin、pralidoxime(有機磷)非首選。故為glucagon。","options":{"A":"glucagon為β阻斷劑過量首選解毒劑—正解。","B":"atropine對嚴重β阻斷常不足。","C":"digoxin非解毒劑。","D":"pralidoxime用於有機磷中毒。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_110020-92":{"quick":"外因性皮質醇增多症的腎上腺最可能呈現皮質萎縮。","detail":{"background":"「外因性(醫源性)皮質醇增多症(庫欣症)」是長期使用外源性糖皮質激素:外源類固醇負回饋抑制腦下垂體ACTH→雙側腎上腺皮質萎縮(atrophy)(因失去ACTH刺激)。而內源性(ACTH依賴)庫欣症才致腎上腺增生。故外因性者為皮質萎縮。","options":{"A":"外因性皮質醇增多致腎上腺皮質萎縮—正解。","B":"瀰漫性增生見於ACTH依賴(內源)庫欣症。","C":"微結節性增生見於原發性色素結節病。","D":"巨結節性增生見於其他內源病因。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111020-77":{"quick":"胃食道逆流者食道末端出現良性柱狀上皮為化生(Barrett食道)。","detail":{"background":"「胃食道逆流(GERD)」長期刺激下,食道末端的鱗狀上皮化生(metaplasia)為含杯狀細胞的柱狀上皮(腸上皮化生)——即「巴雷特氏食道(Barrett esophagus)」(屬化生,為腺癌的癌前狀態)。異生(dysplasia,進一步癌前)、增生、轉移非此情境(良性柱狀上皮為化生)。故為化生。","options":{"A":"異生為進一步的癌前變化。","B":"增生為細胞數目增加。","C":"轉移為惡性擴散。","D":"食道柱狀上皮化生(Barrett)—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112100-76":{"quick":"大腦梗塞數月後形成囊性區域,為液化壞死。","detail":{"background":"「腦(中樞神經)梗塞」的壞死型態是液化壞死(liquefactive necrosis)——腦組織缺乏支撐性間質、富含脂質與水解酶,缺血後酶性消化液化,數週至數月後形成充滿液體的囊性(cystic)腔(可見巨噬細胞清除碎屑)。凝固性壞死(多數實質器官梗塞)、乾酪性壞死(結核)、凋亡非此。故為液化壞死。","options":{"A":"大腦梗塞為液化壞死(囊性區域)—正解。","B":"凝固性壞死見於心/腎等實質器官梗塞。","C":"乾酪性壞死見於結核。","D":"凋亡為單一細胞程序性死亡(非囊性)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112100-79":{"quick":"象腿症(elephantiasis)最可能出現於絲蟲病(淋巴阻塞)。","detail":{"background":"「象腿症(elephantiasis)」是淋巴絲蟲(班氏/馬來絲蟲)寄生淋巴管/淋巴結,造成慢性淋巴阻塞、淋巴水腫、皮膚與皮下組織纖維增厚(似象腿),即絲蟲病(filariasis)。猩紅熱(鏈球菌)、弓漿蟲病、膿痂疹非象腿症成因。故為絲蟲病。","options":{"A":"猩紅熱為鏈球菌感染。","B":"弓漿蟲病非象腿症。","C":"膿痂疹為皮膚化膿性感染。","D":"絲蟲病致淋巴阻塞性象腿症—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112100-83":{"quick":"胸腺淋巴濾泡增生最常見於重症肌無力。","detail":{"background":"「胸腺淋巴濾泡增生(thymic follicular hyperplasia)」(胸腺髓質出現具生發中心的B細胞濾泡)最常見於重症肌無力(myasthenia gravis)——約65-75%的MG病人有胸腺增生(部分為胸腺瘤),與抗乙醯膽鹼受體抗體的產生相關,故部分MG病人切除胸腺可改善。類風濕、Graves、硬皮症非典型。故為重症肌無力。","options":{"A":"類風濕性關節炎非典型。","B":"胸腺淋巴濾泡增生常見於重症肌無力—正解。","C":"Graves病非胸腺濾泡增生典型。","D":"硬皮症非此。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_113090-89":{"quick":"慢性支氣管炎的特徵不含嗜酸性球增加(那是氣喘),故B最不適當。","detail":{"background":"慢性支氣管炎(chronic bronchitis):①「黏液分泌過多(hypersecretion)」(A正確);②「支氣管上皮杯狀細胞化生/增生(黏液腺體肥大,Reid index增加)」(C正確);③「抽菸為最重要危險因子」(D正確);④「發炎以中性球、淋巴球、巨噬細胞為主,嗜酸性球增加(eosinophilia)是氣喘的特徵,非慢性支氣管炎」——故B最不適當。故B最不適當。","options":{"A":"黏液分泌過多,正確。","B":"嗜酸性球增加為氣喘特徵、非慢性支氣管炎—錯誤(正解)。","C":"杯狀細胞化生,正確。","D":"抽菸為最重要危險因子,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114020-76":{"quick":"lipofuscin(脂褐質)是脂質過氧化的聚合物,標誌細胞的自由基損傷。","detail":{"background":"「脂褐質(lipofuscin)」是脂質與磷脂的過氧化聚合物與蛋白質的複合殘渣(耗損/老化色素),沉積於心肌、肝、神經元等緩慢萎縮或老化的細胞,標誌自由基損傷與脂質過氧化(不可被溶酶體消化)。chloasma(黃褐斑/黑色素)、hemosiderin(含鐵)、ochronosis(黑尿症色素)非此。故為lipofuscin。","options":{"A":"chloasma為黑色素沉著(黃褐斑)。","B":"lipofuscin標誌自由基損傷/脂質過氧化—正解。","C":"hemosiderin為含鐵色素。","D":"ochronosis為黑尿症的色素沉積。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114020-77":{"quick":"核質凝聚(chromatin clumping)為可逆性細胞核變化;核溶解/碎裂/濃縮為不可逆(死亡)。","detail":{"background":"細胞核的變化:①「可逆性損傷時可見染色質凝聚(chromatin clumping)(輕微、可恢復)」(D為可逆);②「不可逆損傷(細胞死亡)的核變化三部曲:核濃縮(pyknosis,核濃縮深染)→核碎裂(karyorrhexis,核破碎)→核溶解(karyolysis,核消失)」(A、B、C皆不可逆)。故最可能為可逆者為核質凝聚(chromatin clumping)。","options":{"A":"核溶解為不可逆(細胞死亡)。","B":"核碎裂為不可逆。","C":"核濃縮為不可逆。","D":"核質凝聚為可逆性核變化—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114020-80":{"quick":"p53並非結合並抑制MDM2;反而MDM2抑制p53(p53誘導MDM2形成負回饋),故B不是p53功能。","detail":{"background":"p53(腫瘤抑制蛋白)的主要功能:①「使細胞週期停滯於G1(G1 arrest,經誘導p21)以修復DNA」(C);②「若損傷無法修復,引發凋亡(內在/粒線體路徑)」(D);③「促進細胞衰老(senescence)」(A)。而「MDM2抑制(降解)p53,p53誘導MDM2形成負回饋,並非p53結合並抑制MDM2」——故B不是p53的功能(關係寫反)。故B不是。","options":{"A":"促進細胞衰老為p53功能。","B":"p53不抑制MDM2(反而MDM2抑制p53)—非p53功能(正解)。","C":"使細胞週期停滯於G1為p53功能。","D":"引發凋亡內在路徑為p53功能。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114090-77":{"quick":"粒線體蛋白外漏代表細胞已進入不可逆損傷。","detail":{"background":"細胞損傷的可逆與不可逆:①「可逆性變化:內質網擴張、核醣體脫離、肝醣耗損、細胞腫脹」(B、C、D屬可逆);②「不可逆損傷的關鍵指標:嚴重粒線體損傷——粒線體膜通透性轉換、粒線體蛋白(如cytochrome c)外漏、溶酶體膜破裂、細胞膜嚴重損傷」——粒線體蛋白外漏觸發凋亡/壞死,代表不可逆。故不可逆指標為粒線體蛋白外漏(A)。","options":{"A":"粒線體蛋白外漏代表不可逆損傷—正解。","B":"內質網擴張為可逆變化。","C":"肝醣快速耗損為可逆。","D":"內質網核醣體脫離為可逆。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_115020-77":{"quick":"生理性肥大(如運動致心肌肥大)最重要的機制是PI3K/AKT路徑。","detail":{"background":"「生理性肥大(physiologic hypertrophy)」(如運動員心臟、懷孕子宮)最重要的訊息機制是PI3K/AKT路徑(由IGF-1等生長因子驅動,促進蛋白合成與細胞增大,屬有益、可逆的肥大)。而病理性肥大(如壓力負荷的心肌肥大)則較多經GPCR-鈣調神經磷酸酶等。Bax/Bcl-2(凋亡)、EGFR/RAS/RAF(增生)、Wnt/β-catenin非生理性肥大主軸。故為PI3K/AKT。","options":{"A":"PI3K/AKT路徑為生理性肥大最重要機制—正解。","B":"Bax/Bcl-2為凋亡路徑。","C":"EGFR/RAS/RAF為增生訊息。","D":"Wnt/β-catenin為發育/腫瘤路徑。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_106100-76":{"quick":"血管擴張、水腫、纖維蛋白滲出是急性發炎的特徵。","detail":{"background":"「急性發炎(acute inflammation)」的特徵是血管反應與滲出:血管擴張(充血)、血管通透性增加→水腫(滲出液)、纖維蛋白(fibrin)滲出、中性球(neutrophil)浸潤。慢性發炎以淋巴球、漿細胞、巨噬細胞與纖維化為主;乾性壞疽、肉芽腫性發炎為其他型態。故血管擴張+水腫+纖維蛋白為急性發炎。","options":{"A":"血管擴張+水腫+纖維蛋白為急性發炎特徵—正解。","B":"慢性發炎以淋巴球/漿細胞/纖維化為主。","C":"乾性壞疽為缺血壞死型態。","D":"肉芽腫性發炎以類上皮細胞/巨細胞為主。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_107100-91":{"quick":"慢性潰瘍、頻尿、恥骨上痛、膀胱壁纖維化,最符合間質性膀胱炎。","detail":{"background":"「間質性膀胱炎(interstitial cystitis,膀胱疼痛症候群)」好發中年女性:臨床恥骨上方/骨盆疼痛(膀胱充盈時加劇)、頻尿、急尿、血尿、排尿疼痛;病理可見膀胱黏膜慢性潰瘍(Hunner潰瘍)、黏膜下慢性發炎浸潤與纖維化、肥大細胞增多。息肉狀/濾泡性/出血性膀胱炎的表現不同。故為間質性膀胱炎。","options":{"A":"息肉狀膀胱炎為反應性增生。","B":"濾泡性膀胱炎見淋巴濾泡。","C":"間質性膀胱炎(慢性潰瘍/纖維化/疼痛頻尿)—正解。","D":"出血性膀胱炎多與化療/感染相關。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109020-98":{"quick":"退化性關節炎主要機轉是關節軟骨退化與軟骨細胞修復異常。","detail":{"background":"「退化性關節炎(骨關節炎osteoarthritis)」的核心機轉是關節軟骨(articular cartilage)的退化(磨損、基質流失),並軟骨細胞(chondrocyte)修復能力異常(disordered repair)(隨年齡、機械應力累積),繼發軟骨下骨硬化、骨刺、關節間隙變窄(屬非發炎性退化,與類風濕的自體免疫滑膜炎不同)。故主要機轉為軟骨退化與軟骨細胞修復異常。","options":{"A":"非以成骨細胞損傷致關節發炎為主。","B":"非滑膜細胞退化致淋巴球浸潤(那較似類風濕)。","C":"關節軟骨退化與軟骨細胞修復異常—正解。","D":"非滑膜細胞過度增生阻礙血管為主。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109100-77":{"quick":"水腫與慢性發炎相關性最低(水腫是急性發炎表現)。","detail":{"background":"「慢性發炎(chronic inflammation)」的組織表現以單核細胞浸潤(淋巴球、漿細胞、巨噬細胞)、組織破壞與纖維化(修復)、血管新生為主。而「水腫(edema)」是急性發炎的血管滲出表現,與慢性發炎的相關性最低。故相關性最低者為水腫。","options":{"A":"淋巴球與漿細胞為慢性發炎表現。","B":"巨噬細胞為慢性發炎主角。","C":"纖維化為慢性發炎修復表現。","D":"水腫為急性發炎表現、與慢性發炎相關性最低—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109100-98":{"quick":"成骨不全症的基本缺陷是第一型膠原蛋白(type I collagen)合成異常。","detail":{"background":"「成骨不全症(osteogenesis imperfecta,脆骨症)」的基本缺陷是第I型膠原蛋白(type I collagen)的合成異常(COL1A1/COL1A2基因突變)——骨基質的主要膠原缺陷→骨脆易折、藍鞏膜、牙齒發育不全、聽力障礙。第II型(軟骨)、第III型(網狀/血管)、第IV型(基底膜)膠原非主要缺陷。故為第一型膠原。","options":{"A":"成骨不全症為第一型膠原合成異常—正解。","B":"第二型膠原見於軟骨(軟骨發育不全)。","C":"第三型膠原見於Ehlers-Danlos(部分型)。","D":"第四型膠原見於基底膜(Alport症)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_110020-77":{"quick":"纖維母細胞與微血管增生混合發炎細胞,是肉芽組織(granulation tissue)的特徵。","detail":{"background":"「肉芽組織(granulation tissue)」是傷口修復早期的特徵組織:新生微血管(angiogenesis)、增生的纖維母細胞(fibroblast),疏鬆的間質中混合發炎細胞(外觀紅潤顆粒狀)。肉芽腫(granuloma)是慢性肉芽腫發炎(類上皮細胞/巨細胞)、與此不同;蟹足腫(膠原過度)、類澱粉(amyloid)亦不同。故為肉芽組織。","options":{"A":"肉芽腫為慢性肉芽腫發炎(類上皮細胞)。","B":"纖維母細胞+微血管+發炎細胞=肉芽組織—正解。","C":"蟹足腫為膠原過度增生。","D":"類澱粉為異常蛋白沉積。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111020-76":{"quick":"產生IL-17的T淋巴球(Th17)缺乏,與冷膿瘍(高IgE症候群)最有關。","detail":{"background":"「產生IL-17的T淋巴球(Th17)缺乏」見於高IgE症候群(Job症候群,STAT3缺陷):Th17缺乏→中性球募集到感染處的能力受損→金黃葡萄球菌等感染時形成冷膿瘍(cold abscess,缺乏典型紅熱痛的發炎反應)(及反覆肺/皮膚感染、濕疹、高IgE)。故Th17/IL-17缺乏與冷膿瘍最有關。","options":{"A":"中性球浸潤的炎症反而需要Th17(非缺乏)。","B":"尋常型天皰瘡為自體抗體(抗desmoglein)。","C":"類天皰瘡為自體抗體(抗BP抗原)。","D":"IL-17(Th17)缺乏與冷膿瘍最有關—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111020-95":{"quick":"緻密物沉積病(替代途徑過度活化)血清C3低,但C1(經典途徑)維持正常。","detail":{"background":"「緻密物沉積病(dense deposit disease,膜增生性腎絲球腎炎II型)」是補體替代途徑(alternative pathway)過度活化(常因C3腎炎因子C3NeF):大量消耗C3(血清C3降低),並消耗B因子、properdin;而經典途徑的C1不被活化、維持正常。故血清中最可能維持正常者為C1。","options":{"A":"C3因替代途徑活化而被消耗(降低)。","B":"C1(經典途徑)維持正常—正解。","C":"B因子(替代途徑)被消耗。","D":"血清滅菌蛋白(properdin)被消耗。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111100-83":{"quick":"心肌梗塞後心肌破裂最常見於梗塞後約3天(凝固壞死+中性球浸潤)。","detail":{"background":"心肌梗塞後的病理時程與心肌破裂:破裂風險最高在梗塞後約3-7天(尤3-5天)——此時壞死心肌最軟弱:凝固性壞死顯著、中性球浸潤清除壞死使結構脆弱,而新的肉芽組織/膠原尚未形成支撐。本題以梗塞後3天、凝固壞死+中性球浸潤(B)為最常見破裂時機與鏡下變化。故為B。","options":{"A":"梗塞後1天結構尚未最脆弱。","B":"梗塞後約3天、凝固壞死+中性球浸潤、破裂風險高—正解。","C":"7天巨噬細胞清除期(肉芽開始)。","D":"10天肉芽組織形成、較不易破裂。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112020-76":{"quick":"過多膠原堆積且超出原始傷口邊界、不消退,稱為蟹足腫(keloid)。","detail":{"background":"「蟹足腫(keloid)」是傷口癒合的異常過度纖維化:膠原蛋白過度堆積,生長超出原始傷口邊界、且不消退(好發特定體質/部位)。而「肥厚疤(hypertrophic scar)」雖也膠原過多但侷限在原傷口範圍內、可隨時間消退。肉芽腫、肉芽組織不同。故超出邊界不消退者為蟹足腫。","options":{"A":"膠原過多+超出傷口邊界+不消退=蟹足腫—正解。","B":"肥厚疤侷限於原傷口範圍且可消退。","C":"肉芽腫為慢性發炎結構。","D":"肉芽組織為修復早期組織。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112100-77":{"quick":"組織纖維化與transforming growth factor-β(TGF-β)最有關。","detail":{"background":"「組織纖維化(fibrosis)」的關鍵促纖維化細胞激素是轉化生長因子-β(TGF-β)——刺激纖維母細胞增生與膠原(細胞外基質)的合成沉積,並抑制基質降解,是慢性發炎/修復走向纖維化的核心介質。interleukin-1(促發炎)、selectin(白血球滾動黏附)、histamine(急性發炎血管反應)非主要促纖維化。故為TGF-β。","options":{"A":"TGF-β為組織纖維化最關鍵介質—正解。","B":"IL-1為促發炎細胞激素。","C":"selectin介導白血球滾動黏附。","D":"histamine介導急性血管反應。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_113090-83":{"quick":"顯微多血管炎(microscopic polyangiitis)最少出現肉芽腫(本題B、C、D均給分)。","detail":{"background":"血管炎與肉芽腫:①「顯微多血管炎(microscopic polyangiitis)」——壞死性血管炎但無肉芽腫(non-granulomatous)(MPO-ANCA相關)(B最少肉芽腫);②「Churg-Strauss(嗜酸性肉芽腫性多血管炎)有肉芽腫」;③川崎氏症、Buerger氏病(血栓閉鎖性脈管炎)典型不以肉芽腫為特徵(本題判給分)。本題公告B、C、D均給分(以microscopic polyangiitis為最典型無肉芽腫)。","options":{"A":"Churg-Strauss為嗜酸性肉芽腫性血管炎(有肉芽腫)。","B":"顯微多血管炎為非肉芽腫性血管炎—正解。","C":"川崎氏症非以肉芽腫為特徵(本題判給分)。","D":"Buerger病以血栓性為主(本題判給分)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114020-82":{"quick":"肉芽腫性多血管炎(GPA)若不治療大多預後差/致命,「大多自行康復」錯誤。","detail":{"background":"本題雙側肺空洞結節+鼻竇潰瘍+腎(新月型腎絲球腎炎)、病原陰性→肉芽腫性多血管炎(GPA,舊稱Wegener’s):①「多PR3-ANCA(c-ANCA)陽性」(A正確);②「呼吸道切片可見肉芽腫性發炎與組織壞死」(B正確);③「對免疫抑制治療(類固醇+cyclophosphamide/rituximab)反應良好」(C正確);④「若不治療,大多預後差、可致命(數月內死亡),非自行康復」——故D「不治療大多自行康復」錯誤。故D錯誤。","options":{"A":"多PR3-ANCA上升,正確。","B":"呼吸道切片可見肉芽腫性發炎與壞死,正確。","C":"對免疫抑制治療反應良好,正確。","D":"不治療大多預後差/致命(非自行康復)—錯誤(正解)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114020-86":{"quick":"肺膿瘍是化膿性(液化壞死),非壞死性肉芽腫性發炎,故B錯誤。","detail":{"background":"肺炎:①「慢性肺炎常見致病原為結核菌與黴菌」(A正確);②「肺膿瘍(lung abscess)是局部化膿性壞死(液化壞死、中性球與膿),非壞死性肉芽腫性發炎(肉芽腫見於結核/黴菌)」——故B「肺膿瘍見壞死性肉芽腫性發炎」錯誤;③「病毒性肺炎為間質淋巴球浸潤」(C正確);④「病毒性肺炎嚴重可致急性呼吸窘迫症候群(ARDS)」(D正確)。故B錯誤。","options":{"A":"結核菌與黴菌為慢性肺炎常見致病原,正確。","B":"肺膿瘍為化膿性(液化壞死)、非肉芽腫性—錯誤(正解)。","C":"病毒性肺炎為間質淋巴球浸潤,正確。","D":"病毒性肺炎嚴重可致ARDS,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114090-76":{"quick":"凝固性壞死呈現強嗜酸性紅色細胞質、模糊或微紅色細胞核。","detail":{"background":"壞死型態的鏡下特徵:「凝固性壞死(coagulative necrosis)」——細胞輪廓保留(數天),但細胞質強烈嗜酸性(紅色,蛋白變性凝固),細胞核模糊/消失(核濃縮→碎裂→溶解)(見於心、腎、脾等實質器官梗塞)。液化壞死(腦/化膿)、乾酪壞死(結核)、纖維素樣壞死(血管)的型態不同。故為凝固性壞死。","options":{"A":"液化壞死為組織液化(腦/化膿)。","B":"乾酪壞死為乳酪樣無結構(結核)。","C":"纖維素樣壞死見於血管壁(免疫複合體)。","D":"凝固性壞死=強嗜酸性紅色胞質+模糊核—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_115020-76":{"quick":"凋亡後phosphatidylserine翻轉至細胞膜外層,被巨噬細胞識別吞噬。","detail":{"background":"細胞凋亡(apoptosis)時,正常位於細胞膜內層的磷脂醯絲胺酸(phosphatidylserine)翻轉(flip)到細胞膜外層——成為「吃我(eat-me)」訊號,被巨噬細胞識別、吞噬清除(故凋亡不引起發炎)。phosphatidylcholine、sphingomyelin、glycolipid非此翻轉訊號。故為phosphatidylserine。","options":{"A":"phosphatidylcholine主要在外層(非翻轉訊號)。","B":"phosphatidylserine翻轉至外層、被巨噬細胞識別—正解。","C":"sphingomyelin非凋亡識別訊號。","D":"glycolipid非此訊號。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_106100-82":{"quick":"續發性高凝血狀態中,抽菸的血栓相對風險相對最低。","detail":{"background":"續發性(後天)高凝血狀態的血栓風險:長期臥床(靜脈鬱滯)、心肌梗塞(壁栓/組織因子)、心房顫動(左心房鬱滯易形成血栓→栓塞)屬高風險;而「抽菸」雖是動脈粥狀硬化/血栓的危險因子,但相對於上述直接造成血流鬱滯/心內血栓的因素,其血栓風險相對較低。故相對風險最低者為抽菸。","options":{"A":"長期臥床(靜脈鬱滯)血栓風險高。","B":"心肌梗塞血栓風險高。","C":"心房顫動易形成左房血栓、風險高。","D":"抽菸的血栓相對風險相對最低—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_107100-94":{"quick":"子癇前症好發於初次懷孕(初產婦),「較易發生在多次懷孕」錯誤。","detail":{"background":"本題懷孕35週高血壓+水腫+蛋白尿+肝功能異常為子癇前症(preeclampsia)/HELLP:①「好發於初次懷孕(初產婦nulliparity),非多次懷孕」——故A錯誤;②「可有血小板低下(HELLP的LP)」(B正確);③「肝臟可出現纖維蛋白血栓、出血/壞死(肝功能異常)」(C正確);④「根本治療是引產/生產(娩出胎盤)」(D正確)。故A錯誤。","options":{"A":"子癇前症好發初產婦(非多次懷孕)—錯誤(正解)。","B":"易有血小板低下,正確。","C":"肝臟可出現纖維蛋白血栓,正確。","D":"引產(生產)為合適治療,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_107100-97":{"quick":"腦小窩性梗塞是高血壓小動脈硬化所致,非DIC的結果,故D錯誤。","detail":{"background":"「腔隙性(小窩性)梗塞(lacunar infarcts)」:①「最常與高血壓相關」(A正確);②「好發於基底核、視丘、橋腦、內囊等深部(由穿通小動脈供應)」(B正確);③「梗塞灶小(直徑不超過15毫米)」(C正確);④「成因是高血壓造成的小動脈硬化(脂質玻璃樣變/微動脈瘤)阻塞,而非瀰漫性血管內凝血(DIC)的結果」——故D錯誤。故D錯誤。","options":{"A":"最常出現於高血壓,正確。","B":"好發於基底核等深部,正確。","C":"梗塞灶不超過15毫米,正確。","D":"為高血壓小動脈硬化所致、非DIC—錯誤(正解)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109020-82":{"quick":"肺梗塞的肋膜積水為發炎滲出機制,與其他三者(淋巴阻塞)不同。","detail":{"background":"水腫/積液的機制:①「血絲蟲象皮病、乳糜胸、乳癌術後(腋下淋巴結清除)上肢水腫」——皆因淋巴阻塞/淋巴回流受阻(淋巴水腫);②「肺梗塞(lung infarct)引起的肋膜積水」——是梗塞致發炎、血管通透性增加的滲出(exudate)(機制不同於淋巴阻塞)。故機制不同者為肺梗塞肋膜積水。","options":{"A":"象皮病為淋巴阻塞。","B":"乳糜胸為淋巴(胸管)阻塞。","C":"乳房術後上肢水腫為淋巴阻塞。","D":"肺梗塞肋膜積水為發炎滲出(機制不同)—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109100-81":{"quick":"深層靜脈血栓(非表層靜脈曲張)才是肺栓塞主要來源,故A錯誤。","detail":{"background":"肺血栓栓塞症:①「絕大多數栓子來自下肢深層靜脈血栓(DVT),而表層(淺層)靜脈曲張的血栓較少引起肺栓塞(較易引起肺栓塞的是DVT)」——故A錯誤(關係寫反);②「大部分肺栓塞無明顯臨床症狀(小栓子)」(B正確);③「慢性反覆肺栓塞致肺動脈高壓、肺心症」(C正確);④「因肺有雙重血供,肺出血比肺梗塞常見(梗塞多見於原有心肺疾病者)」(D正確)。故A錯誤。","options":{"A":"深層靜脈血栓才是肺栓塞主要來源(非表層曲張)—錯誤(正解)。","B":"多數肺栓塞無明顯症狀,正確。","C":"慢性肺栓塞致肺動脈高壓,正確。","D":"肺出血比肺梗塞常見,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111020-84":{"quick":"最常見的全身性血栓栓塞栓子來源為左心室壁梗塞處(壁栓)。","detail":{"background":"「全身性(動脈)血栓栓塞(systemic thromboembolism)」的栓子約80%來自心臟內血栓,最常見為左心室心肌梗塞處的壁栓(mural thrombus)(及左心房顫動的血栓、瓣膜贅生物),隨體循環栓塞至下肢、腦、脾、腎、腸。下肢深層靜脈血栓主要造成肺栓塞(非全身性)。故最常見來源為左心室壁梗塞處。","options":{"A":"下肢深層靜脈主要致肺栓塞(非全身性)。","B":"左心室壁梗塞處(壁栓)為全身性栓塞最常見來源—正解。","C":"主動脈動脈瘤栓子較少見。","D":"下肢淺層靜脈血栓較少致栓塞。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111100-82":{"quick":"產後突發呼吸困難、發紺、休克、痙攣,為羊水栓塞(肺動脈見鱗狀上皮細胞)。","detail":{"background":"本題生產後突發呼吸急促、發紺、血壓下降、痙攣、昏迷(並可DIC)——典型為羊水栓塞(amniotic fluid embolism):羊水及其內容物(胎兒鱗狀上皮細胞、胎脂、黏液、毳毛)進入母體循環、栓塞肺動脈並引發過敏樣反應與DIC,病理可在肺動脈管腔見鱗狀上皮細胞。空氣栓塞、骨髓栓塞、血栓栓塞的內容物不同。故為羊水栓塞(C)。","options":{"A":"肺動脈見空氣為空氣栓塞。","B":"肺動脈見骨髓為骨髓(脂肪)栓塞。","C":"肺動脈見鱗狀上皮細胞=羊水栓塞—正解。","D":"血栓栓塞為血栓成分。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112020-82":{"quick":"von Willebrand disease是出血傾向,不易引起血栓,故D除外。","detail":{"background":"易引起血栓(高凝血)的疾病:①「肝素引起血小板低下(HIT)」(抗體活化血小板致血栓);②「抗磷脂質抗體症候群(APS)」(動靜脈血栓、流產);③「Protein S缺乏」(抗凝蛋白缺乏→易血栓)。而「von Willebrand disease(VWD)」是von Willebrand因子缺乏/異常,造成出血傾向(止血障礙),非血栓。故不易引起血栓者為VWD。","options":{"A":"HIT易引起血栓。","B":"抗磷脂質抗體症候群易引起血栓。","C":"Protein S缺乏易引起血栓。","D":"von Willebrand disease為出血傾向(非血栓)—正解(除外)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112020-98":{"quick":"非創傷性蜘蛛膜下出血最常見成因是Willis環的囊狀動脈瘤破裂。","detail":{"background":"「非創傷性(自發性)蜘蛛網膜下腔出血(subarachnoid hemorrhage)」的最常見成因是Willis環(腦底動脈環)的囊狀(漿果狀)動脈瘤(saccular/berry aneurysm)破裂(好發於前交通、後交通、中大腦動脈分叉處)。動靜脈畸形、海綿狀血管瘤、小動脈硬化破裂較少見或致其他部位出血。故為Willis環囊狀動脈瘤破裂。","options":{"A":"動靜脈畸形破裂較少見。","B":"海綿狀血管瘤破裂少見。","C":"小動脈硬化破裂多致腦實質(高血壓性)出血。","D":"Willis環囊狀動脈瘤破裂為SAH最常見成因—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_113090-86":{"quick":"正常大小脾臟的脾梗塞最常由心臟來的栓子造成。","detail":{"background":"脾梗塞(splenic infarct):①「脾臟動脈為終末動脈(側枝循環差),故易發生梗塞」(故A「側枝豐富極少梗塞」錯誤);②「脾腫大是脾梗塞的好發因子」(故B「不是好發因子」錯誤);③「在正常大小的脾臟,最常造成脾梗塞的原因是心臟來的栓子(emboli)(如心內膜炎贅生物、左心血栓)」(C正確);④「脾梗塞多為局部蒼白(貧血性)梗塞,不致大量腹腔內出血(除非破裂)」(故D錯誤)。故C正確。","options":{"A":"脾為終末動脈、側枝差易梗塞(非極少)—錯誤。","B":"脾腫大是脾梗塞好發因子(非不是)—錯誤。","C":"正常脾的梗塞最常因心臟來的栓子—正解。","D":"脾梗塞不致大量腹腔出血—錯誤。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_113090-87":{"quick":"影響肺栓塞嚴重度最重要的因素是栓子的大小。","detail":{"background":"「肺栓塞(pulmonary embolism)」的嚴重度主要取決於栓子(embolus)的大小(以及心肺基礎狀態):大栓子(如騎跨型栓塞saddle embolus)阻塞主肺動脈→猝死、急性右心衰、休克;小栓子可能無症狀或致肺梗塞。栓塞原因、栓子成分、栓子來源相對次要。故最重要因素為栓子大小。","options":{"A":"造成栓塞的原因非最重要。","B":"栓子成分非最重要。","C":"栓子大小為影響肺栓塞嚴重度最重要因素—正解。","D":"栓子來源非最重要。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_115020-100":{"quick":"杜雷特氏出血(Duret hemorrhage)與經小腦天幕脫疝(transtentorial herniation)最有關。","detail":{"background":"「杜雷特氏出血(Duret hemorrhage)」是中腦與橋腦腦幹中線旁的繼發性出血,發生於經小腦天幕(鉤回)脫疝(transtentorial/uncal herniation)時——腦幹被向下推擠、穿通血管被牽扯撕裂所致(常為致命)。大腦鎌下脫出、扣帶脫出、小腦扁桃體脫出(致延腦受壓)非Duret出血主因。故為經小腦天幕脫疝。","options":{"A":"大腦鎌下脫出致大腦前動脈受壓。","B":"扣帶脫出非Duret出血主因。","C":"經小腦天幕脫疝致Duret出血—正解。","D":"小腦扁桃體脫出致延腦受壓(呼吸停止)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_106100-91":{"quick":"闌尾最常見的腫瘤為類癌(carcinoid tumor,神經內分泌腫瘤)。","detail":{"background":"「闌尾(appendix)」最常見的腫瘤是類癌(carcinoid tumor,高分化神經內分泌腫瘤)——多位於闌尾尖端,生長緩慢、多為偶然發現,大多數(<2cm)預後良好。黏液性腺癌、漿液性腺癌、管狀腺瘤非闌尾最常見腫瘤。故為類癌。","options":{"A":"黏液性腺癌非闌尾最常見腫瘤。","B":"漿液性腺癌非闌尾腫瘤。","C":"管狀腺瘤好發於大腸。","D":"闌尾最常見腫瘤為類癌—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_106100-93":{"quick":"扁平病灶、惡性細胞以帕哲氏病樣形式擴展於正常尿路上皮中,為原位癌(CIS)。","detail":{"background":"「膀胱原位癌(carcinoma in situ, CIS)」是扁平(非乳突狀)的高惡性度病灶:惡性細胞散布於形態正常的尿路上皮細胞之間,以帕哲氏病樣(pagetoid)方式水平擴展(高度惡性、易進展為侵襲癌)。乳突狀腫瘤(PUNLMP、低/高惡性度乳突狀癌)為外生乳突狀型,與此扁平型不同。故為原位癌。","options":{"A":"扁平+pagetoid擴展=原位癌(CIS)—正解。","B":"PUNLMP為乳突狀低惡性傾向。","C":"低惡性度乳突狀癌為外生乳突型。","D":"高惡性度乳突狀癌為外生乳突型。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_106100-96":{"quick":"20歲女性界限明顯、可移動的乳房腫瘤,最可能為纖維腺瘤。","detail":{"background":"「纖維腺瘤(fibroadenoma)」是年輕女性(20-30歲)最常見的良性乳房腫瘤:臨床為界限清楚、可自由移動、無痛、橡皮樣硬度的腫塊(受荷爾蒙影響)。慢性乳房炎(發炎)、管內乳突瘤(乳頭血樣分泌)、侵襲性管腺癌(老年、固定、界限不清)的表現不同。故為纖維腺瘤。","options":{"A":"慢性乳房炎為發炎(非界限清楚腫塊)。","B":"纖維腺瘤(年輕女性、界限清楚可移動)—正解。","C":"管內乳突瘤致乳頭血樣分泌。","D":"侵襲性管腺癌多固定、界限不清(老年)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_107100-80":{"quick":"癌細胞「自給自足生長訊息」、不需大量外來生長因子,故D錯誤。","detail":{"background":"癌症的基本特徵(Hanahan & Weinberg):①「生長訊息自給自足(self-sufficiency)(不需外來生長因子)」(A正確);②「DNA修復缺陷(基因組不穩定)與逃避凋亡(evasion of apoptosis)」(B正確);③「具侵襲與轉移能力」(C正確);④「因自給自足生長訊息,不需大量外來生長因子」——故D「需大量生長因子」錯誤(與A矛盾)。故D錯誤。","options":{"A":"生長訊息自給自足,正確。","B":"DNA修復缺陷與逃避凋亡,正確。","C":"具侵襲與轉移能力,正確。","D":"癌細胞不需大量外來生長因子(自給自足)—錯誤(正解)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_107100-93":{"quick":"漿液性子宮內膜癌屬第二型(非第一型),故B錯誤。","detail":{"background":"子宮內膜癌分兩型:①「第一型(子宮內膜樣腺癌)——與雌激素(無對抗的動情素)刺激有關,前驅病灶為子宮內膜增生(hyperplasia),預後較好(常PTEN突變)」(A、D正確);②「第二型(漿液性癌、亮細胞癌)——與雌激素無關,多TP53突變、預後較差」——故B「漿液性癌屬第一型」錯誤(屬第二型);③第二型預後較差(C正確)。故B錯誤。","options":{"A":"第一型與動情素刺激有關,正確。","B":"漿液性癌屬第二型(非第一型)—錯誤(正解)。","C":"第二型預後較差,正確。","D":"子宮內膜增生為第一型前驅病灶,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_107100-96":{"quick":"兒童小腦毛狀星細胞瘤的特徵是Rosenthal纖維;生長慢、界限清楚。","detail":{"background":"「毛狀星細胞瘤(pilocytic astrocytoma, WHO grade I)」好發兒童小腦:①生長緩慢、界限清楚(囊性+壁結節),預後良好(故A「生長迅速」、D「廣泛浸潤」錯誤);②「鏡下常見羅森賽纖維(Rosenthal fibers)與嗜酸性顆粒小體」(C正確);③好發兒童(非老年大腦)(故B錯誤)。故C正確。","options":{"A":"生長緩慢(非迅速)—錯誤。","B":"好發兒童小腦(非老年大腦)—錯誤。","C":"常見羅森賽纖維(Rosenthal fibers)—正解。","D":"界限清楚、不廣泛浸潤—錯誤。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108030-80":{"quick":"癌症惡體質(cachexia)主因是巨噬細胞與腫瘤產生的TNF(①②)。","detail":{"background":"「癌症惡體質(cachexia)」(消瘦、肌肉與脂肪流失、厭食)的主要機制是促發炎/分解代謝細胞激素——尤其TNF-α(由巨噬細胞與腫瘤細胞產生)(及IL-1、IL-6、腫瘤產生的蛋白脂質動員因子)。故主因為①巨噬細胞TNF與②腫瘤TNF(12)。","options":{"A":"①巨噬細胞TNF+②腫瘤TNF為惡體質主因—正解。","B":"組合不符。","C":"組合不符。","D":"組合不符。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108030-86":{"quick":"腫瘤表現synaptophysin與chromogranin(神經內分泌標記),為嗅母神經胚細胞癌。","detail":{"background":"「synaptophysin與chromogranin」是神經內分泌(neuroendocrine)分化的標記。上呼吸道(鼻腔)腫瘤表現此二者,最可能為嗅母神經胚細胞癌(olfactory neuroblastoma / esthesioneuroblastoma)(源自嗅神經上皮的神經內分泌腫瘤)。鼻咽/喉鱗狀細胞癌(細胞角蛋白)、NUT中線癌(NUT基因)非神經內分泌。故為嗅母神經胚細胞癌。","options":{"A":"鼻咽上皮細胞癌為鱗狀(非神經內分泌)。","B":"嗅母神經胚細胞癌(神經內分泌標記)—正解。","C":"喉頭上皮細胞癌為鱗狀。","D":"NUT中線癌為NUT基因重組腫瘤。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108100-80":{"quick":"肺癌合併高血鈣最可能為鱗狀細胞癌(分泌PTHrP)。","detail":{"background":"「肺癌合併高血鈣(hypercalcemia)」最可能是鱗狀細胞癌(squamous cell carcinoma)——分泌副甲狀腺素相關蛋白(PTHrP)造成體液性高血鈣(副贅瘤症候群)。小細胞癌則多分泌ACTH(庫欣)或ADH(SIADH);腺癌、多形性癌非典型高血鈣。故為鱗狀細胞癌。","options":{"A":"Adenocarcinoma非典型高血鈣。","B":"Pleomorphic carcinoma非典型。","C":"Small cell carcinoma多致SIADH/庫欣。","D":"Squamous cell carcinoma分泌PTHrP致高血鈣—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108100-81":{"quick":"Li-Fraumeni症候群與TP53基因的胚系突變關係最高。","detail":{"background":"「Li-Fraumeni症候群」是TP53(p53)胚系(germline)突變的遺傳性癌症易感症候群:發病年齡早、同時/先後發生多種癌症(乳癌、肉瘤、腦瘤、白血病、腎上腺皮質癌等)。RB(視網膜母細胞瘤)、WT-1(Wilms瘤)、BRCA1/2(乳癌卵巢癌)為其他遺傳癌基因。故為TP53。","options":{"A":"RB與視網膜母細胞瘤相關。","B":"Li-Fraumeni為TP53胚系突變—正解。","C":"WT-1與Wilms瘤相關。","D":"BRCA1/2與遺傳性乳癌卵巢癌相關。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108100-90":{"quick":"β-catenin活化型肝細胞腺瘤並非佔所有肝腺瘤中最多(僅少數但易惡性化),故C錯誤。","detail":{"background":"肝細胞腺瘤(hepatocellular adenoma):①「為良性肝細胞增生」(A正確);②「與青年型成人糖尿病第3型(MODY3,HNF1α突變)相關(HNF1α失活型)」(B正確);③「β-catenin活化型腺瘤佔少數(約10%),並非所有肝腺瘤中最多/最大宗,但惡性轉化風險最高」——故C(指其佔所有腺瘤的比例敘述)錯誤;④「gp130(IL6ST)突變見於發炎型(inflammatory)腺瘤」(D正確)。故C錯誤。","options":{"A":"為良性肝細胞增生,正確。","B":"與MODY3(HNF1α)相關,正確。","C":"β-catenin活化型非佔所有腺瘤最多(僅少數但易惡性)—錯誤(正解)。","D":"gp130突變見於發炎型腺瘤,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108100-92":{"quick":"FGFR3基因突變最常見於非侵襲性低惡性度泌尿上皮癌。","detail":{"background":"膀胱泌尿上皮癌的分子路徑:①「非侵襲性低惡性度乳突狀泌尿上皮癌」——最常見FGFR3基因突變(及HRAS),走乳突狀、低惡性路徑;②「高惡性度、原位癌、侵襲性癌」——多TP53、RB異常(走侵襲路徑)。故FGFR3突變最常見於非侵襲性低惡性度乳突狀癌。","options":{"A":"非侵襲性低惡性度泌尿上皮癌最常FGFR3突變—正解。","B":"非侵襲性高惡性度多TP53/RB異常。","C":"原位癌多TP53/RB異常。","D":"侵襲性高惡性度多TP53/RB異常。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108100-95":{"quick":"前列腺癌常為8q24增益(MYC)而非缺失,故「8q24缺失」不是常見變化。","detail":{"background":"前列腺癌常見的基因變化:①「TMPRSS2-ERG/TMPRSS2-ETV1基因融合(最常見)」(A為常見);②「PTEN基因缺失(腫瘤抑制失活)」(C為常見);③「TP53缺失/突變(進展期)」(D為常見);④「8q24(MYC所在)常為增益/擴增(amplification),而非缺失(deletion)」——故B「染色體8q24缺失」不是前列腺癌常見變化。故B不是。","options":{"A":"TMPRSS2-ERG融合為常見變化。","B":"8q24應為增益(非缺失)—不是常見變化(正解)。","C":"PTEN缺失為常見變化。","D":"TP53缺失/突變為常見變化。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108100-96":{"quick":"成人卵黃囊瘤常與其他成分混合(非單一型態),故A較不正確。","detail":{"background":"成人睪丸生殖細胞瘤:①「成人卵黃囊瘤(yolk sac tumor)常與胚胎癌等其他成分混合(混合型生殖細胞瘤),而非單一組織型態(純卵黃囊瘤多見於嬰幼兒)」——故A較不正確;②「精母細胞瘤(seminoma)是最常見的單一型態」(B正確);③「胚胎癌生物特性較精母細胞瘤惡性(更具侵襲性)」(C正確);④「純絨毛膜癌罕見(多為混合成分)」(D正確)。故A較不正確。","options":{"A":"成人卵黃囊瘤常與其他成分混合(非單一型態)—錯誤(正解)。","B":"精母細胞瘤為最常見型態,正確。","C":"胚胎癌較精母細胞瘤惡性,正確。","D":"純絨毛膜癌罕見,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109020-75":{"quick":"ixabepilone作用於M期(微管);irinotecan作用於S期(本題B、C均給分)。","detail":{"background":"細胞週期專一性抗癌藥的作用期配對:①「ixabepilone(epothilone類,穩定微管)——M期(有絲分裂)」(C正確);②「irinotecan(拓樸異構酶I抑制)——S期(DNA合成)」(B亦正確);③「capecitabine(5-FU前驅,抗代謝)——S期(非M期,故A錯)」;④「vincristine(抗微管)——M期(非S期,故D錯)」。本題公告「B、C均給分」。","options":{"A":"capecitabine作用S期(非M期)—錯誤。","B":"irinotecan作用S期(本題判給分)。","C":"ixabepilone作用M期—正解。","D":"vincristine作用M期(非S期)—錯誤。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109020-81":{"quick":"乳癌相對較少發生BRAF V600E突變。","detail":{"background":"「BRAF V600E突變」常見於惡性黑色素瘤、大腸癌、甲狀腺乳突狀癌(及毛細胞白血病)。而「乳癌(breast cancer)」相對較少發生BRAF V600E突變(乳癌驅動以ER/HER2、PIK3CA、TP53為主)。故較少者為乳癌。","options":{"A":"乳癌較少BRAF V600E突變—正解。","B":"大腸癌常有BRAF V600E。","C":"惡性黑色素瘤常有BRAF V600E。","D":"甲狀腺乳突狀癌常有BRAF V600E。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109020-86":{"quick":"鼻腔血管纖維瘤源自鼻腔後側壁富纖維血管的間質,B正確。","detail":{"background":"「鼻咽血管纖維瘤(nasopharyngeal angiofibroma)」:①「好發於青春期男性(青少年)(非中老年)」(故A錯誤);②「一般認為源自鼻腔後側壁/蝶腭孔附近富含纖維血管的間質」(B正確);③「非鼻中隔壞死性潰瘍的常見原因」(故C錯誤);④「雖組織學良性,但局部侵襲性強、易復發、可致大量出血(危及生命)」(故D錯誤)。故B正確。","options":{"A":"好發青少年男性(非中老年)—錯誤。","B":"源自鼻腔後側壁富纖維血管間質—正解。","C":"非鼻中隔壞死潰瘍常見原因—錯誤。","D":"雖良性但局部侵襲、易復發出血—錯誤。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109020-96":{"quick":"大部分無性細胞瘤(dysgerminoma)發生於青春期至30歲(非10歲以下),故C較不正確。","detail":{"background":"卵巢生殖細胞瘤:①「良性囊性畸胎瘤(皮樣囊腫)為最常見的卵巢生殖細胞瘤」(A正確);②「無性細胞瘤(dysgerminoma)為最常見的惡性卵巢生殖細胞瘤」(B正確);③「無性細胞瘤好發於青春期至30歲(年輕女性),而非10歲以下」——故C較不正確;④「卵黃囊瘤為第二常見惡性生殖細胞瘤,分泌AFP」(D正確)。故C較不正確。","options":{"A":"良性囊性畸胎瘤為最常見卵巢生殖細胞瘤,正確。","B":"無性細胞瘤為最常見惡性卵巢生殖細胞瘤,正確。","C":"無性細胞瘤好發青春期至30歲(非10歲以下)—錯誤(正解)。","D":"卵黃囊瘤分泌AFP、為第二常見惡性,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109020-97":{"quick":"完全性葡萄胎比不完全性有較高絨毛膜癌風險,B較不正確。","detail":{"background":"葡萄胎(hydatidiform mole):①「完全性葡萄胎遺傳物質皆為父源(46,XX,空卵受精)」(A正確);②「完全性葡萄胎發生絨毛膜癌與侵入性葡萄胎的風險較不完全性高,故不完全性比完全性風險高錯誤」——故B較不正確;③完全性比不完全性侵入性葡萄胎風險高(C正確);④「不完全性葡萄胎為母源+父源(三倍體,常69條)」(D正確)。故B較不正確。","options":{"A":"完全性葡萄胎遺傳物質皆父源,正確。","B":"完全性(非不完全性)絨毛膜癌風險較高—錯誤(正解)。","C":"完全性侵入性葡萄胎風險較高,正確。","D":"不完全性為母源加父源(三倍體),正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109020-100":{"quick":"髓母細胞瘤分子分類中WNT type的預後最佳。","detail":{"background":"「髓母細胞瘤(medulloblastoma, WHO grade IV)」的分子分類分四型:WNT型、SHH型、Group 3、Group 4。其中WNT型預後最佳(存活率最高);Group 3(常MYC擴增)預後最差。故預後最佳者為WNT型。","options":{"A":"WNT型髓母細胞瘤預後最佳—正解。","B":"SHH型預後中等。","C":"Group 3預後最差。","D":"Group 4預後中等。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109100-80":{"quick":"惡性腫瘤中最常因啟動子甲基化而基因靜默的是p16(CDKN2A)。","detail":{"background":"「基因靜默(gene silencing,常經啟動子CpG島過度甲基化)」使腫瘤抑制基因失活。在惡性腫瘤中,p16/INK4a(CDKN2A)是最常因啟動子甲基化靜默的腫瘤抑制基因之一(失去CDK4/6抑制→週期失控)。CDK4、MDM2(致癌基因,常擴增而非靜默)、EWS(融合)非典型靜默。故為p16。","options":{"A":"CDK4為致癌(常擴增、非靜默)。","B":"MDM2為致癌(常擴增)。","C":"p16(CDKN2A)最常因甲基化靜默—正解。","D":"EWS常為基因融合。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109100-86":{"quick":"倒生型Schneiderian乳頭瘤局部切除易復發,B正確。","detail":{"background":"鼻竇Schneiderian乳頭瘤:①分倒生型(inverted)、外生型(exophytic/蕈狀)、嗜酸細胞型(oncocytic/圓柱型)(非圓柱型為主分類描述,A敘述不準);②倒生型局部切除易切不乾淨而復發(須完整切除)(B正確);③外生型好發年輕男性鼻中隔(與HPV相關),倒生型好發中老年男性側壁(C敘述不準);④倒生型有惡性轉化(鱗癌)之虞(故D無惡性之虞錯誤)。故B正確。","options":{"A":"分類描述不準(嗜酸細胞型非圓柱型)。","B":"倒生型局部切除易復發—正解。","C":"外生型好發年輕男性鼻中隔(敘述對象不準)。","D":"倒生型可惡性轉化(非無虞)—錯誤。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109100-94":{"quick":"甲狀腺乳突狀癌的典型核變化不含巨大紅核仁,故C不是。","detail":{"background":"甲狀腺乳突狀癌(papillary carcinoma)的典型細胞核特徵:①「毛玻璃樣核(ground-glass / Orphan Annie eye nuclei)」(A);②「核內假包涵體(intranuclear pseudo-inclusions)」(B);③「核溝(intranuclear grooves)」(D)。而「巨大紅(嗜酸性)核仁(giant red nucleoli)」不是乳突狀癌的典型核變化(較見於其他腫瘤)。故不是者為C。","options":{"A":"毛玻璃樣核為典型特徵。","B":"核內假包涵體為典型特徵。","C":"巨大紅核仁非乳突狀癌典型核變化—正解(不是)。","D":"核溝為典型特徵。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109100-96":{"quick":"BPH主要為間質與上皮的結節性增生(間質為主),「主要是上皮大量增生」較不正確。","detail":{"background":"良性前列腺增生(BPH):①「50歲以上男性最常見的良性前列腺疾病」(A正確);②「組織學為前列腺上皮與間質(stroma)的結節性增生(nodular hyperplasia),好發移行區」(B正確);③「致病機轉以間質(平滑肌/纖維)增生為主(並上皮增生),非單純上皮細胞大量增生」——故C較不正確;④「雄性素(DHT)在BPH形成很重要(故finasteride有效)」(D正確)。故C較不正確。","options":{"A":"50歲以上最常見良性前列腺疾病,正確。","B":"上皮與間質結節性增生,正確。","C":"BPH以間質增生為主(非僅上皮大量增生)—錯誤(正解)。","D":"雄性素在BPH形成很重要,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_110020-80":{"quick":"黃麴毒素B1的致癌機制主要造成TP53(密碼子249)基因突變。","detail":{"background":"「黃麴毒素B1(aflatoxin B1)」(黴菌Aspergillus污染穀物/堅果)是強力肝致癌物:其致癌機制是造成TP53基因特定密碼子249(R249S)的突變,與肝細胞癌(尤其合併B型肝炎時協同)相關。MYC、RAS、RB非黃麴毒素的典型標靶。故為TP53。","options":{"A":"MYC非黃麴毒素典型標靶。","B":"RAS非黃麴毒素典型標靶。","C":"RB非黃麴毒素典型標靶。","D":"黃麴毒素致TP53(密碼子249)突變—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_110020-81":{"quick":"造血系統惡性腫瘤活化致癌基因最常見的染色體核型改變為轉位(translocation)。","detail":{"background":"「造血系統(白血病/淋巴瘤)惡性腫瘤」活化致癌基因最常見的染色體核型改變是轉位(translocation)——如t(9;22)(BCR-ABL,CML)、t(8;14)(MYC-IgH,Burkitt)、t(15;17)(PML-RARA,APL),把致癌基因置於活躍啟動子下或形成融合致癌蛋白。缺失、基因擴增、非整倍體相對非造血腫瘤活化致癌基因的最常見方式。故為轉位。","options":{"A":"轉位為造血腫瘤活化致癌基因最常見核型改變—正解。","B":"缺失多使腫瘤抑制基因失活。","C":"基因擴增較常見於實質腫瘤。","D":"非整倍體非活化致癌基因主要方式。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_110020-86":{"quick":"角化型鱗狀細胞癌對放射治療反應較非角化型差,D正確。","detail":{"background":"鼻咽癌(NPC):①WHO分角化型鱗癌、非角化型癌(分化型/未分化型)(非腺癌,故A錯誤);②EBER原位雜交偵測腫瘤細胞核內EBV的RNA(EBER)(非DNA),故B敘述不準;③預後與組織型別有關(未分化型對放療較敏感、預後較好),故C無關錯誤;④角化型鱗癌對放射治療的反應較非角化型差(非角化/未分化型對放療敏感)(D正確)。故D正確。","options":{"A":"WHO分型為鱗癌/非角化癌(非腺癌)—錯誤。","B":"EBER偵測的是EBV RNA(非DNA)—不準。","C":"預後與組織型別有關(非無關)—錯誤。","D":"角化型鱗癌對放療反應較非角化型差—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_110020-94":{"quick":"甲狀腺髓質癌源自C細胞,腫瘤間常見類澱粉沉積。","detail":{"background":"「甲狀腺髓質癌(medullary carcinoma)」源自甲狀腺濾泡旁C細胞(C-cell,分泌降鈣素calcitonin):腫瘤細胞間常見類澱粉(amyloid)沉積(由降鈣素衍生),與MEN2(RET突變)相關。砂樣小體(psammoma bodies)是乳突狀癌的特徵;濾泡細胞為濾泡癌/乳突癌來源。故C細胞來源+類澱粉沉積。","options":{"A":"C細胞來源但砂樣小體是乳突狀癌特徵—錯誤。","B":"C細胞來源+類澱粉沉積—正解。","C":"濾泡細胞+砂樣小體非髓質癌。","D":"濾泡細胞來源不符髓質癌。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_110020-97":{"quick":"三歲以下小孩最常見的睪丸腫瘤為卵黃囊瘤(yolk sac tumor)。","detail":{"background":"「三歲以下嬰幼兒」最常見的睪丸腫瘤是卵黃囊瘤(yolk sac tumor,內胚竇瘤)——分泌AFP,為嬰幼兒睪丸最常見的生殖細胞瘤(預後相對較好)。精母細胞瘤(成人)、絨毛膜癌、胚胎癌好發成人。故三歲以下最常見為卵黃囊瘤。","options":{"A":"精母細胞瘤好發成人。","B":"卵黃囊瘤為三歲以下最常見睪丸腫瘤—正解。","C":"絨毛膜癌好發成人(罕見)。","D":"胚胎癌好發成人。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_110020-98":{"quick":"低惡性度骨肉瘤(如parosteal)才有12q13-15擴增,「大多數low-grade因此擴增」敘述被判錯。","detail":{"background":"骨肉瘤(osteosarcoma):①「12q13-15擴增(MDM2/CDK4)是低惡性度(parosteal)骨肉瘤的特徵,但多數(高惡性度)原發性骨肉瘤核型複雜,故A大多數low-grade osteosarcoma因12q擴增的概括敘述被判為錯誤」——A錯誤;②「原發性骨肉瘤好發10-20歲青少年(膝部)」(B正確);③「Li-Fraumeni(胚系TP53突變)者風險高」(C正確);④病理診斷主要依據惡性細胞直接產生類骨(osteoid)(D正確)。故A錯誤。","options":{"A":"12q擴增為parosteal(低惡性)特徵、非大多數骨肉瘤—錯誤(正解)。","B":"原發性骨肉瘤好發10-20歲,正確。","C":"Li-Fraumeni者風險高,正確。","D":"診斷依據為惡性細胞產生類骨,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111020-78":{"quick":"Ewing肉瘤家族腫瘤的特徵染色體變化為t(11;22)(q24;q12)。","detail":{"background":"「Ewing肉瘤家族腫瘤(ESFT)」的分子診斷特徵是染色體轉位t(11;22)(q24;q12),形成EWSR1-FLI1融合基因(致癌轉錄因子)(好發兒童青少年長骨/骨盆,小圓藍細胞瘤)。trisomy 22、1p19q共缺失(寡突膠質瘤)、N-MYC擴增(神經母細胞瘤)非ESFT。故為t(11;22)(q24;q12)。","options":{"A":"trisomy 22非ESFT診斷依據。","B":"t(11;22)(q24;q12)(EWSR1-FLI1)為ESFT特徵—正解。","C":"1p19q共缺失見於寡突膠質瘤。","D":"N-MYC擴增見於神經母細胞瘤。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111020-79":{"quick":"7歲兒童股骨遠端小、偏心、多葉狀骨皮質病灶,最可能為纖維皮質缺損。","detail":{"background":"「纖維皮質缺損(fibrous cortical defect,非骨化性纖維瘤的小型)」是兒童/青少年常見、良性的骨皮質病變:典型為股骨遠端等長骨幹骺端皮質偏心(eccentric)、小型(<0.5cm)、多葉狀、邊界硬化的透亮病灶,多無症狀、偶然發現、自行消退。纖維異生(磨砂玻璃)、巨細胞瘤(骨骺、年輕成人)、軟骨肉瘤(成人惡性)的表現不同。故為纖維皮質缺損。","options":{"A":"纖維皮質缺損(兒童股骨遠端小偏心病灶)—正解。","B":"纖維異生呈磨砂玻璃狀。","C":"巨細胞瘤好發年輕成人骨骺。","D":"軟骨肉瘤為成人惡性腫瘤。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111020-81":{"quick":"與DNA病毒相關、AIDS病人較易得的腫瘤含腦淋巴瘤、卡波西肉瘤、子宮頸癌(①②③)。","detail":{"background":"AIDS(免疫缺陷)病人較易得的病毒相關腫瘤(多與DNA病毒有關):①「中樞神經淋巴瘤(EBV)」;②「卡波西肉瘤(Kaposi sarcoma)(HHV-8)」;③「子宮頸癌/肛門癌(HPV)」(及B/C肝相關肝癌)。本題①②③皆為DNA病毒相關、AIDS易得的腫瘤(123)。故為①②③。","options":{"A":"①②③(腦淋巴瘤/卡波西/子宮頸)皆DNA病毒相關、AIDS易得—正解。","B":"遺漏③。","C":"遺漏①。","D":"遺漏②。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111020-97":{"quick":"診斷副甲狀腺癌最可靠的條件是腫瘤轉移(或明確侵犯)。","detail":{"background":"「副甲狀腺癌(parathyroid carcinoma)」與副甲狀腺腺瘤在組織學上不易區別(細胞型態、有絲分裂、核仁、壞死皆不可靠)。診斷副甲狀腺癌最可靠的確定惡性條件是腫瘤轉移(metastasis)或明確侵犯鄰近組織/血管(惡性行為的證據)。故最可靠為腫瘤轉移。","options":{"A":"腫瘤轉移為診斷副甲狀腺癌最可靠條件—正解。","B":"有絲分裂不可靠。","C":"大核仁不可靠。","D":"腫瘤壞死不可靠。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111020-100":{"quick":"雙側實質性卵巢腫瘤(轉移性印戒細胞)為克魯肯氏瘤(Krukenberg tumor)。","detail":{"background":"「克魯肯氏瘤(Krukenberg tumor)」是轉移至卵巢的印戒細胞癌(signet-ring cell),最常轉移自胃(及大腸)的印戒細胞腺癌,典型為雙側實質性卵巢腫瘤,鏡下見黏液內的印戒細胞散布於纖維間質。類癌、布雷納瘤(Brenner)、卵巢甲狀腺腫(struma ovarii)為原發卵巢腫瘤,非此。故為克魯肯氏瘤。","options":{"A":"類癌為神經內分泌腫瘤。","B":"雙側實質性卵巢轉移性印戒細胞=Krukenberg瘤—正解。","C":"布雷納瘤為移行上皮腫瘤。","D":"卵巢甲狀腺腫為單胚層畸胎瘤。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111100-88":{"quick":"60歲抽菸者肺部腫瘤(中央型、角化珠/細胞間橋),最可能為鱗狀細胞癌。","detail":{"background":"本題60歲抽菸、咳嗽胸痛體重下降、肺部腫瘤(組織圖)——抽菸相關、典型中央型、鏡下見角化珠(keratin pearl)與細胞間橋(intercellular bridge)者為鱗狀細胞癌(squamous cell carcinoma)。小細胞癌(神經內分泌、小藍細胞)、腺癌(腺體/黏液、周邊型)、分化不良癌的型態不同。故為鱗狀細胞癌。","options":{"A":"小細胞癌為小藍細胞神經內分泌型。","B":"腺癌多周邊型、腺體分化。","C":"鱗狀細胞癌(抽菸、中央型、角化珠)—正解。","D":"分化不良癌無明確分化。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111100-89":{"quick":"肺鱗狀細胞癌最可能血行轉移至肝臟。","detail":{"background":"承上題(肺鱗狀細胞癌),其血行轉移的常見器官包括肝臟、腎上腺、骨、腦等。本題選項中以肝臟為最可能的轉移處(肝為血行轉移的常見標的器官)。皮膚、心臟、脾臟相對少見。故為肝臟。補充:肺癌的轉移途徑包含直接侵犯、淋巴轉移(肺門/縱隔淋巴結)與血行轉移;血行轉移好發於肝、腎上腺、骨、腦,故臨床對肺癌病人常評估這些器官以判定分期與治療。","options":{"A":"皮膚轉移較少見。","B":"心臟轉移較少見。","C":"肺癌常血行轉移至肝臟—正解。","D":"脾臟轉移少見。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111100-92":{"quick":"最常見的唾液腺良性腫瘤為多形性腺瘤(pleomorphic adenoma)。","detail":{"background":"「多形性腺瘤(pleomorphic adenoma,混合瘤)」是最常見的唾液腺良性腫瘤(好發腮腺),組織學同時有上皮與間質(軟骨樣/黏液樣基質)分化,切除不全易復發。Warthin瘤(第二常見、雙側、抽菸相關)、嗜酸細胞瘤、基底細胞腺瘤較少見。故最常見良性者為多形性腺瘤。","options":{"A":"多形性腺瘤為最常見唾液腺良性腫瘤—正解。","B":"Warthin瘤為第二常見。","C":"嗜酸細胞瘤少見。","D":"基底細胞腺瘤少見。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111100-96":{"quick":"尖狀濕疣的koilocytic atypia在上皮表淺層而非基底層,故D較不正確(本題A、D均給分)。","detail":{"background":"尖狀濕疣(condyloma acuminatum):①多為良性,由低危險型HPV(6、11)引起,一般非癌前(A判給分);②與HPV感染有關(B正確);③臨床常多發(C正確);④其空泡狀異常(koilocytic atypia,挖空細胞)出現在上皮表淺(上層)棘細胞層,而非基底層——故D較不正確。本題公告A、D均給分。","options":{"A":"為良性、一般非癌前(本題判給分)。","B":"與HPV感染有關,正確。","C":"多發病灶較常見,正確。","D":"koilocytic atypia在表淺層(非基底層)—錯誤(正解)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111100-97":{"quick":"化生癌(metaplastic carcinoma)在所列乳癌中預後最差。","detail":{"background":"乳癌組織型與預後:①「化生癌(metaplastic carcinoma)」——常為三陰性(ER/PR/HER2陰性)、侵襲性強、預後最差;②「管狀癌(tubular)、黏液癌(mucinous)預後較好」;③侵襲性小葉癌預後中等。故預後最差者為化生癌。","options":{"A":"化生癌預後最差—正解。","B":"侵襲性小葉癌預後中等。","C":"管狀癌預後較好。","D":"黏液癌預後較好。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112020-86":{"quick":"肺鱗狀細胞癌相對於其他型態最常出現高鈣血症(PTHrP),D最適當。","detail":{"background":"肺鱗狀細胞癌:①「男性多於女性(與抽菸相關)」(故A錯誤);②通常發生於肺中央(中心)區域(支氣管)(故B周邊錯誤);③EGFR突變多見於腺癌(非鱗癌)(故C錯誤);④相對於其他組織型,最常出現高鈣血症(分泌PTHrP)(副贅瘤症候群)(D正確)。故D最適當。","options":{"A":"男性多於女性—錯誤。","B":"發生於肺中央(非周邊)—錯誤。","C":"EGFR突變多在腺癌(非鱗癌)—錯誤。","D":"鱗癌最常出現高鈣血症(PTHrP)—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112020-96":{"quick":"卵巢漿液性癌常雙側侵犯,「兩側侵犯比例很低」最不適當。","detail":{"background":"卵巢上皮性腫瘤(源自穆勒氏上皮):①「主要型含漿液性、黏液性、子宮內膜樣」(A正確);②「漿液性癌為最常見,常雙側(兩側卵巢)侵犯,故B兩側侵犯比例很低最不適當」——B錯誤;③「漿液性癌分高惡性度與低惡性度」(C正確);④「第二常見組織型為子宮內膜樣癌」(D正確)。故B最不適當。","options":{"A":"主要型含漿液/黏液/子宮內膜樣,正確。","B":"漿液性癌常雙側侵犯(非比例很低)—錯誤(正解)。","C":"漿液性癌分高/低惡性度,正確。","D":"第二常見為子宮內膜樣癌,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112020-97":{"quick":"卵巢上皮癌第二型(type II)為高惡性度漿液性癌。","detail":{"background":"卵巢上皮癌的二元發生機轉:①「第一型(type I)」——低惡性度漿液性癌、黏液性、子宮內膜樣、亮細胞癌,由交界性腫瘤逐步進展(KRAS/BRAF/PTEN等)、進展慢;②「第二型(type II)」——高惡性度漿液性癌(high-grade serous carcinoma),多TP53突變、源自輸卵管漿液性上皮內癌(STIC)、侵襲性高。故第二型為高惡性度漿液性癌。","options":{"A":"子宮內膜樣癌屬第一型。","B":"亮細胞癌屬第一型。","C":"低惡性度漿液性癌屬第一型。","D":"高惡性度漿液性癌屬第二型—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112100-80":{"quick":"非典型有絲分裂(atypical mitoses)最不可能出現在良性細胞。","detail":{"background":"惡性腫瘤的細胞學特徵中:「非典型有絲分裂(atypical/abnormal mitoses,如三極/多極分裂)」最不可能出現在良性細胞(是惡性的可靠指標)。而高核質比、深染(hyperchromasia)、多形性(pleomorphism)雖在惡性常見,但程度較輕時也可能出現在反應性/良性細胞。故最不可能出現於良性者為非典型有絲分裂。","options":{"A":"非典型有絲分裂最不可能出現在良性細胞—正解。","B":"高核質比可見於某些良性反應性細胞。","C":"深染可見於某些良性細胞。","D":"多形性可見於某些良性反應性細胞。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112100-90":{"quick":"最常見的唾液腺惡性腫瘤是黏液表皮樣癌(非鱗狀細胞癌),故B最不適當。","detail":{"background":"唾液腺腫瘤:①「多形性腺瘤為最常見良性」(A正確);②「最常見的惡性唾液腺腫瘤是黏液表皮樣癌(mucoepidermoid carcinoma),而非鱗狀細胞癌」——故B最不適當;③「黏液表皮樣癌常見MAML2基因轉位」(C正確);④「腺樣囊狀癌常見神經周圍侵犯(perineural invasion)」(D正確)。故B最不適當。","options":{"A":"多形性腺瘤為最常見良性,正確。","B":"最常見惡性為黏液表皮樣癌(非鱗狀細胞癌)—錯誤(正解)。","C":"黏液表皮樣癌常見MAML2轉位,正確。","D":"腺樣囊狀癌常見神經周圍侵犯,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112100-91":{"quick":"腮腺雙層上皮裂隙覆蓋豐富淋巴的腫瘤為Warthin瘤;「上皮間質分化含軟骨樣」是多形性腺瘤,故C不符。","detail":{"background":"本題腮腺(耳前)、界線明顯、雙層上皮覆蓋的囊狀裂隙+豐富淋巴(間質淋巴樣組織)——典型為Warthin瘤(乳突狀淋巴囊腺瘤):①「最常發生於腮腺」(A正確);②「約10%為雙側/多發」(B正確);③「明顯上皮與間質的分化、軟骨樣物質是多形性腺瘤的特徵,非Warthin瘤」——故C不符(錯誤);④「抽菸者罹患率較高」(D正確)。故C(錯誤的敘述)為答案。","options":{"A":"Warthin瘤最常發生腮腺,正確。","B":"約10%雙側性,正確。","C":"上皮間質分化含軟骨樣是多形性腺瘤(非Warthin)—錯誤(正解)。","D":"抽菸者罹患率較高,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112100-93":{"quick":"腎血管平滑肌脂肪瘤的重要臨床意義在於易發生自發性出血。","detail":{"background":"「腎血管平滑肌脂肪瘤(angiomyolipoma)」是良性間葉腫瘤(含異常血管、平滑肌、脂肪),與結節性硬化症相關:其重要臨床意義是因異常厚壁血管易破裂,易發生自發性出血(尤腫瘤>4cm,可致腹膜後大出血)。它極少惡性轉化、不致早期腎衰、散發性多為單側。故重要意義為易自發性出血。","options":{"A":"極少惡性轉變(非25%)。","B":"易發生自發性出血—正解。","C":"不致早期腎衰竭。","D":"散發性多為單側(非雙側)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112100-94":{"quick":"體積較大的腦下垂體腺瘤常出現腫瘤內出血及壞死,D最適當。","detail":{"background":"腦下垂體腺瘤:①「浸潤至腦/硬腦膜不等於垂體癌(垂體癌須有顱腦脊髓或全身轉移才能診斷)」(故A錯誤);②「腺瘤中網狀纖維減少/消失(正常垂體網狀纖維完整)」(故B「明顯網狀纖維」錯誤);③「細胞形態學非判斷良惡性可靠指標(垂體癌靠轉移診斷)」(故C錯誤);④「體積較大的腺瘤(巨腺瘤)常出現腫瘤內出血(垂體中風)與壞死」(D正確)。故D最適當。","options":{"A":"浸潤腦組織不等於垂體癌(須轉移)—錯誤。","B":"腺瘤網狀纖維減少(非明顯)—錯誤。","C":"形態學非可靠良惡指標—錯誤。","D":"較大腺瘤常出現腫瘤內出血壞死—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112100-96":{"quick":"大部分子宮平滑肌瘤核型正常或簡單(MED12突變),「異常複雜核型」最不適當。","detail":{"background":"子宮肌層腫瘤:①「最常見為平滑肌瘤(leiomyoma,肌瘤)(良性)」(A正確);②「大部分平滑肌瘤核型正常或簡單(常MED12基因突變),而非異常複雜核型(複雜核型多見於惡性的肉瘤)」——故B最不適當;③「大部分平滑肌瘤有MED12突變」(C正確);④「平滑肌瘤很少惡性轉化成平滑肌肉瘤(肉瘤多為新生)」(D正確)。故B最不適當。","options":{"A":"最常見為平滑肌瘤,正確。","B":"大部分平滑肌瘤核型正常/簡單(非複雜)—錯誤(正解)。","C":"大部分有MED12突變,正確。","D":"很少惡性轉化成肉瘤,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112100-97":{"quick":"卵巢亮細胞「癌」比良性/交界性亮細胞腫瘤常見,故A最不適當。","detail":{"background":"卵巢亮細胞癌(clear cell carcinoma):①「亮細胞腫瘤絕大多數為惡性(癌),良性/交界性亮細胞腫瘤罕見,故A良性/交界性比亮細胞癌常見最不適當」——A錯誤;②「治療與其他卵巢上皮癌相似(手術+化療,但對鉑類化療較不敏感)」(B大致正確);③「基因改變(ARID1A、PIK3CA)與子宮內膜樣癌相似、常與子宮內膜異位相關」(C正確);④「晚期預後不好」(D正確)。故A最不適當。","options":{"A":"良性/交界性亮細胞腫瘤罕見(非比癌常見)—錯誤(正解)。","B":"治療與其他卵巢上皮癌相似,大致正確。","C":"基因改變與子宮內膜樣癌相似,正確。","D":"晚期病人預後不好,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112100-100":{"quick":"對多顆腦瘤做TTF-1染色,目的是判斷是否為肺腺癌轉移。","detail":{"background":"「甲狀腺轉錄因子1(thyroid transcription factor 1, TTF-1)」是肺(腺癌)與甲狀腺上皮的標記。對45歲女性的多顆腦瘤(多發性提示轉移)做TTF-1免疫染色,其目的是判斷腫瘤是否為肺腺癌轉移(TTF-1陽性支持肺/甲狀腺來源)。並非判良惡、分裂快慢、是否上皮性。故目的為是否肺腺癌轉移。","options":{"A":"非判斷良惡性。","B":"非判斷分裂快慢。","C":"TTF-1染色判斷是否肺腺癌轉移—正解。","D":"非判斷是否非上皮性。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_113090-81":{"quick":"判定惡性腫瘤可靠性最高的指標是轉移至其他器官。","detail":{"background":"判定惡性腫瘤的指標中,可靠性最高的是轉移(metastasis)至其他器官——轉移是惡性的絕對證據(良性腫瘤不會轉移)。分化差/未分化、生長快、局部侵襲雖支持惡性,但不如轉移可靠(部分良性也可生長快/局部侵襲)。故最可靠為轉移。","options":{"A":"分化差為惡性傾向但非最可靠。","B":"生長快非最可靠(部分良性也快)。","C":"局部侵襲非最可靠。","D":"轉移至其他器官為判定惡性最可靠指標—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_113090-82":{"quick":"E-cadherin為細胞黏附分子,最不具直接調控細胞週期的功能。","detail":{"background":"抑癌(腫瘤抑制)蛋白:①「RB——調控G1→S細胞週期關卡」;②「p53——DNA損傷時致G1停滯、凋亡(調控週期)」;③「p16/INK4a——抑制CDK4/6(調控G1週期)」。而「E-cadherin」是細胞間黏附分子(腫瘤抑制,失去致侵襲轉移),其功能在細胞黏附/接觸抑制,最不直接調控細胞週期。故最不直接調控週期者為E-cadherin。","options":{"A":"RB直接調控G1/S週期。","B":"p53調控週期停滯與凋亡。","C":"E-cadherin為黏附分子、最不直接調控週期—正解。","D":"p16/INK4a抑制CDK調控週期。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_113090-92":{"quick":"迴腸末端黃色黏膜下腫瘤、chromogranin陽性,為神經內分泌腫瘤(類癌)。","detail":{"background":"本題迴腸末端黏膜下腫瘤、切面黃色、chromogranin陽性——典型為神經內分泌腫瘤(neuroendocrine tumor, 類癌carcinoid):源自腸道神經內分泌細胞,chromogranin、synaptophysin陽性,切面常呈黃色,小腸(尤迴腸)為好發處(可分泌血清素致類癌症候群)。增生性息肉、管狀腺瘤、腺癌非神經內分泌標記陽性。故為神經內分泌腫瘤。","options":{"A":"增生性息肉非神經內分泌腫瘤。","B":"管狀腺瘤為腺性息肉。","C":"神經內分泌腫瘤(chromogranin+、黃色、迴腸)—正解。","D":"腺癌非此(chromogranin陰性)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_113090-96":{"quick":"前列腺癌的free/total PSA比值較低(非較高),故D錯誤。","detail":{"background":"前列腺特異抗原(PSA):①「PSA由前列腺上皮生成」(A正確);②「良性前列腺增生、前列腺炎等也會升高PSA」(B正確);③「前列腺癌的PSA上升速率(velocity)較非癌快」(C正確);④「前列腺癌的游離/總PSA(free/total PSA)比值較低(癌組織產生的PSA較多與蛋白結合),故D癌病人比值較高錯誤」——D錯誤。故D錯誤。","options":{"A":"PSA由前列腺上皮生成,正確。","B":"BPH/前列腺炎也會升PSA,正確。","C":"前列腺癌PSA上升速率較快,正確。","D":"前列腺癌free/total PSA比值較低(非較高)—錯誤(正解)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_113090-97":{"quick":"20歲女性卵巢實質性腫瘤含壞死出血與未成熟神經組織,為未成熟畸胎瘤。","detail":{"background":"本題20歲年輕女性、卵巢實質性(固體)腫瘤、切面壞死出血、含未成熟(胚胎性)組織(如未成熟神經上皮)——為未成熟畸胎瘤(immature teratoma):含未成熟/胚胎性組織(尤未成熟神經上皮),屬惡性生殖細胞瘤,好發年輕女性。成熟畸胎瘤(囊性、成熟組織、良性)、漿液性囊腺癌(老年)、胚胎性癌的型態不同。故為未成熟畸胎瘤。","options":{"A":"成熟畸胎瘤為囊性、良性、成熟組織。","B":"漿液性囊狀腺癌好發老年。","C":"未成熟畸胎瘤(年輕、實質、未成熟神經組織)—正解。","D":"胚胎性癌型態不同。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114020-93":{"quick":"腎透明細胞癌最常血行轉移至肺臟。","detail":{"background":"「腎透明細胞癌(renal clear cell carcinoma)」傾向侵犯腎靜脈→下腔靜脈,血行轉移最常至肺臟(及骨、肝、腦、腎上腺)。本題以肺臟為最常見轉移處。周邊淋巴結、腎上腺、肝臟相對次之。故最常轉移至肺臟。","options":{"A":"周邊淋巴結非最常見。","B":"腎上腺轉移較少(可直接侵犯)。","C":"肝臟轉移次之。","D":"腎透明細胞癌最常轉移至肺臟—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114020-95":{"quick":"MED12突變在平滑肌瘤與肉瘤皆可見,最不具鑑別良惡性的能力。","detail":{"background":"區分子宮平滑肌瘤(良性)與平滑肌肉瘤(惡性)的指標:有絲分裂數量、腫瘤壞死(凝固性腫瘤細胞壞死)、非典型細胞核(nuclear atypia)是判斷惡性的三大鑑別特徵。而「MED12突變」在平滑肌瘤(良性)與平滑肌肉瘤皆可見,故最不具鑑別良惡性的能力。故最不具鑑別力者為MED12突變。","options":{"A":"MED12突變於良惡性皆可見、最不具鑑別力—正解。","B":"有絲分裂數量為鑑別指標。","C":"腫瘤壞死為鑑別指標。","D":"非典型細胞核為鑑別指標。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114090-81":{"quick":"判斷腫瘤為惡性最不可靠的特徵是生長快速。","detail":{"background":"判斷腫瘤惡性的特徵中,最不可靠的是生長快速——部分良性腫瘤(如妊娠期平滑肌瘤、發炎反應)也可快速生長。而分化不良(未分化)、非典型有絲分裂、遠端轉移(最可靠)較能指向惡性。故最不可靠者為生長快速。","options":{"A":"生長快速最不可靠(良性也可快速)—正解。","B":"分化不良為惡性傾向(較可靠)。","C":"不典型有絲分裂為惡性特徵。","D":"遠端轉移為惡性最可靠指標。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114090-87":{"quick":"小細胞肺癌少有EGFR突變(EGFR突變在腺癌),故B錯誤。","detail":{"background":"小細胞肺癌(small cell carcinoma):①「與抽菸強烈相關」(A正確);②「小細胞肺癌極少EGFR突變(EGFR突變主要見於肺腺癌不抽菸女性),故B台灣小細胞肺癌三成EGFR突變錯誤」——B錯誤;③「大多數帶TP53與RB突變」(C正確);④「常有副贅瘤症候群(SIADH、庫欣、Lambert-Eaton)」(D正確)。故B錯誤。","options":{"A":"與抽菸強烈相關,正確。","B":"小細胞肺癌少有EGFR突變(非三成)—錯誤(正解)。","C":"大多帶TP53與RB突變,正確。","D":"會有副贅瘤症候群,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114090-89":{"quick":"口腔(鱗狀)癌目前缺乏有效標靶治療,「已有多種有效標靶」錯誤。","detail":{"background":"口腔癌:①「白斑(leukoplakia)、紅斑(erythroplakia)為可觀察的早期病變」(A正確);②「紅斑大多為嚴重異生或原位癌/侵襲癌(惡性風險高於白斑)」(B正確);③「口腔(鱗狀細胞)癌常突變TP53、CDKN2A、PIK3CA,但目前缺乏多種有效標靶治療(與肺腺癌不同,口腔鱗癌的標靶選項有限)」——故C「已有多種有效標靶」錯誤;④「危險因子含抽菸、喝酒、檳榔,早期診斷可改善預後」(D正確)。故C錯誤。","options":{"A":"白斑與紅斑為可觀察早期病變,正確。","B":"紅斑大多為嚴重異生或原位癌,正確。","C":"口腔癌缺乏有效標靶(非已有多種)—錯誤(正解)。","D":"危險因子含菸酒檳榔、早診改善預後,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114090-95":{"quick":"與放射線治療最相關的乳房惡性腫瘤為血管肉瘤(angiosarcoma)。","detail":{"background":"「乳房血管肉瘤(angiosarcoma)」是乳癌放射線治療後最相關的續發性惡性腫瘤——放療數年後在照射範圍的皮膚/乳房發生的放射相關血管肉瘤(預後差)。惡性葉狀瘤、肌纖維母細胞瘤、平滑肌肉瘤非典型放療相關。故為血管肉瘤。","options":{"A":"血管肉瘤與乳房放射治療最相關—正解。","B":"惡性葉狀瘤非典型放療相關。","C":"肌纖維母細胞瘤為良性。","D":"平滑肌肉瘤非典型放療相關。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114090-97":{"quick":"子宮頸切片顯示全層異型未達侵襲,為高度鱗狀上皮內病灶(HSIL)。","detail":{"background":"子宮頸鱗狀上皮病變:①「低度鱗狀上皮內病灶(LSIL/CIN1)——異型侷限下1/3、常見挖空細胞」;②「高度鱗狀上皮內病灶(HSIL/CIN2-3)——異型細胞佔上皮中上層至全層,核質比高、有絲分裂增多,但未突破基底膜(未侵襲)」;③「鱗狀上皮癌——已突破基底膜侵襲間質」。本題切片(全層異型未侵襲)為HSIL。故為高度鱗狀上皮內病灶。","options":{"A":"高度鱗狀上皮內病灶(HSIL,全層異型未侵襲)—正解。","B":"鱗狀上皮癌已侵襲間質。","C":"原位腺癌為腺體病變。","D":"低度鱗狀上皮內病灶異型侷限下1/3。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_115020-87":{"quick":"高惡性度漿液性卵巢癌最常突變的基因為TP53。","detail":{"background":"「高惡性度漿液性卵巢癌(high-grade serous carcinoma)」(第二型卵巢上皮癌)最常突變的基因是TP53(幾乎所有病例,>95%)(並常有BRCA1/2缺陷、源自輸卵管STIC)。KRAS/BRAF(低惡性度漿液性/黏液性)、ESR1非主要。故為TP53。","options":{"A":"高惡性度漿液性卵巢癌最常突變TP53—正解。","B":"KRAS見於低惡性度/黏液性。","C":"BRAF見於低惡性度漿液性。","D":"ESR1非主要突變。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_115020-98":{"quick":"乳突狀原位癌與乳突瘤的鑑別重點是原位癌缺乏肌上皮細胞。","detail":{"background":"區分乳房乳突瘤(papilloma,良性)與乳突狀管內原位癌(papillary DCIS):最有鑑別力的特徵是肌上皮細胞(myoepithelial cell)的有無——良性乳突瘤保有肌上皮細胞層;乳突狀原位癌缺乏(無)肌上皮細胞(以免疫染色p63、calponin、SMM-HC證實)。纖維血管軸心、出血、壞死非主要鑑別。故鑑別重點為無肌上皮細胞。","options":{"A":"乳突狀原位癌無肌上皮細胞(鑑別重點)—正解。","B":"纖維血管組織非主要鑑別。","C":"出血非主要鑑別。","D":"組織壞死非主要鑑別。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_115020-99":{"quick":"最常見的侵犯性乳癌受體型為ER陽性、PR陽性、HER2陰性(管腔A型)。","detail":{"background":"侵犯性乳癌依荷爾蒙受體與HER2分子分型:①「管腔A型(Luminal A)——ER陽性、PR陽性、HER2陰性,為最常見、預後較好、對荷爾蒙治療反應佳」(A);②「HER2型(ER/PR陰性、HER2陽性)」;③「三陰性(ER/PR/HER2皆陰性,預後差)」。本題最常見的受體組合為ER+/PR+/HER2−。故為A。","options":{"A":"ER+/PR+/HER2−(管腔A型)為最常見—正解。","B":"ER−/PR−/HER2+為HER2型。","C":"ER+/PR+/HER2+為管腔B型(較少)。","D":"三陰性預後差(較少)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_106100-78":{"quick":"埃勒斯-當洛症候群(Ehlers-Danlos)為結構蛋白(膠原)缺損的遺傳病。","detail":{"background":"遺傳病依缺陷蛋白分:①「結構蛋白缺損」——埃勒斯-當洛症候群(Ehlers-Danlos syndrome)(膠原蛋白合成/結構缺陷→皮膚過度伸展、關節過動)(及Marfan的fibrillin、成骨不全的第I型膠原);②「酵素缺乏的儲積症」——黏多醣貯積症、高雪氏症(Gaucher,葡萄糖腦苷脂酶)、戴-薩克斯症(Tay-Sachs,己醣胺酶A)(溶酶體酶缺乏致代謝物堆積)。故結構蛋白缺損者為Ehlers-Danlos。","options":{"A":"Ehlers-Danlos為膠原(結構蛋白)缺損—正解。","B":"黏多醣貯積症為溶酶體酶缺乏。","C":"高雪氏症為酶缺乏儲積症。","D":"戴-薩克斯症為酶缺乏儲積症。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108030-78":{"quick":"20個羊水細胞中5個正常、15個三染色體21,為鑲嵌型唐氏症。","detail":{"background":"本題羊水細胞分析同一個體中部分細胞正常(46條)、部分細胞多一條第21號染色體(三染色體21)——即細胞鑲嵌(mosaicism)型唐氏症(Down syndrome)(受精後有絲分裂時不分離(nondisjunction),使體內兩種細胞系共存)。單純不分離型則所有細胞皆三染色體21。多一條21號是唐氏症(非愛德華氏症18號)。故為鑲嵌型唐氏症。","options":{"A":"純不分離型應所有細胞三染色體21。","B":"愛德華氏症為三染色體18(非21)。","C":"愛德華氏症為18號(非21)。","D":"部分細胞三染色體21=鑲嵌型唐氏症—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108030-100":{"quick":"胃炎嘔吐+記憶衰退虛談+乳頭體出血壞死,為維生素B1(thiamine)缺乏(Wernicke)。","detail":{"background":"本題慢性嘔吐(營養不良)、記憶衰退與虛談(confabulation)、解剖見乳頭體(mamillary bodies)及第三/四腦室壁出血壞死——典型為維生素B1(thiamine)缺乏所致的Wernicke腦病變/Korsakoff症候群(好發酒癮、慢性嘔吐者)。維生素A、B6、B12缺乏的表現不同。故為B1。","options":{"A":"維生素A缺乏致夜盲/乾眼。","B":"維生素B1缺乏致Wernicke腦病變—正解。","C":"維生素B6缺乏致周邊神經病變/皮膚炎。","D":"維生素B12缺乏致巨母紅血球性貧血/脊髓變性。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108100-77":{"quick":"漿細胞內堆積大量免疫球蛋白形成的粉紅色物質稱Russell body。","detail":{"background":"「Russell body(羅素小體)」是漿細胞(plasma cell)內大量免疫球蛋白(分泌蛋白)堆積、無法排出,形成胞質內嗜酸性(粉紅色)圓球狀包涵體(見於慢性發炎/漿細胞增生)。amyloid(類澱粉)、Mallory-Denk body(酒精性肝炎,角蛋白)、psammoma body(砂樣鈣化體)非此。故為Russell body。","options":{"A":"漿細胞內免疫球蛋白堆積=Russell body—正解。","B":"amyloid為類澱粉(細胞外)。","C":"Mallory-Denk body見於酒精性肝炎。","D":"psammoma body為砂樣鈣化體。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108100-78":{"quick":"Bruton氏病(無丙球蛋白血症)病人接種沙賓活疫苗,癱瘓性小兒麻痺風險較高。","detail":{"background":"「Bruton氏病(X性聯無丙種球蛋白血症)」因B細胞成熟障礙(BTK缺陷)→抗體(免疫球蛋白)嚴重缺乏:接種口服沙賓活減毒疫苗時,因缺乏中和抗體,減毒病毒可能恢復毒力、致癱瘓性脊髓灰質炎(疫苗相關小兒麻痺)。DiGeorge(T細胞)、慢性肉芽腫病(吞噬細胞)、Wiskott-Aldrich非以抗體缺乏為主。故風險較高者為Bruton氏病。","options":{"A":"DiGeorge為T細胞缺陷(非抗體)。","B":"Bruton氏病(抗體缺乏)致活疫苗癱瘓風險高—正解。","C":"慢性肉芽腫病為吞噬殺菌缺陷。","D":"Wiskott-Aldrich為血小板/免疫複合缺陷。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108100-91":{"quick":"自身免疫性胃炎侵犯胃體部,胃竇G細胞反而增生(非減少),故D錯誤。","detail":{"background":"自身免疫性胃炎(autoimmune gastritis):①「產生抗壁細胞與內在因子的自體抗體」(A正確);②「內在因子缺乏→維生素B12吸收不良→惡性貧血」(B正確);③「壁細胞被破壞→胃酸分泌不足(無酸)→回饋使胃竇G細胞分泌胃泌素(gastrin)增加(高胃泌素血症)」(C正確);④「主要侵犯胃體部(body/fundus),胃竇內分泌(G)細胞增生(非減少)(因低酸刺激)」——故D「胃竇內分泌細胞減少」錯誤。故D錯誤。","options":{"A":"抗壁細胞與內在因子的自體抗體,正確。","B":"維生素B12缺乏,正確。","C":"胃酸不足、胃泌素增加,正確。","D":"胃竇G細胞增生(非減少)—錯誤(正解)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109020-74":{"quick":"unithiol(DMPS)可用於治療急性與慢性無機砷中毒的螯合劑。","detail":{"background":"「unithiol(DMPS)」(與succimer DMSA、dimercaprol BAL)是含硫氫基的金屬螯合劑,可螯合砷而促排出,用於急性與慢性無機砷中毒(且毒性低、可口服)。penicillamine(銅/鉛/Wilson)、deferoxamine(鐵)、prussian blue(鉈/銫)非砷的首選螯合劑。故為unithiol。","options":{"A":"unithiol為砷中毒螯合劑—正解。","B":"penicillamine用於銅/Wilson/鉛。","C":"deferoxamine用於鐵中毒。","D":"prussian blue用於鉈/銫中毒。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109020-78":{"quick":"22q11.2缺失症候群多數為生殖細胞形成時隨機新發生(de novo),C正確。","detail":{"background":"22q11.2缺失症候群(DiGeorge / 顎心面症候群):①「免疫缺陷以T淋巴球(胸腺發育不良)為主」(故A「B淋巴球」錯誤);②「內分泌問題主要是副甲狀腺發育不良(低血鈣)」(故B「腦下腺」錯誤);③「多數個案的缺失是新發生(de novo)、隨機發生於生殖細胞(精/卵)形成過程(微缺失,非遺傳自父母)」(C正確);④「須以FISH或染色體微陣列診斷(傳統核型分析看不到微缺失)」(故D錯誤)。故C正確。","options":{"A":"免疫缺陷以T細胞為主(非B)—錯誤。","B":"內分泌問題為副甲狀腺(非腦下腺)—錯誤。","C":"多數為生殖細胞形成時隨機新發生—正解。","D":"須用FISH/微陣列(傳統核型看不到)—錯誤。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109100-75":{"quick":"penicillamine可治銅/Wilson/汞/鉛中毒,但不包括砷中毒。","detail":{"background":"「penicillamine」是金屬螯合劑,用於銅中毒、威爾森氏症(Wilson’s disease,銅蓄積)、汞、鉛中毒。而「砷中毒」應用dimercaprol(BAL)、succimer、unithiol,penicillamine非砷中毒的標準解毒劑。故不包括者為砷中毒。","options":{"A":"銅中毒可用penicillamine。","B":"Wilson氏症可用penicillamine。","C":"汞中毒可用penicillamine。","D":"砷中毒非penicillamine適應症—正解(不包括)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109100-90":{"quick":"家族性結腸息肉病的腺瘤息肉在青春期後才出現(非出生時),故B錯誤。","detail":{"background":"家族性腺瘤性息肉病(familial adenomatous polyposis, FAP):①「體染色體顯性遺傳(APC基因突變)」(A正確);②「大腸腺瘤性息肉(數百至數千顆)在青春期(10-20歲)後才出現,而非出生時已存在」——故B錯誤;③「APC突變與Gardner症候群(骨瘤/軟組織瘤)、Turcot症候群(腦瘤)有關」(C正確);④「未治療者幾乎100%發展成大腸腺癌(故須預防性結腸切除)」(D正確)。故B錯誤。","options":{"A":"體染色體顯性遺傳,正確。","B":"腺瘤息肉青春期後才出現(非出生時)—錯誤(正解)。","C":"APC突變與Gardner/Turcot有關,正確。","D":"未治療幾乎100%產生大腸腺癌,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_110020-84":{"quick":"慢性免疫性血小板減少性紫斑(ITP)病人血漿有抗血小板自體抗體,B正確。","detail":{"background":"慢性免疫性血小板減少性紫斑(chronic ITP):①「好發年輕成年女性(非60歲以上老年)」(故A錯誤);②「病人血漿中有抗血小板(GPIIb/IIIa等)的自體抗體,致脾臟破壞血小板」(B正確);③「骨髓中巨核細胞增多(代償性)(非減少)」(故C錯誤);④「多數病人對糖皮質激素有反應(第一線治療)」(故D錯誤)。故B正確。","options":{"A":"好發年輕女性(非老年)—錯誤。","B":"血漿有抗血小板自體抗體—正解。","C":"骨髓巨核細胞增多(非減少)—錯誤。","D":"多數對類固醇有反應—錯誤。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111100-75":{"quick":"甲醇中毒的最佳解毒劑為fomepizole(抑制酒精去氫酶)。","detail":{"background":"「甲醇(methanol)中毒」最佳解毒劑為fomepizole——抑制酒精去氫酶(ADH),阻止甲醇代謝成毒性的甲醛/甲酸(致失明、酸中毒)(乙醇亦可競爭ADH但fomepizole較佳)。esmolol(β阻斷)、flumazenil(BZD拮抗)、acetylcysteine(乙醯胺酚解毒)非甲醇解毒劑。故為fomepizole。","options":{"A":"esmolol為β阻斷劑。","B":"fomepizole抑制ADH、治甲醇中毒—正解。","C":"flumazenil為苯二氮平拮抗劑。","D":"acetylcysteine為乙醯胺酚解毒劑。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112020-78":{"quick":"唐氏症可利用FISH(螢光原位雜交)診斷,C最適當。","detail":{"background":"唐氏症(Down syndrome, 三染色體21):①SNP基因分型法非最適合直接偵測整條第21號染色體多一條(故A不準);②約95%是減數分裂不分離(nondisjunction)所致的純三染色體21,而非轉位到14號(轉位型僅約4%)(故B錯誤);③可用螢光原位雜交(FISH)(以21號特異探針計數)快速診斷(及核型分析、微陣列)(C正確);④鑲嵌型是部分細胞整條三染色體21(非短臂鑲嵌)(故D錯誤)。故C正確。","options":{"A":"SNP分型非最適合偵測三染色體—不準。","B":"95%為不分離三染色體21(非轉位到14)—錯誤。","C":"可用FISH診斷唐氏症—正解。","D":"鑲嵌型為部分細胞整條三染色體21(非短臂鑲嵌)—錯誤。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_113090-78":{"quick":"X染色體脆折症(CGG重複)適合用重複引子PCR加南方墨點分析篩檢。","detail":{"background":"「X染色體脆折症(Fragile X syndrome)」是FMR1基因5端非轉譯區的CGG三核苷酸重複擴增(>200次為全突變)致病:因重複序列難以一般PCR完整擴增,故適合用重複引子PCR(repeat-primer PCR)篩檢重複數,再配合南方墨點(Southern blot)分析甲基化與大片段重複確診。透納氏症(45,X)、DiGeorge(微缺失)、尼曼匹克症(酶缺乏)的檢測方式不同。故為Fragile X症。","options":{"A":"透納氏症用核型分析。","B":"DiGeorge用FISH/微陣列。","C":"X染色體脆折症(CGG重複)用重複引子PCR+南方墨點—正解。","D":"尼曼匹克症用酶活性/基因檢測。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114020-75":{"quick":"dimercaprol(BAL)為注射型短效,最不適合用於慢性重金屬中毒。","detail":{"background":"金屬螯合劑用於慢性中毒:①「succimer(DMSA)、unithiol(DMPS)、deferasirox(口服鐵螯合)」——可口服、較適合慢性長期治療;②「dimercaprol(BAL)」——須肌肉注射(花生油劑型)、作用短、有疼痛/毒性,主要用於急性中毒,最不適合慢性中毒。故最不適合慢性中毒者為dimercaprol。","options":{"A":"unithiol可口服、適合慢性。","B":"deferasirox為口服鐵螯合劑(慢性鐵過載)。","C":"succimer可口服、適合慢性。","D":"dimercaprol須注射、最不適合慢性中毒—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114020-81":{"quick":"MHC分子「過度表現」最不可能使腫瘤逃避免疫(腫瘤逃避是降低MHC)。","detail":{"background":"腫瘤逃避免疫(immune evasion)的機制:①「分泌TGF-β(免疫抑制)」(A助逃避);②「表現CTLA-4、PD-L1(免疫檢查點)抑制T細胞」(B、C助逃避);③「腫瘤降低(而非過度表現)MHC分子,減少抗原呈現給T細胞而逃避」——故MHC分子過度表現最不可能使腫瘤逃避(反而增加被T細胞辨識)。故最不可能者為MHC分子過度表現。","options":{"A":"TGF-β過度表現助免疫逃避。","B":"CTLA-4過度表現助逃避。","C":"PD-L1過度表現助逃避。","D":"MHC過度表現反增加被辨識、最不可能助逃避—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114020-97":{"quick":"完全性葡萄胎最常見的染色體核型為46,XX(空卵受精、皆父源)。","detail":{"background":"「完全性葡萄胎(complete mole)」:空卵(無母源染色體)被一個精子受精後複製(或兩精子受精),遺傳物質皆為父源,最常見核型為46,XX(亦可46,XY)。三倍體(69,XXX/69,XXY)是部分性葡萄胎。故完全性葡萄胎最常見為46,XX。","options":{"A":"完全性葡萄胎最常見46,XX—正解。","B":"69,XXY為部分性葡萄胎(三倍體)。","C":"69,XXX為部分性葡萄胎。","D":"92,XXXY非典型。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114020-100":{"quick":"天皰瘡的IgG主要沉積於表皮鱗狀上皮細胞之間(抗desmoglein)。","detail":{"background":"「尋常型天皰瘡(pemphigus vulgaris)」是抗橋粒芯蛋白(desmoglein)的自體抗體(IgG)致病(第II型過敏):直接免疫螢光顯示IgG沉積於表皮鱗狀上皮細胞之間(細胞間/網狀)(破壞細胞間黏附→棘層鬆解(acantholysis)、表皮內水皰)。基底膜沉積見於類天皰瘡。故為表皮細胞之間。","options":{"A":"IgG沉積於表皮細胞之間(抗desmoglein)—正解。","B":"基底膜沉積見於類天皰瘡。","C":"血管壁沉積見於血管炎。","D":"汗腺管基底膜非天皰瘡部位。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114090-78":{"quick":"馬凡氏症候群為主動脈根部擴大;由fibrillin(非膠原)異常、體染色體顯性、身材高瘦。","detail":{"background":"「馬凡氏症候群(Marfan syndrome)」:①「由纖維蛋白原(fibrillin-1, FBN1基因)異常引起(非膠原蛋白)」(故A錯誤);②「體染色體顯性遺傳」(故B「隱性」錯誤);③「身材高瘦、四肢細長、蜘蛛指(非矮小)」(故C錯誤);④「心血管表現為主動脈根部擴大(易主動脈剝離/動脈瘤)與二尖瓣脫垂、晶狀體脫位」(D正確)。故D正確。","options":{"A":"由fibrillin異常(非膠原)—錯誤。","B":"體染色體顯性(非隱性)—錯誤。","C":"身材高瘦(非矮小)—錯誤。","D":"主動脈根部擴大—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114090-79":{"quick":"天皰瘡的致病機轉為第二型過敏反應(自體抗體對抗細胞表面抗原)。","detail":{"background":"「尋常型天皰瘡(pemphigus vulgaris)」是第II型(細胞毒性/抗體媒介)過敏反應:自體抗體(IgG)直接對抗角質細胞表面的橋粒芯蛋白(desmoglein),破壞細胞間黏附→棘層鬆解、表皮內水皰。第I型(IgE過敏)、第III型(免疫複合體)、第IV型(細胞媒介遲發)非天皰瘡機轉。故為第二型過敏反應。","options":{"A":"第一型為IgE過敏(非天皰瘡)。","B":"天皰瘡為第二型過敏(抗細胞表面抗原)—正解。","C":"第三型為免疫複合體。","D":"第四型為細胞媒介遲發。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_115020-79":{"quick":"淋巴細胞浸潤腎間質/腎小管/血管、C4d陰性、無慢性纖維化,為急性細胞排斥。","detail":{"background":"腎移植排斥分型:①「超急性排斥——預存抗體、數分鐘至小時、血管栓塞壞死」;②「急性細胞性排斥(acute cellular rejection)」——T淋巴球浸潤腎間質、腎小管(腎小管炎)、血管內皮(血管炎),可有小血管壁壞死,C4d陰性(非抗體媒介)、無慢性纖維化/腎小管萎縮(本題符合);③「急性抗體媒介排斥——C4d陽性」;④「慢性排斥——纖維化/腎小管萎縮」。故本題為急性細胞排斥。","options":{"A":"慢性排斥有間質纖維化/腎小管萎縮(本題無)。","B":"超急性排斥為預存抗體致血管栓塞壞死。","C":"急性細胞排斥(T細胞浸潤、C4d陰性、無纖維化)—正解。","D":"急性抗體媒介排斥C4d陽性(本題陰性)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_115020-80":{"quick":"癩皮病(pellagra)主要為缺乏niacin(菸鹼酸,維生素B3)。","detail":{"background":"「癩皮病(pellagra)」是菸鹼酸(niacin, 維生素B3)(及其前驅物色胺酸)缺乏所致:典型「3D」——皮膚炎(Dermatitis,日曬部位)、腹瀉(Diarrhea)、失智(Dementia)(嚴重可死亡)。常見於以玉米為主食(菸鹼酸利用率低)或類癌、Hartnup病者。維生素B1、B2、B6缺乏的表現不同。故為niacin。","options":{"A":"維生素B1缺乏致腳氣病/Wernicke。","B":"維生素B2缺乏致口角炎/舌炎。","C":"癩皮病為niacin缺乏—正解。","D":"維生素B6缺乏致周邊神經病變。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_115020-85":{"quick":"G6PD缺乏症為性聯隱性(X-linked recessive)遺傳。","detail":{"background":"「葡萄糖-6-磷酸去氫酶(G6PD)缺乏症」是性聯隱性(X-linked recessive)遺傳(基因在X染色體):故男性(半合子)發病較多,女性需同合子才發病(雜合子為帶因)。臨床:接觸氧化性物質(蠶豆、磺胺、抗瘧藥、感染)時誘發急性溶血性貧血。故為性聯隱性遺傳。","options":{"A":"非體染色體顯性。","B":"非體染色體隱性。","C":"非性聯顯性。","D":"G6PD缺乏為性聯隱性遺傳—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_106100-79":{"quick":"抗酸染色不適用於隱球菌(Cryptosporidium為黴菌);痲瘋/結核/MAC才用抗酸染色。","detail":{"background":"「抗酸性染色(acid-fast stain, 如Ziehl-Neelsen)」用於細胞壁含分枝菌酸的分枝桿菌(Mycobacterium)與痲瘋桿菌:適用於癩瘤性痲瘋、結核菌(M. tuberculosis)、非結核分枝桿菌(MAC)。而「新型隱球菌(Cryptococcus neoformans)」是黴菌(真菌),以墨汁染色(莢膜)、PAS、GMS染色診斷,不適用抗酸染色。故不適用者為隱球菌感染。","options":{"A":"癩瘤性痲瘋用抗酸染色。","B":"結核菌用抗酸染色。","C":"MAC用抗酸染色。","D":"隱球菌(黴菌)不適用抗酸染色—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_106100-87":{"quick":"弓漿蟲(Toxoplasma)最少感染免疫低下者的肺部(主要致腦炎)。","detail":{"background":"免疫低下病人的肺部機會性感染:①「細胞巨大病毒(CMV)」(肺炎/視網膜炎);②「肺囊蟲(Pneumocystis jirovecii)」(PCP肺炎);③「麴菌(Aspergillus)」(侵襲性肺麴菌病)——皆常感染肺部。而「弓漿蟲(Toxoplasma)」在免疫低下(AIDS)者主要造成腦炎(toxoplasma encephalitis),最少以肺部感染表現。故最少感染肺部者為弓漿蟲。","options":{"A":"CMV常感染肺部。","B":"肺囊蟲致PCP肺炎。","C":"麴菌致侵襲性肺麴菌病。","D":"弓漿蟲主要致腦炎、最少感染肺部—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_106100-97":{"quick":"抽菸者乳暈旁紅腫、乳管鱗狀化生角質堵塞擴張,為周邊乳腺管性乳房炎。","detail":{"background":"本題抽菸女性、乳暈旁皮膚紅腫熱痛、乳暈下腫塊,切片見乳管上皮鱗狀化生、角質栓塞使乳管擴張成囊——典型為周邊乳腺管性乳房炎(periductal mastitis,又稱乳管周圍乳房炎/Zuska病)(與抽菸強相關,乳管鱗狀化生、角質栓塞、續發感染與廔管)。管內乳突瘤(血樣分泌)、急性乳房炎(哺乳期)、分枝桿菌感染(肉芽腫)的特徵不同。故為周邊乳腺管性乳房炎。","options":{"A":"管內乳突瘤致乳頭血樣分泌。","B":"急性乳房炎多見於哺乳期。","C":"分枝桿菌感染為肉芽腫性。","D":"周邊乳腺管性乳房炎(抽菸、鱗狀化生角質栓塞)—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_106100-99":{"quick":"白血病化療免疫低下者肺浸潤後腦壞死,鏡下所見為黴菌(如麴菌)。","detail":{"background":"本題慢性白血病化療後免疫低下,先肺浸潤、再腦壞死——免疫低下者血行播散的侵襲性黴菌(尤麴菌Aspergillus,可侵血管致梗塞壞死)、毛黴菌,鏡下可見有隔/無隔的菌絲。細菌、病毒、白血病細胞的鏡下所見不同(本題以黴菌菌絲為解)。故為黴菌。","options":{"A":"細菌非此鏡下型態。","B":"免疫低下者肺/腦播散性感染、鏡下黴菌(菌絲)—正解。","C":"病毒非此(無菌絲)。","D":"白血病細胞為腫瘤浸潤(非感染壞死)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_107100-78":{"quick":"進行性多灶性白質腦病(PML,JC病毒)不是腮腺炎的合併症。","detail":{"background":"腮腺炎(mumps)的合併症:①「睪丸炎(orchitis,青春期後男性)」;②「胰臟炎(pancreatitis)」;③「感染後腦炎/腦膜炎」(及聽力喪失、卵巢炎)。而「進行性多灶性白質腦病(PML)」是JC病毒在免疫低下者再活化致的脫髓鞘腦病變,與腮腺炎無關。故不是腮腺炎合併症者為PML。","options":{"A":"睪丸炎為腮腺炎合併症。","B":"胰臟炎為腮腺炎合併症。","C":"感染後腦炎為腮腺炎合併症。","D":"PML(JC病毒)非腮腺炎合併症—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_107100-79":{"quick":"癩瘤型痲瘋是細胞性免疫缺失(體液免疫正常/增強),「兩者均缺失」錯誤。","detail":{"background":"痲瘋(leprosy):①癩瘤型(lepromatous)——細胞性免疫缺失(無法控制)→病灶菌量極多(A正確);②癩瘤型是細胞性免疫缺失,而體液性免疫正常甚至增強(高抗體但無保護),故B細胞性與體液性均缺失錯誤——B錯誤;③類結核型(tuberculoid)是細胞性免疫太強→肉芽腫、菌量少(C正確);④經人-人呼吸道/接觸傳染(D正確)。故B錯誤。","options":{"A":"癩瘤型病灶菌量極多,正確。","B":"癩瘤型為細胞性免疫缺失(體液免疫非缺失)—錯誤(正解)。","C":"類結核型細胞性免疫強、肉芽腫,正確。","D":"經人-人呼吸傳染,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108030-76":{"quick":"圓形病灶內含中性球與壞死細胞的黏稠膿液,最可能為膿瘍(abscess)。","detail":{"background":"本題發燒咳嗽、肺圓形病灶內含大量中性球、壞死細胞的黏稠液(膿)——典型為膿瘍(abscess):局部化膿性發炎液化壞死,中央為膿(中性球+壞死組織+細菌),周圍纖維包圍(肺膿瘍常因吸入/壞死性肺炎)。肥厚性瘢痕、血腫、結核(乾酪壞死+肉芽腫)的型態不同。故為膿瘍。","options":{"A":"肥厚性瘢痕為膠原過度增生。","B":"圓形病灶含膿(中性球壞死液)=膿瘍—正解。","C":"血腫為積血。","D":"結核為乾酪壞死+肉芽腫(非中性球膿)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108030-96":{"quick":"慢性非細菌性前列腺炎是最常見型、病人有反覆下泌尿道症狀,故D較不正確。","detail":{"background":"前列腺炎:①「急性細菌性前列腺炎致病菌與引起泌尿道感染的菌(大腸桿菌等)相同」(A正確);②「慢性細菌性前列腺炎不易診斷與治療(反覆UTI)」(B正確);③「美國最常引起肉芽腫性前列腺炎的原因是膀胱內卡介苗(BCG)灌注治療」(C正確);④「慢性非細菌性前列腺炎(慢性骨盆疼痛症候群)是最常見型,病人有反覆的下泌尿道/骨盆症狀,故D一般沒有反覆較不正確」——D錯誤。故D較不正確。","options":{"A":"急性細菌性前列腺炎致病菌同UTI,正確。","B":"慢性細菌性前列腺炎不易診治,正確。","C":"肉芽腫性前列腺炎最常因BCG灌注,正確。","D":"慢性非細菌性前列腺炎有反覆症狀(非沒有)—錯誤(正解)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108100-87":{"quick":"急性氣管炎合併肺部瀰漫性間質發炎,最可能為病毒感染。","detail":{"background":"「瀰漫性間質性肺炎(肺泡間隔淋巴球浸潤,而非肺泡腔化膿)」合併急性氣管炎,最可能是病毒感染(如流感、副流感、腺病毒、RSV、COVID)(非典型/間質性肺炎)。肺炎雙球菌、葡萄球菌(細菌)致肺泡腔化膿(大葉/支氣管肺炎);黴菌致肉芽腫/壞死。故為病毒。","options":{"A":"病毒致急性氣管炎+間質性肺炎—正解。","B":"肺炎雙球菌致肺泡腔化膿(大葉肺炎)。","C":"葡萄球菌致化膿性肺炎/膿瘍。","D":"黴菌致肉芽腫/壞死性肺炎。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_108100-94":{"quick":"亞急性肉芽腫性甲狀腺炎(de Quervain)最可能由病毒感染引起。","detail":{"background":"「亞急性肉芽腫性甲狀腺炎(subacute granulomatous thyroiditis, de Quervain甲狀腺炎)」的致病機轉目前認為最可能與病毒感染(常在上呼吸道病毒感染後發生)有關:臨床甲狀腺疼痛、暫時性甲狀腺亢進後低下,病理見肉芽腫性發炎與多核巨細胞。細菌(化膿性)、黴菌、結核非主因。故為病毒感染。","options":{"A":"細菌感染致化膿性甲狀腺炎。","B":"黴菌非主因。","C":"亞急性肉芽腫性甲狀腺炎最可能由病毒引起—正解。","D":"結核非主因。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_109020-79":{"quick":"梅毒、斑疹傷寒、壞疽性臁瘡的典型病理皆會出現小血管炎(①②③)。","detail":{"background":"典型病理變化出現小血管炎(small vessel vasculitis)的感染:①「梅毒(各期)——閉塞性動脈內膜炎(endarteritis)與血管周圍漿細胞浸潤」;②「斑疹傷寒(typhus,立克次體)——立克次體侵犯血管內皮致血管炎(小血管炎)、血栓」;③「壞疽性臁瘡(ecthyma gangrenosum,綠膿桿菌)——細菌侵入血管壁致血管炎與壞死」。故①②③皆有小血管炎。","options":{"A":"①梅毒②斑疹傷寒③壞疽性臁瘡皆有小血管炎—正解。","B":"遺漏③。","C":"遺漏①。","D":"遺漏②。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_110020-96":{"quick":"結核引起的睪丸附睪發炎最先起於附睪(非睪丸),故B較不正確。","detail":{"background":"睪丸與附睪發炎:①「附睪發炎比睪丸發炎更常見」(A正確);②「結核病引起的發炎最先起於附睪(epididymis)(由泌尿道逆行),而非睪丸」——故B較不正確;③「淋病引起的發炎最先起於附睪(逆行感染)」(C正確);④「梅毒引起的發炎最先起於睪丸(梅毒性睪丸炎/橡皮腫)」(D正確)。故B較不正確。","options":{"A":"附睪發炎比睪丸發炎更常見,正確。","B":"結核引起的發炎最先起於附睪(非睪丸)—錯誤(正解)。","C":"淋病引起的發炎最先起於附睪,正確。","D":"梅毒引起的發炎最先起於睪丸,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_110020-100":{"quick":"乾酪性壞死肉芽腫(結核特徵)較不可能出現在第一型單純疱疹病毒腦炎。","detail":{"background":"第一型單純疱疹病毒(HSV-1)腦炎的病理:①「Cowdry type A核內包涵體(病毒)」(A可見);②「血管周圍淋巴球套(perivascular lymphocytic cuff)」(B可見);③「微膠細胞結節(microglial nodule)、出血壞死性腦炎(尤顳葉)」(C可見);④乾酪性壞死性肉芽腫(caseous necrotizing granuloma)是結核(分枝桿菌)的特徵,最不可能出現在HSV腦炎。故較不可能者為乾酪性壞死肉芽腫。","options":{"A":"Cowdry A核內包涵體可見於HSV腦炎。","B":"血管周圍淋巴球套可見。","C":"微膠細胞結節可見。","D":"乾酪性壞死肉芽腫為結核特徵、不見於HSV腦炎—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111100-79":{"quick":"CMV也會造成類似傳染性單核白血球增多症的表現與非典型淋巴球,A正確。","detail":{"background":"傳染性單核白血球增多症(EBV所致):①「巨細胞病毒(CMV)也會造成類似的發燒、淋巴腺腫、非典型淋巴球(CMV單核細胞增多症,但異嗜性抗體陰性)」(A正確);②肝脾腫大主因是淋巴球(尤T細胞)與網狀內皮系統增生(B淋巴濾泡大量增生不準);③t(8;14)是Burkitt淋巴瘤的轉位(B細胞,非IM的T細胞)(故C錯誤);④淋巴結腫大主因是副皮質區T細胞與免疫母細胞增生(非竇組織細胞增生)(故D錯誤)。故A正確。","options":{"A":"CMV也造成類似表現與非典型淋巴球—正解。","B":"肝脾腫大主因為淋巴/網狀內皮增生(非淋巴濾泡)—不準。","C":"t(8;14)為Burkitt(B細胞)、非IM的T細胞—錯誤。","D":"淋巴結腫大主因非竇組織細胞增生—錯誤。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_111100-95":{"quick":"睪丸出現典型橡皮腫(gumma)見於梅毒(第三期)。","detail":{"background":"「橡皮腫(gumma)」是第三期(晚期)梅毒的特徵性病灶——局部肉芽腫樣的凝固性壞死(中央壞死、周圍漿細胞與纖維化),可發生於睪丸、肝、骨、皮膚等。輸精管結紮、結核(乾酪壞死)、淋病(化膿)非橡皮腫。故出現橡皮腫者為梅毒。","options":{"A":"輸精管結紮非橡皮腫。","B":"梅毒(第三期)出現睪丸橡皮腫—正解。","C":"結核為乾酪壞死肉芽腫。","D":"淋病為化膿性感染。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112020-84":{"quick":"鼻腔CD56陽性、血管侵犯壞死的淋巴瘤(NK/T細胞淋巴瘤)與EBV最有關。","detail":{"background":"本題鼻腔中等大小異常淋巴球、血管侵犯(angioinvasion)與壞死、CD56陽性——典型為結外NK/T細胞淋巴瘤(鼻型),與Epstein-Barr病毒(EBV)感染密切相關(EBER陽性,亞洲常見,侵襲性高)。HTLV-1(成人T細胞白血病)、HIV、HHV-8(卡波西)非此。故與EBV最有關。","options":{"A":"HTLV-1與成人T細胞白血病相關。","B":"鼻型NK/T細胞淋巴瘤與EBV相關—正解。","C":"HIV非直接致此淋巴瘤。","D":"HHV-8與卡波西肉瘤相關。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112100-78":{"quick":"潛伏感染並潛藏於感覺神經元的是單純疱疹病毒與水痘帶狀疱疹病毒(①③)。","detail":{"background":"潛伏感染(latent infection)並潛藏於感覺神經元(神經節)的病毒:①單純疱疹病毒(HSV)——潛伏於三叉神經節/薦神經節;③水痘-帶狀疱疹病毒(VZV)——潛伏於背根/腦神經節,再活化致帶狀疱疹。(②若為其他非神經節潛伏的病毒則不符)。故潛藏感覺神經元者為①③(13)。","options":{"A":"含②不符。","B":"遺漏③。","C":"含②不符。","D":"①單純疱疹③水痘帶狀疱疹潛藏感覺神經元—正解(13)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_112100-98":{"quick":"結核分枝桿菌較不會引起周邊神經病變;白喉、水痘帶狀疱疹、痲瘋則會。","detail":{"background":"引起周邊神經病變的感染:①「白喉(diphtheria)——外毒素致脫髓鞘性周邊神經病變」;②「水痘-帶狀疱疹(VZV)——帶狀疱疹後神經痛、神經發炎」;③「痲瘋(leprosy)——侵犯周邊神經致感覺喪失(典型)」。而「結核分枝桿菌(M. tuberculosis)」主要致肺/全身結核,較不會直接引起周邊神經病變。故較不會者為結核分枝桿菌。","options":{"A":"結核分枝桿菌較不引起周邊神經病變—正解。","B":"白喉外毒素致周邊神經病變。","C":"水痘帶狀疱疹致神經病變。","D":"痲瘋侵犯周邊神經。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_113090-88":{"quick":"輪狀病毒(rotavirus)最不常見造成病毒性肺炎(主要致腸胃炎)。","detail":{"background":"造成病毒性肺炎的常見病原:流感病毒(influenza)、副流感病毒(parainfluenza)、腺病毒(adenovirus)、呼吸道融合病毒(RSV)、COVID等。而「輪狀病毒(rotavirus)」主要造成嬰幼兒腸胃炎(水瀉),最不常造成肺炎。故最不常見者為輪狀病毒。","options":{"A":"輪狀病毒主要致腸胃炎、最不常致肺炎—正解。","B":"副流感病毒可致肺炎。","C":"流感病毒可致肺炎。","D":"腺病毒可致肺炎。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114020-78":{"quick":"卡格氏症(Chagas病)由錐蝽傳播,非蚊子媒介。","detail":{"background":"蚊子(mosquito)媒介的傳染病:①「茲卡病毒(Zika,斑蚊)」;②「瘧疾(瘧蚊)」;③「淋巴絲蟲病(蚊)」(及登革、黃熱、日本腦炎、絲蟲)。而「卡格氏症(Chagas病,枯西氏錐蟲)」由錐蝽(triatomine bug,獵蝽)傳播,非蚊子媒介。故非蚊媒者為Chagas病。","options":{"A":"茲卡病毒由蚊子(斑蚊)媒介。","B":"瘧疾由蚊子(瘧蚊)媒介。","C":"淋巴絲蟲病由蚊子媒介。","D":"Chagas病由錐蝽傳播(非蚊媒)—正解。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114020-92":{"quick":"息肉性膀胱炎最常見的原因為長期放置尿管。","detail":{"background":"「息肉性(乳頭狀)膀胱炎(polypoid cystitis)」最常見的原因是長期放置尿管(導尿管)——導尿管長期機械性刺激膀胱黏膜,致黏膜水腫、發炎與乳頭狀/息肉狀反應性增生。K他命(間質性膀胱炎)、大腸桿菌(一般膀胱炎)、HPV(尖狀濕疣)非息肉性膀胱炎主因。故為長期放置尿管。","options":{"A":"長期放置尿管為息肉性膀胱炎最常見原因—正解。","B":"長期吸K他命致間質性/纖維化膀胱炎。","C":"大腸桿菌致一般細菌性膀胱炎。","D":"HPV致尖狀濕疣。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114020-98":{"quick":"圓錐角膜(keratoconus)主要病理是角膜中央變薄錐狀突出,「Descemet膜斷裂」非主要特徵,故D最不適當。","detail":{"background":"眼睛疾病:①「Fuchs營養不良——角膜內皮(endothelium)缺損→角膜水腫」(A正確);②「瞼裂斑(pinguecula)與翼狀贅片(pterygium)與日光造成的結膜受損有關」(B正確);③「疱疹基質角膜炎(herpes stromal keratitis)主要為免疫反應致角膜受損」(C正確);④「圓錐角膜(keratoconus)主要病理是角膜中央進行性變薄、向前錐狀突出,Descemet膜斷裂只在急性水腫(hydrops)時才發生,非主要病理特徵」——故D最不適當。故D最不適當。","options":{"A":"Fuchs營養不良為角膜內皮缺損,正確。","B":"瞼裂斑/翼狀贅片與日光有關,正確。","C":"疱疹基質角膜炎為免疫致角膜受損,正確。","D":"圓錐角膜主要為角膜變薄錐狀突出(非Descemet膜斷裂)—錯誤(正解)。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114090-86":{"quick":"本題公告「一律給分」;鼻咽癌與EBV(非高危HPV)相關。","detail":{"background":"鼻咽癌(NPC):①「與Epstein-Barr病毒(EBV)相關(而非高危險型HPV,故A的與HR-HPV相關敘述錯誤)」;②「台灣與中國東南方盛行率高(地方性,與EBV、基因、飲食醃製食物有關)」(B正確);③「形態學分角化型、非角化型、基底樣鱗癌」(C正確);④「常見症狀頸部腫塊、聽力障礙/耳閉塞、痰/鼻涕帶血、鼻塞、頭痛」(D正確)。本題經評定後「一律給分(送分)」(以A與EBV非HPV相關為要點)。","options":{"A":"鼻咽癌與EBV(非高危HPV)相關(本題送分)—正解。","B":"台灣與中國東南方盛行率高,正確。","C":"分角化/非角化/基底樣型,正確。","D":"常見症狀含頸部腫塊/帶血等,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114090-93":{"quick":"黃瘤肉芽腫性腎盂腎炎與Proteus mirabilis感染最為密切。","detail":{"background":"「黃瘤肉芽腫性腎盂腎炎(xanthogranulomatous pyelonephritis)」是慢性破壞性腎盂腎炎,常與泌尿道阻塞(結石,尤鹿角狀結石)合併Proteus mirabilis(或大腸桿菌)感染:病理見充滿脂質的泡沫狀巨噬細胞(黃瘤細胞)與肉芽腫(腎臟瀰漫破壞,似腎癌)。肺炎鏈球菌、結核菌、沙門氏菌非主因。故為Proteus mirabilis。","options":{"A":"肺炎鏈球菌非此病主因。","B":"結核菌致結核性腎盂腎炎(不同)。","C":"黃瘤肉芽腫性腎盂腎炎與Proteus mirabilis最密切—正解。","D":"沙門氏菌非此主因。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_114090-100":{"quick":"兩歲以下幼兒化膿性關節炎最常見病原非沙門氏桿菌(為金黃葡萄球菌等),故A最不適當。","detail":{"background":"感染性關節炎:①「兩歲以下幼兒化膿性關節炎最常見病原是金黃葡萄球菌、B群鏈球菌、流感嗜血桿菌(Hib),沙門氏桿菌主要見於鐮刀型貧血病人,故A兩歲以下最常見沙門氏菌最不適當」——A錯誤;②「成人化膿性關節炎最常為金黃葡萄球菌」(B正確);③「結核性關節炎好發承重關節(髖、膝、脊椎)」(C正確);④「淋病性關節炎好發於補體C5-C9(膜攻擊複合體)缺損者(易播散性淋病)」(D正確)。故A最不適當。","options":{"A":"兩歲以下化膿性關節炎最常為金黃葡萄球菌等(非沙門氏菌)—錯誤(正解)。","B":"成人最常為金黃葡萄球菌,正確。","C":"結核性關節炎好發承重關節,正確。","D":"淋病性關節炎好發補體C5-C9缺損者,正確。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_106100-83":{"quick":"30歲抽菸男性下肢間歇跛行、戒菸後改善,為堵塞性血栓血管炎(Buerger氏病)。","detail":{"background":"「堵塞性血栓血管炎(thromboangiitis obliterans, Buerger氏病)」好發年輕(<45歲)重度吸菸男性:侵犯四肢中小型動靜脈,致血栓性發炎、節段性阻塞,臨床間歇性跛行、肢端缺血疼痛/壞疽,與吸菸強相關,戒菸可顯著緩解。顯微多血管炎、結節性多動脈炎、Wegener肉芽腫的表現不同。故為堵塞性血栓血管炎。","options":{"A":"顯微多血管炎為ANCA相關小血管炎。","B":"結節性多動脈炎為中血管壞死性炎。","C":"堵塞性血栓血管炎(Buerger,抽菸、戒菸改善)—正解。","D":"Wegener肉芽腫侵犯呼吸道與腎。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_107100-82":{"quick":"升主動脈擴張、內膜出血併剝離,病理為囊狀中膜變性併主動脈剝離。","detail":{"background":"本題突發胸骨後撕裂痛延伸至上顎、暈厥、影像升主動脈擴張、內膜出血——典型為主動脈剝離(aortic dissection),其最常見的病理基礎是囊狀中膜變性(cystic medial degeneration)(中膜彈性纖維與平滑肌退化、基質黏液堆積,常與高血壓、馬凡氏症相關)。嚴重粥狀硬化動脈瘤、主動脈炎、化膿感染非典型剝離基礎。故為囊狀中膜變性併主動脈剝離。","options":{"A":"囊狀中膜變性併主動脈剝離—正解。","B":"嚴重粥狀硬化多致腹主動脈瘤(非升主動脈剝離)。","C":"主動脈炎(淋巴漿細胞)為梅毒/血管炎。","D":"粥腫併化膿感染為黴菌性動脈瘤。"},"sources":["Robbins & Cotran《Pathologic Basis of Disease》","Robbins基礎病理學","Kumar病理學"]}},"med2_107100-100":{"quick":"承上題(誤食農藥致急性肺損傷),最可能的組織變化為瀰漫性肺泡傷害。","detail":{"background":"承上題(誤食農藥百草枯等致呼吸困難、肺順應性下降(low compliance)、瀰漫性肺陰影——急性呼吸窘迫症候群(ARDS)):其組織病理變化是瀰漫性肺泡傷害(diffuse alveolar damage, DAD)——肺泡上皮與微血管內皮損傷、玻璃樣膜(hyaline membrane)形成、水腫、後期纖維化。肺泡擴大(肺氣腫)、肉芽腫性血管炎、中性球浸潤非ARDS的組織變化。故為瀰漫性肺泡傷害。","options":{"A":"瀰漫性肺泡傷害(ARDS的組織變化)—正解。","B"
