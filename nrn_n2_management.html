k":"願景=組織追求的終極目標,讓員工知道未來展望。","detail":{"background":"組織的方向性文件各有層次:使命說明組織存在的根本目的與服務對象;願景描繪組織未來想達到的理想狀態與終極目標,讓成員看見努力之後的樣貌而產生共同的期待;價值觀是成員共享的信念,提供行為的判準;至於工作程序與步驟,則屬作業層面的規範。題幹要問的是願景,對應的是對未來展望的描繪,而非目的、信念或步驟。實務上使命較為穩定,願景則會隨著階段性目標達成而更新,兩者都應以簡短易記的語句讓成員朗朗上口。故選 C。","options":{"A":"存在的主要目的是使命。","B":"共同信念是價值觀。","C":"正確(本題答案)。願景=終極目標未來展望。","D":"活動步驟是程序。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"112030-N2-67":{"quick":"組織結構=矩陣式組織是按專案需求組成。","detail":{"background":"組織結構:B「矩陣式組織是按專案需求組成(功能線+專案線雙重指揮)」正確。A「扁平式營運成本較高」錯(扁平層級少、成本較低);C「科層式最能反映同仁意見」錯(科層層級多、較難反映);D「委員式可提升決策品質」(委員合議可集思但較慢,本題以B為正解)。故B。","options":{"A":"扁平式成本較低,非較高。","B":"正確(本題答案)。矩陣式按專案需求組成。","C":"科層式較難反映同仁意見。","D":"委員式較慢(本題正解B)。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"112030-N2-74":{"quick":"喜歡一起旅遊唱歌聚集=非正式組織。","detail":{"background":"非正式組織是成員基於情感、興趣或共同嗜好自然結合而成的人際網絡,例如喜歡一起旅遊、唱歌的同仁形成的小圈子,沒有明文編制與職掌,卻能提供情緒支持、加速訊息流通,也可能傳播謠言或形成對政策的抗拒。功能式組織依專業功能劃分部門,部門化組織依業務性質分組,矩陣式則在功能結構上疊加專案指揮線,三者都屬正式結構的設計方式。管理上不宜壓制非正式組織,而應了解其意見領袖並善加溝通,使其成為政策推行的助力。故選 B。","options":{"A":"功能式是正式組織。","B":"正確(本題答案)。興趣聚集=非正式組織。","C":"部門化是正式劃分。","D":"矩陣式是正式雙重隸屬。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"112110-N2-69":{"quick":"只向一位主管負責、明確職掌呈報=單一指揮原則。","detail":{"background":"組織結構設計的原則之一是單一指揮,亦即每位成員只向一位主管負責,並有明確的工作職掌與呈報系統,以避免多頭馬車、命令衝突與責任不清。其餘原則包括保持彈性以因應環境變化、維持職權與責任的平衡,以及依任務需要作權宜調整。題幹同時強調只向一位主管負責與明確的呈報系統,指向的正是統一指揮的要求。單一指揮之所以重要,在於命令來源一致才能責任明確;矩陣式組織因設計上違反此原則,更需要事前的協調機制。故選 D。","options":{"A":"保持彈性原則非此。","B":"任務權宜非此。","C":"維持平衡非此。","D":"正確(本題答案)。只向一位主管=單一指揮原則。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"112110-N2-70":{"quick":"重視規章、明確層級、高度分工=科層式結構。","detail":{"background":"科層式結構即韋伯所描述的官僚體制,特徵包括重視規章制度、明確的層級節制與呈報關係、成員職責清楚界定、依專業高度分工,以及依法行事而非依人情。它的優點是穩定、公平與可預測,缺點是僵化、程序繁複、難以快速回應變化。簡單式結構規模小而層級少;功能式強調依專業劃分部門;專案式則依任務臨時編組。現代醫院多在科層基礎上加入授權、專案小組與資訊化,以兼顧制度的穩定與應變的彈性。故選 B。","options":{"A":"簡單式是無正式結構。","B":"正確(本題答案)。規章層級分工=科層式結構。","C":"功能式是依功能分部。","D":"專案式是任務編組。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"113030-N2-43":{"quick":"規模小複雜性低的護理之家=簡單式結構。","detail":{"background":"組織結構應與規模及複雜度相稱。簡單式結構層級少、部門化程度低、決策集中於負責人,溝通直接而反應快速,行政成本低,最適合規模小、業務單純的機構,例如小型護理之家。科層式結構規章繁複、分工細密,適合大型組織但對小機構過於笨重;矩陣式適用於需要跨部門專案整合;專案式則依任務臨時編組。規模小卻套用複雜結構,只會增加不必要的協調負擔。隨著機構規模擴大、業務漸趨複雜,簡單式結構會出現決策壅塞的瓶頸,此時才需逐步引入分工與制度化。故選 C。","options":{"A":"專案式適大型任務組織。","B":"矩陣式適大型複雜組織。","C":"正確(本題答案)。小規模低複雜=簡單式結構。","D":"科層式適大型組織。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"113180-N2-44":{"quick":"依人員專長專業分工劃分部門=功能式組織。","detail":{"background":"功能式組織依人員的專長與專業分工來劃分部門,把性質相近的人才集中在同一單位,例如醫院設醫療部、護理部、藥劑部與營養部,好處是專業深化、訓練一致與資源共用,缺點則是各部易生本位主義、跨部門協調成本高。直線式描述的是指揮鏈由上而下的權責形式;部門式一般指依產品、地區或服務對象劃分;集權式講的則是決策權集中的程度。多數醫院的基本架構都是功能式,再依需要疊加委員會或專案小組來處理跨部門議題。故選 B。","options":{"A":"直線式是指揮鏈。","B":"正確(本題答案)。依專業分工=功能式組織。","C":"部門式是依產品/地區。","D":"集權式是決策集中。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"113180-N2-45":{"quick":"組織分權特性=於組織中發揮權力相互制衡功能。","detail":{"background":"組織分權特性:B「於組織中發揮權力相互制衡功能(權力分散、相互監督制衡)」正確。A「分權者對分配後的職責負有責任」——授權後主管仍負最終責任(此敘述須對應);C「造成權力過於集中或濫用」是集權的缺點(非分權);D「導致決策風險或重大失誤」非分權必然。故B。","options":{"A":"授權後主管仍負最終責任。","B":"正確(本題答案)。分權發揮權力相互制衡。","C":"權力過於集中是集權缺點。","D":"決策風險非分權必然。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"114030-N2-43":{"quick":"集權式組織優點=減少工作重複及成本。","detail":{"background":"集權式組織把決策權集中於高層,優點是政策一致、避免各單位各行其是造成的工作重複與資源浪費,採購與作業標準統一也能壓低成本,緊急時指揮明確、反應迅速。至於員工感到自由受尊重、部門之間容易相互溝通,則是分權式的長處;而職權與職責的階層完整,描述的是層級設計是否健全,與集權或分權並無必然關係。集權與分權並非二選一,多數醫院在採購、資訊與品質標準上採集權,在臨床作業與排班上則保留單位的裁量空間。故選 A。","options":{"A":"正確(本題答案)。集權減少工作重複及成本。","B":"員工自由受尊重是分權。","C":"階層完整偏分權。","D":"部門易溝通偏分權。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"114170-N2-39":{"quick":"護理部分權式組織=扁平式結構?本題答案B(高聳式可減少部門間衝突)。","detail":{"background":"本題官方答案B。組織結構敘述:B「高聳式結構,可減少部門間衝突(層級分明、職責清楚、衝突少)」為正確項。分權式組織通常對應「扁平式(層級少、授權多、員工自主高、利於留才)」;選項C「扁平式授權少員工自主低」、D「扁平式較不易留才」皆與扁平特性相反(錯),A「高聳式講求溝通效率」錯(高聳溝通層級多較慢)。本題以B為正確敘述。","options":{"A":"高聳式溝通層級多較慢,非講求效率。","B":"正確(本題答案)。高聳式層級分明可減少部門衝突。","C":"扁平式授權多員工自主高,非低。","D":"扁平式利於留才,非不易留才。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"115030-N2-44":{"quick":"分權化、各階層較多自主權=扁平式。","detail":{"background":"組織結構依分權化程度與層級多寡而有不同樣貌。扁平式結構把中間層級合併或裁減,層級少而管轄幅度大,決策權下授到各階層,成員擁有較多自主權,溝通路徑短、反應快速,適合成員專業成熟度高的單位。官僚式強調層級節制與依規章行事,決策偏向集中;長型或高聳式層級多而自主空間小;矩陣式的重點在雙重隸屬而非分權程度。組織扁平化的前提是成員具備足夠能力與責任感,若在人員經驗不足時貿然減少層級,反而會出現督導不足的風險。故選 C。","options":{"A":"官僚式層級嚴明。","B":"矩陣式是雙重隸屬。","C":"正確(本題答案)。分權自主=扁平式。","D":"長型式是層級多。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"102030-N2-64":{"quick":"好的解決方案「不包括」=應用較多資源(應用較少資源才好)。","detail":{"background":"評估解決方案的優劣通常看幾個條件:是否符合組織的目標與價值、預期效果的確定性高不高、風險與副作用是否在可承受範圍,以及能否以較少的資源達成。因此耗用較多資源並不是好方案的條件,反而是應盡量避免的成本;確定性高、冒險性低與符合組織目標,則都是正面條件。臨床上評估專案方案時,常以效益、可行性、成本與風險四個面向逐項評分再加總比較,資源耗用愈多的方案,除非效益明顯更高,否則不會被選為最佳解。故選 B。","options":{"A":"符合組織目標是好方案條件。","B":"正確(本題答案)。好方案應用較少資源,非較多。","C":"確定性高是好方案條件。","D":"冒險性低是好方案條件。"},"sources":["新文京《護理行政》決策與問題解決","華杏《護理行政學》決策模式"]}},"102030-N2-72":{"quick":"發現未依常規執行,首先應=確認並承認問題。","detail":{"background":"問題解決的步驟依序為:確認並承認問題確實存在、蒐集資料分析原因、發展可能的解決方案、選擇並執行方案、評值成效。第一步之所以是承認問題,是因為主管若否認或淡化現象,後續的分析與行動都不會發生。護理長發現同仁未依護理常規執行技術時,應先確認這個落差確實存在且需要處理,而不是直接下令或跳到方案設計。臨床上常見的錯誤是跳過確認直接歸咎個人,若真正原因是常規本身不合實務或人力不足,再多的命令也無法改變行為。故選 B。","options":{"A":"命令依常規未先確認問題。","B":"正確(本題答案)。首先確認並承認問題。","C":"分析問題是後續。","D":"計劃方案是後續。"},"sources":["新文京《護理行政》決策與問題解決","華杏《護理行政學》決策模式"]}},"103030-N2-69":{"quick":"解決問題原則=先確認哪個問題影響組織利益最大。","detail":{"background":"解決問題應講求優先順序與資源運用:先辨識哪一個問題對組織利益或病人安全影響最大,把有限的時間投注在關鍵少數,而不是每件事都親自處理或糾結於枝微末節。適度授權可讓部屬成長;遇到專業性高或需要客觀第三方的議題,借重院外專家反而更有效率。這正是管理上例外原則與重點管理的精神。因此主管應把心力放在影響層面最廣的關鍵問題上,例行且影響有限的事務則交由部屬依既定流程處理。故選 B。","options":{"A":"不應事必躬親(應授權)。","B":"正確(本題答案)。先確認影響利益最大的問題。","C":"必要時可借助外部專家。","D":"應抓重點非鑽小細節。"},"sources":["新文京《護理行政》決策與問題解決","華杏《護理行政學》決策模式"]}},"103100-N2-57":{"quick":"護理紀錄完成率下降,決策第一步=識別問題。","detail":{"background":"決策的流程依序為:識別並界定問題、蒐集與分析資料、設定目標與評選標準、發展可行方案、比較並選擇方案、執行與評值。第一步是把現象轉譯成明確的問題敘述,例如護理紀錄完成率下降究竟出在人力、系統操作還是流程設計;若跳過這一步直接設定目標或推舉負責人,後續的方案很可能對錯了症。問題界定得愈具體,後續的資料蒐集與方案設計就愈聚焦,這也是為何決策模式一律把識別問題放在第一步。故選 A。","options":{"A":"正確(本題答案)。決策第一步=識別問題。","B":"選擇方案是後續。","C":"推舉負責人是後續。","D":"設定目標是後續。"},"sources":["新文京《護理行政》決策與問題解決","華杏《護理行政學》決策模式"]}},"104030-N2-57":{"quick":"「均須正確洗手」=確定性決策。","detail":{"background":"決策類型(依結果可預測性):確定性(certainty,結果已知確定)、風險性(risk,有機率)、不確定性(uncertainty,結果未知)。「每位接觸病人均須正確洗手」(結果明確、依規定必做)=確定性決策(A正確)。故確定性決策(A)。","options":{"A":"正確(本題答案)。結果明確必做=確定性決策。","B":"不確定性是結果未知。","C":"情境混淆非標準。","D":"風險性是有機率。"},"sources":["新文京《護理行政》決策與問題解決","華杏《護理行政學》決策模式"]}},"105090-N2-57":{"quick":"管路滑脫增加,第一步=界定問題,找出原因。","detail":{"background":"問題解決與決策的第一步是界定問題並找出原因。管路滑脫人數增加只是呈現出來的現象,背後可能是約束評估不足、固定方式不當、躁動未及時處理,或人力不足導致巡視間隔拉長,必須先蒐集資料釐清主因,後續的方案才有著力點。計畫活動步驟與找出替代方案都屬方案發展階段,評估決策效能則是執行後的評值,順序都在界定問題之後。實務上可先調閱事件通報單找出共同特徵,例如集中於哪個時段、哪類病人或哪種管路,再據以擬定改善措施。故選 A。","options":{"A":"正確(本題答案)。第一步界定問題找原因。","B":"評估決策效能是後續。","C":"找替代政策是後續。","D":"計畫活動步驟是後續。"},"sources":["新文京《護理行政》決策與問題解決","華杏《護理行政學》決策模式"]}},"106030-N2-59":{"quick":"腦力激盪、德爾菲技術=團體決策。","detail":{"background":"決策依參與者可分為個人決策與團體決策。腦力激盪法邀集多人在不批評的原則下自由提出構想,再彙整篩選;德爾菲技術則透過多輪匿名問卷,蒐集專家意見並逐輪回饋收斂共識,兩者都以集合眾人智慧為前提,屬團體決策。個人與獨裁決策由一人定案,速度快但視野有限;諮商決策雖徵詢意見,最終仍由主管單獨決定,參與程度低於團體決策。團體決策的優點是資訊完整、接受度高,缺點是耗時且可能出現團體迷思;腦力激盪重量不重質、暫緩批評,德爾菲則以匿名避免權威壓力,兩者都是為了克服這些缺點而設計。故選 D。","options":{"A":"個人決策是一人決定。","B":"諮商是主管聽建議後自決。","C":"獨裁是主管獨斷。","D":"正確(本題答案)。腦力激盪德爾菲=團體決策。"},"sources":["新文京《護理行政》決策與問題解決","華杏《護理行政學》決策模式"]}},"107030-N2-70":{"quick":"將過去意外列入新人訓練避免再發生=經驗談(問題解決法)。","detail":{"background":"問題解決的方法可依所依據的資訊來源區分:直覺法憑主觀感受快速判斷;嘗試錯誤法逐一試驗直到找到可行辦法;經驗談則援引過去實際發生過的事件與處理心得,把教訓轉化為預防措施。護理長把單位曾發生的意外疏失整理成新進人員訓練教材,正是以既有經驗避免重蹈覆轍。這種作法成本低且貼近實務,但仍須留意經驗未必適用於改變後的新情境。更完整的作法是把個案討論與根本原因分析納入訓練,讓新人理解事件的成因而不只是記住結論。故選 D。","options":{"A":"直覺法是憑直覺。","B":"嘗試錯誤是試誤。","C":"自我解決非借鏡經驗。","D":"正確(本題答案)。借鏡過去經驗=經驗談。"},"sources":["新文京《護理行政》決策與問題解決","華杏《護理行政學》決策模式"]}},"108110-N2-58":{"quick":"決策矩陣分析=將不同方案及影響因素以矩陣列出依影響因素選擇。本題答案D。","detail":{"background":"本題官方答案D。決策矩陣分析(decision matrix):D「將不同方案及其影響因素以矩陣方式列出,決策者依各方案之影響因素選擇」正確。A「非數量方法」錯(可量化評分);B「依優缺點」、C「依成功機率與期望值」敘述不如D完整。故D。","options":{"A":"決策矩陣可量化評分。","B":"依優缺點敘述不完整。","C":"依機率期望值敘述不完整。","D":"正確(本題答案)。依方案的影響因素矩陣選擇。"},"sources":["新文京《護理行政》決策與問題解決","華杏《護理行政學》決策模式"]}},"108110-N2-59":{"quick":"規劃的核心觀念=決策。","detail":{"background":"規劃是建構並發展一套行動方案以解決問題或達成目標的過程,其中每一個環節都在做選擇:要達成哪些目標、優先順序為何、採取哪一種途徑、投入多少資源、由誰執行,因此決策被視為規劃的核心。目標是規劃要指向的終點,預測是提供判斷依據的前置作業,計畫則是規劃產出的具體文件。三者都圍繞著決策而存在,少了選擇的動作,規劃便無法推進。因此提升規劃品質的關鍵,在於決策所依據的資訊是否充分、評選準則是否明確,而不只是把計畫寫得漂亮。故選 A。","options":{"A":"正確(本題答案)。規劃的核心觀念是決策。","B":"目標是規劃要素之一。","C":"預測是規劃要素之一。","D":"計畫是規劃產物。"},"sources":["新文京《護理行政》決策與問題解決","華杏《護理行政學》決策模式"]}},"109030-N2-57":{"quick":"先提初步方針再聽意見、由護理長做決策=諮商型決策。","detail":{"background":"決策模式:護理長「先提初步方針→請同仁提意見→由護理長(自己)做決策」=諮商型(consultative)決策(C正確,主管徵詢部屬意見後仍自行決定)。獨裁型(不徵詢)、團體型(共同決定)、授權型(下放決定)皆非「徵詢後自決」。故諮商型(C)。","options":{"A":"獨裁型不徵詢意見。","B":"團體型是共同決定。","C":"正確(本題答案)。徵詢後自決=諮商型決策。","D":"授權型是下放決定。"},"sources":["新文京《護理行政》決策與問題解決","華杏《護理行政學》決策模式"]}},"109030-N2-61":{"quick":"決策過程=界定問題→確立準則→列舉方案→分析利弊→執行方案。本題答案B。","detail":{"background":"決策的完整程序是:先界定問題,把現象轉譯為明確的待決事項;接著確立決策準則,說明什麼樣的方案才算好,例如成本、可行性、時效與安全;再據此列舉可行方案;然後依準則逐一分析各方案的利弊並比較;最後選定方案、執行並評值。準則之所以要放在列舉方案之前,是為了避免先有偏好的方案再回頭找理由,造成合理化而非合理決策。實務上可把準則寫成一張簡單的評分表,列出成本、時效、可行性與安全等項目並給定權重,再逐案評分。故選 B。","options":{"A":"先列方案再訂準則,順序不當。","B":"正確(本題答案)。界定→準則→列方案→分析→執行。","C":"分析在列方案前,順序不當。","D":"列方案在訂準則前,順序不當。"},"sources":["新文京《護理行政》決策與問題解決","華杏《護理行政學》決策模式"]}},"109110-N2-60":{"quick":"增進決策技能=尋求合適諮詢資源(2)+用陌生眼光看事情(3)+掌握重要資訊(4)。本題答案B「234」。","detail":{"background":"提升決策能力的作法包括:主動尋求合適的諮詢資源,借重他人的專業補足自己的盲點;刻意用陌生的眼光重新看待習以為常的流程,以跳脫既有框架;以及訓練自己辨識並掌握關鍵資訊,避免被枝節淹沒。相對地,完全採用別人的意見等於放棄自己的判斷,無法累積能力;直接複製過去經驗則忽略情境已經改變,兩者都不利於決策技巧的養成。決策能力的養成也仰賴事後檢討:針對做過的決定回顧當時的假設與結果,才能把經驗轉為可遷移的判斷力。故選 B。","options":{"A":"含1(完全採用別人意見)錯。","B":"正確(本題答案,234)。諮詢資源、陌生眼光、掌握資訊。","C":"含...不符。","D":"含1錯。"},"sources":["新文京《護理行政》決策與問題解決","華杏《護理行政學》決策模式"]}},"109110-N2-62":{"quick":"聽報告詢去年作法、不要差異經多人同意=政治的決策理論。","detail":{"background":"護理部主任決定慶祝活動「聽報告、詢去年作法、不要太大差異、要經多人同意」(權衡各方、求共識、避免風險)=政治的(political)決策理論(B正確,透過協商、妥協、聯盟達成可接受方案)。理性(最佳化)、行為(有限理性)、規範決策皆非「政治協商求共識」。故政治的決策理論(B)。","options":{"A":"理性決策追求最佳化。","B":"正確(本題答案)。協商求共識避風險=政治的決策理論。","C":"行為決策是有限理性。","D":"規範決策非此。"},"sources":["新文京《護理行政》決策與問題解決","華杏《護理行政學》決策模式"]}},"109110-N2-74":{"quick":"火花濃煙緊急辨識解除危機=直覺思考。","detail":{"background":"決策者的思考方式可分為理性或邏輯思考與直覺思考。理性思考按部就班蒐集資料、比較方案,適合有時間且資訊完整的情境;直覺思考則憑藉長期累積的經驗,在極短時間內辨識情境並做出判斷,適用於資訊不全且必須立即行動的緊急狀況。護理長巡房時見到樓梯間有火花與濃煙,當下辨識危險並立即處置,依靠的正是經驗形成的快速判斷。直覺並非憑空而來,而是專業經驗長期累積後的快速辨識,這也是為何資深人員在緊急情境中往往反應更快。故選 B。","options":{"A":"邏輯思考需時間推理。","B":"正確(本題答案)。危急快速判斷=直覺思考。","C":"理性思考需時間分析。","D":"創意思考非危急用。"},"sources":["新文京《護理行政》決策與問題解決","華杏《護理行政學》決策模式"]}},"110030-N2-60":{"quick":"非量性決策工具=腦力激盪法。","detail":{"background":"決策工具依是否倚賴數學運算分為量性與非量性兩類。量性工具以數據建模求解,例如作業研究、線性規劃、模擬法與依權重排序計分的排列法,適合條件明確、變數可量化的問題;非量性工具則透過人的經驗與創意產生方案,例如腦力激盪、名目團體技術與德爾菲法,適合問題結構不明或需要創新構想時。腦力激盪重量不重質、暫緩批評,全程不涉及計算。實務上常先以非量性工具發散出多個構想,再用量性工具評分排序,兩類方法互補而非互斥。故選 A。","options":{"A":"正確(本題答案)。腦力激盪法=非量性決策工具。","B":"模擬法是量性。","C":"排列法是量性。","D":"作業研究法是量性。"},"sources":["新文京《護理行政》決策與問題解決","華杏《護理行政學》決策模式"]}},"110030-N2-78":{"quick":"主任與督導個別討論後主任決定=諮商二型決策。","detail":{"background":"Vroom-Yetton決策模式:諮商型分諮商一型(CI,個別徵詢後自決)、諮商二型(CII,集體徵詢後自決)。「主任與督導個別討論後、主任決定」——若個別徵詢應為諮商一型;惟本題官方答案為「諮商二型」(C),係將「與多位督導討論」視為集體諮商。核心:主管徵詢部屬後自行決定=諮商型。","options":{"A":"團體一型是共同決定。","B":"團體二型是共同決定。","C":"諮商一型是個別徵詢後自決。","D":"正確(本題答案)。徵詢督導後主任自決=諮商二型(CII)。"},"sources":["新文京《護理行政》決策與問題解決","華杏《護理行政學》決策模式"]}},"110110-N2-60":{"quick":"LINE群組徵詢意見引導討論排定方案=名義(記名式)團體法。","detail":{"background":"護理長用「LINE群組徵詢大家意見、引導討論、排定解決方案」(成員具名提意見、彙整討論排序)=名義/記名式團體法(nominal group technique)(B正確)。問卷調查、焦點團體(面對面討論)、德菲法(匿名多輪、不互動)皆非「具名群組討論排序」。故名義團體法(B)。","options":{"A":"問卷調查非互動討論。","B":"正確(本題答案)。具名群組討論排序=名義團體法。","C":"焦點團體是面對面討論。","D":"德菲法是匿名多輪。"},"sources":["新文京《護理行政》決策與問題解決","華杏《護理行政學》決策模式"]}},"111030-N2-66":{"quick":"非正式組織=對正式組織有影響(1)+增加工作知能(3)+因利害結合(4)。本題答案C「134」。","detail":{"background":"非正式組織是成員基於情感、興趣、共同背景或利害關係自然結合而成的人際網絡,沒有明文的編制與規章,也不需要指定的決策者來規劃領導,卻具有實質影響力:它能加速訊息流通、提供情緒支持、促進經驗傳承而增進工作知能,也可能傳播謠言或形成對政策的抗拒。因此需明文規定組成與需有決策者規劃領導兩項,描述的是正式組織的特徵。管理上不宜壓制非正式組織,而應了解其意見領袖並善加溝通,使其成為政策推行的助力而非阻力。故選 C。","options":{"A":"含2(明文規定)錯。","B":"345含2不符。","C":"正確(本題答案,134)。影響正式組織、增知能、利害結合。","D":"含2錯。"},"sources":["新文京《護理行政》決策與問題解決","華杏《護理行政學》決策模式"]}},"112030-N2-61":{"quick":"防範先入為主決策陷阱=不要在最先的想法上錨定等(234)。本題答案B「234」。","detail":{"background":"防範先入為主的陷阱,關鍵在於不讓最初的想法主導後續判斷:不在第一個念頭裡打轉,刻意尋找相反的證據;保持開放心胸多方蒐集資料,讓事實而非印象決定方向;向專家請教時先不透露自己的看法,避免對方受到暗示而給出附和的答案。至於完全不先思考就徵詢他人,等於放棄自己的判斷;而堅持用同一套模式探討所有問題,反而是另一種思考僵化。團體決策中亦可指定一人扮演唱反調的角色,刻意挑戰主流看法,以降低共識過早形成所帶來的風險。故選 B。","options":{"A":"含1(不思考)錯。","B":"正確(本題答案,234)。不錨定、徵詢不同意見、多元檢視。","C":"含5不符。","D":"含1錯。"},"sources":["新文京《護理行政》決策與問題解決","華杏《護理行政學》決策模式"]}},"112030-N2-72":{"quick":"Keeney最佳問題解決方案=符合組織目標。","detail":{"background":"評估解決方案的優劣通常看幾個條件:是否符合組織的目標與價值,這是最根本的前提;預期效果是否明確而確定;風險是否在可承受範圍;以及能否以較少的資源達成。因此耗用較多資源、選擇高冒險性或預期效果受限,都是應盡量避免的特徵,只有與組織目標一致才是好方案必備的條件。實務上可把這幾項列成評分表,逐案給分再比較。實務上可把這幾個條件列成評分表並給定權重,逐案打分後比較,避免只憑印象選擇。故選 A。","options":{"A":"正確(本題答案)。最佳方案符合組織目標。","B":"應用較少資源,非較多。","C":"應低冒險,非高冒險。","D":"應預期效果佳,非受限。"},"sources":["新文京《護理行政》決策與問題解決","華杏《護理行政學》決策模式"]}},"112110-N2-57":{"quick":"直覺式決策=直覺訓練透過不斷練習累積培養。","detail":{"background":"直覺式決策(intuitive decision-making):B「直覺訓練是透過不斷的練習,累積培養出直覺能力」正確(直覺源自經驗累積)。A「直覺是超能力」錯(是經驗準備的產物);C「新人不合適過早培養直覺」錯(可逐步培養);D「目標混淆時不應用直覺」錯(目標混淆、時間緊迫時反而常用直覺)。故B。","options":{"A":"直覺非超能力,是經驗產物。","B":"正確(本題答案)。直覺透過練習累積培養。","C":"新人可逐步培養直覺。","D":"目標混淆時反而常用直覺。"},"sources":["新文京《護理行政》決策與問題解決","華杏《護理行政學》決策模式"]}},"112110-N2-59":{"quick":"護理長層級的管理決策=病人問題解決。","detail":{"background":"管理決策依層級與影響範圍分工:高階主管處理策略性、影響全院的議題,例如大量傷患應變機制的建立與醫療糾紛的處理;中階主管處理跨單位的協調,例如單位之間的人力調度;基層主管如護理長,則處理單位內部日常的作業性決策,例如病人照護問題的解決、班表安排與衛材管理。判斷時可問這個決定影響的範圍有多大。這也說明為何護理長的決策多屬短期作業性質,卻最貼近病人,累積起來對照護品質的影響相當直接。故選 D。","options":{"A":"大量傷患應變是高層決策。","B":"單位間人力調度是中層。","C":"醫療糾紛處理是中高層。","D":"正確(本題答案)。病人問題解決=護理長層級決策。"},"sources":["新文京《護理行政》決策與問題解決","華杏《護理行政學》決策模式"]}},"113100-N2-39":{"quick":"培養決策直覺=充實的知識(1)+豐富的經驗(2)→「12」。","detail":{"background":"Klein 研究專家在高壓現場的判斷,指出直覺並非天賦或運氣,而是長期累積的專業知識與大量實務經驗,在腦中形成可辨識的情境樣態,使人能在資訊不全時迅速看出這是哪一種狀況並選擇可行方案。因此培養直覺決策能力的核心是充實知識與豐富經驗,並輔以事後回顧檢討。財富累積與決策能力無關;良好溝通能力有助於團隊協作,卻不是形成直覺判斷的來源。這也說明資深人員為何在緊急情境反應更快,並提醒新人應主動累積個案經驗並在事後回顧,才能加速形成判斷力。故選 A。","options":{"A":"正確(本題答案,12)。充實知識、豐富經驗培養直覺。","B":"含3(財富)不符。","C":"含3、4不符。","D":"含4不符。"},"sources":["新文京《護理行政》決策與問題解決","華杏《護理行政學》決策模式"]}},"113100-N2-44":{"quick":"Sullivan問題解決七步驟首要=確認問題。","detail":{"background":"Sullivan問題解決過程七步驟,首要進行的是「確認問題(define/identify the problem)」(B正確)——先釐清問題本質,才能後續收集資料、分析、訂方案。收集資料、分析資料、訂定方案皆是後續步驟。故確認問題(B)。","options":{"A":"收集資料是後續。","B":"正確(本題答案)。七步驟首要=確認問題。","C":"分析資料是後續。","D":"訂定方案是後續。"},"sources":["新文京《護理行政》決策與問題解決","華杏《護理行政學》決策模式"]}},"114030-N2-49":{"quick":"問題解決原則=優先處理影響組織利益最大的問題。","detail":{"background":"問題解決應講求優先順序與資源運用:先辨識哪一個問題對組織利益或病人安全影響最大,把有限的時間投入關鍵少數,其餘依既定流程交由部屬處理。凡事親自處理不但耗盡主管時間,也剝奪部屬成長機會;過度糾結細節會失去全局視野;而遇到專業性高或需要客觀第三方的議題,借重外部專家反而更有效率,並不損及聲譽。這正是例外原則與重點管理的精神。因此主管應把心力放在影響層面最廣的關鍵問題上,例行且影響有限的事務則交由部屬依既定流程處理。故選 C。","options":{"A":"應適當授權,非事必躬親。","B":"必要時可借助外部專家。","C":"正確(本題答案)。優先處理影響利益最大的問題。","D":"應抓重點非鑽小細節。"},"sources":["新文京《護理行政》決策與問題解決","華杏《護理行政學》決策模式"]}},"115030-N2-39":{"quick":"從眾方案選危害最小=最小極限性策略(minimax)。","detail":{"background":"決策者在「不利後果情況下,從眾多方案中選擇危害最小」的策略=最小極限性(minimax,使最大損失最小化)策略(C正確)。滿意性(夠好即可)、最少缺憾(minimize regret)、樂觀性(maximax,選最好結果)皆非「選危害最小」。故最小極限性策略(C)。","options":{"A":"滿意性策略是夠好即可。","B":"最少缺憾是使後悔最小。","C":"正確(本題答案)。選危害最小=最小極限性策略。","D":"樂觀性策略選最好結果。"},"sources":["新文京《護理行政》決策與問題解決","華杏《護理行政學》決策模式"]}},"103100-N2-58":{"quick":"規劃目的「錯誤」=提升不確定的程度(規劃應「降低」不確定性)。","detail":{"background":"規劃是預先決定要做什麼、由誰做、何時做與如何做的管理功能,目的在於指出努力的方向與衡量指標、避免重複與多餘的行動以節省資源、預先設想可能狀況以降低未來的不確定性,並提供事後管制與評值的基準。因此規劃的作用是減少而非提升不確定的程度,把提高不確定性列為規劃目的,與其本質相反。規劃依時間幅度可分為長程的策略規劃、中程的戰術規劃與短程的作業規劃,層級愈高者時間幅度愈長、內容愈概括。故選 B。","options":{"A":"規劃提供努力指標。","B":"正確(本題答案)。規劃應降低不確定性,非提升。","C":"規劃減少重複行動。","D":"規劃作為管制基礎。"},"sources":["新文京《護理行政》規劃與目標管理","華杏《護理行政學》策略規劃與SWOT"]}},"105030-N2-72":{"quick":"目標管理「不」是優點=極重視量化目標(過度重量化是缺點)。","detail":{"background":"目標管理讓主管與部屬共同訂定目標,再依目標自我控制與檢核,因而能落實分權、促進上下溝通、提高參與感與士氣,並使努力方向明確,這些都是它的優點。它為人詬病之處,恰恰在於過度偏重可量化的指標:難以量化的照護態度、關懷與教學品質容易被忽略,員工也可能為了達標而選擇容易衡量的工作,形成重量不重質的偏差。改善之道是在量化指標之外,同時納入質性的行為描述與同儕回饋,避免目標被窄化為數字。故選 C。","options":{"A":"MBO優點:落實分權。","B":"MBO優點:促進溝通。","C":"正確(本題答案)。過度重量化是MBO缺點,非優點。","D":"MBO優點:提高士氣。"},"sources":["新文京《護理行政》規劃與目標管理","華杏《護理行政學》策略規劃與SWOT"]}},"105030-N2-76":{"quick":"降低離職率屬管理過程的「控制」階段。","detail":{"background":"管理過程包含規劃、組織、人事、領導與控制。控制是把實際結果與既定標準比較,發現偏差後採取矯正行動的階段。離職率是人力穩定度的監測指標,先訂出可接受的範圍,定期比對實際數值,超出即分析原因並提出改善措施,整個循環屬於控制。若是預先訂定人力政策與招募計畫,屬規劃;安排職務與分工屬組織;激勵與溝通則屬領導。控制與規劃互為循環:控制發現的偏差會回饋成下一輪規劃的依據,兩者不是各自獨立的步驟。故選 C。","options":{"A":"領導是引導激勵。","B":"組織是建構結構。","C":"正確(本題答案)。監測改善離職率=控制階段。","D":"規劃是訂目標方案。"},"sources":["新文京《護理行政》規劃與目標管理","華杏《護理行政學》策略規劃與SWOT"]}},"105090-N2-62":{"quick":"「已有國際集團與當地業者合作」=SWOT的威脅(threats)。","detail":{"background":"SWOT 分析以內外部與正負面兩個向度切成四格:優勢與劣勢屬組織內部可掌控的條件,例如自有人才、資金與技術;機會與威脅則來自外部環境,是組織無法直接控制的變化。判讀時先問這句話講的是我方本身還是外在環境,再問它對達成目標是有利還是不利。競爭對手已先一步與當地業者結盟,屬外部且不利,構成進入市場的阻力;而集團自身經費不足尚未投資,才是內部的劣勢。作答時可先在每句話旁標註內部或外部、有利或不利,四格自然對號入座,不必死背定義。故選 D。","options":{"A":"優勢是內部有利。","B":"劣勢是內部不利。","C":"機會是外部有利。","D":"正確(本題答案)。競爭者進入=威脅。"},"sources":["新文京《護理行政》規劃與目標管理","華杏《護理行政學》策略規劃與SWOT"]}},"105090-N2-63":{"quick":"「財團看好趨勢邀請合作」=SWOT的機會(opportunity)。","detail":{"background":"同一段情境中的不同句子,可能分屬 SWOT 的不同象限,因此必須逐句判斷主體與利弊。當地財團看好人口老化與少子化趨勢而主動邀約合作,這件事發生在組織外部,並且為集團帶來原本缺乏的資金與在地通路,對進入市場明顯有利,屬於機會。優勢指的是集團自身已具備的條件,例如先前已協助培訓照護人力所累積的專業與人脈;劣勢是經費不足;威脅則是國際集團已先行布局。實務上機會與威脅常同時出現在同一個環境變化中,例如人口老化既帶來長照商機,也吸引更多競爭者投入。故選 C。","options":{"A":"優勢是內部有利。","B":"劣勢是內部不利。","C":"正確(本題答案)。外部商機=機會。","D":"威脅是外部不利。"},"sources":["新文京《護理行政》規劃與目標管理","華杏《護理行政學》策略規劃與SWOT"]}},"105090-N2-64":{"quick":"專案指導3個月繳進度報告「不包含」目標管理的=績效考核。","detail":{"background":"目標管理的完整循環包含四個環節:先由主管與部屬共同設定明確可衡量的目標;接著擬定行動規劃,決定由誰做、做多少、什麼時候完成;過程中定期檢討進度並適時修正;最後在期末進行績效考核,把達成情形回饋到獎酬與下一輪目標。題幹交代了要提升專案通過率的目標、每人指導一位同仁每月四小時的行動安排,以及三個月後繳交進度報告的定期檢討,唯獨沒有提到期末如何評定成績與連結考績。故選 D。","options":{"A":"含目標設定(提升通過率)。","B":"含行動規劃(指導安排)。","C":"含定期檢討(3個月進度報告)。","D":"正確(本題答案)。未包含績效考核。"},"sources":["新文京《護理行政》規劃與目標管理","華杏《護理行政學》策略規劃與SWOT"]}},"105090-N2-71":{"quick":"目標管理目標設定後下一步=計畫(行動規劃)。","detail":{"background":"目標管理沿用管理程序的順序展開:目標設定完成後,下一步是計畫,亦即把目標拆解為具體的行動方案、時程、負責人與所需資源;接著才是組織,安排人力與分工;再由領導帶動執行;最後以控制比對進度與成果並修正。因此順序是先想清楚要怎麼做,才談誰來做、如何帶動與如何檢核。若把控制或領導放在目標設定之後,等於跳過了把目標轉為行動的關鍵環節。計畫階段擬得愈具體,後續的檢討才有比對的基準,否則目標容易停留在口號而無從追蹤。故選 D。","options":{"A":"組織是後續。","B":"領導是後續。","C":"控制是後續。","D":"正確(本題答案)。目標設定後下一步=計畫(行動規劃)。"},"sources":["新文京《護理行政》規劃與目標管理","華杏《護理行政學》策略規劃與SWOT"]}},"108020-N2-58":{"quick":"依內外環境調整願景價值理念使命=策略性規劃。","detail":{"background":"規劃層級:策略性規劃(strategic,高層、長程、依內外環境調整組織願景/使命/價值)、操作規劃(operational,基層、短程)、方案/偶發規劃。「根據組織與內外環境關係,調整願景、價值觀、理念與使命」=策略性規劃(A正確)。故策略性規劃(A)。","options":{"A":"正確(本題答案)。調整願景使命=策略性規劃。","B":"偶發性規劃是應變。","C":"操作規劃是基層短程。","D":"方案規劃是特定方案。"},"sources":["新文京《護理行政》規劃與目標管理","華杏《護理行政學》策略規劃與SWOT"]}},"108020-N2-61":{"quick":"目標管理(MBO)=強調成員參與決策及共同制定目標。","detail":{"background":"彼得杜拉克目標管理(MBO):D「強調成員參與決策及共同制定目標」最適切。A「只關注組織目標非個人」錯(MBO結合組織與個人目標);B「對人性預設與X理論一致」錯(MBO符合Y理論);C「以過程為導向」錯(MBO是結果/目標導向)。故D。","options":{"A":"MBO結合組織與個人目標。","B":"MBO符合Y理論,非X理論。","C":"MBO是結果/目標導向,非過程。","D":"正確(本題答案)。MBO強調參與決策共同制定目標。"},"sources":["新文京《護理行政》規劃與目標管理","華杏《護理行政學》策略規劃與SWOT"]}},"108110-N2-77":{"quick":"報酬超過能力生產力且差距達10%以上=讓員工... 本題答案C。","detail":{"background":"本題官方答案C。Jaques能力(C)-生產力(W)-報酬(P)模式:C「報酬超過能力及生產力,但與實際及期望報酬差距達10%以上,讓(員工產生罪惡感/壓力等)」為正確敘述。核心:報酬與能力生產力的失衡會影響工作滿意度;報酬過高且差距大也會造成心理壓力。作答以官方C為準。","options":{"A":"能力超過報酬敘述不符。","B":"生產力超過報酬敘述不符。","C":"正確(本題答案)。報酬超過能力生產力差距達10%以上。","D":"生產力超過能力敘述不符。"},"sources":["新文京《護理行政》規劃與目標管理","華杏《護理行政學》策略規劃與SWOT"]}},"109030-N2-60":{"quick":"MBO的SMART:M是目標必須可測量(measurable)。","detail":{"background":"SMART目標原則:S具體(Specific)、M可測量(Measurable)、A可達成(Achievable)、R相關(Relevant)、T有時限(Time-bound)。選項A「M的意義是目標必須可以測量(measurable)」正確。B S是Specific(非superb)、C T是Time-bound(非transformable)、D R是Relevant(非remarkable)。故A。","options":{"A":"正確(本題答案)。M=可測量(measurable)。","B":"S是Specific,非superb。","C":"T是Time-bound,非transformable。","D":"R是Relevant,非remarkable。"},"sources":["新文京《護理行政》規劃與目標管理","華杏《護理行政學》策略規劃與SWOT"]}},"109110-N2-58":{"quick":"MBO(目標管理)=234(參與制定、定期檢討、結果導向)。本題答案B。","detail":{"background":"Drucker 的目標管理是一套以參與式管理為基礎、逐層轉化的制度:院級目標向下拆解為部門與個人目標,主管與部屬共同商訂,使目標同時成為激勵部屬的工具;過程中部屬依既定目標自我控制進度並定期回報,主管扮演支持與排除障礙的角色;期末則依目標達成情形評價。它是結果導向而非單純的過程導向,評價也不會只以部屬單方的成效為唯一依據。目標管理的常見失敗原因是目標由上而下硬性下達、或指標偏重容易量化的項目,使制度流於形式。故選 B。","options":{"A":"含1(只關注組織)錯。","B":"正確(本題答案,234)。參與制定、定期檢討、結果導向。","C":"含5不符。","D":"含1錯。"},"sources":["新文京《護理行政》規劃與目標管理","華杏《護理行政學》策略規劃與SWOT"]}},"110030-N2-57":{"quick":"目標管理「錯誤」=主管決策(MBO應由主管與員工共同設定目標)。","detail":{"background":"目標管理的要件包括:訂定具體且可衡量的目標,使成果能被客觀檢核;設定明確的完成期限,讓進度有所依循;以及在過程中與期末提供績效回饋與評估,把結果連結到改善與獎酬。最關鍵的是目標由主管與部屬共同商訂,而非由主管單方決策後交辦,因為員工參與訂定自己的目標,才會產生承諾並願意自我控制進度,這正是目標管理與傳統交辦最大的差別。因此推動目標管理時,主管的角色是引導與支持,而非把年度指標拆好後直接分配下去。故選 B。","options":{"A":"MBO:可衡量具體目標。","B":"正確(本題答案)。MBO是共同設定,非主管單獨決策。","C":"MBO:明確期限。","D":"MBO:績效回饋評估。"},"sources":["新文京《護理行政》規劃與目標管理","華杏《護理行政學》策略規劃與SWOT"]}},"110030-N2-61":{"quick":"規劃護理管理工作的核心觀念=決策。","detail":{"background":"規劃是為了解決問題或達成目標而建構一套行動方案的過程,其中每一個環節都在做選擇:要達成什麼目標、優先順序如何排、採取哪一條途徑、投入多少資源、由誰執行與何時完成,因此決策被視為規劃的核心概念。分析資料是支援決策的前置作業,簡化流程是規劃可能產出的其中一種方案,開源節流則是財務面的目標之一,三者都圍繞決策而存在。因此提升規劃品質的關鍵,在於決策所依據的資訊是否充分、評選準則是否明確,而不只是把計畫書寫得漂亮。故選 B。","options":{"A":"分析資料是規劃的一環。","B":"正確(本題答案)。規劃核心觀念=決策。","C":"簡化流程非核心。","D":"開源節流非核心。"},"sources":["新文京《護理行政》規劃與目標管理","華杏《護理行政學》策略規劃與SWOT"]}},"110030-N2-62":{"quick":"革新目標設定最佳=6個月內降低壓瘡發生率至0.10%(具體可測量有時限)。","detail":{"background":"目標設定應「具體、可測量、有時限、實際可達」。選項C「於6個月內降低病人壓瘡發生率至0.10%」最佳(C正確,有時限+可測量+實際)。A「滿意度至100%」(不切實際)、B「降低中心靜脈導管感染率」(無量化目標值/時限)、D「提升留任率」(無量化)皆不夠具體。故C。","options":{"A":"滿意度100%不切實際。","B":"無量化目標值與時限。","C":"正確(本題答案)。6個月內降至0.10%具體可測量有時限。","D":"無量化目標值。"},"sources":["新文京《護理行政》規劃與目標管理","華杏《護理行政學》策略規劃與SWOT"]}},"110110-N2-61":{"quick":"規劃目的「錯誤」=增加工作步驟(規劃應「簡化」減少步驟)。","detail":{"background":"規劃的目的在於預先決定要做什麼、由誰做、何時做與如何做:設定明確的目標讓努力有方向、避免重複與多餘的動作而提升效率與效果、預先設想各種可能狀況以降低未來的不確定性,並提供事後管制與評值的基準。因此規劃應該是簡化並整合工作流程,而不是增加工作步驟;若規劃後反而讓程序更繁瑣,通常代表方案設計偏離了初衷。規劃依時間幅度可分為長程的策略規劃、中程的戰術規劃與短程的作業規劃,層級愈高者時間幅度愈長。故選 D。","options":{"A":"規劃設定明確目標。","B":"規劃增加效率效果。","C":"規劃降低不確定性。","D":"正確(本題答案)。規劃應減少步驟,非增加。"},"sources":["新文京《護理行政》規劃與目標管理","華杏《護理行政學》策略規劃與SWOT"]}},"112110-N2-58":{"quick":"規劃原則=規劃應具體可行,切合實際狀況。","detail":{"background":"規劃的原則包括:具體可行且切合實際狀況,目標與作法要能落實而非空談;依據充分資料進行理性分析,而不是憑直覺行事;具有時間性,訂出明確的期程與里程碑;並保持連貫與一致,使長中短程計畫上下銜接。若規劃刻意不連貫,資源將被分散而難以累積成果;若以直覺取代分析,則容易誤判需求與可行性。規劃完成後還須訂出檢核點與負責人,並在執行中依實際狀況滾動修正,計畫才不會停留在紙上。故選 C。","options":{"A":"規劃應理性分析,非憑直覺。","B":"規劃應連貫,非不連貫。","C":"正確(本題答案)。規劃應具體可行切合實際。","D":"規劃應理性分析。"},"sources":["新文京《護理行政》規劃與目標管理","華杏《護理行政學》策略規劃與SWOT"]}},"112110-N2-60":{"quick":"訂定人員工作說明書及職責=組織(organizing)過程。","detail":{"background":"管理過程各階段任務不同:規劃決定要達成什麼目標與採取何種途徑;組織把工作分門別類、設計職位與職掌、界定權責關係並配置人力,工作說明書與職責的訂定正屬此階段的產物;領導透過激勵與溝通帶動執行;控制則比較實際與標準並加以修正。籌備新病房時先寫出各職位的工作說明書,是在建立分工與權責架構。組織階段的產出還包括組織圖、權責劃分表與作業流程,這些文件日後也是考核與交接的依據。故選 B。","options":{"A":"規劃是訂目標方案。","B":"正確(本題答案)。訂工作說明書職責=組織過程。","C":"領導是引導激勵。","D":"控制是監測。"},"sources":["新文京《護理行政》規劃與目標管理","華杏《護理行政學》策略規劃與SWOT"]}},"112110-N2-62":{"quick":"具體可測量目標=降低感染性垃圾50公斤。","detail":{"background":"目標設定具體可測量:B「降低感染性垃圾50公斤(有明確量化數值)」最具體可測量(B正確)。A「提升住院滿意度」、C「提升開刀房留任率」、D「強化100位護理師書寫紀錄能力」皆缺乏明確的「可測量的量化目標值或衡量標準」(D雖有100位但「強化能力」難測量)。故B。","options":{"A":"提升滿意度無量化目標值。","B":"正確(本題答案)。降低50公斤可測量。","C":"提升留任率無量化目標值。","D":"「強化能力」難測量。"},"sources":["新文京《護理行政》規劃與目標管理","華杏《護理行政學》策略規劃與SWOT"]}},"112180-N2-36":{"quick":"非計畫性拔管0%目標=明確期間(1)+可測量(2)?本題答案A「12」。","detail":{"background":"目標管理的目標敘述應具備幾項要素:明確的期間,指出在什麼時間內完成;具體且可衡量的內容,讓成果能被客觀檢核。本年度非計畫性拔管發生率為零,同時交代了時間範圍與可量化的具體指標,因此符合這兩項。至於人員參與與結果回饋,屬於目標管理制度運作的其他環節,講的是目標如何訂定與後續如何檢討,並非這句目標敘述本身所展現的特徵。訂定品質目標時,零這個數字雖具宣示效果,仍須配套可行的改善措施與過程指標,否則容易流於口號。故選 A。","options":{"A":"正確(本題答案,12)。明確期間(本年度)、可測量(0%)。","B":"34不符。","C":"13不符。","D":"24不符。"},"sources":["新文京《護理行政》規劃與目標管理","華杏《護理行政學》策略規劃與SWOT"]}},"113030-N2-36":{"quick":"目標管理=主管須定期評值目標進度,並將結果回饋員工。","detail":{"background":"目標管理(MBO):D「主管須定期評值目標進度,並將結果回饋員工」正確。A「個人與組織目標各自獨立」錯(MBO應結合兩者);B「主管僅做決策、其餘授權員工獨立完成」錯(MBO強調共同參與);C「達成時間限制應保持彈性」錯(MBO應有明確期限)。故D。","options":{"A":"MBO應結合個人與組織目標。","B":"MBO強調共同參與,非只主管決策。","C":"MBO應有明確期限,非彈性。","D":"正確(本題答案)。定期評值進度並回饋員工。"},"sources":["新文京《護理行政》規劃與目標管理","華杏《護理行政學》策略規劃與SWOT"]}},"113180-N2-36":{"quick":"各部門之目標屬戰術性(中程)計畫，由中階主管(護理督導)規劃；其餘三項規劃層級與人員搭配皆有誤，故選D。","detail":{"background":"本題官方答案C。護理部門計畫層級:C「策略性規劃屬中程計畫,應由所有護理主管共同規劃」為正確項。A「組織目標政策屬長程,由基層共同規劃」錯(長程應由高層規劃);B「作業規劃程序屬短程,由護理部主任規劃」錯(短程應由基層);D「各部門目標屬戰略性計畫,由督導規劃」敘述不當。故C。","options":{"A":"組織目標及政策屬長程(策略性)計畫，應由高層規劃，非基層。","B":"作業規劃及程序屬短程計畫，應由基層(護理長)規劃，非主任。","C":"策略性規劃屬長程計畫，非中程。","D":"正解：各部門目標屬戰術性計畫，由護理督導(中階)規劃。"},"sources":["新文京《護理行政》規劃與目標管理","華杏《護理行政學》策略規劃與SWOT"]}},"114030-N2-36":{"quick":"使命或任務=應以顧客的需要為主要依據。","detail":{"background":"使命/任務(mission):B「應以顧客的需要為主要依據(組織存在是為滿足顧客)」正確。A「是策略性規劃的最後步驟」錯(使命是起點/基礎);C「依評鑑標準訂定」錯(使命依組織宗旨與顧客需求);D「為指引員工行為的基本準則」是價值觀非使命。故B。","options":{"A":"使命是規劃的起點,非最後步驟。","B":"正確(本題答案)。使命以顧客需要為依據。","C":"使命依宗旨與顧客需求,非評鑑標準。","D":"指引行為準則是價值觀。"},"sources":["新文京《護理行政》規劃與目標管理","華杏《護理行政學》策略規劃與SWOT"]}},"114030-N2-37":{"quick":"杜拉克目標管理屬=參與式管理。","detail":{"background":"目標管理由 Drucker 提出,核心精神是主管與部屬共同商訂目標,再由部屬依既定目標自我控制進度、定期回報,期末依達成情形評價,因此本質上是一種參與式管理:員工參與訂定自己的目標,才會產生承諾並願意自主管理。權威式由主管單方決定後交辦;放任式主管不介入;民主式雖也重視參與,但一般指以多數意見形成決策的領導型態,與目標管理逐層轉化的制度設計不同。目標管理的常見失敗原因,正是把它做成由上而下的指標分配,員工未參與訂定,自然也不會產生自我控制的動力。故選 A。","options":{"A":"正確(本題答案)。MBO屬參與式管理。","B":"權威式是命令。","C":"放任式是不管。","D":"民主式相近但本題答參與式。"},"sources":["新文京《護理行政》規劃與目標管理","華杏《護理行政學》策略規劃與SWOT"]}},"114170-N2-37":{"quick":"規劃的功能=增加達成目標機會(1)+各單位協調一致(2)+發揮管理績效(3)。本題答案A「123」。","detail":{"background":"規劃的功能在於預先決定要做什麼與怎麼做:目標明確使達成的機會增加;各單位依同一份計畫行動,協調一致性提高;資源與流程事先安排,能減少重複與浪費而發揮管理績效。至於個人承諾度,取決於員工是否參與訂定目標而非規劃本身;而規劃愈細密,通常也代表可調整的空間變小,因此彈性反而受限,兩者都不是規劃必然帶來的效果。規劃依時間幅度可分為長程的策略規劃、中程的戰術規劃與短程的作業規劃,三者必須上下銜接才能累積成果。故選 A。","options":{"A":"正確(本題答案,123)。增達標機會、協調一致、發揮績效。","B":"234不符。","C":"345不符。","D":"145不符。"},"sources":["新文京《護理行政》規劃與目標管理","華杏《護理行政學》策略規劃與SWOT"]}},"101030-N2-71":{"quick":"望年會委託福委會全權辦理=功能性職權授權。","detail":{"background":"授權可依權限的性質區分。直線職權沿著指揮鏈由上而下行使;功能性職權則是把某一特定功能的決定權整體授予某個單位或委員會,使其在該功能範圍內可跨越原有指揮鏈行使權力。醫院把年終聚會的籌辦全權交給福利委員會,即屬此類。工作範圍指職務涵蓋的事項,統一指揮強調一人只受一位主管指揮,金字塔狀階層描述的是組織層級形狀。功能性職權的優點是專業事務由專責單位統一處理,缺點是可能與原直線主管的權責重疊,因此授權時應明訂範圍與期限。故選 B。","options":{"A":"工作範圍非此。","B":"正確(本題答案)。全權辦理特定事務=功能性職權。","C":"統一指揮是單一指揮。","D":"金字塔狀是層級結構。"},"sources":["新文京《護理行政》授權與時間管理","華杏《護理行政學》授權原則"]}},"103030-N2-60":{"quick":"護理長不在授權資深護理師但有副護理長=違反指揮統一?本題答案A(職權與職責均衡)。","detail":{"background":"本題官方答案A。護理長不在時授權「資深護理師」代理,但病房已有「副護理長」在上班——應授權給副護理長(職位職責對應)。授權給資深護理師而非副護理長,違反「職權與職責均衡(職權應與職責相稱)」原則(A)。核心:授權應對應職位職責、循指揮系統。","options":{"A":"正確(本題答案)。違反職權與職責均衡(應授權副護理長)。","B":"指揮統一是只向一位主管。","C":"絕對的職責非此。","D":"金字塔形狀數量非此。"},"sources":["新文京《護理行政》授權與時間管理","華杏《護理行政學》授權原則"]}},"103030-N2-77":{"quick":"依指揮統一原則適合=教育副主任授權甲督導及所屬護理長辦在職教育。","detail":{"background":"指揮統一(unity of command)原則:命令須循單一指揮系統、逐級下達。選項D「教育副主任授權甲督導及其所屬單位護理長辦理在職教育(循自己管轄系統逐級授權)」符合(D正確)。A「未經督導同意直接授權護理長」(越級)、B「甲督導授權乙督導所管轄單位」(跨系統)、C「兩位副主任同時指揮一督導」(雙頭馬車)皆違反指揮統一。故D。","options":{"A":"越級授權違反指揮統一。","B":"跨系統授權違反指揮統一。","C":"兩主任同指揮一督導違反統一。","D":"正確(本題答案)。循自己系統逐級授權符合指揮統一。"},"sources":["新文京《護理行政》授權與時間管理","華杏《護理行政學》授權原則"]}},"104030-N2-59":{"quick":"時間管理「不」是迷思偏差=充分授權(充分授權是正確做法)。","detail":{"background":"時間管理常見的迷思包括:事必躬親,凡事親力親為而不敢授權,結果被瑣事淹沒;能者多勞,把工作不斷堆給效率高的人,造成負荷不均與過勞;以及效率掛帥,只追求把事情做得快,卻忽略做的是不是對的事,亦即重效率而輕效能。相對地,充分授權把適當的工作交給適當的人,並保留主管處理關鍵事務的時間,是時間管理的正確策略而非偏差。時間管理的核心工具是依重要與緊急兩個向度分類,把心力優先投注在重要但不緊急的規劃與預防事項上。故選 B。","options":{"A":"事必躬親是時間管理迷思。","B":"正確(本題答案)。充分授權是正確做法,非迷思。","C":"能者多勞是迷思。","D":"效率掛帥是迷思。"},"sources":["新文京《護理行政》授權與時間管理","華杏《護理行政學》授權原則"]}},"104030-N2-74":{"quick":"時間管理「錯誤」=重要且不急迫的事應優先處理(應先處理重要且急迫)。","detail":{"background":"時間管理(四象限):應「先處理重要且緊急→重要但不緊急→不重要但緊急→不重要不緊急」。選項A「重要且不急迫的事應優先處理」錯誤(本題答案)——應先處理「重要且緊急」的事。B適當拒絕請託、C正確使用電話郵件、D利用零碎時間皆是正確的時間管理。故A。","options":{"A":"正確(本題答案)。應先處理重要且緊急,非重要不急迫。","B":"適當拒絕請託是正確。","C":"正確使用電話郵件是正確。","D":"利用零碎時間是正確。"},"sources":["新文京《護理行政》授權與時間管理","華杏《護理行政學》授權原則"]}},"105090-N2-59":{"quick":"規劃活動依願景指派負責並授權=指導者角色功能?本題答案C。","detail":{"background":"本題官方答案C(指導者)。護理長「規劃一連串病房活動、依醫院願景、指派負責人員並有效授權」——統籌指揮、指派授權=指導者(director)角色功能(C)。促進者(facilitator)、生產者(producer)、創新者(innovator)皆非「統籌指派授權」。故指導者(C)。","options":{"A":"促進者偏協助促成。","B":"生產者偏產出績效。","C":"正確(本題答案)。統籌指派授權=指導者角色。","D":"創新者偏創新變革。"},"sources":["新文京《護理行政》授權與時間管理","華杏《護理行政學》授權原則"]}},"106110-N2-58":{"quick":"常因找藥、家屬要床單、回電而中斷=時間管理的「中斷干擾」?本題答案A。","detail":{"background":"本題官方答案A。護理師發藥常因「在電腦系統找藥物作用、家屬要床單、回電」而中斷——這些都是時間管理的「干擾/中斷(interruption)」。題目問哪一部分屬某類別,以A「常在電腦系統上尋找藥物的作用」為答案(屬可改善的時間浪費/自我造成的中斷)。核心:辨識時間浪費來源以改善。","options":{"A":"正確(本題答案)。找藥物作用屬時間浪費/中斷。","B":"家屬要床單是外來中斷。","C":"回電是外來中斷。","D":"中斷衛教是結果。"},"sources":["新文京《護理行政》授權與時間管理","華杏《護理行政學》授權原則"]}},"106110-N2-70":{"quick":"「不」是促進授權的因素=能拓展主管的威勢(授權目的非為主管威勢)。","detail":{"background":"促進主管授權的因素:A減輕主管時間限制、B卸除主管本身的責任?(授權非卸責)、D培育員工。選項C「能拓展主管的威勢」不是促進授權的因素(本題答案)——授權是為分工、培育員工、減輕負荷,非為「拓展主管威勢」。故C。(註:選項B「卸除責任」嚴格說授權後主管仍負最終責任,但本題以C為答案。)","options":{"A":"授權減輕主管時間限制。","B":"授權分擔工作(主管仍負最終責任)。","C":"正確(本題答案)。拓展威勢非授權目的。","D":"授權培育員工。"},"sources":["新文京《護理行政》授權與時間管理","華杏《護理行政學》授權原則"]}},"106110-N2-72":{"quick":"授權原則「錯誤」=只限於例行性工作(授權不限例行性,亦可授權非例行)。","detail":{"background":"授權原則:B逐級授權(對)、C不可重複授權(對)、D公開授權(對)。選項A「只限於例行性工作」錯誤(本題答案)——授權「不限於例行性工作」,主管可將部分非例行但部屬能勝任的工作授權,但「政策制定、重大決策、人事考核」等核心職權不宜授權。故A。","options":{"A":"正確(本題答案)。授權不限例行性工作。","B":"授權應逐級授權。","C":"授權不可重複授權。","D":"授權應公開授權。"},"sources":["新文京《護理行政》授權與時間管理","華杏《護理行政學》授權原則"]}},"108110-N2-72":{"quick":"授權保管麻醉藥出問題:護理長是管理者應負最後責任。","detail":{"background":"授權原則:授權者(主管)「授權但不授責」——授權後主管仍負「最後管理責任」。護理長授權組長保管麻醉藥,若數量出問題:C「護理長是病房管理者,應負最後管理責任」正確。A「組長負最後責任」錯;B「與管理無關」錯;D「組長與取用者共同負最後責任」錯。故C。","options":{"A":"授權後護理長仍負最後責任,非組長。","B":"與管理有關(護理長負責)。","C":"正確(本題答案)。護理長是管理者負最後管理責任。","D":"護理長負最後責任,非共同。"},"sources":["新文京《護理行政》授權與時間管理","華杏《護理行政學》授權原則"]}},"109030-N2-59":{"quick":"時間管理外在因素=文書工作繁雜(同前;外在因素)。","detail":{"background":"時間管理的阻礙可分為內在與外在兩類。內在因素源自個人的習慣與能力,例如拖延、難以拒絕他人的請託、計畫不夠周全、缺乏組織與排序能力,這些是自己可以透過訓練改變的;外在因素則來自工作環境與制度,例如文書作業繁雜、會議過多、臨時交辦與系統重複登打,需要靠流程簡化或資訊化來改善。四個選項中只有文書工作繁雜屬環境所加諸。區分內外因素的實益在於對策不同:內在因素靠養成習慣與技巧改善,外在因素則需要向上反映並推動制度調整。故選 D。","options":{"A":"難以拒絕是內在因素。","B":"計畫不周是內在因素。","C":"缺乏組織能力是內在因素。","D":"正確(本題答案)。文書工作繁雜是外在因素。"},"sources":["新文京《護理行政》授權與時間管理","華杏《護理行政學》授權原則"]}},"111030-N2-70":{"quick":"未經督導同意直接請護理長負責=違反單一隸屬關係(指揮統一)。","detail":{"background":"授權應遵循幾項原則:被授權者只向一位主管負責,亦即單一隸屬或統一指揮,以免多頭馬車;授權的是職權而非責任,主管仍須為最終結果負責;授權雙方需相互信賴;並依部屬能力量力授予。護理部主任跳過督導長直接指派護理長負責專案,使護理長同時受兩層指揮而督導長不知情,破壞的正是一人一主管的原則,也可能造成資源與進度協調上的落差。正確作法是由主任與督導長先取得共識,再循指揮鏈指派,並讓督導長掌握專案進度以利資源協調。故選 A。","options":{"A":"正確(本題答案)。越級授權違反單一隸屬關係。","B":"授權非授責是責任原則。","C":"相互信賴非此。","D":"量力授權非此。"},"sources":["新文京《護理行政》授權與時間管理","華杏《護理行政學》授權原則"]}},"111110-N2-67":{"quick":"管轄幅度設計=工作越重要管轄幅度應越小。","detail":{"background":"管轄幅度(span of control)設計:C「工作越重要,管轄幅度應越小(主管能仔細監督少數重要工作)」正確。A「環境越複雜幅度越大」錯(複雜應幅度小);B「充分授權幅度越小」錯(授權多可幅度大);D「工作性質變化越大幅度越大」錯(變化大應幅度小)。故C。","options":{"A":"環境複雜應幅度小,非大。","B":"充分授權可幅度大,非小。","C":"正確(本題答案)。工作越重要管轄幅度越小。","D":"工作變化大應幅度小,非大。"},"sources":["新文京《護理行政》授權與時間管理","華杏《護理行政學》授權原則"]}},"111110-N2-68":{"quick":"護理長授權組長最適當=單位護理人員的排班。","detail":{"background":"授權應授「部屬能勝任、非核心決策」的事務。選項A「單位護理人員的排班(例行作業、組長可執行)」最適當授權給組長(A正確)。B「追回遺失麻醉藥物」(管制藥品須護理長親自處理)、C「擬定單位年度計畫」(核心規劃不宜授權)、D「提振低迷士氣」(領導職責)皆不宜授權組長。故A。","options":{"A":"正確(本題答案)。排班可授權組長。","B":"遺失麻醉藥須護理長親自處理。","C":"年度計畫是核心規劃不宜授權。","D":"提振士氣是領導職責。"},"sources":["新文京《護理行政》授權與時間管理","華杏《護理行政學》授權原則"]}},"112110-N2-75":{"quick":"有效授權=授權之前需先提供資深護理師教育訓練。","detail":{"background":"有效授權原則:C「授權之前需先提供(被授權者)教育訓練(確保有能力勝任)」正確。A「絕對信任不追蹤」錯(授權後仍須適度追蹤、負最終責任);B「私下拜託」錯(授權應公開正式);D「同時授權二人相同任務」錯(易混亂、責任不清,不可重複授權)。故C。","options":{"A":"授權後仍須適度追蹤。","B":"授權應公開正式,非私下拜託。","C":"正確(本題答案)。授權前先提供教育訓練。","D":"不可重複授權同一任務。"},"sources":["新文京《護理行政》授權與時間管理","華杏《護理行政學》授權原則"]}},"113100-N2-45":{"quick":"授權=主管對自己和對部屬的信賴關係。","detail":{"background":"授權(delegation):B「授權是主管對自己和對部屬的信賴關係(信任部屬能完成、也信任自己的判斷)」最適切。A「授權是最高管理者的特權」錯(各級主管皆可授權);C「授權給能力不足者是鼓勵」錯(應授權給有能力者);D「授權後就能減輕對工作的責任」錯(授權後主管仍負最終責任)。故B。","options":{"A":"各級主管皆可授權,非最高者特權。","B":"正確(本題答案)。授權是主管對自己與部屬的信賴關係。","C":"應授權給有能力者。","D":"授權後主管仍負最終責任。"},"sources":["新文京《護理行政》授權與時間管理","華杏《護理行政學》授權原則"]}},"114100-N2-36":{"quick":"時間管理優先序=重要且緊急→重要但不緊急→不重要但緊急→不重要且不緊急。","detail":{"background":"時間管理的經典作法是把事情依重要與緊急兩個向度分成四類並依序處理:重要且緊急的事必須立即完成;重要但不緊急的事,例如規劃、預防與人才培育,是產生長期效益的關鍵,應主動安排時間;不重要但緊急的事可考慮授權或簡化;不重要也不緊急的事則減量或捨棄。若把緊急性當成唯一標準,將整天疲於奔命而始終沒有時間做真正重要的事。實務上護理長可在每日開始前先列出待辦事項並分類,把重要但不緊急的規劃時間固定排入班表,才不會被瑣事吃掉。故選 A。","options":{"A":"正確(本題答案)。重要緊急→重要不緊急→不重要緊急→不重要不緊急。","B":"順序不當。","C":"順序顛倒。","D":"順序顛倒。"},"sources":["新文京《護理行政》授權與時間管理","華杏《護理行政學》授權原則"]}},"101030-N2-67":{"quick":"建築折舊不隨病患人數變動=固定成本。","detail":{"background":"成本依是否隨業務量變動,可分為固定成本與變動成本。固定成本在一定期間與產能範圍內總額不變,不因服務人次增減而改變,例如建築物與設備的折舊、房租與正職人員的基本薪資;變動成本則隨服務量同步增減,例如衛材與藥品。混合成本兼具兩者性質;可控制成本指該層級主管有權決定的支出,分類依據是控制權而非變動性。醫院成本中人事費屬於相對固定的大宗,因此病人數下降時每位病人分攤的單位成本會被推高,這也是經營分析常談到的規模效應。故選 B。","options":{"A":"可控制成本是可調整的。","B":"正確(本題答案)。建築折舊不隨人數=固定成本。","C":"混合成本含固定+變動。","D":"材料成本是變動成本。"},"sources":["新文京《護理行政》成本與預算","華杏《護理行政學》財務管理"]}},"102030-N2-63":{"quick":"復健機投資回收年數計算=3年。本題答案B。","detail":{"background":"回收年限的算法是把投資金額除以每年的淨貢獻。每一人次的淨收益等於健保支付減去該次的成本支出,再乘以每月使用人次得到每月淨收益,乘以十二即為每年淨收益,最後以設備成本相除。本題每次淨收益為五十元減二十元共三十元,每月五百人次得一萬五千元,一年十八萬元,五十四萬元除以十八萬元即為三年。這類題目要留意分子是淨收益而非收入,若誤以健保支付的五十元直接計算,回收年限會被低估;若忘記把月數換算成年,結果也會差十二倍。故選 B。","options":{"A":"2年回收金額不足。","B":"正確(本題答案)。54萬÷18萬/年=3年。","C":"4年超過回收期。","D":"5年超過回收期。"},"sources":["新文京《護理行政》成本與預算","華杏《護理行政學》財務管理"]}},"102030-N2-78":{"quick":"醫療機構占總成本比率最高=人事成本。","detail":{"background":"醫療是勞力密集的服務業,提供服務的主體是人,因此人事費用長期占醫院總成本的最大宗,一般約在五成上下,護理人力又是其中人數最多的一群。材料成本包含藥品與衛材,比重次之並隨業務量變動;設備成本以折舊方式分年攤提;管理成本則為行政與後勤支出。控制醫院成本時,人力配置與人事費的變動影響最為顯著。因此護理人力的配置與加班費控管,往往是單位成本改善計畫的首要著力點,遠比節省文具用品有效。故選 D。","options":{"A":"設備成本非最高。","B":"管理成本非最高。","C":"材料成本非最高。","D":"正確(本題答案)。人事成本占總成本比率最高。"},"sources":["新文京《護理行政》成本與預算","華杏《護理行政學》財務管理"]}},"102110-N2-58":{"quick":"資訊系統「不」用於護理行政=分析病患經濟狀況及家中人數。","detail":{"background":"護理行政資訊系統的用途集中在管理面:排定在職教育與訓練紀錄、分析護理人員的能力分級與人力配置、計算單位的護理成本與工作量、產出品質指標報表等,都是以護理人力與單位營運為對象。至於分析病人的經濟狀況與家庭人口數,屬社會工作或個案管理的評估範圍,不歸在護理行政系統的功能。作答這類題目可用一個簡單判準:資料的對象若是護理人員與單位營運,屬護理行政;若是病人本身的臨床或社會經濟資料,則屬臨床資訊系統。故選 D。","options":{"A":"安排在職教育是護理行政應用。","B":"人力分析是護理行政應用。","C":"護理成本分析是護理行政應用。","D":"正確(本題答案)。病患經濟家中人數非護理行政應用。"},"sources":["新文京《護理行政》成本與預算","華杏《護理行政學》財務管理"]}},"102110-N2-61":{"quick":"「不」屬固定成本=衛材成本(衛材是變動成本)。","detail":{"background":"固定成本在一定期間內總額不隨業務量變動,例如正職員工的基本薪資、建築物折舊與設備儀器的攤提,即使病人數減少仍照樣發生;變動成本則隨服務量同步增減,衛材、藥品與檢驗試劑用一份算一份,病人愈多耗用愈多。因此四個選項中只有衛材屬變動成本;掌握這個分類,才能理解為何占床率下降時單位成本反而上升。實務上把成本分為固定與變動,是為了計算損益兩平點,也就是業務量要達到多少才能打平固定成本的支出。故選 B。","options":{"A":"員工薪資是固定成本。","B":"正確(本題答案)。衛材成本是變動成本,非固定。","C":"建築折舊是固定成本。","D":"設備儀器是固定成本。"},"sources":["新文京《護理行政》成本與預算","華杏《護理行政學》財務管理"]}},"102110-N2-71":{"quick":"醫療成本控制「較不正確」=做預算需超估以備不時之需。","detail":{"background":"單位醫療成本控制:A知道每月人事福利費用(對)、B知道每月醫材設備支出(對)、C知道每月收入成本損益(對)。選項D「做預算時需超估,以備不時之需」較不正確(本題答案)——預算應「合理精確估算」,刻意超估會浮編浪費、失去成本控制意義。故D。","options":{"A":"應知道人事福利費用。","B":"應知道醫材設備支出。","C":"應知道收入成本損益。","D":"較不正確(本題答案)。預算應合理精確,非超估。"},"sources":["新文京《護理行政》成本與預算","華杏《護理行政學》財務管理"]}},"102110-N2-80":{"quick":"事先訂預算最高金額再申請=固定限額預算。","detail":{"background":"預算種類:固定限額預算(fixed ceiling,上級先訂預算最高金額/上限,下級在限額內申請)、彈性預算(隨活動量調整)、開放式預算(無上限申請)、零基預算(從零重新編列)。「主管事先訂預算最高金額,再交護理部擬訂提出申請」=固定限額預算(A正確)。故固定限額預算(A)。","options":{"A":"正確(本題答案)。先訂上限再申請=固定限額預算。","B":"彈性預算隨活動量調整。","C":"開放式預算無上限。","D":"零基預算從零編列。"},"sources":["新文京《護理行政》成本與預算","華杏《護理行政學》財務管理"]}},"103030-N2-80":{"quick":"病人分類系統「不」是功能=提供醫師診療收費標準。","detail":{"background":"病人分類系統(依護理需求分級)功能:B長期監測病人類別及所需護理活動、C測量護理工作成果及績效、D做長程人力規劃及預算。選項A「提供醫師診療收費標準」不是病人分類系統的功能(本題答案)——病人分類是為「護理人力配置」,非醫師收費標準。故A。","options":{"A":"正確(本題答案)。醫師收費標準非病人分類功能。","B":"監測病人類別是其功能。","C":"測量護理績效是其功能。","D":"人力規劃預算是其功能。"},"sources":["新文京《護理行政》成本與預算","華杏《護理行政學》財務管理"]}},"103100-N2-80":{"quick":"了解特定期間經營成果=損益表。","detail":{"background":"財務報表:損益表(income statement,反映特定期間的收入、成本、損益/經營成果);資產負債表(特定時點的財產);現金流量表。「了解醫院某特定期間之經營成果」=損益表(B正確)。財產管理表、薪資表、資產融通表皆非「期間經營成果」。故損益表(B)。","options":{"A":"財產管理表非經營成果。","B":"正確(本題答案)。特定期間經營成果=損益表。","C":"薪資表非經營成果。","D":"資產融通表非經營成果。"},"sources":["新文京《護理行政》成本與預算","華杏《護理行政學》財務管理"]}},"104100-N2-69":{"quick":"直接成本=執行護理衛材(1)+護理人員薪資(2)→「12」。","detail":{"background":"成本分類(依與服務的直接關聯):直接成本(直接用於病人照護,如執行護理的衛材、第一線護理人員薪資);間接成本(支援性,如行政電腦設備、教育訓練、水電)。選項1執行護理衛材+2護理人員薪資=直接成本「12」(B正確)。3行政電腦、4教育訓練是間接。故12。","options":{"A":"14含教育訓練(間接)不符。","B":"正確(本題答案,12)。衛材、護理人員薪資=直接成本。","C":"23含行政電腦(間接)不符。","D":"34皆間接成本。"},"sources":["新文京《護理行政》成本與預算","華杏《護理行政學》財務管理"]}},"105030-N2-59":{"quick":"編列電子車維修費用=固定預算?本題答案D。","detail":{"background":"本題官方答案D(固定預算)。預算種類:護理長「在年度預算中編列電子行動車維修費用」=固定預算(fixed budget,依固定項目編列、不隨業務量變動的例行性費用)。零基預算(從零)、績效預算、日落預算皆非「例行維修費編列」。故固定預算(D)。","options":{"A":"零基預算從零編列。","B":"績效預算依績效。","C":"日落預算有落日條款。","D":"正確(本題答案)。例行維修費編列=固定預算。"},"sources":["新文京《護理行政》成本與預算","華杏《護理行政學》財務管理"]}},"107110-N2-57":{"quick":"損益平衡點服務件數=500件。本題答案D。","detail":{"background":"損益平衡點是總收入等於總成本的服務量,計算方式為固定成本除以每單位的邊際貢獻,而邊際貢獻等於售價減去單位變動成本。本題售價二百五十元減變動成本一百五十元,每件貢獻一百元,五萬元固定成本除以一百元即得五百件。低於此量會虧損,高於此量才開始獲利,因此它是評估新服務是否值得投入的基本門檻。實務上降低損益平衡點的途徑有三:壓低固定成本、降低單位變動成本,或提高售價以擴大邊際貢獻。故選 D。","options":{"A":"150件不符。","B":"250件不符。","C":"400件不符。","D":"正確(本題答案)。50000÷(250-150)=500件。"},"sources":["新文京《護理行政》成本與預算","華杏《護理行政學》財務管理"]}},"107110-N2-58":{"quick":"預期收益10萬時服務件數=1500件。本題答案A。","detail":{"background":"要達到目標利潤時,公式改為固定成本加上目標利潤,再除以每單位的邊際貢獻。本題固定成本五萬元加預期收益十萬元共十五萬元,除以每件一百元的邊際貢獻,得一千五百件。可與前一題對照理解:損益平衡點只需回收固定成本,追求利潤時等於把目標利潤視為必須額外賺回的固定金額,兩者用的是同一條公式。這類題目常連續出題,先問損益平衡點再問目標利潤,只要記住分子要不要加上目標利潤即可分辨。故選 A。","options":{"A":"正確(本題答案)。(50000+100000)÷100=1500件。","B":"1000件不符。","C":"600件不符。","D":"375件不符。"},"sources":["新文京《護理行政》成本與預算","華杏《護理行政學》財務管理"]}},"107110-N2-63":{"quick":"固定成本=房屋租金(3)+設備折舊(4)+人員薪資(5)→「345」。","detail":{"background":"成本依是否隨業務量變動區分:固定成本在一定期間內總額不變,例如房屋租金、設備折舊與正職人員的基本薪資,即使病人減少仍照樣發生;變動成本隨服務量同步增減,醫療耗材用一份算一份,電費也隨開機時數與使用量浮動,兩者都屬變動或混合性質。把固定與變動分清楚,才能計算損益平衡點,也才能理解占床率下降時單位成本為何上升。實務上許多成本兼具兩種性質,稱為混合成本,分析時可用高低點法把它拆成固定與變動兩部分。故選 C。","options":{"A":"123含電費耗材(變動)不符。","B":"234含耗材不符。","C":"正確(本題答案,345)。房租、折舊、薪資=固定成本。","D":"145含電費不符。"},"sources":["新文京《護理行政》成本與預算","華杏《護理行政學》財務管理"]}},"108020-N2-62":{"quick":"重大採購硬體建設預算=資本預算。","detail":{"background":"醫院預算依用途分為兩大類:經常門或營運預算支應日常運作的重複性支出,例如薪資、衛材、水電與教育訓練;資本預算則用於購置或改良使用年限長、金額大的資產,例如新建大樓、整修病房與購買高階醫療儀器,需經較嚴謹的評估並分年攤提折舊。現金支出預算著眼於現金流的進出時程,屬財務調度工具。重大採購與硬體建設顯然屬於形成長期資產的支出。資本支出金額大且影響長遠,通常需先做投資效益分析,例如估算回收年限與使用率,再送院級會議審議。故選 B。","options":{"A":"營運預算是日常營運。","B":"正確(本題答案)。重大採購硬體=資本預算。","C":"現金支出預算是現金流。","D":"經常預算是經常性支出。"},"sources":["新文京《護理行政》成本與預算","華杏《護理行政學》財務管理"]}},"108020-N2-63":{"quick":"預算敘述正確=零基預算每項都需說明編列理由。本題答案C。","detail":{"background":"本題官方答案C。零基預算(zero-base budget):C「每項預算都需說明編列理由(不參考過去、從零審視每項支出的必要性)」正確。A「立即採購屬開放式預算」、B「先設最高金額再申請屬固定限額預算」敘述須對應;D固定限額敘述。故零基預算每項需說明理由(C)。","options":{"A":"立即採購敘述不完整。","B":"先設上限是固定限額預算(敘述須對應)。","C":"正確(本題答案)。零基預算每項需說明編列理由。","D":"固定限額敘述須對應。"},"sources":["新文京《護理行政》成本與預算","華杏《護理行政學》財務管理"]}},"108110-N2-63":{"quick":"損益平衡點=無盈餘也無損失的狀態。","detail":{"background":"損益平衡點(break-even point,BEP):C「無盈餘也無損失的狀態(總收入=總成本)」正確。A「收入大於BEP是利潤為負」錯(收入大於BEP有利潤);B「以固定成本為分子總成本為分母」錯(BEP件數=固定成本÷單位邊際貢獻);D「BEP為1萬指收入高於支出1萬」錯。故C。","options":{"A":"收入大於BEP有利潤,非負。","B":"BEP計算分母是單位邊際貢獻,非總成本。","C":"正確(本題答案)。BEP=無盈餘無損失。","D":"BEP是收支相等點。"},"sources":["新文京《護理行政》成本與預算","華杏《護理行政學》財務管理"]}},"108110-N2-65":{"quick":"零基預算=每項預算都需說明編列理由。","detail":{"background":"零基預算(zero-base budget):C「每項預算都需說明編列理由(以零為基礎、重新審視每項支出的必要性與優先順序)」正確。A「從零議價」、B「從零無上限」、D「根據目標從零編列」皆敘述不當。零基預算核心是「不參考過去、每項從零證明其必要」。故C。","options":{"A":"非從零議價。","B":"非無上限。","C":"正確(本題答案)。零基預算每項需說明編列理由。","D":"非僅根據目標。"},"sources":["新文京《護理行政》成本與預算","華杏《護理行政學》財務管理"]}},"108110-N2-75":{"quick":"直接成本=護理照護時的衛材使用。","detail":{"background":"成本依能否直接歸屬於特定服務或病人,分為直接成本與間接成本。直接成本可清楚追溯到照護對象,例如執行護理時耗用的衛材、直接照護人員的薪資與該病人使用的藥品;間接成本則由多個單位共同分攤,無法直接對應到某位病人,例如會計等行政管理費用、水電費與教育訓練費。判斷時只要問這筆支出能不能明確算到某位病人身上即可。直接與間接的區分是成本分析的基礎,唯有先把直接成本歸屬清楚,間接成本才能依合理基準分攤。故選 C。","options":{"A":"行政管理成本是間接成本。","B":"教育訓練是間接成本。","C":"正確(本題答案)。護理照護衛材=直接成本。","D":"水電費是間接成本。"},"sources":["新文京《護理行政》成本與預算","華杏《護理行政學》財務管理"]}},"109030-N2-79":{"quick":"直接成本=護理人員薪資(1)+執行護理衛材(3)→「13」。","detail":{"background":"直接成本能明確追溯到特定的照護對象或服務,例如提供直接照護的護理人員薪資,以及執行護理技術時耗用的衛材與藥品;間接成本則由多個單位或多位病人共同分攤,無法直接歸屬,例如行政作業使用的電腦設備、教育訓練費用、水電與管理費。作答時只要逐項問這筆錢能不能算到某位病人頭上,即可把兩類分開。這也說明為何降低衛材耗損與合理配置護理人力,對單位成本的影響最直接、也最容易被量化。故選 A。","options":{"A":"正確(本題答案,13)。護理人員薪資、執行護理衛材=直接成本。","B":"14含教育訓練(間接)不符。","C":"23含電腦設備(間接)不符。","D":"24皆間接。"},"sources":["新文京《護理行政》成本與預算","華杏《護理行政學》財務管理"]}},"109030-N2-80":{"quick":"醫療成本控制「錯誤」=護理長作預算時應超估以備不時之需。","detail":{"background":"成本控制的前提是各層級主管都掌握自己權責範圍內的成本結構:護理主任應了解護理部整體的人事費用,主管應清楚護病比與健保住院護理費給付的連動關係,護理長則應掌握單位的衛材與設備費用。至於編列預算時刻意高估以備不時之需,會造成資源虛占、排擠其他單位需求,也使預算失去規劃與管控的功能,正確作法是依實際需求覈實編列並保留合理的彈性額度。預算執行後應定期比對實際與預估的差異並分析原因,才能讓下一年度的編列愈來愈貼近實際。故選 D。","options":{"A":"應知人事費用成本。","B":"應知護理費收入連動。","C":"應知衛材設備費用。","D":"正確(本題答案)。預算應合理,非超估。"},"sources":["新文京《護理行政》成本與預算","華杏《護理行政學》財務管理"]}},"110030-N2-75":{"quick":"成本歸屬正確=直接成本含護理師薪水、衛材費用、醫師薪水。","detail":{"background":"成本歸屬:D「直接成本:護理師薪水、衛材費用、醫師薪水(直接用於病人照護的人力與材料)」正確。A固定成本含「門診量手術量」錯(那是變動);B變動成本含「護理師薪水手術床折舊主任薪水」錯(那些是固定);C間接成本含「醫師薪水」錯(醫師薪水是直接成本)。故D。","options":{"A":"門診量手術量是變動,非固定。","B":"薪水折舊是固定,非變動。","C":"醫師薪水是直接,非間接。","D":"正確(本題答案)。護理師/醫師薪水、衛材=直接成本。"},"sources":["新文京《護理行政》成本與預算","華杏《護理行政學》財務管理"]}},"110110-N2-57":{"quick":"「不」屬固定成本=醫療衛材費用(衛材是變動成本)。","detail":{"background":"固定成本在一定期間與產能範圍內總額不變,不隨服務量增減而改變,例如正職護理人員的基本薪資、建築物折舊與儀器設備的攤提,即使占床率下降仍照樣發生;變動成本則隨服務量同步增減,醫療衛材與藥品用一份算一份,病人愈多耗用愈多。把兩者分清楚,才能計算損益平衡點,也才能理解為何業務量下滑時每位病人分攤的固定成本會上升。實務上護理人力屬於相對固定的成本,這也是為何占床率下降時,單位成本控制的壓力會特別明顯。故選 B。","options":{"A":"護理人員薪資是固定成本。","B":"正確(本題答案)。醫療衛材是變動成本,非固定。","C":"建築折舊是固定成本。","D":"儀器設備是固定成本。"},"sources":["新文京《護理行政》成本與預算","華杏《護理行政學》財務管理"]}},"110110-N2-59":{"quick":"成本分析要項「不」含=基層員工的配合。","detail":{"background":"成本分析要能進行,前提是制度與資料到位:健全的會計制度提供一致的科目與歸屬原則,正確完整的統計資料提供服務量、人力與耗用的數據,健全的組織結構則界定成本中心與責任歸屬,使每一筆支出都有負責的單位。基層員工的配合固然影響成本控制措施能否落實,但那是分析結果出來之後的執行面問題,並非進行分析本身的要件。成本分析的成果通常以成本中心報表呈現,讓各單位看到自己的收支結構,才有改善的著力點。故選 A。","options":{"A":"正確(本題答案)。基層員工配合非成本分析要項。","B":"正確統計資料是要項。","C":"健全會計制度是要項。","D":"健全組織結構是要項。"},"sources":["新文京《護理行政》成本與預算","華杏《護理行政學》財務管理"]}},"110110-N2-62":{"quick":"不考量過去年度重新編列=零基預算。","detail":{"background":"預算編列方式依起點不同而異:漸進式預算以去年的數字為基礎加減調整,簡便但容易延續不合理的支出;零基預算則不參考過去,每一項活動都必須從零開始重新論證其必要性、效益與所需金額,再依優先順序分配資源,能有效檢視積習卻相當耗時。設計計畫預算以方案目標為單位編列;固定式預算則不隨業務量調整。題幹強調不考量過去年度而重新編列。零基預算適合用在資源緊縮或需要全面檢討的年度,平時則多採漸進式編列以兼顧行政成本。故選 B。","options":{"A":"設計計畫預算非此。","B":"正確(本題答案)。不參考過去從零編列=零基預算。","C":"固定式預算依固定項目。","D":"開放式預算無上限。"},"sources":["新文京《護理行政》成本與預算","華杏《護理行政學》財務管理"]}},"110110-N2-66":{"quick":"「不」是營運成本=利息支出(利息是財務成本非營運)。","detail":{"background":"營運成本指維持醫院日常業務運作所發生的支出,包括人事成本、藥品與衛材成本、水電與管理費用等,這些都直接對應到提供醫療服務的過程。利息支出則是因舉債融資而產生的財務費用,屬非營業性質的支出,反映的是資金結構而非營運活動,因此在損益表上列於營業外支出。判斷時可問這筆錢是不是為了提供服務而花的。營運成本與非營運支出分開,才能看出醫院的本業是否賺錢,以及虧損究竟來自營運效率還是財務結構。故選 B。","options":{"A":"人事成本是營運成本。","B":"正確(本題答案)。利息支出是財務成本,非營運。","C":"藥品成本是營運成本。","D":"管理費用是營運成本。"},"sources":["新文京《護理行政》成本與預算","華杏《護理行政學》財務管理"]}},"111110-N2-75":{"quick":"間接成本=空調水電費(1)+行政管理費(2)+教育訓練費(4)→「124」。","detail":{"background":"成本依能否直接歸屬於特定服務或病人分為直接與間接。直接成本可清楚追溯到照護對象,例如執行護理時耗用的衛材與直接照護人力的薪資;間接成本則由多個單位或多位病人共同分攤,無法直接對應,例如空調與水電費、行政管理費用,以及護理教育訓練費。判斷時只要逐項問這筆錢能不能算到某位病人頭上,即可把兩類分開。直接與間接的區分是成本分析的基礎,間接成本通常再依人數、面積或工時等基準分攤到各單位。故選 C。","options":{"A":"123含護理衛材(直接)不符。","B":"234含衛材不符。","C":"正確(本題答案,124)。空調水電、行政、教育=間接成本。","D":"134含衛材不符。"},"sources":["新文京《護理行政》成本與預算","華杏《護理行政學》財務管理"]}},"112030-N2-69":{"quick":"預算概念正確=損益平衡點是指無盈餘也無損失。","detail":{"background":"預算基本概念:B「損益平衡點是指無盈餘也無損失(總收入=總成本)」正確。A「建築折舊是變動成本」錯(是固定成本);C「人員薪資屬可控性成本」錯(薪資多為固定/不可控性);D「侵入性檢查治療是單位的成本」錯(那是收入/服務項目,非成本)。故B。","options":{"A":"建築折舊是固定成本,非變動。","B":"正確(本題答案)。損益平衡點=無盈餘無損失。","C":"人員薪資多屬不可控成本。","D":"侵入性檢查是服務項目,非成本。"},"sources":["新文京《護理行政》成本與預算","華杏《護理行政學》財務管理"]}},"112180-N2-37":{"quick":"零基預算「非」優點=主管可參考上期預算(零基不參考過去)。","detail":{"background":"零基預算不以往年數字為基礎,每一項活動都必須從零重新論證其必要性與效益,因此每筆預算都有編列理由、每年支出都會被重新審視,並在全盤檢討的過程中提供各單位溝通與參與的機會,有效檢視積習與無效支出。至於可以參考上期預算加減調整,那正是漸進式預算的特徵,與零基預算的精神相反,也不是它的優點。零基預算適合用在資源緊縮或需要全面檢討的年度,平時則多採漸進式編列,以兼顧行政成本與效率。故選 D。","options":{"A":"零基優點:每項有編列理由。","B":"零基優點:每年重新審視。","C":"零基優點:提供溝通參與。","D":"正確(本題答案)。零基不參考上期預算。"},"sources":["新文京《護理行政》成本與預算","華杏《護理行政學》財務管理"]}},"113030-N2-37":{"quick":"長照機構達損益平衡每月最少收住民=37人。本題答案D。","detail":{"background":"損益平衡點是總收入等於總成本的服務量,計算方式為固定成本除以每單位的邊際貢獻。當題目給的是毛利率時,邊際貢獻等於單價乘以毛利率,亦即每位住民每月三萬二千元乘以六成,約為一萬九千二百元。以每月固定支出七十萬元相除,得約三十六點五人,人數必須無條件進位,因此至少要收滿三十七位住民才不致虧損。這類題目要留意毛利率與變動成本率互為補數,若題目改給變動成本率四成,算法與結果完全相同。故選 D。","options":{"A":"30人毛利不足。","B":"32人不足。","C":"35人不足。","D":"正確(本題答案)。70萬÷19200≈37人。"},"sources":["新文京《護理行政》成本與預算","華杏《護理行政學》財務管理"]}},"113180-N2-37":{"quick":"成本分類正確=加班費屬可控制成本。","detail":{"background":"成本分類:A「加班費屬可控制成本(controllable,管理者可透過排班調度控制)」正確。B「水電費屬可控制成本」錯(水電多為不可控/固定);C「人員薪資屬變動成本」錯(薪資是固定成本);D「醫療耗材屬固定成本」錯(耗材是變動成本)。故A。","options":{"A":"正確(本題答案)。加班費屬可控制成本。","B":"水電費多為不可控成本。","C":"人員薪資是固定成本,非變動。","D":"醫療耗材是變動成本,非固定。"},"sources":["新文京《護理行政》成本與預算","華杏《護理行政學》財務管理"]}},"113030-N2-50":{"quick":"護理成本控制「錯誤」=減少護理人員數(犧牲品質安全)。","detail":{"background":"護理成本控制的正途是提高效率與減少浪費:作業資訊化可縮短文書時間並降低錯誤;降低衛材庫存量能避免資金積壓與逾期報廢;正確計價與防止漏帳則直接改善收入面。單純刪減護理人力雖然帳面上人事費下降,卻會拉高護病比、增加不良事件與加班費,並推升離職率與訓練成本,長期反而使成本上升,也危及照護品質,因此不是合宜的成本控制方法。因此人力是成本結構中最不宜輕率刪減的一項,合理的作法是先檢視流程與非護理業務是否可簡化或轉由輔助人力承擔。故選 B。","options":{"A":"護理資訊化是正確成本控制。","B":"正確(本題答案)。減少護理人員犧牲品質安全。","C":"降低衛材庫存是正確控制。","D":"正確計價防漏帳是正確控制。"},"sources":["新文京《護理行政》成本與預算","華杏《護理行政學》財務管理"]}},"113180-N2-46":{"quick":"護理成本管控正確=護理作業導入資訊化如護理紀錄。","detail":{"background":"護理成本管控應從流程效率與資源使用著手:導入資訊化可減少重複謄寫與漏記,同時縮短文書時間並降低錯誤,是兼顧品質與成本的作法。相對地,成本管控是全院各層級的共同責任,不能只落在護理長身上;衛材多領存放會積壓資金並增加逾期報廢;刻意延長住院天數則牴觸健保支付制度與醫療倫理,可能導致核刪與品質爭議,並非提高效益的正當手段。資訊化的效益不只在省時,更在於資料可被統計分析,使成本與品質的改善有客觀依據。故選 C。","options":{"A":"成本管控需全員參與,非只護理長。","B":"多領衛材會積壓浪費。","C":"正確(本題答案)。護理作業資訊化。","D":"讓病人多住院是不當醫療。"},"sources":["新文京《護理行政》成本與預算","華杏《護理行政學》財務管理"]}},"114030-N2-39":{"quick":"損益平衡點=1000萬元。本題答案D。","detail":{"background":"本題官方答案D(1,000萬)。損益平衡點(以金額計)=固定成本÷(1-變動成本率)=固定成本÷邊際貢獻率。變動成本率=600/1000=0.6,邊際貢獻率=1-0.6=0.4;BEP=400萬÷0.4=1,000萬。故損益平衡點1,000萬(D)。","options":{"A":"200萬不符。","B":"400萬(固定成本)非BEP。","C":"600萬不符。","D":"正確(本題答案)。400萬÷0.4=1000萬。"},"sources":["新文京《護理行政》成本與預算","華杏《護理行政學》財務管理"]}},"114170-N2-49":{"quick":"直接成本=調整護理人員薪資。","detail":{"background":"成本依能否直接歸屬於特定服務或照護對象分為直接與間接。直接成本可清楚追溯到照護的提供,例如直接照護人員的薪資與執行護理時耗用的衛材藥品;間接成本則由多個單位或多位病人共同分攤,例如護理站電腦設備的汰換、水電空調費用與教育訓練費。因此調整護理人員薪資屬直接成本,其餘三項都是共同分攤的支出。直接與間接的區分是成本分析的基礎,間接成本通常再依人數、面積或工時等基準分攤到各單位。故選 C。","options":{"A":"電腦設備是間接成本。","B":"電費是間接成本。","C":"正確(本題答案)。護理人員薪資=直接成本。","D":"教育訓練是間接成本。"},"sources":["新文京《護理行政》成本與預算","華杏《護理行政學》財務管理"]}},"114170-N2-50":{"quick":"護理成本控制「最不適當」=使用報廢的醫療儀器(危及安全)。","detail":{"background":"護理成本控制的正途包括:簡化並縮短作業流程以減少無效工時、節約水電空調等共同資源、推動資材管理趨近零存貨以避免資金積壓與逾期報廢,以及正確計價防止漏帳。至於使用已報廢的醫療儀器,雖然表面上省下採購費用,卻可能因功能不良或校正失準而危害病人安全,並違反醫療器材管理規定,一旦發生事故所付出的代價遠高於節省的金額。成本控制的底線是不得犧牲病人安全與照護品質,任何節流措施都應先通過這道檢驗。故選 D。","options":{"A":"簡化流程是正確控制。","B":"水電節流是正確控制。","C":"零存貨是正確控制。","D":"最不適當(本題答案)。使用報廢儀器危及安全。"},"sources":["新文京《護理行政》成本與預算","華杏《護理行政學》財務管理"]}},"101030-N2-68":{"quick":"工作摘要說明職務關係任務責任=工作說明書。","detail":{"background":"人力資源文件依用途分工:工作分析是蒐集並拆解職務內容的過程;工作說明書是分析的產物,以文字說明該職務的工作摘要、工作關係、主要任務與責任,以及任職者應具備的條件,新任主管據此了解自己的職責範圍;工作評值是比較各職務的相對價值以作為敘薪依據;工作分類則是把性質相近的職務歸類。題幹描述的是說明職務內容的文件。臨床上新任主管到職時,護理部提供的職務說明即以此文件為藍本,並作為日後考核與職務交接的依據。故選 A。","options":{"A":"正確(本題答案)。說明職務關係任務責任=工作說明書。","B":"工作評值書是評定價值。","C":"工作分析書是分析內容。","D":"工作分類書是分類。"},"sources":["新文京《護理行政》管理者角色與變革","華杏《護理行政學》人力資源與品質"]}},"101030-N2-75":{"quick":"Donabedian品質模式構面=結構品質、過程品質、結果品質。","detail":{"background":"Donabedian 提出的品質評估架構把照護品質拆成三個構面:結構品質指投入的資源,例如人力配置、設備與制度;過程品質指照護實際執行的方式,例如是否依常規完成評估與處置;結果品質指病人最終的健康狀態與滿意度。其餘選項分別是品質管理的活動分類、Juran 的品質三部曲,以及 Kano 的品質分類,都不是 Donabedian 的架構。作答時可用一個簡單的判準:凡是三個一組、分別對應資源、執行與成效的,即為這個架構。故選 D。","options":{"A":"品質保證管理控制非Donabedian構面。","B":"品質規劃管制改善是Juran三部曲。","C":"認定必要魅力品質是Kano模式。","D":"正確(本題答案)。結構、過程、結果=Donabedian。"},"sources":["新文京《護理行政》管理者角色與變革","華杏《護理行政學》人力資源與品質"]}},"102030-N2-57":{"quick":"評核時全給高分彰顯領導=向日葵效應。","detail":{"background":"考核偏誤:向日葵效應(sunflower effect,主管給所有部屬高分以彰顯自己領導好);月暈效應(halo,以單一印象概括全部);集中趨勢(都給中間分);近因效應(以近期表現評斷)。「給所有人高分以彰顯自己領導效能」=向日葵效應(D正確)。故向日葵效應(D)。","options":{"A":"光圈效應非此。","B":"霍桑效應是受關注而改變行為。","C":"觸角效應非此。","D":"正確(本題答案)。全給高分彰顯領導=向日葵效應。"},"sources":["新文京《護理行政》管理者角色與變革","華杏《護理行政學》人力資源與品質"]}},"102030-N2-58":{"quick":"經營者角度的績效=醫療資源應用的有效性。","detail":{"background":"以醫療機構經營管理者角度,績效(performance)的意義=「醫療資源應用的有效性(efficiency/effectiveness,以最少資源達最大產出)」(D正確)。就醫可近性、服務一貫性、公平性皆是醫療品質/可近性面向,非「經營績效」核心。故醫療資源應用的有效性(D)。","options":{"A":"就醫可近性是可近性面向。","B":"服務一貫性是品質面向。","C":"就醫公平性是公平面向。","D":"正確(本題答案)。資源應用有效性=經營績效。"},"sources":["新文京《護理行政》管理者角色與變革","華杏《護理行政學》人力資源與品質"]}},"102110-N2-75":{"quick":"組織變革順序=解凍期→改變期→再凍期。","detail":{"background":"Lewin 的改變理論把變革過程分為三期:解凍期先讓成員意識到現況有問題、鬆動既有習慣並降低抗拒;改變期導入新作法並提供訓練與支持,讓新行為逐步取代舊行為;再凍期則透過制度、常規與獎勵把新作法固定下來,避免退回原點。護理專案若缺少再凍的步驟,常在專案結束後不久就故態復萌。作答時只要記住三期的順序是先鬆動、再改變、最後固定,即可排除把啟動期插入其中或把再凍期提前的選項。故選 C。","options":{"A":"順序顛倒。","B":"順序不當(改變期應在啟動前)。","C":"正確(本題答案)。解凍→改變→再凍。","D":"順序不當。"},"sources":["新文京《護理行政》管理者角色與變革","華杏《護理行政學》人力資源與品質"]}},"103100-N2-63":{"quick":"未來護理行政趨勢=人員專業化(1)+管理企業化(3)+研究多元化(5)。本題答案D「135」。","detail":{"background":"護理行政的發展方向可歸納為:人員朝專業化與進階分級發展、管理引進企業化的成本與績效觀念、研究方法與題材日趨多元並以實證支持決策。相對地,考評的走向是多元參與與客觀化,而非由主管專制決定;文書作業則朝資訊化與電子化前進,而不是回到人工處理。把這兩項排除後即可得到正確的組合。這類複選組合題可先找出明顯錯誤的敘述並刪去含有該項的選項,通常一到兩個判斷即可鎖定答案。故選 D。","options":{"A":"含2(專制化)、4(人工化)錯。","B":"含4錯。","C":"含2、4錯。","D":"正確(本題答案,135)。專業化、企業化、研究多元化。"},"sources":["新文京《護理行政》管理者角色與變革","華杏《護理行政學》人力資源與品質"]}},"103100-N2-76":{"quick":"Mintzberg決策角色「不」含=聯絡者(屬人際角色)。","detail":{"background":"Mintzberg 把管理者的角色分成三類十種:人際角色包括頭臉人物、領導者與聯絡者;資訊角色包括監控者、傳播者與發言人;決策角色包括創業家、騷亂平息者、資源分配者與協商調停者。聯絡者的工作是建立並維持組織內外的人脈網絡,屬人際角色而非決策角色,這正是本題要辨識的分類界線。作答時可用一個簡單判準:凡涉及做決定、分配資源或處理爭端的屬決策角色,涉及建立關係與代表組織的屬人際角色,涉及蒐集與傳遞訊息的屬資訊角色。故選 C。","options":{"A":"騷亂平息者是決策角色。","B":"資源調配者是決策角色。","C":"正確(本題答案)。聯絡者是人際角色,非決策。","D":"調停者(協商者)是決策角色。"},"sources":["新文京《護理行政》管理者角色與變革","華杏《護理行政學》人力資源與品質"]}},"104030-N2-65":{"quick":"審查麻醉藥點班=Mintzberg的監督者角色。","detail":{"background":"Mintzberg 的資訊角色中,監督者負責持續蒐集組織內外的資訊、掌握運作狀況並察覺異常。護理長審查麻醉藥品的點班紀錄,是在確認管制藥品的數量與交班是否確實,屬於資訊的蒐集與監控。代表者是對外代表單位出席活動,領袖是激勵與帶領部屬,聯絡者則是建立與維持人脈網絡。判斷的關鍵在於這個行為的目的是取得資訊,而不是對外代表或對內激勵。這類題目的解法是把行為還原成動詞:查核、稽核、閱讀報表屬監督者,對外致詞屬代表者,調度資源屬資源分配者。故選 B。","options":{"A":"代表者是對外代表。","B":"正確(本題答案)。審查點班監測=監督者角色。","C":"領袖是領導激勵。","D":"聯絡者是建立人脈。"},"sources":["新文京《護理行政》管理者角色與變革","華杏《護理行政學》人力資源與品質"]}},"104030-N2-80":{"quick":"實地訪查追蹤照護「錯誤」=關心醫院的營運盈虧。","detail":{"background":"導入追蹤評量法(tracer methodology,以病人實際就醫經歷追蹤照護過程):A方法為導入追蹤評量法(對)、B關心醫院行政系統完整性(對)、D關心專業人員如何與病人溝通(對)。選項C「關心醫院的營運盈虧」錯誤(本題答案)——追蹤評量關心的是「照護品質與系統」,非營運盈虧。故C。","options":{"A":"方法是導入追蹤評量法。","B":"關心行政系統完整性。","C":"正確(本題答案)。追蹤評量非關心營運盈虧。","D":"關心專業人員與病人溝通。"},"sources":["新文京《護理行政》管理者角色與變革","華杏《護理行政學》人力資源與品質"]}},"105090-N2-79":{"quick":"風險管理「不」是事前措施=建立異常事件通報系統(那是事後/偵測措施)。","detail":{"background":"風險管理依時間點分為事前的預防、事中的應變與事後的檢討學習。事前的作為包括:進行危害脆弱度分析以找出最可能發生且衝擊最大的災害類型、據以建置各類災難的個別應變指引與作業程序,以及每年定期辦理教育訓練與演練並評值成效。異常事件通報系統則是在事件發生後才啟動的通報與檢討機制,屬事後管理,雖有助累積資料供日後預防,仍不屬事前風險管理。事前、事中與事後三個階段環環相扣:通報系統累積的資料會回饋到下一輪的危害分析,使應變指引隨經驗更新。故選 A。","options":{"A":"正確(本題答案)。異常通報系統是事後機制,非事前。","B":"危害分析是事前措施。","C":"災難應變指引是事前措施。","D":"教育訓練評值是事前措施。"},"sources":["新文京《護理行政》管理者角色與變革","華杏《護理行政學》人力資源與品質"]}},"106030-N2-10":{"quick":"專業性人際關係結束期重點=加強病人持續服藥的意願。","detail":{"background":"Peplau專業性人際關係四期:初始期、確認期、開拓期、結束期。結束期(termination)重點是「鞏固成效、為獨立做準備」:A「加強病人持續服藥的意願(出院後自我照顧的維持)」(A正確)。B激勵面對動機、C建立信任、D鼓勵參與照護皆是前期(初始/確認/開拓期)重點。故A。","options":{"A":"正確(本題答案)。加強持續服藥意願=結束期重點。","B":"激勵動機是前期。","C":"建立信任是初始期。","D":"鼓勵參與是開拓期。"},"sources":["新文京《護理行政》管理者角色與變革","華杏《護理行政學》人力資源與品質"]}},"106030-N2-62":{"quick":"門診護理師參與改變過程屬=改變標的(Change Target)。","detail":{"background":"變革的參與者可分為幾種角色:改變推動者是發起並帶領變革的人或單位,例如此案中規劃門診護理師投入社區醫療服務的護理部;改變標的則是被要求改變行為、態度或工作內容的對象,亦即即將承接新業務的門診護理師。改變區域與改變速度並非角色分類,前者指變革涉及的範圍,後者指推行的快慢。判斷時只要問這句話中誰在推動、誰被要求改變即可。辨識改變標的的意義在於,變革能否成功往往取決於標的的接受度,因此推動前應先了解其疑慮並提供訓練與支持。故選 B。","options":{"A":"主導改變單位是推動者。","B":"正確(本題答案)。被改變對象=改變標的。","C":"改變區域非角色。","D":"改變速度非角色。"},"sources":["新文京《護理行政》管理者角色與變革","華杏《護理行政學》人力資源與品質"]}},"106030-N2-63":{"quick":"「不」屬專科護理師角色功能=開立醫療處方。","detail":{"background":"依護理人員法及其相關辦法,專科護理師在醫師監督下執行醫療輔助行為,角色與功能包括病人的照護與個案管理、健康評估與衛教諮詢、參與臨床教學與學術研究,以及協助制定護理標準與流程。但開立醫療處方屬醫師的診療權責,專科護理師只能依醫師的處置流程或治療計畫執行特定醫療輔助行為,不得自行開立處方,這是我國現行法規劃定的界線。這也是專科護理師與醫師分工的關鍵:前者擴大了護理的臨床判斷與處置範圍,但診斷與處方權仍屬醫師。故選 B。","options":{"A":"執行病人管理是NP功能。","B":"正確(本題答案)。開立醫療處方是醫師職權,非NP。","C":"參與學術研究是NP功能。","D":"制定護理標準是NP功能。"},"sources":["新文京《護理行政》管理者角色與變革","華杏《護理行政學》人力資源與品質"]}},"106030-N2-72":{"quick":"突然大量傷患湧入急診:馬上指派護理師任務。","detail":{"background":"大量傷患湧入的當下屬應變階段,首要工作是立即啟動既有的應變計畫並分派任務,讓檢傷、急救、後送與記錄各就各位,爭取的是黃金時間。設置應變小組、進行危害分析與指定對外發言人,都應在平時的整備階段就完成規劃並演練,事到臨頭才開始成立小組或分析危害,只會延誤處置。因此護理長此刻該做的是依既定分組馬上指派護理師任務。這也說明為何醫院評鑑重視平時的災害演練:應變品質取決於事前的整備,而非現場的臨機反應。故選 B。","options":{"A":"設應變小組非當下最急。","B":"正確(本題答案)。大量傷患馬上指派任務。","C":"危害分析非當下。","D":"指定發言人非當下急務。"},"sources":["新文京《護理行政》管理者角色與變革","華杏《護理行政學》人力資源與品質"]}},"106110-N2-61":{"quick":"主任-督導-護理長-護理師層級=工作分級法。","detail":{"background":"工作評價方法:工作分級法(job ranking,將職位由高至低排序分級)、工作分類法(歸入既定類別)、因子比較法、點數系統法。「將護理組織分為主任-副主任-督導-護理長-副護理長-護理師(由高至低排序分級)」=工作分級法(B正確)。故工作分級法(B)。","options":{"A":"因子比較法是逐因子比較。","B":"正確(本題答案)。由高至低排序=工作分級法。","C":"工作分類法是歸入類別。","D":"點數系統法是計點。"},"sources":["新文京《護理行政》管理者角色與變革","華杏《護理行政學》人力資源與品質"]}},"106110-N2-80":{"quick":"設定N3 N4人數增加並訓練輔導達標=目標管理法。","detail":{"background":"目標管理式的考核由主管與部屬共同設定明確、可衡量且有期限的目標,再據以規劃達成的行動並在期末依達成度評定績效,重點在於員工參與訂定自己的目標。護理長與同仁共同訂出明年 N3 與 N4 人數成長兩成,並配套教育訓練與輔導,正是這種模式。自我考核由員工自行評定;心理評估法著重人格特質與潛能;評核中心法則以情境模擬與多位評審評估管理潛能。目標管理式考核的優點是方向明確、員工參與度高,限制則在於難以量化的照護品質容易被忽略。故選 D。","options":{"A":"自我考核是自評。","B":"心理評估非此。","C":"評核中心法是情境模擬評估。","D":"正確(本題答案)。共同設定目標達標=目標管理法。"},"sources":["新文京《護理行政》管理者角色與變革","華杏《護理行政學》人力資源與品質"]}},"106111-N2-62":{"quick":"人員流動觀念「錯誤」=視零流動率為管理目標。","detail":{"background":"人員流動觀念:A管理者應致力改善可控制的流動(對)、C流動率超50%表示組織有問題(對)、D理想流動率5~10%(對)。選項B「視零流動率為管理目標」錯誤(本題答案)——「零流動率」並非理想(適度流動可帶來新血、避免老化),理想流動率約5~10%。故B。","options":{"A":"應改善可控制的流動。","B":"正確(本題答案)。零流動率非理想目標。","C":"流動率超50%表示有問題。","D":"理想流動率5~10%。"},"sources":["新文京《護理行政》管理者角色與變革","華杏《護理行政學》人力資源與品質"]}},"106111-N2-69":{"quick":"給所有被考核者高分彰顯領導=向日葵效果。","detail":{"background":"向日葵效應指考核者為了讓自己帶領的單位看起來績效優異、或證明自己領導有方,而給所有部屬一律高分,結果是全體同分、失去鑑別力,真正努力的人反而得不到區辨。月暈效應是以受評者某一項優點概括其整體表現;集中趨勢是為避免爭議而把分數都給在中間;盲點效應則是考核者對自己也有的缺點視而不見。題幹的關鍵在於動機出於美化主管自身。要降低這類偏誤,可採強迫分配、導入多元評核來源,並要求主管以具體事實佐證所給的等第。故選 A。","options":{"A":"正確(本題答案)。全給高分彰顯領導=向日葵效果。","B":"月暈效果是單一印象概括。","C":"集中趨勢是都給中間分。","D":"盲點效應非此。"},"sources":["新文京《護理行政》管理者角色與變革","華杏《護理行政學》人力資源與品質"]}},"107030-N2-65":{"quick":"工作意願低但能力強=激發(策略)。","detail":{"background":"依意願與能力兩個向度可把部屬分成四類,並對應不同的管理策略:意願高能力高者給予授權;意願高但能力不足者著重發展,安排訓練與帶教;意願低但能力強者需要激發,找出其動機受阻的原因,以新的挑戰、責任或肯定重新點燃投入;意願與能力皆低者則考慮移轉到更合適的職務。題幹描述能力極強而工作意願低落,問題不在技術而在動機。實務上要先釐清意願低落的原因,可能是升遷無望、負荷過重或人際問題,對症處理才談得上激發。故選 C。","options":{"A":"增強適用意願高能力高。","B":"發展適用意願高能力低。","C":"正確(本題答案)。意願低能力強=激發策略。","D":"移轉適用意願低能力低。"},"sources":["新文京《護理行政》管理者角色與變革","華杏《護理行政學》人力資源與品質"]}},"107030-N2-67":{"quick":"個案管理=可提供病患持續性與連貫性的醫療照護。","detail":{"background":"個案管理(case management):C「可提供病患持續性與連貫性的醫療照護(統整跨專業資源、協調照護)」正確。A「建立費時故不必檢討修正」錯(應持續檢討修正);B「專為醫師設計協助治療」錯(是跨專業、以病人為中心);D「專為護理師設計」錯(是跨專業團隊)。故C。","options":{"A":"個案管理應持續檢討修正。","B":"個案管理是跨專業以病人為中心,非為醫師。","C":"正確(本題答案)。個案管理提供持續連貫照護。","D":"個案管理是跨專業,非僅護理師。"},"sources":["新文京《護理行政》管理者角色與變革","華杏《護理行政學》人力資源與品質"]}},"107110-N2-75":{"quick":"聘學者擔任顧問協助研究=直線幕僚型(官僚組織)。","detail":{"background":"災害應變的第一要務是啟動既有機制,把資源與人力導向現場。接獲大量傷患通知時,主任應立即啟動大量傷病患應變機制,通知各科支援人員到急診集合並展開檢傷分級與空間調度,爭取的是黃金時間。召開記者會屬對外溝通,應在傷患安置後由指定發言人統一處理;風險管理小組的危害分析屬平時整備;至於停止現有照護工作並不可行,原有病人仍須安全地移置與照護,而非中斷。應變的順暢與否取決於平時的演練與明確的分組職掌,臨場才組織小組往往緩不濟急。故選 D。","options":{"A":"金字塔型是層級結構。","B":"高聳型是層級多。","C":"扁平型是層級少。","D":"正確(本題答案)。聘顧問協助=直線幕僚型。"},"sources":["新文京《護理行政》管理者角色與變革","華杏《護理行政學》人力資源與品質"]}},"108110-N2-68":{"quick":"解凍改變再凍變革理論=路因(Lewin)提出。","detail":{"background":"組織變革理論「解凍(unfreezing)、改變(change)、再凍(refreezing)」三階段由「路因(Lewin)」提出(C正確)。柏拉圖(Pareto,80-20)、帕金森(Parkinson)、羅傑斯(Rogers,創新擴散)皆非。故路因(C)。","options":{"A":"柏拉圖是80-20法則。","B":"帕金森定律非變革理論。","C":"正確(本題答案)。解凍改變再凍=路因(Lewin)。","D":"羅傑斯是創新擴散理論。"},"sources":["新文京《護理行政》管理者角色與變革","華杏《護理行政學》人力資源與品質"]}},"109030-N2-74":{"quick":"Donabedian「不」屬結構面=全院住院病人壓瘡發生率5%(屬結果面)。","detail":{"background":"Donabedian品質三構面:結構(人力、設備、制度,如護理人員年資、主管輪值、設施功能);過程(照護流程);結果(病人結果)。選項D「全院住院病人壓瘡發生率5%」屬「結果面」非結構面(本題答案)。A 2年以上護理人員占60%、B主管輪值、C設施功能皆屬結構面。故D。","options":{"A":"護理人員年資占比屬結構面。","B":"主管輪值屬結構面。","C":"設施功能屬結構面。","D":"正確(本題答案)。壓瘡發生率屬結果面,非結構面。"},"sources":["新文京《護理行政》管理者角色與變革","華杏《護理行政學》人力資源與品質"]}},"109110-N2-67":{"quick":"依護理活動計分換算點數分類嚴重度=因素型分類法。","detail":{"background":"病人分類法:原型(prototype,整體描述歸類)、因素型(factor,依個別護理活動項目計分加總、換算點數分類);診斷型、病例組合(DRG)。「以護理活動項目設計、換算護理點數、依點數高低分類嚴重度」=因素型分類法(B正確)。故因素型分類法(B)。","options":{"A":"原型分類法是整體描述。","B":"正確(本題答案)。依項目計分換點數=因素型分類法。","C":"診斷型分類法依診斷。","D":"病例組合分類法是DRG。"},"sources":["新文京《護理行政》管理者角色與變革","華杏《護理行政學》人力資源與品質"]}},"110030-N2-3":{"quick":"人生八個發展階段=艾瑞克森(Erikson)提出。","detail":{"background":"Erikson 的心理社會發展理論把人生分為八個階段,每個階段都有一組必須克服的發展危機與應完成的任務,例如嬰兒期的信任對不信任、青少年期的自我認同對角色混淆、成年後期的統整對絕望,順利完成者可獲得該階段的美德。Freud 的心性發展分為五期且止於青春期;Peplau 提出護病關係的四個時期;Maslow 提出的是需求層次而非發展階段。這個架構在臨床上常用來理解病人面對疾病時的反應,例如青少年住院時對外觀與同儕關係的高度在意。故選 B。","options":{"A":"佛洛依德是性心理發展五期。","B":"正確(本題答案)。人生八階段=艾瑞克森。","C":"佩普洛是人際關係理論。","D":"馬斯洛是需求層級。"},"sources":["新文京《護理行政》管理者角色與變革","華杏《護理行政學》人力資源與品質"]}},"110030-N2-65":{"quick":"行為規範設計「較不適當」=個別彈性(應普遍適用一致)。","detail":{"background":"員工行為規範的用意是讓全體成員有一致可循的行為準則,因此設計時應把握幾項原則:內容須合理且不牴觸法令、對所有適用對象一體適用以維持公平、文字具體簡潔便於理解與遵循,並定期檢討修訂。若強調個別彈性、因人而異地放寬或加嚴,規範就失去共同標準的意義,也容易引發不公平的爭議;真正需要彈性處理的是個案的例外情形,並應有明確的申請與核准程序。規範訂定後還須透過教育訓練與新人引導讓成員理解其理由,單靠公告張貼很難真正改變行為。故選 D。","options":{"A":"規範應合理合法。","B":"規範應普遍適用。","C":"規範應具體簡潔。","D":"較不適當(本題答案)。規範應一致,非個別彈性。"},"sources":["新文京《護理行政》管理者角色與變革","華杏《護理行政學》人力資源與品質"]}},"110030-N2-69":{"quick":"工作分享制屬「數量彈性」。","detail":{"background":"護理人力彈性運用:數量彈性(numerical,調整人力數量/工時,如工作分享制job sharing、兼職、部分工時);功能彈性(functional,一人多能多工)。「工作分享制」=數量彈性(A正確)。工作多樣化、專業性分工、領導彈性皆非「數量彈性」。故工作分享制(A)。","options":{"A":"正確(本題答案)。工作分享制=數量彈性。","B":"工作多樣化是功能彈性。","C":"專業性分工非數量彈性。","D":"領導彈性非數量彈性。"},"sources":["新文京《護理行政》管理者角色與變革","華杏《護理行政學》人力資源與品質"]}},"110110-N2-78":{"quick":"給所有員工高分展現領導=向日葵效應。","detail":{"background":"向日葵效應指主管為了顯示自己帶領的單位人才濟濟、領導有方,而給所有部屬一律高分,結果全體同分、失去鑑別力,表現優異者反而得不到區辨。近因效應是只採計最近期的表現;霍桑效應是受評者因知道被觀察而改變行為,問題出在被評者身上;月暈效應則是以受評者某一項優點概括其整體表現。本題的關鍵在於動機出於美化主管自身與單位。要降低這類偏誤,可採強迫分配、導入同儕與部屬回饋,並要求主管以具體事實佐證所給的等第。故選 D。","options":{"A":"近因效應是以近期表現評斷。","B":"霍桑效應是受關注改變行為。","C":"月暈效應是單一印象概括。","D":"正確(本題答案)。全給高分展現領導=向日葵效應。"},"sources":["新文京《護理行政》管理者角色與變革","華杏《護理行政學》人力資源與品質"]}},"111030-N2-60":{"quick":"Mintzberg角色=護理長調配人力物力時間經費屬資源分配者。","detail":{"background":"Mintzberg管理者角色:A「護理長調配單位人力、物力、時間及經費,屬資源分配者(resource allocator)」正確。B參與院務會議報告應是發言人/代言人(非精神領袖);C傳達甄選短片應是傳播者(非代言人);D觀察人員身心健康工作表現應是監督者(非聯絡者)。故A。","options":{"A":"正確(本題答案)。調配人力物力經費=資源分配者。","B":"參與會議報告是發言人,非精神領袖。","C":"傳達訊息是傳播者,非代言人。","D":"觀察人員是監督者,非聯絡者。"},"sources":["新文京《護理行政》管理者角色與變革","華杏《護理行政學》人力資源與品質"]}},"111110-N2-66":{"quick":"人力資源管理=強調員工參與組織經營。","detail":{"background":"人事管理vs人力資源管理:C「人力資源管理(HRM)強調員工參與組織經營(視員工為資產、重視發展與參與)」正確。A「HRM認為員工屬成本負擔」錯(那是傳統人事管理觀);B「人事管理強調勞資平等和諧」敘述須對應;D「人事管理強調人力確保開發維持」錯(那是HRM的重點)。故C。","options":{"A":"視員工為成本是傳統人事觀,非HRM。","B":"敘述須對應。","C":"正確(本題答案)。HRM強調員工參與組織經營。","D":"人力確保開發維持是HRM重點,非人事管理。"},"sources":["新文京《護理行政》管理者角色與變革","華杏《護理行政學》人力資源與品質"]}},"111110-N2-77":{"quick":"風險危害分析=需要定期評估組織規劃及各項資源準備度。","detail":{"background":"醫院風險危害分析(HVA):C「需要定期評估組織規劃及各項資源準備度」正確。A「依SOP執行就不會發生風險」錯(無法完全避免);B「考量財產損失即可」錯(須考量人員、營運、聲譽等);D「危害風險由小到大排序、高迫切性優先」——應「由大到小、依風險高低優先處理高風險」(D敘述順序不當)。故C。","options":{"A":"依SOP無法完全避免風險。","B":"須考量人員營運聲譽,非僅財產。","C":"正確(本題答案)。定期評估規劃及資源準備度。","D":"應依風險高低優先,排序敘述不當。"},"sources":["新文京《護理行政》管理者角色與變革","華杏《護理行政學》人力資源與品質"]}},"113100-N2-37":{"quick":"生涯發展:能力優良有潛力者給予前程管理。","detail":{"background":"依員工工作表現與發展需求擬定生涯發展:A「能力優良、有發展潛力者,給予前程管理(career management,培養晉升)」正確。B「能力普通安排再教育」、C「表現欠佳無改善空間給予輔導」(無改善空間者不是給輔導)、D「能力較差有改進空間者勸退資遣」(有改進空間應輔導非資遣)皆敘述不當。故A。","options":{"A":"正確(本題答案)。優良有潛力者給予前程管理。","B":"能力普通安排再教育敘述須對應。","C":"無改善空間者非給輔導。","D":"有改進空間應輔導,非勸退資遣。"},"sources":["新文京《護理行政》管理者角色與變革","華杏《護理行政學》人力資源與品質"]}},"113180-N2-42":{"quick":"護理人力招募=掌握人力需求狀況並進行供需分析。","detail":{"background":"護理人力招募:A「掌握護理部人力需求狀況,並進行供需分析」正確(招募前先評估需求)。B「人資室決定招募方向管道」錯(護理部應主導護理人力招募方向);C「招募完成半年後評估效益」錯(應適時/儘早評估);D「為符合成本效益由人資管理師負責」錯(護理人力招募應由護理部主導)。故A。","options":{"A":"正確(本題答案)。掌握人力需求並供需分析。","B":"護理部應主導招募方向。","C":"應適時評估,非半年後。","D":"護理人力招募應由護理部主導。"},"sources":["新文京《護理行政》管理者角色與變革","華杏《護理行政學》人力資源與品質"]}},"114030-N2-8":{"quick":"電子病歷優點「錯誤」=醫療流程管制與修改方便且不會留有紀錄。","detail":{"background":"完全電子病歷優點:A資料可供同體系共享、維持一致性(對)、C資料完善結構化、促進醫學研究(對)、D不必紙本、減少成本(對)。選項B「醫療流程管制與修改方便,且不會留有紀錄」錯誤(本題答案)——電子病歷的修改「會留下軌跡紀錄(audit trail)」以確保資料完整可追溯,非不留紀錄。故B。","options":{"A":"電子病歷可同體系共享。","B":"正確(本題答案)。電子病歷修改會留軌跡,非不留紀錄。","C":"電子病歷結構化促研究。","D":"電子病歷減少紙本成本。"},"sources":["新文京《護理行政》管理者角色與變革","華杏《護理行政學》人力資源與品質"]}},"114030-N2-46":{"quick":"工作意願低能力也低=移轉策略。","detail":{"background":"依意願與能力兩個向度可把部屬分成四類並對應不同策略:兩者皆高者授權;意願高但能力不足者著重發展,安排訓練與帶教;能力強但意願低者需要激發,找出動機受阻的原因並以新的挑戰或肯定重新點燃;兩者皆低者則採移轉策略,先了解原因後考慮調整到更合適的職務,必要時依制度處理。對這類員工只加強訓練或喊話,通常成效有限。處理前仍應先了解意願低落與能力不足的原因,例如是否為職務不合適、健康因素或訓練不足,再決定輔導或調整。故選 A。","options":{"A":"正確(本題答案)。意願低能力低=移轉策略。","B":"激發適用意願低能力高。","C":"增強適用意願高能力高。","D":"發展適用意願高能力低。"},"sources":["新文京《護理行政》管理者角色與變革","華杏《護理行政學》人力資源與品質"]}},"102110-N2-79":{"quick":"確認薪資層次最重要工作表現因子=責任。","detail":{"background":"工作評價以「工作表現因子(compensable factors)」決定薪資層次:技術需求、努力、責任、工作情況。確認護理長(管理職)薪資層次「最重要」的因子是「責任(responsibility,所負管理與決策責任)」(C正確)——管理職薪資主要反映其責任大小。故責任(C)。","options":{"A":"技術需求非管理職薪資最重因子。","B":"工作情況非最重。","C":"正確(本題答案)。管理職薪資最重因子=責任。","D":"身體需求非管理職最重。"},"sources":["新文京《護理行政》","華杏《護理行政學》"]}},"104100-N2-68":{"quick":"僅依政策制度執行宣導目標=管理者角色。","detail":{"background":"管理者(manager)vs領導者(leader):管理者「依組織政策、制度、紀律執行任務、維持運作、宣導組織目標宗旨(把事情做對)」。護理督導「僅依政策制度紀律執行、宣導目標宗旨」=管理者角色(A正確)。領導者重願景、創新、引導變革。故管理者(A)。","options":{"A":"正確(本題答案)。依政策制度執行宣導=管理者角色。","B":"策劃者偏規劃。","C":"諮詢者偏建議。","D":"領導者重願景創新。"},"sources":["新文京《護理行政》","華杏《護理行政學》"]}},"105030-N2-62":{"quick":"工作流程持續改善「不包括」=由管理者主導向下推動。","detail":{"background":"工作流程持續改善(品管圈/QCC精神):A由工作性質相近的人員組成(對)、B是持續問題改善的過程(對)、D是前瞻性預防性改善(對)。選項C「由管理者主導向下推動」不包括(本題答案)——持續改善應「由基層員工自發、由下而上參與」,非管理者由上向下強推。故C。","options":{"A":"由性質相近人員組成(對)。","B":"是持續改善過程(對)。","C":"正確(本題答案)。應由下而上,非管理者向下推動。","D":"是前瞻預防性改善(對)。"},"sources":["新文京《護理行政》","華杏《護理行政學》"]}},"107110-N2-60":{"quick":"中階管理者(督導長)規劃=部門性質之規劃。","detail":{"background":"規劃依管理層級可分三類:高階管理者負責策略性規劃,時間幅度長、範圍涵蓋整體組織的方向與定位;中階管理者如護理督導長負責部門性或戰術性規劃,把上層策略轉譯為所屬部門的年度計畫與資源配置;基層主管則負責執行性或作業性規劃,處理日常班表、流程與短期目標。因此督導長層級所做的是承上啟下的部門規劃。三個層級的規劃必須上下銜接,若部門計畫與院級策略脫節,基層再努力也難以累積為組織的成果。故選 C。","options":{"A":"策略性規劃是高階。","B":"整體性規劃是高階。","C":"正確(本題答案)。中階督導長=部門性質規劃。","D":"執行性規劃是基層。"},"sources":["新文京《護理行政》","華杏《護理行政學》"]}},"107110-N2-61":{"quick":"決策的策略階段=決策者個人或組織未來欲達到的目標或期望。","detail":{"background":"決策制定過程可分為策略、方案與抉擇幾個階段。策略階段界定的是決策者個人或組織未來想達到的目標與期望,亦即先確定要往哪裡去;方案階段才為查明原因並發展各種備選方案;抉擇階段從中選出最佳可行方案並執行評值。至於確定專業分工,屬於組織功能而非決策階段。作答時只要抓住策略對應目標與方向,即可與後續步驟區分。目標訂得愈明確,後續蒐集資料與比較方案時才有一致的評選基準,否則容易在討論中失焦。故選 A。","options":{"A":"正確(本題答案)。策略階段=確立未來目標期望。","B":"發展備選方案是設計階段。","C":"選擇方案是選擇階段。","D":"專業分工是組織。"},"sources":["新文京《護理行政》","華杏《護理行政學》"]}},"107110-N2-62":{"quick":"目標管理成功要件=345(把權限責任下放、共同參與等)。","detail":{"background":"目標管理要能成功,關鍵不在形式而在幾項配套:主管先清楚列出組織目標作為方向,再把權限連同責任分授給各級主管,使其有裁量空間去達成;目標由主管與員工共同商訂而非片面下達,員工才會產生承諾;過程中定期回饋進展,及早發現偏差並修正。至於依個人能力分配不同目標,或把目標當成考核與懲罰的唯一依據,反而會造成不公平感與數字導向的偏差。這類複選組合題可先鎖定一個明顯不合理的項目並刪去含有該項的選項,通常一到兩個判斷即可定案。故選 C。","options":{"A":"含1(主管單方列目標)不符。","B":"含2不符。","C":"正確(本題答案,345)。權責下放、共同參與、檢討回饋。","D":"含1不符。"},"sources":["新文京《護理行政》","華杏《護理行政學》"]}},"107110-N2-64":{"quick":"策略性規劃步驟=確認使命目標→SWOT分析→制定策略→執行策略→評估結果。","detail":{"background":"策略性規劃(strategic planning)正確步驟:D「確認組織的使命與目標→SWOT分析(評估內外環境)→制定策略→執行策略→評估結果」正確——須先做SWOT環境分析,才能據以制定策略。其餘選項把SWOT放在制定策略之後,順序不當。故D。","options":{"A":"SWOT在制定策略後,順序不當。","B":"評估結果在執行前,不當。","C":"SWOT在執行後,不當。","D":"正確(本題答案)。使命目標→SWOT→制定→執行→評估。"},"sources":["新文京《護理行政》","華杏《護理行政學》"]}},"107110-N2-70":{"quick":"延聘學者顧問協助研究=直線幕僚型(官僚組織)。","detail":{"background":"官僚式組織依形狀與職權性質可再分為幾型:金字塔型與高聳型描述層級多寡與管轄幅度,扁平型則層級較少;直線幕僚型指的是在原有直線指揮系統之外,另設不具指揮權、只提供專業建議與技術支援的幕僚單位。護理部延聘外部學者擔任顧問指導研究,顧問並不介入護理人員的指揮體系,只提供專業意見,正是幕僚角色。幕僚單位的價值在於提供專業支援,但若與直線主管的權責界線不清,也可能形成事實上的雙重指揮。故選 D。","options":{"A":"金字塔型是層級結構。","B":"高聳型是層級多。","C":"扁平型是層級少。","D":"正確(本題答案)。聘顧問協助=直線幕僚型。"},"sources":["新文京《護理行政》","華杏《護理行政學》"]}},"111110-N2-80":{"quick":"編列電動床維修費=固定預算。","detail":{"background":"預算種類:固定預算(fixed budget,依固定項目編列、例行性費用)。護理長「年度預算中編列電動床維修費用(例行性維修費)」=固定預算(C正確)。績效預算(依績效)、日落預算(有落日條款)、零基預算(從零)皆非「例行維修費編列」。故固定預算(C)。","options":{"A":"績效預算依績效。","B":"日落預算有落日條款。","C":"正確(本題答案)。例行維修費=固定預算。","D":"零基預算從零編列。"},"sources":["新文京《護理行政》","華杏《護理行政學》"]}},"112030-N2-70":{"quick":"分權式組織特性=會使員工覺得自由度高且受尊重。","detail":{"background":"分權式(decentralization)組織特性:C「會使員工覺得自由度高且受尊重(決策權下放、自主權大、士氣高)」最適宜。A「士氣較低落」錯(分權士氣高);B「適合大型機構省人力」偏集權描述;D「增加決策時效性和品質」——分權決策較貼近現場但未必更快,本題以C為正解。故C。","options":{"A":"分權士氣高,非低落。","B":"省人力偏集權描述。","C":"正確(本題答案)。分權使員工自由度高且受尊重。","D":"本題以C為正解。"},"sources":["新文京《護理行政》","華杏《護理行政學》"]}},"113100-N2-41":{"quick":"雙因子激勵因素減少倦勤=提供明確升遷機會。","detail":{"background":"Herzberg雙因子理論:激勵因子(內在:成就、肯定、升遷、成長、責任)可提升滿意、減少倦勤異動;保健因子(外在:領導方式、上班天數、工作環境)只防止不滿。減少倦勤異動應強化「激勵因子」:C「提供明確升遷機會(成長/晉升,激勵因子)」正確。A檢討領導方式、B檢討上班天數、D友善工作環境皆是保健因子。故C。","options":{"A":"領導方式是保健因子。","B":"上班天數是保健因子。","C":"正確(本題答案)。明確升遷機會=激勵因子。","D":"工作環境是保健因子。"},"sources":["新文京《護理行政》","華杏《護理行政學》"]}},"113100-N2-47":{"quick":"SWOT:機會(opportunity)是外在環境中對組織有利的因素。","detail":{"background":"SWOT分析:優勢/劣勢=內部因素;機會/威脅=外部因素。C「機會(opportunity)是指外在環境中對組織有利的因素」正確。A「優勢是有利的外部因素」錯(優勢是內部);B「劣勢是與外界競爭的有害因素」錯(劣勢是內部不利);D「威脅包括機構財務效率員工素質」錯(那些是內部劣勢,非威脅)。故C。","options":{"A":"優勢是內部有利,非外部。","B":"劣勢是內部不利。","C":"正確(本題答案)。機會=外在環境對組織有利的因素。","D":"財務效率員工素質是內部劣勢,非威脅。"},"sources":["新文京《護理行政》","華杏《護理行政學》"]}},"114170-N2-40":{"quick":"目標管理成效「最不適當」=落實集權概念(MBO是分權參與)。","detail":{"background":"目標管理讓主管與部屬共同訂定目標,再由部屬自我控制進度,因而能促使部屬自我成長、提高工作士氣,並因目標明確、進度可比對而加強管制功能。它的精神是把決策與檢核的權責下放,屬於落實分權而非集權;若由上而下硬性下達指標,只是換個名目的交辦,反而失去目標管理的意義,也難以帶動承諾與自我管理。實施目標管理時應同時納入質性的行為描述與同儕回饋,避免目標被窄化為容易量化的數字。故選 A。","options":{"A":"最不適當(本題答案)。MBO是分權參與,非集權。","B":"MBO促使部屬自我成長。","C":"MBO加強管制功能。","D":"MBO提高工作士氣。"},"sources":["新文京《護理行政》","華杏《護理行政學》"]}},"115030-N2-49":{"quick":"問題解決原則=先確立影響利益最大的問題,再列出子問題。","detail":{"background":"問題解決處理原則:C「先確立影響組織利益最大的問題,再抽絲剝繭列出子問題(由大而小、聚焦重要)」正確。A「找完美方案、有時間壓力也不輕易決策」錯(應在合理時間內做滿意決策);B「不論大小都注重小細節」錯(應抓重點);D「將大小問題都分派部屬」錯(重大問題主管應親自處理)。故C。","options":{"A":"應在合理時間內做滿意決策。","B":"應抓重點,非鑽小細節。","C":"正確(本題答案)。先確立影響最大問題再列子問題。","D":"重大問題主管應親自處理。"},"sources":["新文京《護理行政》","華杏《護理行政學》"]}},"115100-N2-37":{"quick":"正解(C)。描述組織「未來五年要成為什麼」的藍圖，屬願景（vision）。","detail":{"background":"組織的四個核心宣言常被混淆，其層次與時間軸不同：①「理念（philosophy）」——組織的基本信念與價值信條，回答「我們相信什麼」，例如「以病人為中心、視護理為助人的專業」。②「使命（mission）」——組織「存在的目的與現在正在做的事」，回答「我們是誰、為誰服務、提供什麼」，具有現在式與描述性，例如「提供社區民眾優質、可近的急慢性醫療照護」。③「願景（vision）」——「未來想成為什麼樣子的藍圖」，具有「未來導向、時間期程與可激勵人心」的特質，回答「幾年後我們要達到什麼境界」；本題「未來五年要成為以社區為導向的優質區域醫院」明確描述未來的期望狀態與期程，正是願景。④「價值觀（value）」——組織共同遵循的行為準則，例如誠信、專業、團隊、創新。實務上四者由抽象到具體，再往下展開為「目標（goal）」與「具體可測量的目的（objective）」，最後化為政策、程序與規則。","options":{"A":"價值觀是共同遵循的行為準則。","B":"使命描述組織現在存在的目的與服務對象。","C":"正確。願景是未來要達成的藍圖。","D":"理念是組織的基本信念。"},"sources":["護理行政與管理（華杏）","Marquis & Huston《Leadership Roles and Management Functions in Nursing》","護理行政（新文京）"]}},"115100-N2-38":{"quick":"正解(C)。主管能取得組織內外部資源為部屬爭取福祉，屬「連結權（connection power）」。","detail":{"background":"French 與 Raven 的權力分類分「職位權（來自職務）」與「個人權（來自個人特質與人際）」：①「法職權（legitimate）」——來自正式職位的權威；②「獎賞權（reward）」——能給予獎勵；③「強制權（coercive）」——能施予懲罰（如懲處、調班），是負向權力；④「專家權（expert power）」——因「專業知識與技術精湛」而受尊重，「靜脈穿刺被封為廖一針正是專家權」，故選項 A 誤稱為參考權；⑤「參考權（referent power）」——因「個人魅力、人格特質受認同而被學習模仿」，選項 B 描述的正是參考權，卻誤稱為資訊權；⑥「資訊權（information power）」——「掌握他人所需的資訊」；⑦「連結權（connection power）」——「與組織內外有影響力的人建立良好關係，因而能為部屬爭取資源與福祉」，正是選項 C 所述。選項 D 描述的「提供所需資訊並做決策讓部屬追隨」屬資訊權與法職權，並非強制權。其中專家權與參考權屬「個人權」，最能促發部屬的內在承諾。","options":{"A":"技術精湛屬專家權，非參考權。","B":"認同個人魅力而學習屬參考權，非資訊權。","C":"正確。爭取內外部資源屬連結權。","D":"提供資訊與決策屬資訊權與法職權，非強制權。"},"sources":["護理行政與管理（華杏）","Marquis & Huston《Leadership Roles and Management Functions in Nursing》","護理行政（新文京）"]}},"115100-N2-39":{"quick":"正解(D)。把需高階能力的專案交給 N1 新進護理師，屬「不適當授權」。","detail":{"background":"「授權（delegation）」是把工作的執行權責交付給他人，但「最終責任仍在授權者」。有效授權的五要素（five rights）：適當的「工作」、適當的「情境」、適當的「人」、適當的「溝通與指示」、適當的「監督與評值」。常見的授權錯誤有：①「授權不足（under-delegation）」——主管事必躬親、不放手，造成自己過勞與部屬缺乏成長；②「過度授權（over-delegation）」——把自己該負的核心責任全部推給部屬；③「不適當授權（improper/inappropriate delegation）」——「授權給能力、資格或經驗不足的人」，或授權不該授權的事項（如專業判斷、評估與衛教等需護理專業判斷者不可授權給照顧服務員），或在不適當的時機授權。本題把「護理專案」交給僅具「N1（護理能力進階制度中的最基層，剛通過臨床能力訓練，主要能執行一般病人的基本護理）」的護理師，其能力與經驗顯然不足以承擔，屬「不適當授權」；專案規劃通常需 N3 以上具備教學與專案能力者擔任。","options":{"A":"授權不足是主管不放手、事必躬親。","B":"逐級授權是循組織層級逐層下授，非錯誤。","C":"集權是不授權的管理型態，非本題情境。","D":"正確。交付給能力不足者屬不適當授權。"},"sources":["護理行政與管理（華杏）","Marquis & Huston《Leadership Roles and Management Functions in Nursing》","護理行政（新文京）"]}},"115100-N2-40":{"quick":"正解(A)。古典組織理論的四大要件為管轄幅度、命令傳達管道、部門分工與組織結構。","detail":{"background":"「古典組織理論」以 Weber 的科層體制、Fayol 的管理程序與 Taylor 的科學管理為代表，強調正式結構、專業分工與層級節制。其所列的組織四大要件為：①「管轄幅度（span of control）」——一位主管直接督導的部屬人數；幅度愈窄則層級愈多、溝通鏈愈長但督導較細，幅度愈寬則組織扁平但督導較鬆，須依工作複雜度、部屬能力與地理分布調整。②「命令傳達管道（chain of command，指揮鏈）」——由上而下的權責路線，配合「指揮統一原則（unity of command，一個部屬只向一位主管負責）」以避免多頭馬車。③「部門分工（departmentalization／division of labor）」——依功能、產品、地區或病人類別把工作分組，以發揮專業化的效率。④「組織結構（organizational structure）」——正式的職權關係與組織圖，包括直線式、直線幕僚式、功能式與矩陣式。護理部門常見的照護模式（全責護理、功能性護理、成組護理、個案管理）即是分工與結構在臨床上的具體展現。","options":{"A":"正確。四大要件為管轄幅度、命令傳達管道、部門分工與組織結構。","B":"「部門成員、組織運用」非古典理論的要件。","C":"「部門成員、組織管理」非古典理論的要件。","D":"人力資源與組織任務不屬四大要件。"},"sources":["護理行政與管理（華杏）","Marquis & Huston《Leadership Roles and Management Functions in Nursing》","護理行政（新文京）"]}},"115100-N2-41":{"quick":"正解(C)。感情欠佳、先入為主且拒絕改變，屬心理（態度）障礙。","detail":{"background":"溝通障礙依來源分為四類：①「語意（語言）障礙」——用詞艱澀、專業術語、方言口音、外語、語意含糊或一詞多義，造成訊息被誤解；護理上避免對病人使用醫學術語即在克服此障礙。②「方法（管道）障礙」——溝通方式或媒介選擇不當，例如複雜事項只用口頭交代、噪音干擾、距離過遠、時間不足或使用不熟悉的資訊系統。③「心理（態度）障礙」——「雙方感情不睦、彼此不信任、有成見與刻板印象、先入為主、防衛心強且拒絕改變想法」，或情緒激動、焦慮、對立；這是最難處理也最常見的障礙，本題正屬此類，處理須先建立信任、傾聽並澄清彼此的認知。④「資訊超載（information overload）」——一次傳遞的訊息量超過接收者的處理能力，反而降低理解與記憶，護理衛教時應「一次聚焦少數重點並分段給予」。此外還有「生理障礙」（聽力視力障礙、疼痛、意識不清）與「文化障礙」。","options":{"A":"語意障礙來自用詞與語言理解問題。","B":"方法障礙來自溝通媒介或方式不當。","C":"正確。感情欠佳、成見與拒絕改變屬心理障礙。","D":"資訊超載是訊息量過多造成。"},"sources":["護理行政與管理（華杏）","Marquis & Huston《Leadership Roles and Management Functions in Nursing》","護理行政（新文京）"]}}},TO=["1管理理論與管理功能", "2領導理論型態與權力影響力", "3激勵理論", "4溝通協調", "5衝突管理", "6組織結構與組織文化", "7決策與問題解決", "8規劃目標管理與策略", "9授權與時間管理", "10護理成本預算與財務管理", "11管理者角色變革危機與人力品質"],LEC={"1管理理論與管理功能":{"html":"\n<p><b>管理理論演進:</b><b>古典(傳統)時期</b>——泰勒(Taylor)科學管理(標準化、時間動作研究、專業分工、按件獎懲、效率)、費堯(Fayol)行政管理(管理五功能、POSDCoRB)、韋伯(Weber)官僚/科層(層級、依法、不談私人關係、專業分工)。<b>新古典(修正)時期</b>——霍桑研究、Mayo、人際關係、行為科學(重人性需求)。<b>現代時期</b>——系統理論(輸入→轉化→輸出→回饋)、權變理論(因內外情境調整)。</p>\n<p><b>X/Y/Z理論:</b><b>X理論</b>(人性懶惰、需嚴格監督獎懲);<b>Y理論</b>(人性本善、自動自發、負責、有潛力);<b>Z理論</b>(大內Ouchi——團體價值觀、參與式決策、長期僱用、緩慢升遷、全面參與)。Gillies管理過程=輸入→轉化→輸出。</p>\n"},"2領導理論型態與權力影響力":{"html":"\n<p><b>領導理論演進:</b>特質論(先天特質)→行為論(<b>管理方格</b>Blake:X軸關心生產、Y軸關心員工;9,1職責、1,9鄉村俱樂部、9,9團隊、1,1無為)→權變論(<b>費德勒</b>:工作結構/職位權力/領導者-部屬關係;<b>情境Hersey-Blanchard</b>:依員工成熟度——M1告知、M2銷售、M3參與、M4授權;<b>路徑目標</b>:指導/支持/參與/成就)→新近(<b>轉換型</b>:願景激勵、智能啟發、個別關懷、超越期望;<b>交易型</b>:角色澄清、賞罰交換)。</p>\n<p><b>權力/影響力:</b>法統(合法、職位)、獎酬(獎勵)、強制(懲罰)、<b>專家(專技、專業知識)</b>、<b>榜樣(參考、效法典範)</b>、資訊。管理者(把事做對、職權)vs領導者(做對的事、個人特質)。</p>\n"},"3激勵理論":{"html":"\n<p><b>Maslow需求層級(由低而高、低層先滿足):</b>生理→安全→愛與歸屬→自尊→自我實現(最高)。護理應用:身體舒適=生理(最優先)、環境介紹=安全、同儕互動=愛與歸屬、表揚肯定=自尊。</p>\n<p><b>Herzberg雙因子:</b><b>激勵因子</b>(內在,帶來滿足:成就、肯定、升遷、成長、責任、工作本身);<b>保健因子</b>(外在,只防止不滿:薪資、人際、工作環境、安全、督導)。減少倦勤異動應強化激勵因子(如明確升遷)。</p>\n<p><b>其他:</b>公平理論(與同儕比較投入-報酬比)、期望理論(努力-績效-報酬)、<b>增強理論</b>(行為依結果修正)、ERG理論(存在-關係-成長)。內容理論(Maslow/Herzberg)vs過程理論(公平/期望/目標)。</p>\n"},"4溝通協調":{"html":"\n<p><b>溝通方向:</b><b>上行</b>(下級對上級)、<b>下行</b>(上級對下級)、<b>平行</b>(同層級/同層部門)、<b>斜行</b>(不同層級+不同部門/對外單位)、<b>葡萄藤式</b>(grapevine,非正式小道消息/謠言)。</p>\n<p><b>溝通特性:</b>持續性(每次延續上次的感受與關係)、雙向性、不可逆性。良好溝通管道:訊息必要、簡短直接、成員易取得、正式傳達。抱怨處理:先傾聽同理、找出問題,再解決。</p>\n"},"5衝突管理":{"html":"\n<p><b>衝突類型:</b><b>雙趨</b>(兩個都想要、只能選一,魚與熊掌)、<b>雙避</b>(兩個都不想要、必選一)、<b>趨避</b>(同一目標既想要又怕、有利有弊)。</p>\n<p><b>衝突發展五階段(Robbins):</b>潛在對立(條件)→<b>認知與個人化</b>(感知並情緒化、定義議題)→意圖→<b>行為</b>(外顯、最適合介入)→結果。</p>\n<p><b>衝突處理(關心自己/關心他人):</b>競爭(高/低)、<b>順從/順應</b>(低/高、犧牲自己)、妥協(中/中、各退一步)、<b>逃避</b>(低/低、迴避拖延)、<b>合作</b>(高/高、雙贏)。傳統觀點:衝突有害應避免;現代觀點:適度衝突有建設性,管理者應控制在適當程度,不以權力強壓。</p>\n"},"6組織結構與組織文化":{"html":"\n<p><b>組織結構:</b><b>直線</b>(指揮命令鏈)、<b>幕僚</b>(顧問諮詢、無指揮權)、<b>直線幕僚</b>(聘顧問協助)、<b>功能式</b>(依專業分部門:內外科營養護理部)、<b>矩陣式</b>(雙重隸屬:功能線+專案線)、<b>扁平式</b>(層級少、授權多、自主高、適成熟員工)、<b>高聳式</b>(層級多)、<b>科層/官僚式</b>(規章、層級、分工)、<b>簡單式</b>(小型低複雜)。</p>\n<p><b>集權vs分權:</b>集權(決策集中、緊急時效、精簡避免重複);分權(下放、員工自由受尊重、相互制衡)。<b>控制/管轄幅度</b>=一位主管直接管轄的部屬/單位數。<b>單一指揮</b>=只向一位主管負責。</p>\n<p><b>組織文化:</b>願景(未來圖像/目標指引)、使命(組織存在的理由,以顧客需要為依據)、價值觀(共同信念)、組織氣氛。</p>\n"},"7決策與問題解決":{"html":"\n<p><b>決策過程:</b>界定/確認問題(首要)→確立決策準則→列舉可行方案→分析方案利弊→執行方案→評估。決策類型:確定性、風險性、不確定性。</p>\n<p><b>決策方法:</b>個人/諮商(徵詢後自決)/團體決策;<b>團體決策</b>:腦力激盪(非量性)、<b>德爾菲法</b>(匿名多輪不互動)、<b>名義團體法</b>(具名提案討論排序)、焦點團體。<b>直覺決策</b>(經驗累積、危急/目標混淆時用)。</p>\n<p><b>原則:</b>最佳方案=符合組織目標、用較少資源、確定性高、冒險性低;優先處理影響組織利益最大的問題,再列子問題;重大問題主管親自處理、適當授權。</p>\n"},"8規劃目標管理與策略":{"html":"\n<p><b>規劃層級:</b>策略性規劃(高階、長程、依SWOT調整願景使命)、部門性規劃(中階)、執行性規劃(基層、短程)。規劃目的:降低不確定性、增效率、作管制基礎、減少重複(非增加步驟)。核心觀念=決策。</p>\n<p><b>目標管理MBO(杜拉克):</b>參與式、主管與員工<b>共同設定可測量目標</b>、定期檢討回饋、結果導向、落實分權(符合Y理論)。<b>SMART</b>:Specific具體、Measurable可測量、Achievable可達成、Relevant相關、Time-bound有時限。</p>\n<p><b>SWOT:</b>優勢/劣勢(內部)、機會/威脅(外部)。<b>策略規劃步驟:</b>確認使命目標→SWOT分析→制定策略→執行策略→評估結果。</p>\n"},"9授權與時間管理":{"html":"\n<p><b>授權(delegation)原則:</b><b>授權不授責</b>(主管仍負最終管理責任)、逐級授權、不可重複授權、公開授權、循指揮系統<b>不越級</b>(單一隸屬/指揮統一)、<b>授權前先教育訓練</b>、授權給有能力者、核心決策(政策/重大決策/管制藥追回)不宜授權。</p>\n<p><b>時間管理四象限優先序:</b>重要且緊急→<b>重要但不緊急</b>(最該投入、預防性)→不重要但緊急→不重要且不緊急。技巧:適當拒絕請託、利用零碎時間、正確使用電話郵件、充分授權。迷思:事必躬親、能者多勞、效率掛帥。</p>\n"},"10護理成本預算與財務管理":{"html":"\n<p><b>成本分類:</b><b>固定成本</b>(不隨服務量變動:薪資、折舊、租金、設備)vs<b>變動成本</b>(隨量變:衛材、藥品、耗材);<b>直接成本</b>(直接用於病人:護理師薪資、照護衛材)vs<b>間接成本</b>(支援性:行政電腦、教育訓練、水電);可控制成本(加班費)。<b>人事成本</b>占醫療總成本比率最高。</p>\n<p><b>損益平衡點(BEP):</b>無盈餘也無損失(總收入=總成本)。件數=固定成本÷(售價-單位變動成本);金額=固定成本÷邊際貢獻率。</p>\n<p><b>預算:</b><b>固定限額</b>(先設上限再申請)、<b>零基</b>(從零、不參考過去、每項說明理由)、<b>資本</b>(重大採購硬體)、固定(例行費用)、彈性(隨量調整)。損益表=特定期間經營成果。</p>\n"},"11管理者角色變革危機與人力品質":{"html":"\n<p><b>Mintzberg管理者角色:</b>人際(精神領袖/領導者/聯絡者)、資訊(<b>監督者</b>/傳播者/發言人)、決策(企業家/<b>騷亂平息者</b>/<b>資源分配者</b>/協商者)。注意聯絡者屬「人際」非決策角色。</p>\n<p><b>Lewin變革三階段:</b>解凍(unfreezing)→改變(change)→再凍(refreezing)。危機處理:核心小組快速決策(非全員參與)、80-20法則、馬上指派任務。</p>\n<p><b>考核偏誤:</b><b>向日葵效應</b>(全給高分彰顯領導)、月暈效應(單一印象概括)、集中趨勢(都給中間)、近因效應。<b>Donabedian品質:</b>結構/過程/結果。<b>病人分類:</b>原型(整體描述)、因素型(計分換點數)。人力資源:工作說明書(職務任務責任)、理想流動率5~10%、HRM重員工參與。</p>\n"}};
