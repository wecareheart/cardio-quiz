行,就不會發生風險","B":"評估對組織衝擊程度,考量財產損失即可","C":"需要定期評估組織規劃及各項資源準備度","D":"危害風險由小到大排序,高迫切性者優先"},"img":""},{"id":"113100-N2-37","code":"113100","roc":"113","cat":"N2","catname":"基本護理學與護理行政","num":37,"stem":"護理長依護理師工作表現與發展需求,擬定其生涯發展目標,下列敘述何者正確?","opts":{"A":"能力優良有發展潛力者,給予前程管理","B":"能力普通表現尚可者,安排再教育","C":"表現欠佳無改善空間者,給予適當輔導","D":"能力較差有改進空間者,勸退或資遣"},"answer":"A","answer_status":"normal","accepted_answers":["A"],"topic":"11管理者角色變革危機與人力品質","topic_code":"A1-11","q_num":37,"roc_year":"113","exam_code":"113100","src":"民國113年","options":{"A":"能力優良有發展潛力者,給予前程管理","B":"能力普通表現尚可者,安排再教育","C":"表現欠佳無改善空間者,給予適當輔導","D":"能力較差有改進空間者,勸退或資遣"},"img":""},{"id":"113180-N2-42","code":"113180","roc":"113","cat":"N2","catname":"基本護理學與護理行政","num":42,"stem":"有關護理人力招募工作,下列敘述何者正確?","opts":{"A":"掌握護理部人力需求狀況,並進行供需分析","B":"醫院人力資源室決定招募方向、管道及效益指標評量","C":"招募工作完成半年後,進行活動效益評估","D":"為符合招募的成本效益,由人資管理師負責"},"answer":"A","answer_status":"normal","accepted_answers":["A"],"topic":"11管理者角色變革危機與人力品質","topic_code":"A1-11","q_num":42,"roc_year":"113","exam_code":"113180","src":"民國113年","options":{"A":"掌握護理部人力需求狀況,並進行供需分析","B":"醫院人力資源室決定招募方向、管道及效益指標評量","C":"招募工作完成半年後,進行活動效益評估","D":"為符合招募的成本效益,由人資管理師負責"},"img":""},{"id":"114030-N2-8","code":"114030","roc":"114","cat":"N2","catname":"基本護理學與護理行政","num":8,"stem":"有關完全電子病歷優點的敘述,下列何者錯誤?","opts":{"A":"資料可供同體系共享,維持資料一致性","B":"醫療流程管制與修改方便,且不會留有紀錄","C":"資料完善,具結構化,可促進醫學研究","D":"不必有紙本病歷,可以減少醫院的成本"},"answer":"B","answer_status":"normal","accepted_answers":["B"],"topic":"11管理者角色變革危機與人力品質","topic_code":"A1-11","q_num":8,"roc_year":"114","exam_code":"114030","src":"民國114年","options":{"A":"資料可供同體系共享,維持資料一致性","B":"醫療流程管制與修改方便,且不會留有紀錄","C":"資料完善,具結構化,可促進醫學研究","D":"不必有紙本病歷,可以減少醫院的成本"},"img":""},{"id":"114030-N2-46","code":"114030","roc":"114","cat":"N2","catname":"基本護理學與護理行政","num":46,"stem":"對於工作意願低,工作能力也低的員工,下列何種管理策略最為適當?","opts":{"A":"移轉策略","B":"激發策略","C":"增強策略","D":"發展策略"},"answer":"A","answer_status":"normal","accepted_answers":["A"],"topic":"11管理者角色變革危機與人力品質","topic_code":"A1-11","q_num":46,"roc_year":"114","exam_code":"114030","src":"民國114年","options":{"A":"移轉策略","B":"激發策略","C":"增強策略","D":"發展策略"},"img":""}],E={"101030-N2-61":{"quick":"全面參與品質改善=Z理論(團體價值、參與式決策)。","detail":{"background":"McGregor 的 X 理論假設人天生怠惰、需要嚴密監督與獎懲;Y 理論假設人願意自我督促、在適當條件下會主動承擔責任;Ouchi 的 Z 理論則強調長期僱用、共同決策與全員參與,主張讓基層一起投入改善以形成向心力。單位推動降低跌倒率的專案而要求護理人員全面參與,正是 Z 理論所描述的參與式管理;系統理論談的是投入、過程、產出與回饋的架構,並非參與。故選 C。","options":{"A":"X理論是嚴格監督。","B":"Y理論是自動自發。","C":"正確(本題答案)。全面參與=Z理論。","D":"系統理論強調輸入轉化輸出。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"101030-N2-65":{"quick":"會議成功:重要性高的議題排在前面。","detail":{"background":"會議要有效率,議程安排與會前準備比開會當下的發言更關鍵。議題應依重要性排序,把最重要的放在最前面,因為此時與會者的注意力與出席率最高;議程與資料應於會前送達,讓與會者先行準備。人數以五到十人左右較能充分討論;需要長時間討論的議題若排在前面,常排擠掉其他重要事項;堅持所有人到齊才開會亦不切實際。此外應明定開始與結束時間、指定記錄人員並於會後追蹤決議事項的執行,會議才不會流於形式。故選 B。","options":{"A":"與會人員宜少而精,15~20人過多。","B":"正確(本題答案)。重要議題排前面。","C":"非以費時與否排序,以重要性。","D":"不必確認每人都參加。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"101110-N2-58":{"quick":"護理專案改進跌倒=Z理論(全員參與)。","detail":{"background":"Z 理論由 Ouchi 綜合美日管理特色提出,主張以長期僱用、集體決策、全員參與品管圈與專案改善、重視員工整體福祉來建立信任與向心力,護理專案正是其在臨床的具體展現。X 理論主張人性怠惰而以監督與獎懲驅動,Y 理論主張人會自我實現而給予自主,權變理論則強調沒有一種最好的管理方式而須依情境調整,三者都不以全員參與改善為核心。作答時可抓住關鍵字:凡提到全員參與、品管圈、專案改善與團隊共識的,通常指向 Z 理論。故選 C。","options":{"A":"X理論是嚴格監督。","B":"Y理論是自動自發。","C":"正確(本題答案)。全員參與專案=Z理論。","D":"權變理論是因情境調整。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"101110-N2-68":{"quick":"加開病床增人力資材儀器=系統理論的「輸入」。","detail":{"background":"Nadler與Tushman一致模式(系統觀):輸入(input,資源:人力、資材、儀器、設備)→轉化過程(transformation)→輸出(output,結果)→回饋圈。加開病床所需增加的「人力、資材、儀器、設備」屬「輸入」(A正確)。故輸入(A)。","options":{"A":"正確(本題答案)。人力資材儀器設備屬輸入。","B":"轉化過程是處理活動。","C":"輸出是結果。","D":"回饋圈是回饋修正。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"102030-N2-59":{"quick":"Gillies系統分析「轉化過程」=給予病人治療相關衛教。","detail":{"background":"Gillies(季麗絲)系統分析法:輸入(收集病史等資料)→轉化過程(對病人的處置、衛教等護理活動)→輸出(病人結果:疼痛減輕、自信增強)。選項C「給予病人治療相關衛教」=轉化過程(C正確)。A收集病史=輸入;B疼痛減輕、D自信增強=輸出。故C。","options":{"A":"收集病史是輸入。","B":"疼痛減輕是輸出。","C":"正確(本題答案)。給予衛教是轉化過程。","D":"自信增強是輸出。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"102030-N2-60":{"quick":"控制原則「不」適當=過程中不宜即時修正(應即時修正)。","detail":{"background":"控制是把實際表現與既定標準比較並加以修正的管理功能,原則包括:衡量指標盡量量化以便客觀比較;聚焦於影響重大的關鍵活動而非事事監控;事先訂出可容忍的閾值,超出才啟動處理;以及即時回饋,在過程中就發現偏差並修正,而不是等到結束才檢討。因此主張過程中不宜即時修正,正好違反控制講求時效的精神。護理品質監測正是控制功能的具體應用:訂出指標與閾值、定期收集數據、超出閾值立即檢討並修正流程,而非等到年度統計出爐才處理。故選 D。","options":{"A":"適當。成果需量化。","B":"適當。重大影響活動為控制重點。","C":"適當。訂閾值容忍範圍。","D":"不適當(本題答案)。過程中應即時修正。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"102030-N2-79":{"quick":"會議成功要訣=重要性高的議題宜排在會議前面。","detail":{"background":"有效會議的要件包括:議程與資料於會前送達,讓與會者能預先準備,而不是到場才知道要討論什麼;準時開始而不必等所有人到齊,以免變相懲罰守時者;每個議題設定討論時限,達成結論或決定延議即進入下一案,不必等每個人都發言;議題依重要性排序,把注意力最集中的時段留給關鍵決策。此外會議應有明確的主席與記錄,結論須列出負責人與完成期限,並在下次會議追蹤執行情形。故選 D。","options":{"A":"議程應事先發放,非開會才宣布。","B":"應準時開會,不必等全到。","C":"不必每位發言才移議題(耗時)。","D":"正確(本題答案)。重要議題排會議前面。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"102030-N2-80":{"quick":"依當前高離職、招募困難的「情境」彈性增聘人力以確保病安、減負荷，屬權變理論(因情境調整)，故選D。","detail":{"background":"本題官方答案C(系統理論)。護理部主任因離職率高、新人召募困難,建議「增聘照顧服務員(增加人力輸入)以確保病人安全與減少工作負荷」=從「系統理論」輸入面調整資源以改善輸出(C正確)。Z理論(團體參與)、官僚理論、權變理論皆非此資源輸入調整。故系統理論(C)。","options":{"A":"Z理論強調團體參與決策與長期僱用。","B":"官僚理論強調層級規章制度。","C":"系統理論強調投入-轉換-產出整體觀。","D":"正解：依情境彈性調整人力配置=權變理論。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"102110-N2-69":{"quick":"標準化作業受「科學管理」理論影響。","detail":{"background":"Taylor 的科學管理學派主張以時間動作研究找出最有效率的作業方式,將其訂為標準作業程序,並據以訓練員工、依績效給薪;護理常規、技術標準與查核表都是這個思路的產物。行為科學學派強調人的動機與人際關係,系統理論著眼於投入、過程、產出與回饋的整體,角色理論探討角色期待與角色衝突,都不是標準化作業的源頭。科學管理帶來效率與一致性,卻也被批評把人視為機器而忽略動機,後續的行為科學學派正是針對此一缺口而生。故選 A。","options":{"A":"正確(本題答案)。標準化作業受科學管理影響。","B":"行為科學重人性需求。","C":"系統理論是輸入輸出。","D":"角色理論非標準化來源。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"103030-N2-71":{"quick":"遲到扣績效=X理論(人性需嚴格管控)。","detail":{"background":"X 理論假設員工天生厭惡工作、缺乏企圖心,必須以監督、控制與懲罰驅使其達成目標,因此管理手段偏向規定與扣罰;Y 理論假設員工會自我督促、追求成就,管理者的任務是創造條件並適度授權;Z 理論則強調長期僱用與全員參與。護理長以公告宣示遲到即扣績效,是以懲罰確保出席,反映的正是對人性偏負面的假設。值得注意的是,兩種假設會形成自我實現的循環:以懲罰管理容易使員工只求不犯錯,反過來又強化了主管對人性的負面印象。故選 A。","options":{"A":"正確(本題答案)。扣績效懲罰管控=X理論。","B":"Y理論是自動自發。","C":"Z理論是團體參與。","D":"系統理論是輸入輸出。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"103100-N2-61":{"quick":"官僚模式「不」含員工較會自動自發(官僚靠規章非自發)。","detail":{"background":"韋伯(Weber)理想官僚(科層)模式條件:不談私人關係(對,對事不對人)、升遷按規定(對)、每人擔任一項職位專業分工(對)。選項D「員工較會自動自發」不是官僚模式條件(本題答案)——官僚靠「規章制度、層級權威」運作,非靠員工自發(自發是Y理論)。故D。","options":{"A":"官僚不談私人關係。","B":"官僚升遷按規定。","C":"官僚每人擔任一項職位。","D":"正確(本題答案)。自動自發非官僚條件(屬Y理論)。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"103100-N2-72":{"quick":"護理長角色「不屬決策」角色=聯絡者(屬人際角色)。","detail":{"background":"Mintzberg管理者角色三類:人際角色(精神領袖figurehead、領導者leader、聯絡者liaison)、資訊角色(監督者、傳播者、發言人)、決策角色(企業家、騷亂平息者、資源調配者、協商者/調停者)。選項C「聯絡者」屬「人際角色」非決策角色(本題答案)。故C。","options":{"A":"騷亂平息者是決策角色。","B":"資源調配者是決策角色。","C":"正確(本題答案)。聯絡者是人際角色,非決策。","D":"調停者(協商者)是決策角色。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"103100-N2-78":{"quick":"病人抱怨檢查取消:先傾聽抱怨並找出問題所在。","detail":{"background":"處理抱怨的原則是先處理情緒、再處理事情。病人空腹十六小時後檢查被取消,累積的是生理不適與被忽視的感受,此時最需要的是有人願意完整聽完經過,同時從中釐清究竟是排程、通報還是醫囑變更環節出了問題。置之不理會使不滿升高;還沒弄清原委就急著道歉,雖有安撫作用卻無助改善,也可能錯認責任歸屬;一開始就轉給督導或公關,則傳達出推卸的訊息。傾聽之後仍應回到系統面,查明取消的通報是否落在交班或資訊系統的漏洞,並回饋給相關單位改善。故選 C。","options":{"A":"不理會抱怨不當。","B":"馬上道歉未先了解問題。","C":"正確(本題答案)。先傾聽抱怨找出問題。","D":"立即找他人是推卸。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"104030-N2-66":{"quick":"輸入轉化輸出=系統理論特點。","detail":{"background":"系統理論把組織視為與環境互動的開放系統,基本架構是輸入、轉化過程、輸出,再加上回饋與環境的影響。以病房為例,人力、設備與病人是輸入,護理照護的執行是轉化過程,病人的健康結果與滿意度是輸出,品質指標則透過回饋回到輸入端調整資源。回饋只是系統中的一個環節而非獨立理論;情境理論強調管理方式須依情境調整;整合理論並非標準的組織理論分類。開放系統的觀點也提醒管理者,單位的問題常來自外部環境的變化,不能只在內部流程上打轉。故選 A。","options":{"A":"正確(本題答案)。輸入轉化輸出是系統理論。","B":"回饋理論非此三段架構。","C":"情境理論是因情境調整。","D":"整合理論非此。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"104100-N2-7":{"quick":"健康觀:WHO認為健康是生理心理「社會」完全安適,非僅無疾病。本題答案B。","detail":{"background":"本題官方答案B(歐倫Orem健康觀正確項)。各家健康觀:WHO健康=「生理、心理及社會的完全安適狀態」,非僅「沒有疾病或虛弱」(D敘述不完整故錯);羅伊(Roy)適應模式;羅傑斯(Rogers)整體人;歐倫(Orem)自我照顧——健康是能成功處理面臨問題、達到自我照顧需求平衡(B正確)。故B。","options":{"A":"羅伊敘述須對應適應模式。","B":"正確(本題答案)。歐倫健康=成功處理問題達自我照顧。","C":"羅傑斯非與病菌互動。","D":"WHO健康含社會安適,非僅無疾病。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"105030-N2-61":{"quick":"「樂於被督促、嚮往安全感」不屬Y理論(屬X理論)。","detail":{"background":"Y 理論對人性抱持正面假設:工作如同遊戲與休息一樣自然,人天生並不排斥;在適當條件下會自我督促、主動尋求並接受責任;多數人都具有想像力與創造潛能,只是常被組織壓抑。相對地,X 理論才認為人生性懶惰、缺乏企圖心,喜歡被督促、逃避責任並特別重視安全感,必須以控制與懲罰驅使。題目所列選項中,樂於被督促且嚮往安全感屬 X 理論的假設。McGregor 的重點在於管理者的人性假設會決定其管理手段,而手段又回過頭來塑造員工的行為表現。故選 C。","options":{"A":"Y理論:天生喜歡工作。","B":"Y理論:會尋求接受責任。","C":"正確(本題答案)。樂於被督促嚮往安全=X理論。","D":"Y理論:人都有潛力。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"105090-N2-60":{"quick":"明確規則嚴格訓練督考獎金=古典時期(傳統理論)觀點。","detail":{"background":"管理思想的演進可分幾個時期。古典或傳統理論時期以泰勒的科學管理、費堯的管理程序與韋伯的科層體制為代表,主張把工作拆解成標準化的步驟、訂定明確的規則與程序、嚴格訓練與督考,並以金錢誘因驅動產出,提案愈多獎金愈高即是典型的經濟人假設。新古典時期受霍桑實驗影響,轉而重視人際關係與非正式團體;現代時期以系統與權變觀點看待組織與環境的互動;後現代則強調多元、彈性與知識管理。題幹通篇是規則、督考與金錢誘因。故選 A。","options":{"A":"正確(本題答案)。明確規則嚴格督考=古典時期。","B":"新古典重人性需求。","C":"現代強調系統與情境。","D":"後現代非此。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"105090-N2-65":{"quick":"官僚(科層)組織「不」是較少結構化(科層高度結構化)。","detail":{"background":"韋伯所描述的科層或官僚體系具有幾項特徵:明確的層級節制與指揮鏈、依規章行事而非依人情、高度專業分工並訂有專業化的作業程序、以年資與能力為晉用依據,決策權多集中於上層。因此它的組織行為是高度結構化而非缺少結構,這正是本題的錯誤敘述。至於它可存在於各種規模的組織、傾向集權、具備專業化程序,則都符合其定義;規模大小並不是科層與否的判準。科層體制的優點是穩定、可預測與公平,缺點則是僵化、繁文縟節與難以快速回應變化,因此常與扁平化或矩陣設計並行以取長補短。故選 A。","options":{"A":"正確(本題答案)。官僚是高度結構化,非較少。","B":"官僚可存在各種規模組織。","C":"官僚傾向集權。","D":"官僚有專業化作業程序。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"106030-N2-64":{"quick":"官僚理論「不」是惡質的管理模式(是中性的合法權威制度)。","detail":{"background":"官僚(Bureaucracy)理論:韋伯(古典組織學之父)發展(對)、是機構中「合理合法的權威」(對)、強調制度凌駕於人(對)。選項C「是一種惡質的管理模式」錯誤(本題答案)——官僚是中性的「理性化、制度化」管理模式,「官僚」一詞在韋伯理論中無貶義。故C。","options":{"A":"官僚由韋伯發展。","B":"官僚是合理合法的權威。","C":"正確(本題答案)。官僚非惡質模式,是中性制度。","D":"官僚強調制度凌駕於人。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"106110-N2-57":{"quick":"運用科學研究設計專業分工=泰勒(科學管理)。","detail":{"background":"古典管理理論的三位代表人物分工明確:泰勒被稱為科學管理之父,以時間動作研究等科學方法找出最有效率的作業方式,主張專業分工、標準化與按件計酬;費堯提出管理程序與十四項管理原則,著眼於整體行政管理;韋伯提出科層體制,強調層級節制與依法行事。赫茲伯格則屬行為學派,提出保健因素與激勵因素的雙因子理論。題幹強調科學研究與實驗方法。作答時可用人名對應關鍵字:泰勒對應科學管理與標準化,費堯對應管理程序與原則,韋伯對應科層與法制,赫茲伯格對應激勵與保健因素。故選 A。","options":{"A":"正確(本題答案)。科學研究設計專業分工=泰勒。","B":"費堯是行政管理五功能。","C":"韋伯是官僚理論。","D":"赫茲伯格是雙因子理論。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"106110-N2-59":{"quick":"Y理論「不」含傾向外在控制的評值(Y理論重內在自我控制)。","detail":{"background":"Y 理論假設員工會自我督促、願意承擔責任並具備創造潛能,因此管理上採民主方式、鼓勵員工參與決策、保留計畫的彈性以容納創新,並以自我控制與自我評值取代外部監督。傾向外在控制的評值則反映 X 理論的假設,認為員工不會自動自發,必須靠他人查核才會達成目標。判斷這類題目的關鍵,在於該作法把控制權放在員工自己還是主管手上。實務上兩種假設常混用,例如以自我評值為主但保留必要的稽核,重點在於不要讓外部控制取代員工的自主管理。故選 D。","options":{"A":"Y理論:民主方式。","B":"Y理論:鼓勵員工參與。","C":"Y理論:計畫有彈性。","D":"正確(本題答案)。外在控制屬X理論,非Y理論。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"106111-N2-31":{"quick":"靜脈不明顯改善：2輕拍部位促組織胺釋放擴大血管、4壓脈帶加壓約100 mmHg使血管浮現→「24」，故選D。","detail":{"background":"本題屬給藥/靜脈穿刺但歸管理站,官方答案「13」。靜脈不明顯改善措施:1局部「濕熱敷」(熱使血管擴張,題幹1若為濕冷敷則錯,本題正解組合為13)、3將穿刺部位「下垂(低於心臟)」使血管充盈。核心:濕熱敷+肢體下垂+輕拍+握拳使血管浮現,利穿刺。故13。","options":{"A":"含1(濕冷敷,應濕熱敷)、缺血管充盈措施。","B":"含3(肢體高於心臟,應低於心臟)錯。","C":"含1、3皆錯。","D":"正解(24)：輕拍促組織胺、壓脈帶加壓至100 mmHg。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"107030-N2-57":{"quick":"系統理論「不屬輸出」=疾病史(屬輸入)。","detail":{"background":"系統理論把運作拆成輸入、轉化過程、輸出與回饋。輸入是投入系統的資源與資料,包括人力、設備、經費,以及病人帶進來的疾病史、檢驗數據與健康狀況;轉化過程是護理評估、計畫與執行;輸出則是經過照護後產生的結果,例如疼痛程度減輕、合併症獲得預防、病人滿意度提升。疾病史是病人入院時既有的資料,屬輸入端而非照護的成果。作答時可用一個簡單判準:發生在照護之前、屬於病人帶進來的資料是輸入,照護之後才出現的變化是輸出。故選 A。","options":{"A":"正確(本題答案)。疾病史是輸入,非輸出。","B":"病患滿意度是輸出。","C":"疼痛減輕是輸出。","D":"合併症預防是輸出。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"107030-N2-58":{"quick":"官僚體制特徵「不」含重視人性化(官僚重制度非人性)。","detail":{"background":"韋伯的官僚體制模式強調以理性與法制取代人治,特徵包括:明確的層級節制與指揮鏈、依專業分工並訂定標準作業程序、依法規行事而非依人情、職位與職權分離、以能力與年資作為晉用依據,並保持對事不對人的非人格化態度。正因為刻意排除個人情感與人情因素以確保公平,它經常被批評為僵化而缺乏彈性與人性化,這也是後續人群關係學派興起的原因。儘管如此,科層體制在公平性、可預測性與規模化管理上仍有其價值,現代醫院多在其基礎上加入彈性與授權的設計。故選 D。","options":{"A":"官僚採層級制度。","B":"官僚依專業分工。","C":"官僚依法行事。","D":"正確(本題答案)。重視人性化非官僚特徵。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"107030-N2-63":{"quick":"「被尊重重視、相信人有潛能自我實現」=新古典(修正理論)。","detail":{"background":"新古典或修正理論時期以霍桑實驗為起點,重視人的動機、情感與非正式團體,代表理論包括 Maslow 的需求層次、McGregor 的 Y 理論與 Herzberg 的雙因子理論,主張員工並非只受金錢驅使,受到尊重與重視、被賦予責任才會主動改變行為。古典時期強調標準化、分工與經濟誘因;現代時期以系統與權變觀點看組織與環境;後現代則強調多元與彈性。題幹通篇談尊重、潛能與自我實現。這一時期的貢獻在於把人重新放回管理的中心,但也被批評過度樂觀,未充分處理組織結構與外部環境的影響。故選 B。","options":{"A":"古典時期重效率標準。","B":"正確(本題答案)。重人性需求自我實現=新古典。","C":"現代時期重系統情境。","D":"後現代非此。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"107030-N2-73":{"quick":"員工樂於工作=Y理論。","detail":{"background":"McGregor 的 Y 理論認為工作如同遊戲與休息一樣自然,員工並不天生厭惡工作,在適當條件下會樂於投入、自我督促並主動承擔責任,也具備想像力與創造潛能,因此管理者應創造環境並適度授權。X 理論則假設人性怠惰、必須以監督與懲罰驅使;Z 理論強調長期僱用、集體決策與全員參與;至於 J 理論並非管理學的標準分類。McGregor 的重點在於管理者的人性假設會決定其管理手段,而手段又回過頭來塑造員工的行為表現。故選 C。","options":{"A":"J理論非標準。","B":"X理論是人性懶惰。","C":"正確(本題答案)。員工樂於工作=Y理論。","D":"Z理論是團體參與。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"108020-N2-57":{"quick":"Z理論重點=參與式決策(1)+團體價值(3)?本題答案D「135」。","detail":{"background":"本題官方答案「135」。大內(Ouchi)Z理論重點:1參與式決策、3團體價值觀、5(長期僱用/整體關懷等)。選項2「快速升遷」錯(Z理論強調緩慢升遷long-term);4「專業化歷練」錯(Z理論強調非專業化的生涯路徑、多面歷練)。故135。","options":{"A":"含2(快速升遷)錯。","B":"含2、4錯。","C":"含2、4錯。","D":"正確(本題答案,135)。參與式決策、團體價值等。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"108020-N2-67":{"quick":"新古典(修正理論)=Mayo發現非正式組織會影響正式組織領導。","detail":{"background":"新古典(修正理論):A「Mayo發現非正式組織普遍存在,會對正式組織領導造成影響」正確(霍桑研究、人際關係學派)。B霍桑研究發現「人際/社會因素」影響生產力(非規章);C Maslow認為需「由低而高」逐層滿足(非只滿足高層次);D McGregor的Y理論強調「個人與組織需求調和」(非組織重於個人)。故A。","options":{"A":"正確(本題答案)。Mayo發現非正式組織影響正式組織。","B":"霍桑研究發現人際因素影響生產力。","C":"Maslow需逐層滿足,非只高層次。","D":"Y理論強調個人組織需求調和。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"108110-N2-60":{"quick":"Y理論=人會自我引導自我控制(非需指揮);本題答案C「245」。","detail":{"background":"Y 理論對人性抱持正面假設:人性本善,工作如同休息與遊戲一樣自然,人本身即有工作與成就的需求,在適當條件下會自我督促、主動承擔責任並發揮創造力,因此管理上採參與式,鼓勵員工投入決策並以自我控制取代外部監督。相對地,認為人都需要指導、人都是不成熟的,則是 X 理論的假設,主張必須以嚴密監督與獎懲驅使。把這兩項排除後即可得到正確組合。這類複選組合題可先鎖定一個明顯屬於對立理論的敘述並刪去含有該項的選項,通常一到兩個判斷即可定案。故選 C。","options":{"A":"含1(需被指揮)是X理論。","B":"含1錯。","C":"正確(本題答案,245)。自我控制、負責、有潛力。","D":"含1錯。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"108110-N2-70":{"quick":"組織理論:新古典(修正理論)強調以人性需求進行組織管理。","detail":{"background":"組織理論:C「新古典(修正理論)強調以人性需求進行組織管理」正確(行為科學、霍桑、人際關係)。A「組織不需監督領導」錯;B「近代理論強調設計組織結構發揮效能」敘述須對應(此偏古典結構觀);D「古典理論強調民主式參與」錯(古典重效率標準集權,民主參與是新古典/現代)。故C。","options":{"A":"組織需監督領導。","B":"設計結構發揮效能偏古典。","C":"正確(本題答案)。新古典強調人性需求管理。","D":"民主參與非古典理論。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"109030-N2-58":{"quick":"人性樂觀進取自動自發自我實現=Y理論。","detail":{"background":"McGregor 提出兩種對比的人性假設:X 理論認為員工天生厭惡工作、缺乏企圖心、逃避責任並追求安全感,必須以監督、控制與懲罰驅使;Y 理論則認為人性樂觀進取,工作如同休息一樣自然,員工能自動自發、主動承擔責任並追求自我實現,管理者的任務是創造條件並適度授權。Z 理論強調長期僱用與全員參與;權變理論主張管理方式應隨情境調整。題幹描述的是正面假設。McGregor 的重點在於管理者的人性假設會決定其管理手段,而手段又回過頭來塑造員工的行為表現。故選 B。","options":{"A":"X理論是人性懶惰需監督。","B":"正確(本題答案)。樂觀自發自我實現=Y理論。","C":"Z理論是團體參與。","D":"權變理論是因情境調整。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"109030-N2-68":{"quick":"在職教育強化技能=Gillies管理過程的「轉化過程」。","detail":{"background":"Gillies 的護理管理過程借用系統理論的架構:輸入包括人力、設備、經費、病人資料與現有的護理能力;轉化過程是把這些資源加以運用的管理活動,例如組織、領導、教育訓練與品質管制;輸出是照護成果、病人滿意度與人員發展成效;回饋則把輸出的結果回送到輸入端以調整資源。護理長辦理在職教育以強化同仁技能,是在對資源進行加工,屬轉化過程。分辨輸入與轉化過程的訣竅,在於問這件事是資源本身,還是對資源所做的加工。故選 B。","options":{"A":"輸入是資源。","B":"正確(本題答案)。在職教育強化技能是轉化過程。","C":"輸出是成果。","D":"回饋是回饋修正。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"109110-N2-57":{"quick":"傳統vs修正管理理論:修正管理理論受人類行為思潮影響。","detail":{"background":"傳統(古典)vs修正(新古典)管理理論:B「修正管理理論有受到人類行為思潮(行為科學、人際關係)影響」正確。A「傳統理論不講究科學」錯(傳統的科學管理正是講究科學);C「兩者帶動系統理論」敘述須對應(系統理論是更後期);D「修正理論較不重視績效」錯(修正理論重人性但仍重績效)。故B。","options":{"A":"傳統的科學管理講究科學。","B":"正確(本題答案)。修正理論受人類行為思潮影響。","C":"系統理論是更後期。","D":"修正理論仍重績效。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"110030-N2-58":{"quick":"依情況變化適度調整永續經營=現代時期(系統理論)觀點。","detail":{"background":"管理思想的演進反映了對組織與環境關係的理解。古典時期把組織視為封閉系統,追求一套放諸四海皆準的最佳作法;新古典時期把焦點轉向人的動機與人際關係;現代或系統理論時期則把組織視為與環境不斷交換資源與資訊的開放系統,並由此發展出權變觀點,主張沒有絕對最好的管理方式,必須隨情境變化調整才能存續。題幹強調注意環境因素、依情況調整以永續經營,正是這一時期的核心命題。權變觀點在護理管理上的體現,就是同一種排班或領導方式未必適用於所有單位,必須依人力結構與病人特性調整。故選 C。","options":{"A":"古典時期重效率標準。","B":"新古典重人性需求。","C":"正確(本題答案)。依環境變化調整=現代系統時期。","D":"後現代非此。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"110030-N2-59":{"quick":"缺乏組織能力是內在因素;「文書工作繁雜」是外在因素。","detail":{"background":"時間管理障礙的內外因素:內在因素(個人習慣態度:難以拒絕他人、計畫不周全、缺乏組織能力、拖延);外在因素(環境/工作本身:文書工作繁雜、會議多、干擾)。選項D「文書工作繁雜」屬「外在因素」(本題答案)。A難以拒絕、B計畫不周、C缺乏組織能力皆內在。故D。","options":{"A":"難以拒絕他人是內在因素。","B":"計畫不周全是內在因素。","C":"缺乏組織能力是內在因素。","D":"正確(本題答案)。文書工作繁雜是外在因素。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"110110-N2-71":{"quick":"Y理論管理積極自發員工:依特質安排具挑戰性工作。","detail":{"background":"Y 理論假設員工會自我督促、主動承擔責任並具備創造潛能,因此管理者的任務是創造條件讓他們發揮,而非監督控制。面對積極自動且富創意的成員,最適當的作法是依其特質分派具挑戰性的任務,給予自主空間與必要資源,並在完成後給予肯定。嚴格監督會壓抑主動性;單靠金錢獎勵屬保健因素,難以持續;強化安全感則是針對缺乏保障時的介入。值得注意的是,授權並非放任,主管仍須設定目標與回報時點,並在需要時提供資源與排除障礙。故選 C。","options":{"A":"金錢獎勵偏保健因子。","B":"嚴格監督是X理論。","C":"正確(本題答案)。依特質安排挑戰性工作。","D":"強化安全感是低層次需求。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"110110-N2-76":{"quick":"系統理論:輸出提高、輸入不變,即可提高生產力。","detail":{"background":"生產力定義為產出除以投入,因此提高生產力有三條途徑:投入不變而產出增加、產出不變而投入減少,或產出增加的幅度大於投入增加的幅度。逐一檢視選項可知,輸出提高而輸入不變,比值上升,生產力確實提高;輸出不變而輸入提高,或輸出降低而輸入提高,比值都下降;至於輸出提高且輸入降低,比值上升,結論卻寫成降低生產力,方向相反。護理上的具體作法包括簡化重複的紀錄、導入輔助人力分擔非專業工作,都是在不增加投入下提高產出。故選 A。","options":{"A":"正確(本題答案)。輸出提高輸入不變→生產力提高。","B":"輸出不變輸入提高→生產力降。","C":"輸出降輸入提高→生產力降。","D":"輸出提高輸入降→生產力升,非降。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"111030-N2-61":{"quick":"作業標準化適當分工提升服務量品質=科學管理理論。","detail":{"background":"科學管理理論由泰勒提出,主張以時間動作研究等科學方法找出最有效率的作業方式,將其標準化並訂為作業程序,再配合適當分工與訓練,使產出與品質同時提升。護理作業標準、技術查核表與工作流程再造都是這一思路的產物。管理程序學派由費堯提出,著眼於規劃、組織、指揮、協調與控制等管理功能;層次結構模式即科層體制;行為科學學派則重視人的動機與人際關係。科學管理帶來效率與一致性,卻也被批評把人視為機器而忽略動機,後續的行為科學學派正是針對此一缺口而生。故選 A。","options":{"A":"正確(本題答案)。標準化分工=科學管理理論。","B":"管理程序學派是費堯五功能。","C":"層次結構模式非此。","D":"行為科學學派重人性。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"111030-N2-62":{"quick":"團體價值觀文化、員工參與式決策=Z理論。","detail":{"background":"Z 理論由 Ouchi 綜合美日企業特色提出,核心是以團體價值觀與組織文化凝聚成員,採取長期僱用、緩慢升遷、集體決策與全員參與,並關心員工的整體生活,使員工與組織形成命運共同體。權變理論主張管理方式須依情境調整;系統理論以輸入、轉化、輸出與回饋描述組織與環境的互動;管理者角色理論則是 Mintzberg 對管理者實際作為的分類。Z 理論在護理管理上的應用,包括品管圈、單位共識營與參與式排班,重點都在於讓成員覺得自己是組織的一份子。故選 B。","options":{"A":"權變理論是因情境調整。","B":"正確(本題答案)。團體價值參與式決策=Z理論。","C":"系統理論是輸入輸出。","D":"管理者角色理論非此。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"112030-N2-59":{"quick":"行為科學學派=Maslow需求(2)+McGregor的X理論(3)?本題答案B「23」。","detail":{"background":"行為科學學派又稱新古典或修正理論時期,核心是把研究焦點從工作方法轉向人的動機、需求與人際關係,代表理論包括 Maslow 的需求層次理論、McGregor 的 X 與 Y 理論,以及 Herzberg 的雙因子理論。Morse 與 Lorsch 的權變理論屬現代時期,主張管理方式須依情境調整;至於所謂 L 理論並非管理學的標準分類。把這兩項排除後即得正確組合。辨識學派的訣竅是看研究焦點:談作業方法與效率屬古典,談人的需求與動機屬行為科學,談組織與環境互動屬現代。故選 B。","options":{"A":"含1(L理論)非標準。","B":"正確(本題答案,23)。Maslow需求、McGregor理論屬行為科學。","C":"含1錯。","D":"含...不符。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"112030-N2-66":{"quick":"組長中途請辭忘年會:了解困難從旁協助籌辦(授權後仍負責、支持)。","detail":{"background":"甲組長允諾籌辦忘年會後表示工作繁瑣請另指派,護理長最適當處理是「了解甲組長的困難,從旁協助籌辦(A)」——授權後主管仍負最終責任,應支持協助而非輕易撤換,培養員工能力。B另指派乙組長(放棄培養)、C指派乙組長一起(削弱甲)、D指派數位協助(過度)皆不如先了解協助。故A。","options":{"A":"正確(本題答案)。了解困難從旁協助籌辦。","B":"另指派乙組長放棄培養甲。","C":"指派乙一起削弱甲。","D":"指派數位協助過度。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"113030-N2-38":{"quick":"POSDCoRB:R代表Reporting(報告)。","detail":{"background":"顧力克(Gulick)POSDCoRB七功能:P規劃(Planning)、O組織(Organizing)、S用人(Staffing)、D指揮(Directing)、Co協調(Coordinating)、R報告(Reporting)、B預算(Budgeting)。選項A「R代表Reporting」正確。B P是Planning(非Process)、C O是Organizing(非Output)、D D是Directing(非Development)。故A。","options":{"A":"正確(本題答案)。R代表Reporting(報告)。","B":"P是Planning,非Process。","C":"O是Organizing,非Output。","D":"D是Directing,非Development。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"113180-N2-39":{"quick":"標準化、獎懲達成目標、注重工作績效=泰勒(科學管理)。","detail":{"background":"泰勒被稱為科學管理之父,主張以時間動作研究找出最有效率的作業方式並加以標準化,再配合適當分工、訓練與按件計酬的獎懲制度來提升績效,把工作方法與產出量化是其核心。費堯提出管理程序與十四項管理原則,關注的是整體行政管理;韋伯提出科層體制,強調層級節制與依法行事;大內提出 Z 理論,強調長期僱用與全員參與。題幹兼具標準化、獎懲與績效三項特徵。科學管理帶來效率與一致性,卻也被批評把人視為機器而忽略動機,後續的行為科學學派正是針對此一缺口而生。故選 B。","options":{"A":"費堯是行政管理五功能。","B":"正確(本題答案)。標準化獎懲績效=泰勒科學管理。","C":"韋伯是官僚理論。","D":"大內是Z理論。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"114030-N2-38":{"quick":"管理理論:管理科學學派主張運用數學計量處理問題、效益用數字表示。","detail":{"background":"管理理論:D「管理科學學派主張運用數學計量處理問題,所有效益都用數字表示」正確(作業研究、量化分析)。A修正vs傳統差異須對應(參與式決策團體價值是Z理論特徵);B「行為科學學派以日本Z理論最具代表」錯(Z理論屬現代/系統,非行為科學);C「管理程序學派以戴明為代表」錯(管理程序學派代表是費堯,戴明是品質管理)。故D。","options":{"A":"參與式決策團體價值是Z理論特徵。","B":"Z理論非行為科學學派代表。","C":"管理程序學派代表是費堯,非戴明。","D":"正確(本題答案)。管理科學學派用數學計量。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"114100-N2-24":{"quick":"影響體溫:新陳代謝速率增加會使體溫「上升」非下降;稱代謝增加體溫下降為錯誤。","detail":{"background":"影響體溫因素(本題歸管理站但屬生理):B老年人皮下脂肪薄、體溫較低(對);C女性排卵後黃體素使體溫升高(對);D晝夜節律傍晚4~8時體溫較清晨高(對)。選項A「新陳代謝速率增加會造成體溫下降」錯誤——代謝增加產熱增加、體溫上升,故A為錯誤(本題答案)。","options":{"A":"錯誤(本題答案)。代謝增加體溫上升,非下降。","B":"正確。老年人皮下脂肪薄體溫較低。","C":"正確。排卵後黃體素使體溫升。","D":"正確。傍晚體溫比清晨高。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"114170-N2-36":{"quick":"病房會議組成小組進行護理改善專案=Z理論(全員參與)。","detail":{"background":"Z 理論由 Ouchi 提出,強調以團體價值觀與信任為基礎,採取全員參與、集體決策與長期培育,品管圈與護理改善專案正是其在臨床的具體展現:由基層人員自行發現問題、組成小組並提出改善方案,主管則提供資源與支持。X 理論以監督與懲罰驅動;Y 理論強調人會自我實現而給予自主;至於所謂 L 理論並非管理學的標準分類。專案能否成功,關鍵在於主管是否提供時間與資源,並讓成員看見改善成果,否則參與很快會流於形式。故選 C。","options":{"A":"X理論是監督獎懲。","B":"Y理論是個人自發。","C":"正確(本題答案)。全員參與專案=Z理論。","D":"L理論非標準理論。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"115030-N2-40":{"quick":"Gillies管理五步驟「規劃」包括=制定標準(3)+擬定政策(4)+作成決策(5)+編列預算(6)。本題答案C「3456」。","detail":{"background":"本題官方答案「3456」。Gillies(季麗絲)護理管理五大步驟:規劃→組織→人事→領導→控制。其中「規劃(planning)」內容包括:3制定標準、4擬定政策、5作成決策、6編列預算(規劃面的政策標準預算決策)。選項1「設定評估內容」、2「做好工作設計」偏組織/控制面。故規劃含「3456」。","options":{"A":"1234含工作設計(組織面)不符。","B":"2345不符。","C":"正確(本題答案,3456)。制定標準、擬政策、作決策、編預算。","D":"1256不符。"},"sources":["新文京《護理行政》管理理論","華杏《護理行政學》管理學派與功能"]}},"101030-N2-57":{"quick":"培訓關懷特質=願意花時間了解、設身處地為他解決(身教關懷)。","detail":{"background":"關懷是護理的核心價值,不是靠讀書或聽演講就能習得的知識,而是在人際互動中被關懷的經驗內化而來。培訓新人的關懷特質,最有效的是資深者以身作則:願意花時間傾聽他遇到的困難、設身處地協助解決,讓新人親身體會被關懷的感受,再把這份經驗轉移到病人身上。嚴格督導技術可提升技能卻與情意態度無關,書籍與研習會屬認知層面的傳遞,難以真正改變態度。因此培育情意態度的方法必須是體驗式與示範式的,而不是單向的知識灌輸。故選 C。","options":{"A":"嚴格督導難培養關懷。","B":"寫心得偏知識。","C":"正確(本題答案)。花時間了解、設身處地=身教關懷。","D":"演講研習偏知識傳遞。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"101030-N2-59":{"quick":"激勵溝通、支持部屬意見、帶來創新=轉換型領導。","detail":{"background":"轉換型(轉型)領導(transformational):以激勵、願景、個人魅力提升部屬、帶來創新與超越期望。「以激勵方式溝通、支持部屬意見、為組織帶來創新」=轉換型(B正確)。交易型(賞罰交換)、分享型、魅力型(個人魅力但未必創新)皆非最佳。故轉換型(B)。","options":{"A":"交易型是賞罰交換。","B":"正確(本題答案)。激勵創新=轉換型領導。","C":"分享型非此。","D":"魅力型偏個人魅力。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"101030-N2-73":{"quick":"腦力激盪提解決方法=民主式領導。","detail":{"background":"領導型態依決策權集中的程度可分幾類:權威式由主管單獨決定並下達命令;民主式讓部屬參與討論,主管彙整意見後形成決策,腦力激盪即是典型作法;放任式把決定完全交給部屬,主管不介入;說服式則是主管先做成決定,再設法說服部屬接受。護理長邀集護理師以腦力激盪提出解決方案,屬於邀請部屬共同參與決策。民主式領導的優點是提高承諾與滿意度並能集思廣益,缺點是決策耗時,遇到緊急情境仍需改採較集中的決策方式。故選 B。","options":{"A":"權威式是主管獨斷。","B":"正確(本題答案)。腦力激盪參與=民主式領導。","C":"放任式是不干預。","D":"說服式是說服接受。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"101030-N2-79":{"quick":"以精力充沛、能力強等條件甄選=特性(屬性)理論。","detail":{"background":"特性(屬性/特質)理論(Trait Theory):認為領導者具備某些先天特質(精力充沛、表達能力強、聰明、人際好)。以「個人特質條件」甄選領導者=特性理論(B正確)。管理方格(關心生產/員工)、情境理論(因情境)、期望模式皆非以特質為依據。故特性理論(B)。","options":{"A":"管理方格理論是關心生產/員工。","B":"正確(本題答案)。以個人特質甄選=特性理論。","C":"情境理論是因情境調整。","D":"期望模式理論非此。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"101110-N2-60":{"quick":"親自教導說明醫院評鑑=專技(專家)影響力。","detail":{"background":"護理長對評鑑內容比同仁清楚,親自教導與說明,靠的是自己的專業知識與經驗使同仁信服,屬專技或專家影響力。法統影響力來自職位所賦予的正式權限,例如要求出席會議;獎酬影響力以獎金或排班便利等好處為誘因;脅迫影響力則以處分為後盾。判斷的關鍵在於對方接受的理由是專業內容本身,而不是職位或利害關係。主管在不同情境會交替使用不同來源的影響力,教學與指導場合以專業為主,規範出勤與排班則多倚賴職位所賦予的權限。故選 A。","options":{"A":"正確(本題答案)。親自教導專業=專技(專家)影響力。","B":"法統是職位權力。","C":"獎酬是給予報酬。","D":"脅迫是懲罰威脅。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"101110-N2-72":{"quick":"危機處理「錯誤」=要讓全體員工共同參與(危機應由核心小組快速決策)。","detail":{"background":"危機發生時處理:領導者與部屬充分溝通(對)、運用80-20法則(對,聚焦關鍵)、組織內部運作紮實是預防危機第一步(對)。選項A「要讓全體員工共同參與」錯誤(本題答案)——危機處理講求「時效、由核心應變小組快速決策指揮」,不宜全員參與(耗時混亂)。故A。","options":{"A":"錯誤(本題答案)。危機應核心小組快速決策,非全員參與。","B":"正確。領導者與部屬充分溝通。","C":"正確。運用80-20法則。","D":"正確。內部運作紮實預防危機。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"101110-N2-73":{"quick":"低成熟度員工「最不適當」=授權型(低成熟者需指導非授權)。","detail":{"background":"Hersey-Blanchard情境領導:依員工成熟度配領導型態——低成熟(M1)用「告知型(telling,高任務低關係)」、低中(M2)用「銷售/推銷型(selling)」、中高(M3)用「參與型(participating)」、高(M4)用「授權型(delegating)」。對「低或低到中成熟度」員工,最不適當的是「授權型」(C正確,授權適用高成熟者)。故C。","options":{"A":"告知型適用低成熟度。","B":"參與型適用中高成熟度(本題問最不適當為授權)。","C":"正確(本題答案)。授權型適用高成熟度,對低成熟最不適當。","D":"銷售型適用低中成熟度。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"101110-N2-79":{"quick":"設挑戰目標激勵達成績效=途徑目標理論。","detail":{"background":"途徑(路徑)目標理論(House):領導者為部屬釐清達成目標的途徑、設定挑戰性目標、提供支持以激勵績效(成就導向型)。「針對有潛力者設挑戰性目標、激勵達成績效」=途徑目標理論(A正確)。特質理論、情境模式、管理方格皆非。故途徑目標理論(A)。","options":{"A":"正確(本題答案)。設挑戰目標激勵績效=途徑目標理論。","B":"特質理論是先天特質。","C":"情境模式是因成熟度。","D":"管理方格是關心生產/員工。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"102030-N2-61":{"quick":"高關心生產低關心員工(9,1)=職責(權威服從)管理。","detail":{"background":"Blake-Mouton管理方格(X軸關心生產、Y軸關心員工):(1,1)放任/無為、(1,9)鄉村俱樂部(高員工低生產)、(9,1)職責/權威服從(高生產低員工)、(5,5)中庸、(9,9)團隊管理。「高關心生產、低關心員工(9,1)」=職責管理(C正確)。故C。","options":{"A":"團隊管理是(9,9)。","B":"放任管理是(1,1)。","C":"正確(本題答案)。(9,1)=職責(權威服從)管理。","D":"鄉村俱樂部是(1,9)。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"102030-N2-73":{"quick":"參與式領導缺點=因個人對工作需求而影響決策。","detail":{"background":"參與式領導讓部屬共同參與決策,能提高工作滿意度與自尊感,也能培養獨立思考的能力,因此以降低滿意度、降低獨立思考或降低自尊感來描述其缺點都與事實相反。它真正的限制在於決策過程較費時,且參與者往往從自身工作立場出發,個人的需求與偏好會滲入討論而左右結論,使決策未必符合整體最佳利益;若成員能力或資訊不足,共同決策的品質反而不如專業判斷。因此參與式適合用在需要眾人配合、且成員具備相關經驗的議題,緊急或高度專業的決策仍應由主管承擔。故選 C。","options":{"A":"參與式提升滿意度,非降低。","B":"參與式促進獨立思考。","C":"正確(本題答案)。個人需求影響決策是參與式缺點。","D":"參與式提升自尊,非降低。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"102110-N2-60":{"quick":"依員工成熟度調整=情境理論。","detail":{"background":"情境理論(Situational theory,Hersey-Blanchard):領導型態依「員工成熟度」調整(告知/銷售/參與/授權)。「依員工成熟度作調整」=情境理論(A正確)。需求理論、方格理論、屬性理論皆非以成熟度為核心。故情境理論(A)。","options":{"A":"正確(本題答案)。依員工成熟度調整=情境理論。","B":"需求理論是激勵。","C":"方格理論是關心生產/員工。","D":"屬性理論是先天特質。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"102110-N2-68":{"quick":"大量傷患緊急命令派員=集權式領導。","detail":{"background":"領導方式依決策參與的程度區分:集權式由主管單獨決定並直接下達指令,速度最快;參與式與民主式先徵詢意見再形成決策;放任式則把決定權完全交給部屬。醫院啟動大量傷患機制時必須在最短時間內完成人力調度,督導直接指定至少派出一名護理師並重新分配病房工作,過程並未經過討論,屬於決策集中的作法。這類情境題的判斷關鍵在於有沒有徵詢與討論的過程:凡是直接命令、指定人數並重新分配工作的,即屬集權式。故選 A。","options":{"A":"正確(本題答案)。緊急命令派員=集權式領導。","B":"參與式耗時不適危機。","C":"放任式是不干預。","D":"民主式耗時不適危機。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"103030-N2-61":{"quick":"剛畢業新進護理師(低成熟)=指導(告知)式。","detail":{"background":"Hersey 與 Blanchard 的情境領導理論依部屬的能力與意願分為四種成熟度,並對應四種領導方式:能力與意願皆低者採告知或指導式,給予明確指示與嚴密督導;有意願但能力不足者採推銷式,一面指導一面說明理由;有能力但缺乏信心者採參與式,提供支持與共同決策;能力與意願皆高者採授權式。剛畢業的新人屬第一類。情境領導的核心在於領導方式沒有絕對優劣,而應隨部屬成熟度調整;同一位護理師在不同任務上,可能需要不同的領導方式。故選 A。","options":{"A":"正確(本題答案)。低成熟新人用指導(告知)式。","B":"參與式適用中高成熟。","C":"銷售式適用低中成熟。","D":"放任式適用高成熟。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"104030-N2-73":{"quick":"個人魅力、建立願景、激勵部屬更努力=轉換型領導。","detail":{"background":"轉換型領導強調領導者以個人魅力與典範作用取得認同,提出具感染力的願景,並透過智識啟發與個別關懷,提升部屬的動機層次,使其超越自身利益而為共同目標努力。交易型領導則建立在交換關係上,以獎酬與例外管理換取部屬達成既定要求;情境領導依部屬成熟度調整方式;分享型領導把領導功能分散於團隊成員。題幹強調魅力、願景與激勵,指向的是提升而非交換。實務上兩者並非互斥,優秀的護理主管多以交易型建立基本秩序,再以轉換型帶動改變與成長。故選 D。","options":{"A":"情境領導是因成熟度。","B":"交易型是賞罰交換。","C":"分享型非此。","D":"正確(本題答案)。魅力願景激勵=轉換型領導。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"104030-N2-75":{"quick":"部屬忠誠支持程度=權變理論(費德勒)的情境因素。","detail":{"background":"費德勒(Fiedler)權變理論三情境因素:領導者與部屬的關係(部屬的忠誠支持)、工作結構、職位權力。「領導者感受到部屬的忠誠及支持程度」=權變理論的情境因素(領導者-部屬關係)(A正確)。特質、行為、管理方格理論皆非以情境因素分析。故權變理論(A)。","options":{"A":"正確(本題答案)。部屬忠誠支持=權變理論情境因素。","B":"特質理論是先天特質。","C":"行為理論是領導行為。","D":"管理方格是關心生產/員工。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"104030-N2-76":{"quick":"第五級領導「不」含逆境歸咎運氣(第五級領導逆境反躬自省、成功歸功他人)。","detail":{"background":"柯林斯第五級領導特質:謙沖為懷的個性(對)、將個人名利置之度外以組織成功為念(對)、妥善安排接班計畫(對)。選項B「在逆境中會歸咎於運氣不好」不屬第五級領導(本題答案)——第五級領導「成功歸功他人/運氣,失敗反躬自省(窗與鏡)」,逆境不諉過於運氣。故B。","options":{"A":"第五級領導謙沖為懷。","B":"正確(本題答案)。逆境諉過運氣非第五級領導(應反躬自省)。","C":"第五級領導置個人名利於度外。","D":"第五級領導妥善安排接班。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"104030-N2-77":{"quick":"費德勒權變「不」含溝通模式(三情境=工作結構、職位權力、領導者部屬關係)。","detail":{"background":"Fiedler 的權變理論主張領導效能取決於領導風格與情境的配合,情境的有利程度由三個因素決定:領導者與部屬的關係是否融洽信任、工作結構是否明確有例可循,以及領導者的職位權力是否足以獎懲部屬。三者皆佳時情境最有利,適合任務導向的領導者;三者皆差時同樣適合任務導向;居中的情境則適合關係導向。溝通模式並不在這三個情境因素之列。Fiedler 主張領導風格相對固定,難以任意改變,因此提升效能的途徑是調整情境或換人,而不是要求領導者改變性格。故選 C。","options":{"A":"工作結構是費德勒情境因素。","B":"職位權力是費德勒情境因素。","C":"正確(本題答案)。溝通模式非費德勒情境因素。","D":"領導者部屬關係是費德勒情境因素。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"104030-N2-78":{"quick":"兩位資淺護理師需處理10病人=告知型(明確指導)。","detail":{"background":"Hersey-Blanchard情境領導:兩位資歷淺(低成熟度、能力意願不足)護理師面對突來10位病人求救,應採「告知型(telling)——給予明確指導告知該做什麼、如何做」(D正確)。授權型、參與型、推銷型適用較高成熟度。故告知型(D)。","options":{"A":"授權型適用高成熟。","B":"參與型適用中高成熟。","C":"推銷型適用低中成熟。","D":"正確(本題答案)。資淺需明確指導=告知型。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"104100-N2-60":{"quick":"精力充沛具影響力自控判斷力受愛戴=屬性(特質)理論。","detail":{"background":"領導理論的發展依序為特質論、行為論與權變論。屬性或特質理論主張領導者具備某些與生俱來或長期養成的人格特質,例如精力充沛、情緒穩定、判斷與決策能力佳、具影響力,因而能贏得追隨者。題幹整段描述的都是這位護理長的個人特質,而非她在特定情境下採取什麼作為。情勢與情境理論強調領導方式須隨部屬成熟度或環境調整;目標理論則探討領導者如何為部屬鋪路以達成目標。特質論的限制在於,具備這些特質的人未必都能成為有效的領導者,因此後續才發展出行為論與權變論。故選 A。","options":{"A":"正確(本題答案)。個人特質受愛戴=屬性(特質)理論。","B":"情勢理論是因情境。","C":"目標理論是途徑目標。","D":"情境理論是因成熟度。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"104100-N2-73":{"quick":"請督導協助護理長完成中心工作目標=授權(delegation)。","detail":{"background":"授權是主管把自己職權範圍內的特定任務連同必要的權限交付給部屬執行,自己仍保留最終責任並持續追蹤。護理部主任把年度中心工作目標的執行交由督導協助各護理長完成,即屬此類。賦權著重的是提升成員的自主感與能力,讓其相信自己有能力影響工作,屬長期的能力建構;決策是選擇方案的行為;控制則是比較實際與標準並加以修正。題幹強調的是把任務交付下去執行。授權時應明確交代任務範圍、可動用的資源與回報時點,並避免只授責任而不給權限。故選 A。","options":{"A":"正確(本題答案)。將任務委派下級=授權(delegation)。","B":"賦權是給予能力自主。","C":"決策是做決定。","D":"控制是管制。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"104100-N2-77":{"quick":"以身作則關懷病人帶動人員=榜樣影響力。","detail":{"background":"榜樣或參考影響力來自個人特質與行為所引發的認同,他人因為欣賞而自願模仿,過程中不需要任何指令或獎懲。護理長查房時以關懷的態度對待病人,護理人員看在眼裡而自然跟著這麼做,正是身教的效果。專技影響力來自專業知識被信服,通常伴隨教導與說明;獎酬影響力以好處為誘因;知識與資訊影響力則來自掌握他人需要的訊息。身教式的影響力最為持久,但也意味著主管的任何負面示範同樣會被複製,因此領導者的自我覺察格外重要。故選 B。","options":{"A":"專技是專業知識。","B":"正確(本題答案)。以身作則被效法=榜樣影響力。","C":"知識影響力非此。","D":"獎酬是給予報酬。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"104100-N2-78":{"quick":"失火緊急通知回院搬移病人=權威式領導。","detail":{"background":"權威式領導由主管單獨決定並直接下達命令,不經討論,優點是反應快速、指揮明確,適合火災、大量傷患等必須即刻行動的緊急情境。護理部主任在醫院失火時逕行通知宿舍人員回院、要求各單位派員支援,沒有徵詢意見的過程,即屬此類。民主式與參與式都需要討論與彙整意見,放任式則把決定交給部屬,在必須爭取時間的災害現場都不適用。值得注意的是,災害應變之所以能迅速下令,前提是平時已有演練與應變計畫,否則命令再快也難以執行。故選 A。","options":{"A":"正確(本題答案)。失火緊急命令=權威式領導。","B":"民主式耗時不適危機。","C":"放任式是不干預。","D":"參與式耗時不適危機。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"104100-N2-80":{"quick":"「我很忙改天再談」排班衝突=逃避。","detail":{"background":"逃避是對自己與他人的關心程度都低的處理方式,表現為拖延、轉移話題或宣稱以後再談,使議題暫時被擱置。護理長以現在很忙、改天再談回應兩位護理師的排班爭執,即屬此類;若真正原因是需要時間了解狀況,應同時約定具體的談話時間,否則只是把問題往後推。順應是一方讓步,妥協是雙方各退一步,協同合作則是共同尋求雙贏方案。排班爭議往往牽涉制度公平性,長期迴避會累積為對主管的不信任,並可能演變成離職原因。故選 A。","options":{"A":"正確(本題答案)。改天再談=逃避。","B":"順應是成全他人。","C":"妥協是各退一步。","D":"協同合作是雙贏。"},"sources":["新文京《護理行政》衝突管理","華杏《護理行政學》衝突處理"]}},"105030-N2-77":{"quick":"培育有潛能未來領導者=成就導向型(路徑目標)。","detail":{"background":"House 的路徑目標理論指出領導者的任務是為部屬清除達成目標的障礙,並依部屬特質與工作環境選擇領導型態:指導型適合工作結構不明或部屬經驗不足者;支援型適合工作枯燥或部屬壓力大時;參與型適合部屬具備能力且希望自主參與時;成就導向型則為部屬設定具挑戰性的目標並表達高度期待與信任,最適合能力佳、成就動機強、具發展潛能的人。這也提醒主管,對新人與對資深具潛力者不宜使用同一套領導方式,否則不是壓力過大就是無法成長。故選 C。","options":{"A":"指導型適用任務不明者。","B":"參與型適用需參與感者。","C":"正確(本題答案)。培育潛力領導者=成就導向型。","D":"支援型適用需支持者。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"105030-N2-78":{"quick":"工作完成後邀同仁慶功歡唱=獎酬影響力。","detail":{"background":"獎酬影響力來自掌握他人期待的資源並用以肯定其付出,形式不限於金錢,公開表揚、優先排休、聚餐慶功等都算在內。護理長在工作完成後邀同仁慶功歡唱,是以正向回饋強化團隊的努力,屬此類。法統影響力來自職位所賦予的權限;資料或資訊影響力來自掌握他人需要的訊息;專技影響力則來自專業能力被信服,三者都與提供獎勵無關。獎酬影響力的限制在於資源有限且效果短暫,若長期只靠獎勵驅動,一旦停止給予,行為往往隨之消退。故選 B。","options":{"A":"法統是職位權力。","B":"正確(本題答案)。慶功歡唱獎勵=獎酬影響力。","C":"資料是資訊權。","D":"專技是專業知識。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"105090-N2-73":{"quick":"增加權力「錯誤」=權力最重要在於互斥關係(權力在於互賴非互斥)。","detail":{"background":"個人在組織中的權力,來自他人對自己的依賴程度。對單位需求具敏感度,能在關鍵時刻提供協助,會使自己顯得重要;具備他人沒有的能力,或持續強化專業知識與技能,則提高不可取代性,兩者都能增加影響力。權力的本質是一種相互依存的關係,而非互斥:一方擁有權力並不必然使另一方失去權力,團隊中反而常見成員各自在不同專業面向上互相依賴。因此增加個人權力的正途是提升專業能力與能見度,而不是囤積資訊或排擠他人,後者短期或許有效,長期會折損信任。故選 D。","options":{"A":"對需求敏感增加重要性。","B":"獨特能力增加依賴性。","C":"強化專業增加不可取代性。","D":"正確(本題答案)。權力在於互賴,非互斥。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"105090-N2-74":{"quick":"協助成員提升自我效能與自我管理=賦權(empowerment)。","detail":{"background":"賦權型領導的核心是提升成員的自我效能與自我管理能力:領導者提供資訊與資源、給予自主決定的空間、表達信任並肯定其能力,使成員相信自己有能力影響工作結果,進而主動承擔。轉型領導雖也重視提升部屬,但其重點在願景與魅力所帶動的動機轉化;道德領導強調以倫理與價值為核心;策略領導著眼於組織長期方向的擘劃。題幹明白指出自我效能與自我管理。賦權的實際作法包括讓護理師主導單位的品質專案、參與排班規則的訂定,並在犯錯時把焦點放在流程改善而非究責。故選 A。","options":{"A":"正確(本題答案)。提升自我效能自我管理=賦權。","B":"道德領導重倫理。","C":"轉型領導重願景激勵。","D":"策略領導重策略。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"105090-N2-75":{"quick":"藉角色澄清與工作要求引導激勵=交易型領導。","detail":{"background":"交易型領導(transactional):藉「角色澄清、工作要求、賞罰交換(達標給獎)」引導激勵員工。題幹「藉角色澄清與工作要求引導激勵」=交易型(B正確)。魅力領導、轉換型(願景激勵超越)、參與式皆非「角色澄清+工作要求」。故交易型(B)。","options":{"A":"魅力領導重個人魅力。","B":"正確(本題答案)。角色澄清工作要求=交易型領導。","C":"轉換型重願景激勵超越。","D":"參與式重共同決策。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"105090-N2-76":{"quick":"轉換型領導「不」含生產力(構成=魅力影響、啟發、激勵、個別關懷)。","detail":{"background":"轉換型領導四構成要素(4I):理想化影響力(idealized influence/魅力)、啟發激勵(inspirational motivation)、智能啟發(stimulation)、個別關懷(individualized consideration)。選項A「生產力(productivity)」不屬轉換型領導構成要素(本題答案)。故A。","options":{"A":"正確(本題答案)。生產力非轉換型領導要素。","B":"影響力是轉換型要素。","C":"啟發力是轉換型要素。","D":"激勵是轉換型要素。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"105090-N2-77":{"quick":"情境領導最關鍵要素=員工的成熟度。","detail":{"background":"Hersey-Blanchard情境領導理論中,領導行為判斷「最關鍵」的要素是「員工的成熟度(maturity/readiness)」(B正確)——依成熟度高低決定告知/銷售/參與/授權。上下溝通、主管直覺、組織型態皆非最關鍵。故員工成熟度(B)。","options":{"A":"上下溝通非最關鍵。","B":"正確(本題答案)。情境領導最關鍵=員工成熟度。","C":"主管直覺非依據。","D":"組織型態非最關鍵。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"105090-N2-78":{"quick":"新人求助改善知識技能:護理長用專家權影響。","detail":{"background":"新進護理師主動找主管討論自己在知識與技能上有哪些需要改善,此時他所需要的是專業上的指引,主管能發揮作用的基礎在於自身的臨床經驗與判斷被信服,屬專家權。強制權以處分為後盾,用在此處只會讓求助者退縮;合法權來自職位,適用於指派工作而非教學;資訊權來自掌握他人需要的訊息,與臨床能力的傳授不同。主管此時的任務是共同盤點落差並訂出可行的學習計畫。此時若能同時肯定他主動求助的態度、檢視工作量是否合理,並安排臨床教師陪伴,對留任的幫助遠大於單純的技術指導。故選 B。","options":{"A":"強制權是懲罰威脅。","B":"正確(本題答案)。以專業指導=專家權。","C":"合法權是職位。","D":"資訊權是掌握資訊。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"106030-N2-77":{"quick":"頒「進步小天使」獎=獎勵權。","detail":{"background":"獎勵權來自主管掌握他人期待的資源,並以此肯定其表現,形式包含獎項、獎金、公開表揚與發展機會。護理長輔導新進護理師,並在其進步後頒予獎項,是以正向回饋強化學習行為,屬獎勵權的運用。強制權以處分為後盾;專家權來自專業能力被信服,較常出現在教導的當下;合法權則來自職位所賦予的指派權限。判斷關鍵在於影響力的來源是給予了什麼。同一位主管在不同時點可能交替使用不同權力,輔導過程倚賴專業說服,頒獎則轉為獎勵,兩者相輔相成。故選 D。","options":{"A":"強制權是懲罰。","B":"專家權是專業知識。","C":"合法權是職位。","D":"正確(本題答案)。頒獎=獎勵權。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"106030-N2-74":{"quick":"對部屬友善關心需求作決策參考=支持型(路徑目標)。","detail":{"background":"路徑目標理論列出四種領導行為:指導型明確告知該做什麼與怎麼做,適合工作結構不明或部屬經驗不足時;支持型對部屬十分友善、關心其需求與福祉,營造和諧的工作氣氛,適合工作枯燥或壓力大時;參與型徵詢部屬意見並納入決策;成就導向型設定具挑戰性的目標並表達高度期待。題幹強調對部屬友善並關心其需求,屬於著眼於人的支持行為。四種行為並非固定不變,同一位主管可依部屬狀態與工作性質交替使用,理論的重點在於配適而非何者最佳。故選 B。","options":{"A":"指導型是明確任務。","B":"正確(本題答案)。友善關心需求=支持型。","C":"參與型是共同決策。","D":"成就型是挑戰目標。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"106110-N2-74":{"quick":"管理方格理論「錯誤」=X軸是領導者對員工的關心程度(X軸應為對生產的關心)。","detail":{"background":"Blake管理方格理論:以X軸(對生產/工作的關心)、Y軸(對員工/人員的關心)標出五種領導行為(對)、屬行為理論(對)、依方格位置發展合適領導(對)。選項A「X軸是領導者對員工的關心程度」錯誤(本題答案)——X軸應為對「生產(工作)」的關心,Y軸才是對員工的關心。故A。","options":{"A":"正確(本題答案)。X軸是對生產的關心,非對員工。","B":"正確。X、Y軸標出五種領導行為。","C":"正確。屬行為理論觀點。","D":"正確。依方格位置發展合適領導。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"106110-N2-75":{"quick":"氣爆院長現場坐鎮命令指派=集權式領導。","detail":{"background":"領導統御型態依決策權的集中程度區分:集權式由主管單獨決策並直接下達命令,反應最快;民主式與參與式先徵詢意見再形成決策;放任式則把決定權交給部屬。氣爆造成大量傷患的凌晨,院長親自到場坐鎮,直接命令各急救區負責人分工並指派資深人員照護原有病人,全程沒有討論與徵詢,是為爭取時效而採取的集中指揮。Douglass 的分類與一般領導型態的分法一致,判斷關鍵在於有沒有徵詢與討論的過程;災害現場的集中指揮屬短期權宜,事件結束後仍應回到平時的參與式運作。故選 A。","options":{"A":"正確(本題答案)。氣爆現場坐鎮命令=集權式領導。","B":"民主式耗時不適危機。","C":"放任式是不干預。","D":"參與式耗時不適危機。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"106111-N2-78":{"quick":"醫院評鑑請護理長主動選擇負責部分=參與式領導。","detail":{"background":"參與式領導讓成員在決策過程中表達意見並自行認領工作,主管保留最終整合與把關的角色。評鑑準備涉及各單位的專長與現況,請每位護理長主動選擇負責的部分,既能發揮專長也能提高承諾度,屬此類。放任式是完全不介入、任其發展;權威式由主管直接分派;說服式則是主管先決定再說明理由爭取同意。判斷關鍵在於決定權有沒有真正開放給成員。參與式在準備期最能凝聚共識,但接近評鑑日程時,仍需轉為較明確的分工與進度控管,以確保如期完成。故選 A。","options":{"A":"正確(本題答案)。主動選擇負責=參與式領導。","B":"放任式是完全不管。","C":"權威式是指派命令。","D":"說服式是說服接受。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"106111-N2-79":{"quick":"管理者vs領導者:管理者權力來自職權、領導者權力來自個人特質。","detail":{"background":"管理者與領導者比較:B「管理者的權力來自職權(職位),而領導者的權力來自個人特質(影響力)」正確。A顛倒(創新是領導者、維持平衡是管理者);C「管理者突出、領導者配合」顛倒(領導者突出);D「管理者重互動、領導者重結果」顛倒(管理者重結果/把事做對、領導者重做對的事/願景)。故B。","options":{"A":"創新是領導者,維持平衡是管理者(A顛倒)。","B":"正確(本題答案)。管理者權力來自職權、領導者來自特質。","C":"領導者較突出(C顛倒)。","D":"管理者重結果、領導者重願景(D顛倒)。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"107030-N2-75":{"quick":"最能激勵部屬不斷提升自我=轉換型領導。","detail":{"background":"轉換型領導透過願景的描繪、個人魅力的感染、智識上的啟發與個別化的關懷,把部屬的動機由滿足自身需求提升到追求共同目標,並在過程中不斷激勵其精進專業與自我成長,因此最能促使部屬持續提升自我能力。魅力型只強調個人魅力的吸引;交易型以獎懲交換績效,部屬達標即止;獨裁式由主管單方決定,更難帶來自發性的成長。轉換型領導的四個構面常被簡稱為理想化影響、鼓舞激勵、智識啟發與個別關懷,護理主管可透過帶動專案、鼓勵進修與個別生涯對談加以實踐。故選 B。","options":{"A":"魅力型偏個人魅力。","B":"正確(本題答案)。激勵自我提升=轉換型領導。","C":"獨裁式是命令。","D":"交易型是賞罰交換。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"107110-N2-74":{"quick":"民主式領導者較少藉助=職位權威。","detail":{"background":"民主式領導以參與、討論與共識形成決策,倚重的是主管的個人影響力、與成員之間的人際關係,以及充分的溝通協調,讓成員因認同而投入。相對地,職位權威是以職位所賦予的命令與獎懲權迫使部屬服從,屬集權式或權威式領導的主要工具,民主式領導雖仍握有此權,卻盡量少用,以免壓抑成員表達意見的意願。民主式領導的代價是決策較耗時,因此遇到緊急事件時,仍應暫時改用較集中的指揮方式。故選 B。","options":{"A":"民主式藉助影響力。","B":"正確(本題答案)。民主式較少藉助職位權威。","C":"民主式藉助人際關係。","D":"民主式藉助溝通協調。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"108020-N2-74":{"quick":"要求穿戴制服識別證=合法權。","detail":{"background":"合法權或法職權來自職位所賦予的正式權限,部屬因為承認這個職位有權作此要求而配合,不需要額外的獎勵或威脅。主管要求上班時穿著規定制服並配戴識別證,依據的是機構的服儀規範與感染管制、身分辨識的需要,屬於職務範圍內的正當要求。資訊權來自掌握他人需要的訊息;強制權以處分為後盾;專家權則來自專業能力被信服,三者都不是此處配合的理由。合法權的效力止於職務範圍,若要求超出工作相關的事項,即使主管有職位,部屬也未必有配合的義務。故選 C。","options":{"A":"資訊權是掌握資訊。","B":"強制權是懲罰。","C":"正確(本題答案)。依職位要求=合法權。","D":"專家權是專業知識。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"108020-N2-77":{"quick":"請同仁票選最優良護理人員=民主式領導。","detail":{"background":"民主式領導把決定權開放給成員,以討論或投票形成共識,主管尊重多數意見並負責整合。護理長請單位同仁票選最優良護理人員,由團體共同決定人選,即屬此類,其優點是結果的接受度高、參與感強。參與式雖也徵詢意見,但最終仍由主管拍板;放任式是主管完全不介入;權威式則由主管逕行指定。判斷關鍵在於最後由誰做出決定。民主式的限制在於決策較耗時,且票選結果可能受人緣影響,因此重要的評選仍宜輔以客觀指標。故選 C。","options":{"A":"參與式相近但票選典型為民主。","B":"放任式是不管。","C":"正確(本題答案)。票選=民主式領導。","D":"權威式是命令。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"108110-N2-76":{"quick":"以組織目標激勵、激發才智、感覺被尊重=轉換型領導。","detail":{"background":"轉換型領導以組織願景與價值感召部屬,透過鼓舞激勵提振士氣、以智識啟發激發才智與創新,並以個別關懷讓成員感到被尊重與認同,使其動機由個人利益提升為共同目標。交易型領導以獎懲交換績效;魅力型只強調領導者個人特質的吸引力,未必伴隨智識啟發與個別關懷;分享型則把領導功能分散於團隊成員。題幹同時出現激勵、激發才智與被尊重認同三個要素。轉換型與交易型並非互斥,實務上主管多以交易型維持基本秩序,再以轉換型帶動改變與專業成長。故選 A。","options":{"A":"正確(本題答案)。激勵才智被尊重=轉換型領導。","B":"交易型是賞罰交換。","C":"魅力型偏個人魅力。","D":"分享型非此。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"109110-N2-61":{"quick":"權變理論:調整內部結構須同時考慮組織外在因素。","detail":{"background":"權變理論(contingency):C「調整組織內部結構時,必須同時考慮組織的外在因素(環境)」正確——沒有最好的管理方式,須因應內外情境調整。A「氛圍不受領導風格影響」錯;B「動盪環境就無法達標」錯;D「不能用不同管理方式」錯(權變正是用不同方式)。故C。","options":{"A":"氛圍受領導風格影響。","B":"動盪環境仍可達標。","C":"正確(本題答案)。調整結構須考慮外在因素。","D":"權變正是用不同方式。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"109110-N2-75":{"quick":"管理方格理論最關鍵要素=關心部屬及工作。","detail":{"background":"Blake 與 Mouton 的管理方格以兩個構面描繪領導行為:對工作或生產的關心,以及對員工或人員的關心,各以一到九分計,交叉出無為型、鄉村俱樂部型、任務型、中庸型與團隊型,並以兩者皆高的團隊型為理想。它的核心主張是關心事與關心人並非互斥,可以同時提高。至於部屬成熟度是情境領導的變項,激勵與領導者行為則過於籠統,都不是方格的構面。方格理論的價值在於提醒主管檢視自己的偏向:只顧績效容易造成人員流失,只顧和諧則放任品質下滑。故選 D。","options":{"A":"增加成熟度是情境理論。","B":"激勵部屬非管理方格構面。","C":"領導者行為過於籠統。","D":"正確(本題答案)。關心部屬及工作是管理方格兩構面。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"110030-N2-72":{"quick":"資淺有意願員工=說明決策並提供澄清機會(銷售/推銷型)。","detail":{"background":"Hersey-Blanchard情境領導:資淺(能力不足)但「有意願」(M2,低中成熟度)→採「銷售/推銷型(selling)——說明決策並提供機會讓同仁澄清疑問」(A正確)。明確命令(告知型,適M1無意願)、協調分享(參與型M3)、讓參與建立SOP(M3)皆非M2最佳。故A。","options":{"A":"正確(本題答案)。資淺有意願(M2)=銷售型(說明並澄清)。","B":"協調分享是參與型(M3)。","C":"明確命令是告知型(M1)。","D":"讓參與建SOP是參與型(M3)。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"111110-N2-61":{"quick":"道格拉斯管理過程=確認需求(1)+現況分析(2)+擬定政策方案(3)?本題答案C「345」。","detail":{"background":"本題官方答案「345」。道格拉斯(Douglass)護理管理過程包括:3擬定政策與方案、4建立護理標準、5(評值/控制等)。選項1「確認基層人員需求」、2「進行現況分析」屬規劃前置但本題正確組合為「345」。核心:Douglass管理過程含政策方案、標準、評值。","options":{"A":"123非官方組合。","B":"234不符。","C":"正確(本題答案,345)。擬政策方案、建標準、評值。","D":"145不符。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"111110-N2-73":{"quick":"心理賦權:向同仁說明專案改善的必要性和意義。","detail":{"background":"Spreitzer心理賦權(psychological empowerment)四構面:意義(meaning)、自我效能(competence)、自主(self-determination)、影響力(impact)。A「護理長向同仁說明專案改善的必要性和意義」=賦予「意義」感(A正確,心理賦權)。B指定圈長、C要求定期回報、D自行協商皆非賦予意義感的賦權。故A。","options":{"A":"正確(本題答案)。說明必要性和意義=心理賦權(意義感)。","B":"指定圈長非賦權意義。","C":"要求回報是控制。","D":"自行協商非賦予意義。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"111110-N2-76":{"quick":"管理與領導:管理者擁有特定的影響力和權力。","detail":{"background":"管理與領導:B「管理者擁有特定的影響力和權力(職權)」正確。A「領導者是組織任命有正式職位」錯(管理者才是組織任命有職位,領導者可非正式);C「領導者把事情做對」錯(管理者把事做對do things right,領導者做對的事do right things);D「管理者引導群體做對的事」錯(顛倒,領導者做對的事)。故B。","options":{"A":"管理者才是組織任命有職位。","B":"正確(本題答案)。管理者擁有影響力和權力。","C":"管理者把事做對,領導者做對的事。","D":"領導者做對的事(D顛倒)。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"112030-N2-77":{"quick":"情境領導依=員工成熟度決定領導型態。","detail":{"background":"Hersey 與 Blanchard 的情境領導理論主張,領導者應依部屬的成熟度亦即工作能力與意願,選擇對應的領導型態:能力與意願皆低者採告知式;有意願但能力不足者採推銷式;有能力但缺乏信心者採參與式;能力與意願皆高者採授權式。因此決定領導型態的關鍵變項是部屬的成熟度,而不是溝通管道、主管的直覺或組織型態。同一位護理師在不同任務上的成熟度可能不同,因此領導方式應隨任務調整,而非對某人固定使用一種方式。故選 B。","options":{"A":"上下溝通非依據。","B":"正確(本題答案)。依員工成熟度決定領導型態。","C":"主管直覺非依據。","D":"組織型態非依據。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"112030-N2-79":{"quick":"依內外環境適度調配帶領達成目標=權變理論。","detail":{"background":"權變理論主張沒有一種放諸四海皆準的最佳管理方式,領導者必須同時考量單位內部的人力、任務性質與外部環境的變化,據以調整工作分派與帶領方式,才能達成共同目標。特質理論與偉人理論著眼於領導者天生具備哪些人格特質;情境理論雖也強調配合情境,但其變項主要是部屬的成熟度。題幹同時提到內部與外部環境的調配,範圍更廣。權變觀點在護理管理上的體現,就是同一套排班或帶人方式未必適用於所有單位,必須依人力結構與病人特性調整。故選 C。","options":{"A":"特質理論是先天特質。","B":"情境理論偏依成熟度。","C":"正確(本題答案)。依內外環境調配=權變理論。","D":"偉人理論非此。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"112110-N2-78":{"quick":"學有專精待人好被諮詢生涯=榜樣影響力。","detail":{"background":"李督導長「學有專精、待人接物頗獲好評」,護理師主動找她諮詢「個人生涯規畫及未來發展」(因敬重其人品典範而效法請益)=榜樣(referent)影響力(C正確)。法統(職位)、強制(懲罰)、專家(專業知識,若諮詢專業技術則是專家權,但此處諮詢生涯發展偏向因敬重其為人典範)。故榜樣影響力(C)。","options":{"A":"法統是職位權力。","B":"強制是懲罰。","C":"正確(本題答案)。因敬重典範請益=榜樣影響力。","D":"專家權偏專業技術指導。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"112110-N2-80":{"quick":"資深技術熟練、交待任務即離去=放任式領導。","detail":{"background":"放任式領導把工作交代之後即不介入,由成員自行決定作法與分工,主管僅在必要時提供資源。當成員技術熟練、資深且動機高時,這種方式能發揮其自主性;但在需要統一調度或成員經驗不足時,容易造成方向不一與責任不清。集權式由主管直接下令,民主式與參與式則需經過討論。題幹中護理長交代任務後即離去,並未參與後續指揮。放任式的風險在於責任界線模糊,因此即使成員資深,主管仍應明確交代分工與回報時點,並在關鍵節點掌握進度。故選 C。","options":{"A":"集權式是命令掌控。","B":"民主式是共同參與。","C":"正確(本題答案)。交待後即離去=放任式領導。","D":"參與式是共同決策。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"113030-N2-48":{"quick":"N1層級指導下可完成=推銷型(selling)。","detail":{"background":"Hersey-Blanchard情境領導:林護理師工作1.5年、「指導下可完成」整體照護、剛晉升N1(低中成熟度M2,有意願但能力仍需支持)→採「推銷/銷售型(selling)——高任務高關係,說明決策並支持」(B正確)。告知型(M1)、參與型(M3)、授權型(M4)皆非M2最佳。故推銷型(B)。","options":{"A":"告知型適用M1(無意願)。","B":"正確(本題答案)。N1指導下可完成(M2)=推銷型。","C":"參與型適用M3。","D":"授權型適用M4。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"113180-N2-50":{"quick":"同時考慮工作結構、領導者成員關係、職位權力=情境(權變)理論。","detail":{"background":"Fiedler 的權變或情境領導理論主張領導效能取決於領導風格與情境是否相配,情境的有利程度由三個因素共同決定:領導者與成員的關係是否融洽信任、工作結構是否明確有例可循,以及職位權力是否足以獎懲部屬。管理方格以關心工作與關心員工兩構面描繪風格;途徑目標理論談的是領導者如何為部屬鋪路;特質理論則著眼於領導者的人格特質。Fiedler 主張領導風格相對固定而難以任意改變,因此提升效能的途徑是調整情境條件,而不是要求領導者改變性格。故選 D。","options":{"A":"管理方格是關心生產/員工。","B":"途徑目標是釐清路徑。","C":"特質理論是先天特質。","D":"正確(本題答案)。三情境因素=情境(權變)理論(費德勒)。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"114100-N2-48":{"quick":"關心業績效率、少關心需求=職責管理式領導(9,1)。","detail":{"background":"Blake-Mouton管理方格:「關心業績、要求達成任務效率,較少關心護理師需求」=職責管理式領導(produce or perish,9,1型,高生產低員工)(B正確)。無為式(1,1)、團隊管理(9,9)、中庸(5,5)皆非。故職責管理式(B)。","options":{"A":"無為式是(1,1)低生產低員工。","B":"正確(本題答案)。高業績低關心=職責管理式(9,1)。","C":"團隊管理是(9,9)。","D":"中庸式是(5,5)。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"114170-N2-46":{"quick":"給予升職加薪正面評價=獎勵權。","detail":{"background":"French 與 Raven 把權力分為幾種來源,獎勵權來自領導者掌握他人期待的資源並用以肯定其付出,形式包括升職、加薪、正面的績效評價、公開表揚與發展機會。專家權來自專業知識與臨床判斷被信服;資訊權來自掌握他人需要的訊息;參考權來自個人特質引發的認同與效法。判斷關鍵在於部屬配合的理由是不是因為可以得到什麼。獎勵權的限制在於資源有限且效果短暫,若長期只靠獎勵驅動,一旦停止給予,行為往往隨之消退。故選 A。","options":{"A":"正確(本題答案)。升職加薪評價=獎勵權。","B":"專家權是專業知識。","C":"資訊權是掌握資訊。","D":"參考權是榜樣典範。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"114170-N2-47":{"quick":"新人求助精進知識技能=專家影響力。","detail":{"background":"新進護理師因無法如期完成工作而延遲下班,主動找主管討論如何精進知識與技能,此時他所尋求的是專業上的指引,主管能發揮作用的基礎在於自身的臨床經驗與判斷被信服,屬專家影響力。強制影響力以處分為後盾,用在此處只會讓求助者退縮;榜樣影響力來自行為示範所引發的認同;法統影響力來自職位所賦予的指派權限,適用於交辦工作而非教學。此時若能同時檢視其工作量是否合理、安排臨床教師陪伴,並肯定其主動求助的態度,對留任的幫助遠大於單純的技術指導。故選 C。","options":{"A":"強制影響力是懲罰。","B":"榜樣影響力是典範效法。","C":"正確(本題答案)。以專業指導技能=專家影響力。","D":"法統影響力是職位。"},"sources":["新文京《護理行政》領導理論","華杏《護理行政學》領導型態與權力"]}},"102030-N2-5":{"quick":"想康復回校與好友打球=愛與歸屬感需求。","detail":{"background":"Maslow 把需求由低而高排成五層:生理需求、安全需求、愛與歸屬感需求、自尊需求、自我實現需求,低層次獲得基本滿足後才會凸顯高層次的需求。住院的國中生希望趕快康復回到學校和好朋友一起打球,渴望的是重新回到同儕團體、被接納與有所歸屬,屬第三層;若他強調的是想被稱讚或證明自己的能力,才落在自尊層次。照護上可依此判斷介入方向,例如安排同儕視訊或病房內的團體活動,會比單純鼓勵他努力復健更貼近他當下的需求。故選 B。","options":{"A":"生理需求是基本生存。","B":"正確(本題答案)。回校與好友互動=愛與歸屬感。","C":"自尊是受尊重肯定。","D":"自我實現是潛能發揮。"},"sources":["新文京《護理行政》激勵理論","華杏《護理行政學》Maslow與Herzberg"]}},"102110-N2-55":{"quick":"人類最高層次需求=自我實現。","detail":{"background":"Maslow 的需求層次由低而高依序為生理、安全、愛與歸屬感、自尊、自我實現。前四層屬匱乏性需求,獲得滿足後動機即下降;最高層的自我實現屬成長性需求,指充分發揮個人潛能、實現理想與價值,永遠沒有完全滿足的一天。護理上可用這個架構排定介入的優先順序,先確保生理與安全,再處理歸屬與自尊。考題常以情境敘述測驗層次判斷:提到吃飯睡眠屬生理,提到怕受傷或工作不保屬安全,提到被團體接納屬愛與歸屬,提到被肯定屬自尊,提到完成理想或發揮所長才是最高層。故選 D。","options":{"A":"生理需求最低層。","B":"愛與歸屬感是第三層。","C":"自尊自重是第四層。","D":"正確(本題答案)。最高層是自我實現。"},"sources":["新文京《護理行政》激勵理論","華杏《護理行政學》Maslow與Herzberg"]}},"103100-N2-69":{"quick":"鼓勵照顧SARS病人=滿足安全需求。","detail":{"background":"Maslow 的需求層次可用來設計激勵措施,關鍵在於辨識當事人此刻最迫切的需求。護理人員面對高傳染性疾病時,最先浮現的是自身與家人是否會被感染的擔憂,屬安全需求;因此提供充足的防護裝備、明確的感控訓練、健康監測與隔離期間的住宿安排,遠比強調榮譽感或團隊歸屬更能提高照顧意願。這也提醒管理者,激勵措施必須對應當下最迫切的需求層次,否則再多的表揚與精神鼓勵也難以奏效。故選 B。","options":{"A":"生理需求非此情境核心。","B":"正確(本題答案)。照顧SARS先滿足安全需求(防護)。","C":"愛與歸屬非首要。","D":"自我實現是高層次。"},"sources":["新文京《護理行政》激勵理論","華杏《護理行政學》Maslow與Herzberg"]}},"104100-N2-58":{"quick":"新病人環境介紹=安全需求。","detail":{"background":"新病人入院時對環境完全陌生,不知道呼叫鈴在哪裡、廁所怎麼走、夜間有沒有人巡視,這種未知本身就是不安的來源。護理師介紹環境與設施、說明作息與緊急呼叫方式,正是在減少不確定並建立可預期感,對應的是安全需求。若是協助進食、如廁與睡眠,才落在生理需求;鼓勵參與病友活動屬愛與歸屬;肯定其自我照顧能力則屬自尊。入院指導做得完整,還能降低跌倒與管路事件的發生,是病人安全的第一道防線。故選 B。","options":{"A":"生理需求是基本生存。","B":"正確(本題答案)。環境介紹=滿足安全需求。","C":"自尊是受尊重。","D":"自我實現是潛能發揮。"},"sources":["新文京《護理行政》激勵理論","華杏《護理行政學》Maslow與Herzberg"]}},"104100-N2-67":{"quick":"晉升行政主管=雙因子理論的「成就」滿足。","detail":{"background":"Herzberg雙因子理論:激勵因子(內在:成就、肯定、工作本身、責任、升遷成長);保健因子(外在:薪資、安全、人際、工作環境)。「晉升為行政主管」=「成就(achievement)」激勵因子(C正確)。薪資、安全、人際皆保健因子。故成就(C)。","options":{"A":"薪資是保健因子。","B":"安全是保健因子。","C":"正確(本題答案)。晉升=成就激勵因子。","D":"人際是保健因子。"},"sources":["新文京《護理行政》激勵理論","華杏《護理行政學》Maslow與Herzberg"]}},"105030-N2-4":{"quick":"子宮切除覺得不像女人=自尊自重需求。","detail":{"background":"子宮切除後出現掉淚、鬱悶並表示自己已不像是女人,反映的是身體心像改變所帶來的自我價值受損,屬自尊自重需求的層次。此時的護理重點在於接納其感受、協助重新看待女性角色與自我價值,並可引介同儕支持或邀請伴侶共同參與。安全感需求對應的是對疾病與治療的恐懼,愛與歸屬對應的是被接納與陪伴,自我實現則是發揮潛能與追求理想。照護上可先接住情緒再談功能,例如以開放式提問了解她對婚姻與生育的擔憂,必要時轉介心理諮商或病友團體。故選 C。","options":{"A":"安全需求非此情境。","B":"愛及歸屬非核心。","C":"正確(本題答案)。覺得不像女人=自尊自重受損。","D":"自我實現是潛能發揮。"},"sources":["新文京《護理行政》激勵理論","華杏《護理行政學》Maslow與Herzberg"]}},"105030-N2-70":{"quick":"雙因子激勵因素影響授權=工作時受肯定。","detail":{"background":"Herzberg 把影響工作態度的因素分為兩類:保健因素屬工作的外在環境,例如薪資、工作條件、辦公室氣氛、人際關係與機構政策,不足時會引起不滿,改善後只能消除不滿而無法帶來滿足;激勵因素則屬工作本身,例如成就感、受到肯定、工作內容具挑戰性、責任與升遷發展,是真正提升動機的來源。授權之所以能激勵,正因為它帶來責任與被信任的肯定感。因此若只調高薪資或改善休息室設備,通常只能降低抱怨;要提升投入程度,仍須從賦予責任與肯定成就著手。故選 B。","options":{"A":"辦公室氣氛是保健因子。","B":"正確(本題答案)。工作受肯定=激勵因素。","C":"酬勞高是保健因子。","D":"工作條件是保健因子。"},"sources":["新文京《護理行政》激勵理論","華杏《護理行政學》Maslow與Herzberg"]}},"106030-N2-60":{"quick":"清潔同仁置物櫃作懲罰=X理論。","detail":{"background":"X 理論假設員工天生不喜歡工作、逃避責任,必須以嚴密監督與懲罰來確保績效,因此管理手段偏向查核與處分。護理長逐日稽核紀錄完整性,並讓每月缺漏最多者負責清潔同仁置物櫃,是以懲罰驅使行為,正是這種人性假設的體現。需要層級理論談的是需求由低到高的滿足順序;目標設定理論主張明確且具挑戰性的目標能提升績效;激勵理論則泛指提升動機的各種論述。以懲罰驅動雖可能短期提高紀錄完成率,卻容易引發防衛與敷衍,長期仍須從系統面找出紀錄費時的原因。故選 B。","options":{"A":"需要層級理論是Maslow。","B":"正確(本題答案)。懲罰管控=X理論。","C":"目標設定理論非此。","D":"激勵理論非懲罰。"},"sources":["新文京《護理行政》激勵理論","華杏《護理行政學》Maslow與Herzberg"]}},"106111-N2-37":{"quick":"Maslow:最優先處理=協助病人維持身體舒適(生理需求)。","detail":{"background":"Maslow 的需求層次同時提供了護理照護的優先順序:最底層的生理需求關乎生存與舒適,包括呼吸、疼痛控制、進食、排泄與睡眠,未被滿足時病人幾乎無法把注意力放在其他事情上;其上依序是安全需求、愛與歸屬感、自尊與自我實現。協助維持身體舒適屬生理層次,應最先處理;了解病情偏向安全與認知需求,協助與家人溝通屬愛與歸屬,協助完成心願則接近自我實現。臨床上遇到需求排序的題目,可先掃描選項中有沒有涉及呼吸、疼痛、進食與排泄的項目,有的話多半就是答案。故選 B。","options":{"A":"與家人溝通是愛歸屬。","B":"正確(本題答案)。維持身體舒適=生理需求最優先。","C":"完成心願是自我實現。","D":"了解病情層次較高。"},"sources":["新文京《護理行政》激勵理論","華杏《護理行政學》Maslow與Herzberg"]}},"106111-N2-61":{"quick":"雙因子激勵因素=通過個案報告晉升N3(成就肯定)。","detail":{"background":"Herzberg 的雙因子理論把工作因素分為兩類:保健因素屬工作的周邊條件,例如薪資與福利、工作環境、同事相處、機構政策與督導方式,不足會造成不滿,改善後只能消除不滿;激勵因素則內建於工作本身,包括成就、被賞識、工作本身的挑戰性、責任與升遷發展,能真正提高投入程度。恭喜同仁通過個案報告審查並順利晉升,同時具備成就與被肯定,屬激勵因素;其餘三項都落在周邊條件。因此改善薪資與環境可以留住人,卻不必然讓人願意多做一步;要提升投入,仍須從成就感與責任感著手。故選 A。","options":{"A":"正確(本題答案)。通過審查晉升=成就肯定激勵因子。","B":"監督安全是保健因子。","C":"薪資福利是保健因子。","D":"工作環境是保健因子。"},"sources":["新文京《護理行政》激勵理論","華杏《護理行政學》Maslow與Herzberg"]}},"107110-N2-67":{"quick":"日常生活活動量表計分分類病人=因素分類法。","detail":{"background":"病人分類法主要有兩種:原型分類法先描述各級病人的典型樣貌,再由護理人員整體判斷病人最接近哪一級,簡便但較主觀;因素分類法則挑出若干關鍵照護指標,例如日常生活活動、進食、沐浴、翻身與治療複雜度,逐項計分後依總分歸級,較客觀且可追蹤。題幹以日常生活活動量表逐項計分再依點數分類,正是以個別因素累加的方式。因素分類法的計分結果可直接換算成所需護理時數,是排班與人力估算的重要依據。故選 B。","options":{"A":"原型分類是整體描述歸類。","B":"正確(本題答案)。依項目計分=因素分類法。","C":"客觀分類法非標準。","D":"主觀分類法非標準。"},"sources":["新文京《護理行政》激勵理論","華杏《護理行政學》Maslow與Herzberg"]}},"108020-N2-60":{"quick":"願意互相支援扶持=愛及歸屬需求。","detail":{"background":"Maslow 的第三層是愛與歸屬感需求,指的是被團體接納、與他人建立情感連結並在其中占有一席之地。護理人員在工作上彼此支援與扶持,形成互相依靠的團隊氛圍,正是這一層的展現,也是新人能否留任的重要因素。生理需求關乎休息與進食,安全感關乎執業風險與工作保障,自尊自重則是希望能力受到肯定與尊重。管理上營造互助文化,即是在滿足歸屬需求。因此新人留任措施除了訓練與薪資,更要安排導師制度與同儕支持,讓新人在團隊中找到位置。故選 C。","options":{"A":"生理需求是基本生存。","B":"安全感是保障安全。","C":"正確(本題答案)。互相支援扶持=愛及歸屬。","D":"自尊是受尊重。"},"sources":["新文京《護理行政》激勵理論","華杏《護理行政學》Maslow與Herzberg"]}},"108110-N2-31":{"quick":"藥物食物禁忌「錯誤」=菠菜會「加強」warfarin藥效(菠菜富含維生素K會「拮抗」warfarin)。","detail":{"background":"藥物食物禁忌:A茶水與鐵劑形成鞣酸鐵沉澱(對)、B牛奶抑制腸溶錠dulcolax吸收(對)、C酒精促進抗組織胺對中樞抑制(對)。選項D「菠菜會加強抗凝血劑warfarin藥效」錯誤——菠菜富含維生素K,會「拮抗(減弱)」warfarin的抗凝效果,故D為錯誤(本題答案)。","options":{"A":"正確。茶與鐵劑形成鞣酸鐵沉澱。","B":"正確。牛奶抑制dulcolax吸收。","C":"正確。酒精促進抗組織胺中樞抑制。","D":"錯誤(本題答案)。菠菜維生素K拮抗warfarin,非加強。"},"sources":["新文京《護理行政》激勵理論","華杏《護理行政學》Maslow與Herzberg"]}},"109030-N2-64":{"quick":"月薪→生理需求、警衛巡邏→安全感、放假相約出遊→愛與歸屬感皆已被提及；尚未提及者為「自尊」需求，故選A。","detail":{"background":"本題官方答案C(愛與歸屬感)。情境含月薪(生理/安全)、警衛巡邏(安全)、放假相約出遊(同儕情感連結)。題目問「下列何種需求」,以「相約一起出遊」對應的「愛與歸屬感」為答案(C)。Maslow各層次:薪資=生理安全、警衛=安全、出遊=愛與歸屬。故C。","options":{"A":"正解：自尊需求(受尊重、肯定、成就)在題幹中尚未被提及。","B":"安全感已被滿足(警衛巡邏)。","C":"愛與歸屬已被滿足(放假相約出遊)。","D":"生理需求已被滿足(月薪38,000元)。"},"sources":["新文京《護理行政》激勵理論","華杏《護理行政學》Maslow與Herzberg"]}},"109030-N2-67":{"quick":"雙因子激勵因子=表揚優秀員工。","detail":{"background":"Herzberg 把工作因素分為保健與激勵兩類。保健因素屬工作的周邊條件,包括薪資、福利、宿舍、員工旅遊、工作環境與人際關係,不足時引起不滿,改善後只能消除不滿而無法帶來滿足;激勵因素則內建於工作本身,包括成就感、受到賞識與表揚、工作的挑戰性、責任與升遷發展。公開表揚優秀員工屬於被賞識與肯定,其餘三項都是周邊條件的改善。因此若單位士氣低落,單靠加薪或辦活動往往效果短暫;讓同仁的努力被看見並賦予具挑戰性的任務,才是持久之道。故選 A。","options":{"A":"正確(本題答案)。表揚員工=肯定激勵因子。","B":"員工旅遊是保健因子。","C":"加薪是保健因子。","D":"分配宿舍是保健因子。"},"sources":["新文京《護理行政》激勵理論","華杏《護理行政學》Maslow與Herzberg"]}},"109110-N2-70":{"quick":"激勵氛圍「錯誤」=主管承擔所有工作(應給員工參與決策、挑戰任務)。","detail":{"background":"Marquis-Huston創造激勵氛圍策略:發展工作計畫給員工參與決策機會(對)、了解員工需求提供協助(對)、給挑戰性任務提供成長(對)。選項B「為避免增加員工負荷,主管應承擔所有工作」錯誤(本題答案)——應「適當授權、給員工成長機會」,主管承擔所有工作反而剝奪員工發展、不利激勵。故B。","options":{"A":"正確。給員工參與決策機會。","B":"正確(本題答案)。主管不應承擔所有工作(應授權)。","C":"正確。了解需求提供協助。","D":"正確。給挑戰性任務促成長。"},"sources":["新文京《護理行政》激勵理論","華杏《護理行政學》Maslow與Herzberg"]}},"110110-N2-58":{"quick":"Maslow:護理主管應優先注意=薪資福利(生理需求)。","detail":{"background":"Maslow 主張需求由低而高逐層浮現,低層次未獲基本滿足前,高層次的誘因難以發揮作用。對護理人員而言,薪資與福利對應的是生理與安全層次,是維持生活與工作保障的基礎,因此管理者應優先確保其合理;在此之上,升遷與專業成長對應自尊需求,成就感則接近自我實現。若薪資明顯偏低而流動率居高不下,單靠強調成就感與願景難以留住人才。這也提醒管理者,留任措施必須先確認基本條件無虞,再談進修、升遷與成就感的經營。故選 A。","options":{"A":"正確(本題答案)。薪資福利=生理需求最優先。","B":"升遷層次較高。","C":"專業成長是自我實現。","D":"成就感是自尊。"},"sources":["新文京《護理行政》激勵理論","華杏《護理行政學》Maslow與Herzberg"]}},"110110-N2-77":{"quick":"工作滿意含激勵因子與保健因子=雙因子理論。","detail":{"background":"Herzberg 的雙因子理論主張影響工作態度的因素分為兩類:保健因素屬工作的周邊條件,如薪資、福利、工作環境與人際關係,不足會引起不滿,改善後只能消除不滿;激勵因素則內建於工作本身,如成就、賞識、責任與升遷發展,才能真正提升滿意度。X 與 Y 理論談的是人性假設;需求層次理論談需求由低到高;ERG 理論把需求併為生存、關係與成長三類。雙因子理論的實務啟示是:先把保健因素做到不引起不滿,再以激勵因素提升投入,兩者順序不可顛倒。故選 A。","options":{"A":"正確(本題答案)。激勵+保健因子=雙因子理論。","B":"X、Y理論是人性假設。","C":"滿足需求理論是Maslow。","D":"ERG理論非二因子。"},"sources":["新文京《護理行政》激勵理論","華杏《護理行政學》Maslow與Herzberg"]}},"111030-N2-1":{"quick":"Maslow最高層級需要=自我實現。","detail":{"background":"Maslow 的需求層次由低而高依序為生理、安全與安全感、愛與歸屬感、自尊、自我實現。前四層屬匱乏性需求,一旦滿足動機便下降;最高層的自我實現屬成長性需求,指的是充分發揮潛能、實現個人理想與價值,是一種持續追求的狀態而非可以完成的終點。護理上可依此排定介入的優先順序,也可用來判斷病人或員工當下最迫切的需要落在哪一層。考題常以情境敘述測驗層次判斷,提到完成理想、發揮所長或追求自我超越的,即指向最高層。故選 A。","options":{"A":"正確(本題答案)。最高層是自我實現。","B":"愛及歸屬是第三層。","C":"自尊是第四層。","D":"安全是第二層。"},"sources":["新文京《護理行政》激勵理論","華杏《護理行政學》Maslow與Herzberg"]}},"112030-N2-10":{"quick":"Maslow護理問題優先序=低效性呼吸(2)→社交障礙(1)→身體心像(4)→靈性困擾(3)=2143。","detail":{"background":"依 Maslow 的層次排序護理問題時,由低而高依序處理:低效性呼吸型態威脅氧合與生命,屬生理需求,必須最先處理;身體心像改變影響自我價值感,屬自尊層次;社交互動障礙涉及與他人的連結與被接納,屬愛與歸屬。但當題目同時出現這幾項時,實務排序仍以生理優先,其後依威脅程度與可介入性排列;靈性困擾涉及生命意義與價值的探尋,層次最高,通常放在最後處理。排序題的通則是先救命再談其他,遇到呼吸、循環與意識相關的問題一律優先,其餘再依對生活功能的威脅程度排列。故選 C。","options":{"A":"2413順序不符。","B":"2134不符。","C":"正確(本題答案)。2143(呼吸→社交→身體心像→靈性)。","D":"2341不符。"},"sources":["新文京《護理行政》激勵理論","華杏《護理行政學》Maslow與Herzberg"]}},"112030-N2-65":{"quick":"報酬與同儕一樣的激勵=公平理論。","detail":{"background":"公平理論主張員工會把自己的投入與所得,和參照對象的投入與所得相比較:比值相當時感到公平而維持努力;覺得自己吃虧時會減少投入、要求加薪或另尋出路;覺得占便宜時則可能增加投入或調整認知。ERG 理論把需求併為生存、關係與成長三類;期望理論以努力、績效與獎酬三者的連結預測動機;增強理論則以獎懲改變行為的出現頻率。題幹強調與同儕比較。公平理論提醒管理者,薪酬與獎勵的透明度與程序正義,往往比金額本身更影響員工的感受。故選 C。","options":{"A":"ERG理論是存在-關係-成長。","B":"期望理論是努力-績效-報酬期望。","C":"正確(本題答案)。與同儕比較=公平理論。","D":"增強理論是行為後果修正。"},"sources":["新文京《護理行政》激勵理論","華杏《護理行政學》Maslow與Herzberg"]}},"112180-N2-44":{"quick":"專業能力進階制度=雙因子的「成長發展」激勵因素。","detail":{"background":"Herzberg 把工作因素分為保健與激勵兩類:保健因素屬周邊條件,例如工作保障、薪資福利、同儕關係與工作環境,不足會引起不滿,改善後只能消除不滿;激勵因素則內建於工作本身,包括成就、賞識、責任、升遷與成長發展。專業能力進階制度為護理人員鋪出可依循的成長階梯,讓能力提升被看見並連結到職級與任務,訴求的正是成長與發展。這也說明為何單靠調高薪資難以留住人才:成長的機會與被肯定的路徑,才是專業人員長期投入的動力。故選 B。","options":{"A":"工作保障是保健因子。","B":"正確(本題答案)。進階制度=成長發展激勵因素。","C":"薪資福利是保健因子。","D":"同儕關係是保健因子。"},"sources":["新文京《護理行政》激勵理論","華杏《護理行政學》Maslow與Herzberg"]}},"113030-N2-39":{"quick":"票選最佳服務張貼相片鼓勵=滿足自尊需求。","detail":{"background":"Maslow 的第四層自尊需求包含兩個面向:自我尊重與被他人尊重,後者具體表現為獲得認可、讚許、名聲與地位。票選最佳服務並把獲選者的姓名與照片公開張貼,正是讓其專業表現被同儕與大眾看見,滿足被肯定的需要。生理需求關乎休息與飲食,安全感關乎工作保障與執業風險,愛與歸屬則是被團體接納;若活動改為凝聚團隊感情的聚會,才較接近歸屬層次。表揚制度設計得當,亦可帶動整體士氣。故選 D。","options":{"A":"生理需求是基本生存。","B":"愛與歸屬是情感連結。","C":"安全感是保障。","D":"正確(本題答案)。公開表揚=滿足自尊。"},"sources":["新文京《護理行政》激勵理論","華杏《護理行政學》Maslow與Herzberg"]}},"113100-N2-2":{"quick":"孕婦會陰癢就醫=生理需求。","detail":{"background":"Maslow 的最底層是生理需求,涵蓋維持生存與身體舒適的基本需要,例如呼吸、進食、排泄、睡眠,以及疼痛與搔癢等不適的解除。孕婦因會陰部極癢與異常分泌物而難以忍受,自行處理後仍未緩解,驅使她就醫的正是身體不適亟待解除,屬生理層次。若她擔心的是感染是否影響胎兒,則偏向安全需求;若在意的是外觀或自我形象,才涉及自尊。護理上遇到需求排序的題目,可先掃描選項中有沒有涉及呼吸、疼痛、進食、排泄與皮膚不適的項目,有的話多半就是答案。故選 A。","options":{"A":"正確(本題答案)。會陰癢就醫=生理需求。","B":"安全需求非此。","C":"愛及歸屬非此。","D":"自尊非此。"},"sources":["新文京《護理行政》激勵理論","華杏《護理行政學》Maslow與Herzberg"]}},"113100-N2-38":{"quick":"新人報到Maslow最優先=介紹用餐地點及員工廁所(生理需求)。","detail":{"background":"依 Maslow 的層次,新進人員報到當天最先需要被滿足的是最基礎的生理需要:知道哪裡可以用餐、飲水與如廁,才能安心度過第一個班別。其次才是安全層面,例如隔離裝備的穿脫與感染管制訓練;再往上是加入群組、融入團隊的歸屬需求;在職教育與專業成長則對應自尊與自我實現。引導計畫若一開始就塞滿課程而忽略基本生活安排,新人容易在第一天就感到無所適從。完整的引導計畫應把生活面、安全面與專業面分階段安排,並指派臨床教師陪伴,以降低新人的離職風險。故選 D。","options":{"A":"加Line群組是歸屬。","B":"隔離裝備是安全。","C":"在職教育是成長。","D":"正確(本題答案)。用餐廁所=生理需求最優先。"},"sources":["新文京《護理行政》激勵理論","華杏《護理行政學》Maslow與Herzberg"]}},"114170-N2-43":{"quick":"激勵理論定義:增強理論認為行為會根據隨之而來的結果做修正。","detail":{"background":"激勵理論:C「增強理論(reinforcement)認為行為會根據隨之而來的結果做修正(獎勵增強、懲罰削弱)」正確。A「內容理論解釋行為如何被激發引導維持終止」錯(那是過程理論);B「過程理論著重特殊需求」錯(那是內容理論如Maslow/Herzberg);D「內容理論包含公平、期望、目標理論」錯(那些是過程理論)。故C。","options":{"A":"解釋行為過程是過程理論,非內容。","B":"著重需求是內容理論,非過程。","C":"正確(本題答案)。增強理論依結果修正行為。","D":"公平期望目標是過程理論,非內容。"},"sources":["新文京《護理行政》激勵理論","華杏《護理行政學》Maslow與Herzberg"]}},"101110-N2-62":{"quick":"護理長向督導長請求支援=上行溝通。","detail":{"background":"組織溝通依方向分為幾種:下行溝通由上而下傳達政策與指示;上行溝通由下而上反映意見、困難與需求;平行溝通發生在同層級之間,例如病房會議或跨單位協調;斜行溝通則同時跨越層級與部門。護理長向護理督導長請求支援,是由較低層級向較高層級反映問題並爭取資源,屬上行溝通,其成效取決於主管是否建立通暢的回饋管道。臨床上的提案、意見反映與申訴都屬上行溝通,常見的障礙是層級過多造成訊息遞減,或部屬擔心被視為能力不足而不敢反映。故選 A。","options":{"A":"正確(本題答案)。護理長向督導長=上行溝通。","B":"下行是上級向下級。","C":"平行是同層級。","D":"斜行是不同層級不同部門。"},"sources":["新文京《護理行政》溝通","華杏《護理行政學》組織溝通"]}},"102110-N2-74":{"quick":"病房會議討論臨床業務=平行溝通。","detail":{"background":"病房會議的參與者多為同一單位、層級相近的護理人員,彼此討論臨床業務問題屬於同層級之間的橫向交流,稱平行溝通,功能在於協調工作、分享經驗與凝聚共識。下行溝通是主管向下傳達政策,上行溝通是部屬向上反映意見,斜行溝通則同時跨越層級與部門,例如護理師直接與其他科主治醫師討論流程。平行溝通的常見障礙是各單位本位主義與資訊不對稱,因此需要共同的會議機制與紀錄,才能把討論轉為具體決議。故選 C。","options":{"A":"下行是上級向下級。","B":"上行是下級向上級。","C":"正確(本題答案)。同層級討論=平行溝通。","D":"斜行是跨層級跨部門。"},"sources":["新文京《護理行政》溝通","華杏《護理行政學》組織溝通"]}},"103030-N2-79":{"quick":"不受時間距離限制、速度最快=電子網路溝通。","detail":{"background":"溝通媒介的選擇要看訊息的性質與傳遞需求。電子網路可同時送達大量對象,不受時間、地點與假日限制,速度最快且可留存紀錄,適合政策公告與資料分享;書面正式但傳遞慢;電話即時卻多為一對一且無紀錄;演說簡報需要同時同地。其缺點是缺乏非語言線索、語氣容易誤解,重要或敏感訊息仍宜輔以面對面溝通。因此政策公告、教育訓練資料與班表這類需要普及且留存的訊息最適合走電子管道,而涉及考核或衝突處理的內容則不宜。故選 A。","options":{"A":"正確(本題答案)。不受時空限制速度最快=電子網路。","B":"演說簡報受時空限制。","C":"書面溝通較慢。","D":"電話需即時連線。"},"sources":["新文京《護理行政》溝通","華杏《護理行政學》組織溝通"]}},"104030-N2-60":{"quick":"放計時器卻不知目的=缺乏溝通與協助的障礙。","detail":{"background":"推動任何改善措施,除了提供工具,更要讓執行者理解目的與作法。護理長在洗手檯放置計時器,原意是協助落實洗手時間,但護理師並不知道為什麼要放,顯示措施在導入時未經說明與討論,執行者只看到多了一個物品而未連結到手部衛生的品質目標。若是標準流程本身不存在或專案缺乏管控,呈現的樣態會是無所依循或進度失控,而非知其然不知其所以然。因此改善措施導入時,應同時說明目的、示範作法並徵詢使用者意見,再以稽核追蹤,才能真正改變行為。故選 C。","options":{"A":"非護理師警覺性低。","B":"非專案管控不當。","C":"正確(本題答案)。目的未說明=缺乏溝通與協助。","D":"非未制定SOP。"},"sources":["新文京《護理行政》溝通","華杏《護理行政學》組織溝通"]}},"105090-N2-72":{"quick":"年終獎金謠言流傳=葡萄藤式溝通。","detail":{"background":"葡萄藤式溝通指的是循著非正式人際網絡蔓延的訊息傳遞,像葡萄藤般四處分岔,速度極快卻缺乏查證,常在正式訊息未公布或資訊不明確時最為活躍。年終獎金辦法尚在會議討論中,消息卻已在護理師之間走樣流傳,正是典型情形。上行、下行與平行溝通都屬正式管道,依組織層級界定方向。管理上的因應之道不是禁止傳言,而是儘早以正式管道說明進度,壓縮謠言生存的空間。這類傳言在組織中不會消失,管理者可善用非正式網絡蒐集員工的真實想法,同時以透明的正式訊息降低誤傳的空間。故選 D。","options":{"A":"上行是正式向上溝通。","B":"下行是正式向下溝通。","C":"平行是正式同層溝通。","D":"正確(本題答案)。流傳謠言=葡萄藤式(非正式)溝通。"},"sources":["新文京《護理行政》溝通","華杏《護理行政學》組織溝通"]}},"106111-N2-65":{"quick":"兩護理師車禍請假:護理長協調安排上班人員。","detail":{"background":"兩位護理師同時車禍請假、短時間無法上班,護理長最適當處理是「(護理長親自)協調安排上班人員」(C正確)——主管職責、即時調度人力確保病房運作。A書面請督導(緩不濟急)、B請受傷者自找代班(不近人情)、D請別病房支援(未先自行調度)皆不如護理長親自協調。故C。","options":{"A":"書面請督導緩不濟急。","B":"請受傷者自找代班不近人情。","C":"正確(本題答案)。護理長協調安排上班人員。","D":"應先自行調度,非直接請他病房。"},"sources":["新文京《護理行政》溝通","華杏《護理行政學》組織溝通"]}},"106111-N2-67":{"quick":"護理長交代實習老師注意事項=斜行溝通。","detail":{"background":"溝通方向的判斷同時要看層級與所屬單位。上行與下行溝通發生在同一條指揮鏈的上下之間,平行溝通發生在同層級的同事之間,斜行溝通則同時跨越層級與部門,雙方沒有直接的隸屬關係。護理長對前來帶實習的學校老師交代實習注意事項,兩人分屬醫院與學校兩個組織,職級也不相同,因此屬於跨層級跨單位的交流,這類溝通仰賴良好的協調與尊重,而非命令。實務上跨院校的實習溝通宜留下書面紀錄,並事先與學校訂定合約與帶教規範,避免因口頭交代而生落差。故選 D。","options":{"A":"上行是向上級。","B":"下行是向下級。","C":"平行是同層級。","D":"正確(本題答案)。對實習老師=斜行溝通(跨層級)。"},"sources":["新文京《護理行政》溝通","華杏《護理行政學》組織溝通"]}},"106111-N2-68":{"quick":"「你私下換班讓我有不被尊重感覺」=直言型溝通。","detail":{"background":"面對部屬違規時的溝通行為可依強度分級:諒解型先表達理解與體諒;提示型僅點到為止地提醒;直言型則明確說出對方做了什麼、造成什麼影響、自己的感受如何,並提出具體期待;警戒型帶有後果警告。護理長指出未請假私下換班的事實、說明造成的管理困擾與不被尊重的感受,並要求日後遵守規定,結構完整而不含威脅,屬於坦誠直說的方式,也是我訊息溝通的典型。這種說法之所以有效,在於陳述的是具體行為與自身感受,而不是對人格的評價,較不會引發防衛。故選 C。","options":{"A":"諒解型偏體諒。","B":"提示型偏暗示。","C":"正確(本題答案)。直接坦誠表達=直言型溝通。","D":"警戒型偏警告威脅。"},"sources":["新文京《護理行政》溝通","華杏《護理行政學》組織溝通"]}},"107110-N2-65":{"quick":"溝通是持續性的=每次溝通延續上一次的感受及關係。","detail":{"background":"組織溝通具有幾項特性:它是雙向的,收發同時進行;是不可逆的,話說出口便無法完全收回;是不均等的,對不同對象的深度與頻率並不相同;而所謂持續性,指的是溝通不是一次性的獨立事件,每一次互動都會延續並累積前次留下的感受與關係,先前的信任或誤解都會影響後續的解讀。因此主管與部屬的每次對話,都在為下一次溝通鋪路或設限。因此處理衝突時,除了解決當次爭議,更要修補關係,否則累積的負面感受會使日後的溝通愈來愈困難。故選 D。","options":{"A":"選擇性非持續性。","B":"雙向性非持續性。","C":"不可逆性非持續性。","D":"正確(本題答案)。延續上次感受關係=持續性。"},"sources":["新文京《護理行政》溝通","華杏《護理行政學》組織溝通"]}},"109110-N2-66":{"quick":"護理部與藥劑部各執己見請副院長協調=平行溝通。","detail":{"background":"溝通方向依雙方的層級關係判斷。護理部與藥劑部同屬院長之下的一級單位,層級相當且無隸屬關係,兩者為藥品包裝方式各持己見,屬平行溝通;請副院長主持協調會議,是在平行溝通僵持時引入上級居中裁決,並不改變原本兩部之間的關係性質。上行與下行溝通發生在同一指揮鏈的上下之間,斜行溝通則同時跨越層級與部門。平行溝通的常見障礙是本位主義與資訊不對稱,因此協調會議應以病人安全與整體流程為共同判準,而非各自的作業方便。故選 C。","options":{"A":"上行是向上級。","B":"下行是向下級。","C":"正確(本題答案)。兩同層部門=平行溝通。","D":"斜行是跨層級。"},"sources":["新文京《護理行政》溝通","華杏《護理行政學》組織溝通"]}},"111030-N2-69":{"quick":"不同層級單位人員間的溝通=斜行溝通。","detail":{"background":"溝通方向依雙方的層級與所屬單位判斷:下行與上行溝通發生在同一條指揮鏈的上下之間,平行溝通發生在同層級且通常同體系的成員之間,斜行溝通則同時跨越層級與部門,雙方沒有直接的隸屬關係,例如護理師直接與他科主治醫師討論流程、護理長向學校帶隊老師交代事項。這類溝通因缺乏職權基礎,更仰賴專業說服與良好的人際協調。斜行溝通在跨專業團隊中日益重要,建立共同的溝通工具與定期會議,可降低因無隸屬關係而生的推諉。故選 D。","options":{"A":"下行是上對下。","B":"上行是下對上。","C":"平行是同層級。","D":"正確(本題答案)。不同層級不同單位=斜行溝通。"},"sources":["新文京《護理行政》溝通","華杏《護理行政學》組織溝通"]}},"111110-N2-69":{"quick":"護理長找A病房主任(醫師)溝通=平行溝通。","detail":{"background":"溝通方向依雙方的層級與所屬單位判斷。護理長與病房主任分屬護理與醫療兩個體系,但在組織中的層級相當,同為單位層級的主管,因此護理長就醫師的言行與病房主任溝通,屬於平行溝通。上行與下行溝通發生在同一條指揮鏈的上下之間;非正式溝通指的是循私人網絡傳遞而非透過正式管道。這類跨體系的平行溝通,成效取決於雙方是否以病人照護為共同目標。這類跨體系的協調宜對事不對人,聚焦於言行對團隊與病人照護的影響,並可循醫療品質或人事管道留下正式紀錄。故選 C。","options":{"A":"上行是向上級。","B":"下行是向下級。","C":"正確(本題答案)。護理長對病房主任=平行溝通。","D":"非正式溝通是私下小道消息。"},"sources":["新文京《護理行政》溝通","華杏《護理行政學》組織溝通"]}},"112110-N2-68":{"quick":"護理長直接與值班醫師溝通=斜行溝通。","detail":{"background":"斜行溝通指的是同時跨越層級與部門、雙方沒有直接隸屬關係的溝通。護理長與值班醫師分屬護理與醫療兩個體系,職級也不相同,因此護理長為護理人員的爭執直接與該醫師溝通,即屬此類。上行與下行溝通發生在同一條指揮鏈的上下之間,平行溝通則發生在層級相當的成員之間。斜行溝通缺乏職權基礎,更仰賴專業說服與以病人照護為共同目標。實務上這類爭執宜先釐清事實與病人安全的影響,再循正式管道處理,避免演變成兩個體系之間的對立。故選 D。","options":{"A":"上行是向上級。","B":"下行是向下級。","C":"平行是同層級。","D":"正確(本題答案)。護理長對值班醫師=斜行溝通。"},"sources":["新文京《護理行政》溝通","華杏《護理行政學》組織溝通"]}},"115030-N2-45":{"quick":"良好溝通管道要件「錯誤」=要傳達的訊息是即時的?本題答案A。","detail":{"background":"本題官方答案A(錯誤,須斟酌)。良好溝通管道要件:B訊息是必須的(對)、C組織成員容易取得訊息(對)、D訊息直接且正式傳達(對)。選項A「要傳達的訊息是即時的」——本題視為非要件/敘述不當而為答案。核心:良好溝通管道應簡短直接、訊息必要、易取得、正式傳達;「即時性」非其關鍵要件。故A。","options":{"A":"正確(本題答案)。即時性非良好溝通管道關鍵要件。","B":"訊息必須是要件。","C":"成員容易取得是要件。","D":"直接正式傳達是要件。"},"sources":["新文京《護理行政》溝通","華杏《護理行政學》組織溝通"]}},"101030-N2-60":{"quick":"分權組織優點=員工覺得自由且受尊重。","detail":{"background":"分權(decentralization)組織優點:A「員工覺得自由且受尊重(自主權大、士氣高)」正確。B「精簡組織避免重複浪費」、C「少數人擁有決策權」、D「部門間不易衝突」是「集權」的特點(集權精簡、決策集中)。故分權優點=員工自由受尊重(A)。","options":{"A":"正確(本題答案)。分權使員工自由受尊重。","B":"精簡避免浪費是集權優點。","C":"少數人決策是集權。","D":"部門不易衝突偏集權。"},"sources":["新文京《護理行政》衝突管理","華杏《護理行政學》衝突處理"]}},"101030-N2-80":{"quick":"魚與熊掌無法兼得=雙趨衝突。","detail":{"background":"Lewin 依吸引與排斥的方向把個人內在衝突分為三型:雙趨衝突是兩個都想要卻只能擇一,魚與熊掌不可兼得即是;雙避衝突是兩個都不想要卻必須選一個;趨避衝突則是同一個選項同時具有吸引與排斥的性質。認知衝突屬人際或團體層次,指對事實或方法的認知不同所引起的爭議,與個人內在的抉擇無關。臨床上常見的雙趨情境,例如同時錄取兩個都想去的單位;雙避則如既不想值大夜又不想調單位。辨識的關鍵在於各選項本身是吸引還是排斥。故選 B。","options":{"A":"雙避是兩個都不想要。","B":"正確(本題答案)。魚與熊掌=雙趨衝突。","C":"趨避是同一目標有利有弊。","D":"認知衝突非此。"},"sources":["新文京《護理行政》衝突管理","華杏《護理行政學》衝突處理"]}},"101110-N2-67":{"quick":"衝突敘述較正確=衝突會產生建設性或破壞性的結果。","detail":{"background":"現代管理對衝突的觀點已由完全負面轉為互動觀:適度的衝突能使問題浮現、激發不同意見與創新,產生建設性結果;過度或處理不當的衝突則造成情緒對立與效率下降,屬破壞性結果。因此衝突有助於了解問題,也可能提升而非降低解決問題的能力,管理者更不應袖手旁觀,而要適時介入引導使其導向建設性的一面。因此管理者的任務不是消滅衝突,而是把它控制在適當強度:強度太低會使組織僵化而缺乏改進動力,太高則癱瘓合作與士氣。故選 D。","options":{"A":"適度衝突有助了解問題。","B":"衝突不一定降低解決能力。","C":"管理者應適度介入。","D":"正確(本題答案)。衝突有建設性或破壞性結果。"},"sources":["新文京《護理行政》衝突管理","華杏《護理行政學》衝突處理"]}},"101110-N2-71":{"quick":"病患想多住院vs院方要求出院=雙方目標不同。","detail":{"background":"衝突的來源可分幾類:資源有限而互相爭奪、目標或利益不一致、角色與職責界定不清、溝通不良造成誤解,以及價值觀或個性差異。醫院行政者著眼於床位周轉與經營效率,病人著眼於自身康復與安全感,兩者的訴求本身即相互牴觸,即使溝通順暢也不會消失,屬目標不同所引起的衝突,而非溝通阻斷、地位差異或個性不合。處理這類衝突有賴協商與整合,例如透過出院準備服務同時滿足床位周轉與病人安全的需求;單靠加強溝通,並不能消除目標本身的落差。故選 C。","options":{"A":"非溝通阻斷。","B":"非權力地位不同。","C":"正確(本題答案)。出院時機歧異=雙方目標不同。","D":"非個性不同。"},"sources":["新文京《護理行政》衝突管理","華杏《護理行政學》衝突處理"]}},"102030-N2-77":{"quick":"關心自己低、關心他人高=順從。","detail":{"background":"Thomas 與 Kilmann 以關心自己與關心他人兩個向度區分五種衝突處理行為:競爭是高度關心自己、低度關心他人;順從或遷就是低度關心自己、高度關心他人,為維持關係而讓步;妥協是兩者皆中等,各退一步;逃避是兩者皆低,拖延或迴避議題;合作則是兩者皆高,設法找出雙贏方案。題幹描述關心自己低而關心他人高,對應的是主動讓步的一方。臨床上護理師為避免與家屬正面衝突而全盤配合其要求,即屬順從;短期可平息場面,長期若壓抑了專業判斷,反而不利病人。故選 B。","options":{"A":"競爭是高自己低他人。","B":"正確(本題答案)。低自己高他人=順從。","C":"妥協是各退一步。","D":"逃避是皆低。"},"sources":["新文京《護理行政》衝突管理","華杏《護理行政學》衝突處理"]}},"102110-N2-77":{"quick":"處理衝突中,關心自己低關心他人高=順從(同前)。","detail":{"background":"這個模式以能力、生產力與報酬三者的相對關係解釋工作滿意:三者相稱時最為平衡;能力與工作表現高於報酬時,員工感到被剝削甚至像受懲罰,容易產生不滿與離職念頭;反過來報酬高於能力與產出時,員工則會出現不安或罪惡感。判讀選項時要逐一比對不等號的方向,以及該情境所對應的心理反應是否相符。護理職級制度的設計目的,正是讓能力、所承擔的工作與薪資三者盡量對齊,以減少這類因不相稱而生的不滿。故選 A。","options":{"A":"競爭是高關心自己。","B":"正確(本題答案)。低自己高他人=順從。","C":"妥協是各退一步。","D":"逃避是皆不關心。"},"sources":["新文京《護理行政》衝突管理","華杏《護理行政學》衝突處理"]}},"103030-N2-57":{"quick":"衝突傳統觀點=衝突會降低績效應加以避免。","detail":{"background":"衝突的「傳統觀點(traditional view)」:認為衝突有害、會降低績效,應「加以避免/消除」(B正確)。A「促進創新應鼓勵」、C「自然產生不必壓制」、D「促進互動有利發展」是「人際關係觀點/互動觀點(現代)」。故傳統觀點=降低績效應避免(B)。","options":{"A":"促進創新是現代互動觀點。","B":"正確(本題答案)。降低績效應避免=傳統觀點。","C":"自然產生不壓制是人際關係觀點。","D":"促進互動有利是現代觀點。"},"sources":["新文京《護理行政》衝突管理","華杏《護理行政學》衝突處理"]}},"103030-N2-72":{"quick":"對自己及他人關心程度均高=合作。","detail":{"background":"以關心自己與關心他人兩個向度來看,合作是雙方都高:願意投入時間充分溝通,找出同時滿足雙方需求的整合方案,是最理想但也最耗時的處理方式;妥協是兩者皆中,各讓一步而各有損失;順從是關心他人高而關心自己低;逃避則兩者皆低。臨床上重大流程爭議適合用合作,瑣碎且無關緊要的分歧則不必投入這麼多成本。因此選擇處理方式時,要同時衡量議題的重要性與雙方關係的價值,而不是一律追求某一種作法。故選 D。","options":{"A":"順從是低自己高他人。","B":"妥協是各退一步。","C":"逃避是皆低。","D":"正確(本題答案)。皆高=合作。"},"sources":["新文京《護理行政》衝突管理","華杏《護理行政學》衝突處理"]}},"103030-N2-78":{"quick":"彼此迴避、拖延戰術=逃避。","detail":{"background":"逃避是對自己與他人的關心程度都低的處理方式,表現為迴避議題、拖延、轉移話題或不表態,短期可爭取冷靜的時間,長期卻使問題累積惡化。妥協是雙方各讓一步,順應是一方主動退讓以維持關係,強迫則是以權力壓過對方。題幹描述雙方彼此迴避並採取拖延戰術,沒有任何一方採取行動處理爭議。逃避在情緒高張的當下可作為短暫的緩衝,但仍須在雙方冷靜後回到議題,否則累積的不滿會以其他形式爆發。故選 D。","options":{"A":"妥協是各退讓。","B":"順應是成全他人。","C":"強迫是壓制對方。","D":"正確(本題答案)。迴避拖延=逃避。"},"sources":["新文京《護理行政》衝突管理","華杏《護理行政學》衝突處理"]}},"103100-N2-77":{"quick":"請護理人員協商提出排班表=合作。","detail":{"background":"以關心自己與關心他人兩個向度來看,合作是雙方都高的處理方式:管理者不替雙方裁決,而是創造協商的場域,讓當事人把各自的需求攤開,共同找出彼此都能接受的方案。護理長請護理人員自行協商後提出過年期間的排班表,正是把決定權還給當事人並促成整合;競爭是壓過對方,順從是單方讓步,逃避則是拖延不處理。這種作法還能提高排班的接受度,減少事後抱怨。不過合作需要時間與願意溝通的雙方,若當事人情緒仍高張,通常得先降溫再進入協商。故選 D。","options":{"A":"競爭是壓制對方。","B":"逃避是迴避。","C":"順從是成全他人。","D":"正確(本題答案)。協商提排班=合作。"},"sources":["新文京《護理行政》衝突管理","華杏《護理行政學》衝突處理"]}},"104030-N2-62":{"quick":"薪資與工作滿意=C=W>P(能力佳薪資低,感衝突疏離)。本題答案B。","detail":{"background":"這個模式比較能力、工作表現與薪資三者的相對高低來預測工作滿意。當能力與表現相稱而薪資明顯偏低時,員工付出的與得到的不成比例,會產生內在衝突與被虧待的感受,士氣與留任意願逐漸下降,是最典型的不滿情境。若薪資高於能力與表現,員工反而容易出現不安或罪惡感;若表現又高於能力與薪資,則同時存在超荷與低報酬的問題。作答時逐一比對不等號方向與所述心理反應是否吻合即可。護理職級制度的用意,正是讓能力、工作份量與薪資三者盡量對齊,以減少這類因不相稱而生的不滿與流動。故選 B。","options":{"A":"敘述不符模式。","B":"正確(本題答案)。C=W>P能力佳薪資低致衝突疏離。","C":"P>W>C敘述不符。","D":"W>C>P敘述不符。"},"sources":["新文京《護理行政》衝突管理","華杏《護理行政學》衝突處理"]}},"104030-N2-72":{"quick":"衝突過程中正式定義議題=認知與個人化階段。","detail":{"background":"衝突的發展可分為幾個階段:潛在對立期已存在溝通、結構或個人因素等前置條件但尚未浮現;認知與個人化階段中,當事人開始意識到衝突存在,並在此時正式界定議題是什麼、也感受到情緒;意圖與行為階段則決定採取何種處理方式並實際表現出來;最後進入結果階段,產生建設性或破壞性的後果。議題被明確定義,正發生在當事人察覺並賦予其意義的那一階段。了解階段的意義在於介入時機:前置條件仍可事先消除,一旦進入行為階段,處理成本就明顯升高。故選 C。","options":{"A":"潛在對立是條件階段。","B":"意圖與行為是後續。","C":"正確(本題答案)。定義議題=認知與個人化階段。","D":"顯示期非標準階段。"},"sources":["新文京《護理行政》衝突管理","華杏《護理行政學》衝突處理"]}},"108020-N2-64":{"quick":"醫護衝突處理較適當=運用衝突解決策略,控制衝突在適當程度。","detail":{"background":"急診護理長處理醫護衝突,最適當是「運用衝突解決的基本策略,控制衝突在適當的程度即可」(D正確)——適度衝突有建設性,管理者應管理而非一味壓制或逃避。A「盡力使不發生衝突」、B「大事化小事化無」(逃避)、C「請督導主任解決」(推卸)皆不當。故D。","options":{"A":"一味避免衝突不當。","B":"大事化小是逃避。","C":"請他人解決是推卸。","D":"正確(本題答案)。運用策略控制衝突在適當程度。"},"sources":["新文京《護理行政》衝突管理","華杏《護理行政學》衝突處理"]}},"109110-N2-72":{"quick":"Douglass衝突解決最優先=確認問題。","detail":{"background":"Douglass 的衝突解決模式主張處理衝突的第一步是團體互動,亦即先把相關人員聚在一起,讓各方把觀點與感受說出來。唯有透過互動,才能看出爭議的真正焦點是什麼,接著才談得上確認問題、共同尋求可行方案,必要時再引進外在資源協助。若一開始就由主管逕自認定問題所在或直接尋求外援,容易誤判焦點,也可能讓當事人覺得未被聽見而更加對立。團體互動要能發揮作用,主持者需維持安全的討論氣氛,把焦點放在事情與流程上,而不是追究誰對誰錯。故選 C。","options":{"A":"正確(本題答案)。衝突解決最優先=確認問題。","B":"尋求方案是後續。","C":"團體互動是後續。","D":"尋求外在資源是後續。"},"sources":["新文京《護理行政》衝突管理","華杏《護理行政學》衝突處理"]}},"110030-N2-73":{"quick":"家屬久候情緒失控=雙方目標不一致。","detail":{"background":"衝突的來源可分為溝通因素、結構因素與個人因素。急診依檢傷分級決定處置順序,並須等待檢驗結果才能判斷病情;家屬則期待立即獲得處置與答覆,兩方追求的目標本質上並不一致,即使等候動線與說明都做到位,張力仍會存在。人力不足是加劇等候的背景條件而非衝突的核心,個性價值觀與權力地位差異也不是此處的主因。處理這類衝突,除了主動說明等候原因與預估時間,更應從流程面縮短檢驗回報時間,才能減少張力的來源。故選 C。","options":{"A":"人力不足是表面。","B":"非個性價值觀。","C":"正確(本題答案)。久候不耐=雙方目標不一致。","D":"非權力地位不同。"},"sources":["新文京《護理行政》衝突管理","華杏《護理行政學》衝突處理"]}},"110030-N2-74":{"quick":"醫師冷處理收集資料再反應=逃避。","detail":{"background":"Thomas 以關心自己與關心他人兩個向度區分五種衝突處理行為。逃避是兩者皆低,表現為暫時不回應、拖延或轉移,目的在於避開當下的正面衝撞。醫師見家屬正在氣頭上而採取冷處理,並打算蒐集更多資料後再回應,即屬此類:在情緒高張時暫緩處理有其實務價值,但仍須在雙方冷靜後回到議題,否則問題會累積。順從是單方讓步,競爭是壓過對方,妥協則是各退一步。冷處理的關鍵在於後續是否回頭處理:若只是拖延而未再回應,家屬的不滿會轉為投訴或申訴。故選 A。","options":{"A":"正確(本題答案)。冷處理收集資料=逃避。","B":"順從是成全對方。","C":"競爭是壓制。","D":"妥協是各退一步。"},"sources":["新文京《護理行政》衝突管理","華杏《護理行政學》衝突處理"]}},"110110-N2-64":{"quick":"緩解衝突「不」適當=以權力來壓制雙方的衝突。","detail":{"background":"衝突緩解的原則是先評估再介入:審慎選擇值得處理的衝突,把心力留給影響病人安全或團隊運作的重大議題;評估當事人的性格、關係與情緒狀態,決定介入的時機與方式;並分析衝突的原因與根源,才能對症處理。以權力強行壓制雖然可以迅速平息表面爭執,卻未解決根本問題,還會累積不滿與對主管的不信任,日後往往以更嚴重的形式再度爆發。介入前也應先評估自己是否為合適的協調者,若主管本身即是衝突的一方,宜請更上層或第三方主持。故選 D。","options":{"A":"適當。審慎選擇處理的衝突。","B":"適當。評估衝突當事人。","C":"適當。分析衝突原因根源。","D":"不適當(本題答案)。以權力壓制未解決根源。"},"sources":["新文京《護理行政》衝突管理","華杏《護理行政學》衝突處理"]}},"111030-N2-74":{"quick":"衝突過程中最適合運用技巧避免擴大=意圖及行為階段。","detail":{"background":"衝突的發展依序為潛在對立、認知與個人化、意圖與行為、結果四個階段。潛在對立期問題尚未浮現,難以針對性介入;認知與個人化階段當事人剛意識到衝突並界定議題,情緒才開始累積;意圖與行為階段雙方已決定採取何種方式並實際表現出來,此時衝突具體可見卻尚未造成既成傷害,是運用處理技巧介入、避免非功能性衝突擴大的最佳時機;進入結果階段則多半只能善後。因此主管平時應留意衝突的早期訊號,例如交班氣氛緊繃或訊息刻意不傳遞,在行為升高前及早介入。故選 C。","options":{"A":"潛在對立尚未外顯。","B":"認知個人化是感知階段。","C":"正確(本題答案)。意圖及行為階段最適合介入。","D":"結果階段已成定局。"},"sources":["新文京《護理行政》衝突管理","華杏《護理行政學》衝突處理"]}},"111030-N2-79":{"quick":"達到雙贏的衝突管理策略=合作。","detail":{"background":"以關心自己與關心他人兩個向度來看,合作是雙方都高的策略:願意投入時間充分溝通,把雙方真正的需求攤開,找出同時滿足彼此的整合方案,因此是唯一可能達成雙贏的作法。迴避是兩者皆低,問題被擱置而無人得利;順從是單方讓步,屬我輸你贏;支配或競爭是壓過對方,屬我贏你輸;妥協則是各退一步,雙方都有部分損失。合作的代價是耗時且需要雙方都願意坦誠溝通,因此適合用在重要且長期的議題,瑣碎爭議則不必投入這麼多成本。故選 B。","options":{"A":"迴避是拖延/雙輸。","B":"正確(本題答案)。合作=雙贏。","C":"順從是犧牲自己。","D":"支配是一方贏一方輸。"},"sources":["新文京《護理行政》衝突管理","華杏《護理行政學》衝突處理"]}},"111110-N2-78":{"quick":"藥劑部與護理部預算協調衝突=團體間衝突。","detail":{"background":"衝突依當事人的層次可分為幾類:個人內在衝突發生在同一個人心中的取捨;人際衝突發生在兩個人之間;團體間衝突發生在組織內不同單位之間,常因資源有限、目標不同或職責重疊而起;組織間衝突則發生在兩個獨立機構之間。藥劑部與護理部同屬院內單位,為年度預算分配各持立場,正是單位之間爭取有限資源的典型情形。化解團體間衝突的作法包括設定共同上位目標、由更上層主持協調,以及建立透明的資源分配準則。故選 B。","options":{"A":"目標間衝突非此。","B":"正確(本題答案)。兩部門間=團體間衝突。","C":"組織間衝突是不同組織。","D":"個人內在衝突是個人心理。"},"sources":["新文京《護理行政》衝突管理","華杏《護理行政學》衝突處理"]}},"112030-N2-75":{"quick":"感受知覺衝突並產生情緒反應=認知與個人化階段。","detail":{"background":"Robbins衝突五階段:當個體「感受/知覺到衝突,且產生情緒反應」=認知與個人化階段(perceived & felt conflict)(B正確)。潛在對立(條件)、意圖及行為(外顯)、結果皆非「感知+情緒」階段。故認知與個人化階段(B)。","options":{"A":"潛在對立是條件階段。","B":"正確(本題答案)。感知衝突並情緒化=認知與個人化階段。","C":"意圖及行為是外顯階段。","D":"結果階段是後果。"},"sources":["新文京《護理行政》衝突管理","華杏《護理行政學》衝突處理"]}},"112110-N2-76":{"quick":"同時完成碩士進修及評鑑難抉擇=雙趨衝突。","detail":{"background":"李護理長面臨「碩士班進修」與「評鑑任務」兩個都想完成卻難兼顧、難抉擇取捨=雙趨衝突(double approach conflict,兩個都想要的正向目標只能選一)(D正確)。雙避(都不想要)、趨避(同一目標有利有弊)、組織衝突皆非。故雙趨衝突(D)。","options":{"A":"雙避是兩個都不想要。","B":"趨避是同一目標有利有弊。","C":"組織衝突是組織層面。","D":"正確(本題答案)。兩者都想完成=雙趨衝突。"},"sources":["新文京《護理行政》衝突管理","華杏《護理行政學》衝突處理"]}},"102030-N2-67":{"quick":"緊急情況宜採集權式管理。","detail":{"background":"集權式管理把決策權集中於高層,命令一致、指揮明確、反應迅速,適合緊急事件、需要全院統一調度或資源必須集中運用的情境;分權式把決策權下授各級主管,較能因地制宜並培養人才,但協調耗時。均權與參與式同樣需要較多的討論與整合。緊急情況講求的是速度與一致,因此宜暫時採取決策集中的方式。不過集權只適合短期應急,事件結束後仍應回到平時的分權運作,否則基層主管長期缺乏決策機會,反而會削弱單位的應變能力。故選 A。","options":{"A":"正確(本題答案)。緊急情況宜集權式。","B":"分權式決策慢不適緊急。","C":"均權式非緊急首選。","D":"參與式耗時。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"102110-N2-70":{"quick":"單位護理長做預算計畫=分權式。","detail":{"background":"預算編列權放在哪一層,反映的正是集權或分權。若由護理部或財務單位統一編列各單位預算,屬集權;若由各單位護理長依自己單位的業務量與需求編列再送審,則是把決策權下授到基層,屬分權式。分權的好處是貼近實務、責任明確,並可培養主管的財務管理能力;放任式與君權式並不是預算管理的正式分類。分權編列雖較貼近需求,仍須由護理部與財務單位審核彙整,以維持全院資源分配的一致性。故選 B。","options":{"A":"集權式決策集中高層。","B":"正確(本題答案)。單位主管做預算=分權式。","C":"放任式是不管。","D":"君權式非標準。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"102110-N2-73":{"quick":"聘學者專家擔任督導顧問協助研究=直線幕僚型組織。","detail":{"background":"組織型態:直線(line,指揮命令系統)、幕僚(staff,提供專業諮詢建議但無指揮權)。「聘學者專家擔任督導/顧問,協助推動研究」=直線幕僚型組織(A正確,幕僚提供專業協助)。金字塔型、矩陣型、扁平型皆非「顧問幕僚」。故直線幕僚型(A)。","options":{"A":"正確(本題答案)。聘顧問協助=直線幕僚型。","B":"金字塔型是層級結構。","C":"矩陣型是雙重隸屬。","D":"扁平型是層級少。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"103030-N2-65":{"quick":"非正式組織=具相近之價值觀。","detail":{"background":"非正式組織(informal organization):C「具相近之價值觀(因興趣、情感、價值觀自然結合)」正確。A「較不具影響力」錯(非正式組織影響力大);B「對組織不利」錯(可正可負);D「成員較不能暢所欲言」錯(非正式中反而較能暢所欲言)。故C。","options":{"A":"非正式組織影響力大。","B":"非正式組織可正可負,非必不利。","C":"正確(本題答案)。非正式組織具相近價值觀。","D":"非正式中較能暢所欲言。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"103030-N2-66":{"quick":"書寫組織任務宣言應以「顧客」需要為主要依據。","detail":{"background":"任務宣言說明組織存在的目的、服務對象與核心價值,是策略規劃的起點。依 Duncan 的觀點,撰寫時應以顧客的需要為主要依據,先回答顧客是誰、他們需要什麼,才能界定組織該提供什麼服務;若以老闆、員工或主管機關的需要為出發點,容易寫成內部宣示而失去外部導向。醫院的任務宣言即多以病人與社區的健康需求為核心。任務宣言確立後,才據以展開願景、目標與年度計畫,因此它的方向若偏離顧客需求,底下所有規劃都會跟著偏移。故選 D。","options":{"A":"工作人員非任務宣言首要依據。","B":"政府非首要。","C":"老闆非首要。","D":"正確(本題答案)。任務宣言以顧客需要為依據。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"103100-N2-62":{"quick":"組織分權「錯誤」=決定權是從上向下控制(分權是下放決策非由上控制)。","detail":{"background":"組織分權(decentralization):B各類專業人員共同參與決策(對)、C可培養優秀管理人才(對)、D單位主管有較大自主權(對)。選項A「決定權是從上向下控制」錯誤(本題答案)——分權是「將決策權下放給基層」,非由上向下控制(由上控制是集權)。故A。","options":{"A":"正確(本題答案)。分權是下放決策,非由上控制。","B":"分權各專業共同參與決策。","C":"分權培養管理人才。","D":"分權單位主管自主權大。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"103100-N2-66":{"quick":"感染管制中心依明文規定負責政策=功能職權。","detail":{"background":"職權類型:直線職權(指揮命令)、幕僚職權(諮詢建議)、功能職權(functional authority,就特定專業功能對其他單位有指揮權)。「感染管制中心依明文規定負責全院環境及感染管控政策(對各單位的感控有專業指揮權)」=功能職權(C正確)。故功能職權(C)。","options":{"A":"直線職權是指揮命令系統。","B":"幕僚職權只諮詢無指揮權。","C":"正確(本題答案)。專業功能指揮權=功能職權。","D":"金字塔型是結構非職權。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"103100-N2-67":{"quick":"同時接受多個委員會與督導指示=矩陣組織。","detail":{"background":"矩陣組織在原有的直線部門之上再疊加專案或功能導向的管理系統,使成員同時對兩位以上的主管負責。加護病房護理長既受護理部督導的指揮,又須接受加護單位管理委員會的稽核與品質管理委員會的指示,正是這種雙重指揮的樣態。它的優點是專業資源可跨單位運用,缺點是違反統一指揮原則,容易產生角色衝突。因此採用矩陣組織時,必須事先界定各條指揮線的權責範圍與優先順序,並建立協調機制,才能降低成員無所適從的情形。故選 B。","options":{"A":"分權組織是決策下放。","B":"正確(本題答案)。多重隸屬指揮=矩陣組織。","C":"幕僚組織是諮詢。","D":"扁平組織是層級少。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"104030-N2-67":{"quick":"依員工態度情緒喜好形成=非正式組織。","detail":{"background":"正式組織由機構依業務需要設立,有明文的職掌、層級與指揮系統;非正式組織則是成員基於情感、興趣、態度或共同背景自然形成的人際網絡,例如同期進用的同事群或固定一起用餐的小圈子。它沒有正式編制卻具有實質影響力,可提供情緒支持並加速訊息流通,但也可能傳播謠言或形成抗拒。部門化組織與矩陣組織都屬正式結構的設計方式。管理上不宜壓制非正式組織,而應了解其意見領袖並善加溝通,使其成為政策推行的助力。故選 B。","options":{"A":"正式組織是明文規定。","B":"正確(本題答案)。依態度喜好形成=非正式組織。","C":"部門化是正式劃分。","D":"矩陣組織是雙重隸屬。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"104100-N2-65":{"quick":"合併職權使層級減少=扁平組織。","detail":{"background":"組織結構依層級多寡分為高聳與扁平。高聳組織層級多、每位主管管轄幅度小,指揮細膩但訊息傳遞慢、行政成本高;扁平組織把中間層級合併或裁減,層級少而管轄幅度大,溝通快速、決策路徑短,但主管負荷重且升遷階梯減少。護理部把副主任、督導長與護理長的職權合併,使層級縮減為主任、護理長與護理師三層,正是減少管理層級的作法。扁平化是近年醫院組織的普遍趨勢,但層級減少後必須同步強化授權與資訊系統,否則主管將陷入事務性工作。故選 B。","options":{"A":"高聳組織是層級多。","B":"正確(本題答案)。層級減少=扁平組織。","C":"矩陣組織是雙重隸屬。","D":"中央集權是決策集中。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"106030-N2-75":{"quick":"設營養部醫療部護理部=功能式結構。","detail":{"background":"組織部門化的方式有多種:功能式結構依專業功能劃分部門,例如醫療部、護理部、營養部、藥劑部,各自集中同類專才,有利專業深化與資源共用,缺點是本位主義與跨部門協調成本高;矩陣式在功能部門之上再疊加專案系統;扁平式描述的是層級多寡而非劃分方式;幕僚式指的是提供建議與支援的輔助單位。題幹列舉的正是依專業功能設立的各部。護理部本身即是功能式結構的一環,其內部再依病房與專科分組,形成功能之下再分區的多層設計。故選 B。","options":{"A":"扁平式是層級少。","B":"正確(本題答案)。依功能分部門=功能式結構。","C":"矩陣式是雙重隸屬。","D":"幕僚式是諮詢。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"106110-N2-65":{"quick":"組織文化「不」含=組織經費(經費非文化內涵)。","detail":{"background":"組織文化指組織成員共有的價值觀、信念、規範與行為模式,並外顯為組織氣氛、儀式、故事與符號,影響成員如何看待工作與彼此互動,也左右組織的創造力與變革意願。組織經費屬於財務資源,是可量化的物質條件,雖然會受文化影響資源分配的偏好,但本身不是文化的內涵。判斷時可問這一項是共享的觀念與行為,還是可清點的資源。組織文化難以直接命令改變,通常須透過領導者的示範、制度與獎酬的調整,以及新進成員的社會化過程,才會逐步移轉。故選 C。","options":{"A":"組織氣氛是文化內涵。","B":"組織創造力是文化內涵。","C":"正確(本題答案)。組織經費非文化內涵。","D":"組織價值觀是文化內涵。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"106110-N2-66":{"quick":"使命(mission)=代表組織存在的意義。","detail":{"background":"使命說明組織存在的意義與根本目的,回答我們為誰服務、提供什麼價值,它具有長期穩定性,是願景、目標與策略的上位依據,不會隨情勢而頻繁更動。使命的敘述通常較為概括而非專一特定,以保留發展空間;同時必須與服務對象及市場緊密相關,否則無法指引方向。相對地,年度目標才是具體、可衡量且會逐年調整的部分。因此醫院的使命多寫成守護社區健康、提供以病人為中心的優質照護這類長期敘述,而不會寫成某一年要達成的床位數或營收數字。故選 D。","options":{"A":"使命較廣泛,非專一特定。","B":"使命相對穩定,非機動改變。","C":"使命與市場/顧客相關。","D":"正確(本題答案)。使命=組織存在的意義。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"106110-N2-69":{"quick":"100床、護理師成熟自主性高=扁平式組織。","detail":{"background":"組織結構應與成員的成熟度相配。當護理師專業成熟度與自主性高時,採層級少、管轄幅度大的扁平式結構最為適宜:決策路徑短、授權充分、溝通快速,能讓具能力的成員發揮自主判斷,也提高工作滿意度。官僚式與集權式強調層級節制與由上而下的控制,會壓抑自主;矩陣式適合需要跨部門專案整合的情境,對百床規模的醫院而言反而增加協調成本。組織扁平化的前提是成員具備足夠能力與責任感,若在人員經驗不足時貿然減少層級,反而會出現督導不足的風險。故選 C。","options":{"A":"官僚式層級嚴明不適自主員工。","B":"矩陣式是雙重隸屬。","C":"正確(本題答案)。成熟自主=扁平式組織。","D":"集權式決策集中。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"106111-N2-66":{"quick":"人力屬護理部、照護政策屬主任=矩陣式結構。","detail":{"background":"矩陣式結構在原有的直線指揮系統之外,再依專案或業務性質疊加另一條指揮線,使成員同時向兩位主管負責。加護中心護理師的人力配置、考核與訓練歸護理部管轄,病人照顧政策卻聽命於加護中心主任,正是典型的雙重隸屬。它的優點是專業與業務兩條線都能兼顧,缺點是違反統一指揮原則,兩位主管要求不一致時容易造成角色衝突,因此必須事先界定各自的權責範圍。臨床上加護單位、手術室與急診常見這種雙重隸屬,遇到指示衝突時應循既定的協調機制處理,而非由基層人員自行取捨。故選 C。","options":{"A":"功能式是單一功能分部門。","B":"部門式是依部門劃分。","C":"正確(本題答案)。雙重隸屬=矩陣式結構。","D":"扁平式是層級少。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"107030-N2-64":{"quick":"院長下分內科部外科部營養部護理部=功能式。","detail":{"background":"功能式結構依專業功能劃分部門,把性質相近的專才集中在同一單位,例如院長之下設內科部、外科部、營養部與護理部,好處是專業深化、資源共用與訓練一致,缺點則是各部易生本位主義、跨部門協調成本高。幕僚式指的是提供諮詢與支援的輔助單位;專案式依任務臨時編組;矩陣式則在功能結構之上再疊加專案指揮線,形成雙重隸屬。多數醫院的基本架構都是功能式,再依需要疊加委員會或專案小組來處理跨部門議題。故選 B。","options":{"A":"幕僚式是諮詢。","B":"正確(本題答案)。依功能分部=功能式。","C":"專案式是任務編組。","D":"矩陣式是雙重隸屬。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"107030-N2-68":{"quick":"控制幅度(span of control)=可決定人員配置的層級與數量。","detail":{"background":"控制幅度指一位主管能有效直接督導的部屬人數。它與組織層級呈反向關係:控制幅度小則層級多、形成高聳組織;控制幅度大則層級少、形成扁平組織,因此它直接決定人員配置的層級與數量。至於成員關係的複雜程度、標準化的高低與集權的程度,分別由組織結構的其他面向決定,雖與控制幅度相關,卻不是這個概念本身所衡量的內容。影響適當控制幅度的因素包括工作的複雜度、部屬的能力與經驗、標準化的程度,以及資訊系統的支援。故選 D。","options":{"A":"非成員關係複雜度。","B":"非標準化程度。","C":"非集權狀況。","D":"正確(本題答案)。控制幅度決定層級與人員數量。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"108020-N2-69":{"quick":"組織結構與授權=組織越扁平化應增加授權程度。","detail":{"background":"組織結構與授權:A「組織結構越趨向扁平化,應增加授權的程度(層級少、控制幅度大、須多授權)」正確。B「越扁平控制幅度越小、決定權集中」錯(扁平是幅度大);C「組織規模越大宜分權」(此項其實合理,但本題以A為正解);D「金字塔型職權由上向下遞增」錯(應遞減,越往下職權越小)。故A。","options":{"A":"正確(本題答案)。組織越扁平應增加授權。","B":"扁平是控制幅度大,非小。","C":"大組織宜分權(本題正解A)。","D":"金字塔職權由上向下遞減,非遞增。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"108110-N2-67":{"quick":"護理督導長督導的單位數=管轄幅度。","detail":{"background":"管轄幅度又稱控制幅度,指一位主管能有效直接督導的部屬或單位數目。護理督導長負責督導幾個病房,講的正是這個概念。管轄幅度與組織層級呈反向關係:幅度小則層級多而形成高聳組織,幅度大則層級少而趨於扁平。影響適當幅度的因素包括工作複雜度、部屬能力與經驗、標準化程度與資訊系統支援。組織結構、溝通與階層範圍都是更廣的概念,並非此處所問。管轄幅度過大會使督導流於形式,過小則層級疊床架屋、訊息傳遞遲緩,因此需依單位特性取得平衡。故選 B。","options":{"A":"組織結構是整體架構。","B":"正確(本題答案)。督導的單位數=管轄幅度。","C":"組織溝通非此。","D":"階層範圍非此。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"109030-N2-65":{"quick":"集權「不」是優點=職權和職責階層完整化(那是分權特性)。本題答案B。","detail":{"background":"本題官方答案B(集權非優點者)。集權(centralization)優點:A決策效率化易於管理、C減少部門間衝突、D人員設施可精簡。選項B「職權和職責階層完整化」不是集權的優點(本題答案)——階層完整化偏向分權/組織設計面,非集權特有優點。故B。","options":{"A":"集權優點:決策效率易管理。","B":"正確(本題答案)。階層完整化非集權優點。","C":"集權優點:減少部門衝突。","D":"集權優點:人員設施精簡。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"109030-N2-71":{"quick":"品質督導長同時參與品管中心=矩陣式組織。","detail":{"background":"矩陣式結構在既有的功能部門之上,再依專案或跨部門任務疊加另一條指揮線,使成員同時隸屬兩個系統。督導長原本在護理部負責品質管理,又同時參與院級品管中心的業務,即形成雙重隸屬,好處是專業人力可跨單位運用、院內品質標準得以整合,代價則是違反統一指揮原則,必須事先界定兩邊的權責與優先順序,以免產生角色衝突。採行矩陣設計時,應同時建立協調機制與明確的優先順序,避免成員在兩位主管的要求之間無所適從。故選 A。","options":{"A":"正確(本題答案)。雙重隸屬=矩陣式組織。","B":"扁平式是層級少。","C":"同僚式非標準。","D":"分權式是決策下放。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"110030-N2-68":{"quick":"集結各領域人才組育成中心=矩陣式?本題答案B(功能式)。","detail":{"background":"組織部門化的方式各有邏輯:功能式結構依專業功能把性質相近的人才集中成立單位,例如把各領域的研究創新人才集中組成育成中心,以利專業深化與資源共用。矩陣式是在功能部門之上再疊加專案指揮線,使成員雙重隸屬;直線幕僚式指的是在指揮體系之外另設提供建議的幕僚單位;扁平式描述的是層級多寡而非劃分方式。題幹是把同性質人才集中成立新單位。功能式結構的限制在於本位主義,因此育成中心成立後仍需建立與臨床單位的合作機制,研究成果才能落地。故選 B。","options":{"A":"矩陣式是雙重隸屬。","B":"正確(本題答案)。依領域功能集結=功能式。","C":"直線-幕僚式是諮詢。","D":"扁平式是層級少。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"110110-N2-68":{"quick":"癌症中心副主任架構屬中心、升遷薪水屬護理部=矩陣式。","detail":{"background":"矩陣式組織在原有的直線指揮系統之外,再依專案或業務性質疊加另一條指揮線,使成員同時對兩位主管負責。癌症中心副主任的業務隸屬癌症中心,升遷與薪資卻由護理部管理,正是這種雙重隸屬的樣態。它的優點是專業人力可跨單位運用、跨領域整合順暢,缺點則是違反統一指揮原則,兩邊要求不一致時容易產生角色衝突,需事先界定權責。臨床上跨中心與跨專科的整合照護日益普遍,矩陣設計也隨之常見,關鍵在於事先講清楚兩條線各管什麼。故選 C。","options":{"A":"直線式是單一指揮鏈。","B":"幕僚式是諮詢。","C":"正確(本題答案)。雙重隸屬=矩陣式。","D":"委員會式是合議。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"111030-N2-68":{"quick":"緊急事件講求時效=集權式結構。","detail":{"background":"緊急事件講求的是指揮明確與反應迅速,此時最適合把決策權集中於高層,由指揮者統一調度人力與資源,避免各單位各行其是而延誤時機,這就是集權式結構的特點。簡單式結構指的是規模小、層級少的組織形態;功能性結構是依專業劃分部門的方式;扁平式描述的是層級多寡。三者說的都不是決策權集中與否,無法直接回應時效的需求。集權只適合短期應急,事件結束後仍應回到平時的分權運作,否則基層主管長期缺乏決策機會,反而削弱應變能力。故選 C。","options":{"A":"簡單式非緊急時效首選。","B":"功能性結構非此。","C":"正確(本題答案)。緊急講求時效=集權式。","D":"扁平式非緊急首選。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"111030-N2-71":{"quick":"同時負責護理部品質與醫品部RCA=矩陣式組織。","detail":{"background":"矩陣式組織在原有的直線指揮系統之外,再依專案或跨部門任務疊加另一條指揮線,使成員同時對兩位主管負責。護理長既在護理部負責品質管理作業,又承接醫品部的根本原因分析專案,即形成雙重隸屬。它的優點是專業人力可跨單位運用、院內品質活動得以整合,缺點則是違反統一指揮原則,兩邊要求不一致時容易造成角色衝突,因此必須事先界定權責與優先順序。臨床上品質、感染管制與病人安全業務常以這種方式跨部門推動,關鍵在於事先講清楚兩條線各管什麼、進度向誰報告。故選 D。","options":{"A":"直線型是單一指揮鏈。","B":"扁平式是層級少。","C":"幕僚型是諮詢。","D":"正確(本題答案)。雙重隸屬=矩陣式組織。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"111110-N2-57":{"quick":"願景=一個組織未來想要達成的目標指引。","detail":{"background":"組織願景、價值觀、理念、使命:A「願景(vision)是組織未來想要達成的目標指引/未來圖像」正確。B「由每位員工設定價值觀」錯(價值觀是共同信念,非各自設定);C「理念是中心目標」敘述須對應;D「使命是未來的圖像」錯(願景才是未來圖像,使命是存在的理由)。故A。","options":{"A":"正確(本題答案)。願景=未來想達成的目標指引。","B":"價值觀是共同信念,非各自設定。","C":"理念敘述須對應。","D":"使命是存在理由,願景才是未來圖像。"},"sources":["新文京《護理行政》組織結構","華杏《護理行政學》組織型態與文化"]}},"112030-N2-60":{"quic
