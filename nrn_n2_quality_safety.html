tions":{"A":"W>C>P","B":"C=W>P","C":"C>P=W","D":"W=P>C"},"img":""}],E={"101030-N2-77":{"quick":"護理部預算占比最大=人事預算。","detail":{"background":"護理部的預算結構反映了護理工作的本質。護理屬於高度勞力密集的服務,病房必須二十四小時三班輪值,人力配置直接決定照護量能與品質,因此薪資、加班費、夜班津貼、勞健保與退休金等人事支出,通常占護理部預算的五成以上,在部分醫院甚至達七成。這也是為什麼護理人力的增減對醫院成本影響最大,而護病比政策的推動往往牽動整體財務規劃。相對地,教學預算多用於在職訓練與臨床教師鐘點,品管預算用於品管圈活動與稽核作業,研究預算則支應專案與論文發表,三者的金額都遠低於人事支出。故選 A。","options":{"A":"正確(本題答案)。人事預算占比最大。","B":"教學預算占比小。","C":"品管預算占比小。","D":"研究預算占比小。"},"sources":["新文京《護理行政》品質管理","華杏《護理行政學》Donabedian品質模式"]}},"101110-N2-75":{"quick":"侵入性檢查前做病人辨識=過程控制。","detail":{"background":"品質管理的控制依 Donabedian 的架構可分為三個層次。結構控制針對投入的資源,包括人力配置、資格條件、設備儀器與規章制度;過程控制針對照護實際執行的方式,重點在於做對了沒有;結果控制則衡量照護後病人身上呈現的變化。侵入性檢查前執行病人辨識,是照護流程中的一個標準動作,要求以兩種以上識別方式核對身分,這是在確認執行過程是否正確,因此屬於過程控制。判別的訣竅在於問自己:這個項目描述的是有沒有資源、有沒有照規矩做,還是病人最後怎麼了。故選 C。","options":{"A":"策略非控制構面。","B":"結構是投入資源。","C":"正確(本題答案)。病人辨識是過程控制。","D":"結果是結果指標。"},"sources":["新文京《護理行政》品質管理","華杏《護理行政學》Donabedian品質模式"]}},"102110-N2-64":{"quick":"考核技術指引是否含無菌原則=結構考核。","detail":{"background":"Donabedian:考核「醫院訂定的肌肉注射技術『指引』是否包含無菌技術原則(制度/標準的完備性)」=結構考核(B正確,結構=制度標準設備人力的完備)。結果考核(病人結果)、過程考核(實際執行過程)皆非「考核指引內容」。故結構考核(B)。","options":{"A":"結果考核是病人結果。","B":"正確(本題答案)。考核指引內容完備=結構考核。","C":"過程考核是實際執行。","D":"執行考核非標準分類。"},"sources":["新文京《護理行政》品質管理","華杏《護理行政學》Donabedian品質模式"]}},"102110-N2-76":{"quick":"護理品管委員會制定護理技術=護理標準組。","detail":{"background":"護理品管委員會底下通常依功能分組,各司其職。護理標準組負責制定與修訂各項護理技術標準、作業常規與照護指引,是品質的基準來源;臨床稽核組依據這些標準到臨床單位查核執行情形,找出落差;品質指標監測組負責定義指標、收集數據並分析趨勢,監看是否超出閾值;成本控制組則關注耗材使用與資源效益。題目所述制定護理技術屬於訂定標準的工作,對應護理標準組。三者的關係可以理解為:先有標準,才能稽核,再以指標監測成效,形成完整的品質管理循環。故選 A。","options":{"A":"正確(本題答案)。制定護理技術=護理標準組。","B":"臨床稽核組是稽核執行。","C":"品質指標監測組是監測指標。","D":"成本控制組是控成本。"},"sources":["新文京《護理行政》品質管理","華杏《護理行政學》Donabedian品質模式"]}},"103030-N2-68":{"quick":"Donabedian過程面指標=導尿技術正確性。","detail":{"background":"分辨三面向指標最實用的方法,是看該項目描述的是名詞還是動作。結構面多是靜態的資源,例如人員資格、設備數量與制度是否建立;過程面通常帶有動詞,描述照護如何被執行,例如技術是否正確、流程是否遵守;結果面則是病人身上發生的變化,例如感染率、跌倒率與滿意度。導尿技術正確性描述的是護理人員執行導尿這個動作的品質,屬於過程面。其餘選項各歸其位:護理人員持有證書的比率是人力資格,屬結構面;泌尿道感染率與病人滿意度都是照護之後產生的結果,屬結果面。故選 D。","options":{"A":"持證書比率是結構面。","B":"泌尿道感染率是結果面。","C":"滿意度是結果面。","D":"正確(本題答案)。導尿技術正確性是過程面。"},"sources":["新文京《護理行政》品質管理","華杏《護理行政學》Donabedian品質模式"]}},"103100-N2-79":{"quick":"Donabedian結果面指標=給藥異常發生率。","detail":{"background":"結果面指標衡量的是照護作用在病人身上之後所呈現的狀態,常見的有感染率、跌倒率、壓瘡發生率、非計畫性重返率、死亡率與病人滿意度,而給藥異常發生率同樣是照護作為之後實際發生的結果,因此屬結果面。其餘三個選項都停留在投入端:急救車設備是否完整屬於設備資源,教育訓練計畫的內容是否周全屬於制度規劃,接受高級救命術訓練的人數則屬於人力資格條件,三者都是結構面。使用結果指標時要留意,結果受病人本身條件影響很大,跨單位比較前需先做風險校正,且結果的變化往往落後於改善措施數個月。故選 A。","options":{"A":"正確(本題答案)。給藥異常發生率是結果面。","B":"急救車設備是結構面。","C":"教育訓練計畫是結構面。","D":"接受訓練人數是結構面。"},"sources":["新文京《護理行政》品質管理","華杏《護理行政學》Donabedian品質模式"]}},"104100-N2-76":{"quick":"醫院評鑑要求各病房有洗手設備=結構控制。","detail":{"background":"醫院評鑑的條文中,凡是要求機構應設置某項設備、應有某種人力配置或應訂定某項辦法的,查核的都是投入端的資源是否到位,屬於結構面。要求各病房應有洗手設備即是典型例子,評鑑委員會實地確認洗手台的數量、位置是否適當、乾洗手液是否備置於床邊。這與過程面和結果面形成完整的鏈條:有了設備是結構,護理人員是否確實依五時機執行手部衛生是過程,最終院內感染率下降則是結果。三者缺一不可,只有設備而無人使用,或只看結果而不追究過程,都無法真正提升品質。故選 A。","options":{"A":"正確(本題答案)。洗手設備是結構控制。","B":"過程是執行過程。","C":"結果是結果指標。","D":"策略非控制構面。"},"sources":["新文京《護理行政》品質管理","華杏《護理行政學》Donabedian品質模式"]}},"105030-N2-80":{"quick":"過程品質指標=手術流程。","detail":{"background":"過程品質指標衡量的是照護行為本身是否依照既定標準執行,常見形式是某項作業的正確率或遵從率。手術流程涵蓋術前的病人與部位辨識、手術安全查核表的執行、器械與紗布的清點、無菌技術的維持以及交接班的資訊傳遞,每一步都是可以被觀察與稽核的行為,因此屬於過程品質。其餘選項分屬另外兩面:護理師人數是人力配置,屬結構;滿意度與跌倒率都是照護結束後才能測得的結果。實務上過程指標的優點是回饋快、可立即改善,不像結果指標需要累積數月的資料才看得出變化。故選 C。","options":{"A":"滿意度是結果品質。","B":"護理師人數是結構品質。","C":"正確(本題答案)。手術流程是過程品質。","D":"跌倒率是結果品質。"},"sources":["新文京《護理行政》品質管理","華杏《護理行政學》Donabedian品質模式"]}},"106030-N2-78":{"quick":"血液管路感染率=Donabedian結果面。","detail":{"background":"血液管路感染率統計的是裝設中心靜脈導管的病人中發生血流感染的比例,它是照護執行之後在病人身上實際發生的不良結果,因此屬於結果面。與之對照,同一主題在三個面向上會有不同指標:結構面看的是有沒有制定導管照護規範、有沒有配備含氯己定的敷料與最大無菌面防護包;過程面看的是置放時無菌技術的遵從率、每日評估是否仍需留置的執行率;結果面才是感染率本身。當結果指標超出閾值時,正確的分析路徑是回頭檢視過程與結構,找出是規範不足還是執行不落實,而非只盯著數字。故選 C。","options":{"A":"結構面是設備人力制度。","B":"過程面是執行過程。","C":"正確(本題答案)。感染率是結果面。","D":"綜合面非標準構面。"},"sources":["新文京《護理行政》品質管理","華杏《護理行政學》Donabedian品質模式"]}},"106111-N2-76":{"quick":"忘記告知禁食致手術延期=因投入過程不當產生的問題。","detail":{"background":"品質問題可依發生在系統的哪一環來歸類。護理師在術前一晚忘記告知病人禁食,導致手術延期,問題出在照護執行的過程中應完成的步驟沒有做到,屬於投入過程不當所產生的問題,改善方向包括建立術前準備的查核表、把禁食告知納入交班重點,並運用資訊系統在術前自動提醒。其餘選項描述的是另外幾種常見的落差型態:因時間不同而產生的問題指不同班別或時段的做法不一致;因地點不同指不同單位的標準有落差;因權限不同則指同一件事在不同職級的認定或授權範圍不同。故選 C。","options":{"A":"非因時間不同。","B":"非因地點不同。","C":"正確(本題答案)。忘記告知禁食=投入過程不當。","D":"非因權限不同。"},"sources":["新文京《護理行政》品質管理","華杏《護理行政學》Donabedian品質模式"]}},"107030-N2-72":{"quick":"觀察發藥是否遵三讀五對=過程考核。","detail":{"background":"護理部派員到病房實地觀察護理師發藥時是否遵照三讀五對,查核的對象是護理人員執行給藥這個動作的正確性,屬於過程考核。這種現場觀察式的稽核有其特點:能直接看到真實的執行情形,但也可能因為被觀察而使行為短暫改善,也就是霍桑效應,因此常搭配不預警稽核或以電子紀錄回溯查核。與其他考核的分別在於:結構考核檢視的是給藥車、藥物標示、給藥規範與人力是否到位;成果考核看的是給藥異常事件的發生率;績效考核則是針對個別人員的整體工作表現進行評定,並非品質管理的面向分類。故選 B。","options":{"A":"結構考核是制度設備。","B":"正確(本題答案)。觀察三讀五對是過程考核。","C":"成果考核是結果。","D":"績效考核非此分類。"},"sources":["新文京《護理行政》品質管理","華杏《護理行政學》Donabedian品質模式"]}},"108020-N2-76":{"quick":"過程品質指標=洗手遵從率。","detail":{"background":"遵從率型的指標是過程面最典型的形式,分子是實際依規範執行的次數,分母是應該執行的總次數。洗手遵從率即依世界衛生組織的手部衛生五時機,由稽核員觀察並記錄醫護人員在接觸病人前、執行無菌操作前、暴露體液風險後、接觸病人後與接觸病人周遭環境後是否確實執行,計算出百分比,衡量的是照護行為本身,屬過程品質。其餘選項分屬另外兩面:護理師編制是人力配置,屬結構;跌倒發生率與壓瘡發生率都是病人身上出現的不良結果,屬結果。過程指標的價值在於它是可以立即改變的行為,改善後結果指標才會跟著下降。故選 D。","options":{"A":"跌倒發生率是結果品質。","B":"護理師編制是結構品質。","C":"壓瘡發生率是結果品質。","D":"正確(本題答案)。洗手遵從率是過程品質。"},"sources":["新文京《護理行政》品質管理","華杏《護理行政學》Donabedian品質模式"]}},"109110-N2-71":{"quick":"糖尿病素食送餐有誤檢討「最不適當」=找出犯錯者並調離單位。","detail":{"background":"送餐有誤的檢討改進(系統/品質思維):A仔細檢討送錯的導因、C檢討員工知識技能是否足夠、D加強準備正確性的稽核。選項B「找出犯錯者並將他調到其他單位」最不適當(本題答案)——品質改善應「對事不對人、找系統根因」,而非「懲處/調離個人」(懲罰文化不利通報與改善)。故B。","options":{"A":"檢討送錯導因(適當)。","B":"最不適當(本題答案)。應找系統根因,非懲處調離個人。","C":"檢討員工知識技能(適當)。","D":"加強稽核(適當)。"},"sources":["新文京《護理行政》品質管理","華杏《護理行政學》Donabedian品質模式"]}},"111030-N2-78":{"quick":"線性溝通模式品質關鍵要素=來源、訊息、管道及接收者。","detail":{"background":"線性溝通模式(Shannon-Weaver)的關鍵要素:來源(發訊者)、訊息(message)、管道(channel)、接收者(receiver)及干擾(noise)。選項D「來源、訊息、管道及接收者」正確。其餘選項用詞不符(溝通者、員工、傳遞者非標準要素)。故D。","options":{"A":"「溝通者」非標準要素。","B":"「溝通者」非標準要素。","C":"「員工、傳遞者」非標準要素。","D":"正確(本題答案)。來源、訊息、管道、接收者。"},"sources":["新文京《護理行政》品質管理","華杏《護理行政學》Donabedian品質模式"]}},"112030-N2-73":{"quick":"控制概念正確=預算編列屬於事前控制。","detail":{"background":"控制(controlling)分類:事前控制(預防性,如預算編列、計畫)、事中控制(過程中)、事後控制(結果)。選項B「預算編列屬於事前控制」正確。A「策略控制適用基層」錯(策略控制適用高層);C「病人辨識屬結構控制」錯(屬過程控制);D「顧客反應屬過程控制」錯(屬結果控制)。故B。","options":{"A":"策略控制適用高層,非基層。","B":"正確(本題答案)。預算編列屬事前控制。","C":"病人辨識是過程控制,非結構。","D":"顧客反應是結果控制,非過程。"},"sources":["新文京《護理行政》品質管理","華杏《護理行政學》Donabedian品質模式"]}},"112110-N2-61":{"quick":"醫療服務過程面指標=護理師手部衛生執行正確率。","detail":{"background":"醫院評鑑的指標分類經常出現在考題中,判別時把三個面向的提問方式記熟即可:結構面問有沒有,過程面問有沒有照做,結果面問結果如何。護理師手部衛生執行正確率描述的是護理人員在應執行手部衛生的時機是否確實且正確地執行,衡量的是行為本身,屬過程面。其餘選項分別對應:加護病房生理監測儀的數量與護理人員數對病床數的比率,都是設備與人力的配置,屬結構面;加護病房住院病人死亡率則是照護之後的結果,屬結果面,且解讀時必須先做疾病嚴重度的風險校正才能跨院比較。故選 A。","options":{"A":"正確(本題答案)。手部衛生執行正確率是過程面。","B":"監測儀數量是結構面。","C":"護病比是結構面。","D":"死亡率是結果面。"},"sources":["新文京《護理行政》品質管理","華杏《護理行政學》Donabedian品質模式"]}},"112180-N2-46":{"quick":"Donabedian正確=評值導尿給藥技術是否正確屬過程標準。","detail":{"background":"Donabedian醫療品質評估模式:B「評值護理師執行導尿、給藥技術是否正確,屬『過程標準』(執行過程)」正確。A「提供照護所執行的活動合乎標準屬結構標準」錯(屬過程);C「評值設備設施是否符合需求屬結果標準」錯(屬結構);D「監測尿路感染率、跌倒傷害率屬測量標準」錯(屬結果標準)。故B。","options":{"A":"執行活動合標準屬過程,非結構。","B":"正確(本題答案)。技術是否正確屬過程標準。","C":"設備設施屬結構,非結果。","D":"感染率跌倒率屬結果標準,非測量。"},"sources":["新文京《護理行政》品質管理","華杏《護理行政學》Donabedian品質模式"]}},"113030-N2-47":{"quick":"Donabedian過程面指標=護理紀錄完整性(1)+術前預防性給抗生素比率(2)。本題答案A「12」。","detail":{"background":"本題官方答案「12」。Donabedian過程面(執行過程):1護理紀錄完整性、2手術前預防性給予抗生素比率(皆為照護執行過程的指標)。選項3、4...為結構或結果面。故過程面為「12」。核心:過程面=照護執行過程(紀錄、技術、給藥流程)。","options":{"A":"正確(本題答案,12)。護理紀錄完整性、術前給抗生素比率=過程面。","B":"23含結果面項目。","C":"14不符。","D":"34不符。"},"sources":["新文京《護理行政》品質管理","華杏《護理行政學》Donabedian品質模式"]}},"113180-N2-48":{"quick":"護理師延誤給藥家屬抱怨:釐清事件向家屬說明事實與後續處理。","detail":{"background":"面對家屬抱怨延誤給藥且擔心影響病情,護理長的首要任務是把事實查清楚。做法包括調閱給藥紀錄與醫囑時間、了解當班人力與工作負荷、詢問當事護理師與相關同仁的說法,並評估病人目前的病情有無因此受到影響,必要時請醫師一同評估。釐清之後才能誠實地向家屬說明實際情形、致上關懷,並提出後續的處理與改善方式。其餘做法都不恰當:認定是疾病自然發展而不予理會,是逃避且可能誤判;把溝通推給主治醫師而自己不出面,等於放棄護理主管的職責;一開始就轉給法務部門,則是過早把服務糾紛升高為法律爭議,反而加深對立。故選 C。","options":{"A":"不理會是忽視。","B":"護理長不出面是推卸。","C":"正確(本題答案)。釐清事件向家屬說明處理。","D":"直接轉法務過早升級。"},"sources":["新文京《護理行政》品質管理","華杏《護理行政學》Donabedian品質模式"]}},"113180-N2-49":{"quick":"泌尿道感染發生率=Donabedian結果品質。","detail":{"background":"泌尿道感染發生率統計的是留置導尿管的病人中發生感染的比例,屬於照護作為之後在病人身上呈現的結果,因此是結果品質指標。這個指標與另外兩個面向構成完整的管理鏈:結構面看的是有沒有導尿管照護的標準作業規範、有沒有備妥密閉式引流系統;過程面看的是置放時的無菌技術遵從率與每日評估是否仍需留置的執行率;結果面則是感染率。當感染率超標時,單看結果無法改善,必須回頭稽核過程面的執行情形。此外要注意選項中的流程品質並非 Donabedian 模式的正式分類名稱。故選 A。","options":{"A":"正確(本題答案)。泌尿道感染率是結果品質。","B":"過程品質是執行過程。","C":"流程品質非標準分類。","D":"結構品質是設備人力。"},"sources":["新文京《護理行政》品質管理","華杏《護理行政學》Donabedian品質模式"]}},"115030-N2-48":{"quick":"改進品管主題考量=發生頻率較高的護理活動。","detail":{"background":"選擇品質改善主題的考量:C「發生頻率較高的護理活動(高頻問題影響面大、改善效益高)」正確。A「繼續執行前一年活動」(未必符合當前需求)、B「較低風險性活動」(應選高風險優先)、D「簡單不耗成本」(不應只挑簡單的)皆非。故發生頻率較高(C)。","options":{"A":"未必繼續前一年活動。","B":"應選高風險優先,非低風險。","C":"正確(本題答案)。選發生頻率較高的活動。","D":"不應只挑簡單的。"},"sources":["新文京《護理行政》品質管理","華杏《護理行政學》Donabedian品質模式"]}},"102030-N2-65":{"quick":"FOCUS-PDCA「錯誤」=A:尋找協助(A應為Act行動)。","detail":{"background":"FOCUS-PDCA品管步驟:Find(發現問題)、Organize(組成小組)、Clarify(釐清現況)、Understand(瞭解變異)、Select(選擇對策);PDCA=Plan(計畫)、Do(執行)、Check(查核)、Act(行動/標準化)。選項D「A:尋找協助(assistance)」錯誤(本題答案)——A是「Act(行動/處置)」,非尋找協助。故D。","options":{"A":"F:發現問題(對)。","B":"O:組成小組(對)。","C":"P:擬定計畫(對)。","D":"錯誤(本題答案)。A是Act行動,非尋找協助。"},"sources":["新文京《護理行政》品質改善","華杏《護理行政學》PDCA與品管圈"]}},"102110-N2-62":{"quick":"品管圈成員無法形成共識延誤進度=任務性衝突。","detail":{"background":"團隊衝突依內容可分為三類。任務性衝突源自對工作目標、內容或方向的看法分歧,例如品管圈成員對於要選哪個主題各持己見;程序性衝突針對的是達成目標的方法、步驟與分工方式;關係性衝突則來自人際之間的情緒對立與不合。題幹描述成員無法對主題形成共識而延誤進度,爭執的核心是要做什麼,屬於任務性衝突。適度的任務性衝突其實有助於激盪想法,但若久拖不決就會妨礙進度,此時圈長可運用親和圖整理意見,再以評價選題法從重要性、迫切性、可行性與圈能力等面向評分,以客觀分數收斂共識。故選 A。","options":{"A":"正確(本題答案)。對主題無共識=任務性衝突。","B":"功能性衝突是建設性衝突。","C":"程序性衝突是對流程方法。","D":"關係性衝突是人際情感。"},"sources":["新文京《護理行政》品質改善","華杏《護理行政學》PDCA與品管圈"]}},"102110-N2-72":{"quick":"服務滿意度調查分析=PDCA的Check步驟。","detail":{"background":"戴明循環把持續改善拆成四個階段。計畫階段分析現況、設定目標並擬定對策;執行階段依計畫小規模導入;查核階段收集資料並與目標比較,確認對策是否有效;行動階段則把有效的做法標準化納入常規,無效的部分則回到計畫重新調整,進入下一個循環。護理長進行病患服務滿意度的調查與分析,是在改善措施導入之後收集資料、檢視成效,對應的正是查核階段。實務上這個階段最容易被忽略,若只做不查,改善活動往往流於形式,無法確認成效也無從標準化。故選 C。","options":{"A":"Plan是訂計畫。","B":"Do是執行。","C":"正確(本題答案)。滿意度調查分析=Check查核。","D":"Act是行動標準化。"},"sources":["新文京《護理行政》品質改善","華杏《護理行政學》PDCA與品管圈"]}},"104030-N2-63":{"quick":"鼓勵員工踴躍參加品管圈=Y理論。","detail":{"background":"麥格瑞格提出兩種對人性的假設。X 理論認為人天生厭惡工作、缺乏企圖心、需要被督促與控制,因此管理手段偏向嚴格監督與獎懲;Y 理論則認為工作對人而言如同遊戲一樣自然,員工在適當條件下會自我引導、主動承擔責任並發揮創造力,因此管理重點在於營造參與的環境並授權。鼓勵員工踴躍參加品管圈,正是相信同仁具備自主改善的意願與能力,讓他們自行選題、分析與提出對策,屬於 Y 理論的實踐。其餘選項各有所指:系統理論強調組織是相互關聯的整體,權變理論主張管理方式應隨情境調整,Z 理論則融合日式管理強調終身僱用與共識決策。故選 D。","options":{"A":"系統理論是輸入輸出。","B":"權變理論是因情境調整。","C":"Z理論偏團體參與(亦相關)。","D":"正確(本題答案)。鼓勵自發參與=Y理論。"},"sources":["新文京《護理行政》品質改善","華杏《護理行政學》PDCA與品管圈"]}},"106030-N2-57":{"quick":"培養5位N2進階N3、5W缺=When(時間)。","detail":{"background":"工作目標應含5W1H:Why(為何-提升品質)、What(做什麼-進階N3)、Who(誰-5位N2)、Where(哪裡)、When(何時)、How。「培養5位N2護理師完成進階至N3」——有Why、What、Who,但「缺少When(時間/期限)」(B正確)。故When(B)。","options":{"A":"Why有(提升品質)。","B":"正確(本題答案)。缺When(完成時間)。","C":"Where非此目標關鍵缺項。","D":"Who有(5位N2)。"},"sources":["新文京《護理行政》品質改善","華杏《護理行政學》PDCA與品管圈"]}},"107030-N2-77":{"quick":"品管圈「錯誤」=數據是唯一控制的指標。","detail":{"background":"品管圈是由基層同仁組成的小團體,運用品管手法自主改善工作場所的問題,其標準步驟依循戴明循環:先選定主題並擬定活動計畫、掌握現況與設定目標,接著解析原因、擬定並實施對策,再確認效果,最後將有效的做法標準化並檢討下一期主題。因此從計畫著手、實施對策後檢討、確認效果以利改進,三者都是正確的敘述。至於把數據視為唯一的控制指標則有偏差:品質除了可量化的數據,還包含病人的主觀感受、流程的合理性與同仁的可行性,過度依賴單一數字容易造成為了指標而做事,忽略了真正的照護品質。故選 D。","options":{"A":"品管圈先從計畫著手(對)。","B":"擬定對策實施檢討(對)。","C":"確認效果改進(對)。","D":"錯誤(本題答案)。數據非唯一控制指標。"},"sources":["新文京《護理行政》品質改善","華杏《護理行政學》PDCA與品管圈"]}},"107030-N2-78":{"quick":"病人排隊抱怨,品管中心第一步=定義問題找出差異。","detail":{"background":"品管中心解決問題的「第一步」=C「定義問題,找出排隊等候抽血情境與『預期的有多少差異』(界定問題與落差)」——先界定問題與現況落差,才能後續分析、找方案。A增加人力(未先界定)、B討論補償(未解決根本)、D腦力激盪發展方法(界定後)皆非第一步。故定義問題(C)。","options":{"A":"增加人力未先界定問題。","B":"討論補償未解決根本。","C":"正確(本題答案)。第一步定義問題找出差異。","D":"腦力激盪是界定後步驟。"},"sources":["新文京《護理行政》品質改善","華杏《護理行政學》PDCA與品管圈"]}},"109110-N2-59":{"quick":"效果(效能)目標=病人壓瘡發生率降低至閾值0.005%。","detail":{"background":"規劃改善的目標依評值標準分:效果/效能目標(outcome,病人結果指標,如壓瘡發生率)、過程/執行目標(執行率、落後率)。選項A「病人壓瘡發生率降低至閾值0.005%(病人結果)」=效果(效能)目標(A正確)。B經費執行率、C建置落後率、D完成率皆是「過程/執行」目標。故A。","options":{"A":"正確(本題答案)。壓瘡發生率(結果)=效果目標。","B":"經費執行率是過程目標。","C":"建置落後率是過程目標。","D":"完成率是過程目標。"},"sources":["新文京《護理行政》品質改善","華杏《護理行政學》PDCA與品管圈"]}},"110030-N2-67":{"quick":"品質改善優先項目=最高發生頻率。","detail":{"background":"品質改善的資源有限,選題時必須做取捨。最常用的判準是問題的發生頻率與影響程度,高頻率的問題累積起來的傷害與成本最大,改善之後的效益也最顯著,這正是柏拉圖與八十二十法則的應用邏輯。實務上的評價選題法會從重要性、迫切性、可行性與圈能力四個面向評分,但重要性與迫切性通常以發生頻率與嚴重度為主要依據。相對地,只挑最容易改善或花費最低的項目,容易流於做表面功夫,對整體品質提升有限;而選最困難的項目雖然企圖心強,卻可能因超出團隊能力而中途失敗,反而打擊士氣。故選 C。","options":{"A":"最困難改善非優先。","B":"最容易改善非優先依據。","C":"正確(本題答案)。最高發生頻率優先。","D":"最低花費非優先依據。"},"sources":["新文京《護理行政》品質改善","華杏《護理行政學》PDCA與品管圈"]}},"111030-N2-73":{"quick":"品質管理發展順序=QC→QA→TQC→TQM(1423)。本題答案B。","detail":{"background":"本題官方答案B(1423)。品質管理概念發展先後:1品質控制QC(quality control)→4品質保證QA→2全面品質管制TQC(total quality control)→3全面品質管理TQM(total quality management)。故順序「1423」(B)。核心:由檢驗管制(QC)→保證(QA)→全面管制(TQC)→全面管理(TQM,全員參與持續改善)。","options":{"A":"1234順序不符。","B":"正確(本題答案,1423)。QC→QA→TQC→TQM。","C":"2314不符。","D":"4132不符。"},"sources":["新文京《護理行政》品質改善","華杏《護理行政學》PDCA與品管圈"]}},"111030-N2-76":{"quick":"將危機管理納入品質模式=阿丹兒(Adair)的QUACERS。","detail":{"background":"品質管理模式:A「阿丹兒(Adair)的QUACERS」將「危機管理(Risk management)」納入品質管理模式(A正確,QUACERS含Quality/Utilization/Access/Cost/Effectiveness/Risk/Satisfaction等面向)。戴明PDCA、Donabedian SPO、ANA品質保證模式皆未特別納入危機管理。故Adair的QUACERS(A)。","options":{"A":"正確(本題答案)。QUACERS納入危機管理。","B":"戴明PDCA是改善循環。","C":"Donabedian SPO是結構過程結果。","D":"ANA品質保證模式未特別納危機。"},"sources":["新文京《護理行政》品質改善","華杏《護理行政學》PDCA與品管圈"]}},"113100-N2-49":{"quick":"品質管理正確=品質保證(QA)是依照標準。","detail":{"background":"品質管理:B「品質保證(quality assurance,QA)是依照『標準』(設定標準、評值是否達標)」正確。A「品質管理是追求『主管』滿意」錯(應追求病人/顧客滿意);C「石川馨提出TQM」敘述須對應(石川馨提出魚骨圖/品管圈);D「戴明提出全員參與品質保證」敘述須對應(戴明提PDCA)。故B。","options":{"A":"品質管理追求病人/顧客滿意,非主管。","B":"正確(本題答案)。品質保證依照標準。","C":"石川馨提出魚骨圖/品管圈。","D":"戴明提出PDCA。"},"sources":["新文京《護理行政》品質改善","華杏《護理行政學》PDCA與品管圈"]}},"113180-N2-38":{"quick":"滿意度提升到90%目標,5W缺=why。","detail":{"background":"訂定工作目標時常用 5W1H 檢核完整性:What 是要做什麼、Why 是為什麼要做、Who 是誰負責、When 是什麼時候完成、Where 是在哪裡執行、How 是用什麼方法達成。題目所寫的本年度各病房病人服務滿意度提升到百分之九十,其中本年度交代了時間、各病房交代了地點、滿意度提升到百分之九十交代了具體事項與衡量標準,但完全沒有說明為什麼要訂這個目標。缺少目的的目標容易流於為做而做,同仁不理解意義就難以投入,因此應補上例如為改善病人就醫經驗、回應近年滿意度調查下滑等理由。故選 A。","options":{"A":"正確(本題答案)。缺why(目的)。","B":"when有(本年度)。","C":"where有(各病房)。","D":"who非此目標關鍵缺項。"},"sources":["新文京《護理行政》品質改善","華杏《護理行政學》PDCA與品管圈"]}},"114030-N2-48":{"quick":"PDCA應用老人跌倒改善:Check=查核跌倒評估落實度及扶手使用率。","detail":{"background":"PDCA應用於老人跌倒品質改善:C「Check:查核跌倒評估的落實度及浴廁扶手使用率(查核成效)」正確。A「Plan:依事先計畫執行」錯(那是Do);B「Do:擬定計畫」錯(擬定計畫是Plan);D「Act:依跌倒原因採取行動方案」——Act是依查核結果標準化/再改善(D敘述偏Plan)。故C。","options":{"A":"依計畫執行是Do,非Plan。","B":"擬定計畫是Plan,非Do。","C":"正確(本題答案)。查核落實度與使用率=Check。","D":"依原因採行動偏Plan,Act是標準化。"},"sources":["新文京《護理行政》品質改善","華杏《護理行政學》PDCA與品管圈"]}},"115030-N2-36":{"quick":"培養3位N3短期出國培訓,5W1H缺=完成時間性。","detail":{"background":"以 5W1H 檢核這個目標:為提升臨床護理照護品質說明了目的,也就是 Why;培養三位 N3 護理師指出了對象與數量,也就是 Who 與 What;短期出國完成專科護理培訓交代了方法與地點,也就是 How 與 Where。唯獨沒有指出何時完成,缺少的是完成時間性,也就是 When。時限之所以重要,是因為沒有期限的目標無法排定進度、無法在期中檢視落後與否,也無從評值成效,通常應補上例如於本年度第三季前完成遴選、於年底前完成培訓等具體節點。其餘選項所指的困難度、具體性與共識性,在本目標中並非缺漏之處。故選 D。","options":{"A":"執行困難度非5W1H要素。","B":"目標具體性有(培養3位N3)。","C":"單位共識性非5W1H要素。","D":"正確(本題答案)。缺完成時間性(When)。"},"sources":["新文京《護理行政》品質改善","華杏《護理行政學》PDCA與品管圈"]}},"101030-N2-76":{"quick":"分析跌倒因素最適=樹狀圖?本題答案B。","detail":{"background":"分析跌倒這類多因素問題時,常用的工具是把問題由上而下逐層拆解。樹狀圖又稱系統圖,做法是把要解決的目標放在最左或最上,再往下展開第一層的大分類,例如病人因素、環境因素、照護流程與設備,接著每一層再細分,直到拆解出可以直接採取對策的具體項目為止,層層之間以線條或箭頭連結,呈現手段與目的的關係。這種結構化的展開方式,能確保不遺漏面向,也方便後續針對末端項目擬定改善措施。其餘工具用途不同:甘特圖排定各項工作的時程,矩陣圖比較兩組要素之間的關聯強弱,控制圖則用於監測製程或指標是否超出管制界限。故選 B。","options":{"A":"甘特圖是進度排程。","B":"正確(本題答案)。樹狀圖展開分析跌倒原因。","C":"矩陣圖是關係比較。","D":"控制圖是監測變異。"},"sources":["新文京《護理行政》品質管理工具","華杏《護理行政學》QC七手法"]}},"101110-N2-69":{"quick":"以箭頭表示過程問題因果關係=系統圖。","detail":{"background":"這題描述的關鍵是有系統地以箭頭層層展開,表達過程中問題產生的因果或手段目的關係,這正是系統圖的特徵。系統圖屬於品管新七大手法之一,也就是俗稱的樹狀圖,把要達成的目的放在起點,往右依序展開一次手段、二次手段,直到可執行的具體對策,每一層以箭頭串連,形成清楚的邏輯樹。其餘選項的用途完全不同:矩陣法以行列交叉的方式評估兩組因素之間的關聯;要徑法用於找出專案中不可延誤的關鍵路徑並計算最短完成時間;計畫評核術則以網狀圖搭配樂觀、最可能與悲觀三種時間估計來規劃進度。故選 B。","options":{"A":"矩陣法是關係比較。","B":"正確(本題答案)。箭頭表因果關係=系統圖。","C":"要逕法是排程。","D":"計畫評核術是排程。"},"sources":["新文京《護理行政》品質管理工具","華杏《護理行政學》QC七手法"]}},"102030-N2-66":{"quick":"以圖表表達結果與原因關係=魚骨圖。","detail":{"background":"品質工具:魚骨圖(cause-effect/fishbone,特性要因圖,以圖表表達『結果(特性)與原因(要因)』的關係)。題幹「以圖表表達結果與原因的關係」=魚骨圖(B正確)。甘特圖(進度)、矩陣圖、箭線圖皆非「結果與原因關係」。故魚骨圖(B)。","options":{"A":"甘特圖是進度排程。","B":"正確(本題答案)。結果與原因關係=魚骨圖。","C":"矩陣圖是關係比較。","D":"箭線圖是排程。"},"sources":["新文京《護理行政》品質管理工具","華杏《護理行政學》QC七手法"]}},"103030-N2-62":{"quick":"找出感染率問題的原因呈現=魚骨圖。","detail":{"background":"腦力激盪找出問題的各種可能原因後,最適合的呈現工具是特性要因圖,因外型像魚骨而俗稱魚骨圖。做法是把要探討的結果放在魚頭,主骨向左延伸,再依人員、方法、材料、機器與環境等大分類拉出大骨,每根大骨上再標註中骨與小骨,把腦力激盪蒐集到的原因逐一歸位。以降低感染率為題時,大骨可能是洗手遵從、無菌技術、器材消毒、環境清潔與人力配置,如此便能一目了然看出原因分布並找出重點。其餘工具的目的不同:甘特圖排程,派圖顯示各項目占整體的比例,直方圖呈現數據的分布形態。故選 D。","options":{"A":"甘特圖是進度排程。","B":"派圖是比例呈現。","C":"直方圖是次數分布。","D":"正確(本題答案)。找出原因=魚骨圖。"},"sources":["新文京《護理行政》品質管理工具","華杏《護理行政學》QC七手法"]}},"103030-N2-74":{"quick":"找出重要品管問題加以改善=柏拉圖。","detail":{"background":"品質工具:柏拉圖(Pareto,80/20法則,將問題依發生頻率排序、找出『重要少數(關鍵問題)』優先改善)。「找出重要品管問題加以改善」=柏拉圖(B正確)。查檢表(收集資料)、直方圖(分布)、推移圖(趨勢)皆非「找重要問題」。故柏拉圖(B)。","options":{"A":"查檢表是收集資料。","B":"正確(本題答案)。找重要問題=柏拉圖。","C":"直方圖是次數分布。","D":"推移圖是趨勢。"},"sources":["新文京《護理行政》品質管理工具","華杏《護理行政學》QC七手法"]}},"104100-N2-74":{"quick":"應用80/20找品質問題重要導因=柏拉圖。","detail":{"background":"柏拉圖的理論基礎是關鍵少數與瑣碎多數,也就是常說的八十二十法則:大約八成的問題來自兩成的原因。製作方式是把各項原因依發生次數由多到少排成長條圖,再加上一條累積百分比折線,當折線達到約八成時,對應的前幾項就是必須優先處理的重要導因。這讓有限的改善資源能集中在效益最大的地方。與其他工具的分工是:魚骨圖負責把所有可能原因窮舉出來,柏拉圖則在有了數據之後把原因排序並鎖定重點;直方圖呈現數據的分布形態,管制圖則監測指標是否穩定在管制界限內。故選 A。","options":{"A":"正確(本題答案)。80/20找重要導因=柏拉圖。","B":"魚骨圖是找各類原因。","C":"直方圖是次數分布。","D":"管制圖是監測變異。"},"sources":["新文京《護理行政》品質管理工具","華杏《護理行政學》QC七手法"]}},"105030-N2-74":{"quick":"針對異常事件找重要導因=柏拉圖。","detail":{"background":"針對異常事件找出重要導因,適用的是能排序並突顯重點的工具。柏拉圖把各類異常事件依發生次數由多到少排列,並疊上累積百分比曲線,一眼就能看出哪幾類事件占了大部分,例如把給藥異常再細分為劑量錯誤、病人辨識錯誤、時間延誤與漏給,便可鎖定占比最高的兩三項優先改善。其餘工具的角色不同:直方圖呈現單一變數的次數分布,用於觀察集中趨勢與離散程度;魚骨圖用於窮舉原因但不做量化排序;推移圖以時間為橫軸觀察指標的變化趨勢,適合追蹤改善前後的走勢。故選 D。","options":{"A":"直方圖是次數分布。","B":"魚骨圖是找各類原因。","C":"推移圖是趨勢。","D":"正確(本題答案)。找重要導因=柏拉圖。"},"sources":["新文京《護理行政》品質管理工具","華杏《護理行政學》QC七手法"]}},"106030-N2-76":{"quick":"柏拉圖「錯誤」=以查核表方式刪除極端案例。","detail":{"background":"柏拉圖(Pareto)原理:A統計發生次數找導因(對)、B應用80/20找改善策略(對)、D可用於點滴滴速控制失常改善(對,找主要失常原因)。選項C「以查核表方式刪除極端案例」錯誤(本題答案)——柏拉圖是「依頻率排序找重要少數」,非「刪除極端案例」(且查核表是另一工具)。故C。","options":{"A":"統計次數找導因(對)。","B":"80/20找改善策略(對)。","C":"錯誤(本題答案)。柏拉圖非刪除極端案例。","D":"可用於滴速控制改善(對)。"},"sources":["新文京《護理行政》品質管理工具","華杏《護理行政學》QC七手法"]}},"106030-N2-80":{"quick":"病人抱怨次數=平衡計分卡的顧客面。","detail":{"background":"平衡計分卡把績效衡量從單一的財務數字擴展為四個構面,彼此具有因果關係:員工學習與成長是基礎,員工的能力與士氣影響內部流程的效率與品質,良好的流程帶來顧客的滿意,顧客滿意最終反映在財務成果上。病人抱怨的次數直接反映服務對象的感受與忠誠度,屬於顧客面的指標,同一構面的其他指標還包括滿意度、回診率與轉介率。其餘構面的代表指標分別是:財務面看營收、成本與健保申報點值;內部流程面看等候時間、平均住院日與感染率;員工學習與成長面看在職教育時數、證照比率與離職率。故選 B。","options":{"A":"財務面是財務指標。","B":"正確(本題答案)。病人抱怨次數=顧客面。","C":"內部流程面是流程指標。","D":"員工學習成長面是員工發展。"},"sources":["新文京《護理行政》品質管理工具","華杏《護理行政學》QC七手法"]}},"106110-N2-60":{"quick":"80/20「錯誤」=運用關鍵的多數掌握重要的少數。","detail":{"background":"80/20原理(巴瑞多/柏拉圖):B義大利經濟學者提出(對)、C 20%投入得80%產出(對)、D巴瑞多原理(對)。選項A「運用關鍵的『多數』,就能掌握重要的『少數』」錯誤(本題答案)——80/20是「掌握『重要少數(關鍵的20%)』就能解決『瑣碎多數(80%)』的問題」,A把多數少數說反。故A。","options":{"A":"錯誤(本題答案)。應掌握重要少數,非關鍵多數。","B":"義大利經濟學者提出(對)。","C":"20%投入得80%產出(對)。","D":"巴瑞多原理(對)。"},"sources":["新文京《護理行政》品質管理工具","華杏《護理行政學》QC七手法"]}},"106110-N2-64":{"quick":"跌倒因夜間如廁無人扶持=人力問題。","detail":{"background":"改善之前必須先把原因歸類正確,才不會用錯對策。題幹描述病人夜間如廁時無人扶持而跌倒,問題的核心是需要協助的當下沒有人力可以到位,屬於人力問題,對應的改善方向包括夜班人力配置、預防跌倒高危病人的巡視頻率、床邊呼叫鈴的可及性與家屬陪伴的安排。若歸類錯誤就會做錯事:技術問題指的是護理人員執行某項技術的正確性不足;營運問題涉及制度、流程與成本結構;設備問題則是硬體不足或故障,例如床欄損壞、廁所無扶手或照明不良。同一起跌倒事件常同時存在多類原因,但本題所指的無人扶持明確落在人力面。故選 A。","options":{"A":"正確(本題答案)。無人扶持=人力問題。","B":"技術問題是技能不足。","C":"營運問題是經營面。","D":"設備問題是設施。"},"sources":["新文京《護理行政》品質管理工具","華杏《護理行政學》QC七手法"]}},"106110-N2-76":{"quick":"「篩選最省錢易執行的解決方案」屬後續的「方案選擇」階段，不是資料收集整理階段應做的工作，故選A。","detail":{"background":"本題官方答案C。品管專員為解決「抽血等候時間過長」,實地勘查收集資料後,依問題解決過程分析資料:C「依資料『時間順序』排列,找出等候過程與時間的關聯(找出哪個環節耗時)」最適當。A篩選最省錢方案(過早)、B依人事時地物分類(可,但本題以C為正解)、D用魚骨圖整理因果(後續)。核心:等候時間問題應先分析「時間流程」找瓶頸。故C。","options":{"A":"正解(非此階段)：篩選解決方案屬方案選擇階段。","B":"依人事時地物分類整理，屬此階段。","C":"依時間順序排列找等候關聯，屬此階段。","D":"用魚骨圖整理因果關係，屬此階段。"},"sources":["新文京《護理行政》品質管理工具","華杏《護理行政學》QC七手法"]}},"106110-N2-77":{"quick":"新七手法「不適用」=柏拉圖(柏拉圖屬舊七手法)。","detail":{"background":"品管工具分為舊七大手法與新七大手法,兩者的適用時機不同。舊七大手法以量化數據為主,包括查檢表、柏拉圖、特性要因圖、層別法、散布圖、直方圖與管制圖,主要用於現況掌握與原因分析。新七大手法處理的是語言性、非量化的資訊,包括親和圖、關聯圖、系統圖、矩陣圖、矩陣資料解析法、過程決策計畫圖與箭線圖,適合在找出原因之後用來規劃對策。題目要在找出根本原因後研擬改善策略,關聯圖、系統圖與矩陣圖都屬新七大手法,而柏拉圖屬於舊七大手法且功能在排序原因而非發想對策。故選 B。","options":{"A":"關聯圖是新七手法。","B":"正確(本題答案)。柏拉圖是舊七手法,非新七手法。","C":"系統圖是新七手法。","D":"矩陣圖是新七手法。"},"sources":["新文京《護理行政》品質管理工具","華杏《護理行政學》QC七手法"]}},"107030-N2-79":{"quick":"找跌倒超閾值導因「不適用」=管制圖。","detail":{"background":"找出「跌倒發生率超閾值之『導因』」可用:B魚骨圖(找原因)、C查檢表(收集資料)、D柏拉圖(找重要導因)。選項A「管制圖(control chart)」不適用(本題答案)——管制圖是「監測指標是否在『控制範圍內(變異監測)』」,非「找導因」。故管制圖(A)。","options":{"A":"正確(本題答案)。管制圖是監測變異,非找導因。","B":"魚骨圖找原因(適用)。","C":"查檢表收集資料(適用)。","D":"柏拉圖找重要導因(適用)。"},"sources":["新文京《護理行政》品質管理工具","華杏《護理行政學》QC七手法"]}},"108020-N2-59":{"quick":"不符80/20原理=只要掌握80%結果由20%原因造成就能解決「全部」。","detail":{"background":"巴瑞多80/20原理:A原因結果/投入產出/努力報酬間不成正比(對)、B多數付出只造少許影響、少數付出造主要影響(對)、C強調重要少數與瑣碎多數(對)。選項D「只要掌握80%的結果是由那20%原因造成的就能解決『全部』」不符(本題答案)——80/20是「掌握關鍵20%可解決『主要(80%)』問題」,非「解決全部」(D誇大為全部)。故D。","options":{"A":"原因結果不成正比(對)。","B":"少數付出造主要影響(對)。","C":"重要少數瑣碎多數(對)。","D":"不符(本題答案)。非解決「全部」,是主要部分。"},"sources":["新文京《護理行政》品質管理工具","華杏《護理行政學》QC七手法"]}},"108020-N2-80":{"quick":"分析跌倒因素最適=樹狀圖。本題答案B。","detail":{"background":"跌倒的成因牽涉病人本身、環境設施、照護流程與藥物等多個層面,分析時需要一個能把大方向逐層拆細的工具。樹狀圖的做法是把跌倒放在起點,先展開第一層的主要面向,再往下逐層細分,例如病人因素之下可分為年齡、意識狀態、步態不穩、視力不良與如廁需求,環境因素之下可分為地面濕滑、照明不足、床欄與扶手,直到每個末端都是可以直接下對策的具體項目為止。這種展開方式同時適用於分析原因與規劃對策,是新七大手法中最常被使用的一種。其餘工具分別用於排程、比較兩組因素的關聯與監測指標變異。故選 B。","options":{"A":"甘特圖是排程。","B":"正確(本題答案)。樹狀圖分析跌倒因素。","C":"矩陣圖是關係比較。","D":"控制圖是監測。"},"sources":["新文京《護理行政》品質管理工具","華杏《護理行政學》QC七手法"]}},"108110-N2-80":{"quick":"降MDRO對策「每位...」用稽核表。本題答案D。","detail":{"background":"本題官方答案D(稽核表)。降低多重抗藥性微生物(MDRO)發生率,改善對策「每位(護理師執行手部衛生等)」的『落實度查核』→用稽核表(Check Sheet,查核執行是否落實)。魚骨圖(找原因)、甘特圖(排程)、直方圖(分布)皆非「查核落實」。故稽核表(D)。","options":{"A":"魚骨圖是找原因。","B":"甘特圖是排程。","C":"直方圖是分布。","D":"正確(本題答案)。查核落實=稽核表。"},"sources":["新文京《護理行政》品質管理工具","華杏《護理行政學》QC七手法"]}},"109110-N2-73":{"quick":"平衡計分卡管理構面=財務面、顧客面、內部流程、員工學習與成長。","detail":{"background":"平衡計分卡由柯普朗與諾頓提出,主張組織不能只看落後的財務數字,而應同時從四個構面衡量績效:財務面回答股東或經營者關心的收支與成本;顧客面回答服務對象如何看待我們,包括滿意度與抱怨件數;內部流程面回答我們必須把哪些流程做好,例如等候時間與感染率;員工學習與成長面回答我們如何持續進步,包括教育訓練與人才留任。四者由下而上具有因果鏈的關係。其餘選項屬於不同的管理工具:優勢劣勢機會威脅是情境分析用的架構,而目標設定、行動規劃、自我控制與成果評值則是目標管理的步驟。故選 A。","options":{"A":"正確(本題答案)。財務/顧客/內部流程/學習成長=BSC四構面。","B":"優劣勢機會威脅是SWOT。","C":"有形無形資產非BSC構面。","D":"目標設定行動規劃是MBO。"},"sources":["新文京《護理行政》品質管理工具","華杏《護理行政學》QC七手法"]}},"109110-N2-79":{"quick":"監測給藥異常是否在控制範圍=管制圖。","detail":{"background":"品質工具:管制圖(control chart)用於「監測指標(如給藥異常發生率)是否在『控制範圍內(上下管制界限)』、偵測異常變異」(A正確)。系統圖(因果展開)、柏拉圖(找重要導因)、特性要因圖(魚骨圖找原因)皆非「監測控制範圍」。故管制圖(A)。","options":{"A":"正確(本題答案)。監測是否在控制範圍=管制圖。","B":"系統圖是因果展開。","C":"柏拉圖是找重要導因。","D":"特性要因圖是找原因。"},"sources":["新文京《護理行政》品質管理工具","華杏《護理行政學》QC七手法"]}},"110030-N2-80":{"quick":"平衡計分卡「錯誤」=包含「品質構面」(BSC是財務顧客流程學習,非品質構面)。","detail":{"background":"平衡計分卡(BSC):B是績效評核指標的管理工具(對)、C以願景策略訂可衡量指標(對)、D可作與員工溝通的工具(對)。選項A「包含『品質構面』、顧客、內部流程、學習與成長4項構面」錯誤(本題答案)——BSC四構面是「『財務』、顧客、內部流程、學習與成長」,第一項是『財務面』非『品質構面』。故A。","options":{"A":"錯誤(本題答案)。BSC第一構面是財務面,非品質構面。","B":"BSC是績效評核工具(對)。","C":"依願景策略訂指標(對)。","D":"可作員工溝通工具(對)。"},"sources":["新文京《護理行政》品質管理工具","華杏《護理行政學》QC七手法"]}},"111030-N2-57":{"quick":"柏拉圖80/20正確=日常事務中緊急且重要只占少數。","detail":{"background":"柏拉圖80/20法則:C「日常事務中,緊急且重要的只占少數(關鍵少數)」正確(80/20=少數關鍵造成多數結果)。A「把握關鍵『多數』獲得重要『少數』」錯(應把握關鍵少數);B「投入時間越多成果越大」錯(非線性正比);D「掌握80%時間解決20%問題」錯(應掌握20%關鍵解決80%問題)。故C。","options":{"A":"應把握關鍵少數,非多數。","B":"非線性正比。","C":"正確(本題答案)。緊急且重要只占少數。","D":"應掌握20%關鍵解決80%問題。"},"sources":["新文京《護理行政》品質管理工具","華杏《護理行政學》QC七手法"]}},"111110-N2-72":{"quick":"分析問題發生原因最適=魚骨圖。","detail":{"background":"要分析問題為什麼發生,需要的是能把原因分門別類窮舉出來的工具,魚骨圖正是為此設計。它把問題放在魚頭,再依人員、方法、機器、材料與環境等大分類拉出主要骨幹,團隊透過腦力激盪把想到的原因掛在對應的骨幹上,並可繼續往下追問為什麼而延伸出更細的小骨,直到觸及可著手的層次。其餘工具的功能不同:趨勢圖以時間為橫軸觀察指標的變化走勢,適合看改善前後的差異;矩陣圖用行列交叉評估兩組要素之間的關聯強弱;散布圖則檢視兩個變數之間是否存在相關,三者都不是用來窮舉原因的。故選 D。","options":{"A":"趨勢圖是時間趨勢。","B":"矩陣圖是關係比較。","C":"散布圖是相關分析。","D":"正確(本題答案)。分析原因=魚骨圖。"},"sources":["新文京《護理行政》品質管理工具","華杏《護理行政學》QC七手法"]}},"112110-N2-74":{"quick":"分析儀器設備問題的因果關係=魚骨圖。","detail":{"background":"探討儀器設備使用上的問題並釐清因果關係,適合使用特性要因圖。以設備問題為主題時,魚骨的主幹可以設定為機器本身、使用人員、操作方法、維護保養與使用環境:機器面可能是機型老舊、功能不符需求或介面複雜;人員面可能是新進同仁未受訓、輪調頻繁;方法面可能是操作手冊不完整或步驟不一致;維護面可能是保養週期過長或故障報修流程冗長;環境面可能是插座不足或存放位置不便。逐項展開後即可看出問題集中在哪個骨幹。其餘工具的用途分別是看趨勢、看流程步驟與比較數量大小。故選 D。","options":{"A":"趨勢圖是時間趨勢。","B":"流程圖是流程步驟。","C":"長條圖是數量比較。","D":"正確(本題答案)。分析因果關係=魚骨圖。"},"sources":["新文京《護理行政》品質管理工具","華杏《護理行政學》QC七手法"]}},"101110-N2-76":{"quick":"藥局少配藥即時發現=幾近錯失(near miss)。","detail":{"background":"異常事件類型:幾近錯失/跡近錯失(near miss,錯誤被『及時發現、未真正發生』於病人)、不良事件(已發生造成傷害)、警訊事件(嚴重)。「藥局少配降壓藥、護理師發現後即打電話(未給病人)」=幾近錯失(C正確)。故near miss(C)。","options":{"A":"意外事件已發生。","B":"醫療錯誤是已發生的錯誤。","C":"正確(本題答案)。即時發現未到病人=幾近錯失。","D":"不良事件已造成傷害。"},"sources":["新文京《護理行政》病人安全","華杏《護理行政學》異常事件與通報"]}},"104100-N2-62":{"quick":"評核給藥過程、檢體採集運送流程=病人安全。","detail":{"background":"給藥流程與檢體採集運送流程,共同的特徵是只要中間任何一個環節出錯,傷害就會直接落在病人身上:給錯藥可能造成過敏、劑量錯誤或治療延誤;檢體貼錯標籤或運送延誤,會導致錯誤的診斷與治療。因此定期評核這些作業流程,核心關注的是病人安全,屬於病人安全的業務範疇,常見的稽核重點包括三讀五對與兩種以上身分辨識、高警訊藥品的雙人核對、檢體容器的標示與時效控管。其餘選項的重點不同:員工福利關注薪資與工作條件,人員管理著重排班與績效,教育訓練則聚焦知識與技能的提升。故選 A。","options":{"A":"正確(本題答案)。給藥檢體流程=病人安全。","B":"員工福利是福利面。","C":"人員管理是人力面。","D":"教育訓練是訓練面。"},"sources":["新文京《護理行政》病人安全","華杏《護理行政學》異常事件與通報"]}},"106110-N2-79":{"quick":"藥物退回未發給病人=跡近錯失(near miss)。","detail":{"background":"病人安全事件依是否到達病人與造成的傷害程度分級。跡近錯失指錯誤在到達病人之前就被攔截,病人完全沒有接觸到,例如藥物在給藥前被核對出來而退回藥局重配;無傷害事件則是錯誤已經執行到病人身上,只是幸運沒有造成傷害,例如藥已經給下去但劑量差異未引起反應;不良事件是已造成傷害;警訊事件則是導致死亡或重大永久失能的嚴重事件,必須立即啟動根本原因分析。本題的關鍵字是錯誤藥物尚未發給病人使用,代表在最後一道防線被攔下,屬跡近錯失。這類事件雖無傷害,仍應通報以找出系統漏洞。故選 C。","options":{"A":"意外事件已發生。","B":"哨兵(警訊)事件是嚴重已發生。","C":"正確(本題答案)。未發給病人=跡近錯失。","D":"無傷害事件是已到病人但無傷害。"},"sources":["新文京《護理行政》病人安全","華杏《護理行政學》異常事件與通報"]}},"106111-N2-1":{"quick":"異常事件通報「錯誤」=多為個人疏失應予懲處。","detail":{"background":"病人安全通報制度能否運作,取決於同仁願不願意說出來。因此國際上一致採取非懲罰性的原則,建立通報後不追究個人責任的保護機制,並輔以匿名或去識別化的設計,讓通報者不必擔心後果;通報進來的事件則以根本原因分析深入探究系統層面的缺失,例如流程設計、標示方式、人力配置與溝通斷點,再據以改善;同時鼓勵參與全國性的病人安全通報系統,使各院能從他院的經驗中學習。若把事件歸咎於個人疏失並予以懲處,同仁自然選擇隱匿不報,系統將永遠看不到真正的風險,這與通報制度的設計目的背道而馳。故選 C。","options":{"A":"營造通報文化(對)。","B":"進行根本原因分析(對)。","C":"錯誤(本題答案)。應非懲罰性、找系統根因,非懲處個人。","D":"鼓勵參與通報系統(對)。"},"sources":["新文京《護理行政》病人安全","華杏《護理行政學》異常事件與通報"]}},"106111-N2-75":{"quick":"兒子質疑打胰島素護理師查證=跡近錯失(near miss)。","detail":{"background":"護理師準備打胰島素,病人兒子質疑「我媽沒糖尿病、血糖正常,為何打胰島素?」——若護理師因此查證而『未誤打』,屬跡近錯失(near miss,錯誤被攔截未到病人)(B正確)。給藥錯誤(已誤給)、不可逆事件、醫療過失皆非「被攔截未發生」。故跡近錯失(B)。","options":{"A":"給藥錯誤是已誤給。","B":"正確(本題答案)。被質疑攔截未誤打=跡近錯失。","C":"不可逆事件非此。","D":"醫療過失是已造成傷害。"},"sources":["新文京《護理行政》病人安全","華杏《護理行政學》異常事件與通報"]}},"107030-N2-76":{"quick":"氧氣面罩未開臉發黑:立即調整氧氣流量並通知醫生。","detail":{"background":"護理長在巡房時發現病人臉色發黑而氧氣面罩開關未開,眼前正在發生的是缺氧,任何教育或管理作為都必須讓位給立即的救命處置。正確做法是立刻打開氧氣並調整到正確流量、評估病人的意識、呼吸型態與血氧飽和度,同時通知醫師並視情況啟動急救。教育與檢討不是不做,而是時序問題:應等病人狀況穩定之後,再以不指責的方式與該護理師討論事發經過,查明是設備操作不熟、交班遺漏還是流程缺失,並依醫院規定通報異常事件以進行系統性改善。當場嚴厲糾正不但延誤病人處置,也會傷害同仁的自尊與後續的通報意願。故選 D。","options":{"A":"當面教導非當下優先。","B":"嚴肅糾正非當下優先。","C":"列入考核非當下處置。","D":"正確(本題答案)。立即調整氧氣流量並通知醫生。"},"sources":["新文京《護理行政》病人安全","華杏《護理行政學》異常事件與通報"]}},"110110-N2-79":{"quick":"醫療糾紛「錯誤」=任何醫療行為均有風險故無法預防糾紛。","detail":{"background":"醫療糾紛:A醫療過程方式結果收費或態度不好所致紛爭(對)、C重大糾紛後應做根本原因分析改正(對)、D可能來自醫病/護病溝通不良(對)。選項B「任何醫療行為均有風險,因此『無法預防』醫療糾紛」錯誤(本題答案)——醫療糾紛「可透過良好溝通、品質改善、風險管理『預防/減少』」,非無法預防。故B。","options":{"A":"糾紛來自過程結果態度(對)。","B":"錯誤(本題答案)。醫療糾紛可預防減少,非無法預防。","C":"重大糾紛後做RCA(對)。","D":"可能來自溝通不良(對)。"},"sources":["新文京《護理行政》病人安全","華杏《護理行政學》異常事件與通報"]}},"111030-N2-63":{"quick":"非預期死亡或永久性功能喪失=警訊事件(sentinel event)。","detail":{"background":"異常事件:警訊事件/哨兵事件(sentinel event,造成『非預期死亡或永久性功能喪失』等嚴重後果的事件)。題幹描述=警訊事件(A正確)。意外事件、跡近錯失(未到病人)、醫療不良事件(已傷害但未必嚴重至此)皆非「非預期死亡/永久功能喪失」。故警訊事件(A)。","options":{"A":"正確(本題答案)。非預期死亡/永久功能喪失=警訊事件。","B":"意外事件較廣泛。","C":"跡近錯失未到病人。","D":"醫療不良事件未必嚴重至此。"},"sources":["新文京《護理行政》病人安全","華杏《護理行政學》異常事件與通報"]}},"111110-N2-63":{"quick":"「不」屬警訊事件=病人跌倒無受傷。","detail":{"background":"警訊事件(sentinel event,嚴重的非預期事件):A嬰兒失竊、C病人自殺未死亡、D手術部位錯誤——皆屬警訊事件。選項B「病人跌倒『無受傷』」不屬警訊事件(本題答案)——無傷害的跌倒屬「無傷害事件/跡近錯失」,非嚴重的警訊事件。故B。","options":{"A":"嬰兒失竊是警訊事件。","B":"正確(本題答案)。跌倒無受傷非警訊事件。","C":"自殺未死亡是警訊事件。","D":"手術部位錯誤是警訊事件。"},"sources":["新文京《護理行政》病人安全","華杏《護理行政學》異常事件與通報"]}},"111110-N2-74":{"quick":"腦術後7天轉出病人有壓傷感染無人照顧,查證重點=123。本題答案A。","detail":{"background":"本題官方答案A(123)。評鑑查證腦部手術後病人(尾骶骨壓傷、傷口感染、無人照顧):1加護病房預防壓傷之措施、2(傷口感染照護)、3(照護人力/陪伴)等查證重點。選項4...非重點。核心:以病人實際問題追蹤查證相關照護措施(PFM)。作答以官方A為準。","options":{"A":"正確(本題答案,123)。預防壓傷、傷口感染照護等查證重點。","B":"124不符。","C":"234不符。","D":"134不符。"},"sources":["新文京《護理行政》病人安全","華杏《護理行政學》異常事件與通報"]}},"112030-N2-62":{"quick":"病安異常事件通報系統最適=建立非懲罰性通報制度。","detail":{"background":"病人安全異常事件通報系統的建置:A「建立『非懲罰性』通報制度(鼓勵誠實通報、找系統根因)」最適宜。B「作為醫療糾紛佐證」、C「提供責任釐清參考」、D「作為部門溝通依據」皆非通報系統的目的(通報是為『學習改善、預防再發生』,非究責)。故非懲罰性通報(A)。","options":{"A":"正確(本題答案)。建立非懲罰性通報制度。","B":"非作醫療糾紛佐證。","C":"非為責任釐清。","D":"非部門溝通依據。"},"sources":["新文京《護理行政》病人安全","華杏《護理行政學》異常事件與通報"]}},"112110-N2-77":{"quick":"風險管理事前分析=失效模式與效應分析(FMEA)。","detail":{"background":"醫療風險管理工具:FMEA(failure mode and effects analysis,失效模式與效應分析)是「『事前(預應式)』分析」——在錯誤發生前,前瞻性找出可能的失效模式並預防。RCA(根本原因分析,事後)、PDCA、個案報告皆非「事前分析」。故FMEA(A)。","options":{"A":"正確(本題答案)。FMEA是事前(預應式)分析。","B":"RCA是事後分析。","C":"PDCA是改善循環。","D":"個案報告非事前分析。"},"sources":["新文京《護理行政》病人安全","華杏《護理行政學》異常事件與通報"]}},"112180-N2-40":{"quick":"病人安全通報系統主要目的=預防錯誤再發生。","detail":{"background":"病人安全通報系統的設計初衷,是把個別的錯誤轉化為整個組織的學習資產。事件通報進來之後,經由分析找出系統層面的缺失並提出改善對策,再把經驗分享出去,使同樣的錯誤不會在別的單位或別的時間重演,因此主要目的是預防錯誤再發生。其餘選項或是手段、或與目的相悖:資訊公開透明是推動通報文化的一環,但不是目的本身;方便介入調查只是流程中的環節;而釐清責任歸屬更是與通報精神相衝突,一旦通報被用來究責,同仁便會選擇隱匿,系統將失去看見風險的能力,這也是各國都採非懲罰性設計的原因。故選 C。","options":{"A":"資訊公開非主要目的。","B":"釐清責任非通報目的(非懲罰性)。","C":"正確(本題答案)。主要目的=預防錯誤再發生。","D":"方便調查非主要目的。"},"sources":["新文京《護理行政》病人安全","華杏《護理行政學》異常事件與通報"]}},"113030-N2-3":{"quick":"病人安全正確=感覺功能障礙者須注意用熱導致溫度傷害。","detail":{"background":"病人安全:D「感覺功能障礙者須注意『用熱』導致的溫度傷害(感覺差易燙傷)」正確。A「給藥錯誤屬物理性傷害」錯(給藥錯誤是『用藥/化學』相關);B「跌倒屬化學性傷害」錯(跌倒是『物理性』傷害);C「照護老年人或使用鎮定劑病人應給予約束」錯(約束應有醫囑與評估,非常規給予)。故D。","options":{"A":"給藥錯誤非物理性傷害。","B":"跌倒是物理性傷害,非化學。","C":"約束須醫囑評估,非常規。","D":"正確(本題答案)。感覺障礙者注意用熱溫度傷害。"},"sources":["新文京《護理行政》病人安全","華杏《護理行政學》異常事件與通報"]}},"114100-N2-40":{"quick":"及時介入使意外未發生=跡近錯失(near miss)。","detail":{"background":"病人安全事件的分級以錯誤是否到達病人為分水嶺。跡近錯失的定義是錯誤已經發生,但因為及時被發現與介入而未真正影響到病人,例如核對時發現藥物有誤而攔下、輸血前的雙人核對發現血型不符而終止。這類事件雖然沒有造成任何傷害,卻是最有價值的通報來源,因為它揭露了系統中的漏洞,同時也顯示現有的攔截機制發揮了作用。其餘選項的嚴重度都更高:意外事件與醫療不良事件都是錯誤已經作用在病人身上並造成非預期的傷害,警訊事件則是造成死亡或重大永久性失能,必須立即啟動根本原因分析。故選 C。","options":{"A":"警訊事件是嚴重已發生。","B":"意外事件是已發生。","C":"正確(本題答案)。及時介入未發生=跡近錯失。","D":"醫療不良事件是已傷害。"},"sources":["新文京《護理行政》病人安全","華杏《護理行政學》異常事件與通報"]}},"114100-N2-45":{"quick":"病安通報系統發展概念「不包含」=釐清責任歸屬。","detail":{"background":"病人安全通報系統建構時的核心概念,是把焦點從人轉移到系統。因此設計上必須鼓勵通報,降低通報的門檻與心理負擔;通報進來的事件要進行原因分析,找出流程、環境、設備與溝通上的缺陷並加以改善,以防止同類錯誤再發生;同時建立學習與資訊分享的平台,讓其他單位甚至其他醫院都能從中學習。釐清責任歸屬則不在通報系統的概念之內,它屬於人事或法律程序的範疇,若把兩者混為一談,同仁會擔心通報等於自首而選擇隱匿,系統將失去發現風險的功能,這也是各國一致採取非懲罰性設計的理由。故選 A。","options":{"A":"正確(本題答案)。釐清責任歸屬非通報系統概念。","B":"分析原因防再發生(是概念)。","C":"鼓勵通報(是概念)。","D":"建構學習分享平台(是概念)。"},"sources":["新文京《護理行政》病人安全","華杏《護理行政學》異常事件與通報"]}},"114100-N2-49":{"quick":"根本原因分析(RCA)最適當=組織一個小組進行分析。","detail":{"background":"根本原因分析(RCA):C「組織一個『小組』進行分析(團隊跨領域分析事件根因)」最適當。A「屬預應式系統分析」錯(RCA是『事後/回溯式』,FMEA才是預應式);B「主要分析近端原因」錯(RCA分析『根本/遠端』原因);D「應用於風險評估三至四級事件」——RCA用於嚴重事件(風險高的事件)。故C。","options":{"A":"RCA是事後回溯式,非預應式。","B":"RCA分析根本原因,非近端。","C":"正確(本題答案)。RCA組織小組進行分析。","D":"RCA用於嚴重事件。"},"sources":["新文京《護理行政》病人安全","華杏《護理行政學》異常事件與通報"]}},"114170-N2-45":{"quick":"病人毆打護理師通報TPR=傷害行為事件。","detail":{"background":"台灣病人安全通報系統把異常事件分為數個類別,包括藥物、跌倒、手術、輸血、醫療照護、公共意外、治安與傷害行為等。傷害行為事件指的是言語或肢體暴力、騷擾、自傷或攻擊他人等行為,對象可能是病人自己、其他病人、家屬或醫療人員。本題中病人與母親在病房內爭吵,並出手毆打前來勸架的護理師,屬於病人對醫護人員施加的肢體暴力,歸類為傷害行為事件。處理上除了確保現場人員安全、必要時通報警衛或警察並協助受傷同仁驗傷,也應通報系統以統計分析並檢討病房的暴力防範措施。故選 C。","options":{"A":"治安事件偏一般治安。","B":"其他事件非特定。","C":"正確(本題答案)。毆打護理師=傷害行為事件。","D":"公共意外事件非暴力行為。"},"sources":["新文京《護理行政》病人安全","華杏《護理行政學》異常事件與通報"]}},"115030-N2-41":{"quick":"COVID確診病人持刀傷護理師=傷害行為事件。","detail":{"background":"職場暴力事件的通報分類,依行為的性質而非病人的疾病別來判定。COVID-19 確診住院病人持刀傷害護理師,是對醫療人員施加的肢體暴力,屬於傷害行為事件,與病人是否為傳染病個案無關。處理原則是先確保現場人員的人身安全,撤離並隔離現場、通報警衛與警察,同時兼顧感染管制的防護,再協助受傷同仁就醫驗傷與心理支持,並依規定通報異常事件以檢討防範措施。其餘分類的適用情境不同:醫療照護事件指診療過程中的疏失,公共意外事件指設施或環境造成的意外,治安事件則多指偷竊、財物損失等非針對人身的違法行為。故選 D。","options":{"A":"醫療照護事件是照護相關。","B":"公共意外事件非暴力。","C":"治安事件偏一般治安。","D":"正確(本題答案)。持刀傷護理師=傷害行為事件。"},"sources":["新文京《護理行政》病人安全","華杏《護理行政學》異常事件與通報"]}},"103100-N2-70":{"quick":"醫院環境危害因素「錯誤」=金屬因素。","detail":{"background":"職業衛生把工作場所的危害因子分為四大類。物理性危害包括輻射、噪音、振動、高低溫、照明不足與氣壓變化;化學性危害涵蓋消毒劑、麻醉廢氣、細胞毒性藥物與各種有機溶劑;生物性危害指血液體液中的病原微生物與空氣傳染的病原;人因工程與心理社會危害則包括搬運姿勢造成的肌肉骨骼傷害、輪班、工作負荷與職場暴力。醫院環境的危害評估即依此四類架構進行。所謂金屬因素並不是這套分類中的類別,金屬若造成危害,例如汞或重金屬暴露,會歸類於化學性危害之下。故選 C。","options":{"A":"化學因素是危害分類。","B":"物理因素是危害分類。","C":"正確(本題答案)。金屬因素非標準危害分類。","D":"生物因素是危害分類。"},"sources":["新文京《護理行政》環境安全","華杏《護理行政學》災害防護與消防"]}},"106110-N2-4":{"quick":"火災濃煙密布第一時間=進行病人疏散。","detail":{"background":"病房確定發生火災且濃煙密布時,第一時間應「進行病人疏散(B)」——RACE原則中,確認火災且危急時優先「救援/疏散病人(Rescue)」確保生命安全。A關氧氣電器(Confine之一,但救人優先)、C打開門窗(會助燃、引入更多氧氣)、D拿滅火器(火大濃煙時應先撤離)皆非第一優先。故進行病人疏散(B)。","options":{"A":"關氧氣電器非第一優先(救人優先)。","B":"正確(本題答案)。濃煙密布優先疏散病人。","C":"打開門窗會助燃。","D":"火大濃煙應先撤離,非滅火。"},"sources":["新文京《護理行政》環境安全","華杏《護理行政學》災害防護與消防"]}},"108110-N2-18":{"quick":"地震處理「錯誤」=疏散先抬無法行動者其次能行動者。","detail":{"background":"醫院地震預防處理:A衛教遇地震不靠近窗戶、B床頭燈上方勿放花瓶罐子、D氣體鋼瓶鎖鍊固定化學藥品防震分類存放。選項C「疏散病人,『先』將無法行動者抬離,其次協助能行動者」錯誤(本題答案)——疏散原則應「先疏散『能自行行動者』(快速離開)、後協助『無法行動者』」,C順序顛倒。故C。","options":{"A":"遇地震不靠近窗戶(對)。","B":"床頭勿放花瓶罐子(對)。","C":"錯誤(本題答案)。疏散應先能行動者,後無法行動者。","D":"鋼瓶固定藥品防震分類(對)。"},"sources":["新文京《護理行政》環境安全","華杏《護理行政學》災害防護與消防"]}},"109030-N2-3":{"quick":"病人安全措施=火災演練(1)+乾洗手(3)+條碼(4)?本題答案B「134」。","detail":{"background":"病人安全的措施設計,重點在於防範最常見且傷害最大的風險。定期舉辦防災演練,確保火災或地震時能依既定動線疏散行動不便的住院病人,屬於環境與公共安全;在公共空間放置乾洗手液,可提高醫護、病人與訪客的手部衛生執行率,直接降低院內感染;運用條碼技術在給藥前掃描病人手圈與藥袋,由系統核對是否為正確病人與正確藥物,是防範給藥錯誤最有效的科技防錯設計。相對地,嚴格限制訪客並非病人安全的核心措施,適度的探視有助病人身心,除傳染病防疫期間外不宜過度限縮;地板定時打蠟反而使地面濕滑,增加跌倒風險。故選 B。","options":{"A":"123含2(嚴格限制訪客)不符。","B":"正確(本題答案,134)。火災演練、乾洗手、條碼。","C":"234含2不符。","D":"245不符。"},"sources":["新文京《護理行政》環境安全","華杏《護理行政學》災害防護與消防"]}},"110030-N2-9":{"quick":"火災RACE原則A=啟動警報系統通知消防。","detail":{"background":"RACE火災應變原則:R(Rescue,救援/移開病人)、A(Alarm,啟動警報系統、通知消防)、C(Confine,侷限火煙、關門)、E(Extinguish/Evacuate,滅火/疏散)。「A」=啟動警報系統通知消防單位(B正確)。故A=Alarm(B)。","options":{"A":"關電器是Confine。","B":"正確(本題答案)。A=啟動警報通知消防(Alarm)。","C":"移開病人是Rescue(R)。","D":"使用滅火器是Extinguish(E)。"},"sources":["新文京《護理行政》環境安全","華杏《護理行政學》災害防護與消防"]}},"110110-N2-14":{"quick":"滅火器「錯誤」=燃紙火災適用二氧化碳滅火器。","detail":{"background":"火災種類與滅火器:A配電盤(電氣火災)用二氧化碳(對)、B實驗室鎂(金屬火災)用乾粉(對)、C油漆(油類)用泡沫(對)。選項D「燃紙(普通固體A類火災)用二氧化碳滅火器」錯誤(本題答案)——燃紙(A類普通火災)應用「水或乾粉/泡沫」,二氧化碳(主要用於電氣/油類)對A類固體火災效果差(易復燃)。故D。","options":{"A":"電氣火災用二氧化碳(對)。","B":"金屬火災用乾粉(對)。","C":"油類火災用泡沫(對)。","D":"錯誤(本題答案)。燃紙(A類)不宜用二氧化碳。"},"sources":["新文京《護理行政》環境安全","華杏《護理行政學》災害防護與消防"]}},"110110-N2-15":{"quick":"輻射防護正確=操作人員須隨時戴感光片定期追蹤輻射量。","detail":{"background":"輻射防護:C「操作人員須隨時戴上感光片(劑量佩章),並定期追蹤所接受輻射量」正確。A「短時間多次照護」錯(輻射防護三原則是『時間短、距離遠、屏蔽』,應減少暴露時間);B「強度與距離平方成正比」錯(成『反比』,距離越遠輻射越弱);D「α射線穿透力最強」錯(α穿透力『最弱』,γ最強)。故C。","options":{"A":"應減少暴露時間,非多次。","B":"強度與距離平方成反比,非正比。","C":"正確(本題答案)。戴感光片定期追蹤輻射量。","D":"α穿透力最弱,γ最強。"},"sources":["新文京《護理行政》環境安全","華杏《護理行政學》災害防護與消防"]}},"110110-N2-17":{"quick":"手術室室溫20~27°C、相對濕度50~70%。","detail":{"background":"手術室的環境控制同時要兼顧感染管制、儀器安全與人員舒適。溫度一般維持在攝氏二十至二十七度之間,實務上多設定在二十至二十四度:溫度過高會使工作人員流汗、增加細菌孳生與掉落的機會,過低則造成病人體溫過低而影響凝血功能與傷口癒合,對嬰幼兒與長時間手術者風險更高。相對濕度維持在百分之五十至七十,濕度過低容易產生靜電,在有易燃麻醉氣體或電燒設備的環境中具危險性,濕度過高則利於微生物生長並使無菌敷料受潮。此外手術室須維持正壓通風並每小時足夠的換氣次數。故選 D。","options":{"A":"15~20°C過低、30~50%過乾。","B":"15~20°C過低。","C":"30~50%濕度過低。","D":"正確(本題答案)。20~27°C、50~70%。"},"sources":["新文京《護理行政》環境安全","華杏《護理行政學》災害防護與消防"]}},"111110-N2-7":{"quick":"RACE原則「錯誤」=E:立即撤離著火房間再進行初期滅火。","detail":{"background":"RACE:R(Rescue移病人)、A(Alarm警報)、C(Confine關門侷限火煙)、E(Extinguish滅火/Evacuate疏散)。選項D「E:立即撤離著火房間『再進行初期滅火』」錯誤(本題答案)——E是「使用合適滅火器進行『初期滅火』(火勢小時)或疏散」;「撤離後再回去滅火」順序矛盾不安全。本題以D敘述為錯誤。故D。","options":{"A":"R:移病人出火源區(對)。","B":"A:啟動警報通報(對)。","C":"C:關門侷限火煙(對)。","D":"錯誤(本題答案)。E敘述矛盾,初期滅火應在火勢小時。"},"sources":["新文京《護理行政》環境安全","華杏《護理行政學》災害防護與消防"]}},"113100-N2-4":{"quick":"RACE「錯誤」=關閉氧氣電器並「打開門窗」。","detail":{"background":"RACE火災應變:A撤離疏散病人(R,對)、B通報啟動警報(A,對)、D油類電氣火災用乾粉滅火(E,對)。選項C「關閉氧氣與電器設備並『打開門窗』」錯誤(本題答案)——應「『關閉』門窗(Confine侷限火煙、防止助燃)」,打開門窗會引入氧氣助燃、使火煙擴散。故C。","options":{"A":"撤離疏散病人(對)。","B":"通報啟動警報(對)。","C":"錯誤(本題答案)。應關閉門窗侷限火煙,非打開。","D":"油類電氣火災用乾粉(對)。"},"sources":["新文京《護理行政》環境安全","華杏《護理行政學》災害防護與消防"]}},"111030-N2-64":{"quick":"針扎屬生物性危害。","detail":{"background":"針扎屬於生物性危害,因為傷害的來源是針具上殘留血液中的病原微生物,主要風險為 B 型肝炎、C 型肝炎與人類免疫缺乏病毒,其中 B 型肝炎的傳染力最高,因此醫護人員應完成疫苗接種並確認抗體。發生針扎後的標準流程是立即以流動清水沖洗傷口、不擠壓、消毒後通報職業安全衛生單位,並依來源病人的血清學結果決定是否給予免疫球蛋白或抗病毒的暴露後預防用藥,再依時程追蹤。預防重點包括不回套針蓋、使用安全針具與就近設置耐穿刺的收集容器。其餘三類危害的來源分別是能量、化學物質與工作壓力。故選 B。","options":{"A":"物理性是輻射噪音高溫。","B":"正確(本題答案)。針扎(感染病原)=生物性危害。","C":"化學性是消毒劑化療藥。","D":"心理性是壓力。"},"sources":["職業安全衛生法;勞工健康保護規則","新文京《護理行政》職業危害"]}},"112110-N2-63":{"quick":"醫院環境安全管理要項=室外空氣品質(1)+廢棄物(2)+噪音(3)+毒化物(4)→「234」?本題答案D。","detail":{"background":"醫院環境安全管理系統涵蓋的是機構在自身場域內可以管理與負責的事項。廢棄物處理包括感染性事業廢棄物、尖銳器械與細胞毒性藥物廢棄物的分類、貯存、清運與委託處理;噪音管理涉及儀器警報、機房與施工噪音對病人休息與人員聽力的影響;毒化物管理則針對化學藥品、消毒劑與麻醉氣體的採購、標示、儲存、使用與洩漏應變。此外還包括室內空氣品質、輻射安全、消防與水電等公用系統。相對地,室外空氣品質屬於區域環境的公共議題,由環境主管機關監測與管制,醫院能做的是在空品不良時調整通風策略,而非納入自身的管理要項。故選 D。","options":{"A":"123含1(室外空氣)不符。","B":"124不符。","C":"134不符。","D":"正確(本題答案,234)。廢棄物、噪音、毒化物管理。"},"sources":["職業安全衛生法;勞工健康保護規則","新文京《護理行政》職業危害"]}},"113100-N2-40":{"quick":"輻射噪音高溫採光不當=物理性危害。","detail":{"background":"物理性危害的共同特徵,是傷害來自能量或環境的物理條件。醫院中的輻射來自放射診斷與治療設備,需以時間、距離與屏蔽三原則防護並配戴劑量佩章;噪音來自儀器警報、抽吸與空調機房,長期暴露影響聽力也干擾病人休息;高溫與空調溫濕度不當會造成熱危害與不適;採光照明不足則增加判讀錯誤與跌倒的風險。這些都屬同一類。與其他類別的分野在於:生物性危害的來源是病原微生物,化學性危害來自消毒劑、化療藥與麻醉氣體,心理性危害則來自工作負荷、輪班與職場暴力所帶來的壓力。故選 A。","options":{"A":"正確(本題答案)。輻射噪音高溫採光=物理性危害。","B":"生物性是病原微生物。","C":"化學性是化學物質。","D":"心理性是壓力。"},"sources":["職業安全衛生法;勞工健康保護規則","新文京《護理行政》職業危害"]}},"101110-N2-78":{"quick":"護理資訊應用於臨床照護「錯誤」=可減少接觸病患的時間。","detail":{"background":"護理資訊化的核心價值,在於把護理人員從重複的文書與行政作業中釋放出來。電子病歷讓資料一次輸入即可重複運用,大幅縮短統計與報表製作的時間;檢驗檢查結果可即時查詢,不必等紙本報告送達;異常事件與危急值也能透過系統立即通報,縮短反應時間。這些效益的共同目的,是把節省下來的時間轉回床邊,增加直接照護病人的時數,提升照護品質與病人滿意度。因此把減少接觸病患的時間當作導入資訊系統的目的,方向完全相反;真正應該減少的是間接護理時間,例如抄寫、謄錄與電話聯繫。故選 B。","options":{"A":"縮短資料統計時間(對)。","B":"錯誤(本題答案)。資訊化非為減少接觸病患。","C":"迅速查詢檢查結果(對)。","D":"降低通報時間(對)。"},"sources":["醫療法;個人資料保護法","新文京《護理行政》護理資訊與病歷"]}},"105030-N2-17":{"quick":"病歷保存正確=依醫療法病歷需由院方保存至少7年。","detail":{"background":"病歷保存(醫療法):B「依我國醫療法規定,病歷需由院方保存『至少7年』(未成年者至成年後7年)」正確。A「護理師因研究可自行調閱病歷」錯(須經審查/授權);C「請病人自行攜帶病歷至檢查室」錯(病歷由院方保管、不交病人攜帶);D「向訪客透露病歷紀錄內容」錯(違反保密)。故B。","options":{"A":"研究調閱病歷須經審查,非自行。","B":"正確(本題答案)。病歷院方保存至少7年。","C":"病歷不交病人攜帶。","D":"不可向訪客透露病歷(保密)。"},"sources":["醫療法;個人資料保護法","新文京《護理行政》護理資訊與病歷"]}},"105030-N2-79":{"quick":"使用醫療資訊系統「不適宜」=忙碌時請他人讀取後代為記錄。","detail":{"background":"醫療資訊系統的存取管理有兩個基本原則:帳號專人專用,以及最小必要權限。每個人的帳號代表其身分與存取權限,所有操作都會留下軌跡以供事後追溯,因此讀取後要登出、務必使用自己的帳號登入、不隨意列印或帶出病人資料,都是正確的做法。相對地,忙碌時請他人以自己的帳號代為讀取與記錄,一方面讓他人取得了不屬於其職務範圍的資料存取權,另一方面系統紀錄會顯示是本人操作,一旦發生錯誤或資料外洩,責任歸屬完全混淆,同時違反個人資料保護與醫療機構的資安規範。故選 B。","options":{"A":"讀取後登出(適宜)。","B":"不適宜(本題答案)。不可請他人代為讀取記錄(資安)。","C":"用自己身分進入(適宜)。","D":"不隨意列印病人資料(適宜)。"},"sources":["醫療法;個人資料保護法","新文京《護理行政》護理資訊與病歷"]}},"107110-N2-12":{"quick":"病歷保存「錯誤」=人體實驗之病歷應保存七年。","detail":{"background":"病歷保存:A住院期間病歷放護理站不置病人單位(對)、B病歷未經許可不可洩漏(對)、C病歷屬醫院財產、依醫療法保存7年(對)。選項D「『人體實驗』之病歷應保存七年」錯誤(本題答案)——人體試驗(研究)相關紀錄依規定須保存更久(如人體研究法規定至少3年、但試驗相關文件常須保存更長,且非一般7年),本題以D敘述為錯誤。故D(人體實驗病歷保存年限不同於一般7年)。","options":{"A":"住院病歷放護理站(對)。","B":"病歷不可洩漏(對)。","C":"病歷保存7年(對)。","D":"錯誤(本題答案)。人體實驗病歷保存規定不同於一般7年。"},"sources":["醫療法;個人資料保護法","新文京《護理行政》護理資訊與病歷"]}},"108110-N2-64":{"quick":"ISBAR「錯誤」=S是Share與團隊分享。","detail":{"background":"結構化溝通模式ISBAR:I(Introduction介紹)、S(Situation情境/現況)、B(Background背景)、A(Assessment評估)、R(Recommendation建議)。選項A「S是『Share』,與團隊分享」錯誤(本題答案)——S是「Situation(病人現況/發生什麼事)」,非Share。故A。","options":{"A":"錯誤(本題答案)。S是Situation(情境),非Share。","B":"B是Background背景(對)。","C":"A是Assessment評估(對)。","D":"R是Recommendation建議(對)。"},"sources":["醫療法;個人資料保護法","新文京《護理行政》護理資訊與病歷"]}},"108110-N2-71":{"quick":"資訊系統上線教育訓練不足=「事」的影響因素。","detail":{"background":"影響資訊系統導入成敗的因素,常以人、事、物、時四類來分析。人的因素指使用者的接受度、電腦素養、主管的支持與跨部門的溝通;事的因素指作業面的安排,包括教育訓練是否充分、流程是否配合調整、上線的推動策略與後續的維護支援;物的因素指硬體設備、網路頻寬與軟體功能是否符合需求;時的因素則指上線時機與時程規劃是否恰當。系統上線時教育訓練不足,屬於推動作業安排上的缺失,歸於事的因素。這也是導入失敗最常見的原因之一,再好的系統若使用者不會操作,反而會增加負擔並引發抗拒。故選 B。","options":{"A":"人的因素是使用者態度。","B":"正確(本題答案)。教育訓練不足=事的影響因素。","C":"物的因素是硬體設備。","D":"時間因素非此。"},"sources":["醫療法;個人資料保護法","新文京《護理行政》護理資訊與病歷"]}},"109030-N2-75":{"quick":"護理資訊系統「錯誤」=能處理照護訊息不須擔心資料保密性。","detail":{"background":"護理資訊系統:A結合護理/電腦/資訊科學的知識(對)、B包含資訊結構過程技術(對)、C建構過程與護理過程一樣(對)。選項D「能處理護理照護訊息,『不須擔心』資料的保密性」錯誤(本題答案)——護理資訊系統含大量病人隱私資料,「必須重視資料保密與資安」,非不須擔心。故D。","options":{"A":"結合護理電腦資訊科學(對)。","B":"包含資訊結構過程技術(對)。","C":"建構過程與護理過程一樣(對)。","D":"錯誤(本題答案)。須重視資料保密性,非不須擔心。"},"sources":["醫療法;個人資料保護法","新文京《護理行政》護理資訊與病歷"]}},"109110-N2-14":{"quick":"病歷注意正確=電子病歷須至少保存七年。","detail":{"background":"病歷注意事項:C「電子病歷須至少保存『七年』(同紙本病歷)」正確。A「病人可自行攜帶病歷至檢查室」錯(病歷由院方保管);B「護理師可依病歷向病人解釋病情」錯(病情解釋是醫師職責);D「醫療人員可依研究需求自行調閱病歷」錯(須經審查授權)。故C。","options":{"A":"病歷不交病人自行攜帶。","B":"病情解釋是醫師職責。","C":"正確(本題答案)。電子病歷至少保存七年。","D":"研究調閱須經審查,非自行。"},"sources":["醫療法;個人資料保護法","新文京《護理行政》護理資訊與病歷"]}},"110030-N2-66":{"quick":"「不」是運用資訊科技促進病人安全=張貼標示禁止查詢病人隱私。","detail":{"background":"運用『資訊科技』促進病人安全:A藥物資訊列印於藥袋標籤、C條碼協助藥物辨識、D線上查詢藥物交互作用(皆運用資訊科技)。選項B「張貼標示禁止查詢病人隱私」不是運用資訊科技(本題答案)——「張貼標示」是行政公告/管理措施,非『資訊科技』應用。故B。","options":{"A":"藥袋標籤資訊是資訊科技應用。","B":"正確(本題答案)。張貼標示非資訊科技應用。","C":"條碼辨識是資訊科技。","D":"線上查詢交互作用是資訊科技。"},"sources":["醫療法;個人資料保護法","新文京《護理行政》護理資訊與病歷"]}},"110110-N2-75":{"quick":"電腦資訊系統護理應用「錯誤」=自動記錄病情變化無須探視評估病患。","detail":{"background":"電腦資訊系統護理應用效益:A監控床位數及住院天數、C評估護理措施改善資源應用、D電子病歷提升紀錄完整持續性。選項B「可自動化記錄病患病情變化,『無須探視或評估』病患」錯誤(本題答案)——資訊系統輔助記錄,但「護理師仍須親自探視、評估病患」,系統不能取代臨床評估。故B。","options":{"A":"監控床位住院天數(對)。","B":"錯誤(本題答案)。仍須親自探視評估,系統不能取代。","C":"評估護理措施改善資源(對)。","D":"電子病歷提升完整持續性(對)。"},"sources":["醫療法;個人資料保護法","新文京《護理行政》護理資訊與病歷"]}},"112030-N2-9":{"quick":"14歲氣喘病人病歷保存至年滿25歲。本題答案C。","detail":{"background":"本題官方答案C(年滿25歲)。依醫療法,病歷至少保存7年;但「未成年者」之病歷應保存至其『成年(滿20歲)後7年』=滿27歲?——本題官方答案為「年滿25歲」,係依「成年(18歲)後7年=25歲」計(2023年起民法成年下修為18歲,18+7=25)。故年滿25歲(C)。核心:未成年病歷保存至成年(18歲)後7年。","options":{"A":"年滿20歲不符。","B":"年滿21歲不符。","C":"正確(本題答案)。成年18歲後7年=25歲。","D":"年滿27歲(舊制20歲成年+7)。"},"sources":["醫療法;個人資料保護法","新文京《護理行政》護理資訊與病歷"]}},"113100-N2-46":{"quick":"資訊安全正確=確認照護記錄簽章後再下班。","detail":{"background":"資訊安全的三個基本要求是保密性、完整性與可用性,臨床上落實到日常行為就是帳號專用、資料不外流、紀錄即時完成並簽章。下班前確認照護紀錄已完成並完成電子簽章,既確保資訊的完整性,也明確了責任歸屬,是正確做法。其餘三項都有明顯問題:把病人資料下載帶回家整理報告,一旦裝置遺失或遭入侵即造成大量個資外洩,違反個人資料保護法;代打下班卡屬於出勤紀錄的不實登載;借用醫師帳號瀏覽病況,不僅取得超出職務所需的權限,系統軌跡也會誤植為他人操作,是資安管理最嚴重的違規之一。故選 D。","options":{"A":"病人資料不可外帶。","B":"代打卡違規。","C":"借用他人帳號違反資安。","D":"正確(本題答案)。確認照護記錄簽章後再下班。"},"sources":["醫療法;個人資料保護法","新文京《護理行政》護理資訊與病歷"]}},"114030-N2-47":{"quick":"資訊系統提升護理效能=減少護理紀錄重複抄寫(2)+增進護理管理效率(3)→「23」。","detail":{"background":"資訊系統提升護理效能:2減少護理紀錄重複抄寫時間、3增進護理管理效率(及4其他正確項)。選項1「使用條碼辨識病人,可『減少』給藥三讀五對流程」錯——條碼是『輔助/強化』辨識安全,『不能取代/減少』三讀五對(三讀五對仍須執行)。故為「23」。","options":{"A":"12含1(減少三讀五對)錯。","B":"正確(本題答案,23)。減少重複抄寫、增進管理效率。","C":"34不符。","D":"14含1錯。"},"sources":["醫療法;個人資料保護法","新文京《護理行政》護理資訊與病歷"]}},"115030-N2-50":{"quick":"護理資訊系統目的「錯誤」=減少直接護理時間。","detail":{"background":"發展護理資訊系統的目的,可以歸納為讓資源運用更有效率、讓紀錄程序更簡化、讓數據監測自動化,最終把省下來的時間還給病人。具體而言,系統可自動帶入生命徵象與檢驗數值、以結構化欄位取代冗長手寫、自動計算出入量與評估量表分數,並在數值異常時主動示警。因此減少直接護理時間絕不是導入的目的,方向恰好相反:資訊化要減少的是抄寫、謄錄、電話聯繫與找資料等間接護理時間,讓護理人員有更多時間留在床邊執行評估、衛教與治療性溝通。若導入之後直接照護時間反而變少,代表系統設計或流程配合出了問題。故選 B。","options":{"A":"改善護理資源運用(對)。","B":"錯誤(本題答案)。應增加直接護理時間,非減少。","C":"簡化護理紀錄程序(對)。","D":"數據監測自動化(對)。"},"sources":["醫療法;個人資料保護法","新文京《護理行政》護理資訊與病歷"]}},"102110-N2-78":{"quick":"資深護理師危機處理、營造向心力、達全人照護=領導者角色。","detail":{"background":"管理學把組織中的角色區分開來:工作者專注執行被指派的任務;策劃者著重規劃與方案設計;追隨者是配合並支持領導者的成員;領導者則透過影響力帶領團隊朝共同目標前進。題幹描述的資深護理師不僅本身表現優異,還具備危機處理能力、能凝聚同仁向心力並帶動團隊達成全人照護的目標與精神,這些都是影響他人、塑造團隊文化與價值觀的行為,屬於領導者的角色。值得注意的是,領導不必然來自職位,臨床上許多資深護理師雖無正式頭銜,卻因專業能力與人格特質而具有實質的領導影響力。故選 D。","options":{"A":"策劃者偏規劃。","B":"追隨者是被領導。","C":"工作者是執行者。","D":"正確(本題答案)。危機處理、營造向心力=領導者角色。"},"sources":["新文京《護理行政》危機管理","華杏《護理行政學》危機處理"]}},"103030-N2-73":{"quick":"中風無法滿足日常需求=情境危機。","detail":{"background":"危機類型:成長危機(發展階段的危機,如青春期)、情境危機(situational,突發外在事件造成,如疾病、意外、失業)。「病人因中風造成無法滿足日常生活基本需求」=情境危機(B正確,突發疾病造成的危機)。社會危機、組織危機皆非個人疾病情境。故情境危機(B)。","options":{"A":"成長危機是發展階段危機。","B":"正確(本題答案)。中風致無法自理=情境危機。","C":"社會危機是社會層面。","D":"組織危機是組織層面。"},"sources":["新文京《護理行政》危機管理","華杏《護理行政學》危機處理"]}},"104030-N2-79":{"quick":"建立危機管理機制並「持續改善」最適用PDCA循環(Plan-Do-Check-Act)，故選A。","detail":{"background":"本題官方答案B(根因分析,RCA)。醫院遇大量氣爆傷患災難後,「事後分析、建立危機管理機制、以利持續(改善)」=根本原因分析(RCA,事後回溯找根本原因防再發生)。循環(PDCA)、危害分析(事前)、異常事件通報分析皆非「事後找根本原因」首選。故根因分析(B)。","options":{"A":"正解：PDCA循環用於持續改善。","B":"根因分析(RCA)用於找單一事件根本原因，非持續改善循環。","C":"危害分析(如HVA/FMEA)是事前風險辨識。","D":"異常事件通報分析針對個別異常事件。"},"sources":["新文京《護理行政》危機管理","華杏《護理行政學》危機處理"]}},"104100-N2-63":{"quick":"排班應考量原則=護理品質及護理人員之負荷。","detail":{"background":"病房排班應考量的原則:B「應考量『護理品質』及『護理人員之負荷』(確保照護品質與避免過勞)」正確。A「視排班為獎懲工具」錯(排班不應作獎懲);C「具機動性可任意更換」錯(排班應穩定、不可任意更換);D「免於事先公開」錯(排班應事先公開讓人員知悉)。故B。","options":{"A":"排班不應作獎懲工具。","B":"正確(本題答案)。應考量護理品質及人員負荷。","C":"排班不可任意更換。","D":"排班應事先公開。"},"sources":["新文京《護理行政》危機管理","華杏《護理行政學》危機處理"]}},"106030-N2-70":{"quick":"醫學中心危機管理=常態固定編組分工計畫。","detail":{"background":"危機管理的編組方式,要視機構規模與危機發生的頻率而定。醫學中心規模龐大、科部眾多,又是大量傷患與重大事件的後送重鎮,若等到事情發生才臨時編組,光是聯繫與角色確認就會耗掉黃金時間。因此應採常態固定編組,平時即設置緊急應變中心,明訂指揮官、發言人、醫療組、後勤組與資訊組的常任人選與代理人,並定期演練與更新通訊錄,危機一發生即可依既定架構啟動。其餘做法各有侷限:全員參與缺乏指揮體系易生混亂,臨時任務編組與彈性編組雖較靈活,但適合規模較小或危機型態單純的機構。故選 C。","options":{"A":"全員參與易混亂。","B":"任務編組是臨時編組。","C":"正確(本題答案)。醫學中心宜常態固定編組分工。","D":"彈性編組不如固定編組快速。"},"sources":["新文京《護理行政》危機管理","華杏《護理行政學》危機處理"]}},"106111-N2-73":{"quick":"危機處理步驟應先=評估對壓力事件的感受及對生活的影響。","detail":{"background":"危機介入採取的是問題解決的架構,第一步永遠是評估。護理人員必須先了解當事人如何看待這個壓力事件、事件對其日常生活、角色功能與人際關係造成什麼衝擊,以及目前的情緒反應與有無安全顧慮,唯有掌握這些資訊,後續的處置才有依據。評估完成後才進入第二步,探討當事人過去面對困難時慣用的調適方式與可運用的支持系統;第三步依此共同訂定具體、可行的減壓方法與期望目標;最後一步評值介入是否有效並視需要調整計畫。順序顛倒的常見錯誤是尚未了解狀況就急著給建議,往往因不符合當事人的處境而無效。故選 A。","options":{"A":"正確(本題答案)。先評估壓力事件感受及影響。","B":"找過去調適方法是後續。","C":"訂減壓目標是後續。","D":"評值改善是最後。"},"sources":["新文京《護理行政》危機管理","華杏《護理行政學》危機處理"]}},"108020-N2-75":{"quick":"危機處理正確者：3評估風險危害程度、4建立指揮中心、5危機時對媒體因應→「345」，故選C。","detail":{"background":"本題官方答案「135」。危機發生時處理:1偵測>防範>控制>學習>回復(危機管理階段)、3評估風險危害程度、5(危機溝通等)。選項2「全體同仁共同參與危機討論」非危機當下的有效做法(危機應由核心指揮);4「建立指揮中心」(此項其實對,但本題正確組合為135)。故135。","options":{"A":"含1(順序學習應在回復之後)、2(非全員共同討論)錯。","B":"含2錯。","C":"正解(345)：評估風險、建立指揮中心、危機溝通。","D":"含1(階段順序錯)不符。"},"sources":["新文京《護理行政》危機管理","華杏《護理行政學》危機處理"]}},"110030-N2-79":{"quick":"大量粉塵爆後持續品質改善工具=PDCA循環。","detail":{"background":"醫院遇大量粉塵爆傷患災難後,推動「持續品質改善機制」的事後分析工具=B「PDCA循環(計畫-執行-查核-行動,持續改善)」最適合。危害分析(事前)、失效模式分析FMEA(事前)、SWOT分析(策略)皆非「持續品質改善循環」。故PDCA循環(B)。","options":{"A":"危害分析是事前。","B":"正確(本題答案)。持續品質改善=PDCA循環。","C":"FMEA是事前分析。","D":"SWOT是策略分析。"},"sources":["新文京《護理行政》危機管理","華杏《護理行政學》危機處理"]}},"112180-N2-50":{"quick":"護理主管面對危機職責=熟悉相關法令規則及醫院危機事件報告機制。","detail":{"background":"護理主管面對危機的職責:A「熟悉當今護理業務相關法令、規則及醫院危機事件報告機制」正確。B「督導完成紀錄不須要求書寫品質」錯(品質也要要求);C「非上班時間完全交由值班人員」錯(主管仍須掌握、可被聯繫);D「學校已培育不須特別安排危機訓練」錯(機構仍須持續危機訓練)。故A。","options":{"A":"正確(本題答案)。熟悉法令規則及危機報告機制。","B":"紀錄品質也要要求。","C":"非上班時間主管仍須掌握。","D":"機構仍須安排危機訓練。"},"sources":["新文京《護理行政》危機管理","華杏《護理行政學》危機處理"]}},"103100-N2-68":{"quick":"DRG特性=住院給付是固定的。","detail":{"background":"診斷關係群(DRG,Diagnosis Related Groups):依「診斷分類」給付,同一DRG「住院給付是固定的(包裹式定額給付)」(A正確)——不論實際花費多少,同診斷群給付固定,激勵醫院控制成本。以基本診療/特定檢查/病人量為支付基礎皆非DRG(那是論量計酬)。故住院給付固定(A)。","options":{"A":"正確(本題答案)。DRG住院給付固定(定額)。","B":"非以基本診療為基礎(那是論量)。","C":"非以特定檢查為基礎。","D":"非以病人量為基礎(論量計酬)。"},"sources":["新文京《護理行政》品質與成本","華杏《護理行政學》DRG與生產力"]}},"104030-N2-55":{"quick":"選擇抗生素種類的指標=Urine Culture(尿液培養)。","detail":{"background":"本題為臨床檢驗題(歸品質站係分類所致)。選擇抗生素種類的指標=A「Urine Culture(尿液培養,含菌種鑑定與抗生素敏感性試驗)」——培養可鑑定病原菌並做藥敏試驗,指引抗生素選擇。CBC(血球計數)、CRP(發炎指標)、Sputum Routine(痰液常規)皆非「指引抗生素種類選擇」(培養+藥敏才是)。故Urine Culture(A)。","options":{"A":"正確(本題答案)。培養+藥敏指引抗生素選擇。","B":"CBC是血球計數。","C":"CRP是發炎指標。","D":"痰液常規非藥敏。"},"sources":["新文京《護理行政》品質與成本","華杏《護理行政學》DRG與生產力"]}},"104100-N2-59":{"quick":"衡量生產力指標「不包括」=顧客滿意度。","detail":{"background":"生產力的本質是產出除以投入,衡量的是資源運用的效率。醫療機構常用的產出面指標包括門診人次、住院人日、手術件數與健保申報的給付點值,投入面則以人力、工時、床位與醫材使用量計算,兩者相除便能得到每人每日產值或每床產值等生產力指標。顧客滿意度則屬於品質的範疇,反映的是服務品質與病人的主觀感受,在平衡計分卡中歸於顧客面而非效率面。兩者並非無關,長期而言品質不佳會導致病人流失而影響產能,但在指標分類上必須分清楚:生產力問的是做了多少,品質問的是做得好不好。故選 A。","options":{"A":"正確(本題答案)。顧客滿意度是品質指標,非生產力。","B":"病人看診量是生產力指標。","C":"疾病給付點值是生產力指標。","D":"醫材使用量是生產力指標。"},"sources":["新文京《護理行政》品質與成本","華杏《護理行政學》DRG與生產力"]}},"104100-N2-64":{"quick":"基層護理進階訓練重點「錯誤」=N3敘述?本題答案D。","detail":{"background":"本題官方答案D。基層護理人員專業能力訓練重點:N1(常見技術、護理問題、紀錄、問題分析處理)、N2(重症照護、醫療糾紛案例、案例分析審查)、N3(可擔任N1/N2教師、主持團體衛教、獨立...)。選項D「(N4):教與學、危機處理、通過個案報告審查、執行護理品管活動」——此敘述對應有誤(教與學是N3、品管是N3/N4),本題以D為錯誤敘述。作答以官方D為準。","options":{"A":"N1訓練重點(對)。","B":"N2訓練重點(對)。","C":"N3訓練重點(對)。","D":"錯誤(本題答案)。N4敘述對應有誤。"},"sources":["新文京《護理行政》品質與成本","華杏《護理行政學》DRG與生產力"]}},"105030-N2-60":{"quick":"每類病人數乘以嚴重度指數之和=工作量。","detail":{"background":"護理人力的計算不能只看床數或病人數,因為不同病人所需的照護時數差異極大。工作量指標的做法是先以病人分類系統把病人依照護需求分成數個等級,每一級對應一個嚴重度或所需護理時數的權重,再把各級的病人人數乘以其權重後全部加總,得到的總和就代表該單位當班所需的護理總工作量,據此推算應配置的人力。這樣的算法能反映照護的實際負荷,避免用平均護病比掩蓋病人組成的差異。其餘選項則各只呈現單一面向:嚴重度是分級的權重本身,病人數僅計人頭,依賴度描述的是病人自我照顧能力。故選 B。","options":{"A":"嚴重度是單一指數。","B":"正確(本題答案)。人數×嚴重度之和=工作量。","C":"病人數僅人數。","D":"依賴度非此計算。"},"sources":["新文京《護理行政》品質與成本","華杏《護理行政學》DRG與生產力"]}},"105090-N2-67":{"quick":"因素分類法依「護理活動項目」分類。","detail":{"background":"病人分類系統主要有兩種做法。原型分類法是先描述幾個典型的病人樣貌,再由護理人員憑整體印象把病人歸入最接近的那一類,做法簡便但主觀性較高。因素分類法則是把護理活動拆解成獨立的項目,例如進食、沐浴、翻身、給藥、監測與治療處置,每一項依所需時間或難度給予分數,再把該病人當日需要的所有項目分數加總,依總分落在哪個區間決定分類等級。因此因素分類法的分類依據是護理活動項目,而不是醫療診斷、疾病嚴重度或疾病所處的階段,後者屬於醫療端的分類而非護理工作量的衡量。故選 A。","options":{"A":"正確(本題答案)。因素分類法依護理活動項目。","B":"病人診斷非因素法依據。","C":"疾病嚴重度非因素法核心。","D":"疾病階段非因素法依據。"},"sources":["新文京《護理行政》品質與成本","華杏《護理行政學》DRG與生產力"]}},"107030-N2-74":{"quick":"DRGs給付制度=預先設定好且固定的健保給付方式。","detail":{"background":"診斷關聯群(DRGs)給付:A「一種預先設定好且固定的健保給付方式(包裹式定額)」正確。B「能縮短長照與居家服務使用量」錯(DRG可能『增加』出院後照護需求);C「不影響住院天數」錯(DRG激勵『縮短』住院天數);D「能增加作業服務成本」錯(DRG激勵『降低』成本)。故A。","options":{"A":"正確(本題答案)。DRG是預設固定的健保給付。","B":"可能增加出院後照護需求。","C":"DRG激勵縮短住院天數。","D":"DRG激勵降低成本。"},"sources":["新文京《護理行政》品質與成本","華杏《護理行政學》DRG與生產力"]}},"107110-N2-72":{"quick":"訓練專業知識技能提供整合連續照護=教育委員會。","detail":{"background":"護理部底下的各委員會有明確的職掌分工。教育委員會負責規劃新進人員的訓練、在職教育、臨床專業能力進階制度與教學師資的培育,目的正是提升護理人員的專業知識與技能,使其能提供整合性與連續性的照護,因此本題應設立教育委員會。其餘委員會的功能不同:品管委員會訂定照護標準、執行稽核與監測品質指標;人事委員會處理甄選、任用、升遷與考核;研究委員會則推動臨床研究與實證護理的應用。實務上這些委員會並非各自為政,例如品管稽核發現的落差,往往就成為教育委員會規劃在職訓練的依據。故選 C。","options":{"A":"品管委員會是品質。","B":"人事委員會是人事。","C":"正確(本題答案)。訓練專業知能=教育委員會。","D":"研究委員會是研究。"},"sources":["新文京《護理行政》品質與成本","華杏《護理行政學》DRG與生產力"]}},"108110-N2-57":{"quick":"對護理專業形象不良影響=將病人臉部傷口相片放個人臉書。","detail":{"background":"專業形象的維護,關鍵在於是否守住專業界線與病人的權益。把所照顧病人的臉部傷口照片放到個人社群網站上,即使沒有標註姓名,臉部本身就是可辨識的個人資料,已構成隱私侵害,違反護理人員法的保密義務與個人資料保護法,也違背專業倫理,對護理形象造成明顯的負面影響。相對地,另外三項都是正面行為:在非執勤時間對路倒民眾提供適當救助,展現的是專業能力與利他精神;參與國際護理專業活動,能提升本國護理在國際上的能見度;參與院內病人安全文化的推動,則與照護品質的提升直接相關。故選 C。","options":{"A":"緊急救助是正面形象。","B":"參與國際活動是正面形象。","C":"正確(本題答案)。放病人傷口相片於臉書損形象(洩隱私)。","D":"參與病安活動是正面形象。"},"sources":["新文京《護理行政》品質與成本","華杏《護理行政學》DRG與生產力"]}},"109030-N2-78":{"quick":"提升護理生產力「錯誤」=減少收治重症病人。","detail":{"background":"提升生產力的正途是讓相同的人力產生更多有價值的產出。營造組織學習文化,能讓同仁持續精進並主動改善流程;發展資訊系統簡化文書與查詢作業,可把間接護理時間轉為直接照護;運用績效考核與激勵制度,則能引導行為並提高工作動機。這三者都是在投入端提升效率。相對地,減少收治重症病人雖然表面上會讓每位護理人員照顧的工作量下降、看似效率提升,但這是以拒絕需要照護的病人為代價,違背醫療機構的社會責任與專業倫理,也不符合生產力的定義,真正該做的是依病人組合合理配置人力。故選 D。","options":{"A":"創造學習文化(對)。","B":"發展資訊系統(對)。","C":"績效考核激勵(對)。","D":"錯誤(本題答案)。不能減少收治重症病人。"},"sources":["新文京《護理行政》品質與成本","華杏《護理行政學》DRG與生產力"]}},"109110-N2-78":{"quick":"「不」是衡量生產力指標=病人服務滿意度。","detail":{"background":"要判斷一個指標是不是生產力指標,可以問它能不能放進產出除以投入的算式。健保給付點值代表醫療服務換算成的產值,門診就診人次是服務量的直接計數,醫材使用量則屬於投入資源,三者都能用於計算每位人力或每張病床的產能。病人服務滿意度則不同,它衡量的是服務對象的主觀感受,無法作為產出量或投入量代入計算,在平衡計分卡中屬於顧客面而非效率面。管理上兩者必須並重,只追求生產力而忽略滿意度,往往導致服務品質下降與病人流失,最終反而侵蝕產能。故選 C。","options":{"A":"健保給付點值是生產力指標。","B":"門診就診人次是生產力指標。","C":"正確(本題答案)。滿意度是品質指標,非生產力。","D":"醫材使用量是生產力指標。"},"sources":["新文京《護理行政》品質與成本","華杏《護理行政學》DRG與生產力"]}},"111030-N2-43":{"quick":"評估慢性營養不良最佳指標=血清白蛋白(Albumin)。","detail":{"background":"評估營養狀態的生化指標,選擇時要看半衰期與所要反映的時間尺度。血清白蛋白的半衰期約十八至二十天,體內存量大,濃度下降代表蛋白質攝取不足已持續一段時間,因此是評估慢性營養不良的常用指標;若要評估近期或急性的變化,則須改用半衰期較短的前白蛋白約兩天或運鐵蛋白約八天。判讀白蛋白時要留意干擾因素,肝硬化、腎病症候群、發炎反應與體液狀態都會影響數值。其餘選項各有其用途:丙胺酸轉胺酶反映肝細胞損傷,高密度脂蛋白與三酸甘油酯屬於血脂與心血管風險評估。故選 A。","options":{"A":"正確(本題答案)。白蛋白(半衰期長)評估慢性營養不良。","B":"GPT是肝功能。","C":"HDL是膽固醇。","D":"TG是三酸甘油酯。"},"sources":["新文京《護理行政》品質與成本","華杏《護理行政學》DRG與生產力"]}},"113030-N2-42":{"quick":"N2進階N3訓練重點=危機處理(2)+教學原理與方法(3)→「23」。","detail":{"background":"臨床專業能力進階制度的訓練重點,隨層級而逐步由病人照護擴展到教學與管理。N1 到 N2 的重點在於深化臨床照護能力,課程包括重症病人護理、身體評估、病例分析以及護理與法律等基本規範。N2 到 N3 則開始承擔單位內的教學與應變任務,訓練重點轉為危機處理能力,以及教學原理與方法、臨床教師的角色功能,使其能指導學妹與實習學生,並參與單位品質改善。N3 到 N4 再進一步要求專案設計、研究方法與行政管理。因此本題屬於 N2 進階 N3 的是危機處理與教學原理與方法兩項。故選 B。","options":{"A":"12含1(重症是N1→N2)不符。","B":"正確(本題答案,23)。危機處理、教學原理方法。","C":"34含4(法律是N1→N2)不符。","D":"14不符。"},"sources":["新文京《護理行政》品質與成本","華杏《護理行政學》DRG與生產力"]}},"114030-N2-9":{"quick":"「我們醫院藥物都用最好的」=防衛性態度。","detail":{"background":"非治療性溝通指的是阻斷病人繼續表達的回應方式。當病人抱怨藥物沒有效果時,護理人員回以不會吧、我們醫院的藥都是用最好的,這句話的作用是維護醫院與自身的立場,同時否定了病人的主觀經驗,屬於防衛性態度,結果是病人感到不被理解而閉口不談,真正該被評估的問題,例如服藥順從性、服藥時間、飲食與其他藥物的交互作用,都因此被掩蓋。較適當的回應是先接納感受再收集資料。其餘非治療性技巧的表現不同:批判的態度是對病人的行為下價值判斷,改變話題是迴避不想談的議題,過度負荷則是一次給予過多訊息。故選 C。","options":{"A":"過度負荷非此。","B":"批判態度是批評病人。","C":"正確(本題答案)。維護否定病人=防衛性態度。","D":"改變話題是轉移。"},"sources":["新文京《護理行政》品質與成本","華杏《護理行政學》DRG與生產力"]}},"114030-N2-41":{"quick":"病人分類系統實施原則=方便易操作,不可影響臨床照護時數。","detail":{"background":"病人分類系統實施原則:C「方便易操作,不可影響臨床護理照護時數(分類本身不應佔用過多照護時間)」最適當。A「不宜設置稽核機制」錯(應設稽核確保資料正確);B「不宜太重視信效度」錯(應重視信效度);D「應採單一功能發展」錯(應多功能發展)。故C。","options":{"A":"應設稽核機制確保正確。","B":"應重視信效度。","C":"正確(本題答案)。方便易操作不影響照護時數。","D":"應多功能發展,非單一。"},"sources":["新文京《護理行政》品質與成本","華杏《護理行政學》DRG與生產力"]}},"114100-N2-43":{"quick":"N1申請N2應參加=危機處理(2)+重症病人護理(3)→「23」。","detail":{"background":"護理師在臨床工作一年半並已完成 N1,接下來要申請 N2,訓練重點應放在提升臨床照護的深度。N1 進階 N2 的核心是能夠獨立照護病情較複雜與較不穩定的病人,因此課程包括重症病人護理、身體評估與危急狀況的應變處理,也就是危機處理。相對地,教學原理與方法屬於 N2 進階 N3 的訓練,因為 N3 開始承擔臨床教學與指導學妹的角色;護理標準的制定則涉及全院性的規範訂定,屬於更高層級 N3 至 N4 的能力範疇。因此本題應選擇危機處理與重症病人護理兩項。故選 C。","options":{"A":"12含1(教學是N2→N3)不符。","B":"正確(本題答案,23)。危機處理、重症病人護理。","C":"34不符。","D":"14不符。"},"sources":["新文京《護理行政》品質與成本","華杏《護理行政學》DRG與生產力"]}},"114100-N2-47":{"quick":"依Jaques，W>C>P(生產力高於能力、報酬最低)時員工最有被剝削懲罰感，故選A。","detail":{"background":"本題官方答案B(C=W>P)。Jaques指出員工工作滿意度取決於能力(C)、生產力(W)、報酬(P)的關係。當「C=W>P(能力與生產力相等且皆高於報酬)」時,員工感到付出多於回報、不滿意。本題以此組合為答案。故C=W>P(B)。核心:能力生產力高於報酬→不滿意。","options":{"A":"正解：W>C>P，生產力高於能力且報酬最低，產生被剝削懲罰感。","B":"C=W>P屬輕微低估，非最強剝削感。","C":"C>P=W不符。","D":"W=P>C報酬高於能力，無剝削感。"},"sources":["新文京《護理行政》品質與成本","華杏《護理行政學》DRG與生產力"]}},"107110-N2-78":{"quick":"護理資訊系統正確=善盡保管帳密(1)+考量資料安全隱私(2)+...→「124」。","detail":{"background":"依國際醫療資訊協會規定,護理師執行護理資訊系統:1善盡保管帳號及密碼的責任、2考量病人資料安全及隱私、4(依規範使用、不外洩)。選項3「下載病人受傷圖片(外傳/外洩病人資料)」違反資安與隱私,不可。本題官方答案D「124」。核心:資訊系統使用須保管帳密、維護病人資料安全隱私、不外洩。","options":{"A":"123含3(下載病人圖片)不符。","B":"234含3不符。","C":"345含3不符。","D":"正確(本題答案,124)。保管帳密、資料安全隱私、依規範使用。"},"sources":["醫療法;個人資料保護法","國際醫療資訊協會規範"]}},"115100-N2-1":{"quick":"正解(C)。RACE 的 E 是 Extinguish（滅火）。","detail":{"background":"醫院火災的應變口訣「RACE」是病人安全的必考題：「R——Rescue（救援）」，優先移離火源附近與危險區域的人員，順序是「先救可自行行走者、再救需協助者，先水平疏散到同層的防火區隔，再垂直疏散往下層」；「A——Alarm（警報）」，啟動火警警報並通報總機與消防單位，同時通報院內緊急應變小組；「C——Confine（侷限）」，關閉門窗與防火門、關閉氧氣與電源，把火與煙侷限在最小範圍；「E——Extinguish（滅火）」，「依火災類別選用適當的滅火器材撲滅火源」——A 類（普通可燃物，用水或泡沫）、B 類（油類，用乾粉或二氧化碳）、C 類（電氣，用二氧化碳或乾粉，絕不可用水）、D 類（金屬）。滅火器的操作口訣為「PASS」：Pull（拉插銷）、Aim（對準火源底部）、Squeeze（壓握把）、Sweep（左右掃射）。","options":{"A":"評估不是 RACE 的 E。","B":"緊急出口疏散屬 R（救援）階段。","C":"正確。E 為 Extinguish（滅火）。","D":"調查起火原因屬事後檢討。"},"sources":["實用基本護理學（華杏）","Potter & Perry《Fundamentals of Nursing》","新編基本護理學（永大）"]}},"115100-N2-49":{"quick":"正解(A)。離開工作車時應隨時關閉或鎖定電腦畫面，以保護病人資料。","detail":{"background":"護理資訊系統的資訊安全與病人隱私保護原則：①「帳號密碼專人專用、絕不可借用或代為登入」——每個人的帳號都連結到操作紀錄（audit trail），「委託他人使用自己的帳號」或「急救時使用他人帳號」都違反規定且無法釐清責任，即使情況緊急亦然（系統應另設緊急存取機制）；②「離開電腦時必須登出或鎖定螢幕」，工作車與護理站的螢幕應避免朝向公共區域，這是最基本也最常被忽略的一環，故選項 A 正確；③「不可任意列印病人資料」——紙本一旦外流即無法追蹤，若必須列印，用畢應以碎紙機銷毀，不得作為個人「佐證」留存；④密碼定期更換、不可寫在便利貼上；⑤不得以個人手機拍攝病人資料或傷口上傳社群媒體；⑥依《個人資料保護法》與《醫療法》，病歷屬特種個資，僅限「基於醫療、業務所需」的人員在必要範圍內查閱，「不可查詢與自己照護無關的病人（含名人與親友）」。","options":{"A":"正確。離開時應關閉或鎖定畫面。","B":"錯誤。帳號專人專用，不得委託他人使用。","C":"錯誤。急救亦不可借用他人帳號。","D":"錯誤。不應任意列印病人資料留存。"},"sources":["實用基本護理學（華杏）","Potter & Perry《Fundamentals of Nursing》","新編基本護理學（永大）"]}},"115100-N2-50":{"quick":"正解(C)。結果面指標為病人滿意度、跌倒傷害率與死亡率；護病比屬結構面。","detail":{"background":"Donabedian（1966）提出的醫療品質三面向架構是品質管理的基石：①「結構面（structure）」——提供照護所需的「資源與環境條件」，包括「人力配置（護病比、人員資格與證照、教育訓練）」、設備與空間、組織架構、政策規章與資訊系統。②「過程面（process）」——「做了什麼、怎麼做」，即醫療與護理照護的行為，例如是否依標準作業流程執行、洗手遵從率、給藥正確率、疼痛評估執行率、護理紀錄完整性、身體約束使用率。③「結果面（outcome）」——照護施行「後」病人健康狀態與感受的改變，包括「死亡率、感染率（如導尿管相關泌尿道感染率）、『跌倒傷害率』、壓瘡發生率、非計畫性重返率、住院天數，以及『病人就醫滿意度與生活品質』」。因此本題①病人就醫滿意度、③跌倒傷害率、④死亡率屬結果面；②護病比屬結構面。三者環環相扣：好的結構有助於好的過程，好的過程才產生好的結果。","options":{"A":"含護病比（結構面）。","B":"含護病比（結構面）。","C":"正確。滿意度、跌倒傷害率與死亡率皆為結果面。","D":"含護病比（結構面）。"},"sources":["實用基本護理學（華杏）","Potter & Perry《Fundamentals of Nursing》","新編基本護理學（永大）"]}}},TO=["1醫療品質管理概念與Donabedian模式", "2品質改善循環PDCA與品管圈", "3品質管理工具", "4病人安全與異常事件", "5環境安全與災害防護", "6職業安全衛生危害", "7病歷保存與護理資訊系統", "8危機管理", "9醫療品質成本制度與其他"],LEC={"1醫療品質管理概念與Donabedian模式":{"html":"\n<p><b>Donabedian醫療品質三構面(SPO):</b><b>結構(structure)</b>=投入資源(人力資格、設備、制度、技術指引、護病比、洗手設備);<b>過程(process)</b>=照護執行(技術正確性、手部衛生執行率、護理紀錄完整性、術前給抗生素、病人辨識、三讀五對);<b>結果(outcome)</b>=病人結果(感染率、跌倒率、壓瘡率、死亡率、給藥異常率、滿意度)。</p>\n<p><b>控制類型:</b>事前控制(預算編列、計畫,預防性)、事中控制、事後控制(結果)。護理品管委員會:標準組(制定護理技術)、稽核組、指標監測組、成本控制組。</p>\n"},"2品質改善循環PDCA與品管圈":{"html":"\n<p><b>PDCA循環:</b>Plan(計畫)→Do(執行)→<b>Check(查核成效,如滿意度調查、落實度查核)</b>→Act(行動/標準化)。<b>FOCUS-PDCA:</b>Find發現問題、Organize組小組、Clarify釐清、Understand瞭解變異、Select選對策。</p>\n<p><b>品質管理發展:</b>QC品質控制→QA品質保證(依標準)→TQC全面品質管制→TQM全面品質管理(全員參與)。</p>\n<p><b>目標5W1H</b>(Why/What/Who/Where/When/How);改善主題優先選<b>發生頻率高</b>者(80/20)。鼓勵員工參加品管圈接近Y理論。</p>\n"},"3品質管理工具":{"html":"\n<p><b>找原因:</b><b>魚骨圖</b>(特性要因/cause-effect,表達結果與原因的關係、展開各類原因);<b>系統圖/樹狀圖</b>(以箭頭層層展開因果)。</p>\n<p><b>找重要少數:</b><b>柏拉圖(Pareto)</b>=80/20法則,依發生頻率排序、找出重要導因(關鍵的20%);掌握重要少數解決瑣碎多數。</p>\n<p><b>監測:</b><b>管制圖(control chart)</b>=監測指標是否在控制範圍內(偵測異常變異)。其他:直方圖(分布)、查檢/稽核表(收集查核)、推移/趨勢圖(時間)、散布圖(相關);新七手法(關聯圖、系統圖、矩陣圖)。<b>平衡計分卡BSC</b>四構面:財務、顧客(病人抱怨)、內部流程、學習與成長。</p>\n"},"4病人安全與異常事件":{"html":"\n<p><b>異常事件分級:</b><b>跡近/幾近錯失(near miss)</b>=錯誤被及時攔截、<b>未到病人</b>(如藥物退回、被質疑而查證);無傷害事件(到病人但無傷害);不良事件(已造成傷害);<b>警訊/哨兵事件(sentinel)</b>=非預期死亡、永久功能喪失、嬰兒失竊、自殺、手術部位錯誤。<b>傷害行為事件</b>=暴力毆打/持刀傷醫護。</p>\n<p><b>通報系統:</b><b>非懲罰性</b>、學習改善、<b>預防錯誤再發生</b>(非究責/釐清責任)。<b>RCA</b>根本原因分析(事後、組小組、找根本原因、用於嚴重事件);<b>FMEA</b>失效模式與效應分析(<b>事前/預應式</b>)。氧氣未開臉發黑→立即處置病人優先。</p>\n"},"5環境安全與災害防護":{"html":"\n<p><b>火災RACE:</b>R(Rescue救援移病人)、A(Alarm啟動警報通報消防)、C(Confine<b>關門</b>侷限火煙)、E(Extinguish滅火/Evacuate疏散)。濃煙密布優先<b>疏散病人</b>;不可打開門窗(助燃)。</p>\n<p><b>滅火器:</b>A類普通(燃紙)用水/乾粉、B類油類用泡沫、C類電氣用二氧化碳、D類金屬(鎂)用乾粉。<b>地震疏散</b>先能行動者、後無法行動者。</p>\n<p><b>輻射防護</b>三原則:時間短、距離遠(強度與距離平方成<b>反比</b>)、屏蔽;戴感光片追蹤劑量;α穿透弱、γ最強。<b>手術室</b>室溫20~27°C、相對濕度50~70%。環境危害:物理/化學/生物(無金屬類)。</p>\n"},"6職業安全衛生危害":{"html":"\n<p><b>職業危害分類:</b><b>物理性</b>(輻射、噪音、高溫、採光照明不當、振動);<b>化學性</b>(消毒劑、化療藥);<b>生物性</b>(病原微生物、<b>針扎</b>感染血液病原);心理性(壓力);人因性(姿勢、搬運致背扭傷、靜脈曲張、椎間盤)。</p>\n<p><b>醫院環境安全管理要項:</b>室內空氣品質、廢棄物處理、噪音管理、毒化物管理。</p>\n"},"7病歷保存與護理資訊系統":{"html":"\n<p><b>病歷保存(醫療法):</b>至少<b>7年</b>;未成年者保存至成年(現行18歲)後7年(=<b>25歲</b>);電子病歷同須保存7年。病歷由院方保管、不交病人攜帶、不可洩漏。</p>\n<p><b>資訊安全:</b>以<b>自己帳號</b>親自操作、讀取後登出、<b>不外帶/下載病人資料</b>、不借用他人帳號、不外傳病人圖片、簽章後下班。</p>\n<p><b>結構化溝通ISBAR:</b>Introduction介紹、<b>Situation情境(現況,非Share)</b>、Background背景、Assessment評估、Recommendation建議。資訊系統輔助但<b>不能取代</b>臨床探視評估。</p>\n"},"8危機管理":{"html":"\n<p><b>危機類型:</b>成長危機(發展階段)、<b>情境危機</b>(突發疾病、意外、中風致無法自理)。</p>\n<p><b>危機處理步驟:</b>先<b>評估</b>對壓力事件的感受與影響→找過去調適方法→訂減壓目標→評值。危機管理階段:偵測→防範→控制→學習→回復。</p>\n<p><b>策略:</b>醫學中心宜<b>常態固定編組分工</b>(平時建立、危機可立即啟動);災後持續品質改善用<b>PDCA</b>、找根本原因用<b>RCA</b>。護理主管須熟悉法令與危機事件報告機制。排班應考量護理品質與人員負荷。</p>\n"},"9醫療品質成本制度與其他":{"html":"\n<p><b>DRG診斷關係群:</b>依診斷分類的<b>包裹式『定額固定』</b>給付,激勵醫院<b>縮短住院、控制成本</b>(非論量計酬)。</p>\n<p><b>生產力指標:</b>看診/門診量、健保給付點值、醫材使用量(<b>滿意度是品質指標、非生產力</b>);不可為提升生產力而減收重症病人。</p>\n<p><b>病人分類:</b>因素分類法依<b>護理活動項目</b>計分;工作量=病人數×嚴重度指數之和。<b>進階訓練:</b>N1→N2(重症照護、危機處理)、N2→N3(教學原理與方法)。Jaques能力(C)-生產力(W)-報酬(P)決定滿意度(C=W>P 不滿意)。慢性營養不良最佳指標=白蛋白。</p>\n"}};
const $=s=>document.querySelector(s);
let view='topic',expand=false;
function disp(t){const m=t.match(/^(\d+)(.*)$/);return m?('（'+m[1]+'）'+m[2]):t;}
const yset=[...new Set(Q.map(q=>q.roc_year))].sort((a,b)=>a-b);
yset.forEach(y=>fYear.appendChild(Object.assign(document.createElement('option'),{value:y,textContent:'民國'+y+'年'})));
TO.forEach(t=>{if(Q.some(q=>q.topic===t))fTopic.appendChild(Object.assign(document.createElement('option'),{value:t,textContent:disp(t)}));});
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function ansText(q){var a='答案：'+q.answer;if(q.accepted_answers&&q.accepted_answers.length>1)a+='（'+(q.answer_status||'多重答案')+'：'+q.accepted_answers.join('、')+'均給分）';else if(q.answer_status&&q.answer_status.indexOf('送分')>=0)a+='（送分・一律給分）';return a;}
function qCard(q){
 const e=E[q.id];
 const sf=(q.answer_status&&q.answer_status.indexOf('送分')>=0);
 const ma=(q.accepted_answers&&q.accepted_answers.length>1);
 let chips='<span class="chip y">'+esc(q.src)+'</span><span class="chip">'+esc(q.exam_code)+' 第'+q.q_num+'題</span><span class="chip t">'+esc(disp(q.topic))+'</span>';
 if(sf)chips+='<span class="chip sf">送分</span>'; else if(ma)chips+='<span class="chip ma">多重答案</span>';
 const acc=(q.accepted_answers&&q.accepted_answers.length?q.accepted_answers:[q.answer]);
 const songfen=sf?1:0;
 let opts='';for(const k of ['A','B','C','D','E']){if(q.options[k]!==undefined)opts+='<div class="opt" data-k="'+k+'"><b>('+k+')</b>'+esc(q.options[k])+'</div>';}
 const img=q.img?'<img class="fig" src="'+q.img+'" alt="附圖" onclick="this.classList.toggle(\'big\')">':'';
 let det='';
 if(e){det='<div class="qk"><b>⚡ 快速解答：</b>'+esc(e.quick)+'</div>';
  if(e.detail){
   if(e.detail.background)det+='<div class="bg"><h4>📖 背景知識</h4><div>'+esc(e.detail.background)+'</div></div>';
   if(e.detail.options){det+='<div class="oabox"><h4>🔍 逐選項解析</h4>';for(const k of ['A','B','C','D','E']){if(e.detail.options[k]){var cc=(acc.indexOf(k)>=0)?' correct':'';det+='<div class="oa'+cc+'"><b>('+k+')</b> '+esc(e.detail.options[k])+'</div>';}}det+='</div>';}
   if(e.detail.sources&&e.detail.sources.length)det+='<div class="src2">📚 參考來源：'+e.detail.sources.map(esc).join('；')+'</div>';
  }
 }
 return '<div class="q" data-id="'+q.id+'" data-acc="'+acc.join(',')+'" data-songfen="'+songfen+'"><div class="chips">'+chips+'</div>'+
  '<div class="stem"><span class="n">'+q.q_num+'.</span>'+esc(q.stem)+'</div>'+img+
  '<div class="hint">👆 點選 A／B／C／D 作答</div>'+opts+
  '<div class="result"></div>'+
  '<button class="btn tg">看答案＋詳解 ▾</button><div class="ans"><div class="ansline">'+ansText(q)+'</div>'+det+'</div></div>';
}
function lecBox(t){const l=LEC[t];if(!l)return '';return '<div class="lec"><h3 class="title">📘 '+esc(disp(t))+' 複習講義 ▾</h3><div class="body" style="display:none">'+l.html+'</div></div>';}
const TOTAL=Q.length, KEY='n2_a3_v1';
let PROG={}, wrongOnly=false;
try{PROG=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){PROG={}}
function saveProg(){try{localStorage.setItem(KEY,JSON.stringify(PROG))}catch(e){}}
function updateStats(){
 const ks=Object.keys(PROG),ans=ks.length,cor=ks.filter(k=>PROG[k].r==='c').length,rate=ans?Math.round(cor/ans*100):0;
 stats.innerHTML = ans
   ? '已作答 <b>'+ans+'</b> / '+TOTAL+' 題 ・ 答對 <b>'+cor+'</b> ・ 答錯 <b>'+(ans-cor)+'</b> ・ 答對率 <b>'+rate+'%</b><div class="bar"><i style="width:'+rate+'%"></i></div>'
   : '👋 點選每題的 A／B／C／D 即可作答，分數與錯題會自動保存（下次打開仍在）';
}
function updateWrongBtn(){const n=Object.keys(PROG).filter(k=>PROG[k].r==='w').length; wrongBtn.textContent='錯題本'+(n?'（'+n+'）':'');}
function fill(qEl,k,correct,songfen,acc){
 qEl.dataset.answered='1'; qEl.classList.add('done');
 qEl.querySelectorAll('.opt').forEach(o=>{const ok=o.dataset.k;
   if(songfen||acc.indexOf(ok)>=0)o.classList.add('right');
   if(ok===k){o.classList.add('pick');if(!correct)o.classList.add('wrong');}});
 const r=qEl.querySelector('.result'); r.className='result '+(correct?'ok':'bad');
 r.textContent=correct?'✓ 正確！':'✗ 錯誤（正確答案：'+acc.join('、')+(songfen?'，本題送分':'')+'）';
}
function applyStored(qEl){const p=PROG[qEl.dataset.id]; if(!p)return; fill(qEl,p.k,p.r==='c',qEl.dataset.songfen==='1',qEl.dataset.acc.split(','));}
function render(){
 const fy=fYear.value,ft=fTopic.value,kw=fKw.value.trim();
 let qs=Q.filter(q=>(!fy||q.roc_year==fy)&&(!ft||q.topic===ft)&&(!kw||q.stem.indexOf(kw)>=0||Object.values(q.options).some(o=>o.indexOf(kw)>=0)));
 if(wrongOnly)qs=qs.filter(q=>PROG[q.id]&&PROG[q.id].r==='w');
 cnt.textContent=(wrongOnly?'錯題複習 · ':'')+'共 '+qs.length+' 題';let h='';
 if(!qs.length&&wrongOnly){h='<div class="grp">目前沒有錯題 🎉（答錯的題目會自動收集到這裡）</div>';}
 else if(view==='topic'){TO.forEach(t=>{const tq=qs.filter(q=>q.topic===t);if(!tq.length)return;h+='<div class="grp">'+disp(t)+'（'+tq.length+'題）</div>'+(wrongOnly?'':lecBox(t))+tq.map(qCard).join('');});}
 else{const ys=[...new Set(qs.map(q=>q.roc_year))].sort((a,b)=>a-b);
  ys.forEach(y=>{h+='<div class="grp">民國'+y+'年（'+qs.filter(q=>q.roc_year===y).length+'題）</div>'+qs.filter(q=>q.roc_year===y).map(qCard).join('');});}
 ce.innerHTML=h||'<div class="cnt">（無符合條件的題目）</div>';
 ce.querySelectorAll('.q').forEach(applyStored);
 ce.querySelectorAll('.ans').forEach(a=>a.classList.toggle('show',expand));
}
function answer(opt){
 const qEl=opt.closest('.q'); if(!qEl||qEl.dataset.answered) return;
 const acc=qEl.dataset.acc.split(','), songfen=qEl.dataset.songfen==='1', k=opt.dataset.k;
 const correct=songfen||acc.indexOf(k)>=0;
 fill(qEl,k,correct,songfen,acc);
 PROG[qEl.dataset.id]={r:correct?'c':'w',k:k}; saveProg(); updateStats(); updateWrongBtn();
}
ce.addEventListener('click',e=>{
 const tt=e.target.closest('.lec .title'); if(tt){const b=tt.nextElementSibling;const o=b.style.display==='none';b.style.display=o?'block':'none';tt.textContent=tt.textContent.replace(o?'▾':'▴',o?'▴':'▾');return;}
 const opt=e.target.closest('.opt'); if(opt&&ce.contains(opt)){answer(opt);return;}
 if(e.target.classList.contains('tg')){const a=e.target.nextElementSibling;a.classList.toggle('show');e.target.textContent=a.classList.contains('show')?'收合詳解 ▴':'看答案＋詳解 ▾';}});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');view=t.dataset.v;render();});
[fYear,fTopic].forEach(s=>s.onchange=render);fKw.oninput=render;
$('#expand').onclick=function(){expand=!expand;this.textContent=expand?'全部收合答案':'全部展開答案';this.classList.toggle('on',expand);render();};
wrongBtn.onclick=function(){wrongOnly=!wrongOnly;this.classList.toggle('on',wrongOnly);render();};
resetBtn.onclick=function(){if(confirm('確定要清除所有作答紀錄、分數與錯題本嗎？此動作無法復原。')){PROG={};saveProg();wrongOnly=false;wrongBtn.classList.remove('on');updateStats();updateWrongBtn();render();}};
updateStats();updateWrongBtn();render();
(function(){function ph(){try{parent.postMessage({cvqHeight:document.documentElement.scrollHeight},'*');}catch(e){}}window.addEventListener('load',ph);document.addEventListener('click',()=>setTimeout(ph,80));setInterval(ph,1500);})();
</script></body></html>
